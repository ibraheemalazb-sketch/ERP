# scrFinPayroll - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinPayroll, set its properties from 04-screens-batch-b.md,
# then paste screens/paste/scrFinPayroll.controls.pa.yaml onto it.
Screens:
  scrFinPayroll:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 51);
        If(
            varFinReady && !canAccessPayroll,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locMoreOpen: false, locNotifOpen: false, locNew: false});
            fnRefreshHeaderData();
            If(varFinReady, UpdateContext({locBooted: true}); Select(btnPyrQuery))
        )
      LoadingSpinner: =LoadingSpinner.None
      OnHidden: =Clear(colPyrRuns)
    Children:
      - cmpNav_Pyr:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_Pyr:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Navigate(scrFinance, ScreenTransition.None)
            ScreenTitle: =fnT("nav.payroll", "Payroll")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_Pyr:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conPyrRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conPyrMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - conPyrBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - conPyrKPI:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp2
                              LayoutWrap: =true
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!locError
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =RoundUp(4 / kpiColumns, 0) * 128 + (RoundUp(4 / kpiColumns, 0) - 1) * sp2
                            Children:
                              - cmpKPI_PyrNet:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("pyr.latestNet", "Latest net pay")
                                    KPIValue: =First(colPyrRuns).TotalNet
                                    ValueFormat: ="money"
                                    Currency: =First(colPyrRuns).Currency
                                    Tone: =""
                                    Subtext: =fnPeriodLabel(First(colPyrRuns).PeriodKey) & " | " & Coalesce(First(colPyrRuns).RunNumber, "")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_PyrGross:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("pyr.latestGross", "Latest gross")
                                    KPIValue: =First(colPyrRuns).TotalGross
                                    ValueFormat: ="money"
                                    Currency: =First(colPyrRuns).Currency
                                    Tone: =""
                                    Subtext: =fnT("pyr.storedTotals", "Stored totals (flow 4)")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_PyrEmp:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("pyr.employees", "Employees")
                                    KPIValue: =First(colPyrRuns).EmployeeCount
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =fnPeriodLabel(First(colPyrRuns).PeriodKey)
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_PyrPending:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("pyr.pending", "Runs waiting for approval")
                                    KPIValue: =CountRows(Filter(colPyrRuns, Status = cfgRunStatus.PendingHR || Status = cfgRunStatus.PendingFinance))
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =If(CountRows(Filter(colPyrRuns, Status = cfgRunStatus.PendingHR || Status = cfgRunStatus.PendingFinance)) > 0, "warning", "")
                                    Subtext: =fnT("pyr.inList", "in this list")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conPyrCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =If(isMobile, 3 * touchMin + 2 * sp1, touchMin) + sp1 + If(locError, 240, If(isMobile, Max(1, Min(CountRows(colPyrRuns), 8)) * 104 + 60, 40 + Max(1, Min(CountRows(colPyrRuns), 12)) * 52 + 60)) + sp1 + 36 + 2 * sp2
                            Children:
                              - conPyrFilters:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =sp1
                                    LayoutWrap: =true
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 3 * touchMin + 2 * sp1, touchMin)
                                  Children:
                                    - drpPyrYear:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          HoverFill: =FinTheme.RowHover
                                          HoverBorderColor: =FinTheme.Primary
                                          HoverColor: =FinTheme.Text
                                          PressedFill: =FinTheme.RowSelected
                                          PressedColor: =FinTheme.Text
                                          SelectionFill: =FinTheme.Primary
                                          SelectionColor: =FinTheme.OnPrimary
                                          ChevronBackground: =FinTheme.Surface
                                          ChevronFill: =FinTheme.TextSecondary
                                          PaddingLeft: =8
                                          Height: =touchMin
                                          TabIndex: =0
                                          AllowEmptySelection: =false
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Items: |-
                                            =Table({Key: 0, Value: fnT("pyr.allYears", "All years")}, ForAll(Sequence(4, 0), {Key: Year(Today()) - Value, Value: Text(Year(Today()) - Value)}))
                                          Default: =Text(Year(Today()))
                                          Width: =If(isMobile, Parent.Width, 150)
                                          FillPortions: =0
                                          AccessibleLabel: =fnT("pyr.year", "Payroll year")
                                          OnChange: =Select(btnPyrQuery)
                                    - drpPyrStatus:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          HoverFill: =FinTheme.RowHover
                                          HoverBorderColor: =FinTheme.Primary
                                          HoverColor: =FinTheme.Text
                                          PressedFill: =FinTheme.RowSelected
                                          PressedColor: =FinTheme.Text
                                          SelectionFill: =FinTheme.Primary
                                          SelectionColor: =FinTheme.OnPrimary
                                          ChevronBackground: =FinTheme.Surface
                                          ChevronFill: =FinTheme.TextSecondary
                                          PaddingLeft: =8
                                          Height: =touchMin
                                          TabIndex: =0
                                          AllowEmptySelection: =false
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Items: |-
                                            =Table({Key: "", Value: fnT("flt.allStatuses", "All statuses")}, {Key: cfgRunStatus.Draft, Value: fnT("run.Draft", cfgRunStatus.Draft)}, {Key: cfgRunStatus.PendingHR, Value: fnT("run.PendingHR", cfgRunStatus.PendingHR)}, {Key: cfgRunStatus.PendingFinance, Value: fnT("run.PendingFinance", cfgRunStatus.PendingFinance)}, {Key: cfgRunStatus.Approved, Value: fnT("run.Approved", cfgRunStatus.Approved)}, {Key: cfgRunStatus.Paid, Value: fnT("run.Paid", cfgRunStatus.Paid)}, {Key: cfgRunStatus.Posted, Value: fnT("run.Posted", cfgRunStatus.Posted)})
                                          Width: =If(isMobile, Parent.Width, 190)
                                          FillPortions: =0
                                          AccessibleLabel: =fnT("col.status", "Status")
                                          OnChange: =Select(btnPyrQuery)
                                    - conPyrSpacer:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =0
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =1
                                          Height: =1
                                          Visible: =!isMobile
                                        Children: []
                                    - btnPyrNew:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          Text: =fnT("pyr.new", "New payroll run")
                                          Font: =fontBase
                                          Size: =fsBody
                                          FontWeight: =FontWeight.Semibold
                                          Height: =touchMin
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          TabIndex: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          DisabledFill: =FinTheme.Border
                                          DisabledColor: =FinTheme.TextSecondary
                                          DisabledBorderColor: =FinTheme.Border
                                          Fill: =FinTheme.Primary
                                          Color: =FinTheme.OnPrimary
                                          BorderColor: =FinTheme.Primary
                                          HoverFill: =ColorFade(FinTheme.Primary, -0.12)
                                          HoverColor: =FinTheme.OnPrimary
                                          HoverBorderColor: =FinTheme.Primary
                                          PressedFill: =ColorFade(FinTheme.Primary, -0.24)
                                          PressedColor: =FinTheme.OnPrimary
                                          PressedBorderColor: =FinTheme.Primary
                                          Visible: =canEditRunLines
                                          Width: =If(isMobile, Parent.Width, 190)
                                          FillPortions: =0
                                          OnSelect: |-
                                            =Reset(drpPyrNewPeriod); Reset(drpPyrNewCur); UpdateContext({locNew: true})
                              - cmpEmpty_PyrErr:
                                  Control: CanvasComponent
                                  ComponentName: cmpEmptyState
                                  Properties:
                                    Visible: =locError
                                    Variant: ="error"
                                    Message: =fnT("common.loadError", "The data could not be loaded.")
                                    Height: =240
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    ActionText: =fnT("common.retry", "Retry")
                                    OnAction: =Select(btnPyrQuery)
                              - cmpDataTable_Pyr:
                                  Control: CanvasComponent
                                  ComponentName: cmpDataTable
                                  Properties:
                                    Visible: =!locError
                                    RowItems: |-
                                      =ForAll(colPyrRuns As r, {RowID: r.ID, Primary: fnPeriodLabel(r.PeriodKey), Secondary: Coalesce(r.RunNumber, r.Title) & " | " & r.Currency, C1: fnCount(r.EmployeeCount), C2: fnMoney(r.TotalGross, r.Currency), C3: fnMoney(r.TotalDeductions, r.Currency), C4: If(r.PostedToLedger, "✓ " & fnT("pyr.posted", "Posted to ledger"), "○ " & fnT("pyr.notPosted", "Not posted")), Util: Blank(), Amount: r.TotalNet, Currency: r.Currency, AmountUSD: Blank(), Status: r.Status, StatusDomain: "PayrollRun"})
                                    ColumnConfig: |-
                                      =Table(
                                          {Key: "Primary", Header: fnT("col.period", "Month / run"), Portion: 1.8, ShowOnTablet: true, Sortable: false},
                                          {Key: "C1", Header: fnT("col.employees", "Employees"), Portion: 0.9, ShowOnTablet: false, Sortable: false},
                                          {Key: "C2", Header: fnT("col.gross", "Gross"), Portion: 1.4, ShowOnTablet: false, Sortable: false},
                                          {Key: "C3", Header: fnT("col.deductions", "Deductions"), Portion: 1.3, ShowOnTablet: false, Sortable: false},
                                          {Key: "Amount", Header: fnT("col.net", "Net"), Portion: 1.4, ShowOnTablet: true, Sortable: false},
                                          {Key: "Status", Header: fnT("col.status", "Status"), Portion: 1.3, ShowOnTablet: true, Sortable: false},
                                          {Key: "C4", Header: fnT("col.ledger", "Ledger"), Portion: 1.3, ShowOnTablet: true, Sortable: false}
                                      )
                                    PageNumber: =1
                                    HasMore: =false
                                    Loading: =locLoading || !varFinReady
                                    EmptyText: =If(drpPyrStatus.Selected.Key <> "", fnT("pyr.emptyFilter", "No payroll runs with this status."), fnT("pyr.empty", "No payroll runs for this year yet."))
                                    Height: =If(isMobile, Max(1, Min(CountRows(colPyrRuns), 8)) * 104 + 60, 40 + Max(1, Min(CountRows(colPyrRuns), 12)) * 52 + 60)
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnRowSelect: =Set(varRunID, cmpDataTable_Pyr.SelectedRow.RowID); Navigate(scrFinPayrollRun, ScreenTransition.None)
                              - lblPyrNote:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =fnT("pyr.note", "Totals are stored on each run by flow 4. Salaries are only shown inside a run, masked until you reveal them (every reveal is logged).")
                                    Font: =fontBase
                                    Size: =fsCaption
                                    Color: =FinTheme.TextSecondary
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =true
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
      - conPyrPanelOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =RGBA(0, 0, 0, 0)
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Visible: =locNew
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - rectPyrScrim:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0.45)
                  BorderThickness: =0
                  TabIndex: =-1
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  OnSelect: |-
                    =UpdateContext({locNew: false})
            - conPyrPanel:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.ExtraBold
                  BorderThickness: =0
                  Fill: =FinTheme.Surface
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  X: =If(isMobile || isRTL, 0, Parent.Width - Self.Width)
                  Y: =0
                  Width: =If(isMobile, Parent.Width, Min(460, Parent.Width))
                  Height: =Parent.Height
                Children:
                  - conPyrPanelHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =sp1
                        LayoutWrap: =false
                        PaddingTop: =0
                        PaddingRight: =sp1
                        PaddingBottom: =0
                        PaddingLeft: =sp2
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =56
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =FinTheme.Border
                      Children:
                        - lblPyrPanelTitle:
                            Control: Label@2.5.1
                            Properties:
                              Text: =fnT("pyr.new", "New payroll run")
                              Font: =fontBase
                              Size: =fsSection
                              Color: =FinTheme.Text
                              Fill: =RGBA(0, 0, 0, 0)
