            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =If(
                  !canAccessPayroll,
                  Clear(colPyrRuns); Navigate(scrFinNoAccess, ScreenTransition.None),
                  UpdateContext({locLoading: true, locError: false, locQ: {Year: Coalesce(drpPyrYear.Selected.Key, 0), Status: drpPyrStatus.Selected.Key}});
                  IfError(
                      ClearCollect(
                          colPyrRuns,
                          ForAll(
                              FirstN(
                                  Sort(
                                      Filter(
                                          PayrollRuns,
                                          // PeriodKey and Status are Indexed (PayrollYear is not)
                                          locQ.Year = 0 || (PeriodKey >= locQ.Year * 100 + 1 && PeriodKey <= locQ.Year * 100 + 12),
                                          IsBlank(locQ.Status) || Status.Value = locQ.Status
                                      ),
                                      PeriodKey,
                                      SortOrder.Descending
                                  ),
                                  cfgPageSize
                              ) As r,
                              {
                                  ID: r.ID, RunNumber: r.RunNumber, Title: r.Title, PayrollMonth: r.PayrollMonth, PayrollYear: r.PayrollYear,
                                  PeriodKey: r.PeriodKey, Currency: r.Currency.Value, TotalGross: r.TotalGross, TotalDeductions: r.TotalDeductions,
                                  TotalNet: r.TotalNet, EmployeeCount: r.EmployeeCount, Status: r.Status.Value, ApprovalStarted: r.ApprovalStarted,
                                  PostedToLedger: r.PostedToLedger, PreparedByID: r.PreparedByID, ApprovedDate: r.ApprovedDate
                              }
                          )
                      ),
                      UpdateContext({locError: true});
                      Trace("Payroll runs query failed: " & FirstError.Message, TraceSeverity.Error)
                  );
                  UpdateContext({locLoading: false})
              )
