Screens:
  scrGRNEditor:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "GRNs");
        Set(varNavSelectedID, 34);
        Set(varProcurementEntity, "GRN");
        If(
            And(varProcurementMode = "New", IsBlank(varSelectedPO), Not(IsBlank(varSourcePO))),
            Set(varSelectedPO, varSourcePO)
        );
        If(
            varProcurementMode = "New",
            Set(varCurrentGRN, Blank());
            Set(varNewGRN, Blank());
            If(
                IsBlank(varSelectedPO),
                Clear(colGRNLines),
                ClearCollect(
                    colGRNLines,
                    ForAll(
                        Filter(PurchaseOrderLines, POID = varSelectedPO.ID) As L,
                        With(
                            {
                                prev: Coalesce(
                                    Sum(
                                        Filter(
                                            GoodsReceivedNoteLines,
                                            And(
                                                POLineID = L.ID,
                                                GRNID <> Coalesce(varCurrentGRN.ID, 0),
                                                LookUp(GoodsReceivedNotes, ID = GRNID, Status.Value) <> "Cancelled"
                                            )
                                        ),
                                        ReceivedQuantity
                                    ),
                                    0
                                )
                            },
                            {
                                POLineID: L.ID,
                                LineNumber: L.LineNumber,
                                ItemDescription: L.Description,
                                Unit: L.Unit,
                                OrderedQuantity: L.Quantity,
                                PreviouslyReceivedQuantity: prev,
                                RemainingQuantity: L.Quantity - prev,
                                ReceivedQuantity: L.Quantity - prev,
                                RejectedQuantity: 0,
                                AcceptedQuantity: L.Quantity - prev,
                                RejectionReason: "",
                                UnitPrice: L.UnitPrice,
                                Condition: "Good"
                            }
                        )
                    )
                );
                RemoveIf(colGRNLines, RemainingQuantity <= 0);
                If(
                    CountRows(colGRNLines) = 0,
                    Notify(
                        If(gblLanguage = "Arabic", "تم استلام هذا الأمر بالكامل.", "This purchase order has already been fully received."),
                        NotificationType.Warning
                    )
                )
            );
            Reset(cmbPOSelectGRN);
            Reset(cmbWarehouseGRN);
            Reset(dteReceiptGRN);
            Reset(cmbReceivedByGRN);
            Reset(txtDeliveryNoteGRN);
            Reset(cmbInspectionGRN);
            Reset(txtRemarksGRN),
            If(
                Not(IsBlank(varCurrentGRN)),
                Set(varSelectedPO, LookUp(PurchaseOrders, ID = varCurrentGRN.POID));
                ClearCollect(
                    colGRNLines,
                    ForAll(
                        Filter(GoodsReceivedNoteLines, GRNID = varCurrentGRN.ID) As G,
                        With(
                            {
                                p: LookUp(PurchaseOrderLines, ID = G.POLineID),
                                prev: Coalesce(
                                    Sum(
                                        Filter(
                                            GoodsReceivedNoteLines,
                                            And(
                                                POLineID = G.POLineID,
                                                GRNID <> varCurrentGRN.ID,
                                                LookUp(GoodsReceivedNotes, ID = GRNID, Status.Value) <> "Cancelled"
                                            )
                                        ),
                                        ReceivedQuantity
                                    ),
                                    0
                                )
                            },
                            {
                                POLineID: G.POLineID,
                                LineNumber: G.LineNumber,
                                ItemDescription: p.Description,
                                Unit: p.Unit,
                                OrderedQuantity: p.Quantity,
                                PreviouslyReceivedQuantity: prev,
                                RemainingQuantity: p.Quantity - prev,
                                ReceivedQuantity: Min(G.ReceivedQuantity, p.Quantity - prev),
                                RejectedQuantity: Min(G.RejectedQuantity, G.ReceivedQuantity),
                                AcceptedQuantity: Min(G.ReceivedQuantity, p.Quantity - prev) - Min(G.RejectedQuantity, G.ReceivedQuantity),
                                RejectionReason: G.RejectionReason,
                                UnitPrice: p.UnitPrice,
                                Condition: Coalesce(G.Condition, "Good")
                            }
                        )
                    )
                );
                Reset(cmbPOSelectGRN);
                Reset(cmbWarehouseGRN);
                Reset(dteReceiptGRN);
                Reset(cmbReceivedByGRN);
                Reset(txtDeliveryNoteGRN);
                Reset(cmbInspectionGRN);
                Reset(txtRemarksGRN),
                Notify(
                    If(gblLanguage = "Arabic", "لم يتم اختيار سند استلام. ارجع واختر سنداً.", "No goods receipt selected. Please go back and choose one."),
                    NotificationType.Error
                )
            )
        );
        Set(
            varGrnCanEdit,
            Or(
                varProcurementMode = "New",
                And(Not(IsBlank(varCurrentGRN)), varCurrentGRN.Status.Value = "Draft")
            )
        )
    Children:
      - conEdGrnNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpEdGrnNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpEdGrnTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =0
            HasNotifications: =false
            Height: =56
            ModuleIcon: ="ShoppingCart"
            ModuleName: =If(gblLanguage = "Arabic", "المشتريات", "Procurement")
            OnSelectTitle: |-
              =Set(varProcurementMode, "View");
              If(
                  And(IsBlank(varCurrentGRN), Not(IsBlank(varSourcePO))),
                  Set(varCurrentPO, varSourcePO);
                  Set(varProcurementEntity, "PurchaseOrder");
                  Set(varProcurementTab, "POs");
                  Set(varNavSelectedID, 33);
                  Navigate(scrPOs, ScreenTransition.UnCover),
                  Set(varProcurementEntity, "GRN");
                  Set(varProcurementTab, "GRNs");
                  Set(varNavSelectedID, 34);
                  Navigate(ScrGRN, ScreenTransition.UnCover)
              )
            ScreenSubtitle: |-
              =If(
                  varProcurementMode = "New",
                  If(gblLanguage = "Arabic", "سند جديد", "New receipt"),
                  Coalesce(varCurrentGRN.GRNNumber, If(gblLanguage = "Arabic", "تعديل", "Edit"))
              )
            ScreenTitle: =If(gblLanguage = "Arabic", "محرر الاستلام", "Goods receipt editor")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpEdGrnPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conEdGrnPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpEdGrnPhone.Height + 16, 24)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 16)
            PaddingRight: =16
            PaddingTop: =cmpEdGrnTop.Height + 12
            Width: =Parent.Width
          Children:
            - conEdGrnHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 148, 64)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =64
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Parent.Width
                Children:
                  - btnEdGrnBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Transparent
                        BasePaletteColor: =fxThemeColor("Primary")
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="ArrowLeft"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =Set(varProcurementMode, "View");
                          If(
                              And(IsBlank(varCurrentGRN), Not(IsBlank(varSourcePO))),
                              Set(varCurrentPO, varSourcePO);
                              Set(varProcurementEntity, "PurchaseOrder");
                              Set(varProcurementTab, "POs");
                              Set(varNavSelectedID, 33);
                              Navigate(scrPOs, ScreenTransition.UnCover),
                              Set(varProcurementEntity, "GRN");
                              Set(varProcurementTab, "GRNs");
                              Set(varNavSelectedID, 34);
                              Navigate(ScrGRN, ScreenTransition.UnCover)
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "الاستلام", "Receipts"))
                        Width: =If(App.Width < 700, 44, 110)
                  - lblEdGrnTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinWidth: =140
                        PaddingBottom: =0
                        PaddingTop: =6
                        Size: =15
                        Text: |-
                          =If(
                              IsBlank(varCurrentGRN),
                              If(gblLanguage = "Arabic", "سند استلام جديد", "New goods receipt"),
                              varCurrentGRN.GRNNumber
                          )
                        Width: =220
                        Wrap: =false
                  - conEdGrnStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =Switch(
                              If(varProcurementMode = "New", "Draft", Coalesce(varCurrentGRN.Status.Value, "Draft")),
                              "Draft", fxThemeColor("PrimaryLight"),
                              "Accepted", RGBA(220, 245, 225, 1),
                              "PartiallyAccepted", RGBA(255, 243, 205, 1),
                              "Rejected", RGBA(255, 225, 225, 1),
                              "Cancelled", RGBA(235, 235, 235, 1),
                              fxThemeColor("SurfaceHover")
                          )
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =If(App.Width < 700, 110, 150)
                      Children:
                        - lblEdGrnStatus:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingBottom: =0
                              PaddingTop: =4
                              Size: =12
                              Text: =If(varProcurementMode = "New", "Draft", Coalesce(varCurrentGRN.Status.Value, "Draft"))
                              Width: =Parent.Width
                              Wrap: =false
                  - lblEdGrnGap:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Height: =8
                        LayoutMinWidth: =8
                        Text: =""
                        Visible: =App.Width >= 700
                  - btnEdGrnSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Save"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              IsBlank(cmbPOSelectGRN.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار أمر الشراء.", "Please select a purchase order."), NotificationType.Error),
                              IsBlank(cmbWarehouseGRN.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار المستودع.", "Please select a warehouse."), NotificationType.Error),
                              IsBlank(dteReceiptGRN.SelectedDate),
                              Notify(If(gblLanguage = "Arabic", "الرجاء تحديد تاريخ الاستلام.", "Please select the receipt date."), NotificationType.Error),
                              IsBlank(cmbReceivedByGRN.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء تحديد المستلم.", "Please select who received the goods."), NotificationType.Error),
                              CountRows(Filter(colGRNLines, ReceivedQuantity > 0)) = 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إدخال كمية مستلمة لبند واحد على الأقل.", "Please receive a quantity on at least one line."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colGRNLines As L,
                                      And(
                                          L.ReceivedQuantity > 0,
                                          Or(
                                              L.ReceivedQuantity > L.RemainingQuantity,
                                              L.ReceivedQuantity > L.OrderedQuantity,
                                              L.ReceivedQuantity > Coalesce(LookUp(PurchaseOrderLines, ID = L.POLineID, Quantity), 0) - L.PreviouslyReceivedQuantity
                                          )
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "الكمية المستلمة لا تتجاوز الكمية المتبقية في أمر الشراء.", "Received quantity cannot exceed the quantity still open on the purchase order."), NotificationType.Error),
                              CountRows(Filter(colGRNLines, RejectedQuantity > ReceivedQuantity)) > 0,
                              Notify(If(gblLanguage = "Arabic", "الكمية المرفوضة لا تتجاوز الكمية المستلمة.", "Rejected quantity cannot exceed the received quantity."), NotificationType.Error),
                              CountRows(Filter(colGRNLines, And(RejectedQuantity > 0, IsBlank(Trim(RejectionReason))))) > 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إدخال سبب الرفض للبنود المرفوضة.", "Please enter a rejection reason for rejected lines."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colGRNLines As L,
                                      And(
                                          L.ReceivedQuantity > 0,
                                          Or(
                                              IsBlank(LookUp(PurchaseOrderLines, ID = L.POLineID, Description)),
                                              IsBlank(LookUp(PurchaseOrderLines, ID = L.POLineID, Unit))
                                          )
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "بند أمر الشراء ينقصه الوصف أو الوحدة.", "A purchase order line is missing a description or unit."), NotificationType.Error),
                              Set(varProcLogNew, varProcurementMode = "New");
                              Set(varProcAttachNames, "");
                              Set(
                                  varNewGRN,
                                  Patch(
                                      GoodsReceivedNotes,
                                      If(varProcurementMode = "New", Defaults(GoodsReceivedNotes), varCurrentGRN),
                                      {
                                          Title: If(varProcurementMode = "New", "TEMP-GRN-" & Text(Now(), "yyyymmddhhmmss"), varCurrentGRN.GRNNumber),
                                          GRNNumber: If(varProcurementMode = "New", "TEMP-GRN-" & Text(Now(), "yyyymmddhhmmss"), varCurrentGRN.GRNNumber),
                                          GRNDate: If(varProcurementMode = "New", Today(), varCurrentGRN.GRNDate),
                                          PO: {Id: cmbPOSelectGRN.Selected.ID, Value: cmbPOSelectGRN.Selected.PONumber},
                                          POID: cmbPOSelectGRN.Selected.ID,
                                          PONumber: cmbPOSelectGRN.Selected.PONumber,
                                          Supplier: If(
                                              IsBlank(cmbPOSelectGRN.Selected.VendorID),
                                              Blank(),
                                              {Id: cmbPOSelectGRN.Selected.VendorID, Value: cmbPOSelectGRN.Selected.Vendors.Value}
                                          ),
                                          SupplierID: cmbPOSelectGRN.Selected.VendorID,
                                          Project: {Id: cmbPOSelectGRN.Selected.ProjectID, Value: cmbPOSelectGRN.Selected.Project.Value},
                                          ProjectID: cmbPOSelectGRN.Selected.ProjectID,
                                          Warehouse: {Id: cmbWarehouseGRN.Selected.ID, Value: cmbWarehouseGRN.Selected.Title},
                                          WarehouseID: cmbWarehouseGRN.Selected.ID,
                                          ReceiptDate: dteReceiptGRN.SelectedDate,
                                          ReceivedBy: {Id: cmbReceivedByGRN.Selected.ID, Value: cmbReceivedByGRN.Selected.FullName},
                                          ReceivedByID: cmbReceivedByGRN.Selected.ID,
                                          DeliveryNoteNumber: txtDeliveryNoteGRN.Text,
                                          InspectionStatus: cmbInspectionGRN.Selected,
                                          Remarks: txtRemarksGRN.Text,
                                          Status: {Value: "Draft"},
                                          TotalOrdered: Sum(Filter(colGRNLines, ReceivedQuantity > 0), OrderedQuantity * UnitPrice),
                                          TotalReceived: Sum(Filter(colGRNLines, ReceivedQuantity > 0), ReceivedQuantity * UnitPrice),
                                          TotalRejected: Sum(Filter(colGRNLines, ReceivedQuantity > 0), RejectedQuantity * UnitPrice),
                                          ReceivedQty: Sum(Filter(colGRNLines, ReceivedQuantity > 0), ReceivedQuantity)
                                      }
                                  )
                              );
                              If(
                                  varProcurementMode = "New",
                                  Set(
                                      varNewGRN,
                                      Patch(
                                          GoodsReceivedNotes,
                                          varNewGRN,
                                          {
                                              Title: LookUp(colProjects, ID = varNewGRN.ProjectID, ProjectCode) & "-GRN-" & Text(Year(Today()), "0000") & "-" & Text(varNewGRN.ID, "0"),
                                              GRNNumber: LookUp(colProjects, ID = varNewGRN.ProjectID, ProjectCode) & "-GRN-" & Text(Year(Today()), "0000") & "-" & Text(varNewGRN.ID, "0")
                                          }
                                      )
                                  )
                              );
                              If(
                                  CountRows(attEdGrn.Attachments) > 0,
                                  IfError(
                                      Patch(GoodsReceivedNotes, varNewGRN, {Attachments: attEdGrn.Attachments});
                                      Set(varProcAttachNames, Concat(attEdGrn.Attachments, Name, ", ")),
                                      Notify(If(gblLanguage = "Arabic", "تم حفظ المسودة، وتعذر إرفاق الملفات.", "The draft was saved, but the files could not be attached."), NotificationType.Warning);
                                      Set(varProcAttachNames, "")
                                  )
                              );
                              RemoveIf(GoodsReceivedNoteLines, GRNID = varNewGRN.ID);
                              ForAll(
                                  Filter(colGRNLines, ReceivedQuantity > 0) As Line,
                                  With(
                                      {src: LookUp(PurchaseOrderLines, ID = Line.POLineID)},
                                      Patch(
                                          GoodsReceivedNoteLines,
                                          Defaults(GoodsReceivedNoteLines),
                                          {
                                              Title: varNewGRN.GRNNumber & "-" & Text(src.LineNumber),
                                              GRN: {Id: varNewGRN.ID, Value: varNewGRN.GRNNumber},
                                              GRNID: varNewGRN.ID,
                                              POLine: {Id: src.ID, Value: Coalesce(src.Title, varNewGRN.PONumber & "-" & Text(src.LineNumber))},
                                              POLineID: src.ID,
                                              PONumber: varNewGRN.PONumber,
                                              LineNumber: src.LineNumber,
                                              ItemDescription: src.Description,
                                              Unit: src.Unit,
                                              OrderedQuantity: src.Quantity,
                                              PreviouslyReceivedQuantity: Line.PreviouslyReceivedQuantity,
                                              RemainingQuantity: src.Quantity - Line.PreviouslyReceivedQuantity - Min(Line.ReceivedQuantity, Line.RemainingQuantity),
                                              ReceivedQuantity: Min(Line.ReceivedQuantity, Line.RemainingQuantity, src.Quantity),
                                              AcceptedQuantity: Min(Line.ReceivedQuantity, Line.RemainingQuantity, src.Quantity) - Min(Line.RejectedQuantity, Line.ReceivedQuantity),
                                              RejectedQuantity: Min(Line.RejectedQuantity, Line.ReceivedQuantity),
                                              RejectionReason: Line.RejectionReason,
                                              UnitPrice: src.UnitPrice,
                                              ReceivedValue: Min(Line.ReceivedQuantity, Line.RemainingQuantity, src.Quantity) * src.UnitPrice,
                                              Condition: If(IsBlank(Trim(Line.Condition)), "Good", Line.Condition)
                                          }
                                      )
                                  )
                              );
                              Set(varCurrentGRN, varNewGRN);
                              Set(varProcurementMode, "Edit");
                              Set(varGrnCanEdit, true);
                              Refresh(GoodsReceivedNotes);
                              Refresh(GoodsReceivedNoteLines);
                              Concurrent(
                                  fnWriteLog(
                                      "GRN",
                                      varNewGRN.ID,
                                      varNewGRN.GRNNumber,
                                      If(varProcLogNew, "Created", "Updated"),
                                      "Info",
                                      Coalesce(varNewGRN.ProjectID, 0),
                                      Coalesce(varNewGRN.Project.Value, LookUp(colProjects, ID = varNewGRN.ProjectID, ProjectCode), ""),
                                      Coalesce(varNewGRN.TotalReceived, 0),
                                      Coalesce(LookUp(PurchaseOrders, ID = varNewGRN.POID, Currency.Value), ""),
                                      "",
                                      "",
                                      "",
                                      "",
                                      "",
                                      0
                                  ),
                                  Notify(
                                      If(
                                          gblLanguage = "Arabic",
                                          "تم حفظ سند الاستلام " & varNewGRN.GRNNumber & " كمسودة.",
                                          "Goods receipt " & varNewGRN.GRNNumber & " has been saved as draft."
                                      ),
                                      NotificationType.Success
                                  )
                              );
                              If(
                                  Len(varProcAttachNames) > 0,
                                  fnWriteLog(
                                      "GRN",
                                      varNewGRN.ID,
                                      varNewGRN.GRNNumber,
                                      "Attached",
                                      "Info",
                                      Coalesce(varNewGRN.ProjectID, 0),
                                      Coalesce(varNewGRN.Project.Value, LookUp(colProjects, ID = varNewGRN.ProjectID, ProjectCode), ""),
                                      Blank(),
                                      "",
                                      "",
                                      "",
                                      "",
                                      varProcAttachNames,
                                      "",
                                      0
                                  )
                              )
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "حفظ كمسودة", "Save draft"))
                        Visible: =varGrnCanEdit
                        Width: =If(App.Width < 700, 44, 140)
                  - btnEdGrnConfirm:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Primary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Checkmark"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              Or(IsBlank(varCurrentGRN), varProcurementMode = "New"),
                              Notify(If(gblLanguage = "Arabic", "يرجى حفظ سند الاستلام كمسودة أولاً.", "Please save the goods receipt as a draft first."), NotificationType.Error),
                              varCurrentGRN.Status.Value <> "Draft",
                              Notify(If(gblLanguage = "Arabic", "يمكن تأكيد الاستلام فقط عندما تكون الحالة مسودة.", "Receipt can only be confirmed while the goods receipt is a draft."), NotificationType.Error),
                              If(
                                  Confirm(
                                      If(
                                          gblLanguage = "Arabic",
                                          "تأكيد الاستلام " & varCurrentGRN.GRNNumber & " لأمر الشراء " & varCurrentGRN.PONumber & "؟ سيتم تحديث كميات أمر الشراء.",
                                          "Confirm receipt " & varCurrentGRN.GRNNumber & " for purchase order " & varCurrentGRN.PONumber & "? The purchase order quantities will be updated."
                                      )
                                  ),
                                  ForAll(
                                      Filter(GoodsReceivedNoteLines, GRNID = varCurrentGRN.ID) As R,
                                      With(
                                          {pl: LookUp(PurchaseOrderLines, ID = R.POLineID)},
                                          Patch(
                                              PurchaseOrderLines,
                                              pl,
                                              {
                                                  ReceivedQuantity: Coalesce(pl.ReceivedQuantity, 0) + R.ReceivedQuantity,
                                                  RemainingQuantity: pl.Quantity - (Coalesce(pl.ReceivedQuantity, 0) + R.ReceivedQuantity),
                                                  LineStatus: {
                                                      Value: If(
                                                          Coalesce(pl.ReceivedQuantity, 0) + R.ReceivedQuantity >= pl.Quantity,
                                                          "Received",
                                                          "PartiallyReceived"
                                                      )
                                                  }
                                              }
                                          )
                                      )
                                  );
                                  With(
                                      {po: LookUp(PurchaseOrders, ID = varCurrentGRN.POID)},
                                      Patch(
                                          PurchaseOrders,
                                          po,
                                          {ReceivedQty: Coalesce(po.ReceivedQty, 0) + varCurrentGRN.ReceivedQty}
                                      )
                                  );
                                  Set(
                                      varCurrentGRN,
                                      Patch(
                                          GoodsReceivedNotes,
                                          varCurrentGRN,
                                          {
                                              Status: {
                                                  Value: If(
                                                      Sum(Filter(GoodsReceivedNoteLines, GRNID = varCurrentGRN.ID), RejectedQuantity) >= Sum(Filter(GoodsReceivedNoteLines, GRNID = varCurrentGRN.ID), ReceivedQuantity),
                                                      "Rejected",
                                                      If(
                                                          Sum(Filter(GoodsReceivedNoteLines, GRNID = varCurrentGRN.ID), RejectedQuantity) > 0,
                                                          "PartiallyAccepted",
                                                          "Accepted"
                                                      )
                                                  )
                                              }
                                          }
                                      )
                                  );
                                  Set(varGrnCanEdit, false);
                                  Refresh(PurchaseOrderLines);
                                  Refresh(PurchaseOrders);
                                  Refresh(GoodsReceivedNotes);
                                  Concurrent(
                                      fnWriteLog(
                                          "GRN",
                                          varCurrentGRN.ID,
                                          varCurrentGRN.GRNNumber,
                                          "Submitted",
                                          "Important",
                                          Coalesce(varCurrentGRN.ProjectID, 0),
                                          Coalesce(varCurrentGRN.Project.Value, ""),
                                          Coalesce(varCurrentGRN.TotalReceived, 0),
                                          Coalesce(LookUp(PurchaseOrders, ID = varCurrentGRN.POID, Currency.Value), ""),
                                          "Status",
                                          "Draft",
                                          Coalesce(varCurrentGRN.Status.Value, ""),
                                          "",
                                          "",
                                          0
                                      ),
                                      Notify(
                                          If(gblLanguage = "Arabic", "تم تأكيد الاستلام.", "Receipt confirmed."),
                                          NotificationType.Success
                                      )
                                  );
                                  IfError(
                                      With(
                                          {
                                              po: LookUp(PurchaseOrders, ID = varCurrentGRN.POID),
                                              pr: LookUp(PurchaseRequests, ID = LookUp(PurchaseOrders, ID = varCurrentGRN.POID).PRID),
                                              me: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                                              who: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")
                                          },
                                          ClearCollect(
                                              colProcNotice,
                                              Filter(
                                                  Table(
                                                      {UserID: Coalesce(po.PreparedByID, 0), UserName: Coalesce(po.PreparedBy.Value, "")},
                                                      {UserID: Coalesce(pr.RequesterID, 0), UserName: Coalesce(pr.Requester.Value, "")},
                                                      {UserID: Coalesce(pr.SupervisorID, 0), UserName: Coalesce(pr.Supervisor.Value, "")},
                                                      {UserID: Coalesce(pr.ApproverID, 0), UserName: Coalesce(pr.Approver.Value, "")},
                                                      {UserID: Coalesce(pr.FinancialApproverID, 0), UserName: Coalesce(pr.FinancialApprover.Value, "")},
                                                      {UserID: Coalesce(pr.ReceivedByID, 0), UserName: Coalesce(pr.ReceivedBy.Value, "")}
                                                  ),
                                                  And(UserID > 0, UserID <> me)
                                              )
                                          );
                                          ForAll(
                                              ForAll(Distinct(colProcNotice, UserID), LookUp(colProcNotice, UserID = Value)) As person,
                                              fnProcNotify(person.UserID, person.UserName, "Goods receipt " & Coalesce(varCurrentGRN.GRNNumber, ""), who & " confirmed " & Coalesce(varCurrentGRN.GRNNumber, "") & " for " & Coalesce(varCurrentGRN.PONumber, "") & ".", "GoodsReceipt", varCurrentGRN.ID, "GRN")
                                          )
                                      ),
                                      Notify(If(gblLanguage = "Arabic", "تم تأكيد الاستلام، وتعذر إرسال الإشعار.", "The receipt was confirmed, but the notice could not be sent."), NotificationType.Warning)
                                  );
                                  Set(varProcurementMode, "View");
                                  Navigate(ScrGRN, ScreenTransition.UnCover)
                              )
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تأكيد", "Confirm"))
                        Visible: =And(Not(IsBlank(varCurrentGRN)), varCurrentGRN.Status.Value = "Draft")
                        Width: =If(App.Width < 700, 44, 120)
