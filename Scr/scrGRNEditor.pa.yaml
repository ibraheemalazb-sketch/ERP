                                                Default: =Text(ThisItem.ReceivedQuantity)
                                                DisplayMode: =If(varGrnCanEdit, DisplayMode.Edit, DisplayMode.View)
                                                Height: =36
                                                OnChange: |-
                                                  =With(
                                                      {
                                                          typed: Coalesce(Value(Self.Text), 0),
                                                          cap: ThisItem.RemainingQuantity
                                                      },
                                                      If(
                                                          typed > cap,
                                                          Notify(
                                                              If(
                                                                  gblLanguage = "Arabic",
                                                                  "الكمية المستلمة لا تتجاوز المتبقي " & cap,
                                                                  "Received quantity cannot exceed the open purchase order quantity (" & cap & ")."
                                                              ),
                                                              NotificationType.Warning
                                                          )
                                                      );
                                                      UpdateIf(
                                                          colGRNLines,
                                                          POLineID = ThisItem.POLineID,
                                                          {
                                                              ReceivedQuantity: Min(Max(typed, 0), cap),
                                                              RejectedQuantity: Min(ThisItem.RejectedQuantity, Min(Max(typed, 0), cap)),
                                                              AcceptedQuantity: Min(Max(typed, 0), cap) - Min(ThisItem.RejectedQuantity, Min(Max(typed, 0), cap))
                                                          }
                                                      )
                                                  )
