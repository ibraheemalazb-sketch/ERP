                                  Properties:
                                    DefaultSelectedItems: |-
                                      =If(
                                          varProcurementMode = "New",
                                          If(Not(IsBlank(varSelectedPO)), [varSelectedPO], []),
                                          If(Not(IsBlank(varCurrentGRN)), [LookUp(PurchaseOrders, ID = varCurrentGRN.POID)], [])
                                      )
                                    DisplayMode: =If(And(varProcurementMode = "New", IsBlank(varSourcePO)), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "أمر الشراء", "Purchase order")
                                    ItemDisplayText: =ThisItem.PONumber
                                    Items: |-
                                      =Filter(
                                          PurchaseOrders,
                                          Or(
                                              POStatus.Value = "Issued",
                                              POStatus.Value = "InProgress",
                                              POStatus.Value = "Submitted",
                                              POStatus.Value = "Approved",
                                              ApprovalStatus.Value = "Approved",
                                              ID = varSelectedPO.ID,
                                              ID = varCurrentGRN.POID
                                          )
                                      )
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =If(
                                          And(varProcurementMode = "New", Not(IsBlank(Self.Selected))),
                                          Set(varSelectedPO, Self.Selected);
                                          ClearCollect(
                                              colGRNLines,
                                              ForAll(
                                                  Filter(PurchaseOrderLines, POID = varSelectedPO.ID) As L,
                                                  With(
                                                      {
                                                          prev: Coalesce(
                                                              Sum(
                                                                  Filter(
                                                                      GoodsReceivedNoteLines,
                                                                      And(
                                                                          POLineID = L.ID,
                                                                          GRNID <> Coalesce(varCurrentGRN.ID, 0),
                                                                          LookUp(GoodsReceivedNotes, ID = GRNID, Status.Value) <> "Cancelled"
                                                                      )
                                                                  ),
                                                                  ReceivedQuantity
                                                              ),
                                                              0
                                                          )
                                                      },
                                                      {
                                                          POLineID: L.ID,
                                                          LineNumber: L.LineNumber,
                                                          ItemDescription: L.Description,
                                                          Unit: L.Unit,
                                                          OrderedQuantity: L.Quantity,
                                                          PreviouslyReceivedQuantity: prev,
                                                          RemainingQuantity: L.Quantity - prev,
                                                          ReceivedQuantity: L.Quantity - prev,
                                                          RejectedQuantity: 0,
                                                          AcceptedQuantity: L.Quantity - prev,
                                                          RejectionReason: "",
                                                          UnitPrice: L.UnitPrice,
                                                          Condition: "Good"
                                                      }
                                                  )
                                              )
                                          );
                                          RemoveIf(colGRNLines, RemainingQuantity <= 0);
                                          If(
                                              CountRows(colGRNLines) = 0,
                                              Notify(
                                                  If(gblLanguage = "Arabic", "تم استلام هذا الأمر بالكامل.", "This purchase order has already been fully received."),
