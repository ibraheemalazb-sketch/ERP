                      Collect(colFund, ForAll(FirstN(Sort(Filter(DonorFunding, ProjectID = locP), ID, SortOrder.Descending), cfgFundMaxRows) As d, {ID: d.ID, ProjectID: d.ProjectID, ProjectCode: d.Project.Value, Donor: d.Donor, AgreementNumber: d.AgreementNumber, TrancheNo: d.TrancheNo, ExpectedDate: d.ExpectedDate, ReceivedDate: d.ReceivedDate, Currency: d.Currency.Value, Amount: d.Amount, AmountUSD: d.AmountUSD, ReferenceNo: d.ReferenceNo, Status: d.Status.Value, USD: Coalesce(d.AmountUSD, fnToUSD(d.Amount, d.Currency.Value)), DaysOverdue: fnFundDaysOverdue(d.Status.Value, d.ExpectedDate)})),
                      canViewAllProjects,
                      Collect(colFund, ForAll(FirstN(Sort(DonorFunding, ID, SortOrder.Descending), cfgFundMaxRows) As d, {ID: d.ID, ProjectID: d.ProjectID, ProjectCode: d.Project.Value, Donor: d.Donor, AgreementNumber: d.AgreementNumber, TrancheNo: d.TrancheNo, ExpectedDate: d.ExpectedDate, ReceivedDate: d.ReceivedDate, Currency: d.Currency.Value, Amount: d.Amount, AmountUSD: d.AmountUSD, ReferenceNo: d.ReferenceNo, Status: d.Status.Value, USD: Coalesce(d.AmountUSD, fnToUSD(d.Amount, d.Currency.Value)), DaysOverdue: fnFundDaysOverdue(d.Status.Value, d.ExpectedDate)})),
                      ForAll(colMyProjects As p, Collect(colFund, ForAll(FirstN(Sort(Filter(DonorFunding, ProjectID = p.ID), ID, SortOrder.Descending), cfgFundMaxRows) As d, {ID: d.ID, ProjectID: d.ProjectID, ProjectCode: d.Project.Value, Donor: d.Donor, AgreementNumber: d.AgreementNumber, TrancheNo: d.TrancheNo, ExpectedDate: d.ExpectedDate, ReceivedDate: d.ReceivedDate, Currency: d.Currency.Value, Amount: d.Amount, AmountUSD: d.AmountUSD, ReferenceNo: d.ReferenceNo, Status: d.Status.Value, USD: Coalesce(d.AmountUSD, fnToUSD(d.Amount, d.Currency.Value)), DaysOverdue: fnFundDaysOverdue(d.Status.Value, d.ExpectedDate)})))
                  );
                  // spent: live Budgets totals for one project; nightly snapshot (same source as the dashboard) for several
                  If(
                      locP > 0,
                      If(varBudgetLinesProjectID <> locP, fnLoadBudgetLines(locP));
                      UpdateContext({locSpent: Sum(colBudgetLines, SpentUSD), locSpentSrc: "budgets"}),
                      Clear(colFundSnap);
                      If(
                          canViewAllProjects,
                          Collect(colFundSnap, ForAll(Filter(MainFinanceProcurement, KPIType.Value = cfgKPI.Spent) As r, {ProjectID: r.ProjectID, AmountValue: r.AmountValue})),
                          ForAll(colMyProjects As p, Collect(colFundSnap, ForAll(Filter(MainFinanceProcurement, ProjectID = p.ID, KPIType.Value = cfgKPI.Spent) As r,
                              {ProjectID: r.ProjectID, AmountValue: r.AmountValue})))
                      );
                      UpdateContext({locSpent: Sum(colFundSnap, AmountValue), locSpentSrc: "snapshot"})
                  ),
                  UpdateContext({locError: true});
                  Trace("Donor funding load failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false, locCapped: CountRows(colFund) >= cfgFundMaxRows});
              If(Coalesce(varFundID, 0) > 0, UpdateContext({locOpenID: varFundID}); Set(varFundID, 0); Select(btnFundOpen))
      - btnFundOpen:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =If(
                  locOpenID = 0,
                  If(
                      canEditFunding,
                      UpdateContext({locF: {ID: 0, ProjectID: Coalesce(varProjectID, 0), Donor: LookUp(colMyProjects, ID = varProjectID).Donor,
                          AgreementNumber: LookUp(colMyProjects, ID = varProjectID).AgreementNumber, TrancheNo: Blank(), ExpectedDate: Blank(),
                          Currency: "USD", Amount: Blank(), ReferenceNo: "", Status: cfgFundStatus.Expected, ReceivedDate: Blank(), AmountUSD: Blank(), ProjectCode: "", USD: Blank(), DaysOverdue: 0},
                          locTriedSave: false, locDirty: false, locPanel: true}),
                      Notify(fnT("fund.cannotEdit", "Only the finance manager can add or edit tranches."), NotificationType.Warning)
                  ),
                  With(
                      // loaded row, else one LookUp (deep link) with the project scope check
                      {_d: Coalesce(LookUp(colFund, ID = locOpenID), First(ForAll(Filter(DonorFunding, ID = locOpenID) As d, {ID: d.ID, ProjectID: d.ProjectID, ProjectCode: d.Project.Value, Donor: d.Donor, AgreementNumber: d.AgreementNumber, TrancheNo: d.TrancheNo, ExpectedDate: d.ExpectedDate, ReceivedDate: d.ReceivedDate, Currency: d.Currency.Value, Amount: d.Amount, AmountUSD: d.AmountUSD, ReferenceNo: d.ReferenceNo, Status: d.Status.Value, USD: Coalesce(d.AmountUSD, fnToUSD(d.Amount, d.Currency.Value)), DaysOverdue: fnFundDaysOverdue(d.Status.Value, d.ExpectedDate)})))},
                      If(
                          IsBlank(_d) || (!canViewAllProjects && IsBlank(LookUp(colMyProjects, ID = _d.ProjectID))),
                          Notify(fnT("fund.noAccess", "This tranche does not exist or belongs to a project you cannot access."), NotificationType.Warning),
                          UpdateContext({locF: _d, locTriedSave: false, locDirty: false, locPanel: true})
                      )
                  )
              );
              Reset(drpFundEProj); Reset(txtFundEDonor); Reset(txtFundEAgr); Reset(txtFundETranche); Reset(dteFundEExp);
              Reset(drpFundECur); Reset(txtFundEAmt); Reset(txtFundERef); Reset(drpFundEStatus)
      - tmrFundPoll:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Duration: =cfgFundPollSeconds * 1000
            Start: =locPolling
            Repeat: =true
            AutoStart: =false
            OnTimerEnd: |-
              =UpdateContext({locPollTries: locPollTries + 1});
              With(
                  {_usd: LookUp(DonorFunding, ID = locPollID, AmountUSD)},
                  If(
                      !IsBlank(_usd),
                      UpdateContext({locPolling: false});
                      Notify(fnT("fund.posted", "Posted: the USD amount and ledger row are ready."), NotificationType.Success);
                      Select(btnFundQuery),
                      locPollTries >= cfgFundPollMaxTries,
                      UpdateContext({locPolling: false});
                      Notify(fnT("fund.slow", "The posting flow has not finished yet. Refresh later or check the flow run (a missing exchange rate stops it)."), NotificationType.Warning)
                  )
              )
      - tmrFundBoot:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Duration: =300
            Start: =varFinReady && !locBooted
            AutoStart: =false
            Repeat: =false
            OnTimerEnd: |-
              =UpdateContext({locBooted: true});
              Select(btnFundQuery)
