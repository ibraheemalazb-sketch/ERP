                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
