# scrFinDonorFunding - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinDonorFunding, set its properties from 04-screens-batch-b.md,
# then paste screens/paste/scrFinDonorFunding.controls.pa.yaml onto it.
Screens:
  scrFinDonorFunding:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 56);
        If(
            !hasFinanceAccess,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locMoreOpen: false, locNotifOpen: false, locPanel: false, locRecv: false});
            fnRefreshHeaderData();
            If(varFinReady, UpdateContext({locBooted: true}); Select(btnFundQuery))
        )
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_Fund:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - conFundRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conFundMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
