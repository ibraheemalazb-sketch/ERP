                                    KPIValue: =Sum(Filter(colFund, Status = cfgFundStatus.Received), USD)
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =fnT("fund.recvSub", "Received tranches (USD, flow 6)")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_FundSpent:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
