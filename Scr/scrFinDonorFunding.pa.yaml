                                    UpdateContext({locBusy: true});
                                    With(
                                        {
                                            _rec: If(locF.ID > 0, LookUp(DonorFunding, ID = locF.ID)), _p: drpFundEProj.Selected.Key, _t: If(IsBlank(txtFundETranche.Text), Blank(), Value(txtFundETranche.Text)), _amt: If(IsBlank(txtFundEAmt.Text), Blank(), Value(txtFundEAmt.Text)),
                                            _code: LookUp(colProjectOptions, Key = drpFundEProj.Selected.Key).Value, _corr: Text(GUID())
                                        },
                                        If(
                                            // server re-check: received tranches are posted and locked (corrections = ledger reversal)
                                            locF.ID > 0 && _rec.Status.Value = cfgFundStatus.Received,
                                            UpdateContext({locBusy: false, locPanel: false});
                                            Notify(fnT("fund.locked", "This tranche was received and posted; it can no longer be edited."), NotificationType.Warning);
                                            Select(btnFundQuery),
                                            // unique tranche number per project + agreement (ProjectID Indexed; few rows per project)
                                            !IsBlank(LookUp(DonorFunding, ProjectID = _p && TrancheNo = _t && AgreementNumber = Trim(txtFundEAgr.Text) && ID <> locF.ID)),
                                            UpdateContext({locBusy: false});
                                            Notify(fnT("fund.dup", "This tranche number already exists for the project and agreement."), NotificationType.Warning),
                                            IfError(
                                                UpdateContext({locSavedF: Patch(
                                                    DonorFunding,
                                                    If(locF.ID > 0, _rec, Defaults(DonorFunding)),
                                                    {
                                                        Title: Left(_code & " - " & Trim(txtFundEDonor.Text) & " T" & _t, 255),
                                                        Project: {Id: _p, Value: _code}, ProjectID: _p,
                                                        Donor: Trim(txtFundEDonor.Text), AgreementNumber: Trim(txtFundEAgr.Text), TrancheNo: _t,
                                                        ExpectedDate: dteFundEExp.SelectedDate, Currency: {Value: drpFundECur.Selected.Value}, Amount: _amt,
                                                        ReferenceNo: Trim(txtFundERef.Text), Status: {Value: drpFundEStatus.Selected.Key}
                                                        // AmountUSD is [Flow] (flow 6) - never written here
                                                    }
                                                )}),
                                                UpdateContext({locBusy: false});
                                                Notify(fnT("fund.saveError", "The tranche could not be saved.") & " " & FirstError.Message, NotificationType.Error);
                                                Trace("Donor funding save failed: " & FirstError.Message, TraceSeverity.Error),
                                                fnLogActivityFull(
                                                    "Donor Funding", locSavedF.ID, _code & " T" & _t, If(locF.ID > 0, "Updated", "Created"),
                                                    If(locF.ID > 0 && (locF.Amount <> _amt || locF.Currency <> drpFundECur.Selected.Value), "Important", "Info"),
                                                    _p, _code, "Amount|Currency|ExpectedDate|Status",
                                                    If(locF.ID > 0, Text(locF.Amount) & "|" & locF.Currency & "|" & Text(locF.ExpectedDate, "yyyy-mm-dd") & "|" & locF.Status, ""),
                                                    Text(_amt) & "|" & drpFundECur.Selected.Value & "|" & Text(dteFundEExp.SelectedDate, "yyyy-mm-dd") & "|" & drpFundEStatus.Selected.Key,
                                                    Trim(txtFundEDonor.Text), "", _amt, drpFundECur.Selected.Value, _corr
                                                );
                                                UpdateContext({locBusy: false, locPanel: false, locDirty: false});
                                                Notify(fnT("fund.saved", "Tranche saved."), NotificationType.Success);
                                                Select(btnFundQuery)
                                            )
                                        )
                                    )
                                )
