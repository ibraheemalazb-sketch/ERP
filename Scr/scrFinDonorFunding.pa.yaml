                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 4 * touchMin + 3 * sp1, touchMin)
                                  Children:
                                    - txtFundDonor:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          Default: =""
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
