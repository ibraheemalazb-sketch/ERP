                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_FundBal:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("fund.balance", "Cash balance")
                                    KPIValue: =Sum(Filter(colFund, Status = cfgFundStatus.Received), USD) - Coalesce(locSpent, 0)
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =If(Sum(Filter(colFund, Status = cfgFundStatus.Received), USD) - Coalesce(locSpent, 0) < 0, "danger", "")
                                    Subtext: =fnT("fund.balSub", "Received - spent")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_FundInflow:
