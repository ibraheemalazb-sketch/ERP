                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_FundOverdue:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("fund.overdue", "Overdue, not received")
                                    KPIValue: =Sum(Filter(colFund, DaysOverdue > 0), USD)
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =If(Sum(Filter(colFund, DaysOverdue > 0), USD) > 0, "danger", "")
                                    Subtext: =CountRows(Filter(colFund, DaysOverdue > 0)) & " " & fnT("fund.tranches", "tranches")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conFundPolling:
