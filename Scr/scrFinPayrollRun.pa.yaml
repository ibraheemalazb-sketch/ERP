                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =24
                                                FontWeight: =FontWeight.Semibold
                                                Tooltip: =Self.Text
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                    - conRunFNum:
