                                =If(locDirty, UpdateContext({locPendingNav: "close", locDlg: "discard"}), UpdateContext({locPanel: false}))
                        - btnRunFSave:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =fnT("common.save", "Save")
                              Font: =fontBase
                              Size: =fsBody
                              FontWeight: =FontWeight.Semibold
                              Height: =touchMin
                              BorderThickness: =1
                              FocusedBorderThickness: =2
                              FocusedBorderColor: =FinTheme.Focus
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PaddingBottom: =0
                              TabIndex: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              DisabledFill: =FinTheme.Border
                              DisabledColor: =FinTheme.TextSecondary
                              DisabledBorderColor: =FinTheme.Border
                              Fill: =FinTheme.Primary
                              Color: =FinTheme.OnPrimary
                              BorderColor: =FinTheme.Primary
                              HoverFill: =ColorFade(FinTheme.Primary, -0.12)
                              HoverColor: =FinTheme.OnPrimary
                              HoverBorderColor: =FinTheme.Primary
                              PressedFill: =ColorFade(FinTheme.Primary, -0.24)
                              PressedColor: =FinTheme.OnPrimary
                              PressedBorderColor: =FinTheme.Primary
                              Width: =110
                              FillPortions: =0
                              DisplayMode: =If(locBusy, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: |-
                                =UpdateContext({locTriedSave: true});
                                If(
                                    !((locLine.ID > 0 || Coalesce(drpRunFEmp.Selected.Key, 0) > 0) && Coalesce(drpRunFProj.Selected.Key, 0) > 0 && Coalesce(drpRunFBL.Selected.Key, 0) > 0 && (!IsBlank(If(IsBlank(txtRunFAlloc.Text), Blank(), Value(txtRunFAlloc.Text))) && If(IsBlank(txtRunFAlloc.Text), Blank(), Value(txtRunFAlloc.Text)) > 0 && If(IsBlank(txtRunFAlloc.Text), Blank(), Value(txtRunFAlloc.Text)) <= 100) && (!IsBlank(If(IsBlank(txtRunFBasic.Text), Blank(), Value(txtRunFBasic.Text))) && If(IsBlank(txtRunFBasic.Text), Blank(), Value(txtRunFBasic.Text)) >= 0 && Coalesce(If(IsBlank(txtRunFAllow.Text), Blank(), Value(txtRunFAllow.Text)), 0) >= 0 && Coalesce(If(IsBlank(txtRunFDed.Text), Blank(), Value(txtRunFDed.Text)), 0) >= 0 && Coalesce(If(IsBlank(txtRunFDed.Text), Blank(), Value(txtRunFDed.Text)), 0) <= If(IsBlank(txtRunFBasic.Text), Blank(), Value(txtRunFBasic.Text)) + Coalesce(If(IsBlank(txtRunFAllow.Text), Blank(), Value(txtRunFAllow.Text)), 0))),
                                    Notify(fnT("form.fix", "Please correct the highlighted fields."), NotificationType.Warning),
                                    UpdateContext({locBusy: true});
                                    With(
                                        {
                                            _rec: LookUp(PayrollRuns, ID = varRunID), _corr: Text(GUID()),
                                            _basic: If(IsBlank(txtRunFBasic.Text), Blank(), Value(txtRunFBasic.Text)), _allow: Coalesce(If(IsBlank(txtRunFAllow.Text), Blank(), Value(txtRunFAllow.Text)), 0), _ded: Coalesce(If(IsBlank(txtRunFDed.Text), Blank(), Value(txtRunFDed.Text)), 0), _alloc: If(IsBlank(txtRunFAlloc.Text), Blank(), Value(txtRunFAlloc.Text)),
                                            _emp: If(locLine.ID > 0, locLine.EmployeeID, drpRunFEmp.Selected.Key),
                                            _empName: If(locLine.ID > 0, locLine.Employee, drpRunFEmp.Selected.Value)
                                        },
                                        If(
                                            // re-check on the server: the run must still be Draft
                                            _rec.Status.Value <> cfgRunStatus.Draft || !canEditRunLines,
                                            UpdateContext({locBusy: false, locPanel: false});
                                            Notify(fnT("run.notDraft", "Lines can only be changed while the run is Draft."), NotificationType.Warning);
                                            Select(btnRunLoad),
                                            IfError(
                                                UpdateContext({locSaved: Patch(
                                                    PayrollLines,
                                                    If(locLine.ID > 0, LookUp(PayrollLines, ID = locLine.ID), Defaults(PayrollLines)),
                                                    {
                                                        Title: Left(locRun.RunNumber & " - " & _empName, 255),
                                                        Run: {Id: varRunID, Value: locRun.RunNumber}, RunID: varRunID, PeriodKey: locRun.PeriodKey,
                                                        Employee: {Id: _emp, Value: _empName}, EmployeeID: _emp,
                                                        ProjectID: drpRunFProj.Selected.Key, BudgetLineID: drpRunFBL.Selected.Key, AllocationPercent: _alloc,
                                                        BasicSalary: _basic, Allowances: _allow, Deductions: _ded,
                                                        // H3: not [Flow] columns; written only while cfgPayrollAppComputesGross = true
                                                        GrossAmount: If(cfgPayrollAppComputesGross, _basic + _allow, locLine.GrossAmount),
                                                        NetAmount: If(cfgPayrollAppComputesGross, _basic + _allow - _ded, locLine.NetAmount),
                                                        Currency: {Value: drpRunFCur.Selected.Value}
                                                        // AmountUSD is [Flow] (flow 4) - never written here
                                                    }
                                                )}),
                                                UpdateContext({locBusy: false});
                                                Notify(fnT("run.saveError", "The line could not be saved.") & " " & FirstError.Message, NotificationType.Error);
                                                Trace("Payroll line save failed: " & FirstError.Message, TraceSeverity.Error),
                                                // audit (IsSensitive is set automatically for Payroll Line)
                                                fnLogActivityFull(
                                                    "Payroll Line", locSaved.ID, locRun.RunNumber, If(locLine.ID > 0, "Updated", "Created"), "Important",
                                                    drpRunFProj.Selected.Key, LookUp(colProjLite, Key = drpRunFProj.Selected.Key).Value,
                                                    "BasicSalary|Allowances|Deductions|AllocationPercent|BudgetLineID",
                                                    If(locLine.ID > 0, Text(locLine.BasicSalary) & "|" & Text(locLine.Allowances) & "|" & Text(locLine.Deductions) & "|" &
                                                        Text(locLine.AllocationPercent) & "|" & Text(locLine.BudgetLineID), ""),
                                                    Text(_basic) & "|" & Text(_allow) & "|" & Text(_ded) & "|" & Text(_alloc) & "|" & Text(drpRunFBL.Selected.Key),
                                                    "Employee #" & _emp, "", _basic + _allow, drpRunFCur.Selected.Value, _corr
                                                );
                                                // allocation check for this employee (a handful of rows, loaded locally; never a Sum over the list)
                                                ClearCollect(colRunEmpAlloc, ForAll(Filter(PayrollLines, RunID = varRunID, EmployeeID = _emp) As a, {ID: a.ID, Alloc: Coalesce(a.AllocationPercent, 0)}));
                                                UpdateContext({locAllocSum: Sum(colRunEmpAlloc, Alloc)});
                                                Clear(colRunEmpAlloc);
                                                If(
                                                    Abs(locAllocSum - 100) > 0.01,
                                                    Notify(fnT("run.allocWarn", "Saved. This employee's allocation now totals") & " " & Text(locAllocSum, "#,##0.##", "en-US") & "% " & fnT("run.allocShould", "(should be 100%)."), NotificationType.Warning),
                                                    Notify(fnT("run.saved", "Line saved. Run totals update when flow 4 has run."), NotificationType.Success)
                                                );
                                                UpdateContext({locBusy: false, locPanel: false, locDirty: false});
                                                Select(btnRunLnQuery)
                                            )
                                        )
                                    )
                                )
      - cmpDlg_Run:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =locDlg in ["submit", "approve", "return", "paid", "delline"]
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: =Switch(locDlg, "submit", fnT("run.dlgSubmit", "Submit this run to HR?"), "approve", fnT("run.dlgApprove", "Approve this payroll run?"), "return", fnT("run.dlgReturn", "Return this run to Draft?"), "paid", fnT("run.dlgPaid", "Mark this run as paid?"), fnT("run.dlgDelete", "Delete this payroll line?"))
            Message: =Switch(locDlg, "submit", fnT("run.msgSubmit", "Lines become read-only. HR, then Finance approve the run."), "approve", If(locRun.Status = cfgRunStatus.PendingHR, fnT("run.msgApproveHR", "The run goes to the finance manager."), fnT("run.msgApproveFin", "The run becomes Approved and can be paid.")), "return", fnT("run.msgReturn", "The preparer can edit the lines again. A reason is required."), "paid", fnT("run.msgPaid", "Flow 5 then posts one ledger row per project and budget line. This cannot be undone in the app."), fnT("run.msgDelete", "The employee is removed from this run. A reason is required."))
            ConfirmText: =Switch(locDlg, "submit", fnT("prf.submit", "Submit"), "approve", fnT("prd.approve", "Approve"), "return", fnT("prd.return", "Return"), "paid", fnT("prd.markPaid", "Mark as paid"), fnT("common.delete", "Delete"))
            CancelText: =fnT("common.cancel", "Cancel")
            Destructive: =locDlg in ["return", "delline", "paid"]
            RequireReason: =locDlg in ["return", "delline"]
            ShowReason: =locDlg = "approve"
            ReasonLabel: =If(locDlg = "approve", fnT("dlg.comment", "Comment (optional)"), fnT("dlg.reason", "Reason"))
            MinReasonLength: =cfgReasonMinChars
            Busy: =locBusy
            OnCancel: |-
              =UpdateContext({locDlg: ""})
            OnConfirm: |-
              =UpdateContext({locBusy: true});
              With(
                  {_r: Trim(cmpDlg_Run.Reason), _corr: Text(GUID()), _rec: LookUp(PayrollRuns, ID = varRunID)},
                  If(
                      // optimistic concurrency: the run changed since this screen loaded
                      _rec.Status.Value <> locRun.Status,
                      UpdateContext({locBusy: false, locDlg: "", locPanel: false});
                      Notify(fnT("run.changed", "This run was changed by someone else. The latest version is now shown."), NotificationType.Warning);
                      Select(btnRunLoad),
                      locDlg = "delline",
                      If(
                          _rec.Status.Value <> cfgRunStatus.Draft || !canEditRunLines,
                          UpdateContext({locBusy: false, locDlg: ""});
                          Notify(fnT("run.notDraft", "Lines can only be changed while the run is Draft."), NotificationType.Warning),
                          IfError(
                              Remove(PayrollLines, LookUp(PayrollLines, ID = locLine.ID)),
                              UpdateContext({locBusy: false});
                              Notify(fnT("run.deleteError", "The line could not be deleted.") & " " & FirstError.Message, NotificationType.Error),
                              fnLogActivityFull("Payroll Line", locLine.ID, locRun.RunNumber, "Deleted", "Important", locLine.ProjectID,
                                  LookUp(colProjLite, Key = locLine.ProjectID).Value, "", "", "", "Employee #" & locLine.EmployeeID, _r,
                                  locLine.GrossAmount, locLine.Currency, _corr);
                              UpdateContext({locBusy: false, locDlg: "", locPanel: false, locDirty: false});
                              Notify(fnT("run.deleted", "Line deleted."), NotificationType.Success);
                              Select(btnRunLnQuery)
                          )
                      ),
                      IfError(
                          Switch(
                              locDlg,
                              "submit", Patch(PayrollRuns, _rec, {Status: {Value: cfgRunStatus.PendingHR}, ApprovalStarted: true}),
                              "approve", If(
                                  locRun.Status = cfgRunStatus.PendingHR,
                                  Patch(PayrollRuns, _rec, {Status: {Value: cfgRunStatus.PendingFinance}}),
                                  Patch(PayrollRuns, _rec, {Status: {Value: cfgRunStatus.Approved}, ApprovedDate: Now()})
                              ),
                              "return", Patch(PayrollRuns, _rec, {Status: {Value: cfgRunStatus.Draft}, ApprovalStarted: false}),
                              // Paid -> flow 5 posts (PostedToLedger is [Flow])
                              "paid", Patch(PayrollRuns, _rec, {Status: {Value: cfgRunStatus.Paid}})
                          ),
                          UpdateContext({locBusy: false});
                          Notify(fnT("prd.actionError", "The action could not be completed. Please retry.") & " " & FirstError.Message, NotificationType.Error);
                          Trace("Payroll run action " & locDlg & " failed: " & FirstError.Message, TraceSeverity.Error),
                          If(
                              locDlg in ["approve", "return"],
                              fnRecordDecision(cfgRequestType.PayrollRun, varRunID, locRun.RunNumber,
                                  If(locDlg = "return", cfgApprDecision.Returned, cfgApprDecision.Approved), _r, Blank())
                          );
                          fnLogActivityFull(
                              "Payroll Run", varRunID, locRun.RunNumber,
                              Switch(locDlg, "submit", "Submitted", "approve", "Approved", "return", "Returned", "Status Changed"),
                              If(locDlg = "paid", "Important", "Info"), Blank(), "", "Status", locRun.Status, Switch(locDlg, "submit", cfgRunStatus.PendingHR, "return", cfgRunStatus.Draft, "paid", cfgRunStatus.Paid, If(locRun.Status = cfgRunStatus.PendingHR, cfgRunStatus.PendingFinance, cfgRunStatus.Approved)),
                              "Payroll run " & locDlg, _r, locRun.TotalNet, locRun.Currency, _corr
                          );
                          UpdateContext({locDlg: "", locBusy: false});
                          Notify(fnT("prd.done", "Done."), NotificationType.Success);
                          fnRefreshHeaderData();
                          Select(btnRunLoad)
                      )
                  )
              )
      - cmpDlgDiscard_Run:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =locDlg = "discard"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: =fnT("dlg.discardTitle", "Discard changes?")
            Message: =fnT("dlg.discardMsg", "Your changes have not been saved. Leave and lose them?")
            ConfirmText: =fnT("dlg.discard", "Discard")
            CancelText: =fnT("dlg.keepEditing", "Keep editing")
            Destructive: =true
            RequireReason: =false
            ShowReason: =false
            Busy: =false
            OnCancel: |-
              =UpdateContext({locDlg: ""})
            OnConfirm: |-
              =UpdateContext({locDlg: "", locDirty: false});
              UpdateContext({locPanel: false});
