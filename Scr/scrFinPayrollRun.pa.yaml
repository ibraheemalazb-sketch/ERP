                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.TextSecondary
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - lblRunFStartedV:
