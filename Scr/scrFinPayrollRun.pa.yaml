                        - btnRunFCancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =fnT("common.cancel", "Cancel")
                              Font: =fontBase
                              Size: =fsBody
                              FontWeight: =FontWeight.Semibold
                              Height: =touchMin
                              BorderThickness: =1
                              FocusedBorderThickness: =2
