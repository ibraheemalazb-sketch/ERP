# scrFinPayrollRun - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinPayrollRun, set its properties from 04-screens-batch-b.md,
# then paste screens/paste/scrFinPayrollRun.controls.pa.yaml onto it.
Screens:
  scrFinPayrollRun:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 51);
        If(
            varFinReady && !canAccessPayroll,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locTab: "lines", locMoreOpen: false, locNotifOpen: false, locDiffDone: false});
            Clear(colRunRevealed); Clear(colRunDiffRevealed);
            fnRefreshHeaderData();
            If(varFinReady, UpdateContext({locBooted: true}); Select(btnRunLoad))
        )
      LoadingSpinner: =LoadingSpinner.None
      OnHidden: |-
        =Clear(colRunLines); Clear(colRunRevealed); Clear(colRunDiff); Clear(colRunDiffCur); Clear(colRunDiffPrev); Clear(colRunDiffRevealed); Clear(colRunAlloc); Clear(colRunEmpAlloc); Clear(colRunLnStack);
        UpdateContext({locRun: Blank(), locRunRec: Blank(), locLine: Blank(), locPanel: false, locHistReveal: false})
    Children:
      - cmpNav_Run:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - conRunRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conRunMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - conRunBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - cmpSkel_Run:
                            Control: CanvasComponent
                            ComponentName: cmpSkeleton
                            Properties:
                              Visible: =locLoading
                              Variant: ="cards"
                              Rows: =3
                              Height: =320
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - cmpEmpty_RunMissing:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =!locLoading && !locError && locMissing
                              Variant: ="noaccess"
                              Message: =fnT("run.missing", "This payroll run does not exist or you cannot read it.")
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              ActionText: =fnT("nav.payroll", "Payroll")
                              OnAction: =fnNavigate("payroll")
                        - cmpEmpty_RunErr:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =locError
                              Variant: ="error"
                              Message: =fnT("common.loadError", "The data could not be loaded.")
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              ActionText: =fnT("common.retry", "Retry")
                              OnAction: =Select(btnRunLoad)
                        - conRunSummary:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =!locLoading && !locError && !locMissing
                              Height: =28 + sp1 + If(isMobile, 3, 1) * 46 + If(isMobile, 2, 0) * sp2 + 2 * sp2
                            Children:
                              - conRunSumHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =sp1
                                    LayoutWrap: =false
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =28
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                  Children:
                                    - lblRunSumTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =fnPeriodLabel(locRun.PeriodKey) & " | " & locRun.Currency
                                          Font: =fontBase
                                          Size: =fsSection
                                          Color: =FinTheme.Text
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =false
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =28
                                          FontWeight: =FontWeight.Semibold
                                          Role: =TextRole.Heading2
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                    - icoRunStatus:
                                        Control: Classic/Icon@2.5.0
                                        Properties:
                                          Icon: =Coalesce(LookUp(tblStatusMap, Domain = "PayrollRun" && Status = locRun.Status, Ico), LookUp(tblToneIcon, Tone = fnStatusTone("PayrollRun", locRun.Status), Ico))
                                          Color: =fnToneText(fnStatusTone("PayrollRun", locRun.Status))
                                          Fill: =RGBA(0, 0, 0, 0)
                                          Width: =18
                                          Height: =18
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          TabIndex: =-1
                                          AccessibleLabel: =""
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                    - lblRunStatus:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =fnT("run." & Substitute(locRun.Status, " ", ""), locRun.Status)
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =fnToneText(fnStatusTone("PayrollRun", locRun.Status))
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =false
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =28
                                          Width: =140
                                          FillPortions: =0
                                          FontWeight: =FontWeight.Semibold
                                    - lblRunPosted:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =If(locRun.PostedToLedger, "✓ " & fnT("pyr.posted", "Posted to ledger"), "○ " & fnT("pyr.notPosted", "Not posted"))
                                          Font: =fontBase
                                          Size: =fsCaption
                                          Color: =If(locRun.PostedToLedger, FinTheme.SuccessText, FinTheme.TextSecondary)
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =false
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =28
                                          Width: =170
                                          FillPortions: =0
                              - conRunFacts:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =sp2
                                    LayoutWrap: =true
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 3, 1) * 46 + If(isMobile, 2, 0) * sp2
                                  Children:
                                    - conRunFPrep:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =2
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Width: =If(isMobile, (Parent.Width - sp2) / 2, 200)
                                          Height: =46
                                          FillPortions: =0
                                        Children:
                                          - lblRunFPrepL:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("run.preparedBy", "Prepared by")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.TextSecondary
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - lblRunFPrepV:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =locPreparedBy
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =24
                                                FontWeight: =FontWeight.Semibold
                                                Tooltip: =Self.Text
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                    - conRunFAppr:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =2
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Width: =If(isMobile, (Parent.Width - sp2) / 2, 200)
                                          Height: =46
                                          FillPortions: =0
                                        Children:
                                          - lblRunFApprL:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("run.approvedDate", "Approved")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.TextSecondary
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - lblRunFApprV:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =If(IsBlank(locRun.ApprovedDate), "-", Text(locRun.ApprovedDate, "dd mmm yyyy", appLocale))
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =24
