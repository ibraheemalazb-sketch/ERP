                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =2
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Width: =If(isMobile, (Parent.Width - sp2) / 2, 200)
                                          Height: =46
                                          FillPortions: =0
                                        Children:
                                          - lblRunFStartedL:
                                              Control: Label@2.5.1
                                              Properties:
