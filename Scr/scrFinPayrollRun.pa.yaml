      - btnRunDiff:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =If(
                  !canAccessPayroll,
                  Navigate(scrFinNoAccess, ScreenTransition.None),
                  UpdateContext({locDiffLoading: true, locDiffDone: false});
                  Clear(colRunDiffRevealed);
                  IfError(
                      UpdateContext({locPrevRun: First(Sort(Filter(PayrollRuns, PeriodKey < locRun.PeriodKey, Currency.Value = locRun.Currency),
                          PeriodKey, SortOrder.Descending))});
                      Concurrent(
                          ClearCollect(colRunDiffCur, ForAll(FirstN(Sort(Filter(PayrollLines, RunID = varRunID), ID, SortOrder.Ascending), cfgPayrollDiffMaxLines) As l,
                              {EmployeeID: l.EmployeeID, Employee: l.Employee.Value, Gross: Coalesce(l.GrossAmount, 0)})),
                          If(
                              IsBlank(locPrevRun),
                              Clear(colRunDiffPrev),
                              ClearCollect(colRunDiffPrev, ForAll(FirstN(Sort(Filter(PayrollLines, RunID = locPrevRun.ID), ID, SortOrder.Ascending), cfgPayrollDiffMaxLines) As l,
                                  {EmployeeID: l.EmployeeID, Employee: l.Employee.Value, Gross: Coalesce(l.GrossAmount, 0)}))
                          )
                      );
                      // per employee (all allocations of an employee summed) - local collections only, never the list
                      ClearCollect(
                          colRunDiff,
                          ForAll(
                              Distinct(colRunDiffCur, EmployeeID) As e,
                              With(
                                  {_c: Sum(Filter(colRunDiffCur, EmployeeID = e.Value), Gross), _pr: Filter(colRunDiffPrev, EmployeeID = e.Value)},
                                  With(
                                      {_p: Sum(_pr, Gross)},
                                      {
                                          EmployeeID: e.Value, Employee: LookUp(colRunDiffCur, EmployeeID = e.Value).Employee,
                                          Prev: If(IsEmpty(_pr), Blank(), _p), Cur: _c,
                                          Pct: If(IsEmpty(_pr) || _p = 0, Blank(), (_c - _p) / _p),
                                          Kind: If(IsEmpty(_pr), "added", _p <> 0 && Abs(_c - _p) / _p > cfgPayrollDiffPct, "changed", "same")
                                      }
                                  )
                              )
                          )
                      );
                      Collect(
                          colRunDiff,
                          ForAll(
                              Filter(Distinct(colRunDiffPrev, EmployeeID), !(Value in colRunDiffCur.EmployeeID)) As e,
                              {EmployeeID: e.Value, Employee: LookUp(colRunDiffPrev, EmployeeID = e.Value).Employee,
                               Prev: Sum(Filter(colRunDiffPrev, EmployeeID = e.Value), Gross), Cur: Blank(), Pct: Blank(), Kind: "removed"}
                          )
                      );
                      UpdateContext({locDiffSame: CountRows(Filter(colRunDiff, Kind = "same")),
                          locDiffCapped: CountRows(colRunDiffCur) >= cfgPayrollDiffMaxLines || CountRows(colRunDiffPrev) >= cfgPayrollDiffMaxLines});
                      RemoveIf(colRunDiff, Kind = "same");
                      // only the comparison result is kept; the raw line copies are dropped immediately
                      Clear(colRunDiffCur); Clear(colRunDiffPrev);
                      UpdateContext({locDiffDone: true}),
                      Notify(fnT("run.diffError", "The comparison could not be loaded. Please retry."), NotificationType.Error);
                      Trace("Payroll diff failed: " & FirstError.Message, TraceSeverity.Error)
                  );
                  UpdateContext({locDiffLoading: false})
              )
