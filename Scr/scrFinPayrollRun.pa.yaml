      - cmpNotif_Run:
          Control: CanvasComponent
          ComponentName: cmpNotificationsPanel
          Properties:
            Visible: =locNotifOpen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: |-
              =ForAll(colFinNotif As n, {ID: n.ID, Title: n.Title, Message: n.Message, Created: n.Created, Link: n.Link, RelatedEntity: n.RelatedEntity.Value, RelatedItemID: n.RelatedItemID})
            OnClose: |-
              =UpdateContext({locNotifOpen: false})
            OnMarkAllRead: =fnMarkAllNotificationsRead()
            OnOpenItem: |-
              =UpdateContext({locNotifOpen: false});
              fnOpenNotification(cmpNotif_Run.SelectedItem.ID, cmpNotif_Run.SelectedItem.RelatedEntity, cmpNotif_Run.SelectedItem.RelatedItemID, cmpNotif_Run.SelectedItem.Link)
      - btnRunLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =If(
                  !canAccessPayroll,
                  Clear(colRunLines); Clear(colRunRevealed); Navigate(scrFinNoAccess, ScreenTransition.None),
                  UpdateContext({locLoading: true, locError: false, locDlg: "", locBusy: false, locHistTop: 50, locHistReveal: false, locPanel: false});
                  IfError(
                      UpdateContext({locRunRec: LookUp(PayrollRuns, ID = varRunID)});
                      With(
                          {r: locRunRec},
                          UpdateContext({locRun: {
                              ID: r.ID, RunNumber: r.RunNumber, Title: r.Title, PayrollMonth: r.PayrollMonth, PayrollYear: r.PayrollYear,
                              PeriodKey: r.PeriodKey, Currency: r.Currency.Value, TotalGross: r.TotalGross, TotalDeductions: r.TotalDeductions,
                              TotalNet: r.TotalNet, EmployeeCount: r.EmployeeCount, Status: r.Status.Value, ApprovalStarted: r.ApprovalStarted,
                              PostedToLedger: r.PostedToLedger, PreparedByID: r.PreparedByID, ApprovedDate: r.ApprovedDate
                          }})
                      );
                      UpdateContext({locMissing: IsBlank(locRunRec)});
                      // project codes (Projects is not payroll data): once per session
                      If(IsEmpty(colProjLite), ClearCollect(colProjLite, ForAll(FirstN(Sort(Projects, ID, SortOrder.Ascending), 2000) As p, {Key: p.ID, Value: p.ProjectCode})));
                      UpdateContext({locPreparedBy: If(Coalesce(locRun.PreparedByID, 0) > 0,
                          Coalesce(LookUp(colEmpLite, Key = locRun.PreparedByID).Value, LookUp(Employees, ID = locRun.PreparedByID).FullName), "-")});
                      // actions (segregation of duties: the preparer never approves the same run)
                      With(
                          {_own: locRun.PreparedByID = varMeID, _s: locRun.Status},
                          UpdateContext({locCan: {
                              EditLines: _s = cfgRunStatus.Draft && canEditRunLines,
                              Submit: _s = cfgRunStatus.Draft && canEditRunLines && Coalesce(locRun.EmployeeCount, 0) > 0,
                              ApproveHR: _s = cfgRunStatus.PendingHR && canApproveRunHR && (!_own || cfgRunPreparerMayApproveHR),
                              ApproveFin: _s = cfgRunStatus.PendingFinance && canApproveRunFin && !_own,
                              MarkPaid: _s = cfgRunStatus.Approved && canMarkRunPaid
                          }})
