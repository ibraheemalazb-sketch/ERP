Screens:
  scrMEAL:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Main");
        Set(varNavSelectedID, 61);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealProject), Set(varMealProject, Blank()));
        If(IsBlank(varMealPeriod), Set(varMealPeriod, Blank()));
        If(IsBlank(varMealError), Set(varMealError, false));
        Select(btnMealLoad)
    Children:
      - conMealNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpMealNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conMealSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealIndicators,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(Indicators, And(ProjectID = varMealProject.ID, Status.Value = "Active")),
                                    FirstN(Filter(Indicators, Status.Value = "Active"), 500)
                                )
                            ),
                            ClearCollect(
                                colMealResults,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(IndicatorResults, And(ProjectID = varMealProject.ID, VerificationStatus.Value = "Not Verified")),
                                    FirstN(Filter(IndicatorResults, VerificationStatus.Value = "Not Verified"), 500)
                                )
                            ),
                            ClearCollect(
                                colMealPlans,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(ActivityPlans, ProjectID = varMealProject.ID),
                                    FirstN(SortByColumns(ActivityPlans, "PlannedDate", SortOrder.Ascending), 500)
                                )
                            ),
                            ClearCollect(
                                colMealVisits,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(FieldVisits, And(ProjectID = varMealProject.ID, Status.Value <> "Closed", Status.Value <> "Rejected")),
                                    FirstN(Filter(FieldVisits, And(Status.Value <> "Closed", Status.Value <> "Rejected")), 500)
                                )
                            ),
                            ClearCollect(
                                colMealCFM,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(Complainants, And(ProjectID = varMealProject.ID, Status.Value = "Open")),
                                    FirstN(Filter(Complainants, Status.Value = "Open"), 500)
                                )
                            ),
                            ClearCollect(
                                colMealActions,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(MELActions, And(ProjectID = varMealProject.ID, Status.Value <> "Closed", Status.Value <> "Completed", Status.Value <> "Dropped")),
                                    FirstN(Filter(MELActions, And(Status.Value <> "Closed", Status.Value <> "Completed", Status.Value <> "Dropped")), 500)
                                )
                            ),
                            ClearCollect(
                                colMealSchedules,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(ReportSchedules, ProjectID = varMealProject.ID),
                                    FirstN(SortByColumns(ReportSchedules, "DueDate", SortOrder.Ascending), 500)
                                )
                            ),
                            ClearCollect(
                                colMealStudies,
                                If(
                                    Coalesce(varMealProject.ID, 0) > 0,
                                    Filter(MELStudies, And(ProjectID = varMealProject.ID, Status.Value <> "Completed", Status.Value <> "Cancelled")),
                                    FirstN(Filter(MELStudies, And(Status.Value <> "Completed", Status.Value <> "Cancelled")), 500)
                                )
                            ),
                            ClearCollect(
                                colMealPeriods,
                                Filter(ReportingPeriods, Status.Value = "Active")
                            )
                        );
                        Set(varMealIndActive, CountRows(colMealIndicators));
                        Set(varMealIndOnTrack, CountRows(Filter(colMealIndicators, Coalesce(AchievementPercent, 0) >= 90)));
                        Set(varMealIndAtRisk, CountRows(Filter(colMealIndicators, And(Coalesce(AchievementPercent, 0) >= 70, Coalesce(AchievementPercent, 0) < 90))));
                        Set(varMealUnverified, CountRows(colMealResults));
                        Set(varMealUpcomingActs, CountRows(Filter(colMealPlans, And(Not(IsBlank(PlannedDate)), PlannedDate >= Today(), Or(Status.Value = "Planned", Status.Value = "Ongoing")))));
                        Set(varMealOpenVisits, CountRows(colMealVisits));
                        Set(varMealOpenCFM, CountRows(colMealCFM));
                        Set(varMealOpenActions, CountRows(colMealActions));
                        Set(varMealOverdueActions, CountRows(Filter(colMealActions, And(Not(IsBlank(DueDate)), DueDate < Today()))));
                        Set(varMealSchedDue, CountRows(Filter(colMealSchedules, Or(Status.Value = "Due Soon", Status.Value = "Overdue"))));
                        Set(varMealOpenStudies, CountRows(colMealStudies));
                        ClearCollect(
                            colMealKPIs,
                            {
                                Key: "indicators",
                                LabelEn: "Active indicators",
                                LabelAr: "مؤشرات نشطة",
                                Count: varMealIndActive,
                                Tone: "info",
                                Nav: "indicators"
                            },
                            {
                                Key: "ontrack",
                                LabelEn: "On track (≥90%)",
                                LabelAr: "على المسار (≥90%)",
                                Count: varMealIndOnTrack,
                                Tone: "success",
                                Nav: "indicators"
                            },
                            {
                                Key: "atrisk",
                                LabelEn: "At risk (70–90%)",
                                LabelAr: "في خطر (70–90%)",
                                Count: varMealIndAtRisk,
                                Tone: "warning",
                                Nav: "indicators"
                            },
                            {
                                Key: "unverified",
                                LabelEn: "Unverified results",
                                LabelAr: "نتائج غير موثّقة",
                                Count: varMealUnverified,
                                Tone: "warning",
                                Nav: "indicators"
                            },
                            {
                                Key: "activities",
                                LabelEn: "Upcoming activities",
                                LabelAr: "أنشطة قادمة",
                                Count: varMealUpcomingActs,
                                Tone: "info",
                                Nav: "activities"
                            },
                            {
                                Key: "visits",
                                LabelEn: "Open field visits",
                                LabelAr: "زيارات مفتوحة",
                                Count: varMealOpenVisits,
                                Tone: "primary",
                                Nav: "visits"
                            },
                            {
                                Key: "cfm",
                                LabelEn: "Open CFM cases",
                                LabelAr: "شكاوى مفتوحة",
                                Count: varMealOpenCFM,
                                Tone: "danger",
                                Nav: "cfm"
                            },
                            {
                                Key: "actions",
                                LabelEn: "Open MEL actions",
                                LabelAr: "إجراءات مفتوحة",
                                Count: varMealOpenActions,
                                Tone: "warning",
                                Nav: "actions"
                            },
                            {
                                Key: "schedules",
                                LabelEn: "Schedules due/overdue",
                                LabelAr: "جداول مستحقة/متأخرة",
                                Count: varMealSchedDue,
                                Tone: "danger",
                                Nav: "schedules"
                            },
                            {
                                Key: "studies",
                                LabelEn: "Active studies",
                                LabelAr: "دراسات نشطة",
                                Count: varMealOpenStudies,
                                Tone: "neutral",
                                Nav: "studies"
                            }
                        );
                        ClearCollect(
                            colMealAlerts,
                            {
                                Key: "overdueActions",
                                Severity: 1,
                                Tone: "danger",
                                LabelEn: "Overdue MEL actions",
                                LabelAr: "إجراءات متأخرة",
                                Count: varMealOverdueActions,
                                Nav: "actions"
                            },
                            {
                                Key: "schedOverdue",
                                Severity: 2,
                                Tone: "danger",
                                LabelEn: "Overdue report schedules",
                                LabelAr: "جداول تقارير متأخرة",
                                Count: CountRows(Filter(colMealSchedules, Status.Value = "Overdue")),
                                Nav: "schedules"
                            },
                            {
                                Key: "unverified",
                                Severity: 3,
                                Tone: "warning",
                                LabelEn: "Results awaiting verification",
                                LabelAr: "نتائج بانتظار التوثيق",
                                Count: varMealUnverified,
                                Nav: "indicators"
                            },
                            {
                                Key: "cfm",
                                Severity: 4,
                                Tone: "warning",
                                LabelEn: "Open CFM cases",
                                LabelAr: "شكاوى مفتوحة",
                                Count: varMealOpenCFM,
                                Nav: "cfm"
                            },
                            {
                                Key: "atrisk",
                                Severity: 5,
                                Tone: "info",
                                LabelEn: "Indicators at risk",
                                LabelAr: "مؤشرات في خطر",
                                Count: varMealIndAtRisk,
                                Nav: "indicators"
                            }
                        );
                        ClearCollect(
                            colMealUpcomingView,
                            FirstN(
                                SortByColumns(
                                    Filter(
                                        colMealPlans,
                                        And(
                                            Not(IsBlank(PlannedDate)),
                                            PlannedDate >= Today(),
                                            Or(Status.Value = "Planned", Status.Value = "Ongoing")
                                        )
                                    ),
                                    "PlannedDate",
                                    SortOrder.Ascending
                                ),
                                12
                            )
                        );
                        ClearCollect(
                            colMealActionsView,
                            FirstN(
                                SortByColumns(colMealActions, "DueDate", SortOrder.Ascending),
                                12
                            )
                        );
                        ClearCollect(
                            colMealIndPerf,
                            FirstN(
                                SortByColumns(colMealIndicators, "AchievementPercent", SortOrder.Ascending),
                                12
                            )
                        );
                        ClearCollect(
                            colMealCalView,
                            FirstN(
                                SortByColumns(
                                    Filter(
                                        colMealSchedules,
                                        Or(
                                            Status.Value = "Upcoming",
                                            Status.Value = "Due Soon",
                                            Status.Value = "Overdue",
                                            Status.Value = "In Preparation"
                                        )
                                    ),
                                    "DueDate",
                                    SortOrder.Ascending
                                ),
                                12
                            )
                        ),
                        Set(varMealError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل لوحة المتابعة والتقييم.", "Could not load the MEAL dashboard."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
      - conMealPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpMealPhone.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =16
            PaddingTop: =cmpMealTop.Height + 12
            Width: =Parent.Width
          Children:
            - conMealHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 120, 44)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                Children:
                  - lblMealTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "لوحة المتابعة والتقييم", "MEAL Dashboard")
                        Width: =200
                        Wrap: =false
                  - cmbMealProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        DefaultSelectedItems: =If(IsBlank(varMealProject), Filter(Projects, false), Filter(Projects, ID = varMealProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                        ItemDisplayText: =If(IsBlank(ThisItem.ProjectCode), ThisItem.Title, Concatenate(ThisItem.ProjectCode, " · ", ThisItem.Title))
                        Items: |-
                          =If(
                              varUserHasAllProjects,
                              Projects,
                              Filter(
                                  ForAll(
                                      Filter(colUserProjectAccess, AllProjects = false) As access,
                                      LookUp(Projects, ID = access.ProjectID)
                                  ),
                                  !IsBlank(ID)
                              )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varMealProject, Self.Selected);
                          Select(btnMealLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 200)
                  - cmbMealPeriod:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الفترة", "Period")
                        DefaultSelectedItems: =If(IsBlank(varMealPeriod), Filter(colMealPeriods, false), Filter(colMealPeriods, ID = varMealPeriod.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الفترات", "All periods")
                        ItemDisplayText: =Coalesce(ThisItem.Title, ThisItem.PeriodName, Text(ThisItem.ID))
                        Items: =colMealPeriods
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varMealPeriod, Self.Selected);
                          Select(btnMealLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 160)
                  - btnMealRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnMealLoad)
                        Text: =""
                        Width: =44
            - lblMealError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل البيانات.", "Data could not be loaded.")
                  Visible: =varMealError
                  Width: =Parent.Width
                  Wrap: =false
            - galMealKPI:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "مؤشرات المتابعة", "MEAL KPIs")
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 220, 110)
                  Items: =colMealKPIs
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =4
                  TemplateSize: =If(App.Width < 700, Parent.Width / 2 - 8, Parent.Width / 5 - 4)
                  Width: =Parent.Width
                Children:
                  - conMealKPICard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =10
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =Parent.TemplateWidth - 8
                        X: =4
                        Y: =4
                      Children:
                        - btnMealKPI:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              FillPortions: =1
                              Height: =Parent.Height - 8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Switch(
                                    ThisItem.Nav,
                                    "indicators", Navigate(scrIndicators, ScreenTransition.None),
                                    "activities", Navigate(scrMEALActivities, ScreenTransition.None),
                                    "actions", Navigate(scrMELActions, ScreenTransition.None),
                                    "cfm", Navigate(scrCFM, ScreenTransition.None),
                                    "schedules", Navigate(scrReportSchedules, ScreenTransition.None),
                                    "visits", Navigate(scrFieldVisits, ScreenTransition.None),
                                    "studies", Navigate(scrMELStudies, ScreenTransition.None),
                                    Navigate(scrMEAL, ScreenTransition.None)
                                )
                              Text: |-
                                =Concatenate(
                                    If(gblLanguage = "Arabic", ThisItem.LabelAr, ThisItem.LabelEn),
                                    Char(10),
                                    Text(ThisItem.Count)
                                )
                              Width: =Parent.Width
            - lblMealAlertsHdr:
                Control: Label@2.5.1
                Properties:
