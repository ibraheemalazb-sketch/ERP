      - cmpFinNotif:
          Control: CanvasComponent
          ComponentName: cmpNotificationsPanel
          Properties:
            Busy: =
            Height: =Parent.Height
            Items: |-
              =ForAll(
                  colFinNotif As n,
                  {
                      ID: n.ID,
                      Title: n.Title,
                      Message: n.Message,
                      Created: n.Created,
                      Link: n.Link,
                      RelatedEntity: n.RelatedEntity.Value,
                      RelatedItemID: n.RelatedItemID
                  }
              )
            OnClose: |-
              =UpdateContext({locNotifOpen: false})
            OnMarkAllRead: =fnMarkAllNotificationsRead()
            OnOpenItem: |-
              =UpdateContext({locNotifOpen: false});
              fnOpenNotification(
                  cmpFinNotif.SelectedItem.ID,
                  cmpFinNotif.SelectedItem.RelatedEntity,
                  cmpFinNotif.SelectedItem.RelatedItemID,
                  cmpFinNotif.SelectedItem.Link
              )
            Visible: =locNotifOpen
            Width: =Parent.Width
