Screens:
  scrFinance:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varCurrentScreen, "Finance");
        Set(VarFinTab, Coalesce(VarFinTab, "Main"));
        Set(
            varNavSelectedID,
            Switch(
                VarFinTab,
                "Transactions", 52,
                "Budgets", 53,
                "BudgetLines", 55,
                "ProjectFinance", 56,
                51
            )
        )
    Children:
      - conFinNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpFinNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
                    If(!gblMenuExpanded, Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - cmpFinTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeColor: =
            BadgeCount: =Coalesce(unreadCount, 0)
            FontSizeTitle: =
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            HoverText: =
            IconColor: =
            IconSvg: =
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSearch: =
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectSubtitle: =
            OnSelectTitle: =Set(VarFinTab, "Main")
            ScreenSubtitle: =
            ScreenTitle: |-
              =Switch(
                  VarFinTab,
                  "Transactions", If(gblLanguage = "Arabic", "العمليات", "Transactions"),
                  "Budgets", If(gblLanguage = "Arabic", "الميزانيات", "Budgets"),
                  "BudgetLines", If(gblLanguage = "Arabic", "بنود الميزانية", "Budget lines"),
                  "ProjectFinance", If(gblLanguage = "Arabic", "مالية المشاريع", "Project finance"),
                  If(gblLanguage = "Arabic", "الرئيسية", "Main")
              )
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Size: =
            SubTitleWidth: =
            Theme: =gblTheme.Mode
            TitleWidth: =
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
      - cmpFinPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            SelectedID: =
            Visible: =App.Width < 700
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
      - conFinPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpFinPhone.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =16
            PaddingTop: =cmpFinTop.Height + 12
            Width: =Parent.Width
          Children:
            - galFinTabs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "أقسام المالية", "Finance sections")
                  DelayItemLoading: =false
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  Items: |-
                    =Table(
                        {Key: "Main", NavID: 51, Label: If(gblLanguage = "Arabic", "الرئيسية", "Main")},
                        {Key: "Transactions", NavID: 52, Label: If(gblLanguage = "Arabic", "العمليات", "Transactions")},
                        {Key: "Budgets", NavID: 53, Label: If(gblLanguage = "Arabic", "الميزانيات", "Budgets")},
                        {Key: "BudgetLines", NavID: 55, Label: If(gblLanguage = "Arabic", "البنود", "Budget lines")},
                        {Key: "ProjectFinance", NavID: 56, Label: If(gblLanguage = "Arabic", "المشاريع", "Project finance")}
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  OnSelect: |-
                    =Set(VarFinTab, ThisItem.Key);
                    Set(varNavSelectedID, ThisItem.NavID)
                  ShowScrollbar: =false
                  TemplatePadding: =4
                  TemplateSize: =If(Self.Width < 640, 140, Self.Width / 5)
                  Width: =Parent.Width
                Children:
                  - btnFinTab:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =ThisItem.Label
                        Appearance: =If(VarFinTab = ThisItem.Key, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                        Height: =36
                        OnSelect: =Select(Parent)
                        Text: =ThisItem.Label
                        Width: =Parent.TemplateWidth - 8
            - conFinDenied:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =160
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Visible: =!hasFinanceAccess
                  Width: =Parent.Width
                Children:
                  - lblFinDeniedTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =gblTheme.Typography.SectionTitle
                        Text: =If(gblLanguage = "Arabic", "لا توجد صلاحية للمالية", "No finance access")
                        Width: =Parent.Width
                  - lblFinDeniedBody:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =fxThemeColor("TextSecondary")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =48
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "اطلب من مسؤول المالية فتح هذه الوحدة لحسابك.", "Ask a finance manager if you need this module.")
                        Width: =Parent.Width
            - cmpFinKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AnimationEffect: ="None"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 4,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "Check",
                            Value: Coalesce(pendingApprovalCount, 0),
                            Label: If(gblLanguage = "Arabic", "موافقات بانتظارك", "Pending approvals"),
                            Subtitle: If(gblLanguage = "Arabic", "مركز الموافقات", "Approval center"),
                            Screen: "Approvals",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Money",
                            Value: Coalesce(unreadCount, 0),
                            Label: If(gblLanguage = "Arabic", "إشعارات غير مقروءة", "Unread"),
                            Subtitle: If(gblLanguage = "Arabic", "المالية", "Finance"),
                            Screen: "Notifications",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Wallet",
                            Value: "",
                            Label: If(gblLanguage = "Arabic", "طلبات الدفع", "Payment requests"),
                            Subtitle: If(gblLanguage = "Arabic", "فتح القائمة", "Open the list"),
                            Screen: "Payments",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Calculator",
                            Value: "",
                            Label: If(gblLanguage = "Arabic", "الميزانيات", "Budgets"),
                            Subtitle: If(gblLanguage = "Arabic", "فتح القائمة", "Open the list"),
                            Screen: "Budgets",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FontsSizesTitle: =
                  Height: =150
                  Icons: =
                  IconsSize: =
                  IsLoading: =
                  KPINav: |-
                    =Switch(
                        varClickScreen,
                        "Approvals", Navigate(ScrApprovalCenter, ScreenTransition.None),
                        "Notifications", UpdateContext({locNotifOpen: true}),
                        "Payments", Navigate(scrFinPayments, ScreenTransition.None),
                        "Budgets", Set(VarFinTab, "Budgets"); Set(varNavSelectedID, 53)
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: =
                  Style: =
                  StyleConfig: =
                  SubtitleFS: =
                  Theme: =
                  Visible: =hasFinanceAccess && VarFinTab = "Main"
                  Width: =Parent.Width
            - conFinWork:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(VarFinTab = "Main", 460, 280)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(And(VarFinTab = "Main", App.Width >= 1000), LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =hasFinanceAccess
                  Width: =Parent.Width
                Children:
                  - cmpFinActivity:
                      Control: CanvasComponent
                      ComponentName: cmpLastActivities
                      Properties:
                        FillPortions: =1
                        Height: =420
                        Items: |-
                          =ForAll(
                              FirstN(
                                  SortByColumns(FinanceActivityLog, "ActionDate", SortOrder.Descending),
                                  20
                              ) As log,
                              {
                                  ID: log.ID,
                                  Module: "Finance",
                                  ActivityType: Coalesce(log.EntityType.Value, "Finance"),
                                  Action: Coalesce(log.ActionType.Value, ""),
                                  Title: Coalesce(log.Title, Coalesce(log.ActionType.Value, "") & " · " & Coalesce(log.EntityType.Value, "")),
                                  EntityType: Coalesce(log.EntityType.Value, ""),
                                  EntityNumber: Coalesce(log.EntityNumber, ""),
                                  ProjectCode: Coalesce(log.ProjectCode, ""),
                                  ProjectId: Coalesce(log.ProjectID, 0),
                                  Amount: Coalesce(log.Amount, 0),
                                  Currency: Coalesce(log.Currency.Value, ""),
                                  IsSensitive: Coalesce(log.IsSensitive, false) && !canViewPayroll,
                                  Details: If(
                                      log.IsSensitive && !canViewPayroll,
                                      If(gblLanguage = "Arabic", "التفاصيل مخفية", "Details hidden (sensitive)"),
                                      Coalesce(log.Details, "")
                                  ),
                                  Description: If(
                                      log.IsSensitive && !canViewPayroll,
                                      If(gblLanguage = "Arabic", "التفاصيل مخفية", "Details hidden (sensitive)"),
                                      Coalesce(log.Details, "")
                                  ),
                                  ActorName: Coalesce(log.PerformedByName, ""),
                                  ActivityDate: log.ActionDate,
                                  RecordType: Coalesce(log.EntityType.Value, ""),
                                  RecordID: Coalesce(log.EntityID, 0),
                                  Severity: Switch(
                                      Coalesce(log.Severity.Value, "Info"),
                                      "Critical", "Critical",
                                      "Important", "Important",
                                      "Info"
                                  ),
                                  Status: Switch(
                                      Coalesce(log.Severity.Value, "Info"),
                                      "Critical", "Critical",
                                      "Important", "Important",
                                      "Info"
                                  ),
                                  Icon: Coalesce(log.ActionType.Value, "Finance")
                              }
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxItems: =12
                        OnSelect: |-
                          =Switch(
                              cmpFinActivity.SelectedActivity.RecordType,
                              "Payment Request",
                                  Set(varPRID, cmpFinActivity.SelectedActivity.RecordID);
                                  Navigate(scrFinPaymentDetail, ScreenTransition.None),
                              "Payroll Run",
                                  Set(varRunID, cmpFinActivity.SelectedActivity.RecordID);
                                  Navigate(scrFinPayrollRun, ScreenTransition.None),
                              "Budget",
                                  Set(varBudgetLineID, cmpFinActivity.SelectedActivity.RecordID);
                                  Navigate(scrFinBudgetDetail, ScreenTransition.None)
                          )
                        OnViewAll: =
                        Refresh: =
                        ShowSummary: =
                        ShowViewAll: =
                        Title: =If(gblLanguage = "Arabic", "آخر الحركات المالية", "Recent finance activity")
                        Visible: =VarFinTab = "Main"
                        Width: =If(App.Width >= 1000, Parent.Width * 0.58, Parent.Width)
                  - conFinLinks:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =If(VarFinTab = "Main", 420, 260)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(And(VarFinTab = "Main", App.Width >= 1000), Parent.Width * 0.4, Parent.Width)
                      Children:
                        - lblFinLinks:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.SectionTitle
                              Text: |-
                                =Switch(
                                    VarFinTab,
                                    "Transactions", If(gblLanguage = "Arabic", "العمليات المالية", "Transactions"),
                                    "Budgets", If(gblLanguage = "Arabic", "الميزانيات", "Budgets"),
                                    "BudgetLines", If(gblLanguage = "Arabic", "بنود الميزانية", "Budget lines"),
                                    "ProjectFinance", If(gblLanguage = "Arabic", "مالية المشروع", "Project finance"),
                                    If(gblLanguage = "Arabic", "فتح سجل", "Open a register")
                                )
                              Width: =Parent.Width
                        - lblFinLinksHint:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.BodySmall
                              Text: |-
                                =Switch(
                                    VarFinTab,
                                    "Transactions", If(gblLanguage = "Arabic", "الدفع والدفتر والالتزامات وصندوق الموافقات.", "Payments, the ledger, commitments, and the finance inbox."),
                                    "Budgets", If(gblLanguage = "Arabic", "خطوط الميزانية تُفتح من القائمة.", "Budget lines open from the budget list."),
                                    "BudgetLines", If(gblLanguage = "Arabic", "نفس قائمة الميزانية. اختر بنداً لفتحه.", "Same budget list. Open a line from a row."),
                                    "ProjectFinance", If(gblLanguage = "Arabic", "نظرة المشروع والتمويل.", "Project overview and donor funding."),
                                    If(gblLanguage = "Arabic", "القائمة اليسرى هي قائمة التطبيق، وليست قائمة مالية ثانية.", "The left menu is the app menu, not a second finance menu.")
                                )
