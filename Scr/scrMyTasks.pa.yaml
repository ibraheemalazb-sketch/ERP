Screens:
  scrMyTasks:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PTasks");
        Set(varNavSelectedID, 24);
        Set(varTkScope, "my");
        If(IsBlank(varMtQuick), Set(varMtQuick, "open"));
        If(IsBlank(varMtStatus), Set(varMtStatus, "All"));
        If(IsBlank(varMtView), Set(varMtView, "table"));
        If(IsBlank(varMtPane), Set(varMtPane, "details"));
        If(IsBlank(varMtArchived), Set(varMtArchived, false));
        If(IsBlank(varMtKpiOpen), Set(varMtKpiOpen, false));
        Set(varMtDlg, false);
        If(
            varMtFromEditor,
            Set(varMtFromEditor, false);
            Set(varMtSelID, Coalesce(If(Coalesce(gblSelectedTaskID, 0) > 0, gblSelectedTaskID), varEditingTask.ID, varMtSelID, 0));
            Set(gblSelectedTaskID, 0)
        );
        Reset(cmpMtView);
        Reset(cmpMtTable);
        Select(btnMtReload)
    Children:
      - conMtSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMtReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMtMe, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMtMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, ""));
                    Set(varMtIsAdmin, Coalesce(gblUser.Role, "") in ["System Administrator", "Administrator", "Admin"]);
                    With(
                        {p: LookUp(colUserPermissions, Module.Value = "Projects")},
                        Set(varMtCanEdit, Or(varMtIsAdmin, Coalesce(p.CanEdit, false)));
                        Set(varMtCanCreate, Or(varMtIsAdmin, Coalesce(p.CanCreate, false)));
                        Set(
                            varMtScope,
                            If(
                                Or(varMtIsAdmin, Coalesce(p.CanViewAll, false), Coalesce(p.Scope.Value, "") = "All"),
                                "All",
                                Coalesce(p.Scope.Value, "Own")
                            )
                        )
                    );
                    Set(varMtErr, false);
                    Clear(colMtRaw);
                    IfError(
                        Collect(colMtRaw, Filter(ProjectsTasks, AssignedToID = varMtMe));
                        true,
                        Set(varMtErr, true)
                    );
                    ClearCollect(colMtTasks, ForAll(Distinct(colMtRaw, ID) As d, LookUp(colMtRaw, ID = d.Value)));
                    IfError(
                        ClearCollect(colMtProjAll, Projects);
                        true,
                        Set(varMtErr, true)
                    );
                    ClearCollect(colMtProjects, SortByColumns(Filter(colMtProjAll, ID in colMtTasks.ProjectID), "ProjectCode", SortOrder.Ascending));
                    ClearCollect(
                        colMtRows,
                        AddColumns(
                            colMtTasks,
                            StatusText, Coalesce(Status.Value, "Not Started"),
                            PriorityText, Coalesce(Priority.Value, "-"),
                            ProjectText, Coalesce(Project.Value, ""),
                            AssigneeText, Coalesce(AssignedTo.Value, ""),
                            ActivityText, Coalesce(Activity.Value, ""),
                            IsOpen, Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"]),
                            IsOverdue, And(Not(IsBlank(DueDate)), DueDate < Today(), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"])),
                            IsDueSoon, And(Not(IsBlank(DueDate)), DueDate >= Today(), DueDate <= DateAdd(Today(), 7, TimeUnit.Days), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"])),
                            DaysLeft, If(IsBlank(DueDate), 9999, DateDiff(Today(), DueDate, TimeUnit.Days)),
                            ProgressPct, Min(100, Max(0, Coalesce(Progress, 0))),
                            StatusGroup, Switch(
                                Coalesce(Status.Value, "Not Started"),
                                "In Progress", "doing",
                                "On Hold", "hold",
                                "Pending Approval", "review",
                                "In Review", "review",
                                "Completed", "done",
                                "Cancelled", "cancelled",
                                "todo"
                            ),
                            PriorityTone, With(
                                {pv: Coalesce(Priority.Value, "")},
                                If(
                                    Or("P1" in pv, "P2" in pv, "Critical" in pv, "High" in pv, "Urgent" in pv),
                                    "high",
                                    Or("P3" in pv, "Medium" in pv),
                                    "medium",
                                    "low"
                                )
                            )
                        )
                    );
                    ClearCollect(
                        colMtAssignees,
                        SortByColumns(
                            Filter(
                                ForAll(
                                    Distinct(colMtTasks, AssignedToID) As d,
                                    {ID: Coalesce(d.Value, 0), FullName: Coalesce(LookUp(colMtTasks, AssignedToID = d.Value).AssignedTo.Value, "")}
                                ),
                                ID > 0
                            ),
                            "FullName",
                            SortOrder.Ascending
                        )
                    );
                    Set(varMtSel, LookUp(colMtRows, ID = varMtSelID));
                    If(IsBlank(varMtSel), Set(varMtSelID, 0), Select(btnMtDetail));
                    If(
                        varMtErr,
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل بعض المهام.", "Some tasks could not be loaded."), NotificationType.Warning)
                    )
                  Text: ="Reload"
                  Visible: =false
                  Width: =1
            - btnMtDetail:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Clear(colMtPeople);
                    With(
                        {pr: LookUp(colMtProjAll, ID = varMtSel.ProjectID)},
                        ForAll(
                            Filter(
                                Distinct(
                                    Table(
                                        {v: Coalesce(varMtSel.AssignedToID, 0)},
                                        {v: Coalesce(varMtSel.AssignedByID, 0)},
                                        {v: Coalesce(varMtSel.ReviewerID, 0)},
                                        {v: Coalesce(pr.ProjectManagerID, pr.ProjectManager.Id, 0)}
                                    ),
                                    v
                                ),
                                Value > 0
                            ) As u,
                            With({e: LookUp(Employees, ID = u.Value)}, If(Not(IsBlank(e)), Collect(colMtPeople, e)))
                        )
                    );
                    IfError(
                        ClearCollect(
                            colMtLog,
                            SortByColumns(Filter(ProjectActivityLog, EntityID = varMtSel.ID, EntityType.Value = "Task"), "ID", SortOrder.Descending)
                        );
                        true,
                        Clear(colMtLog);
                        true
                    )
                  Text: ="Detail"
                  Visible: =false
                  Width: =1
            - btnMtAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMtOk, true);
                    Set(varMtNote, Trim(txtMtDlgNote.Text));
                    Set(varMtCur, LookUp(ProjectsTasks, ID = varMtSel.ID));
                    Set(varMtOldStatus, Coalesce(varMtCur.Status.Value, "Not Started"));
                    Set(
                        varMtNewStatus,
                        Switch(varMtOp, "start", "In Progress", "resume", "In Progress", "complete", "Completed", "block", "On Hold", "reopen", "Reopened", varMtOldStatus)
                    );
                    If(
                        IsBlank(varMtCur),
                        Set(varMtOk, false);
                        Notify(If(gblLanguage = "Arabic", "لم يتم العثور على المهمة.", "The task could not be found."), NotificationType.Error),
                        Not(Or(varMtCur.AssignedToID = varMtMe, varMtCur.AssignedByID = varMtMe, varMtCanEdit)),
                        Set(varMtOk, false);
                        Notify(If(gblLanguage = "Arabic", "ليست لديك صلاحية تغيير حالة هذه المهمة.", "You do not have permission to change this task."), NotificationType.Error),
                        Not(Switch(
                            varMtOp,
                            "start", varMtOldStatus in ["Not Started", "Reopened"],
                            "resume", varMtOldStatus = "On Hold",
                            "complete", Not(varMtOldStatus in ["Completed", "Cancelled"]),
                            "block", varMtOldStatus in ["Not Started", "In Progress", "Reopened"],
                            "reopen", varMtOldStatus = "Completed",
                            false
                        )),
                        Set(varMtOk, false);
                        Notify(If(gblLanguage = "Arabic", "تغيرت حالة المهمة. تم تحديث القائمة.", "The task status has changed. The list has been refreshed."), NotificationType.Warning);
                        Select(btnMtReload),
                        And(varMtOp = "block", IsBlank(varMtNote)),
                        Set(varMtOk, false);
                        Notify(If(gblLanguage = "Arabic", "الرجاء كتابة سبب التعليق.", "Please enter the reason the task is on hold."), NotificationType.Warning)
                    );
                    If(
                        varMtOk,
                        IfError(
                            Set(
                                varMtPatched,
                                Patch(
                                    ProjectsTasks,
                                    varMtCur,
                                    {
                                        Status: {Value: varMtNewStatus},
                                        ActualStart: If(And(varMtOp in ["start", "resume", "complete"], IsBlank(varMtCur.ActualStart)), Today(), varMtCur.ActualStart),
                                        CompletedDate: Switch(varMtOp, "complete", Today(), "reopen", If(false, Today()), varMtCur.CompletedDate),
                                        Progress: Switch(varMtOp, "complete", 100, "reopen", Min(Coalesce(varMtCur.Progress, 0), 90), Coalesce(varMtCur.Progress, 0)),
                                        ReturnCount: If(varMtOp = "reopen", Coalesce(varMtCur.ReturnCount, 0) + 1, varMtCur.ReturnCount)
                                    }
                                )
                            ),
                            Set(varMtOk, false);
                            Notify(If(gblLanguage = "Arabic", "تعذر تحديث المهمة. حاول مرة أخرى.", "The task could not be updated. Please try again."), NotificationType.Error)
                        )
                    );
                    If(And(varMtOk, IsBlank(varMtPatched)), Set(varMtOk, false));
                    If(
                        varMtOk,
                        With(
                            {
                                pr: LookUp(colMtProjAll, ID = varMtPatched.ProjectID),
                                act: Switch(varMtOp, "start", "Started", "resume", "Resumed", "complete", "Completed", "block", "Blocked", "reopen", "Reopened", "Updated")
                            },
                            fnProjLog(
                                "Task: " & varMtPatched.Title,
                                Coalesce(varMtPatched.ProjectID, 0),
                                Coalesce(pr.ProjectCode, varMtPatched.Project.Value, ""),
                                "Task",
                                varMtPatched.ID,
                                act,
                                varMtOldStatus & " → " & varMtNewStatus & If(IsBlank(varMtNote), "", ": " & varMtNote)
                            );
                            ClearCollect(
                                colMtNotice,
                                Filter(
                                    Table(
                                        {UserID: Coalesce(varMtPatched.AssignedToID, 0), UserName: Coalesce(varMtPatched.AssignedTo.Value, "")},
                                        {UserID: Coalesce(varMtPatched.AssignedByID, 0), UserName: Coalesce(LookUp(Employees, ID = Coalesce(varMtPatched.AssignedByID, -1)).FullName, "")},
                                        {UserID: Coalesce(pr.ProjectManagerID, pr.ProjectManager.Id, 0), UserName: Coalesce(pr.ProjectManager.Value, "")}
                                    ),
                                    And(UserID > 0, UserID <> varMtMe)
                                )
                            );
                            ForAll(
                                ForAll(Distinct(colMtNotice, UserID), LookUp(colMtNotice, UserID = Value)) As person,
                                fnProjNotify(
                                    person.UserID,
                                    person.UserName,
                                    varMtPatched.Title,
                                    If(
                                        gblLanguage = "Arabic",
                                        varMtMeName & " غيّر حالة المهمة إلى " & varMtNewStatus & If(IsBlank(varMtNote), "", ": " & varMtNote),
                                        varMtMeName & " changed the task status to " & varMtNewStatus & If(IsBlank(varMtNote), "", ": " & varMtNote)
                                    ),
                                    "Task",
                                    varMtPatched.ID,
                                    "Task"
                                )
                            )
                        );
                        Set(varMtDlg, false);
                        Set(varMtSelID, varMtPatched.ID);
                        Select(btnMtReload);
                        Notify(
                            If(gblLanguage = "Arabic", "تم تحديث حالة المهمة إلى " & varMtNewStatus & ".", "Task status changed to " & varMtNewStatus & "."),
                            NotificationType.Success
                        )
                    )
                  Text: ="Act"
                  Visible: =false
                  Width: =1
      - conMtPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(And(App.Width < 700, IsBlank(varMtSel)), cmpMtPhone.Height, 0) + If(IsBlank(varMtSel), 80, 16)
            PaddingLeft: =If(App.Width < 700, 15, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth + 12, gblTheme.Controls.SideNavCollapsedWidth + 12))
            PaddingRight: =8
            PaddingTop: =cmpMtTop.Height + 12
            Width: =Parent.Width
          Children:
            - conMtList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 40
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsBlank(varMtSel)
                  Width: =Parent.Width
                Children:
                  - conMtHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conMtHeadIcon:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("PrimaryLight")
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =44
                            Children:
                              - imgMtHeadIcon:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =22
                                    Image: =fxSvg("List", fxThemeInk("Primary"))
                                    Width: =22
                        - conMtHeadText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =44
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                            Children:
                              - lblMtTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =24
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =If(gblLanguage = "Arabic", "مهامي", "My tasks")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblMtSubtitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =If(gblLanguage = "Arabic", "المهام المسندة إليك", "Tasks assigned to you") & " · " & Text(CountRows(colMtRows)) & If(gblLanguage = "Arabic", " مهمة", " tasks")
                                    Width: =Parent.Width
                                    Wrap: =false
                        - btnMtMine:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              Icon: ="People"
                              OnSelect: |-
                                =Set(varTkScope, "all");
                                Set(varNavSelectedID, 29);
                                Navigate(scrTasks, ScreenTransition.None)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "كل المهام", "All tasks"))
                              Width: =If(App.Width < 700, 44, 120)
                        - btnMtRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              Icon: ="ArrowSync"
                              OnSelect: =Select(btnMtReload)
                              Text: =""
                              Width: =44
                        - btnMtNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              Icon: ="Add"
                              OnSelect: |-
                                =Set(varEditorEntity, "Task");
                                Set(varParentActivity, Blank());
                                Set(varTkPresetActivityID, 0);
                                Set(varReturnScreen, "MyTasks");
                                Set(varMeID, varMtMe);
                                Set(varMtFromEditor, true);
                                Set(varEditorMode, "New");
                                Set(varEditingTask, Blank());
                                Set(varSelectedProject, If(IsBlank(cmbMtProject.Selected), Blank(), LookUp(Projects, ID = cmbMtProject.Selected.ID)));
                                Navigate(scrProjectEditor, ScreenTransition.Cover)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "مهمة جديدة", "New task"))
                              Visible: =varMtCanCreate
                              Width: =140
                  - btnMtKpi:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =32
                        Icon: =If(varMtKpiOpen, "ChevronUp", "ChevronDown")
                        OnSelect: =Set(varMtKpiOpen, Not(Coalesce(varMtKpiOpen, false)))
                        Text: |-
                          =If(
                              varMtKpiOpen,
                              If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                              If(gblLanguage = "Arabic", "عرض المؤشرات", "View KPIs")
                          )
                        Visible: =App.Width < 700
                        Width: =Parent.Width
                  - cmpMtKpi:
                      Control: CanvasComponent
                      ComponentName: cmpKPIwNav
                      Properties:
                        AnimationEffect: ="None"
                        ColumnsLayout: |-
                          ={
                              Mobile: 2,
                              Tablet: 2,
                              Desktop: 4,
                              MobileBreakpoint: 700,
                              TabletBreakpoint: 1100,
                              DesktopBreakpoint: 1366
                          }
                        Data: |-
                          =Table(
                              {
                                  ID: 1,
                                  Icon: "List",
                                  Value: CountRows(Filter(colMtRows, IsOpen, Or(varMtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "مفتوحة", "Open"),
                                  Subtitle: If(gblLanguage = "Arabic", "لم تكتمل", "Still open"),
                                  Screen: "open",
                                  IconBg: If(gblTheme.Mode = "Dark", "#172030", "#ECF2FF"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 2,
                                  Icon: "Warning",
                                  Value: CountRows(Filter(colMtRows, IsOverdue, Or(varMtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "متأخرة", "Overdue"),
                                  Subtitle: If(gblLanguage = "Arabic", "تجاوزت الاستحقاق", "Past the due date"),
                                  Screen: "overdue",
                                  IconBg: If(gblTheme.Mode = "Dark", "#450A0A", "#FEF2F2"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 3,
                                  Icon: "Clock",
                                  Value: CountRows(Filter(colMtRows, IsDueSoon, Or(varMtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "خلال 7 أيام", "Due in 7 days"),
                                  Subtitle: If(gblLanguage = "Arabic", "تستحق قريباً", "Coming due"),
                                  Screen: "soon",
                                  IconBg: If(gblTheme.Mode = "Dark", "#5C400E", "#FFFBEB"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 4,
                                  Icon: "Check",
                                  Value: CountRows(Filter(colMtRows, StatusText = "Completed", Or(varMtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "مكتملة", "Completed"),
                                  Subtitle: If(gblLanguage = "Arabic", "أُنجزت", "Finished tasks"),
                                  Screen: "done",
                                  IconBg: If(gblTheme.Mode = "Dark", "#14532D", "#F0FDF4"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                                  SparklineData: "",
                                  isHidden: false
                              }
                          )
                        FontsSizesTitle: =12
                        Height: |-
                          =If(
                              Or(App.Width >= 700, Coalesce(varMtKpiOpen, false)),
                              With({cols: If(Parent.Width < 700, 2, 4)}, RoundUp(4 / cols, 0) * 108),
                              0
                          )
                        Icons: |-
                          =Table({Name: "List", SVG: ""})
                        IconsSize: =20
                        IsLoading: =false
                        KPINav: =
                        OnCardClick: |-
                          =Set(varMtQuick, Coalesce(varClickScreen, "open"));
                          Set(varMtStatus, "All");
                          Reset(cmbMtStatus)
                        Style: ="Compact"
                        StyleConfig: =
                        Theme: =gblTheme.Mode
                        Visible: =Or(App.Width >= 700, Coalesce(varMtKpiOpen, false))
                        Width: =Parent.Width
                  - conMtTools:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =If(App.Width < 700, 150, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        Width: =Parent.Width
                      Children:
                        - txtMtSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في المهام", "Search tasks")
                              Height: =40
                              Placeholder: =If(gblLanguage = "Arabic", "ابحث بالعنوان أو المشروع أو النشاط", "Search title, project, activity")
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 220)
                        - cmbMtStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              DefaultSelectedItems: |-
                                =Filter(Table(
                                    {Key: "All", Label: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {Key: "Not Started", Label: If(gblLanguage = "Arabic", "لم تبدأ", "Not started")},
                                    {Key: "In Progress", Label: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress")},
                                    {Key: "On Hold", Label: If(gblLanguage = "Arabic", "معلّقة", "On hold")},
                                    {Key: "Pending Approval", Label: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending approval")},
                                    {Key: "In Review", Label: If(gblLanguage = "Arabic", "قيد المراجعة", "In review")},
                                    {Key: "Reopened", Label: If(gblLanguage = "Arabic", "أعيد فتحها", "Reopened")},
                                    {Key: "Completed", Label: If(gblLanguage = "Arabic", "مكتملة", "Completed")},
                                    {Key: "Cancelled", Label: If(gblLanguage = "Arabic", "ملغاة", "Cancelled")}
                                ), Key = Coalesce(varMtStatus, "All"))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Label
                              Items: |-
                                =Table(
                                    {Key: "All", Label: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {Key: "Not Started", Label: If(gblLanguage = "Arabic", "لم تبدأ", "Not started")},
                                    {Key: "In Progress", Label: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress")},
                                    {Key: "On Hold", Label: If(gblLanguage = "Arabic", "معلّقة", "On hold")},
                                    {Key: "Pending Approval", Label: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending approval")},
                                    {Key: "In Review", Label: If(gblLanguage = "Arabic", "قيد المراجعة", "In review")},
                                    {Key: "Reopened", Label: If(gblLanguage = "Arabic", "أعيد فتحها", "Reopened")},
                                    {Key: "Completed", Label: If(gblLanguage = "Arabic", "مكتملة", "Completed")},
                                    {Key: "Cancelled", Label: If(gblLanguage = "Arabic", "ملغاة", "Cancelled")}
                                )
                              OnChange: |-
                                =Set(varMtStatus, Coalesce(Self.Selected.Key, "All"));
                                If(varMtStatus <> "All", Set(varMtQuick, "all"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 160)
                        - cmbMtPriority:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الأولويات", "All priorities")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ProjectsTasks.Priority)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 150)
                        - cmbMtProject:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =colMtProjects
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 160)
                        - btnMtArchived:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varMtArchived, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              Height: =40
                              Icon: ="Folder"
                              OnSelect: =Set(varMtArchived, Not(varMtArchived))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "المؤرشفة", "Archived"))
                              Width: =If(App.Width < 700, 44, 120)
                        - btnMtClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =40
                              Icon: ="Dismiss"
                              OnSelect: |-
                                =Reset(txtMtSearch);
                                Reset(cmbMtPriority);
                                Reset(cmbMtProject);
                                Set(varMtStatus, "All");
                                Reset(cmbMtStatus);
                                Set(varMtQuick, "open");
                                Set(varMtArchived, false)
                              Text: =If(gblLanguage = "Arabic", "مسح", "Clear")
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 100)
                        - cmpMtView:
                            Control: CanvasComponent
                            ComponentName: cmpSegmentedControl
                            Properties:
                              DefaultValue: =varMtView
                              DisplayMode: ="Both"
                              EqualWidth: =true
                              Height: =40
                              IconPosition: ="Left"
                              OnChange: =Set(varMtView, cmpMtView.SelectedValue)
                              Options: |-
                                =Table(
                                    {Value: "table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                    {Value: "list", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                )
                              Size: ="Medium"
                              Visible: =App.Width >= 700
                              Width: =188
                  - cmpMtTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =148
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
                        EmptyTitle: =If(gblLanguage = "Arabic", "لا توجد مهام", "No tasks")
                        EnableHover: =true
                        EnableMenu: =false
                        HeaderColumn1: =If(gblLanguage = "Arabic", "الاستحقاق", "Due")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        HeaderColumn3: =If(gblLanguage = "Arabic", "النشاط", "Activity")
                        HeaderHeight: =40
                        HeaderPerson: =If(gblLanguage = "Arabic", "المكلّف", "Assignee")
                        HeaderPriority: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                        HeaderProgress: =If(gblLanguage = "Arabic", "الإنجاز", "Progress")
                        HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "النشاط", "Activity")
                        HeaderTitle: =If(gblLanguage = "Arabic", "المهمة", "Task")
                        HeaderWhen: =If(gblLanguage = "Arabic", "الاستحقاق", "Due")
                        Height: =Max(420, App.Height - cmpMtTop.Height - If(App.Width < 700, cmpMtPhone.Height, 0) - 330)
                        Items: |-
                          =ForAll(
                              Sort(
                                  Filter(
                                      colMtRows,
                                      Or(varMtArchived, Not(Coalesce(IsArchived, false))),
                                      Switch(varMtQuick, "open", IsOpen, "overdue", IsOverdue, "soon", IsDueSoon, "done", StatusText = "Completed", true),
                                      Or(varMtStatus = "All", StatusText = varMtStatus),
                                      Or(IsBlank(cmbMtPriority.Selected), PriorityText = cmbMtPriority.Selected.Value),
                                      Or(IsBlank(cmbMtProject.Selected), ProjectID = cmbMtProject.Selected.ID),
                                      Or(
                                          IsBlank(Trim(txtMtSearch.Text)),
                                          Trim(txtMtSearch.Text) in Title,
                                          Trim(txtMtSearch.Text) in ProjectText,
                                          Trim(txtMtSearch.Text) in AssigneeText,
                                          Trim(txtMtSearch.Text) in ActivityText
                                      )
                                  ),
                                  DaysLeft,
                                  SortOrder.Ascending
                              ) As task,
                              {
                                  RowKey: Text(task.ID),
                                  Title: Coalesce(task.Title, "-"),
                                  Subtitle: Coalesce(task.ActivityText, "-"),
                                  Column1: If(IsBlank(task.DueDate), "-", Text(task.DueDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(task.ProjectText, "-"),
                                  Column3: Coalesce(task.ActivityText, "-"),
                                  Status: task.StatusText,
                                  Tone: If(task.IsOverdue, "danger", fxStatusPillTone(task.StatusText)),
                                  Priority: task.PriorityText,
                                  PriorityTone: task.PriorityTone,
                                  Person: If(IsBlank(task.AssigneeText), "-", task.AssigneeText),
                                  WhenText: If(IsBlank(task.DueDate), "-", Text(task.DueDate, "dd-mmm-yyyy")),
                                  ProgressDone: task.ProgressPct,
                                  ProgressTotal: 100,
                                  IconName: "Clipboard"
                              }
                          )
                        LayoutMinHeight: =360
                        LayoutMinWidth: =0
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colMtRows, ID = Value(cmpMtTable.SelectedItem.RowKey))},
                              Set(varMtSelID, row.ID);
                              Set(varMtSel, row);
                              Set(varMtPane, "details");
                              Select(btnMtDetail)
                          )
                        RowHeight: =52
                        ShowAction: =false
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =true
                        ShowHeader: =true
                        ShowId: =false
                        ShowPerson: =true
                        ShowPriority: =true
                        ShowProgress: =true
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
                        SubtitleAsPill: =true
                        TitleBold: =true
                        ViewMode: =If(App.Width < 700, "list", Coalesce(varMtView, "table"))
                        Width: =Parent.Width
                        WidthColumn1: =120
                        WidthColumn2: =120
                        WidthColumn3: =140
                        WidthPerson: =150
                        WidthPriority: =90
                        WidthProgress: =110
                        WidthStatus: =120
                        WidthSubtitle: =0
                        WidthTitle: =220
                        WidthWhen: =120
            - conMtDetail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
