                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
