      - btnPRQuery:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({
                  locLoading: true, locError: false,
                  locQ: {
                      Project: Coalesce(varProjectID, 0),
                      Status: cmpFilterBar_PR.SelectedStatus,
                      Search: cmpFilterBar_PR.SearchText,
                      From: dtePRFrom.SelectedDate,
                      To: If(IsBlank(dtePRTo.SelectedDate), Blank(), DateAdd(dtePRTo.SelectedDate, 1, TimeUnit.Days)),
                      Requester: Coalesce(drpPRReq.Selected.Key, 0)
                  }
              });
              UpdateContext({locPerProject: locTab = "all" && !canViewAllProjects && locQ.Project = 0});
              IfError(
                  Switch(
                      locTab,
                      // ---- Prepared by me (any project): one delegable query, keyset paging on ID
                      "mine",
                      ClearCollect(
                          colPRPage,
                      ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      PreparedByID = varMeID,
                                      locQ.Project = 0 || ProjectID = locQ.Project,
                                      IsBlank(locQ.Status) || RequestStatus.Value = locQ.Status,
                                      IsBlank(locQ.Search) || StartsWith(RequestNumber, locQ.Search),
                                      IsBlank(locQ.From) || RequestDate >= locQ.From,
                                      IsBlank(locQ.To) || RequestDate < locQ.To,
                                      locQ.Requester = 0 || PreparedByID = locQ.Requester,
                                      locCursor = 0 || ID < locCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      )
                      ),
                      // ---- Pending for me: one small query per approval stage I can act on, deduplicated locally
                      "pending",
                      Clear(colPRPendA); Clear(colPRPendB); Clear(colPRPendC);
                      Concurrent(
                          // finance check: finance manager -> all projects; finance officer -> projects where FinanceID = me
                          If(
                              isFinanceManager && canViewAllProjects,
                              Collect(colPRPendA, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      FinanceOfficerApproved = false,
                                      RequestStatus.Value = cfgPRStatus.Pending
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      )),
                              isFinanceOfficer || isFinanceManager,
                              ForAll(
                                  Filter(colMyProjects, FinanceID = varMeID) As p,
                                  Collect(colPRPendA, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      ProjectID = p.ID,
                                      FinanceOfficerApproved = false,
                                      RequestStatus.Value = cfgPRStatus.Pending
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      ))
                              )
                          ),
                          // project manager approval: projects where ManagerID = me
                          If(
                              canApprove,
                              ForAll(
                                  Filter(colMyProjects, ManagerID = varMeID) As p,
                                  Collect(colPRPendB, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      ProjectID = p.ID,
                                      FinanceOfficerApproved = true,
                                      ProjectManagerApproved = false,
                                      RequestStatus.Value = cfgPRStatus.Pending
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      ))
                              )
                          ),
                          // finance manager approval + approved requests waiting for payment
                          If(
                              isFinanceManager && canApprove,
                              Collect(colPRPendC, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      FinanceOfficerApproved = true,
                                      ProjectManagerApproved = true,
                                      FinanceManagerApproved = false,
                                      RequestStatus.Value = cfgPRStatus.Pending
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      ));
                              Collect(colPRPendC, Filter(ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      RequestStatus.Value = cfgPRStatus.Approved
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      ), PaymentStatus <> cfgPRPaymentStatus.Paid))
                          )
                      );
                      ClearCollect(colPRPend, colPRPendA, colPRPendB, colPRPendC);
                      // dedupe + segregation of duties: my own requests are never "pending for me"
                      ClearCollect(
                          colPRPage,
                          Sort(
                              ForAll(Distinct(Filter(colPRPend, PreparedByID <> varMeID), ID) As d, LookUp(colPRPend, ID = d.Value)),
                              ID,
                              SortOrder.Descending
                          )
                      ),
                      // ---- All (default)
                      If(
                          locPerProject,
                          // scoped user, "All my projects": latest page per project (no paging; pick a project to page further)
                          Clear(colPRPage);
                          ForAll(
                              colMyProjects As p,
                              Collect(colPRPage, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      ProjectID = p.ID,
                                      IsBlank(locQ.Status) || RequestStatus.Value = locQ.Status,
                                      IsBlank(locQ.Search) || StartsWith(RequestNumber, locQ.Search),
                                      IsBlank(locQ.From) || RequestDate >= locQ.From,
                                      IsBlank(locQ.To) || RequestDate < locQ.To,
                                      locQ.Requester = 0 || PreparedByID = locQ.Requester
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      ))
                          );
                          ClearCollect(colPRPage, Sort(colPRPage, ID, SortOrder.Descending)),
                          ClearCollect(
                              colPRPage,
                          ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PaymentRequests,
                                      locQ.Project = 0 || ProjectID = locQ.Project,
                                      IsBlank(locQ.Status) || RequestStatus.Value = locQ.Status,
                                      IsBlank(locQ.Search) || StartsWith(RequestNumber, locQ.Search),
                                      IsBlank(locQ.From) || RequestDate >= locQ.From,
                                      IsBlank(locQ.To) || RequestDate < locQ.To,
                                      locQ.Requester = 0 || PreparedByID = locQ.Requester,
                                      locCursor = 0 || ID < locCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As r,
                          {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, Checked: r.FinanceOfficerApproved, PMApproved: r.ProjectManagerApproved, FMApproved: r.FinanceManagerApproved, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)}
                      )
                          )
                      )
                  ),
                  UpdateContext({locError: true});
                  Trace("Payment request query failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false})
