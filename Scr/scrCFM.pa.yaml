Screens:
  scrCFM:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "CFM");
        Set(varNavSelectedID, 79);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealCFMMode), Set(varMealCFMMode, "list"));
        If(IsBlank(varMealCFMQ), Set(varMealCFMQ, ""));
        Set(varMealCFMError, false);
        Set(varMealCFMCanSensitive, fnMealCanSeeSensitive());
        Select(btnMealCFMLoad)
    Children:
      - conMealCFMSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealCFMLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealCFMError, false);
                    Set(varMealCFMCanSensitive, fnMealCanSeeSensitive());
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealCFMList,
                                FirstN(
                                    SortByColumns(
                                        If(
                                            Coalesce(varMealCFMFltProject.ID, 0) > 0,
                                            Filter(Complainants, ProjectID = varMealCFMFltProject.ID),
                                            Complainants
                                        ),
                                        "Modified",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            ClearCollect(
                                colMealCFMPeople,
                                FirstN(SortByColumns(Filter(Employees, Status.Value = "Active"), "FullName", SortOrder.Ascending), 300)
                            )
                        );
                        ClearCollect(
                            colMealCFMView,
                            Filter(
                                colMealCFMList,
                                And(
                                    Or(
                                        IsBlank(Trim(Coalesce(varMealCFMQ, ""))),
                                        Trim(varMealCFMQ) in Coalesce(ComplaintNumber, ""),
                                        Trim(varMealCFMQ) in Coalesce(ComplaintCategory.Value, ""),
                                        Trim(varMealCFMQ) in Coalesce(Site, ""),
                                        Trim(varMealCFMQ) in Coalesce(Project.Value, "")
                                    ),
                                    Or(IsBlank(varMealCFMFltChannel), CFMChannel.Value = varMealCFMFltChannel),
                                    Or(IsBlank(varMealCFMFltCategory), ComplaintCategory.Value = varMealCFMFltCategory),
                                    Or(IsBlank(varMealCFMFltPriority), Priority.Value = varMealCFMFltPriority),
                                    Or(IsBlank(varMealCFMFltStatus), Status.Value = varMealCFMFltStatus)
                                )
                            )
                        );
                        ClearCollect(
                            colMealCFMKPIs,
                            {
                                Key: "open",
                                LabelEn: "Open",
                                LabelAr: "مفتوحة",
                                Count: CountRows(Filter(colMealCFMList, Status.Value = "Open")),
                                Tone: "warning"
                            },
                            {
                                Key: "overdue",
                                LabelEn: "Overdue",
                                LabelAr: "متأخرة",
                                Count: CountRows(Filter(colMealCFMList, And(Status.Value = "Open", Not(IsBlank(DueDate)), DueDate < Today()))),
                                Tone: "danger"
                            },
                            {
                                Key: "closed",
                                LabelEn: "Closed",
                                LabelAr: "مغلقة",
                                Count: CountRows(Filter(colMealCFMList, Status.Value = "Closed")),
                                Tone: "success"
                            },
                            {
                                Key: "ontime",
                                LabelEn: "Within timeframe",
                                LabelAr: "ضمن المهلة",
                                Count: CountRows(Filter(colMealCFMList, Or(WithinTimeFrame = true, Lower(Trim(Text(WithinTimeFrame))) = "yes", Lower(Trim(Text(WithinTimeFrame))) = "true"))),
                                Tone: "info"
                            },
                            {
                                Key: "satis",
                                LabelEn: "Satisfaction notes",
                                LabelAr: "ملاحظات الرضا",
                                Count: CountRows(Filter(colMealCFMList, Not(IsBlank(Trim(Coalesce(FeedbackSatisfaction, "")))))),
                                Tone: "neutral"
                            }
                        );
                        If(Coalesce(varSelectedComplaint.ID, 0) > 0, Set(varSelectedComplaint, LookUp(Complainants, ID = varSelectedComplaint.ID))),
                        Set(varMealCFMError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل الشكاوى.", "Could not load complaints."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealCFMSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealCFMMode, "") = "new",
                            proj: cmbMealCFMEdProject.Selected,
                            asg: cmbMealCFMEdAssigned.Selected,
                            recv: cmbMealCFMEdReceived.Selected,
                            canSens: varMealCFMCanSensitive
                        },
                        If(
                            Or(IsBlank(Trim(txtMealCFMEdNumber.Text)), IsBlank(proj), Coalesce(proj.ID, 0) <= 0),
                            Notify(If(ar, "رقم الشكوى والمشروع مطلوبان.", "Complaint number and project are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedComplaint,
                                    Patch(
                                        Complainants,
                                        If(isNew, Defaults(Complainants), LookUp(Complainants, ID = varSelectedComplaint.ID)),
                                        {
                                            Title: Coalesce(Trim(txtMealCFMEdNumber.Text), Trim(txtMealCFMEdCategory.Text)),
                                            ComplaintNumber: Trim(txtMealCFMEdNumber.Text),
                                            Project: {Id: proj.ID, Value: Coalesce(proj.Title, "")},
                                            ProjectID: proj.ID,
                                            CFMChannel: {Value: Coalesce(cmbMealCFMEdChannel.Selected.Value, "")},
                                            ComplaintCategory: {Value: Coalesce(cmbMealCFMEdCategory.Selected.Value, Trim(txtMealCFMEdCategory.Text))},
                                            Priority: {Value: Coalesce(cmbMealCFMEdPriority.Selected.Value, "")},
                                            Status: {Value: Coalesce(cmbMealCFMEdStatus.Selected.Value, If(isNew, "Open", "Open"))},
                                            ComplaintDescription: txtMealCFMEdDesc.Text,
                                            Site: Trim(txtMealCFMEdSite.Text),
                                            Location: Trim(txtMealCFMEdLocation.Text),
                                            DateRecorded: Coalesce(dteMealCFMEdRecorded.SelectedDate, Today()),
                                            ComplaintDate: dteMealCFMEdComplaint.SelectedDate,
                                            DueDate: dteMealCFMEdDue.SelectedDate,
                                            ResponseDate: dteMealCFMEdResponse.SelectedDate,
                                            ClosureDate: dteMealCFMEdClosure.SelectedDate,
                                            ActionTaken: txtMealCFMEdAction.Text,
                                            ResolutionSummary: txtMealCFMEdResolution.Text,
                                            FeedbackSatisfaction: txtMealCFMEdSatis.Text,
                                            Notes: txtMealCFMEdNotes.Text,
                                            AssignedTo: If(IsBlank(asg), Blank(), {Id: asg.ID, Value: Coalesce(asg.FullName, "")}),
                                            AssignedToID: If(IsBlank(asg), Blank(), asg.ID),
                                            RecivedTo: If(IsBlank(recv), Blank(), {Id: recv.ID, Value: Coalesce(recv.FullName, "")}),
                                            RecivedToID: If(IsBlank(recv), Blank(), recv.ID),
                                            ComplaintName: If(canSens, Trim(txtMealCFMEdName.Text), If(isNew, Blank(), varSelectedComplaint.ComplaintName)),
                                            PhoneNumber: If(canSens, Trim(txtMealCFMEdPhone.Text), If(isNew, Blank(), varSelectedComplaint.PhoneNumber)),
                                            IsPSEA: If(canSens, togMealCFMEdPSEA.Checked, If(isNew, false, varSelectedComplaint.IsPSEA)),
                                            Confidential: If(canSens, togMealCFMEdConf.Checked, If(isNew, false, varSelectedComplaint.Confidential))
                                        }
                                    )
                                );
                                If(
                                    And(togMealCFMEdCreateAction.Checked, Coalesce(varSelectedComplaint.ID, 0) > 0),
                                    IfError(
                                        Patch(
                                            MELActions,
                                            Defaults(MELActions),
                                            {
                                                Title: Left("CFM " & Coalesce(varSelectedComplaint.ComplaintNumber, Text(varSelectedComplaint.ID)), 255),
                                                ActionNumber: "CFM-" & Text(varSelectedComplaint.ID),
                                                ProjectID: proj.ID,
                                                SourceType: {Value: "CFM Complaint"},
                                                SourceID: varSelectedComplaint.ID,
                                                SourceNumber: Coalesce(varSelectedComplaint.ComplaintNumber, ""),
                                                Finding: Left(Coalesce(varSelectedComplaint.ComplaintDescription, ""), 500),
                                                ActionRequired: Left(Coalesce(varSelectedComplaint.ProposedAction, varSelectedComplaint.ActionTaken, "Follow up complaint"), 500),
                                                Responsible: If(IsBlank(asg), Blank(), {Id: asg.ID, Value: Coalesce(asg.FullName, "")}),
                                                ResponsibleID: If(IsBlank(asg), Blank(), asg.ID),
                                                ResponsiblePersonID: If(IsBlank(asg), Blank(), asg.ID),
                                                DueDate: varSelectedComplaint.DueDate,
                                                Priority: {Value: Coalesce(varSelectedComplaint.Priority.Value, "Medium")},
                                                Status: {Value: "Open"}
                                            }
                                        ),
                                        Notify(If(ar, "حُفظت الشكوى لكن تعذر إنشاء الإجراء.", "Complaint saved, but MEL action could not be created."), NotificationType.Warning)
                                    )
                                );
                                If(
                                    isNew,
                                    fnMealLog("CFM Complaint", varSelectedComplaint.ID, Coalesce(varSelectedComplaint.ComplaintNumber, ""), "Created", "Info", proj.ID, Coalesce(proj.ProjectCode, ""), "", "", "", "New complaint", Or(Coalesce(varSelectedComplaint.IsPSEA, false), Coalesce(varSelectedComplaint.Confidential, false)));
                                    If(
                                        Coalesce(asg.ID, 0) > 0,
                                        fnMealNotify(asg.ID, Coalesce(asg.FullName, ""), If(ar, "شكوى جديدة", "New complaint"), Coalesce(varSelectedComplaint.ComplaintNumber, ""), "CFM Complaint", varSelectedComplaint.ID, "Unread")
                                    )
                                );
                                Set(varMealCFMMode, "list");
                                Select(btnMealCFMLoad);
                                Notify(If(ar, "تم حفظ الشكوى.", "Complaint saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الشكوى.", "Could not save the complaint."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
      - conMealCFMPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealCFMPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealCFMTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealCFMHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealCFMTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "الشكاوى والملاحظات", "Complaints & Feedback")
                  - btnMealCFMNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMealCFMMode, "new"); Set(varSelectedComplaint, Blank())
                        Text: =If(gblLanguage = "Arabic", "شكوى جديدة", "New complaint")
                        Visible: =varMealCFMMode = "list"
                        Width: =130
                  - btnMealCFMBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMealCFMMode, "list"); Select(btnMealCFMLoad)
                        Text: =If(gblLanguage = "Arabic", "القائمة", "List")
                        Visible: =varMealCFMMode <> "list"
                        Width: =90
            - galMealCFMKPIs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  FillPortions: =0
                  Height: =72
                  Items: =colMealCFMKPIs
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =140
                  Visible: =varMealCFMMode = "list"
                Children:
                  - conMealCFMKPI:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 6
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.TemplateWidth - 8
                        X: =4
                        Y: =3
                      Children:
                        - lblMealCFMKPIVal:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =FontWeight.Bold
                              Height: =28
                              Size: =18
                              Text: =Text(ThisItem.Count)
                              Width: =Parent.Width - 12
                              X: =6
                              Y: =6
                        - lblMealCFMKPILbl:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =24
                              Size: =11
                              Text: =If(gblLanguage = "Arabic", ThisItem.LabelAr, ThisItem.LabelEn)
                              Width: =Parent.Width - 12
                              X: =6
                              Y: =32
            - conMealCFMTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 140, 40)
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  Visible: =varMealCFMMode = "list"
                Children:
                  - txtMealCFMSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =varMealCFMQ
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMQ, Self.Text); Select(btnMealCFMLoad)
                        Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                        Width: =150
                  - cmbMealCFMFltProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealCFMFltProject), Filter(Projects, false), Filter(Projects, ID = varMealCFMFltProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Items: =Projects
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMFltProject, Self.Selected); Select(btnMealCFMLoad)
                        SelectMultiple: =false
                        Width: =150
                  - cmbMealCFMFltChannel:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealCFMFltChannel), Filter(Choices(Complainants.CFMChannel), false), Filter(Choices(Complainants.CFMChannel), Value = varMealCFMFltChannel))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "القناة", "Channel")
                        Items: =Choices(Complainants.CFMChannel)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMFltChannel, Self.Selected.Value); Select(btnMealCFMLoad)
                        SelectMultiple: =false
                        Width: =130
                  - cmbMealCFMFltCategory:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealCFMFltCategory), Filter(Choices(Complainants.ComplaintCategory), false), Filter(Choices(Complainants.ComplaintCategory), Value = varMealCFMFltCategory))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الفئة", "Category")
                        Items: =Choices(Complainants.ComplaintCategory)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMFltCategory, Self.Selected.Value); Select(btnMealCFMLoad)
                        SelectMultiple: =false
                        Width: =130
                  - cmbMealCFMFltPriority:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealCFMFltPriority), Filter(Choices(Complainants.Priority), false), Filter(Choices(Complainants.Priority), Value = varMealCFMFltPriority))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                        Items: =Choices(Complainants.Priority)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMFltPriority, Self.Selected.Value); Select(btnMealCFMLoad)
                        SelectMultiple: =false
                        Width: =120
                  - cmbMealCFMFltStatus:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealCFMFltStatus), Filter(Choices(Complainants.Status), false), Filter(Choices(Complainants.Status), Value = varMealCFMFltStatus))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        Items: =Choices(Complainants.Status)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealCFMFltStatus, Self.Selected.Value); Select(btnMealCFMLoad)
                        SelectMultiple: =false
                        Width: =120
            - conMealCFMBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varMealCFMMode = "list"
                Children:
                  - galMealCFMList:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 900, 1, 0)
                        Items: =colMealCFMView
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =78
                        Visible: =Or(App.Width >= 900, IsBlank(varSelectedComplaint))
                        Width: =If(App.Width < 900, Parent.Width, 340)
                      Children:
                        - conMealCFMCard:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              Fill: =If(Coalesce(varSelectedComplaint.ID, 0) = ThisItem.ID, fxThemeColor("PrimarySubtle"), fxThemeColor("Background"))
                              Height: =Parent.TemplateHeight - 6
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                              Y: =3
                            Children:
                              - lblMealCFMCardTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Text: =Coalesce(ThisItem.ComplaintNumber, Text(ThisItem.ID))
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =6
                              - lblMealCFMCardMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =42
                                    Size: =11
                                    Text: =Coalesce(ThisItem.ComplaintCategory.Value, "-") & " · " & Coalesce(ThisItem.Status.Value, "-") & Char(10) & Coalesce(ThisItem.CFMChannel.Value, "-") & " · " & Coalesce(ThisItem.Priority.Value, "-") & " · " & Coalesce(ThisItem.Project.Value, "-")
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =28
                              - btnMealCFMPick:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Height: =Parent.Height
                                    OnSelect: =Set(varSelectedComplaint, ThisItem)
                                    Text: =""
                                    Width: =Parent.Width
                  - conMealCFMDetail:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        Visible: =Not(IsBlank(varSelectedComplaint))
                      Children:
                        - conMealCFMDetHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblMealCFMDetTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    FillPortions: =1
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =15
                                    Text: =Coalesce(varSelectedComplaint.ComplaintNumber, If(gblLanguage = "Arabic", "تفاصيل الشكوى", "Complaint details"))
                              - btnMealCFMEdit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMealCFMMode, "edit")
                                    Text: =If(gblLanguage = "Arabic", "تعديل", "Edit")
                                    Width: =80
                        - lblMealCFMInfo:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {ar: gblLanguage = "Arabic", c: varSelectedComplaint, sens: varMealCFMCanSensitive},
                                    If(ar, "القناة: ", "Channel: ") & Coalesce(c.CFMChannel.Value, "-") & Char(10) &
                                    If(ar, "الفئة: ", "Category: ") & Coalesce(c.ComplaintCategory.Value, "-") & Char(10) &
                                    If(ar, "الأولوية / الحالة: ", "Priority / status: ") & Coalesce(c.Priority.Value, "-") & " / " & Coalesce(c.Status.Value, "-") & Char(10) &
                                    If(ar, "الموقع: ", "Site: ") & Coalesce(c.Site.Value, "-") & Char(10) &
                                    If(ar, "المسؤول: ", "Assigned: ") & Coalesce(c.AssignedTo.Value, "-") & Char(10) &
                                    If(ar, "الاستحقاق: ", "Due: ") & Text(c.DueDate, "dd mmm yyyy") & Char(10) &
