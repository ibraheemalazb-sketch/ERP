# scrFinNoAccess - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinNoAccess, set its properties from 03-screens-batch-a.md,
# then paste screens/paste/scrFinNoAccess.controls.pa.yaml onto it.
Screens:
  scrFinNoAccess:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 51);
        UpdateContext({locMoreOpen: false, locNotifOpen: false})
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_NoAcc:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - conNoAccRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conNoAccMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - conNoAccBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - cmpEmpty_NoAcc:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Variant: ="noaccess"
                              Title: =fnT("noacc.title", "No access")
                              Message: =If(!varFinReady, fnT("common.loading", "Loading..."), !hasFinanceAccess, fnT("noacc.noFinance", "Your account has no Finance permissions. Ask your administrator to add a Permissions row for your role (Module = Finance)."), fnT("noacc.page", "You do not have access to this page or record."))
                              ActionText: =If(hasFinanceAccess, fnT("nav.dashboard", "Dashboard"), "")
                              OnAction: =fnNavigate("dashboard")
                              Height: =320
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
      - cmpNotif_NoAcc:
          Control: CanvasComponent
          ComponentName: cmpNotificationsPanel
          Properties:
            Visible: =locNotifOpen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: |-
              =ForAll(colFinNotif As n, {ID: n.ID, Title: n.Title, Message: n.Message, Created: n.Created, Link: n.Link, RelatedEntity: n.RelatedEntity.Value, RelatedItemID: n.RelatedItemID})
            OnClose: |-
              =UpdateContext({locNotifOpen: false})
            OnMarkAllRead: =fnMarkAllNotificationsRead()
            OnOpenItem: |-
              =UpdateContext({locNotifOpen: false});
              fnOpenNotification(cmpNotif_NoAcc.SelectedItem.ID, cmpNotif_NoAcc.SelectedItem.RelatedEntity, cmpNotif_NoAcc.SelectedItem.RelatedItemID, cmpNotif_NoAcc.SelectedItem.Link)
      - cmpTop_NoAcc:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Back()
            ScreenTitle: =fnT("noacc.title", "No access")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_NoAcc:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
