Screens:
  scrReportingSettings:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Reporting");
        Set(varNavSelectedID, 76);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        Set(varRepSetTab, Coalesce(varRepSetTab, "Configs"));
        If(IsBlank(varRepCfgForm), Set(varRepCfgForm, Blank()));
        If(IsBlank(varRepPerForm), Set(varRepPerForm, Blank()));
        Set(varRepSetError, false);
        ClearCollect(
            colRepTypeRef,
            {k: "Progress", en: "Progress Report", ar: "تقرير تقدم"},
            {k: "Narrative", en: "Narrative Report", ar: "تقرير سردي"},
            {k: "Financial", en: "Financial Report", ar: "تقرير مالي"},
            {k: "MEAL", en: "MEAL Report", ar: "تقرير متابعة وتقييم"},
            {k: "Donor", en: "Donor Report", ar: "تقرير مانح"},
            {k: "Final", en: "Final Report", ar: "تقرير نهائي"},
            {k: "Interim", en: "Interim Report", ar: "تقرير مرحلي"},
            {k: "Quarterly", en: "Quarterly Report", ar: "تقرير ربعي"},
            {k: "Annual", en: "Annual Report", ar: "تقرير سنوي"},
            {k: "Other", en: "Other", ar: "أخرى"}
        );
        Select(btnRepSetLoad)
    Children:
      - conRepSetSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnRepSetLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varRepSetError, false);
                    IfError(
                        Concurrent(
                            Refresh(ReportingConfigurations),
                            Refresh(ReportingPeriods)
                        );
                        ClearCollect(
                            colRepConfigs,
                            FirstN(SortByColumns(ReportingConfigurations, "ID", SortOrder.Descending), 500)
                        );
                        ClearCollect(
                            colRepPeriods,
                            FirstN(SortByColumns(ReportingPeriods, "StartDate", SortOrder.Descending), 500)
                        );
                        If(
                            Not(IsBlank(varSelectedConfig)),
                            Set(varSelectedConfig, LookUp(ReportingConfigurations, ID = varSelectedConfig.ID))
                        );
                        If(
                            Not(IsBlank(varSelectedPeriod)),
                            Set(varSelectedPeriod, LookUp(ReportingPeriods, ID = varSelectedPeriod.ID))
                        ),
                        Set(varRepSetError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل إعدادات التقارير.", "Could not load reporting settings."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnRepSetSaveCfg:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varRepCfgForm, "") = "new",
                            pid: Coalesce(cmbRepSetCfgProject.Selected.ID, 0),
                            ptt: Coalesce(cmbRepSetCfgProject.Selected.Title, ""),
                            prep: cmbRepSetCfgPrep.Selected,
                            rev: cmbRepSetCfgRev.Selected,
                            esc: cmbRepSetCfgEsc.Selected
                        },
                        If(
                            Or(IsBlank(Trim(txtRepSetCfgTitle.Text)), pid <= 0, IsBlank(cmbRepSetCfgType.Selected)),
                            Notify(If(ar, "العنوان والمشروع ونوع التقرير مطلوبة.", "Title, project, and report type are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedConfig,
                                    Patch(
                                        ReportingConfigurations,
                                        If(isNew, Defaults(ReportingConfigurations), LookUp(ReportingConfigurations, ID = varSelectedConfig.ID)),
                                        {
                                            Title: Trim(txtRepSetCfgTitle.Text),
                                            ConfigurationNumber: Trim(txtRepSetCfgNumber.Text),
                                            Project: {Id: pid, Value: ptt},
                                            ProjectID: pid,
                                            ReportType: {Value: cmbRepSetCfgType.Selected.Value},
                                            IsActive: togRepSetCfgActive.Checked,
                                            Frequency: If(IsBlank(cmbRepSetCfgFreq.Selected), Blank(), {Value: cmbRepSetCfgFreq.Selected.Value}),
                                            PeriodType: If(IsBlank(cmbRepSetCfgPeriodType.Selected), Blank(), {Value: cmbRepSetCfgPeriodType.Selected.Value}),
                                            StartDate: dteRepSetCfgStart.SelectedDate,
                                            EndDate: dteRepSetCfgEnd.SelectedDate,
                                            IsRecurring: togRepSetCfgRecurring.Checked,
                                            AutoGenerate: togRepSetCfgAuto.Checked,
                                            Donor: Trim(txtRepSetCfgDonor.Text),
                                            DonorTemplateUrl: Trim(txtRepSetCfgDonorUrl.Text),
                                            PreparerID: If(IsBlank(prep), Blank(), prep.ID),
                                            ReviewerID: If(IsBlank(rev), Blank(), rev.ID),
                                            EscalateToID: If(IsBlank(esc), Blank(), esc.ID),
                                            DueRuleType: If(IsBlank(cmbRepSetCfgDueRule.Selected), Blank(), {Value: cmbRepSetCfgDueRule.Selected.Value}),
                                            DueDays: If(IsBlank(Trim(txtRepSetCfgDueDays.Text)), Blank(), Value(txtRepSetCfgDueDays.Text)),
                                            InternalDueDays: If(IsBlank(Trim(txtRepSetCfgIntDays.Text)), Blank(), Value(txtRepSetCfgIntDays.Text)),
                                            ReminderDaysBefore: Trim(txtRepSetCfgRemind.Text),
                                            EscalationAfterDays: If(IsBlank(Trim(txtRepSetCfgEscDays.Text)), Blank(), Value(txtRepSetCfgEscDays.Text)),
                                            Notes: txtRepSetCfgNotes.Text
                                        }
                                    )
                                );
                                fnRepLog("Reporting Configuration", varSelectedConfig.ID, Coalesce(varSelectedConfig.ConfigurationNumber, varSelectedConfig.Title, ""), If(isNew, "Created", "Updated"), "Info", pid, Coalesce(cmbRepSetCfgProject.Selected.ProjectCode, ""), "", "", "", Trim(txtRepSetCfgTitle.Text));
                                Set(varRepCfgForm, Blank());
                                Select(btnRepSetLoad);
                                Notify(If(ar, "تم حفظ قاعدة التكوين.", "Configuration rule saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ قاعدة التكوين.", "Could not save the configuration rule."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveCfg"
                  Visible: =false
                  Width: =1
            - btnRepSetDelCfg:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", c: varSelectedConfig},
                        If(
                            IsBlank(c),
                            Notify(If(ar, "اختر تكويناً أولاً.", "Select a configuration first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف قاعدة التكوين؟", "Delete this configuration rule?") & Char(10) & Coalesce(c.Title, "")),
                                IfError(
                                    Remove(ReportingConfigurations, LookUp(ReportingConfigurations, ID = c.ID));
                                    fnRepLog("Reporting Configuration", c.ID, Coalesce(c.ConfigurationNumber, c.Title, ""), "Deleted", "Important", Coalesce(c.ProjectID, 0), "", "", "", "", Coalesce(c.Title, ""));
                                    Set(varSelectedConfig, Blank());
                                    Set(varRepCfgForm, Blank());
                                    Select(btnRepSetLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="DelCfg"
                  Visible: =false
                  Width: =1
            - btnRepSetSavePer:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varRepPerForm, "") = "new"
                        },
                        If(
                            Or(IsBlank(Trim(txtRepSetPerTitle.Text)), IsBlank(dteRepSetPerStart.SelectedDate), IsBlank(dteRepSetPerEnd.SelectedDate)),
                            Notify(If(ar, "العنوان وتواريخ البداية والنهاية مطلوبة.", "Title, start, and end dates are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedPeriod,
                                    Patch(
                                        ReportingPeriods,
                                        If(isNew, Defaults(ReportingPeriods), LookUp(ReportingPeriods, ID = varSelectedPeriod.ID)),
                                        {
                                            Title: Trim(txtRepSetPerTitle.Text),
                                            Year: If(IsBlank(Trim(txtRepSetPerYear.Text)), Year(dteRepSetPerStart.SelectedDate), Value(txtRepSetPerYear.Text)),
                                            PeriodType: {Value: Coalesce(cmbRepSetPerType.Selected.Value, "Custom")},
                                            PeriodNumber: If(IsBlank(Trim(txtRepSetPerNum.Text)), Blank(), Value(txtRepSetPerNum.Text)),
                                            StartDate: dteRepSetPerStart.SelectedDate,
                                            EndDate: dteRepSetPerEnd.SelectedDate,
                                            Status: {Value: Coalesce(cmbRepSetPerStatus.Selected.Value, "Open")}
                                        }
                                    )
                                );
                                fnRepLog("Reporting Period", varSelectedPeriod.ID, Coalesce(varSelectedPeriod.Title, ""), If(isNew, "Created", "Updated"), "Info", 0, "", "", "", "", Trim(txtRepSetPerTitle.Text));
                                Set(varRepPerForm, Blank());
                                Select(btnRepSetLoad);
                                Notify(If(ar, "تم حفظ الفترة.", "Period saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الفترة.", "Could not save the period."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SavePer"
                  Visible: =false
                  Width: =1
            - btnRepSetClosePer:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", p: varSelectedPeriod},
                        If(
                            IsBlank(p),
                            Notify(If(ar, "اختر فترة أولاً.", "Select a period first."), NotificationType.Warning),
                            IfError(
                                Set(
                                    varSelectedPeriod,
                                    Patch(
                                        ReportingPeriods,
                                        LookUp(ReportingPeriods, ID = p.ID),
                                        {Status: {Value: "Closed"}}
                                    )
                                );
                                fnRepLog("Reporting Period", p.ID, Coalesce(p.Title, ""), "Status Changed", "Info", 0, "", "Status", Coalesce(p.Status.Value, ""), "Closed", "");
                                Select(btnRepSetLoad);
                                Notify(If(ar, "تم إغلاق الفترة.", "Period closed."), NotificationType.Success),
                                Notify(If(ar, "تعذر إغلاق الفترة.", "Could not close the period."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="ClosePer"
                  Visible: =false
                  Width: =1
            - btnRepSetArchPer:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", p: varSelectedPeriod},
                        If(
                            IsBlank(p),
                            Notify(If(ar, "اختر فترة أولاً.", "Select a period first."), NotificationType.Warning),
                            IfError(
                                Set(
                                    varSelectedPeriod,
                                    Patch(
                                        ReportingPeriods,
                                        LookUp(ReportingPeriods, ID = p.ID),
                                        {Status: {Value: "Archived"}}
                                    )
                                );
                                fnRepLog("Reporting Period", p.ID, Coalesce(p.Title, ""), "Status Changed", "Info", 0, "", "Status", Coalesce(p.Status.Value, ""), "Archived", "");
                                Select(btnRepSetLoad);
                                Notify(If(ar, "تمت أرشفة الفترة.", "Period archived."), NotificationType.Success),
                                Notify(If(ar, "تعذر أرشفة الفترة.", "Could not archive the period."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="ArchPer"
                  Visible: =false
                  Width: =1
      - conRepSetPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpRepSetPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpRepSetTop.Height + 8
            Width: =Parent.Width
          Children:
            - conRepSetHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblRepSetTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "إعدادات التقارير", "Reporting Settings")
                        Width: =200
                        Wrap: =false
                  - btnRepSetRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnRepSetLoad)
                        Text: =""
                        Width: =44
                  - btnRepSetGoCal:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        Height: =36
                        Icon: ="Chart"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrReportSchedules, ScreenTransition.None)
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "التقويم", "Calendar"))
                        Width: =If(App.Width < 700, 44, 120)
            - galRepSetTabs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  FillPortions: =0
                  Height: =40
                  Items: |-
                    =Table(
                        {k: "Configs", en: "Configuration Rules", ar: "قواعد التكوين"},
                        {k: "Periods", en: "Reporting Periods", ar: "فترات التقارير"},
                        {k: "Types", en: "Report Types", ar: "أنواع التقارير"}
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =If(Self.Width < 640, 150, Self.Width / 3)
                  Width: =Parent.Width
                Children:
                  - btnRepSetTab:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =If(ThisItem.k = Coalesce(varRepSetTab, "Configs"), ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =30
                        OnSelect: |-
                          =Set(varRepSetTab, ThisItem.k);
                          Set(varRepCfgForm, Blank());
                          Set(varRepPerForm, Blank());
                          Set(varSelectedConfig, Blank());
                          Set(varSelectedPeriod, Blank())
                        Text: =If(gblLanguage = "Arabic", ThisItem.ar, ThisItem.en)
                        Width: =Parent.TemplateWidth - 8
                        X: =4
            - lblRepSetError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varRepSetError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل بعض البيانات.", "Some data could not be loaded.")
                  Visible: =varRepSetError
                  Width: =Parent.Width
                  Wrap: =false
            - conRepSetConfigs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 120
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =Coalesce(varRepSetTab, "Configs") = "Configs"
                Children:
                  - conRepSetCfgList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =Or(App.Width >= 700, IsBlank(varRepCfgForm))
                        Width: =If(App.Width < 700, Parent.Width, If(IsBlank(varRepCfgForm), Parent.Width, Parent.Width - 448))
                      Children:
                        - conRepSetCfgTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 160, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =App.Width < 700
                            Children:
                              - txtRepSetCfgSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                                    Width: =If(App.Width < 700, Parent.Width, 160)
                              - cmbRepSetCfgFltProject:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =Filter(Projects, false)
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Projects
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 160)
                              - cmbRepSetCfgFltType:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =Filter(Choices(ReportingConfigurations.ReportType), false)
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "النوع", "Type")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(ReportingConfigurations.ReportType)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 140)
                              - cmbRepSetCfgFltActive:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =Filter(Table({Value: "All"}, {Value: "Active"}, {Value: "Inactive"}), Value = "All")
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "النشاط", "Active")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: |-
                                      =Table({Value: "All"}, {Value: "Active"}, {Value: "Inactive"})
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 120)
                              - btnRepSetCfgNew:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Height: =36
                                    Icon: ="Add"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varSelectedConfig, Blank());
                                      Set(varRepCfgForm, "new")
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "جديد", "New"))
                                    Width: =If(App.Width < 700, 44, 100)
                        - conRepSetCfgHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Background")
                              FillPortions: =0
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =8
                              PaddingRight: =8
                              Width: =Parent.Width
                            Children:
                              - lblRepSetCfgHProject:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    Width: =110
                              - lblRepSetCfgHType:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =If(gblLanguage = "Arabic", "نوع التقرير", "Report type")
                                    Width: =80
                              - lblRepSetCfgHFreq:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =If(gblLanguage = "Arabic", "التكرار", "Frequency")
                                    Visible: =App.Width >= 900
                                    Width: =100
                              - lblRepSetCfgHPrep:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =If(gblLanguage = "Arabic", "المُعد", "Preparer")
                                    Visible: =App.Width >= 1100
                                    Width: =120
                              - lblRepSetCfgHAct:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =fxThemeColor("TextMuted")
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    Size: =10
                                    Text: =If(gblLanguage = "Arabic", "نشط", "Active")
                                    Width: =64
                        - galRepSetCfg:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Fill: =fxThemeColor("Surface")
                              Height: =Parent.Height - 88
                              Items: |-
                                =With(
                                    {
                                        q: Lower(Trim(txtRepSetCfgSearch.Text)),
                                        fp: cmbRepSetCfgFltProject.Selected,
                                        ft: cmbRepSetCfgFltType.Selected.Value,
                                        fa: Coalesce(cmbRepSetCfgFltActive.Selected.Value, "All")
                                    },
                                    Filter(
                                        colRepConfigs,
                                        And(
                                            Or(IsBlank(q), q in Lower(Title), q in Lower(Coalesce(ConfigurationNumber, "")), q in Lower(Coalesce(Project.Value, "")), q in Lower(Coalesce(ReportType.Value, ""))),
                                            Or(IsBlank(fp), ProjectID = fp.ID),
                                            Or(IsBlank(ft), ReportType.Value = ft),
                                            Or(fa = "All", And(fa = "Active", IsActive), And(fa = "Inactive", Not(IsActive)))
                                        )
                                    )
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplateSize: =44
                              Width: =Parent.Width
                            Children:
                              - conRepSetCfgRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =If(ThisItem.ID = varSelectedConfig.ID, fxThemeColor("PrimaryLight"), fxThemeColor("Surface"))
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - lblRepSetCfgProject:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("TextPrimary")
