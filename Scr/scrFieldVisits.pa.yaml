Screens:
  scrFieldVisits:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "FieldVisits");
        Set(varNavSelectedID, 63);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealFVMode), Set(varMealFVMode, "list"));
        If(IsBlank(varMealFVQ), Set(varMealFVQ, ""));
        If(IsBlank(varMealFVPane), Set(varMealFVPane, "Info"));
        If(IsBlank(varMealFVChild), Set(varMealFVChild, Blank()));
        Set(varMealFVError, false);
        ClearCollect(
            colMealFVStatusUI,
            {k: "Draft", en: "Draft", ar: "مسودة"},
            {k: "Pending Approval", en: "Pending Approval", ar: "بانتظار الاعتماد"},
            {k: "Approved", en: "Approved", ar: "معتمدة"},
            {k: "In Progress", en: "In Progress", ar: "قيد التنفيذ"},
            {k: "Report Submitted", en: "Report Submitted", ar: "تقرير مُرسل"},
            {k: "Report Approved", en: "Report Approved", ar: "تقرير معتمد"},
            {k: "Closed", en: "Closed", ar: "مغلقة"},
            {k: "Rejected", en: "Rejected", ar: "مرفوضة"}
        );
        ClearCollect(
            colMealFVTypeUI,
            {k: "Monitoring", en: "Monitoring", ar: "متابعة"},
            {k: "Supervision", en: "Supervision", ar: "إشراف"},
            {k: "Assessment", en: "Assessment", ar: "تقييم"},
            {k: "Distribution", en: "Distribution", ar: "توزيع"},
            {k: "Coordination", en: "Coordination", ar: "تنسيق"},
            {k: "Other", en: "Other", ar: "أخرى"}
        );
        Select(btnMealFVLoad)
    Children:
      - conMealFVSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealFVLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealFVError, false);
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealFVList,
                                FirstN(
                                    SortByColumns(
                                        If(
                                            Coalesce(varMealFVFltProject.ID, 0) > 0,
                                            Filter(FieldVisits, ProjectID = varMealFVFltProject.ID),
                                            FieldVisits
                                        ),
                                        "Modified",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            ClearCollect(
                                colMealFVPeople,
                                FirstN(SortByColumns(Filter(Employees, Status.Value = "Active"), "FullName", SortOrder.Ascending), 300)
                            )
                        );
                        ClearCollect(
                            colMealFVView,
                            Filter(
                                colMealFVList,
                                And(
                                    Or(
                                        IsBlank(Trim(Coalesce(varMealFVQ, ""))),
                                        Trim(varMealFVQ) in Coalesce(VisitNumber, ""),
                                        Trim(varMealFVQ) in Coalesce(Title, ""),
                                        Trim(varMealFVQ) in Coalesce(Project.Value, "")
                                    ),
                                    Or(IsBlank(varMealFVFltType), VisitType.Value = varMealFVFltType.k),
                                    Or(IsBlank(varMealFVFltStatus), Status.Value = varMealFVFltStatus.k)
                                )
                            )
                        );
                        If(
                            Coalesce(varSelectedVisit.ID, 0) > 0,
                            Set(varSelectedVisit, LookUp(FieldVisits, ID = varSelectedVisit.ID));
                            Select(btnMealFVLoadKids)
                        ),
                        Set(varMealFVError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل الزيارات الميدانية.", "Could not load field visits."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealFVLoadKids:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {vid: Coalesce(varSelectedVisit.ID, 0), pid: Coalesce(varSelectedVisit.ProjectID, 0)},
                        If(
                            vid <= 0,
                            Clear(colMealFVMembers);
                            Clear(colMealFVObjectives);
                            Clear(colMealFVEvidence);
                            Clear(colMealFVActions),
                            Concurrent(
                                ClearCollect(colMealFVMembers, Filter(FieldVisitMembers, FieldVisitID = vid)),
                                ClearCollect(colMealFVObjectives, Filter(FieldVisitObjectives, FieldVisitID = vid)),
                                ClearCollect(
                                    colMealFVEvidence,
                                    If(pid > 0, Filter(ActivityEvidence, ProjectID = pid), Filter(ActivityEvidence, ID = -1))
                                ),
                                ClearCollect(
                                    colMealFVActions,
                                    Filter(MELActions, And(SourceType.Value = "Field Visit", SourceID = vid))
                                )
                            )
                        )
                    )
                  Text: ="Kids"
                  Visible: =false
                  Width: =1
            - btnMealFVSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealFVMode, "") = "new",
                            proj: cmbMealFVEdProject.Selected,
                            lead: cmbMealFVEdLeader.Selected,
                            req: cmbMealFVEdRequested.Selected,
                            vtype: Coalesce(cmbMealFVEdType.Selected.Value, ""),
                            pstart: dteMealFVEdStart.SelectedDate
                        },
                        If(
                            Or(IsBlank(proj), Coalesce(proj.ID, 0) <= 0, IsBlank(vtype), IsBlank(pstart), IsBlank(lead), Coalesce(lead.ID, 0) <= 0),
                            Notify(If(ar, "المشروع ونوع الزيارة وتاريخ البداية وقائد الفريق مطلوبة.", "Project, visit type, planned start, and team leader are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedVisit,
                                    Patch(
                                        FieldVisits,
                                        If(isNew, Defaults(FieldVisits), LookUp(FieldVisits, ID = varSelectedVisit.ID)),
                                        {
                                            Title: Coalesce(Trim(txtMealFVEdTitle.Text), proj.Title & " - " & vtype),
                                            VisitNumber: Trim(txtMealFVEdNumber.Text),
                                            Project: {Id: proj.ID, Value: Coalesce(proj.Title, "")},
                                            ProjectID: proj.ID,
                                            VisitType: {Value: vtype},
                                            Status: {Value: Coalesce(cmbMealFVEdStatus.Selected.Value, If(isNew, "Draft", varSelectedVisit.Status.Value, "Draft"))},
                                            PlannedStartDate: pstart,
                                            PlannedEndDate: dteMealFVEdEnd.SelectedDate,
                                            ActualStartDate: dteMealFVEdActStart.SelectedDate,
                                            ActualEndDate: dteMealFVEdActEnd.SelectedDate,
                                            TeamLeader: {Id: lead.ID, Value: Coalesce(lead.FullName, "")},
                                            TeamLeaderID: lead.ID,
                                            RequestedBy: If(IsBlank(req), Blank(), {Id: req.ID, Value: Coalesce(req.FullName, "")}),
                                            RequestedByID: If(IsBlank(req), Blank(), req.ID),
                                            Governorate: Trim(txtMealFVEdGov.Text),
                                            District: Trim(txtMealFVEdDist.Text),
                                            EstimatedBudget: If(IsBlank(Trim(txtMealFVEdBudget.Text)), Blank(), Value(txtMealFVEdBudget.Text)),
                                            OverallComments: txtMealFVEdComments.Text
                                        }
                                    )
                                );
                                If(
                                    isNew,
                                    fnMealLog("Field Visit", varSelectedVisit.ID, Coalesce(varSelectedVisit.VisitNumber, ""), "Created", "Info", proj.ID, Coalesce(proj.ProjectCode, ""), "", "", "", "New field visit", false);
                                    fnMealNotify(
                                        lead.ID,
                                        Coalesce(lead.FullName, ""),
                                        If(ar, "زيارة ميدانية جديدة", "New field visit"),
                                        Coalesce(varSelectedVisit.Title, ""),
                                        "Field Visit",
                                        varSelectedVisit.ID,
                                        "Unread"
                                    )
                                );
                                Set(varMealFVMode, "list");
                                Select(btnMealFVLoad);
                                Notify(If(ar, "تم حفظ الزيارة.", "Visit saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الزيارة.", "Could not save the visit."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
            - btnMealFVWF:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            t: varSelectedVisit,
                            next: varMealFVNextStatus
                        },
                        If(
                            Or(IsBlank(t), IsBlank(next)),
                            Notify(If(ar, "اختر زيارة وحالة تالية.", "Select a visit and next status."), NotificationType.Warning),
                            IfError(
                                Set(varSelectedVisit, Patch(FieldVisits, LookUp(FieldVisits, ID = t.ID), {Status: {Value: next}}));
                                fnMealLog("Field Visit", t.ID, Coalesce(t.VisitNumber, ""), "Status Changed", "Info", Coalesce(t.ProjectID, 0), "", "Status", Coalesce(t.Status.Value, ""), next, "", false);
                                If(
                                    Coalesce(t.TeamLeaderID, 0) > 0,
                                    fnMealNotify(
                                        t.TeamLeaderID,
                                        Coalesce(t.TeamLeader.Value, ""),
                                        If(ar, "تحديث حالة الزيارة", "Visit status updated"),
                                        Coalesce(t.Title, "") & " → " & next,
                                        "Field Visit",
                                        t.ID,
                                        "Unread"
                                    )
                                );
                                Select(btnMealFVLoad);
                                Notify(If(ar, "تم تحديث الحالة.", "Status updated."), NotificationType.Success),
                                Notify(If(ar, "تعذر تحديث الحالة.", "Could not update status."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="WF"
                  Visible: =false
                  Width: =1
            - btnMealFVSaveMem:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealFVChild, "") = "mem-new",
                            emp: cmbMealFVMemEmp.Selected,
                            vid: Coalesce(varSelectedVisit.ID, 0),
                            days: If(IsBlank(Trim(txtMealFVMemDays.Text)), Blank(), Value(txtMealFVMemDays.Text)),
                            rate: If(IsBlank(Trim(txtMealFVMemRate.Text)), Blank(), Value(txtMealFVMemRate.Text))
                        },
                        If(
                            Or(vid <= 0, IsBlank(emp), Coalesce(emp.ID, 0) <= 0),
                            Notify(If(ar, "اختر موظفاً والزيارة.", "Select an employee and visit."), NotificationType.Error),
                            IfError(
                                Patch(
                                    FieldVisitMembers,
                                    If(isNew, Defaults(FieldVisitMembers), LookUp(FieldVisitMembers, ID = varMealFVMemRow.ID)),
                                    {
                                        Title: Coalesce(emp.FullName, ""),
                                        FieldVisit: {Id: vid, Value: Coalesce(varSelectedVisit.Title, "")},
                                        FieldVisitID: vid,
                                        Employee: {Id: emp.ID, Value: Coalesce(emp.FullName, "")},
                                        EmployeeID: emp.ID,
                                        PerDiemPerDay: rate,
                                        PlannedDays: days,
                                        TotalPerDiem: If(Or(IsBlank(rate), IsBlank(days)), Blank(), rate * days)
                                    }
                                );
                                Set(varMealFVChild, Blank());
                                Set(varMealFVMemRow, Blank());
                                fnMealLog("Field Visit", vid, Coalesce(varSelectedVisit.VisitNumber, ""), "Updated", "Info", Coalesce(varSelectedVisit.ProjectID, 0), "", "Member", "", Coalesce(emp.FullName, ""), "", false);
                                Select(btnMealFVLoadKids);
                                Notify(If(ar, "تم حفظ العضو.", "Member saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ العضو.", "Could not save the member."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveMem"
                  Visible: =false
                  Width: =1
            - btnMealFVSaveObj:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealFVChild, "") = "obj-new",
                            vid: Coalesce(varSelectedVisit.ID, 0),
                            pid: Coalesce(varSelectedVisit.ProjectID, 0),
                            resp: cmbMealFVObjResp.Selected,
                            pri: Coalesce(cmbMealFVObjPri.Selected.Value, "")
                        },
                        If(
                            Or(vid <= 0, IsBlank(Trim(txtMealFVObjText.Text))),
                            Notify(If(ar, "الهدف مطلوب.", "Objective is required."), NotificationType.Error),
                            IfError(
                                Patch(
                                    FieldVisitObjectives,
                                    If(isNew, Defaults(FieldVisitObjectives), LookUp(FieldVisitObjectives, ID = varMealFVObjRow.ID)),
                                    {
                                        Title: Left(Trim(txtMealFVObjText.Text), 255),
                                        FieldVisit: {Id: vid, Value: Coalesce(varSelectedVisit.Title, "")},
                                        FieldVisitID: vid,
                                        VisitNumber: Coalesce(varSelectedVisit.VisitNumber, ""),
                                        ProjectID: pid,
                                        Objective: txtMealFVObjText.Text,
                                        Findings: txtMealFVObjFindings.Text,
                                        Recommendations: txtMealFVObjRec.Text,
                                        AchievementStatus: {Value: Coalesce(cmbMealFVObjAch.Selected.Value, "Planned")},
                                        Priority: If(IsBlank(pri), Blank(), {Value: pri}),
                                        FollowUpStatus: {Value: Coalesce(cmbMealFVObjFollow.Selected.Value, "Open")},
                                        DueDate: dteMealFVObjDue.SelectedDate,
                                        ResponsiblePerson: If(IsBlank(resp), Blank(), {Id: resp.ID, Value: Coalesce(resp.FullName, "")}),
                                        ResponsiblePersonID: If(IsBlank(resp), Blank(), resp.ID)
                                    }
                                );
                                Set(varMealFVChild, Blank());
                                Set(varMealFVObjRow, Blank());
                                Select(btnMealFVLoadKids);
                                Notify(If(ar, "تم حفظ الهدف.", "Objective saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الهدف.", "Could not save the objective."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveObj"
                  Visible: =false
                  Width: =1
      - conMealFVPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealFVPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealFVTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealFVHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealFVTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "الزيارات الميدانية", "Field Visits")
                  - btnMealFVNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varMealFVMode, "new");
                          Set(varSelectedVisit, Blank());
                          Set(varMealFVChild, Blank());
                          Reset(txtMealFVEdTitle);
                          Reset(txtMealFVEdNumber);
                          Reset(txtMealFVEdGov);
                          Reset(txtMealFVEdDist);
                          Reset(txtMealFVEdBudget);
                          Reset(txtMealFVEdComments)
                        Text: =If(gblLanguage = "Arabic", "زيارة جديدة", "New visit")
                        Visible: =varMealFVMode = "list"
                        Width: =120
                  - btnMealFVBackList:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varMealFVMode, "list");
                          Set(varMealFVChild, Blank());
                          Select(btnMealFVLoad)
                        Text: =If(gblLanguage = "Arabic", "القائمة", "List")
                        Visible: =varMealFVMode <> "list"
                        Width: =90
            - lblMealFVErr:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealFVError, 28, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل الزيارات.", "Could not load visits.")
                  Visible: =varMealFVError
            - conMealFVTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 120, 40)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  Visible: =varMealFVMode = "list"
                Children:
                  - txtMealFVSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =varMealFVQ
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealFVQ, Self.Text); Select(btnMealFVLoad)
                        Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - cmbMealFVFltProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealFVFltProject), Filter(Projects, false), Filter(Projects, ID = varMealFVFltProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Items: =Projects
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealFVFltProject, Self.Selected); Select(btnMealFVLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - cmbMealFVFltType:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealFVFltType), Filter(colMealFVTypeUI, false), Filter(colMealFVTypeUI, k = varMealFVFltType.k))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "النوع", "Type")
                        Items: =colMealFVTypeUI
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealFVFltType, Self.Selected); Select(btnMealFVLoad)
                        SelectMultiple: =false
                        Width: =140
                  - cmbMealFVFltStatus:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealFVFltStatus), Filter(colMealFVStatusUI, false), Filter(colMealFVStatusUI, k = varMealFVFltStatus.k))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        Items: =colMealFVStatusUI
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealFVFltStatus, Self.Selected); Select(btnMealFVLoad)
                        SelectMultiple: =false
                        Width: =160
            - conMealFVBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varMealFVMode = "list"
                Children:
                  - galMealFVList:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 900, 1, 0)
                        Height: =Parent.Height
                        Items: =colMealFVView
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =78
                        Visible: =Or(App.Width >= 900, IsBlank(varSelectedVisit))
                        Width: =If(App.Width < 900, Parent.Width, 340)
                      Children:
                        - conMealFVCard:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              Fill: =If(Coalesce(varSelectedVisit.ID, 0) = ThisItem.ID, fxThemeColor("PrimarySubtle"), fxThemeColor("Background"))
                              Height: =Parent.TemplateHeight - 6
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                              Y: =3
                            Children:
                              - lblMealFVCardTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    Text: =Coalesce(ThisItem.Title, ThisItem.VisitNumber, "-")
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =6
                              - lblMealFVCardMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Size: =11
                                    Text: =Coalesce(ThisItem.VisitType.Value, "-") & " · " & Coalesce(ThisItem.Status.Value, "-") & Char(10) & Coalesce(ThisItem.Project.Value, "-") & " · " & Text(ThisItem.PlannedStartDate, "dd mmm yyyy")
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =28
                              - btnMealFVPick:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Height: =Parent.Height
                                    OnSelect: |-
                                      =Set(varSelectedVisit, ThisItem);
                                      Set(varMealFVPane, "Info");
                                      Select(btnMealFVLoadKids)
                                    Text: =""
                                    Width: =Parent.Width
                  - conMealFVDetail:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        Visible: =Not(IsBlank(varSelectedVisit))
                      Children:
                        - conMealFVDetHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
