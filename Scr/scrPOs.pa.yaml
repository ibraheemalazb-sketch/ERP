                                                      TemplateSize: =44
                                                      Width: =Max(Parent.Width, 460)
                                                    Children:
                                                      - conPoLine:
                                                          Control: GroupContainer@1.5.0
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Fill: =Color.Transparent
                                                            Height: =Parent.TemplateHeight
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =8
                                                            PaddingLeft: =16
                                                            PaddingRight: =16
                                                            Width: =Parent.TemplateWidth
                                                          Children:
                                                            - lblPoLnDesc:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Color: =fxThemeColor("TextPrimary")
                                                                  FillPortions: =1
                                                                  Font: =gblTheme.Typography.FontFamily
                                                                  FontWeight: =gblTheme.FontWeights.Medium
                                                                  Height: =20
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =140
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =gblTheme.Typography.Caption
                                                                  Text: =Coalesce(ThisItem.Description, "-")
                                                                  Wrap: =false
                                                            - lblPoLnQty:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Right
                                                                  Color: =fxThemeColor("TextPrimary")
                                                                  Font: =gblTheme.Typography.FontFamily
                                                                  FontWeight: =gblTheme.FontWeights.Medium
                                                                  Height: =20
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =56
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =gblTheme.Typography.Caption
                                                                  Text: =Text(Coalesce(ThisItem.Quantity, 0))
                                                                  Width: =64
                                                                  Wrap: =false
                                                            - lblPoLnUnit:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Color: =fxThemeColor("TextPrimary")
                                                                  Font: =gblTheme.Typography.FontFamily
                                                                  FontWeight: =gblTheme.FontWeights.Medium
                                                                  Height: =20
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =64
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =gblTheme.Typography.Caption
                                                                  Text: =Coalesce(ThisItem.Unit.Value, "-")
                                                                  Width: =80
                                                                  Wrap: =false
                                                            - lblPoLnAmt:
                                                                Control: Label@2.5.1
                                                                Properties:
                                                                  Align: =Align.Right
                                                                  Color: =fxThemeColor("TextPrimary")
                                                                  Font: =gblTheme.Typography.FontFamily
                                                                  FontWeight: =gblTheme.FontWeights.Medium
                                                                  Height: =20
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =96
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingRight: =0
                                                                  PaddingTop: =0
                                                                  Size: =gblTheme.Typography.Caption
                                                                  Text: =Concatenate(Text(Coalesce(ThisItem.Quantity, 0) * Coalesce(ThisItem.UnitPrice, 0), "#,##0.00"), " $")
                                                                  Width: =110
                                                                  Wrap: =false
                                    - cmpPoComments:
                                        Control: CanvasComponent
                                        ComponentName: cmpComments
                                        Properties:
                                          Height: =480
                                          Involved: |-
                                            =With(
                                                {
                                                    named: Filter(
                                                        Table(
                                                            {UserID: Coalesce(varCurrentPO.PreparedByID, 0), UserName: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                            {UserID: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).RequesterID, 0), UserName: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).Requester.Value, "")},
                                                            {UserID: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).SupervisorID, 0), UserName: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).Supervisor.Value, "")},
                                                            {UserID: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).ApproverID, 0), UserName: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).Approver.Value, "")},
                                                            {UserID: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).FinancialApproverID, 0), UserName: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).FinancialApprover.Value, "")},
                                                            {UserID: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).ReceivedByID, 0), UserName: Coalesce(LookUp(PurchaseRequests, ID = varCurrentPO.PRID).ReceivedBy.Value, "")}
                                                        ),
                                                        UserID > 0
                                                    ),
                                                    steps: ForAll(
                                                        Filter(colPoApprovals, RequestNumber = varCurrentPO.PONumber),
                                                        {UserID: Coalesce(ApproverID, 0), UserName: Coalesce(Approver.Value, "")}
                                                    )
                                                },
                                                Filter(Ungroup(Table({Items: named}, {Items: steps}), "Items"), UserID > 0)
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          ModuleName: ="Procurement"
                                          People: =colProcPeople
                                          RecordID: =Coalesce(varCurrentPO.ID, 0)
                                          RecordNumber: =Coalesce(varCurrentPO.PONumber, "")
                                          RecordType: ="PurchaseOrder"
                                          RelatedEntity: ="PurchaseOrder"
                                          Title: =If(gblLanguage = "Arabic", "النقاش", "Discussion")
                                          Visible: =varPoPane = "Discussion"
                                          Width: =Parent.Width
                              - conPoSide:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =cmpPoFlow.Height+cmpPoQuick.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =If(App.Width < 1100, Parent.Width, 320)
                                  Children:
                                    - cmpPoFlow:
                                        Control: CanvasComponent
                                        ComponentName: cmpApprovalFlow
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          EmptyText: =If(gblLanguage = "Arabic", "لا توجد خطوات اعتماد", "No approval steps yet")
                                          Height: =400
                                          Items: |-
                                            =SortByColumns(
                                                Filter(colPoApprovals, RequestNumber = varCurrentPO.PONumber),
                                                "Sequence",
                                                SortOrder.Ascending
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Title: =If(gblLanguage = "Arabic", "مسار الاعتماد", "Approval flow")
                                          Width: =If(App.Width<700,Parent.Width-Parent.PaddingLeft*2,Min(320, Parent.Width))
                                    - cmpPoQuick:
                                        Control: CanvasComponent
                                        ComponentName: cmpQuickActions
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          Height: =320
                                          Items: |-
                                            =Table(
                                                {ActionKey: "Print", Label: If(gblLanguage = "Arabic", "طباعة", "Print"), Icon: "Print", Visible: true},
                                                {ActionKey: "SendEmail", Label: If(gblLanguage = "Arabic", "إرسال بريد", "Send Email"), Icon: "Mail", Visible: true},
                                                {ActionKey: "AttachDocument", Label: If(gblLanguage = "Arabic", "إرفاق مستند", "Attach Document"), Icon: "Paperclip", Visible: true},
                                                {ActionKey: "AddComment", Label: If(gblLanguage = "Arabic", "إضافة تعليق", "Add Comment"), Icon: "Message", Visible: true},
                                                {ActionKey: "Edit", Label: If(gblLanguage = "Arabic", "تعديل", "Edit"), Icon: "Edit", Visible: varCurrentPO.POStatus.Value = "Draft"},
                                                {
                                                    ActionKey: "CreateGRN",
                                                    Label: If(gblLanguage = "Arabic", "إنشاء استلام", "Create GRN"),
                                                    Icon: "Box",
                                                    Visible: And(
                                                        Not(IsBlank(varCurrentPO)),
                                                        varCurrentPO.POStatus.Value <> "Draft",
                                                        varCurrentPO.POStatus.Value <> "Cancelled"
                                                    )
                                                },
                                                {
                                                    ActionKey: "Approve",
                                                    Label: If(gblLanguage = "Arabic", "اعتماد", "Approve"),
                                                    Icon: "Check",
                                                    Visible: Not(IsBlank(LookUp(colPoApprovals, And(RequestNumber = varCurrentPO.PONumber, Decision.Value = "Pending", ApproverID = gblCurrentEmployee.ID))))
                                                },
                                                {
                                                    ActionKey: "Reject",
                                                    Label: If(gblLanguage = "Arabic", "رفض", "Reject"),
                                                    Icon: "Warning",
                                                    Visible: Not(IsBlank(LookUp(colPoApprovals, And(RequestNumber = varCurrentPO.PONumber, Decision.Value = "Pending", ApproverID = gblCurrentEmployee.ID))))
                                                }
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Switch(
                                                cmpPoQuick.SelectedAction.ActionKey,
                                                "Print",
                                                Navigate(scrPrintPO, ScreenTransition.None),
                                                "SendEmail",
                                                Set(varPoMailOpen, true),
                                                "AttachDocument",
                                                Set(varProcurementEntity, "PurchaseOrder");
                                                Set(varProcurementMode, If(varCurrentPO.POStatus.Value = "Draft", "Edit", "View"));
                                                Navigate(scrPOEditor, ScreenTransition.Cover),
                                                "AddComment",
                                                Set(varPoPane, "Discussion"),
                                                "Edit",
                                                Set(varProcurementEntity, "PurchaseOrder");
                                                Set(varProcurementMode, "Edit");
                                                Navigate(scrPOEditor, ScreenTransition.Cover),
                                                "CreateGRN",
                                                Set(varSelectedPO, varCurrentPO);
                                                Set(varSourcePO, varCurrentPO);
                                                Set(varProcurementEntity, "GRN");
                                                Set(varProcurementMode, "New");
                                                Set(varCurrentGRN, Blank());
                                                Navigate(scrGRNEditor, ScreenTransition.Cover),
                                                "Approve",
                                                With(
                                                    {
                                                        step: LookUp(
                                                            colPoApprovals,
                                                            And(
                                                                RequestNumber = varCurrentPO.PONumber,
                                                                Decision.Value = "Pending",
                                                                ApproverID = gblCurrentEmployee.ID
                                                            )
                                                        )
                                                    },
                                                    If(
                                                        IsBlank(step),
                                                        Navigate(ScrApprovalCenter, ScreenTransition.None),
                                                        IfError(
                                                            Patch(
                                                                ApprovalHistory,
                                                                LookUp(ApprovalHistory, ID = step.ID),
                                                                {Decision: {Value: "Approved"}, DecisionDate: Now()}
                                                            );
                                                            fnWriteLog(
                                                                "Purchase Order",
                                                                varCurrentPO.ID,
                                                                varCurrentPO.PONumber,
                                                                "Approved",
                                                                "Important",
                                                                Coalesce(varCurrentPO.ProjectID, 0),
                                                                Coalesce(varCurrentPO.Project.Value, ""),
                                                                Coalesce(varCurrentPO.Total, 0),
                                                                Coalesce(varCurrentPO.Currency.Value, ""),
                                                                "Decision",
                                                                "Pending",
                                                                "Approved",
                                                                "",
                                                                "",
                                                                Coalesce(step.Sequence, 0)
                                                            );
                                                            With(
                                                                {pr: LookUp(PurchaseRequests, ID = varCurrentPO.PRID)},
                                                                ClearCollect(
                                                                    colProcNotice,
                                                                    Filter(
                                                                        Table(
                                                                            {UserID: Coalesce(varCurrentPO.PreparedByID, 0), UserName: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                                            {UserID: Coalesce(pr.RequesterID, 0), UserName: Coalesce(pr.Requester.Value, "")},
                                                                            {UserID: Coalesce(pr.SupervisorID, 0), UserName: Coalesce(pr.Supervisor.Value, "")},
                                                                            {UserID: Coalesce(pr.ApproverID, 0), UserName: Coalesce(pr.Approver.Value, "")},
                                                                            {UserID: Coalesce(pr.FinancialApproverID, 0), UserName: Coalesce(pr.FinancialApprover.Value, "")}
                                                                        ),
                                                                        And(UserID > 0, UserID <> Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0))
                                                                    )
                                                                )
                                                            );
                                                            ForAll(
                                                                ForAll(Distinct(colProcNotice, UserID), LookUp(colProcNotice, UserID = Value)) As person,
                                                                fnProcNotify(person.UserID, person.UserName, varCurrentPO.PONumber & " approved", Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "") & " approved " & varCurrentPO.PONumber & ".", "PurchaseOrder", varCurrentPO.ID, "PurchaseOrder")
                                                            );
                                                            Select(btnPoReload);
                                                            Notify(If(gblLanguage = "Arabic", "تم اعتماد الأمر.", "Order approved."), NotificationType.Success),
                                                            Notify(If(gblLanguage = "Arabic", "تعذر حفظ الاعتماد.", "The decision could not be saved."), NotificationType.Error)
                                                        )
                                                    )
                                                ),
                                                "Reject",
                                                With(
                                                    {
                                                        step: LookUp(
                                                            colPoApprovals,
                                                            And(
                                                                RequestNumber = varCurrentPO.PONumber,
                                                                Decision.Value = "Pending",
                                                                ApproverID = gblCurrentEmployee.ID
                                                            )
                                                        )
                                                    },
                                                    If(
                                                        IsBlank(step),
                                                        Navigate(ScrApprovalCenter, ScreenTransition.None),
                                                        IfError(
                                                            Patch(
                                                                ApprovalHistory,
                                                                LookUp(ApprovalHistory, ID = step.ID),
                                                                {Decision: {Value: "Rejected"}, DecisionDate: Now()}
                                                            );
                                                            fnWriteLog(
                                                                "Purchase Order",
                                                                varCurrentPO.ID,
                                                                varCurrentPO.PONumber,
                                                                "Rejected",
                                                                "Important",
                                                                Coalesce(varCurrentPO.ProjectID, 0),
                                                                Coalesce(varCurrentPO.Project.Value, ""),
                                                                Coalesce(varCurrentPO.Total, 0),
                                                                Coalesce(varCurrentPO.Currency.Value, ""),
                                                                "Decision",
                                                                "Pending",
                                                                "Rejected",
                                                                "",
                                                                "",
                                                                Coalesce(step.Sequence, 0)
                                                            );
                                                            With(
                                                                {pr: LookUp(PurchaseRequests, ID = varCurrentPO.PRID)},
                                                                ClearCollect(
                                                                    colProcNotice,
                                                                    Filter(
                                                                        Table(
                                                                            {UserID: Coalesce(varCurrentPO.PreparedByID, 0), UserName: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                                            {UserID: Coalesce(pr.RequesterID, 0), UserName: Coalesce(pr.Requester.Value, "")},
                                                                            {UserID: Coalesce(pr.SupervisorID, 0), UserName: Coalesce(pr.Supervisor.Value, "")},
                                                                            {UserID: Coalesce(pr.ApproverID, 0), UserName: Coalesce(pr.Approver.Value, "")},
                                                                            {UserID: Coalesce(pr.FinancialApproverID, 0), UserName: Coalesce(pr.FinancialApprover.Value, "")}
                                                                        ),
                                                                        And(UserID > 0, UserID <> Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0))
                                                                    )
                                                                )
                                                            );
                                                            ForAll(
                                                                ForAll(Distinct(colProcNotice, UserID), LookUp(colProcNotice, UserID = Value)) As person,
                                                                fnProcNotify(person.UserID, person.UserName, varCurrentPO.PONumber & " rejected", Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "") & " rejected " & varCurrentPO.PONumber & ".", "PurchaseOrder", varCurrentPO.ID, "PurchaseOrder")
                                                            );
                                                            Select(btnPoReload);
                                                            Notify(If(gblLanguage = "Arabic", "تم رفض الأمر.", "Order rejected."), NotificationType.Success),
                                                            Notify(If(gblLanguage = "Arabic", "تعذر حفظ الرفض.", "The decision could not be saved."), NotificationType.Error)
                                                        )
                                                    )
                                                )
                                            )
                                          Title: =If(gblLanguage = "Arabic", "إجراءات سريعة", "Quick actions")
                                          Width: =If(App.Width<700,Parent.Width-Parent.PaddingLeft*2,Min(320, Parent.Width))
                                    - cmpPoHistory:
                                        Control: CanvasComponent
                                        ComponentName: cmpHistoryTimeline
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          EntityID: =Coalesce(varCurrentPO.ID, 0)
                                          EntityType: ="Purchase Order"
                                          FilterMode: ="entity"
                                          Height: =420
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LogList: ="Procurement"
                                          OnLoadMore: |-
                                            =UpdateContext({locPoHistTop: Coalesce(locPoHistTop, 50) + 50})
                                          ProjectID: =
                                          ShowSensitive: =false
                                          TopN: =Coalesce(locPoHistTop, 50)
                                          Width: =If(App.Width<700,Parent.Width-Parent.PaddingLeft*2,Min(320, Parent.Width))
      - cmpPoNew:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =fxThemeColor("Primary")
            Disabled: =
            Height: =56
            Icon: ="Plus"
            IconColor: =
            ItemSize: =
            Label: =If(gblLanguage = "Arabic", "أمر شراء", "Purchase order")
            OnSelect: |-
              =Set(varProcurementEntity, "PurchaseOrder");
              Set(varProcurementMode, "New");
              Set(varCurrentPO, Blank());
              Set(varSelectedPR, Blank());
              Set(varSourcePR, Blank());
              Set(varPoQuick, Blank());
              Set(varPoPane, "Details");
              Navigate(scrPOEditor, ScreenTransition.Cover)
            OnSpeedDialSelect: =
            Size: ="regular"
            SpeedDialItems: |-
              =Filter(
                  Table({Icon: "Plus", Label: "New", Color: RGBA(0, 0, 0, 1)}),
                  false
              )
            Style: ="standard"
            Theme: =
            Visible: =And(App.Width < 700, IsBlank(varCurrentPO))
            Width: =56
            X: =Parent.Width - 76
            Y: =Parent.Height - If(App.Width < 700, cmpPoPhone.Height, 16) - 72
      - cmpPoMail:
          Control: CanvasComponent
          ComponentName: cmpSendEmail
          Properties:
            Busy: =varPoMailBusy
            Config: =
            ContextHtml: =
            ContextLine: =Coalesce(varCurrentPO.PONumber, "")
            DefaultSubject: |-
              =Concatenate(
                  If(gblLanguage = "Arabic", "أمر شراء ", "Purchase order "),
                  Coalesce(varCurrentPO.PONumber, "")
              )
            Directory: |-
              =ForAll(
                  colProcPeople,
                  {DisplayName: FullName, Mail: Email, JobTitle: ""}
              )
            Height: =App.Height
            OnCancel: |-
              =Set(varPoMailOpen, false);
              Reset(cmpPoMail)
            OnSend: |-
              =Set(varPoMailBusy, true);
              Notify(
                  Concatenate(If(gblLanguage = "Arabic", "الرسالة جاهزة: ", "Message ready: "), cmpPoMail.Subject),
                  NotificationType.Success
              );
              Set(varPoMailBusy, false);
              Set(varPoMailOpen, false);
              Reset(cmpPoMail)
            Signature: =
            Title: =If(gblLanguage = "Arabic", "رسالة عن الأمر", "Message about this order")
            Visible: =varPoMailOpen
            Width: =App.Width
      - lblPoHeight:
          Control: ModernText@1.0.0
          Properties:
            Height: |-
              =Switch(
                  varPoPane,
                  "Details", conPoForm.Height + 2 * 8,
                  "Discussion", cmpPoComments.Height + 2 * 16,
                  If(App.Width>700, 10 * 30, 12 * 30)
              )
            Visible: =false
            X: =40
            Y: =40
      - conPoQuickScrim:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height
            Visible: =And(IsBlank(varCurrentPO), Not(IsBlank(varPoQuick)))
            Width: =Parent.Width
            X: =If(App.Width < 700, 0, Parent.Width - Self.Width)
          Children:
            - btnPoScrim:
                Control: Classic/Button@2.2.0
