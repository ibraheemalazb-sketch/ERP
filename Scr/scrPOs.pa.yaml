                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =If(App.Width < 700, 0, gblTheme.Radius.XL)
                  RadiusBottomRight: =If(App.Width < 700, 0, gblTheme.Radius.XL)
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Visible: =And(IsBlank(varCurrentPO), Not(IsBlank(varPoQuick)))
                  Width: =If(App.Width < 700, Parent.Width, Min(380, Parent.Width - 24))
                  X: =If(App.Width < 700, 0, Parent.Width - Self.Width)
                  Y: =If(App.Width < 700, Parent.Height * 0.17, 0)
                Children:
                  - conPoQuickHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conPoQuickMark:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("PrimaryLight")
