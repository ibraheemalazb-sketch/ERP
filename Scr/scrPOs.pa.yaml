                  - cmpPoTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =148
                        ContextMenuItems: |-
                          =Table(
                              {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض سريع", "Quick view"), ItemVisible: true},
                              {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: true}
                          )
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
                        EmptyTitle: =If(gblLanguage = "Arabic", "لا توجد أوامر شراء", "No purchase orders")
                        EnableHover: =true
                        EnableMenu: =true
                        HeaderAction: =""
                        HeaderColumn1: =If(gblLanguage = "Arabic", "تاريخ الإصدار", "Issued date")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        HeaderColumn3: =""
                        HeaderHeight: =40
                        HeaderId: =
                        HeaderPerson: =If(gblLanguage = "Arabic", "المورد", "Vendor")
                        HeaderPriority: =If(gblLanguage = "Arabic", "النوع", "Type")
                        HeaderProgress: =
                        HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الإجمالي", "Total")
                        HeaderTitle: =If(gblLanguage = "Arabic", "رقم الأمر", "PO number")
                        HeaderWhen: =If(gblLanguage = "Arabic", "طلب الشراء", "Request")
                        Height: =Max(550, App.Height - cmpPoTop.Height - If(App.Width < 700, cmpPoPhone.Height, 0) - 240)
                        Items: |-
                          =ForAll(
                              Filter(
                                  colPurchaseOrders,
                                  And(
                                      Or(IsBlank(varPoStatus), varPoStatus = "All", POStatus.Value = varPoStatus, And(varPoStatus = "InProgress", POStatus.Value = "In Progress")),
                                      Or(Coalesce(varPoProjectID, 0) = 0, ProjectID = varPoProjectID),
                                      Or(Or(IsBlank(varPoPreparer), varPoPreparer = "All"), PreparedBy.Value = varPoPreparer),
                                      Or(Or(IsBlank(varPoApprover), varPoApprover = "All"), CountRows(Filter(colPoApprovals, And(RequestNumber = PONumber, Approver.Value = varPoApprover))) > 0),
                                      Or(
                                          IsBlank(Trim(txtPoSearch.Text)),
                                          Trim(txtPoSearch.Text) in Coalesce(PONumber, ""),
                                          Trim(txtPoSearch.Text) in Coalesce(Title, ""),
                                          Trim(txtPoSearch.Text) in Coalesce(Vendors.Value, ""),
                                          Trim(txtPoSearch.Text) in Coalesce(Project.Value, "")
                                      )
                                  )
                              ) As req,
                              {
                                  RowKey: Text(req.ID),
                                  Title: Coalesce(req.PONumber, "-"),
                                  Subtitle: Concatenate(Text(Coalesce(req.Total, 0), "#,##0.00"), " ", Coalesce(req.Currency.Value, "USD")),
                                  Column1: If(IsBlank(req.IssueDate), "-", Text(req.IssueDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(req.Project.Value, "-"),
                                  Column3: "",
                                  Status: Coalesce(req.POStatus.Value, "-"),
                                  Tone: Switch(
                                      req.POStatus.Value,
                                      "Approved", "approved",
                                      "Completed", "completed",
                                      "Rejected", "rejected",
                                      "Cancelled", "danger",
                                      "Submitted", "in progress",
                                      "Issued", "info",
                                      "In Progress", "in progress",
                                      "InProgress", "in progress",
                                      "pending"
                                  ),
                                  Priority: Coalesce(req.OrderType.Value, "-"),
                                  PriorityTone: "medium",
                                  Person: Coalesce(req.Vendors.Value, "-"),
                                  WhenText: Coalesce(req.PRNo, "-"),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: "Receipt"
                              }
                          )
                        LayoutMinHeight: =360
                        LayoutMinWidth: =0
                        OnMenuItemSelect: |-
                          =With(
                              {row: LookUp(colPurchaseOrders, ID = Value(cmpPoTable.SelectedItem.RowKey))},
                              Switch(
                                  cmpPoTable.SelectedMenuItem.ItemKey,
                                  "view", Set(varPoQuick, row),
                                  "edit",
                                  Set(varCurrentPO, row);
                                  Set(varProcurementEntity, "PurchaseOrder");
                                  Set(varProcurementMode, "Edit");
                                  Set(varPoPane, "Details");
                                  Set(varPoQuick, Blank());
                                  Navigate(scrPOEditor, ScreenTransition.Cover)
                              )
                          )
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colPurchaseOrders, ID = Value(cmpPoTable.SelectedItem.RowKey))},
                              If(
                                  varPoQuick.ID = row.ID,
                                  Set(varPoQuick, Blank()),
                                  Set(varPoQuick, row)
                              )
                          )
                        OnViewChange: =
                        PersonAsAvatar: =
                        RowHeight: =45
                        ShowAction: =true
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =false
                        ShowHeader: =true
                        ShowId: =false
                        ShowPerson: =true
                        ShowPriority: =true
                        ShowProgress: =false
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
                        SubtitleAsPill: =true
                        TitleBold: =true
                        ViewMode: =If(App.Width < 700, "list", Coalesce(varPoView, "table"))
                        Width: =Parent.Width
                        WidthAction: =48
                        WidthColumn1: =130
                        WidthColumn2: =80
                        WidthColumn3: =110
                        WidthId: =
                        WidthPerson: =160
                        WidthPriority: =80
                        WidthProgress: =
                        WidthStatus: =80
                        WidthSubtitle: =80
                        WidthTitle: =160
                        WidthWhen: =130
