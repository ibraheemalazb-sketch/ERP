Screens:
  scrPOs:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "POs");
        Set(varNavSelectedID, 33);
        Set(varProcurementEntity, "PurchaseOrder");
        Set(varProcurementMode, "View");
        Set(varPoQuick, Blank());
        Set(varPoMenuId, 0);
        Set(varPoFilters, false);
        Set(varPoView, If(App.Width < 700, "list", "table"));
        Set(varPoPane, "Details");
        Reset(cmpPoView);
        Reset(cmpPoTable);
        Reset(cmpPoNew);
        Reset(cmpPoStep);
        If(IsBlank(varPoStatus), Set(varPoStatus, "All"));
        If(IsBlank(varPoProjectID), Set(varPoProjectID, 0));
        If(IsBlank(varPoPreparer), Set(varPoPreparer, "All"));
        If(IsBlank(varPoApprover), Set(varPoApprover, "All"));
        Set(varPoMailOpen, false);
        Set(varPoMailBusy, false);
        UpdateContext({locPoHistTop: 50});
        Reset(cmpPoHistory);
        Select(btnPoReload)
    Children:
      - conPoReload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =1
            Width: =1
          Children:
            - btnPoReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        If(
                            varProcurementScope = "Own",
                            ClearCollect(
                                colPurchaseOrders,
                                FirstN(
                                    SortByColumns(
                                        Filter(
                                            PurchaseOrders,
                                            And(
                                                ProjectID = gblUser.ProjectID,
                                                Or(
                                                    PreparedByID = gblCurrentEmployee.ID,
                                                    ApprovedByID = gblCurrentEmployee.ID
                                                )
                                            )
                                        ),
                                        "ID",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            If(
                                varProcurementScope = "Project",
                                ClearCollect(
                                    colPurchaseOrders,
                                    Filter(
                                        FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500),
                                        Project.Value in colProjects.ProjectCode
                                    )
                                ),
                                ClearCollect(
                                    colPurchaseOrders,
                                    FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500)
                                )
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل أوامر الشراء.", "Purchase orders could not be loaded."),
                            NotificationType.Error
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPurchaseOrderLines,
                            Filter(
                                FirstN(SortByColumns(PurchaseOrderLines, "ID", SortOrder.Descending), 500),
                                PO.Id in colPurchaseOrders.ID
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل بنود الأمر.", "Order lines could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPoApprovals,
                            Filter(
                                FirstN(SortByColumns(ApprovalHistory, "ID", SortOrder.Descending), 500),
                                RequestType.Value = "Purchase Order"
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل مسار الاعتماد.", "Approval history could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colProcPeople,
                            ForAll(
                                FirstN(
                                    SortByColumns(
                                        Filter(Employees, Status.Value = "Active"),
                                        "FullName",
                                        SortOrder.Ascending
                                    ),
                                    200
                                ),
                                {
                                    ID: ID,
                                    FullName: FullName,
                                    Email: Email,
                                    EmployeeNumber: Coalesce(EmployeeNumber, "")
                                }
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل الموظفين.", "People could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    With(
                        {row: LookUp(colPurchaseOrders, ID = varCurrentPO.ID)},
                        If(
                            Not(IsBlank(row)),
                            Set(varCurrentPO, row);
                            UpdateContext({locPoHistTop: 50});
                            Reset(cmpPoHistory)
                        )
                    )
                  Text: ="Reload"
                  Width: =1
      - conPoNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpPoNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conPoPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =If(App.Width < 700, cmpPoPhone.Height, 0)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =12
            PaddingTop: =cmpPoTop.Height + 12
            Width: =Parent.Width
          Children:
            - conPoList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsBlank(varCurrentPO)
                  Width: =Parent.Width
                Children:
                  - conPoHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conPoTitles:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =5
                              PaddingRight: =5
                              Width: =Parent.Width
                            Children:
                              - lblPoTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =If(gblLanguage = "Arabic", "كل أوامر الشراء", "All purchase orders")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblPoCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.BodySmall
                                    Text: |-
                                      =Concatenate(
                                          Text(
                                              CountRows(
                                                  Filter(
                                                      colPurchaseOrders,
                                                      And(
                                                          Or(IsBlank(varPoStatus), varPoStatus = "All", POStatus.Value = varPoStatus, And(varPoStatus = "InProgress", POStatus.Value = "In Progress")),
                                                          Or(Coalesce(varPoProjectID, 0) = 0, ProjectID = varPoProjectID),
                                                          Or(Or(IsBlank(varPoPreparer), varPoPreparer = "All"), PreparedBy.Value = varPoPreparer),
                                                          Or(Or(IsBlank(varPoApprover), varPoApprover = "All"), CountRows(Filter(colPoApprovals, And(RequestNumber = PONumber, Approver.Value = varPoApprover))) > 0),
                                                          Or(
                                                              IsBlank(Trim(txtPoSearch.Text)),
                                                              Trim(txtPoSearch.Text) in Coalesce(PONumber, ""),
                                                              Trim(txtPoSearch.Text) in Coalesce(Title, ""),
                                                              Trim(txtPoSearch.Text) in Coalesce(Vendors.Value, ""),
                                                              Trim(txtPoSearch.Text) in Coalesce(Project.Value, "")
                                                          )
                                                      )
                                                  )
                                              )
                                          ),
                                          If(gblLanguage = "Arabic", " من ", " of "),
                                          Text(CountRows(colPurchaseOrders)),
                                          If(gblLanguage = "Arabic", " أمر", " orders")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - btnPoNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              Icon: ="Add"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =140
                              OnSelect: |-
                                =Set(varProcurementEntity, "PurchaseOrder");
                                Set(varProcurementMode, "New");
                                Set(varCurrentPO, Blank());
                                Set(varSelectedPR, Blank());
                                Set(varSourcePR, Blank());
                                Set(varPoQuick, Blank());
                                Set(varPoPane, "Details");
                                Navigate(scrPOEditor, ScreenTransition.Cover)
                              PaddingLeft: =0
                              PaddingRight: =0
                              Text: =If(gblLanguage = "Arabic", "أمر شراء", "Purchase order")
                              Visible: =App.Width >= 700
                              Width: =160
                  - Container4:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =conPoTools.Height+If(varPoFilters,conPoFilterRow.Height,0)+If(App.Width<700,galPoChips.Height,0)+Self.PaddingBottom*2.5
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =7
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - conPoTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 50, 44)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - txtPoSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في أوامر الشراء", "Search purchase orders")
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "ابحث في الأوامر", "Search orders...")
                                    Width: =If(App.Width < 700, Max(160, Parent.Width - 120), Max(200, Parent.Width - 378))
                              - btnPoFilters:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =If(varPoFilters, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                    Height: =40
                                    Icon: ="Filter"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varPoFilters, Not(varPoFilters))
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                                    Width: =If(App.Width < 700, 44, 110)
                              - btnPoRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Height: =40
                                    Icon: ="ArrowSync"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnPoReload)
                                    Text: =""
                                    Tooltip: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                                    Width: =44
                              - cmpPoView:
                                  Control: CanvasComponent
                                  ComponentName: cmpSegmentedControl
                                  Properties:
                                    DefaultValue: =varPoView
                                    Disabled: =
                                    DisplayMode: ="Both"
                                    EqualWidth: =true
                                    Height: =40
                                    IconPosition: ="Left"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varPoView, cmpPoView.SelectedValue)
                                    Options: |-
                                      =Table(
                                          {Value: "table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                          {Value: "list", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                      )
                                    Size: ="Medium"
                                    Theme: =
                                    Visible: =App.Width >= 700
                                    Width: =188
                        - galPoChips:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              FillPortions: =0
                              Height: =36
                              Items: |-
                                =Table(
                                    {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {K: "Submitted", L: If(gblLanguage = "Arabic", "مقدم", "Submitted")},
                                    {K: "Approved", L: If(gblLanguage = "Arabic", "معتمد", "Approved")},
                                    {K: "Issued", L: If(gblLanguage = "Arabic", "صادر", "Issued")}
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =128
                              Visible: =App.Width < 700
                              Width: =Parent.Width
                            Children:
                              - btnPoChip:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |-
                                      =If(
                                          Coalesce(varPoStatus, "All") = ThisItem.K,
                                          ButtonAppearance.Primary,
                                          ButtonAppearance.Outline
                                      )
                                    Height: =30
                                    OnSelect: =Set(varPoStatus, ThisItem.K)
                                    Text: =ThisItem.L
                                    Width: =120
                        - conPoFilterRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 150, 50)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =5
                              LayoutMinHeight: =44
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              PaddingBottom: =5
                              PaddingTop: =5
                              Visible: =varPoFilters
                              Width: =Parent.Width
                            Children:
                              - cmbPoProject:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    DefaultSelectedItems: |-
                                      =If(
                                          Coalesce(varPoProjectID, 0) = 0,
                                          Filter(colProjects, false),
                                          Filter(colProjects, ID = varPoProjectID)
                                      )
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                                    ItemDisplayText: =ThisItem.ProjectCode
                                    Items: =colProjects
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =160
                                    OnChange: |-
                                      =If(
                                          And(
                                              IsBlank(Self.Selected.ID),
                                              Not(Coalesce(LookUp(colUserPermissions, Module.Value = "Procurement").CanViewAll, true))
                                          ),
                                          Reset(cmbPoProject),
                                          Set(varPoProjectID, Coalesce(Self.Selected.ID, 0))
                                      )
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 180)
                              - cmbPoStatus:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                    DefaultSelectedItems: |-
                                      =Table({K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")})
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All statuses")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.L
                                    Items: |-
                                      =Table(
                                          {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                          {K: "Draft", L: If(gblLanguage = "Arabic", "مسودة", "Draft")},
                                          {K: "Pending", L: If(gblLanguage = "Arabic", "قيد الانتظار", "Pending")},
                                          {K: "Approved", L: If(gblLanguage = "Arabic", "معتمد", "Approved")},
                                          {K: "Issued", L: If(gblLanguage = "Arabic", "صادر", "Issued")},
                                          {K: "InProgress", L: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress")},
                                          {K: "Completed", L: If(gblLanguage = "Arabic", "مكتمل", "Completed")},
                                          {K: "Rejected", L: If(gblLanguage = "Arabic", "مرفوض", "Rejected")},
                                          {K: "Cancelled", L: If(gblLanguage = "Arabic", "ملغي", "Cancelled")}
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varPoStatus, Coalesce(Self.Selected.K, "All"))
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 180)
                              - cmbPoPreparer:
