Screens:
  scrReporting:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "Reporting");
        Set(VarMEALmodule, "Reports");
        Set(varNavSelectedID, 64);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varRepDashProject), Set(varRepDashProject, Blank()));
        If(IsBlank(varRepDashPeriod), Set(varRepDashPeriod, Blank()));
        If(IsBlank(varRepDashError), Set(varRepDashError, false));
        Select(btnRepDashLoad)
    Children:
      - conRepDashNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpRepDashNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conRepDashSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnRepDashLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varRepDashError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colRepSchedules,
                                If(
                                    Coalesce(varRepDashProject.ID, 0) > 0,
                                    Filter(ReportSchedules, ProjectID = varRepDashProject.ID),
                                    FirstN(SortByColumns(ReportSchedules, "DueDate", SortOrder.Ascending), 500)
                                )
                            ),
                            ClearCollect(
                                colRepReports,
                                If(
                                    Coalesce(varRepDashProject.ID, 0) > 0,
                                    Filter(ProjectReports, ProjectID = varRepDashProject.ID),
                                    FirstN(SortByColumns(ProjectReports, "Modified", SortOrder.Descending), 500)
                                )
                            ),
                            ClearCollect(
                                colRepPeriods,
                                Filter(ReportingPeriods, Status.Value = "Active")
                            )
                        );
                        ClearCollect(
                            colRepKPIs,
                            {
                                Key: "upcoming",
                                LabelEn: "Upcoming",
                                LabelAr: "قادمة",
                                Count: CountRows(Filter(colRepSchedules, Status.Value = "Upcoming")),
                                Tone: "info",
                                FilterKind: "schedule",
                                StatusKey: "Upcoming"
                            },
                            {
                                Key: "duesoon",
                                LabelEn: "Due Soon",
                                LabelAr: "قريبة الاستحقاق",
                                Count: CountRows(Filter(colRepSchedules, Status.Value = "Due Soon")),
                                Tone: "warning",
                                FilterKind: "schedule",
                                StatusKey: "Due Soon"
                            },
                            {
                                Key: "overdue",
                                LabelEn: "Overdue",
                                LabelAr: "متأخرة",
                                Count: CountRows(Filter(colRepSchedules, Status.Value = "Overdue")),
                                Tone: "danger",
                                FilterKind: "schedule",
                                StatusKey: "Overdue"
                            },
                            {
                                Key: "inprep",
                                LabelEn: "In Prep",
                                LabelAr: "قيد الإعداد",
                                Count: CountRows(
                                    Filter(
                                        colRepSchedules,
                                        Status.Value = "In Preparation"
                                    )
                                ) + CountRows(
                                    Filter(
                                        colRepReports,
                                        And(
                                            Status.Value = "Draft",
                                            PreparedByID = varMeID
                                        )
                                    )
                                ),
                                Tone: "neutral",
                                FilterKind: "report",
                                StatusKey: "Draft"
                            },
                            {
                                Key: "forreview",
                                LabelEn: "For Review",
                                LabelAr: "للمراجعة",
                                Count: CountRows(
                                    Filter(
                                        colRepReports,
                                        Or(
                                            Status.Value = "Pending Project Manager",
                                            Status.Value = "Pending MEAL",
                                            Status.Value = "Pending Program Director",
                                            "Pending" in Coalesce(Status.Value, "")
                                        )
                                    )
                                ),
                                Tone: "primary",
                                FilterKind: "report",
                                StatusKey: "Pending"
                            },
                            {
                                Key: "approved",
                                LabelEn: "Approved",
                                LabelAr: "معتمدة",
                                Count: CountRows(
                                    Filter(
                                        colRepReports,
                                        Or(
                                            Status.Value = "Approved",
                                            Status.Value = "Sent to Donor"
                                        )
                                    )
                                ),
                                Tone: "success",
                                FilterKind: "report",
                                StatusKey: "Approved"
                            }
                        );
                        ClearCollect(
                            colRepDeadlines,
                            FirstN(
                                SortByColumns(
                                    Filter(
                                        colRepSchedules,
                                        Or(
                                            Status.Value = "Upcoming",
                                            Status.Value = "Due Soon",
                                            Status.Value = "Overdue",
                                            Status.Value = "In Preparation"
                                        )
                                    ),
                                    "DueDate",
                                    SortOrder.Ascending
                                ),
                                20
                            )
                        );
                        ClearCollect(
                            colRepActions,
                            {
                                Key: "overdue",
                                Severity: 1,
                                Tone: "danger",
                                LabelEn: "Overdue schedules",
                                LabelAr: "جداول متأخرة",
                                Count: CountRows(Filter(colRepSchedules, Status.Value = "Overdue")),
                                NavTarget: "schedules",
                                StatusKey: "Overdue"
                            },
                            {
                                Key: "myreview",
                                Severity: 2,
                                Tone: "warning",
                                LabelEn: "Awaiting my review",
                                LabelAr: "بانتظار مراجعتي",
                                Count: CountRows(
                                    Filter(
                                        colRepReports,
                                        And(
                                            Or(
                                                Status.Value = "Pending Project Manager",
                                                Status.Value = "Pending MEAL",
                                                Status.Value = "Pending Program Director",
                                                "Pending" in Coalesce(Status.Value, "")
                                            ),
                                            Or(
                                                ReviewerID = varMeID,
                                                ApproverID = varMeID,
                                                CurrentApproverID = varMeID
                                            )
                                        )
                                    )
                                ),
                                NavTarget: "reports",
                                StatusKey: "Pending"
                            },
                            {
                                Key: "due7",
                                Severity: 3,
                                Tone: "info",
                                LabelEn: "Due within 7 days",
                                LabelAr: "تستحق خلال 7 أيام",
                                Count: CountRows(
                                    Filter(
                                        colRepSchedules,
                                        And(
                                            Not(IsBlank(DueDate)),
                                            DueDate >= Today(),
                                            DueDate <= DateAdd(Today(), 7, TimeUnit.Days),
                                            Or(
                                                Status.Value = "Upcoming",
                                                Status.Value = "Due Soon",
                                                Status.Value = "In Preparation"
                                            )
                                        )
                                    )
                                ),
                                NavTarget: "schedules",
                                StatusKey: "Due Soon"
                            },
                            {
                                Key: "returned",
                                Severity: 4,
                                Tone: "danger",
                                LabelEn: "Returned for revision",
                                LabelAr: "مُعادة للمراجعة",
                                Count: CountRows(
                                    Filter(
                                        colRepReports,
                                        And(
                                            Status.Value = "Returned for Revision",
                                            Or(PreparedByID = varMeID, AssignedToID = varMeID)
                                        )
                                    )
                                ),
                                NavTarget: "reports",
                                StatusKey: "Returned for Revision"
                            }
                        ),
                        Set(varRepDashError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل لوحة التقارير.", "Could not load the reporting dashboard."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
      - conRepDashPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpRepDashPhone.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =16
            PaddingTop: =cmpRepDashTop.Height + 12
            Width: =Parent.Width
          Children:
            - conRepDashHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 120, 44)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                Children:
                  - lblRepDashTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "التقارير", "Reporting")
                        Width: =160
                        Wrap: =false
                  - cmbRepDashProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        DefaultSelectedItems: =If(IsBlank(varRepDashProject), Filter(Projects, false), Filter(Projects, ID = varRepDashProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                        ItemDisplayText: =If(IsBlank(ThisItem.ProjectCode), ThisItem.Title, Concatenate(ThisItem.ProjectCode, " · ", ThisItem.Title))
                        Items: |-
                          =If(
                              varUserHasAllProjects,
                              Projects,
                              Filter(
                                  ForAll(
                                      Filter(colUserProjectAccess, AllProjects = false) As access,
                                      LookUp(Projects, ID = access.ProjectID)
                                  ),
                                  !IsBlank(ID)
                              )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepDashProject, Self.Selected);
                          Select(btnRepDashLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 200)
                  - cmbRepDashPeriod:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الفترة", "Period")
                        DefaultSelectedItems: =If(IsBlank(varRepDashPeriod), Filter(colRepPeriods, false), Filter(colRepPeriods, ID = varRepDashPeriod.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الفترات", "All periods")
                        ItemDisplayText: =Coalesce(ThisItem.Title, ThisItem.PeriodName, Text(ThisItem.ID))
                        Items: =colRepPeriods
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepDashPeriod, Self.Selected);
                          Select(btnRepDashLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 160)
                  - btnRepDashRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnRepDashLoad)
                        Text: =""
                        Width: =44
                  - btnRepDashNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varRepStartFromSchedule, true);
                          Set(varSelectedSchedule, Blank());
                          Navigate(scrReportSchedules, ScreenTransition.None)
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تقرير جديد", "New Report"))
                        Width: =If(App.Width < 700, 44, 130)
            - lblRepDashError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varRepDashError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل البيانات.", "Data could not be loaded.")
                  Visible: =varRepDashError
                  Width: =Parent.Width
                  Wrap: =false
            - galRepDashKPI:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "مؤشرات التقارير", "Reporting KPIs")
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 200, 100)
                  Items: =colRepKPIs
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =4
                  TemplateSize: =If(App.Width < 700, Parent.Width / 2 - 8, Parent.Width / 6 - 4)
                  Width: =Parent.Width
                Children:
                  - conRepDashKPICard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =10
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =Parent.TemplateWidth - 8
                        X: =4
                        Y: =4
                      Children:
                        - btnRepDashKPI:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              FillPortions: =1
                              Height: =Parent.Height - 8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    ThisItem.FilterKind = "schedule",
                                    Set(varRepSchedFltStatus, ThisItem.StatusKey);
                                    Set(varSelectedSchedule, Blank());
                                    Navigate(scrReportSchedules, ScreenTransition.None),
                                    Set(varRepFltStatus, ThisItem.StatusKey);
                                    Set(varRepFltProject, varRepDashProject);
                                    Set(varSelectedReport, Blank());
                                    Navigate(scrReports, ScreenTransition.None)
                                )
                              Text: |-
                                =Concatenate(
                                    If(gblLanguage = "Arabic", ThisItem.LabelAr, ThisItem.LabelEn),
                                    Char(10),
                                    Text(ThisItem.Count)
                                )
                              Width: =Parent.Width
            - lblRepDashDeadlinesHdr:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.SemiBold
                  Height: =28
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =14
                  Text: =If(gblLanguage = "Arabic", "مواعيدي", "MY REPORTING DEADLINES")
                  Width: =Parent.Width
                  Wrap: =false
            - galRepDashDeadlines:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "مواعيد التقارير", "Reporting deadlines")
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =Min(320, Max(80, CountRows(colRepDeadlines) * 72 + 8))
                  Items: |-
                    =If(
                        IsBlank(varRepDashPeriod),
                        colRepDeadlines,
                        Filter(colRepDeadlines, ReportingPeriodID = varRepDashPeriod.ID)
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =68
                  Width: =Parent.Width
                Children:
                  - conRepDashDeadRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.IsEscalated, ColorFade(fxThemeColor("Danger"), 0.92), fxThemeColor("Surface"))
                        Height: =Parent.TemplateHeight - 4
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingBottom: =6
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =6
                        Width: =Parent.TemplateWidth
                        Y: =2
                      Children:
                        - btnRepDashDeadSelect:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              FillPortions: =1
                              Height: =Parent.Height - 4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varSelectedSchedule, ThisItem);
                                Navigate(scrReportSchedules, ScreenTransition.None)
                              Text: |-
                                =Concatenate(
                                    Coalesce(ThisItem.ReportType.Value, ThisItem.ReportType, "-"),
                                    " · ",
                                    Coalesce(ThisItem.Project.Value, "-"),
                                    Char(10),
                                    Coalesce(ThisItem.ReportingPeriod.Value, "-"),
                                    " · ",
                                    If(gblLanguage = "Arabic", "داخلي ", "Internal "),
                                    If(IsBlank(ThisItem.InternalDueDate), "-", Text(ThisItem.InternalDueDate, "yyyy-mm-dd")),
                                    " · ",
                                    If(gblLanguage = "Arabic", "استحقاق ", "Due "),
                                    If(IsBlank(ThisItem.DueDate), "-", Text(ThisItem.DueDate, "yyyy-mm-dd")),
                                    Char(10),
                                    Coalesce(ThisItem.Status.Value, "-"),
                                    " · ",
                                    If(gblLanguage = "Arabic", "تذكيرات ", "Reminders "),
                                    Text(Coalesce(ThisItem.ReminderCount, 0)),
                                    If(ThisItem.IsEscalated, If(gblLanguage = "Arabic", " · مُصعَّد", " · Escalated"), "")
                                )
                              Width: =Parent.Width
            - lblRepDashEmptyDead:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("TextMuted")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(CountRows(colRepDeadlines) = 0, 28, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "لا توجد مواعيد قادمة.", "No upcoming deadlines.")
                  Visible: =CountRows(colRepDeadlines) = 0
                  Width: =Parent.Width
                  Wrap: =false
            - lblRepDashActionsHdr:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.SemiBold
                  Height: =28
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =14
                  Text: =If(gblLanguage = "Arabic", "إجراء مطلوب", "ACTION REQUIRED")
                  Width: =Parent.Width
                  Wrap: =false
            - galRepDashActions:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "إجراءات مطلوبة", "Actions required")
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Min(280, Max(60, CountRows(Filter(colRepActions, Count > 0)) * 64 + 8))
                  Items: =SortByColumns(Filter(colRepActions, Count > 0), "Severity", SortOrder.Ascending)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =60
                  Width: =Parent.Width
                Children:
                  - conRepDashActRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 6
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =8
                        RadiusBottomLeft: =gblTheme.Radius.Small
                        RadiusBottomRight: =gblTheme.Radius.Small
                        RadiusTopLeft: =gblTheme.Radius.Small
                        RadiusTopRight: =gblTheme.Radius.Small
                        Width: =Parent.TemplateWidth
                        Y: =3
                      Children:
                        - lblRepDashActTone:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Fill: |-
                                =Switch(
                                    ThisItem.Tone,
                                    "danger", fxThemeColor("Danger"),
                                    "warning", fxThemeColor("Warning"),
                                    "info", fxThemeColor("Primary"),
                                    fxThemeColor("TextMuted")
                                )
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =14
                              Text: =Text(ThisItem.Count)
                              Width: =48
                              Wrap: =false
                        - btnRepDashAct:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              FillPortions: =1
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    ThisItem.NavTarget = "schedules",
                                    Set(varRepSchedFltStatus, ThisItem.StatusKey);
                                    Navigate(scrReportSchedules, ScreenTransition.None),
                                    Set(varRepFltStatus, ThisItem.StatusKey);
                                    Set(varRepFltProject, varRepDashProject);
                                    Navigate(scrReports, ScreenTransition.None)
                                )
                              Text: =If(gblLanguage = "Arabic", ThisItem.LabelAr, ThisItem.LabelEn)
                              Width: =200
            - lblRepDashEmptyAct:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("TextMuted")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(CountRows(Filter(colRepActions, Count > 0)) = 0, 28, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "لا توجد إجراءات مطلوبة حالياً.", "No actions required right now.")
                  Visible: =CountRows(Filter(colRepActions, Count > 0)) = 0
                  Width: =Parent.Width
                  Wrap: =false
