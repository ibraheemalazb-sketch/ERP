      - cmpRepDashPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 64, Module: "Reporting", Title: If(gblLanguage = "Arabic", "التقارير", "Reporting"), Icon: "Dashboard", Visible: true},
                  {ID: 74, Module: "Reports", Title: If(gblLanguage = "Arabic", "القائمة", "Reports"), Icon: "Document", Visible: true},
                  {ID: 75, Module: "Schedules", Title: If(gblLanguage = "Arabic", "الجداول", "Schedules"), Icon: "Calendar", Visible: true},
                  {ID: 60, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Chart", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
