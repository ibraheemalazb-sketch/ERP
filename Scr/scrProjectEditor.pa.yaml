Screens:
  scrProjectEditor:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "ProjectEditor");
        If(IsBlank(varEditorEntity), Set(varEditorEntity, "Project"));
        If(IsBlank(varEditorMode), Set(varEditorMode, "New"));
        Set(varEdContinue, false);
        Set(varEdAddAnother, false);
        If(IsBlank(varEditingPhase), Set(varEditingPhase, Blank()));
        If(IsBlank(varEditingPlan), Set(varEditingPlan, Blank()));
        If(
            IsBlank(varSelectedProject),
            Clear(colEditorActivities);
            Clear(colEditorPhases),
            ClearCollect(colEditorActivities, Filter(ProjectsActivities, ProjectID = varSelectedProject.ID));
            ClearCollect(colEditorPhases, Filter(ProjectPhases, ProjectID = varSelectedProject.ID))
        )
    Children:
      - conEdNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpEdNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - conEdSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
            X: =0
            Y: =0
          Children:
            - lblEdWide:
                Control: Label@2.5.1
                Properties:
                  Height: =1
                  Text: =If(App.Width - If(App.Width < 700, 24, If(gblMenuExpanded, 240, 68) + 24) >= 860, "wide", "narrow")
                  Width: =1
                  X: =0
                  Y: =0
            - btnEdReturn:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =If(
                        varReturnScreen = "Tasks",
                        Navigate(scrTasks, ScreenTransition.UnCover),
                        Set(
                            varProjectTab,
                            Switch(
                                varEditorEntity,
                                "Member", "Members",
                                "Activity", "Activities",
                                "Task", "Tasks",
                                Coalesce(varReturnTab, "General")
                            )
                        );
                        Navigate(ScrAllProjects, ScreenTransition.UnCover, {varShowDetails: true})
                    )
                  Text: ="Return"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
      - conEdPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =If(App.Width < 700, cmpEdPhoneNav.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 12)
            PaddingRight: =12
            PaddingTop: =cmpEdTopBar.Height + 8
            Width: =Parent.Width
          Children:
            - conEdBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - cmpEdTopBar.Height - 8 - If(App.Width < 700, cmpEdPhoneNav.Height + 8, 12)
                  LayoutDirection: =If(lblEdWide.Text = "wide", LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - galEdNav:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        Height: =If(lblEdWide.Text = "wide", Parent.Height, 52)
                        Items: |-
                          =Table(
                              {ID: "Project", Label: If(gblLanguage = "Arabic", "المشروع", "Project"), Icon: "Briefcase"},
                              {ID: "Member", Label: If(gblLanguage = "Arabic", "عضو", "Member"), Icon: "People"},
                              {ID: "Phase", Label: If(gblLanguage = "Arabic", "مرحلة", "Phase"), Icon: "Flag"},
                              {ID: "Plan", Label: If(gblLanguage = "Arabic", "خطة", "Plan"), Icon: "Calendar"},
                              {ID: "Activity", Label: If(gblLanguage = "Arabic", "نشاط", "Activity"), Icon: "Flow"},
                              {ID: "Task", Label: If(gblLanguage = "Arabic", "مهمة", "Task"), Icon: "ClipboardTask"}
                          )
                        TemplatePadding: =4
                        TemplateSize: =If(lblEdWide.Text = "wide", 168, 148)
                        Width: =If(lblEdWide.Text = "wide", 180, Parent.Width)
                        WrapCount: =If(lblEdWide.Text = "wide", 6, 1)
                      Children:
                        - btnEdEntity:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varEditorEntity = ThisItem.ID, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =44
                              Icon: =ThisItem.Icon
                              OnSelect: =Set(varEditorEntity, ThisItem.ID)
                              Text: =ThisItem.Label
                              Width: =Parent.TemplateWidth
                  - conEdForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =If(lblEdWide.Text = "wide", Parent.Height, Parent.Height - 64)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(lblEdWide.Text = "wide", Parent.Width - 192, Parent.Width)
                      Children:
                        - conEdProject:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =1760
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varEditorEntity = "Project"
                              Width: =Parent.Width
                            Children:
                              - conEdPrjHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjHead:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =22
                                          Image: =fxSvg("Box", fxThemeInk("Primary"))
                                          Width: =22
                                    - lblEdPrjHead:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("TextPrimary")
                                          FillPortions: =1
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =28
                                          Size: =16
                                          Text: =If(varEditorMode = "New", If(gblLanguage = "Arabic", "مشروع جديد", "New project"), If(gblLanguage = "Arabic", "تعديل المشروع", "Edit project"))
                                          Width: =200
                                    - lblEdPrjStatus:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =Align.Center
                                          Color: =fxToneInk(Switch(cmbEdProjectStatus.Selected.Value, "Active", "success", "Completed", "completed", "Planning", "info", "Planed", "info", "On Hold", "warning", "Cancelled", "danger", "muted"))
                                          Fill: =fxToneFill(Switch(cmbEdProjectStatus.Selected.Value, "Active", "success", "Completed", "completed", "Planning", "info", "Planed", "info", "On Hold", "warning", "Cancelled", "danger", "muted"))
                                          Font: =gblTheme.Typography.FontFamily
                                          Height: =26
                                          RadiusBottomLeft: =gblTheme.Radius.Round
                                          RadiusBottomRight: =gblTheme.Radius.Round
                                          RadiusTopLeft: =gblTheme.Radius.Round
                                          RadiusTopRight: =gblTheme.Radius.Round
                                          Size: =11
                                          Text: =Coalesce(cmbEdProjectStatus.Selected.Value, "-")
                                          Width: =110
                              - conEdPrjSec1:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjSec1:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =18
                                          Image: =fxSvg("File", fxThemeInk("Primary"))
                                          Width: =18
                                    - lblEdPrjSec1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Text: =If(gblLanguage = "Arabic", "الأساسيات", "Basics")
                                          Width: =240
                              - txtEdProjectTitle:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "اسم المشروع", "Project name")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.Title, ""))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "اسم المشروع", "Project name")
                                    Width: =Parent.Width
                              - txtEdProjectCode:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "رمز المشروع", "Project code")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.ProjectCode, ""))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "رمز المشروع", "Project code")
                                    Width: =Parent.Width
                              - txtEdAgreement:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "رقم الاتفاقية", "Agreement number")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.AgreementNumber, ""))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "رقم الاتفاقية", "Agreement number")
                                    Width: =Parent.Width
                              - txtEdDonor:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.Donor, ""))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                    Width: =Parent.Width
                              - txtEdFolder:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "مسار المجلد", "Folder path")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.FolderPath, ""))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "مسار المجلد", "Folder path")
                                    Width: =Parent.Width
                              - conEdPrjSec2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjSec2:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =18
                                          Image: =fxSvg("Layers", fxThemeInk("Primary"))
                                          Width: =18
                                    - lblEdPrjSec2:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Text: =If(gblLanguage = "Arabic", "التصنيف والحالة", "Classification and status")
                                          Width: =280
                              - cmbEdSector:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Choices(Projects.Sector), false), Filter(Choices(Projects.Sector), Value = varEditingProject.Sector.Value))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Projects.Sector)
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdProjectStatus:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Choices(Projects.Status), Value = "Planning"), Filter(Choices(Projects.Status), Value = varEditingProject.Status.Value))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Projects.Status)
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdHealth:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الصحة", "Health")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Choices(Projects.HealthStatus), Value = "On Track"), Filter(Choices(Projects.HealthStatus), Value = varEditingProject.HealthStatus.Value))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "حالة الصحة", "Health status")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Projects.HealthStatus)
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdDepartment:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "القسم", "Department")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject), Coalesce(varEditingProject.DepartmentID, 0) = 0), Filter(Departments, false), Filter(Departments, ID = varEditingProject.DepartmentID))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "القسم", "Department")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Departments
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - conEdPrjSec3:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjSec3:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =18
                                          Image: =fxSvg("Users", fxThemeInk("Primary"))
                                          Width: =18
                                    - lblEdPrjSec3:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Text: =If(gblLanguage = "Arabic", "الفريق", "People")
                                          Width: =240
                              - cmbEdManager:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "مدير المشروع", "Project manager")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Employees, false), Filter(Employees, ID = Coalesce(varEditingProject.ProjectManagerID, varEditingProject.ProjectManager.Id)))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "مدير المشروع", "Project manager")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.FullName
                                    Items: =Filter(Employees, Status.Value = "Active")
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdFinance:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "المسؤول المالي", "Finance officer")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Employees, false), Filter(Employees, ID = Coalesce(varEditingProject.FinanceOfficerID, varEditingProject.FinanceOfficer.Id)))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المسؤول المالي", "Finance officer")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.FullName
                                    Items: =Filter(Employees, Status.Value = "Active")
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdMeal:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "مسؤول المتابعة", "MEAL officer")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Employees, false), Filter(Employees, ID = Coalesce(varEditingProject.MEALOfficerID, varEditingProject.MEALOfficer.Id)))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "مسؤول المتابعة", "MEAL officer")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.FullName
                                    Items: =Filter(Employees, Status.Value = "Active")
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdMeal2:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "مسؤول متابعة إضافي", "Second MEAL officer")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Filter(Employees, false), Filter(Employees, ID = Coalesce(varEditingProject.MEALOfficer0ID, varEditingProject.MEALOfficer0.Id)))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "مسؤول متابعة إضافي", "Second MEAL officer")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.FullName
                                    Items: =Filter(Employees, Status.Value = "Active")
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - conEdPrjSec4:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjSec4:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =18
                                          Image: =fxSvg("Map", fxThemeInk("Primary"))
                                          Width: =18
                                    - lblEdPrjSec4:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Text: =If(gblLanguage = "Arabic", "المكان", "Place")
                                          Width: =240
                              - cmbEdGovernorate:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "المحافظة", "Governorate")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject), Coalesce(varEditingProject.GovernorateID, 0) = 0), Filter(Locations, false), Filter(Locations, ID = varEditingProject.GovernorateID))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المحافظة", "Governorate")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.Governorate
                                    Items: =Locations
                                    SelectMultiple: =false
                                    Width: =Parent.Width
                              - cmbEdDistrict:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "المديرية", "District")
                                    DefaultSelectedItems: =If(Or(varEditorMode = "New", IsBlank(varEditingProject), IsBlank(varEditingProject.District)), Filter(Locations, false), varEditingProject.District)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المديرية", "District")
                                    IsSearchable: =true
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Filter(Locations, Governorate = cmbEdGovernorate.Selected.Governorate)
                                    SelectMultiple: =true
                                    Width: =Parent.Width
                              - conEdPrjSec5:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =28
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.Width
                                  Children:
                                    - imgEdPrjSec5:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =18
                                          Image: =fxSvg("Calendar", fxThemeInk("Primary"))
                                          Width: =18
                                    - lblEdPrjSec5:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Text: =If(gblLanguage = "Arabic", "الوقت والميزانية", "Schedule and budget")
                                          Width: =280
                              - dteEdStart:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    DefaultDate: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Blank(), varEditingProject.StartDate)
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ البداية", "Start date")
                                    Width: =Parent.Width
                              - dteEdEnd:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    DefaultDate: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Blank(), varEditingProject.EndDate)
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ النهاية", "End date")
                                    Width: =Parent.Width
                              - txtEdBudget:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الميزانية", "Budget")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject), IsBlank(varEditingProject.Budget)), "", Text(varEditingProject.Budget))
                                    Height: =40
                                    Placeholder: =If(gblLanguage = "Arabic", "الميزانية", "Budget")
                                    Width: =Parent.Width
                              - txtEdBudgetUsed:
