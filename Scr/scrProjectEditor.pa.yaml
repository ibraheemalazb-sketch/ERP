                                          Width: =170
                                    - btnEdProjectSave:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Primary
                                          Height: =36
                                          Icon: ="Save"
                                          OnSelect: |-
                                            =If(
                                                Or(IsBlank(Trim(txtEdProjectTitle.Text)), IsBlank(Trim(txtEdProjectCode.Text))),
                                                Notify(If(gblLanguage = "Arabic", "الاسم والرمز مطلوبان", "Name and code are required"), NotificationType.Warning),
                                                If(
                                                    IsBlank(cmbEdProjectStatus.Selected),
                                                    Notify(If(gblLanguage = "Arabic", "اختر الحالة", "Choose a status"), NotificationType.Warning),
                                                    If(
                                                        And(Not(IsBlank(dteEdStart.SelectedDate)), Not(IsBlank(dteEdEnd.SelectedDate)), dteEdEnd.SelectedDate < dteEdStart.SelectedDate),
                                                        Notify(If(gblLanguage = "Arabic", "تاريخ النهاية قبل البداية", "End date is before the start date"), NotificationType.Warning),
                                                        With(
                                                            {
                                                                bud: If(IsNumeric(txtEdBudget.Text), Value(txtEdBudget.Text), 0),
                                                                used: If(IsNumeric(txtEdBudgetUsed.Text), Value(txtEdBudgetUsed.Text), 0),
                                                                prog: If(IsNumeric(txtEdProgress.Text), Min(100, Max(0, Value(txtEdProgress.Text))), 0)
                                                            },
                                                            Set(
                                                                varEdSaved,
                                                                IfError(
                                                                    Patch(
                                                                        Projects,
                                                                        If(Or(varEditorMode = "New", IsBlank(varEditingProject)), Defaults(Projects), LookUp(Projects, ID = varEditingProject.ID)),
                                                                        {
                                                                            Title: Trim(txtEdProjectTitle.Text),
                                                                            ProjectCode: Trim(txtEdProjectCode.Text),
                                                                            AgreementNumber: Trim(txtEdAgreement.Text),
                                                                            Donor: Trim(txtEdDonor.Text),
                                                                            FolderPath: Trim(txtEdFolder.Text),
                                                                            Sector: If(IsBlank(cmbEdSector.Selected), Blank(), {Value: cmbEdSector.Selected.Value}),
                                                                            Status: {Value: cmbEdProjectStatus.Selected.Value},
                                                                            HealthStatus: If(IsBlank(cmbEdHealth.Selected), Blank(), {Value: cmbEdHealth.Selected.Value}),
                                                                            Department: If(IsBlank(cmbEdDepartment.Selected), Blank(), {Id: cmbEdDepartment.Selected.ID, Value: cmbEdDepartment.Selected.Title}),
                                                                            DepartmentID: If(IsBlank(cmbEdDepartment.Selected), Blank(), cmbEdDepartment.Selected.ID),
                                                                            ProjectManager: If(IsBlank(cmbEdManager.Selected), Blank(), {Id: cmbEdManager.Selected.ID, Value: cmbEdManager.Selected.FullName}),
                                                                            ProjectManagerID: If(IsBlank(cmbEdManager.Selected), Blank(), cmbEdManager.Selected.ID),
                                                                            ManagerID: If(IsBlank(cmbEdManager.Selected), Blank(), cmbEdManager.Selected.ID),
                                                                            FinanceOfficer: If(IsBlank(cmbEdFinance.Selected), Blank(), {Id: cmbEdFinance.Selected.ID, Value: cmbEdFinance.Selected.FullName}),
                                                                            FinanceOfficerID: If(IsBlank(cmbEdFinance.Selected), Blank(), cmbEdFinance.Selected.ID),
                                                                            FinanceID: If(IsBlank(cmbEdFinance.Selected), Blank(), cmbEdFinance.Selected.ID),
                                                                            MEALOfficer: If(IsBlank(cmbEdMeal.Selected), Blank(), {Id: cmbEdMeal.Selected.ID, Value: cmbEdMeal.Selected.FullName}),
                                                                            MEALOfficerID: If(IsBlank(cmbEdMeal.Selected), Blank(), cmbEdMeal.Selected.ID),
                                                                            MEALOfficer0: If(IsBlank(cmbEdMeal2.Selected), Blank(), {Id: cmbEdMeal2.Selected.ID, Value: cmbEdMeal2.Selected.FullName}),
                                                                            MEALOfficer0ID: If(IsBlank(cmbEdMeal2.Selected), Blank(), cmbEdMeal2.Selected.ID),
                                                                            Governorate: If(IsBlank(cmbEdGovernorate.Selected), Blank(), {Id: cmbEdGovernorate.Selected.ID, Value: cmbEdGovernorate.Selected.Governorate}),
                                                                            GovernorateID: If(IsBlank(cmbEdGovernorate.Selected), Blank(), cmbEdGovernorate.Selected.ID),
                                                                            District: If(CountRows(cmbEdDistrict.SelectedItems) = 0, Blank(), ForAll(cmbEdDistrict.SelectedItems, {Id: ID, Value: Title})),
                                                                            StartDate: dteEdStart.SelectedDate,
                                                                            EndDate: dteEdEnd.SelectedDate,
                                                                            Budget: bud,
                                                                            BudgetUsed: used,
                                                                            BudgetUtilization: If(bud <= 0, 0, Round(used / bud * 100, 1)),
                                                                            Progress: prog,
                                                                            Description: txtEdDescription.Text
                                                                        }
                                                                    ),
                                                                    Blank()
                                                                )
                                                            );
                                                            If(
                                                                IsBlank(varEdSaved),
                                                                Notify(If(gblLanguage = "Arabic", "تعذر الحفظ", "Could not save"), NotificationType.Error),
                                                                Set(varSelectedProject, varEdSaved);
                                                                Set(varEditingProject, varEdSaved);
                                                                If(
                                                                    varEdContinue,
                                                                    Set(varEdContinue, false);
                                                                    Set(varEditorEntity, "Member");
                                                                    Set(varEditorMode, "New");
                                                                    Set(varEditingMember, Blank());
                                                                    Notify(If(gblLanguage = "Arabic", "أُضيف المشروع. أضف عضواً.", "Project saved. Add a member."), NotificationType.Success),
                                                                    Select(btnEdReturn)
                                                                )
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                          Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                                          Width: =100
                        - conEdMember:
