                                          Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                                          Width: =90
                                    - btnEdTaskSave:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Primary
                                          Height: =36
                                          OnSelect: |-
                                            =If(
                                                Or(IsBlank(varSelectedProject), IsBlank(Trim(txtEdTaskTitle.Text)), IsBlank(cmbEdTaskActivity.Selected)),
                                                Notify(If(gblLanguage = "Arabic", "الاسم والنشاط الفرعي مطلوبان", "Name and sub activity are required"), NotificationType.Warning),
                                                If(
                                                    And(Not(IsBlank(dteEdTaskStart.SelectedDate)), Not(IsBlank(dteEdTaskDue.SelectedDate)), dteEdTaskDue.SelectedDate < dteEdTaskStart.SelectedDate),
                                                    Notify(If(gblLanguage = "Arabic", "الاستحقاق قبل البداية", "Due date is before the start"), NotificationType.Warning),
