                                                    Set(
                                                        varEdSaved,
                                                        IfError(
                                                            Patch(
                                                                Risks,
                                                                If(varEditorMode = "New", Defaults(Risks), LookUp(Risks, ID = varEditingRisk.ID)),
                                                                {
                                                                    Title: Trim(txtEdRiskTitle.Text),
                                                                    Project: {Id: varSelectedProject.ID, Value: varSelectedProject.Title},
                                                                    ProjectID: varSelectedProject.ID,
                                                                    Category: {Value: cmbEdRiskCategory.Selected.Value},
