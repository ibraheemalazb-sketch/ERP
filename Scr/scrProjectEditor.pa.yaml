                                  Children:
                                    - btnEdProjectCancel:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Subtle
                                          Height: =36
                                          Icon: ="Dismiss"
                                          OnSelect: =Select(btnEdReturn)
                                          Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                                          Width: =100
                                    - btnEdProjectContinue:
                                        Control: ModernButton@1.0.0
