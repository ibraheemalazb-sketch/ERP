                                    Height: =32
                                    PaddingLeft: =8
                                    Size: =12
                                    Text: |-
                                      =With(
                                          {
                                              bud: If(IsNumeric(txtEdBudget.Text), Value(txtEdBudget.Text), 0),
                                              used: If(IsNumeric(txtEdBudgetUsed.Text), Value(txtEdBudgetUsed.Text), 0)
                                          },
                                          If(gblLanguage = "Arabic", "نسبة الاستخدام ", "Utilization ") & Text(If(bud <= 0, 0, Round(used / bud * 100, 1)), "0.0") & "%"
                                      )
                                    Width: =Parent.Width
                              - lblEdDescL:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =20
                                    Size: =12
                                    Text: =If(gblLanguage = "Arabic", "الوصف", "Description")
                                    Width: =Parent.Width
                              - txtEdDescription:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الوصف", "Description")
                                    Default: =If(Or(varEditorMode = "New", IsBlank(varEditingProject)), "", Coalesce(varEditingProject.Description, ""))
