                                                                    Status: {Value: If(Value(txtEdTaskProgress.Text) >= 100, "Completed", If(Value(txtEdTaskProgress.Text) <= 0, "Not Started", "In Progress"))},
                                                                    Progress: Value(txtEdTaskProgress.Text),
                                                                    TaskDescription: txtEdTaskDesc.Text,
                                                                    Remarks: txtEdTaskRemarks.Text
