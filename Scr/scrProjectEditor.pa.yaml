                                                    {
                                                        work: If(raw >= 100, "Completed", If(And(picked = "Completed", raw < 100), "Completed", picked)),
                                                        prog: If(Or(raw >= 100, picked = "Completed"), 100, If(picked = "Not Started", 0, raw))
                                                    },
                                                    If(
                                                        Or(IsBlank(varSelectedProject), IsBlank(Trim(txtEdActivityTitle.Text))),
