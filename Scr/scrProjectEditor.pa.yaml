                                                                            'Completed Tasks': If(Or(varEditorMode = "New", IsBlank(varEditingActivity)), 0, Coalesce(varEditingActivity.'Completed Tasks', 0))
                                                                        }
                                                                    ),
                                                                    Blank()
                                                                )
                                                            );
                                                            If(
