                                                                Title: cmbEdMemberEmployee.Selected.FullName,
                                                                Project: {Id: cmbEdMemberProject.Selected.ID, Value: cmbEdMemberProject.Selected.Title},
                                                                Employee: {Id: cmbEdMemberEmployee.Selected.ID, Value: cmbEdMemberEmployee.Selected.FullName},
                                                                RoleInProject: {Id: cmbEdMemberRole.Selected.ID, Value: cmbEdMemberRole.Selected.Title},
