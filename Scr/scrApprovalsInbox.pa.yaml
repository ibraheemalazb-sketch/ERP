            OnSelect: |-
              =With(
                  {_f: Filter(
                      colAprAll,
                      locTab = "all" || ModuleKey = locTab,
                      IsBlank(drpAprType.Selected.Key) || Type = drpAprType.Selected.Key,
                      Coalesce(drpAprProj.Selected.Key, 0) = 0 || ProjectID = drpAprProj.Selected.Key,
                      IsBlank(Trim(txtAprSearch.Text)) || StartsWith(Number, Trim(txtAprSearch.Text)),
