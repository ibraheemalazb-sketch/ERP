      - btnAprEnrich:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locEnriching: true});
              IfError(
                  Concurrent(
                      // Payment requests: one LookUp by ID per visible row (ID is always indexed)
                      ClearCollect(colAprPRx, ForAll(Filter(colAprNeed, Type = cfgRequestType.PaymentRequest && ItemID > 0) As r,
                          With({p: LookUp(PaymentRequests, ID = r.ItemID)},
                              {AHID: r.AHID, ID: r.ItemID, Found: !IsBlank(p), Amount: p.RequestedAmount, Currency: p.Currency.Value, USD: p.TotalAmountUSD,
                               ProjectID: p.ProjectID, ProjectCode: p.ProjectCode, PreparedByID: p.PreparedByID, PaidTo: p.PaidTo,
                               POID: Coalesce(p.PurchaseOrderID, 0),
                               Stage: If(IsBlank(p), "", fnPRStage(p.RequestStatus.Value, p.PaymentStatus.Value, p.FinanceOfficerApproved,
                                   p.ProjectManagerApproved, p.FinanceManagerApproved))}))),
                      // Payroll runs: stored totals only, and ONLY for users with payroll access
                      If(
                          canAccessPayroll,
                          ClearCollect(colAprRunx, ForAll(Filter(colAprNeed, Type = cfgRequestType.PayrollRun && ItemID > 0) As r,
                              With({x: LookUp(PayrollRuns, ID = r.ItemID)},
                                  {AHID: r.AHID, Found: !IsBlank(x), PeriodKey: x.PeriodKey, Currency: x.Currency.Value, TotalNet: x.TotalNet,
                                   EmployeeCount: x.EmployeeCount, Status: x.Status.Value, PreparedByID: x.PreparedByID}))),
                          Clear(colAprRunx)
                      ),
                      // Budget revisions: RequestItemID = Budgets.ID (question I2)
                      ClearCollect(colAprBudx, ForAll(Filter(colAprNeed, Type = cfgRequestType.BudgetRevision && ItemID > 0) As r,
                          With({b: LookUp(Budgets, ID = r.ItemID)},
                              {AHID: r.AHID, Found: !IsBlank(b), Code: b.BudgetLineCode, ProjectID: b.ProjectID, Total: b.TotalAmount,
                               Remaining: b.RemainingBalance, Currency: b.Currency.Value}))),
                      // Reversal requests: RequestItemID = FinancialTransactions.ID; payroll ledger rows only with payroll access
                      ClearCollect(colAprRevx, ForAll(Filter(colAprNeed, Type = cfgRequestType.Reversal && ItemID > 0) As r,
                          With({t: LookUp(FinancialTransactions, ID = r.ItemID && (canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding))},
                              {AHID: r.AHID, Found: !IsBlank(t), TxnNumber: t.TransactionNumber, TxnType: t.TransactionType.Value, Status: t.Status.Value,
                               Amount: t.Amount, Currency: t.Currency.Value, USD: t.AmountUSD, ProjectID: t.ProjectID, BudgetLineID: Coalesce(t.BudgetLineID, 0)})))
                  );
                  // lines of those payment requests (PaymentRequestID is Indexed): budget line + amount per line
                  RemoveIf(colAprPRL, PRID in colAprPRx.ID);
                  ForAll(Filter(colAprPRx, Found) As p,
                      Collect(colAprPRL, ForAll(Filter(PaymentRequesttLines, PaymentRequestID = p.ID) As l,
                          {PRID: p.ID, LineNumber: l.LineNumber, BudgetLineID: Coalesce(l.BudgetLineID, 0), Code: l.BudgetLineCode, Amount: l.Amount,
                           Currency: Coalesce(l.Currency.Value, p.Currency)})));
                  // budget lines not cached yet: one LookUp by ID each (stored RemainingBalance, flow-maintained)
                  ClearCollect(colAprBLIds,
                      ForAll(Filter(colAprPRL, PRID in colAprPRx.ID) As l, {ID: l.BudgetLineID}),
                      ForAll(colAprRevx As t, {ID: t.BudgetLineID}));
                  ClearCollect(colAprBLNew, Distinct(Filter(colAprBLIds, ID > 0 && !(ID in colAprBL.ID)), ID));
                  ForAll(colAprBLNew As d,
                      Collect(colAprBL, With({b: LookUp(Budgets, ID = d.Value)},
                          {ID: d.Value, Code: b.BudgetLineCode, Remaining: b.RemainingBalance, Currency: b.Currency.Value})));
                  // one enriched record per row (same fields for every type)
                  Collect(colAprRel, ForAll(colAprNeed As r,
                      Switch(
                          r.Type,
                          cfgRequestType.PaymentRequest, With(
                          {p: LookUp(colAprPRx, AHID = r.AHID)},
                          With(
                              {_pj: LookUp(colMyProjects, ID = p.ProjectID), _own: p.PreparedByID = varMeID,
                                _n: CountRows(Distinct(Filter(colAprPRL, PRID = p.ID && BudgetLineID > 0), BudgetLineID)),
                                // tightest budget line of this request: remaining now minus this request's amount on that line.
