                                          _a.Action = "reject" || !(canAccessPayroll && ((_st = cfgRunStatus.PendingHR && canApproveRunHR && (!_own || cfgRunPreparerMayApproveHR)) || (_st = cfgRunStatus.PendingFinance && canApproveRunFin && !_own))), UpdateContext({locRes: {OK: false, Msg: fnT("apr.notAllowed", "You cannot take this action on this request.")}}),
