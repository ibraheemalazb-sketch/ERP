                                              ),
                                              UpdateContext({locRes: {OK: false, Msg: fnT("apr.saveError", "Could not be saved:") & " " & FirstError.Message}}),
                                              fnRecordDecision(cfgRequestType.PayrollRun, _a.ItemID, _a.Number, _dec, _a.Comment, Blank());
                                              fnLogActivityFull("Payroll Run", _a.ItemID, _a.Number, _logAct, "Info", Blank(), "", "Status", _st,
                                                  If(_a.Action = "return", cfgRunStatus.Draft, _st = cfgRunStatus.PendingHR, cfgRunStatus.PendingFinance, cfgRunStatus.Approved),
