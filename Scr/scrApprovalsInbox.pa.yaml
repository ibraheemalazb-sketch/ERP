                          "project", Sort(_f, ProjectCode, SortOrder.Ascending),
                          Sort(_f, Age, SortOrder.Descending)
                      )},
                      UpdateContext({locCount: CountRows(_s), locPages: Max(1, RoundUp(CountRows(_s) / cfgApprPageSize, 0))});
                      UpdateContext({locPage: Max(1, Min(Coalesce(locPage, 1), locPages))});
                      ClearCollect(colAprPg, FirstN(LastN(_s, Max(0, CountRows(_s) - (locPage - 1) * cfgApprPageSize)), cfgApprPageSize))
                  )
              );
              Clear(colAprSel);
              // related records are fetched only for rows not cached yet (visible page + a deep-linked row)
