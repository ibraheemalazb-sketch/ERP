                                  If(
                                      IsBlank(_rec), UpdateContext({locRes: {OK: false, Msg: fnT("apr.notFound", "The request no longer exists or you cannot read it.")}}),
                                      _st <> _a.Stage, UpdateContext({locRes: {OK: false, Msg: fnT("apr.changed", "Changed by someone else since the inbox loaded.")}}),
                                      !(!_own && ((_st = "check" && canEdit && (isFinanceManager || (isFinanceOfficer && _pj.FinanceID = varMeID))) || (canApprove && ((_st = "pm" && _pj.ManagerID = varMeID) || (_st = "fm" && isFinanceManager))))), UpdateContext({locRes: {OK: false, Msg: fnT("apr.notAllowed", "You cannot take this action on this request.")}}),
                                      IfError(
                                          Switch(
                                              _a.Action,
