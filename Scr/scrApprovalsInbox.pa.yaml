                                  // finance decision-only types: re-check the record (reversal: still Posted; payroll ledger rows gated)
                                  _a.Type = cfgRequestType.Reversal && (!canApprove || IsBlank(LookUp(FinancialTransactions,
                                      ID = _a.ItemID && Status.Value = cfgTxnStatus.Posted && (canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding)))), UpdateContext({locRes: {OK: false, Msg: fnT("apr.notAllowed", "You cannot take this action on this request.")}}),
