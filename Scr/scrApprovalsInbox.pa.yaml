# scrApprovalsInbox - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrApprovalsInbox, set its properties from 05-screen-approvals.md,
# then paste screens/paste/scrApprovalsInbox.controls.pa.yaml onto it.
Screens:
  scrApprovalsInbox:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 52);
        If(
            varFinReady && !canSeeApprovalsInbox,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locTab: "all", locPage: 1, locPanel: false, locSelAH: 0, locDlg: "", locBusy: false, locBulkRun: false,
                locFiltersOpen: false, locMoreOpen: false, locNotifOpen: false, locEnriching: false});
            Clear(colAprResult);
            If(varFinReady, UpdateContext({locBooted: true}); Select(btnAprQuery), UpdateContext({locBooted: false}))
        )
      LoadingSpinner: =LoadingSpinner.None
      OnHidden: |-
        =Clear(colAprRunx); Clear(colAprQueue); UpdateContext({locBulkRun: false, locPanel: false})
    Children:
      - cmpNav_Apr:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_Apr:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Back()
            ScreenTitle: =fnT("nav.approvals", "Approvals inbox")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_Apr:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conAprRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conAprMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - conAprBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - conAprKPI:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp2
                              LayoutWrap: =true
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!locError
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =RoundUp(4 / kpiColumns, 0) * 128 + (RoundUp(4 / kpiColumns, 0) - 1) * sp2
                            Children:
                              - cmpKPI_AprAll:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("apr.kpiWaiting", "Waiting for me")
                                    KPIValue: =CountRows(colAprAll)
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =If(CountRows(colAprAll) >= cfgApprMaxRows, fnT("apr.capped", "Newest") & " " & cfgApprMaxRows & " " & fnT("apr.shown", "shown"), fnT("apr.allModules", "All modules"))
                                    Loading: =locLoading
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_AprOld:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("apr.kpiOverdue", "Waiting") & " " & cfgApprAgeDangerDays & "+ " & fnT("common.days", "days")
                                    KPIValue: =CountRows(Filter(colAprAll, Age >= cfgApprAgeDangerDays))
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =If(CountRows(Filter(colAprAll, Age >= cfgApprAgeDangerDays)) > 0, "danger", "")
                                    Subtext: =""
                                    Loading: =locLoading
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_AprOldest:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("apr.kpiOldest", "Oldest (days)")
                                    KPIValue: =Coalesce(Max(colAprAll, Age), 0)
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =fnApprAgeTone(Coalesce(Max(colAprAll, Age), 0))
                                    Subtext: =""
                                    Loading: =locLoading
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_AprMods:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("apr.kpiModules", "Modules")
                                    KPIValue: =CountRows(Distinct(colAprAll, ModuleKey))
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =""
                                    Loading: =locLoading
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conAprBulk:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =sp1
                              LayoutWrap: =true
                              PaddingTop: =sp1
                              PaddingRight: =sp1
                              PaddingBottom: =sp1
                              PaddingLeft: =sp1
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =FinTheme.RowSelected
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!IsEmpty(colAprSel) && !locBulkRun
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =If(isMobile, 2 * touchMin + 3 * sp1, touchMin + 2 * sp1)
                            Children:
                              - lblAprBulkN:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =CountRows(Filter(colAprView, AHID in colAprSel.AHID && BulkOK && !(Type = cfgRequestType.PayrollRun || Type = cfgRequestType.Reversal))) & " " & fnT("apr.selected", "selected for bulk approval")
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =false
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =200
                                    LayoutMinHeight: =0
                                    Height: =touchMin
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    Live: =Live.Polite
                              - btnAprBulkClear:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =fnT("apr.clearSel", "Clear selection")
                                    Font: =fontBase
                                    Size: =fsBody
                                    FontWeight: =FontWeight.Semibold
                                    Height: =touchMin
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    TabIndex: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    DisabledFill: =FinTheme.Border
                                    DisabledColor: =FinTheme.TextSecondary
                                    DisabledBorderColor: =FinTheme.Border
                                    Fill: =FinTheme.Surface
                                    Color: =FinTheme.Text
                                    BorderColor: =FinTheme.Border
                                    HoverFill: =FinTheme.RowHover
                                    HoverColor: =FinTheme.Text
                                    HoverBorderColor: =FinTheme.Primary
                                    PressedFill: =FinTheme.RowSelected
                                    PressedColor: =FinTheme.Text
                                    PressedBorderColor: =FinTheme.Primary
                                    Width: =150
                                    FillPortions: =0
                                    OnSelect: =Clear(colAprSel)
                              - btnAprBulkGo:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =fnT("apr.approveSel", "Approve selected") & " (" & CountRows(Filter(colAprView, AHID in colAprSel.AHID && BulkOK && !(Type = cfgRequestType.PayrollRun || Type = cfgRequestType.Reversal))) & ")"
                                    Font: =fontBase
                                    Size: =fsBody
                                    FontWeight: =FontWeight.Semibold
                                    Height: =touchMin
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    TabIndex: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    DisabledFill: =FinTheme.Border
                                    DisabledColor: =FinTheme.TextSecondary
                                    DisabledBorderColor: =FinTheme.Border
                                    Fill: =FinTheme.Primary
                                    Color: =FinTheme.OnPrimary
                                    BorderColor: =FinTheme.Primary
                                    HoverFill: =ColorFade(FinTheme.Primary, -0.12)
                                    HoverColor: =FinTheme.OnPrimary
                                    HoverBorderColor: =FinTheme.Primary
                                    PressedFill: =ColorFade(FinTheme.Primary, -0.24)
                                    PressedColor: =FinTheme.OnPrimary
                                    PressedBorderColor: =FinTheme.Primary
                                    Width: =210
                                    FillPortions: =0
                                    DisplayMode: =If(CountRows(Filter(colAprView, AHID in colAprSel.AHID && BulkOK && !(Type = cfgRequestType.PayrollRun || Type = cfgRequestType.Reversal))) > 0 && !locBusy, DisplayMode.Edit, DisplayMode.Disabled)
                                    Tooltip: =fnT("apr.approveSel", "Approve selected")
                                    OnSelect: |-
                                      =Reset(cmpDlg_Apr); UpdateContext({locDlg: "bulk"})
                        - conAprProgress:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Background
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =locBulkRun
                              Height: =20 + 2 * sp2
                            Children:
                              - lblAprProgress:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: ="⏳ " & fnT("apr.bulkRunning", "Approving") & " " & Min(locBulkDone + 1, locBulkTotal) & " / " & locBulkTotal & " ..."
                                    Font: =fontBase
                                    Size: =fsCaption
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =true
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =20
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Live: =Live.Polite
                        - conAprResults:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =!locBulkRun && !IsEmpty(colAprResult)
                              Height: =28 + sp1 + 24 + If(IsEmpty(Filter(colAprResult, !OK)), 0, sp1 + Min(CountRows(Filter(colAprResult, !OK)), 5) * 44) + sp1 + touchMin + 2 * sp2
                            Children:
                              - lblAprResT:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =fnT("apr.bulkResult", "Bulk approval result")
                                    Font: =fontBase
                                    Size: =fsSection
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =false
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =28
                                    FontWeight: =FontWeight.Semibold
                                    Role: =TextRole.Heading3
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                              - lblAprResSum:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      ="✓ " & CountRows(Filter(colAprResult, OK)) & " " & fnT("apr.bulkOk", "approved") & "   " & If(IsEmpty(Filter(colAprResult, !OK)), "", "⚠ " & CountRows(Filter(colAprResult, !OK)) & " " & fnT("apr.bulkSkipWhy", "skipped (re-checked, not changed):"))
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =true
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =24
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Live: =Live.Polite
                              - galAprRes:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    TemplatePadding: =0
                                    ShowScrollbar: =true
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    TemplateFill: =RGBA(0, 0, 0, 0)
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    DelayItemLoading: =true
                                    LoadingSpinner: =LoadingSpinner.None
                                    Visible: =!IsEmpty(Filter(colAprResult, !OK))
                                    Items: =Filter(colAprResult, !OK)
                                    TemplateSize: =44
                                    Height: =Min(CountRows(Filter(colAprResult, !OK)), 5) * 44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Selectable: =false
                                    AccessibleLabel: =fnT("apr.skippedList", "Skipped requests")
                                    ItemAccessibleLabel: |-
                                      =ThisItem.Number & ": " & ThisItem.Msg
                                  Children:
                                    - lblAprResRow:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            ="⚠ " & ThisItem.Number & ": " & ThisItem.Msg
                                          Font: =fontBase
                                          Size: =fsCaption
                                          Color: =FinTheme.Text
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =true
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =44
                                          X: =8
                                          Y: =0
                                          Width: =Parent.TemplateWidth - 16
                              - btnAprResClose:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =fnT("common.dismiss", "Dismiss")
                                    Font: =fontBase
                                    Size: =fsBody
                                    FontWeight: =FontWeight.Semibold
                                    Height: =touchMin
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    TabIndex: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    DisabledFill: =FinTheme.Border
                                    DisabledColor: =FinTheme.TextSecondary
                                    DisabledBorderColor: =FinTheme.Border
                                    Fill: =FinTheme.Surface
                                    Color: =FinTheme.Text
                                    BorderColor: =FinTheme.Border
                                    HoverFill: =FinTheme.RowHover
                                    HoverColor: =FinTheme.Text
                                    HoverBorderColor: =FinTheme.Primary
                                    PressedFill: =FinTheme.RowSelected
                                    PressedColor: =FinTheme.Text
                                    PressedBorderColor: =FinTheme.Primary
                                    Width: =120
                                    FillPortions: =0
                                    OnSelect: =Clear(colAprResult)
                        - conAprListCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =touchMin + 4 + sp1 + If(isMobile, touchMin + sp1 + If(locFiltersOpen, 6 * touchMin + 5 * sp1 + sp1, 0), touchMin + sp1) + If(isMobile, 0, 40 + sp1) + If((locLoading || locEnriching || !varFinReady) && !locError, 320, locError || IsEmpty(colAprView), 240, Max(1, CountRows(colAprView)) * If(isMobile, 182, 64)) + sp1 + If(locPages > 1, touchMin + sp1, 0) + 36 + 2 * sp2
