            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locLoading: true, locError: false});
              Clear(colAprSel);
              IfError(
                  // notifications + fnRefreshApprovalBadge(): ApprovalHistory, ApproverID = me AND Decision = pending, all modules
                  // (delegable; index ApproverID + Decision, question E2). Payroll rows are removed there unless canAccessPayroll.
                  fnRefreshHeaderData();
                  ClearCollect(
                      colAprAll,
                      ForAll(
                          Filter(colMyPendingApprovals, canAccessPayroll || !(RequestType.Value = cfgRequestType.PayrollRun || Module.Value = "Payroll" || RequestType.Value in Filter(tblApprovalTypes, NeedsPayroll).RequestType)) As a,
                          With(
                              {_m: LookUp(tblApprovalTypes, RequestType = a.RequestType.Value),
                                _at: Coalesce(a.AssignedDate, a.Created)},
                              {
                                  AHID: a.ID, Type: a.RequestType.Value, ItemID: IfError(Value(a.RequestItemID), 0),
                                  Number: Coalesce(a.RequestNumber, a.Title, "#" & a.RequestItemID), Title: a.Title,
                                  ModuleKey: Coalesce(_m.ModuleKey, a.Module.Value, cfgApprOtherModule),
                                  ModuleLabel: Coalesce(_m.ModuleLabel, a.Module.Value, fnT("mod.other", "Other")),
                                  Mapped: !IsBlank(_m), Wired: Coalesce(_m.Wired, false), DecideInInbox: Coalesce(_m.DecideInInbox, false),
                                  AllowBulk: Coalesce(_m.AllowBulk, false),
                                  AllowOpen: !IsBlank(_m.OpenKey) || !IsBlank(_m.OpenUrl),
                                  ProjectID: Coalesce(a.ProjectID, 0),
                                  ProjectCode: If(Coalesce(a.ProjectID, 0) > 0, Coalesce(LookUp(colMyProjects, ID = a.ProjectID).ProjectCode, "#" & a.ProjectID), ""),
                                  Requester: Coalesce(a.Requester.Value, If(Coalesce(a.RequesterID, 0) > 0, "#" & a.RequesterID, "")),
                                  Assigned: _at, Age: Max(0, DateDiff(_at, Now(), TimeUnit.Days)),
                                  Level: a.ApprovalLevel.Value, Priority: a.Priority.Value, Note: a.Comments
                              }
                          )
                      )
                  );
                  // caches of related records are rebuilt on every full load (balances may have changed)
                  Clear(colAprRel); Clear(colAprPRL); Clear(colAprBL),
                  UpdateContext({locError: true});
                  Trace("Approvals inbox load failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false});
              // pre-filter from another module (fnOpenApprovals) and deep link to one row (dashboard widget)
              If(!IsBlank(varAprModule), UpdateContext({locTab: varAprModule}); Set(varAprModule, Blank()));
              If(
                  Coalesce(varAprAHID, 0) > 0,
                  If(
                      IsBlank(LookUp(colAprAll, AHID = varAprAHID)),
                      Notify(fnT("apr.gone", "This request is no longer waiting for you (decided or re-assigned)."), NotificationType.Information),
                      UpdateContext({locSelAH: varAprAHID, locSel: Blank(), locPanel: true})
                  );
                  Set(varAprAHID, 0)
              );
              If(!locError, Select(btnAprPage))
      - btnAprPage:
