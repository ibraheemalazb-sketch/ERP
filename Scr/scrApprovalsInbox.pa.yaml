                                                      CheckedDate: Now(), FinanceOfficerComment: _a.Comment}),
                                                  "pm", Patch(PaymentRequests, _rec, {ProjectManager: {Id: varMeID, Value: varMe.FullName}, ProjectManagerApproved: true,
                                                      ProjectManagerDate: Now(), ProjectManagerComment: _a.Comment}),
                                                  Patch(PaymentRequests, _rec, {FinanceManager: {Id: varMeID, Value: varMe.FullName}, FinanceManagerApproved: true,
                                                      FinanceManagerDate: Now(), FinanceManagerComment: _a.Comment, RequestStatus: {Value: cfgPRStatus.Approved}})
                                              ),
                                              "return", Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Returned},
                                                  FinanceOfficerApproved: false, ProjectManagerApproved: false, FinanceManagerApproved: false, FinanceOfficerComment: If(_st = "check", _a.Comment, _rec.FinanceOfficerComment), ProjectManagerComment: If(_st = "pm", _a.Comment, _rec.ProjectManagerComment), FinanceManagerComment: If(_st = "fm", _a.Comment, _rec.FinanceManagerComment)}),
                                              Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Rejected}, FinanceOfficerComment: If(_st = "check", _a.Comment, _rec.FinanceOfficerComment), ProjectManagerComment: If(_st = "pm", _a.Comment, _rec.ProjectManagerComment), FinanceManagerComment: If(_st = "fm", _a.Comment, _rec.FinanceManagerComment)})
                                          ),
                                          UpdateContext({locRes: {OK: false, Msg: fnT("apr.saveError", "Could not be saved:") & " " & FirstError.Message}}),
                                          fnRecordDecision(cfgRequestType.PaymentRequest, _a.ItemID, _a.Number, _dec, _a.Comment, _rec.ProjectID);
                                          fnLogActivityFull("Payment Request", _a.ItemID, _a.Number, _logAct, If(_a.Action = "reject", "Important", "Info"),
                                              _rec.ProjectID, _rec.ProjectCode, "RequestStatus", _rec.RequestStatus.Value,
                                              Switch(_a.Action, "return", cfgPRStatus.Returned, "reject", cfgPRStatus.Rejected,
                                                  If(_st = "fm", cfgPRStatus.Approved, _rec.RequestStatus.Value)),
                                              "Approvals inbox" & If(_a.Bulk, " (bulk)", "") & ": " & fnPRStageLabel(_st) & " -> " & _a.Action,
                                              _a.Comment, _rec.RequestedAmount, _rec.Currency.Value, _corr);
