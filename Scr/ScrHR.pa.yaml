      - btnHRRefreshActivities:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الأنشطة", "Refresh activities")
            OnSelect: |-
              =IfError(
                  With(
                      {
                          since: DateAdd(Today(), -30, TimeUnit.Days),
                          ar: gblLanguage = "Arabic",
                          all: Coalesce(
                              LookUp(
                                  colUserPermissions,
                                  Module.Value = "HR",
                                  And(CanViewAll, Scope.Value = "All")
                              ),
                              false
                          ),
                          me: gblCurrentEmployee.ID
                      },
                      If(
                          all,
                          ClearCollect(
                              colActEmployees,
                              ForAll(
                                  FirstN(
                                      Sort(
                                          Filter(Employees, Created >= since),
                                          Created,
                                          SortOrder.Descending
                                      ),
                                      10
                                  ) As e,
                                  {
                                      ID: e.ID,
                                      Module: "HR",
                                      ActivityType: "Employee",
                                      Action: "Created",
                                      Title: Coalesce(e.FullName, e.DisplayName, e.Title, "") & " - " & If(ar, "تمت إضافة موظف جديد", "was added to system"),
                                      Description: "",
                                      ActorName: Coalesce(e.'Created By'.DisplayName, ""),
                                      ActivityDate: e.Created,
                                      RecordType: "Employee",
                                      RecordID: e.ID,
                                      Status: "Success",
                                      Icon: "People"
                                  }
                              )
                          ),
                          Clear(colActEmployees)
                      );
                      ClearCollect(
                          colActLeave,
                          ForAll(
                              FirstN(
                                  Sort(
                                      If(
                                          all,
                                          Filter(LeaveRequests, Created >= since),
                                          Filter(LeaveRequests, Created >= since, EmployeeID = me)
                                      ),
                                      Created,
                                      SortOrder.Descending
                                  ),
                                  10
                              ) As l,
                              {
                                  ID: l.ID + 1000000,
                                  Module: "HR",
                                  ActivityType: "Leave",
                                  Action: "Submitted",
                                  Title: With(
                                      {
                                          nm: Coalesce(l.Employee.Value, ""),
                                          tp: Coalesce(l.LeaveType.Value, ""),
                                          d: l.Duration
                                      },
                                      If(
                                          ar,
                                          nm & " قدّم طلب إجازة " & tp & " جديد" & If(
                                              IsBlank(d),
                                              "",
                                              " لمدة " & If(d = 1, "يوم", d = 2, "يومين", d <= 10, d & " أيام", d & " يومًا")
                                          ),
                                          nm & " submitted a new " & If(
                                              IsBlank(tp),
                                              "Leave",
                                              If(EndsWith(Lower(tp), "leave"), tp, tp & " Leave")
                                          ) & " request" & If(IsBlank(d), "", " for " & d & If(d = 1, " day", " days"))
                                      )
                                  ),
                                  Description: "",
                                  ActorName: Coalesce(l.Employee.Value, ""),
                                  ActivityDate: l.Created,
                                  RecordType: "LeaveRequest",
                                  RecordID: l.ID,
                                  Status: "Approval",
                                  Icon: "Calendar"
                              }
                          )
                      );
                      If(
                          all,
                          ClearCollect(
                              colActApprovalSource,
                              Filter(ApprovalHistory, Modified >= since)
                          ),
                          ClearCollect(
                              colActApprovalSource,
                              Filter(ApprovalHistory, ApproverID = me)
                          );
                          Collect(
                              colActApprovalSource,
                              Filter(ApprovalHistory, RequesterID = me, ApproverID <> me)
                          )
                      );
                      ClearCollect(
                          colActApprovals,
                          ForAll(
                              FirstN(
                                  Sort(
                                      Filter(
                                          colActApprovalSource,
                                          Module.Value = "HR",
                                          Modified >= since
                                      ),
                                      Modified,
                                      SortOrder.Descending
                                  ),
                                  15
                              ) As a,
                              {
                                  ID: a.ID + 2000000,
                                  Module: "HR",
                                  ActivityType: Coalesce(a.RequestType.Value, "Approval"),
                                  Action: Coalesce(a.Action.Value, a.Decision.Value, ""),
                                  Title: Switch(
                                      a.Decision.Value,
                                      "Approved",
                                      If(ar, "تمت الموافقة على طلب " & Coalesce(a.Requester.Value, ""), Coalesce(a.Requester.Value, "") & "'s request was approved"),
                                      "Rejected",
                                      If(ar, "تم رفض طلب " & Coalesce(a.Requester.Value, ""), Coalesce(a.Requester.Value, "") & "'s request was rejected"),
                                      If(ar, "طلب بانتظار الموافقة", "Approval requested")
                                  ),
                                  Description: "",
                                  ActorName: Coalesce(a.Approver.Value, ""),
                                  ActivityDate: Coalesce(a.DecisionDate, a.ActionDate, a.Modified),
                                  RecordType: Switch(
                                      a.RequestType.Value,
                                      "Leave",
                                      "LeaveRequest",
                                      "Leave Request",
                                      "LeaveRequest",
                                      "Employee",
                                      "Employee",
                                      Coalesce(a.RequestType.Value, "")
                                  ),
                                  RecordID: IfError(Value(a.RequestItemID), 0),
                                  Status: Switch(a.Decision.Value, "Approved", "Success", "Rejected", "Error", "Approval"),
                                  Icon: Switch(a.Decision.Value, "Approved", "Check", "Rejected", "Warning", "Clock")
                              }
                          )
                      );
                      ClearCollect(colHRActivities, colActEmployees, colActLeave, colActApprovals);
                      Clear(colActEmployees);
                      Clear(colActLeave);
                      Clear(colActApprovals);
                      Clear(colActApprovalSource)
                  ),
                  Notify(
                      If(gblLanguage = "Arabic", "تعذر تحميل الأنشطة الحديثة", "Could not load recent activities"),
                      NotificationType.Warning
                  )
              )
            Text: =""
            Visible: =false
            X: =0
            Y: =0
      - btnHRRefreshEvents:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الأحداث", "Refresh events")
            OnSelect: |-
              =IfError(
                  With(
                      {
                          d0: Today(),
                          until: DateAdd(Today(), 90, TimeUnit.Days),
                          ar: gblLanguage = "Arabic",
                          all: Coalesce(
                              LookUp(
                                  colUserPermissions,
                                  Module.Value = "HR",
                                  And(CanViewAll, Scope.Value = "All")
                              ),
                              false
                          ),
                          me: gblCurrentEmployee.ID
                      },
                      ClearCollect(
                          colHRUpcoming,
                          ForAll(
                              FirstN(
                                  Sort(
                                      Filter(
                                          colEmployees,
                                          !IsBlank(EndDate),
                                          EndDate >= d0,
                                          EndDate <= until,
                                          Or(all, ID = me)
                                      ),
                                      EndDate,
                                      SortOrder.Ascending
                                  ),
                                  10
                              ) As e,
                              {
                                  ID: e.ID,
                                  Module: "HR",
                                  EventType: "Contract",
                                  Title: If(
                                      ar,
                                      "ينتهي عقد " & Coalesce(e.FullName, e.DisplayName, e.Title, ""),
                                      Coalesce(e.FullName, e.DisplayName, e.Title, "") & "'s contract ends"
                                  ),
                                  Description: If(ar, "انتهاء عقد الموظف", "Contract end"),
                                  OwnerName: Coalesce(e.FullName, e.DisplayName, e.Title, ""),
                                  EventDate: e.EndDate,
                                  DaysRemaining: DateDiff(d0, e.EndDate, TimeUnit.Days),
                                  RecordType: "Employee",
                                  RecordID: e.ID,
                                  Icon: "Calendar"
                              }
                          )
                      )
                  ),
                  Notify(
                      If(gblLanguage = "Arabic", "تعذر تحميل الأحداث القادمة", "Could not load upcoming events"),
                      NotificationType.Warning
                  )
              )
            Text: =""
            Visible: =false
            X: =0
            Y: =0
