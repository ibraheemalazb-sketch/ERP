Screens:
  ScrHR:
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Background,
            gblTheme.Light.Colors.Background
        )
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "HR");
        Set(varNavSelectedID, 11);
        Set(VarHRmodule, "HRHome");
        If(IsBlank(varLeavePeriod), Set(varLeavePeriod, "Month"));
        Set(
            varLeaveStart,
            Switch(
                varLeavePeriod,
                "Week",
                DateAdd(Today(), 1 - Weekday(Today(), StartOfWeek.Monday), TimeUnit.Days),
                "Year",
                Date(Year(Today()), 1, 1),
                Date(Year(Today()), Month(Today()), 1)
            )
        );
        Set(
            varLeaveEnd,
            Switch(
                varLeavePeriod,
                "Week",
                DateAdd(varLeaveStart, 7, TimeUnit.Days),
                "Year",
                DateAdd(varLeaveStart, 1, TimeUnit.Years),
                DateAdd(varLeaveStart, 1, TimeUnit.Months)
            )
        );
        Set(gblIsHR, gblCurrentEmployee.Department.Value = "Human Resources");
        Set(varAttendanceTab, "My Attendance");
        Set(varCurrentEmployeeId, gblCurrentEmployee.ID);
        Set(varCurrentEmployeeOfficeId, gblCurrentEmployee.Office.Id);
        Set(varCheckInGPSRequired, true);
        ClearCollect(
            colLeavePeriods,
            {PeriodKey: "Week", PeriodLabel: If(gblLanguage = "Arabic", "هذا الأسبوع", "This Week")},
            {PeriodKey: "Month", PeriodLabel: If(gblLanguage = "Arabic", "هذا الشهر", "This Month")},
            {PeriodKey: "Year", PeriodLabel: If(gblLanguage = "Arabic", "هذه السنة", "This Year")}
        );
        ClearCollect(
            colHRSections,
            {Section: "01-Recruitment", TitleKey: "hr_employee_file", Icon: "People", IconColor: fxThemeColor("Primary")},
            {Section: "02-Employment", TitleKey: "hr_employment", Icon: "Document", IconColor: fxThemeColor("Success")},
            {Section: "03-Education & Qualifications", TitleKey: "hr_education", Icon: "Certificate", IconColor: fxThemeColor("Primary")},
            {Section: "04-Performance & Training", TitleKey: "hr_performance", Icon: "Document", IconColor: fxThemeColor("Primary")},
            {Section: "07-Other HR Documents", TitleKey: "hr_other_documents", Icon: "FolderOpen", IconColor: fxThemeColor("Primary")}
        );
        ClearCollect(
            colHRDocTypes,
            {Section: "01-Recruitment", DocType: "Job Application", TranslationKey: "hr_job_application", Icon: "SaveCopy"},
            {Section: "01-Recruitment", DocType: "Job Description", TranslationKey: "hr_job_description", Icon: "BookContacts"},
            {Section: "01-Recruitment", DocType: "CV", TranslationKey: "hr_cv", Icon: "Document"},
            {Section: "01-Recruitment", DocType: "Cover Letter", TranslationKey: "hr_cover_letter", Icon: "Mail"},
            {Section: "01-Recruitment", DocType: "Job Advertisement", TranslationKey: "hr_job_advertisement", Icon: "Link"},
            {Section: "01-Recruitment", DocType: "Shortlist", TranslationKey: "hr_shortlist", Icon: "DocumentCheckmark"},
            {Section: "01-Recruitment", DocType: "Tests", TranslationKey: "hr_tests", Icon: "Compose"},
            {Section: "01-Recruitment", DocType: "References", TranslationKey: "hr_references", Icon: "People"},
            {Section: "01-Recruitment", DocType: "Interview", TranslationKey: "hr_interview", Icon: "People"},
            {Section: "02-Employment", DocType: "Job Offer", TranslationKey: "hr_job_offer", Icon: "Document"},
            {Section: "02-Employment", DocType: "Employment Contract", TranslationKey: "hr_employment_contract", Icon: "Document"},
            {Section: "02-Employment", DocType: "Code of Conduct", TranslationKey: "hr_code_conduct", Icon: "Shield"},
            {Section: "02-Employment", DocType: "Conflict of Interest", TranslationKey: "hr_conflict_interest", Icon: "Warning"},
            {Section: "03-Education & Qualifications", DocType: "Academic Certificate", TranslationKey: "hr_academic_certificate", Icon: "TextBulletListSquareSparkle"},
            {Section: "03-Education & Qualifications", DocType: "Professional Certificate", TranslationKey: "hr_professional_certificate", Icon: "BriefcaseMedical"},
            {Section: "03-Education & Qualifications", DocType: "Training Certificate", TranslationKey: "hr_training_certificate", Icon: "BookContacts"},
            {Section: "04-Performance & Training", DocType: "Performance Appraisal", TranslationKey: "hr_performance_appraisal", Icon: "DocumentCheckmark"},
            {Section: "04-Performance & Training", DocType: "Performance Review", TranslationKey: "hr_performance_review", Icon: "ClipboardTask"},
            {Section: "04-Performance & Training", DocType: "Performance Improvement Plan", TranslationKey: "hr_pip", Icon: "Target"},
            {Section: "04-Performance & Training", DocType: "Recognition & Awards", TranslationKey: "hr_recognition_awards", Icon: "Award"},
            {Section: "04-Performance & Training", DocType: "Other Performance Documents", TranslationKey: "hr_other_performance_documents", Icon: "Document"},
            {Section: "07-Other HR Documents", DocType: "Other HR Document", TranslationKey: "hr_other_document", Icon: "Document"}
        );
        If(
            varHRScope = "Project",
            Clear(colUserAccessibleProjects);
            ForAll(
                Filter(colUserProjectAccess, AllProjects = false) As access,
                With(
                    {proj: LookUp(Projects, ID = access.ProjectID)},
                    If(!IsBlank(proj.ID), Collect(colUserAccessibleProjects, proj))
                )
            )
        );
        Clear(colEmployees);
        If(
            varHRScope = "Own",
            Collect(colEmployees, Filter(Employees, ID = gblUser.ID)),
            If(
                varHRScope = "All",
                Collect(colEmployees, Employees),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colEmployees, Filter(Employees, ProjectID = proj.ID))
                )
            )
        );
        If(
            And(varHRScope = "Project", IsEmpty(colEmployees), !IsBlank(gblSProject.ID)),
            Collect(colEmployees, Filter(Employees, ProjectID = gblSProject.ID))
        );
        Set(varActiveEmployees, CountRows(colEmployees));
        Clear(colLeaveRequests);
        If(
            varHRScope = "Own",
            Collect(colLeaveRequests, Filter(LeaveRequests, EmployeeID = gblUser.ID)),
            If(
                varHRScope = "All",
                Collect(colLeaveRequests, LeaveRequests),
                ForAll(
                    colEmployees As emp,
                    Collect(colLeaveRequests, Filter(LeaveRequests, EmployeeID = emp.ID))
                )
            )
        );
        Clear(colAttendanceRecords);
        If(
            varHRScope = "Own",
            Collect(colAttendanceRecords, Filter(AttendanceRecords, EmployeeID = gblUser.ID)),
            If(
                varHRScope = "All",
                Collect(colAttendanceRecords, AttendanceRecords),
                ForAll(
                    colEmployees As emp,
                    Collect(colAttendanceRecords, Filter(AttendanceRecords, EmployeeID = emp.ID))
                )
            )
        );
        ClearCollect(
            colLeaveOverview,
            Filter(
                colLeaveRequests,
                And(
                    Status.Value = "Approved",
                    StartDate < varLeaveEnd,
                    EndDate >= varLeaveStart
                )
            )
        );
        ClearCollect(
            colLeaveChart,
            {LeaveType: "Annual Leave", Total: CountIf(colLeaveOverview, LeaveType.Value = "Annual")},
            {LeaveType: "Sick Leave", Total: CountIf(colLeaveOverview, LeaveType.Value = "Sick")},
            {LeaveType: "Emergency", Total: CountIf(colLeaveOverview, LeaveType.Value = "Emergency")},
            {LeaveType: "Other Leave", Total: CountIf(colLeaveOverview, Or(LeaveType.Value = "Other Leave", LeaveType.Value = "Other"))}
        );
        Select(btnHRRefreshActivities);
        Select(btnHRRefreshEvents)
    Children:
      - conHRPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpHRPhoneNav.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpHRTopBar.Height + 12
            Width: =Parent.Width
          Children:
            - cmpHRKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AnimationEffect: ="pop"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 4,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "Users",
                            Value: CountRows(colEmployees),
                            Label: If(gblLanguage = "Arabic", "إجمالي الموظفين", "Total Employees"),
                            Subtitle: If(gblLanguage = "Arabic", "الموظفون النشطون حالياً", "Currently active employees"),
                            Screen: "scrAllEmployees",
                            IconBg: If(gblTheme.Mode = "Dark", "#172030", "#ECF2FF"),
                            IconColor: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Calendar",
                            Value: CountRows(
                                Filter(
                                    colLeaveRequests,
                                    And(
                                        StartDate <= Today(),
                                        EndDate >= Today(),
                                        Status.Value = "Approved"
                                    )
                                )
                            ),
                            Label: If(gblLanguage = "Arabic", "في إجازة اليوم", "On Leave Today"),
                            Subtitle: If(gblLanguage = "Arabic", "إجازات معتمدة سارية اليوم", "Approved leaves active today"),
                            Screen: "scrLeaveManagement",
                            IconBg: If(gblTheme.Mode = "Dark", "#164E63", "#ECFEFF"),
                            IconColor: If(gblTheme.Mode = "Dark", "#22D3EE", "#0E7490"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Clock",
                            Value: CountRows(Filter(colLeaveRequests, Status.Value = "Pending")),
                            Label: If(gblLanguage = "Arabic", "الطلبات المعلقة", "Pending Requests"),
                            Subtitle: If(gblLanguage = "Arabic", "بانتظار الموافقة", "Awaiting your approval"),
                            Screen: "scrLeaveManagement",
                            IconBg: If(gblTheme.Mode = "Dark", "#5C400E", "#FFFBEB"),
                            IconColor: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Activity",
                            Value: CountRows(colHRActivities),
                            Label: If(gblLanguage = "Arabic", "الأنشطة", "Activities"),
                            Subtitle: If(gblLanguage = "Arabic", "آخر الأنشطة والتحديثات", "Latest activities and updates"),
                            Screen: "scrActivities",
                            IconBg: If(gblTheme.Mode = "Dark", "#14532D", "#F0FDF4"),
                            IconColor: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FontsSizesTitle: =12
                  Height: |-
                    =With(
                        {cols: If(Parent.Width < 640, 1, If(Parent.Width < 1024, 2, 4))},
                        RoundUp(4 / cols, 0) * 108
                    )
                  Icons: |-
                    =Table(
                        {
                            Name: "Users",
                            SVG: ""
                        }
                    )
                  IconsSize: =30
                  IsLoading: =false
                  KPINav: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: |-
                    =Switch(
                        varClickScreen,
                        "scrAllEmployees",
                        Navigate(scrAllEmployees, ScreenTransition.Cover),
                        "scrLeaveManagement",
                        Navigate(scrLeaveManagement, ScreenTransition.Cover),
                        "scrActivities",
                        Navigate(scrActivities, ScreenTransition.Cover)
                    )
                  Style: ="Compact"
                  StyleConfig: |-
                    ={
                        colors: {
                            cardBg: ColorValue("#FFFFFF"),
                            border: ColorValue("#E5E7EB"),
                            text: ColorValue("#111827"),
                            textMuted: ColorValue("#6B7280"),
                            positive: ColorValue("#22C55E"),
                            negative: ColorValue("#EF4444"),
                            neutral: ColorValue("#9E9E9E"),
                            skeletonBase: ColorValue("#E5E7EB"),
                            skeletonShine: ColorValue("#F3F4F6")
                        },
                        space: {
                            xs: 4,
                            sm: 8,
                            md: 12,
                            lg: 16,
                            xl: 24
                        },
                        radius: {
                            md: 8,
                            lg: 12
                        },
                        type: {
                            value: {
                                size: 28,
                                sizeCompact: 22
                            },
                            label: {
                                size: 12
                            },
                            body: {
                                size: 12
                            }
                        },
                        heights: {
                            statsCardMax: 168
                        },
                        abbreviateThreshold: 10000
                    }
                  SubtitleFS: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
            - conHRLaunch:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - btnHROpenTraining:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "التدريب", "Training")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="People"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varNavSelectedID, 17);
                          Navigate(scrMyTraining, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "التدريب", "Training")
                        Width: =160
                  - btnHROpenPerformance:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الأداء", "Performance")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Checkmark"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varNavSelectedID, 18);
                        Text: =If(gblLanguage = "Arabic", "الأداء", "Performance")
                        Width: =170
            - conHROverview:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 420 + 12 + 480 + 12 + 360, 400)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - cmpHREmployees:
                      Control: CanvasComponent
                      ComponentName: cmpBarList
                      Properties:
                        AbbreviateAt: =
                        Currency: =
                        Data: |-
                          =Table(
                              {
                                  Label: If(gblLanguage = "Arabic", "البرامج", "Programs"),
                                  Value: CountIf(colEmployees, Department.Value = "Programs"),
                                  Subtitle: If(gblLanguage = "Arabic", "موظف", "Employees"),
                                  Icon: "Flag",
                                  Color: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "المتابعة والتقييم", "MEAL"),
                                  Value: CountIf(colEmployees, Department.Value = "MEAL"),
                                  Subtitle: If(gblLanguage = "Arabic", "موظف", "Employees"),
                                  Icon: "Chart",
                                  Color: If(gblTheme.Mode = "Dark", "#22D3EE", "#0E7490"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "المالية", "Finance"),
                                  Value: CountIf(colEmployees, Department.Value = "Finance"),
                                  Subtitle: If(gblLanguage = "Arabic", "موظف", "Employees"),
                                  Icon: "Money",
                                  Color: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "المشتريات", "Procurement"),
                                  Value: CountIf(colEmployees, Department.Value = "Procurement"),
                                  Subtitle: If(gblLanguage = "Arabic", "موظف", "Employees"),
                                  Icon: "ShoppingCart",
                                  Color: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "الموارد البشرية", "HR"),
                                  Value: CountIf(colEmployees, Or(Department.Value = "HR", Department.Value = "Human Resources")),
                                  Subtitle: If(gblLanguage = "Arabic", "موظف", "Employees"),
                                  Icon: "Users",
                                  Color: If(gblTheme.Mode = "Dark", "#C4B5FD", "#6D28D9"),
                                  isHidden: false
                              }
                          )
                        EmptyMessage: =If(gblLanguage = "Arabic", "لا يوجد موظفون", "No employees")
                        Height: =If(App.Width < 700, 420, Parent.Height)
                        IsLoading: =false
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnBarClick: =Navigate(scrAllEmployees, ScreenTransition.Cover)
                        Palette: =
                        ShowRowSubtitle: =false
                        Subtitle: =If(gblLanguage = "Arabic", "حسب القسم", "By department")
                        Theme: =gblTheme.Mode
                        Title: =If(gblLanguage = "Arabic", "الموظفون", "Employees")
                        ValueFormat: ="Number"
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                  - conHRLeave:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =If(App.Width < 700, 480, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                      Children:
                        - conHRLeaveHeader:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - lblHRLeaveTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =gblTheme.Typography.Body
                                    Text: =If(gblLanguage = "Arabic", "نظرة عامة على الإجازات", "Leave Overview")
                                    Width: =Parent.Width - 148
                              - ddHRLeavePeriod:
                                  Control: ModernDropdown@1.0.3
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "فترة الإجازات", "Leave period")
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Default: =LookUp(colLeavePeriods, PeriodKey = Coalesce(varLeavePeriod, "Month"))
                                    Height: =36
                                    ItemDisplayText: =ThisItem.PeriodLabel
                                    Items: =colLeavePeriods
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varLeavePeriod, Self.Selected.PeriodKey);
                                      Set(
                                          varLeaveStart,
                                          Switch(
                                              varLeavePeriod,
                                              "Week",
                                              DateAdd(Today(), 1 - Weekday(Today(), StartOfWeek.Monday), TimeUnit.Days),
                                              "Year",
                                              Date(Year(Today()), 1, 1),
                                              Date(Year(Today()), Month(Today()), 1)
                                          )
                                      );
                                      Set(
                                          varLeaveEnd,
                                          Switch(
                                              varLeavePeriod,
                                              "Week",
                                              DateAdd(varLeaveStart, 7, TimeUnit.Days),
                                              "Year",
                                              DateAdd(varLeaveStart, 1, TimeUnit.Years),
                                              DateAdd(varLeaveStart, 1, TimeUnit.Months)
                                          )
                                      );
                                      ClearCollect(
                                          colLeaveOverview,
                                          Filter(
                                              colLeaveRequests,
                                              And(
                                                  Status.Value = "Approved",
                                                  StartDate < varLeaveEnd,
                                                  EndDate >= varLeaveStart
                                              )
                                          )
                                      );
                                      ClearCollect(
                                          colLeaveChart,
                                          {LeaveType: "Annual Leave", Total: CountIf(colLeaveOverview, LeaveType.Value = "Annual")},
                                          {LeaveType: "Sick Leave", Total: CountIf(colLeaveOverview, LeaveType.Value = "Sick")},
                                          {LeaveType: "Emergency", Total: CountIf(colLeaveOverview, LeaveType.Value = "Emergency")},
                                          {LeaveType: "Other Leave", Total: CountIf(colLeaveOverview, Or(LeaveType.Value = "Other Leave", LeaveType.Value = "Other"))}
                                      )
                                    Width: =140
                        - cmpHRLeaveChart:
                            Control: CanvasComponent
                            ComponentName: cmpPieChart
                            Properties:
                              Animate: =
                              AnimationDuration: =
                              ChartData: |-
                                =Table(
                                    {
                                        Label: If(gblLanguage = "Arabic", "إجازة سنوية", "Annual Leave"),
                                        Value: CountIf(colLeaveOverview, LeaveType.Value = "Annual")
                                    },
                                    {
                                        Label: If(gblLanguage = "Arabic", "إجازة مرضية", "Sick Leave"),
                                        Value: CountIf(colLeaveOverview, LeaveType.Value = "Sick")
                                    },
                                    {
                                        Label: If(gblLanguage = "Arabic", "إجازة طارئة", "Emergency"),
                                        Value: CountIf(colLeaveOverview, LeaveType.Value = "Emergency")
                                    },
                                    {
                                        Label: If(gblLanguage = "Arabic", "إجازات أخرى", "Other Leave"),
                                        Value: CountIf(colLeaveOverview, Or(LeaveType.Value = "Other Leave", LeaveType.Value = "Other"))
                                    }
                                )
                              ChartTitle: =If(gblLanguage = "Arabic", "نظرة عامة على الإجازات", "Leave Overview")
                              DefaultColors: =
                              DonutMode: =true
                              DonutThickness: =0.24
                              Height: =If(App.Width < 700, 400, Parent.Height - 56)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowLabels: =
                              ShowLegend: =true
                              ShowPercentages: =true
                              ShowTitle: =false
                              ShowValues: =false
                              Theme: =gblTheme.Mode
                              Width: =Parent.Width
                  - cmpHREvents:
                      Control: CanvasComponent
                      ComponentName: cmpUpcomingEvents
                      Properties:
                        Height: =If(App.Width < 700, 360, Parent.Height)
                        Items: =colHRUpcoming
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxItems: =10
                        OnSelect: =
                        OnViewAll: =
                        ShowOverdue: =true
                        ShowSummary: =true
                        ShowViewAll: =true
                        SoonDays: =7
                        Title: =If(gblLanguage = "Arabic", "الأحداث القادمة", "Upcoming Events")
                        UrgentDays: =3
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
            - conHRLastActivities:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =420
