      - btnHRRefreshActivities:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الأنشطة", "Refresh activities")
            OnSelect: |-
              =IfError(
                  With(
                      {
                          pHR: LookUp(colUserPermissions, Module.Value = "HR"),
                          me: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                          ar: gblLanguage = "Arabic"
                      },
                      If(
                          Not(Coalesce(pHR.CanRead, false)),
                          Clear(colHRActivities),
                          Refresh(HRActivityLog);
                          Clear(colHRLogRaw);
                          Switch(
                              Coalesce(varHRScope, ""),
                              "All",
                              Collect(
                                  colHRLogRaw,
                                  FirstN(
                                      SortByColumns(HRActivityLog, "ActionDate", SortOrder.Descending),
                                      20
                                  )
                              ),
                              "Project",
                              If(
                                  varUserHasAllProjects,
                                  Collect(
                                      colHRLogRaw,
                                      FirstN(
                                          SortByColumns(HRActivityLog, "ActionDate", SortOrder.Descending),
                                          20
                                      )
                                  ),
                                  ForAll(
                                      colUserAccessibleProjects As proj,
                                      Collect(
                                          colHRLogRaw,
                                          FirstN(
                                              SortByColumns(
                                                  Filter(HRActivityLog, ProjectID = proj.ID),
                                                  "ActionDate",
                                                  SortOrder.Descending
                                              ),
                                              20
                                          )
                                      )
                                  );
                                  If(
                                      And(IsEmpty(colHRLogRaw), !IsBlank(gblSProject.ID)),
                                      Collect(
                                          colHRLogRaw,
                                          FirstN(
                                              SortByColumns(
                                                  Filter(HRActivityLog, ProjectID = gblSProject.ID),
                                                  "ActionDate",
                                                  SortOrder.Descending
                                              ),
                                              20
                                          )
                                      )
                                  )
                              ),
                              "Own",
                              Collect(
                                  colHRLogRaw,
                                  FirstN(
                                      SortByColumns(
                                          Filter(HRActivityLog, PerformedByID = me),
                                          "ActionDate",
                                          SortOrder.Descending
                                      ),
                                      20
                                  )
                              )
                          );
                          ClearCollect(
                              colHRActivities,
                              ForAll(
                                  FirstN(
                                      SortByColumns(colHRLogRaw, "ActionDate", SortOrder.Descending),
                                      20
                                  ) As log,
                                  {
                                      ID: log.ID,
                                      Module: "HR",
                                      ActivityType: Coalesce(log.EntityType.Value, "HR"),
                                      Action: Coalesce(log.ActionType.Value, ""),
                                      Title: Coalesce(
                                          log.Title,
                                          Trim(
                                              Coalesce(log.ActionType.Value, "") & " · " &
                                              Coalesce(log.EntityType.Value, "") & " " &
                                              Coalesce(log.EntityNumber, "")
                                          )
                                      ),
                                      Description: If(
                                          Coalesce(log.IsSensitive, false),
                                          If(ar, "التفاصيل مخفية", "Details hidden"),
                                          Coalesce(log.Details, log.ReasonComment, "")
                                      ),
                                      Details: If(
                                          Coalesce(log.IsSensitive, false),
                                          If(ar, "التفاصيل مخفية", "Details hidden"),
                                          Coalesce(log.Details, log.ReasonComment, "")
                                      ),
                                      EntityType: Coalesce(log.EntityType.Value, ""),
                                      EntityNumber: Coalesce(log.EntityNumber, ""),
                                      ProjectCode: Coalesce(log.ProjectCode, ""),
                                      ProjectId: Coalesce(log.ProjectID, 0),
                                      Amount: Coalesce(log.Amount, 0),
                                      Currency: Coalesce(log.Currency.Value, ""),
                                      IsSensitive: Coalesce(log.IsSensitive, false),
                                      ActorName: Coalesce(log.PerformedByName, ""),
                                      ActivityDate: Coalesce(log.ActionDate, log.Created),
                                      RecordType: Coalesce(log.EntityType.Value, ""),
                                      RecordID: Coalesce(log.EntityID, 0),
                                      Severity: Switch(
                                          Coalesce(log.Severity.Value, "Info"),
                                          "Critical", "Critical",
                                          "Important", "Important",
                                          "Info"
                                      ),
                                      Status: Switch(
                                          Coalesce(log.Severity.Value, "Info"),
                                          "Critical", "Critical",
                                          "Important", "Important",
                                          "Info"
                                      ),
                                      Icon: Switch(
                                          log.EntityType.Value,
                                          "Employee", "Users",
                                          "Leave", "Calendar",
                                          "Leave Request", "Calendar",
                                          "Attendance", "Clock",
                                          "Document", "FileText",
                                          "Performance", "Performance",
                                          "Training Request", "Graduation",
                                          "Training Course", "Graduation",
                                          "Training Session", "Graduation",
                                          "Training Certificate", "Graduation",
                                          "Training Enrollment", "Graduation",
                                          Coalesce(log.ActionType.Value, "Activity")
                                      )
                                  }
                              )
                          );
                          Clear(colHRLogRaw)
                      )
                  ),
                  Notify(
                      If(gblLanguage = "Arabic", "تعذر تحميل الأنشطة الحديثة", "Could not load recent activities"),
                      NotificationType.Warning
                  )
              )
            Text: =""
            Visible: =false
      - btnHRRefreshEvents:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الأحداث", "Refresh events")
            OnSelect: |-
              =IfError(
                  With(
                      {
                          d0: Today(),
                          until: DateAdd(Today(), 90, TimeUnit.Days),
                          ar: gblLanguage = "Arabic",
                          all: Coalesce(
                              LookUp(
                                  colUserPermissions,
                                  Module.Value = "HR",
                                  And(CanViewAll, Scope.Value = "All")
                              ),
                              false
                          ),
                          me: gblCurrentEmployee.ID
                      },
                      ClearCollect(
                          colHRUpcoming,
                          ForAll(
                              FirstN(
                                  Sort(
                                      Filter(
                                          colEmployees,
                                          !IsBlank(EndDate),
                                          EndDate >= d0,
                                          EndDate <= until,
                                          Or(all, ID = me)
                                      ),
                                      EndDate,
                                      SortOrder.Ascending
                                  ),
                                  10
                              ) As e,
                              {
                                  ID: e.ID,
                                  Module: "HR",
                                  EventType: "Contract",
                                  Title: If(
                                      ar,
                                      "ينتهي عقد " & Coalesce(e.FullName, e.DisplayName, e.Title, ""),
                                      Coalesce(e.FullName, e.DisplayName, e.Title, "") & "'s contract ends"
                                  ),
                                  Description: If(ar, "انتهاء عقد الموظف", "Contract end"),
                                  OwnerName: Coalesce(e.FullName, e.DisplayName, e.Title, ""),
                                  EventDate: e.EndDate,
                                  DaysRemaining: DateDiff(d0, e.EndDate, TimeUnit.Days),
                                  RecordType: "Employee",
                                  RecordID: e.ID,
                                  Icon: "Calendar"
                              }
                          )
                      )
                  ),
                  Notify(
                      If(gblLanguage = "Arabic", "تعذر تحميل الأحداث القادمة", "Could not load upcoming events"),
                      NotificationType.Warning
                  )
              )
            Text: =""
            Visible: =false
