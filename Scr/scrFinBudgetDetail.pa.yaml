          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =FinTheme.Primary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =FinTheme.Focus
            FocusedBorderThickness: =2
            Font: =fontBase
            Height: =1
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =FinTheme.Primary
            HoverFill: =FinTheme.RowHover
            OnSelect: |-
              =IfError(
                  Switch(
                      locTab,
                      // PO lines of this budget line. PurchaseOrderLines.BudgetLineID is a Number column (delegable) but NOT indexed:
                      // index it before the list passes 5,000 rows (N14).
                      "po", ClearCollect(colBudDPO, ForAll(FirstN(Sort(Filter(PurchaseOrderLines, BudgetLineID = locLine.ID), ID, SortOrder.Descending), cfgPageSize) As l,
                              {ID: l.ID, POID: l.POID, PONo: l.PONo, LineNumber: l.LineNumber, Title: l.Title, Quantity: l.Quantity, UnitPrice: l.UnitPrice,
                                Total: l.Total, ReceivedQuantity: l.ReceivedQuantity, RemainingQuantity: l.RemainingQuantity, LineStatus: l.LineStatus.Value})),
                      // Payment request lines (BudgetLineID is Indexed). Request number flattened once here (lookup .Value outside the gallery).
                      "pay", ClearCollect(colBudDPay, ForAll(FirstN(Sort(Filter(PaymentRequesttLines, BudgetLineID = locLine.ID), ID, SortOrder.Descending), cfgPageSize) As l,
                              {ID: l.ID, PRID: l.PaymentRequestID, RequestNumber: l.PaymenetRequest.Value, LineNumber: l.LineNumber,
                                RequestDescription: l.RequestDescription, Currency: l.Currency.Value, Amount: l.Amount, AmountUSD: l.AmountUSD})),
                      "txn", UpdateContext({locTxnCursor: 0, locTxnPage: 1}); Clear(colBudDTxnStack); Select(btnBudDTxnQuery)
                  ),
                  Notify(fnT("common.loadError", "This section could not be loaded. Please retry."), NotificationType.Error);
                  Trace("Budget line tab load failed (" & locTab & "): " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoadedTabs: locLoadedTabs & "|" & locTab & "|"})
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =FinTheme.Primary
            PressedFill: =FinTheme.RowSelected
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =fsBody
            TabIndex: =-1
            Text: =""
            Visible: =false
            Width: =1
      - btnBudDTxnQuery:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =FinTheme.Primary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderColor: =FinTheme.Focus
            FocusedBorderThickness: =2
            Font: =fontBase
            Height: =1
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =FinTheme.Primary
            HoverFill: =FinTheme.RowHover
            OnSelect: |-
              =UpdateContext({locTxnLoading: true, locTxnError: false});
              IfError(
                  ClearCollect(
                      colBudDTxn,
                      ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      FinancialTransactions,
                                      BudgetLineID = locLine.ID,
                                      PeriodKey >= drpBudDTxnFrom.Selected.Key,
                                      PeriodKey <= drpBudDTxnTo.Selected.Key,
                                      drpBudDTxnType.Selected.Key = "" || TransactionType.Value = drpBudDTxnType.Selected.Key,
                                      drpBudDTxnSource.Selected.Key = "" || SourceModule.Value = drpBudDTxnSource.Selected.Key,
                                      canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding,
                                      locTxnCursor = 0 || ID < locTxnCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As t,
                          {
                              ID: t.ID, TransactionNumber: t.TransactionNumber, TransactionDate: t.TransactionDate, PeriodKey: t.PeriodKey,
                              Type: t.TransactionType.Value, Source: t.SourceModule.Value, SourceID: t.SourceID, SourceNumber: t.SourceNumber,
                              Description: t.Description, Currency: t.Currency.Value, Amount: t.Amount, AmountUSD: t.AmountUSD,
                              Status: t.Status.Value, BudgetLineID: t.BudgetLineID
                          }
                      )
                  ),
                  UpdateContext({locTxnError: true});
                  Notify(fnT("txn.loadError", "The transactions could not be loaded. Try a shorter period or retry."), NotificationType.Error);
                  Trace("Ledger query failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locTxnLoading: false})
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =FinTheme.Primary
            PressedFill: =FinTheme.RowSelected
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =fsBody
            TabIndex: =-1
            Text: =""
            Visible: =false
            Width: =1
