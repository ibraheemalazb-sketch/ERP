                  LayoutMinWidth: =0
                  OnSelect: =Select(btnTrainMgmtReload)
                  Text: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                  Width: =140
      - btnTrainMgmtReload:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث مكتب التدريب", "Refresh training desk")
            Height: =1
            OnSelect: |-
              =Set(varDeskLoadError, false);
              If(
                  Not(Or(hrCanManageTraining, hrCanApprove, hrIsHR, hrCanFinanceApprove)),
                  Set(varDeskLoadError, false),
                  IfError(
                      Concurrent(
                          ClearCollect(colTrainCats, Filter(TrainingCategories, IsActive = true)),
                          ClearCollect(colDeskCourses, FirstN(Sort(Filter(TrainingCourses, ID >= 1), ID, SortOrder.Descending), hrPageSize)),
                          ClearCollect(colDeskSessions, FirstN(Sort(Filter(TrainingSessions, ID >= 1), ID, SortOrder.Descending), hrPageSize)),
                          ClearCollect(colDeskCerts, FirstN(Sort(Filter(TrainingCertificates, ID >= 1), ID, SortOrder.Descending), hrPageSize)),
                          If(
                              hrIsHR,
                              ClearCollect(colTrainQueue, FirstN(Filter(TrainingRequests, ApprovalLevelNum = 2), hrPageSize));
                              Collect(colTrainQueue, FirstN(Filter(TrainingRequests, ApprovalLevelNum = 1), hrPageSize));
                              Collect(colTrainQueue, FirstN(Filter(TrainingRequests, ApprovalLevelNum = 3), hrPageSize)),
                              If(
                                  hrCanFinanceApprove,
                                  ClearCollect(colTrainQueue, FirstN(Filter(TrainingRequests, ApprovalLevelNum = 3), hrPageSize)),
                                  ClearCollect(colTrainQueue, FirstN(Filter(TrainingRequests, ManagerID = gblUser.ID && ApprovalLevelNum = 1), hrPageSize))
                              )
                          )
                      ),
                      Set(varDeskLoadError, true);
                      Notify(If(gblLanguage = "Arabic", "تعذر تحميل بيانات التدريب. أضف قوائم التدريب ثم حدّث.", "Training data could not be loaded. Add the training lists, then refresh."), NotificationType.Error)
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnTrainDecide:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ قرار التدريب", "Save training decision")
            Height: =1
            OnSelect: |-
              =If(
                  Or(Coalesce(varTrainReqID, 0) <= 0, IsBlank(varTrainDecision)),
                  Notify(If(gblLanguage = "Arabic", "اختر طلباً أولاً.", "Select a request first."), NotificationType.Warning),
                  If(
                      And(varTrainDecision <> "Approved", Len(Trim(Coalesce(txtDeskComment.Text, ""))) < 10),
                      Notify(If(gblLanguage = "Arabic", "الرفض والإعادة يحتاجان إلى تعليق من 10 أحرف على الأقل.", "Reject and return need a comment of at least 10 characters."), NotificationType.Error),
                      With(
                          {fresh: LookUp(TrainingRequests, ID = varTrainReqID)},
                          If(
                              Or(IsBlank(fresh.ID), fresh.Status.Value <> varTrainExpected, fresh.ApprovalLevelNum <> varTrainExpectedLevel),
                              Notify(If(gblLanguage = "Arabic", "تغيّر هذا الطلب. حدّث الصفحة ثم أعد المحاولة.", "This request changed. Refresh and try again."), NotificationType.Warning),
                              If(
                                  Not(
                                      Or(
                                          And(fresh.ApprovalLevelNum = 1, fresh.ManagerID = gblUser.ID),
                                          And(fresh.ApprovalLevelNum = 2, hrIsHR),
                                          And(fresh.ApprovalLevelNum = 3, hrCanFinanceApprove)
                                      )
                                  ),
                                  Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Error),
                                  With(
                                      {
                                          nxt: fnNextTrainingStatus(fresh.Status.Value, varTrainDecision, Coalesce(fresh.EstimatedCost, 0))
                                      },
                                      IfError(
                                          Set(
                                              varSavedReq,
                                              Patch(
                                                  TrainingRequests,
                                                  fresh,
                                                  {Status: {Value: nxt}, ApprovalLevelNum: fnTrainingLevelNum(nxt)}
                                              )
                                          ),
                                          Set(varSavedReq, Blank());
                                          Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                                      );
                                      If(
                                          !IsBlank(varSavedReq.ID),
                                          fnLogHR("Training Request", varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, ""), varTrainDecision, "Important", Coalesce(varSavedReq.ProjectID, 0), Coalesce(varSavedReq.EstimatedCost, 0), Coalesce(varSavedReq.Currency.Value, ""), "Status", fresh.Status.Value, nxt, "id=" & varSavedReq.ID, "", false);
                                          fnApprovalRow(varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, Text(varSavedReq.ID)), If(varTrainDecision = "Approved", "Approved", If(varTrainDecision = "Rejected", "Rejected", "Returned")), If(varTrainDecision = "Approved", "Approved", If(varTrainDecision = "Rejected", "Rejected", "Returned")), Left(Coalesce(txtDeskComment.Text, ""), 250), fnApprovalLevelLabel(fresh.Status.Value), Coalesce(varSavedReq.EmployeeID, 0), Coalesce(varSavedReq.Priority.Value, "Medium"));
                                          fnNotifyHR(Coalesce(varSavedReq.EmployeeID, 0), Coalesce(varSavedReq.Employee.Value, ""), If(gblLanguage = "Arabic", "تحديث طلب تدريب", "Training request update"), If(gblLanguage = "Arabic", "حالة طلب التدريب أصبحت", "Your training request status is now") & " " & nxt, "TrainingRequest", varSavedReq.ID, If(varTrainDecision = "Approved", "Success", "Approval"));
                                          If(
                                              nxt = "Approved",
                                              fnEnrollIfApproved(varSavedReq.ID, Coalesce(varSavedReq.SessionID, 0), Coalesce(varSavedReq.EmployeeID, 0), Coalesce(varSavedReq.Employee.Value, ""), Coalesce(varSavedReq.CourseID, 0), Coalesce(varSavedReq.Course.Value, ""))
                                          );
                                          Notify(If(gblLanguage = "Arabic", "تم حفظ القرار.", "Decision saved."), NotificationType.Success);
                                          Set(varTrainReqID, 0);
                                          Select(btnTrainMgmtReload)
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnCourseCommit:
          Control: ModernButton@1.0.0
          Properties:
