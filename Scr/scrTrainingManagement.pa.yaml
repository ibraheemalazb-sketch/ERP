                  );
                  If(
                      !IsBlank(varSavedCourse.ID),
                      fnLogHR("Training Course", varSavedCourse.ID, Coalesce(varSavedCourse.CourseCode, ""), "Created", "Info", 0, Blank(), "", "Status", "", "Active", "id=" & varSavedCourse.ID, "", false);
                      Notify(If(gblLanguage = "Arabic", "تم حفظ القرار.", "Decision saved."), NotificationType.Success);
                      Select(btnTrainMgmtReload)
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnCourseRetireDo:
