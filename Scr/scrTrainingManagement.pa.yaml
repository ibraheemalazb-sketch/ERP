Screens:
  scrTrainingManagement:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "HR");
        Set(VarHRmodule, "Training");
        Set(varNavSelectedID, 17);
        Set(varHasTeam, CountRows(Filter(Employees, ManagerID = gblUser.ID)) > 0);
        Set(varDeskBlocked, Not(Or(hrCanManageTraining, hrIsHR, hrCanApprove, hrCanFinanceApprove, varHasTeam)));
        If(IsBlank(varDeskTab), Set(varDeskTab, If(hrCanManageTraining, "Courses", "Queue")));
        Set(varTrainReqID, 0);
        If(!varDeskBlocked, Select(btnTrainMgmtReload));
        If(hrIsHR, ClearCollect(colPerfEmployees, FirstN(Filter(Employees, ID >= 1), hrPageSize)))
    Children:
      - cmpscrTrainingManagementTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeColor: =
            BadgeCount: |-
              =CountRows(Filter(colNotifications, With({flag: Lower(Trim(Coalesce(IsRead, "no")))}, And(flag <> "yes", flag <> "true", flag <> "1"))))
            FontSizeTitle: =
            HasNotifications: |-
              =CountRows(Filter(colNotifications, With({flag: Lower(Trim(Coalesce(IsRead, "no")))}, And(flag <> "yes", flag <> "true", flag <> "1")))) > 0
            Height: =56
            HoverText: =
            IconColor: =
            IconSvg: =
            ModuleIcon: ="Certificate"
            ModuleName: =If(gblLanguage = "Arabic", "الموارد البشرية", "Human Resources")
            OnSearch: =
            OnSelect: =
            OnSelectSubtitle: =
            OnSelectTitle: =Navigate(ScrHR, ScreenTransition.None)
            ScreenSubtitle: =If(gblLanguage = "Arabic", "البرامج والموافقات", "Courses and approvals")
            ScreenTitle: =If(gblLanguage = "Arabic", "مكتب التدريب", "Training desk")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =true
            ShowTheme: =true
            ShowUser: =true
            Size: =
            SubTitleWidth: =
            Theme: =gblTheme.Mode
            TitleWidth: =
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
      - cmpscrTrainingManagementPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            SelectedID: =
            Visible: =App.Width < 700
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
      - conscrTrainingManagementPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, 64, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =68
            Width: =Parent.Width
          Children:
            - conDeskFail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =96
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =CountRows(colFailedWrites) > 0
                  Width: =Parent.Width
                Children:
                  - lblDeskFail:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("Warning")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "فشلت بعض كتابات السجل أو الإشعارات.", "Some log or notification writes failed.")
                        Width: =Parent.Width
                  - btnDeskFailClear:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إخفاء", "Dismiss")
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Clear(colFailedWrites)
                        Text: =If(gblLanguage = "Arabic", "إخفاء", "Dismiss")
                        Width: =120
            - conDeskErr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varDeskLoadError
                  Width: =Parent.Width
                Children:
                  - lblDeskErr:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("Danger")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =48
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "تعذر تحميل بيانات التدريب. أضف قوائم التدريب ثم حدّث.", "Training data could not be loaded. Add the training lists, then refresh.")
                        Width: =Parent.Width
            - lblDeskHead:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.PageTitle
                  Text: =If(gblLanguage = "Arabic", "مكتب التدريب", "Training desk")
                  Width: =Parent.Width
            - lblDeskSub:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  Color: =fxThemeColor("TextSecondary")
                  Font: =gblTheme.Typography.FontFamily
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.Body
                  Text: =If(gblLanguage = "Arabic", "البرامج والجلسات والموافقات والشهادات. يُكتب سجل الموافقة مباشرة.", "Courses, sessions, approvals, and certificates. Approval history is written directly.")
                  Width: =Parent.Width
            - lblDeskBlock:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.Body
                  Text: =If(gblLanguage = "Arabic", "ليست لديك صلاحية لهذا المكتب.", "You do not have access to this desk.")
                  Visible: =varDeskBlocked
                  Width: =Parent.Width
            - conDeskTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - btnDeskCourses:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "البرامج", "Courses")
                        Appearance: =If(varDeskTab = "Courses", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varDeskTab, "Courses")
                        Text: =If(gblLanguage = "Arabic", "البرامج", "Courses")
                        Visible: =hrCanManageTraining
                        Width: =130
                  - btnDeskSess:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الجلسات", "Sessions")
                        Appearance: =If(varDeskTab = "Sessions", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varDeskTab, "Sessions")
                        Text: =If(gblLanguage = "Arabic", "الجلسات", "Sessions")
                        Visible: =hrCanManageTraining
                        Width: =140
                  - btnDeskQueue:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الموافقات", "Approvals")
                        Appearance: =If(varDeskTab = "Queue", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varDeskTab, "Queue")
                        Text: =If(gblLanguage = "Arabic", "الموافقات", "Approvals")
                        Width: =150
                  - btnDeskCerts:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الشهادات", "Certificates")
                        Appearance: =If(varDeskTab = "Certs", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varDeskTab, "Certs")
                        Text: =If(gblLanguage = "Arabic", "الشهادات", "Certificates")
                        Visible: =hrIsHR
                        Width: =160
                  - btnDeskMine:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تدريبي", "My training")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrMyTraining, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "تدريبي", "My training")
                        Width: =150
            - txtDeskSearch:
                Control: ModernTextInput@1.1.2
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في الصفوف المحملة", "Search loaded rows")
                  Default: =varDeskSearch
                  Height: =40
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnChange: =Set(varDeskSearch, Self.Text)
                  Placeholder: =If(gblLanguage = "Arabic", "بحث في الصفوف المحملة", "Search loaded rows")
                  Width: =Parent.Width
            - conDeskCourses:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =And(!varDeskBlocked, varDeskTab = "Courses")
                  Width: =Parent.Width
                Children:
                  - galDeskCourses:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "البرامج", "Courses")
                        BorderStyle: =BorderStyle.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =420
                        Items: =Filter(colDeskCourses, IsBlank(varDeskSearch) || varDeskSearch in Coalesce(Title, ""))
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplatePadding: =4
                        TemplateSize: =132
                        Width: =Parent.Width
                      Children:
                        - congalDeskCoursesRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("BorderLight")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Surface")
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              PaddingBottom: =6
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.TemplateWidth
                            Children:
                              - lblDeskCourse:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Body
                                    Text: =ThisItem.Title
                                    Width: =Parent.Width
                              - lblDeskCourseMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Caption
                                    Text: =Coalesce(ThisItem.Status.Value, "") & "  " & If(ThisItem.IsActive, "Active", "Inactive")
                                    Width: =Parent.Width
                              - btnPickCourse:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "اختيار", "Select")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =If(App.Width < 700, 44, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varDeskCourseID, ThisItem.ID);
                                      Set(varDeskCourseName, ThisItem.Title);
                                      Set(varCertCourseID, ThisItem.ID);
                                      Set(varCertCourseName, ThisItem.Title)
                                    Text: =If(gblLanguage = "Arabic", "اختيار", "Select")
                                    Width: =140
                  - lblDeskEmptyC:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("TextMuted")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "لا يوجد شيء للعرض بعد.", "Nothing to show yet.")
                        Visible: =CountRows(colDeskCourses) = 0
                        Width: =Parent.Width
                  - conNewCourse:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =And(hrCanManageTraining, varDeskTab = "Courses")
                        Width: =Parent.Width
                      Children:
                        - lblNewCourse:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.SectionTitle
                              Text: =If(gblLanguage = "Arabic", "برنامج جديد", "New course")
                              Width: =Parent.Width
                        - txtCourseTitle:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "اسم البرنامج", "Course title")
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "اسم البرنامج", "Course title")
                              Width: =Parent.Width
                        - txtCourseCode:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الرمز", "Code")
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "الرمز", "Code")
                              Width: =220
                        - ddCourseCat:
                            Control: ModernDropdown@1.0.3
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "التصنيف", "Category")
                              Height: =40
                              ItemDisplayText: =ThisItem.Title
                              Items: =colTrainCats
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                        - ddCourseMode:
                            Control: ModernDropdown@1.0.3
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "طريقة التقديم", "Delivery")
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: |-
                                =Table({Value: "Classroom"}, {Value: "Online"}, {Value: "Blended"}, {Value: "On the job"})
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =240
                        - txtCourseHours:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الساعات", "Hours")
                              Default: ="0"
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "الساعات", "Hours")
                              Width: =160
                        - txtCourseProvider:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الجهة", "Provider")
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "الجهة", "Provider")
                              Width: =Parent.Width
                        - txtCourseCost:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "التكلفة للشخص", "Cost per person")
                              Default: ="0"
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "التكلفة للشخص", "Cost per person")
                              Width: =180
                        - ddCourseCur:
                            Control: ModernDropdown@1.0.3
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "العملة", "Currency")
                              Default: |-
                                ={Value: "USD"}
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: |-
                                =Table({Value: "USD"}, {Value: "YER"}, {Value: "SAR"})
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =160
                        - txtCourseDesc:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الوصف", "Description")
                              Height: =80
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "لمن هذا البرنامج؟", "Who is this for?")
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                        - conCourseBtns:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =52
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
