                          Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                      );
                      If(
                          !IsBlank(varSavedCourse.ID),
                          fnLogHR("Training Course", varSavedCourse.ID, Coalesce(varSavedCourse.CourseCode, ""), "Updated", "Important", 0, Blank(), "", "Status", Coalesce(fresh.Status.Value, ""), "Retired", "id=" & varSavedCourse.ID, "", false);
                          Select(btnTrainMgmtReload)
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnSessCommit:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "إنشاء الجلسة", "Create session")
            Height: =1
            OnSelect: |-
              =If(
                  Or(Not(hrCanManageTraining), Coalesce(varDeskCourseID, 0) <= 0, IsBlank(dteSessStart.SelectedDate)),
                  Notify(If(gblLanguage = "Arabic", "اختر برنامجاً واكتب مبرراً من 10 أحرف على الأقل.", "Choose a course and write a justification of at least 10 characters."), NotificationType.Error),
                  IfError(
                      Set(
                          varSavedSess,
                          Patch(
                              TrainingSessions,
                              Defaults(TrainingSessions),
                              {
                                  Title: If(Len(Trim(Coalesce(txtSessTitle.Text, ""))) = 0, Coalesce(varDeskCourseName, "Session"), txtSessTitle.Text),
                                  Course: {Id: varDeskCourseID, Value: Coalesce(varDeskCourseName, "")},
                                  CourseID: varDeskCourseID,
                                  StartDate: dteSessStart.SelectedDate,
                                  EndDate: Coalesce(dteSessEnd.SelectedDate, dteSessStart.SelectedDate),
                                  Location: Coalesce(txtSessWhere.Text, ""),
                                  Trainer: Coalesce(txtSessTrainer.Text, ""),
                                  Capacity: IfError(Value(txtSessCap.Text), 0),
                                  Status: {Value: "Planned"},
                                  ProjectID: If(Coalesce(gblUser.ProjectID, 0) > 0, gblUser.ProjectID, Blank()),
                                  OfficeID: If(Coalesce(gblUser.OfficeId, 0) > 0, gblUser.OfficeId, Blank())
                              }
                          )
                      ),
                      Set(varSavedSess, Blank());
                      Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                  );
                  If(
                      !IsBlank(varSavedSess.ID),
                      fnLogHR("Training Session", varSavedSess.ID, "", "Created", "Info", Coalesce(gblUser.ProjectID, 0), Blank(), "", "Status", "", "Planned", "id=" & varSavedSess.ID, "", false);
                      Notify(If(gblLanguage = "Arabic", "تم حفظ القرار.", "Decision saved."), NotificationType.Success);
                      Select(btnTrainMgmtReload)
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnSessStatus:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الجلسة", "Update session")
            Height: =1
            OnSelect: |-
              =With(
                  {fresh: LookUp(TrainingSessions, ID = varDeskSessionID)},
                  If(
                      Or(Not(hrCanManageTraining), IsBlank(fresh.ID), IsBlank(varSessNext)),
                      Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Error),
                      If(
                          Or(fresh.Status.Value = "Full", fresh.Status.Value <> varSessExpected),
                          Notify(If(gblLanguage = "Arabic", "تغيّر هذا الطلب. حدّث الصفحة ثم أعد المحاولة.", "This request changed. Refresh and try again."), NotificationType.Warning),
                          If(
                              Not(Or(varSessNext = "Planned", varSessNext = "Open", varSessNext = "In Progress", varSessNext = "Completed", varSessNext = "Cancelled")),
                              Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Error),
                              IfError(
                                  Set(varSavedSess, Patch(TrainingSessions, fresh, {Status: {Value: varSessNext}})),
                                  Set(varSavedSess, Blank());
                                  Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                              );
                              If(
                                  !IsBlank(varSavedSess.ID),
                                  fnLogHR("Training Session", varSavedSess.ID, Coalesce(varSavedSess.SessionNumber, ""), "Updated", "Important", 0, Blank(), "", "Status", fresh.Status.Value, varSessNext, "id=" & varSavedSess.ID, "", false);
                                  Select(btnTrainMgmtReload)
                              )
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnCertIssueDo:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "إصدار الشهادة", "Issue certificate")
            Height: =1
            OnSelect: |-
              =If(
                  Or(Not(hrIsHR), Coalesce(varCertEmployeeID, 0) <= 0, Coalesce(varCertCourseID, 0) <= 0),
                  Notify(If(gblLanguage = "Arabic", "اختر برنامجاً واكتب مبرراً من 10 أحرف على الأقل.", "Choose a course and write a justification of at least 10 characters."), NotificationType.Error),
                  IfError(
                      Set(
                          varSavedCert,
                          Patch(
                              TrainingCertificates,
                              Defaults(TrainingCertificates),
                              {
                                  Title: Left(Coalesce(varCertEmployeeName, "") & " - " & Coalesce(varCertCourseName, ""), 255),
                                  Employee: {Id: varCertEmployeeID, Value: Coalesce(varCertEmployeeName, "")},
                                  EmployeeID: varCertEmployeeID,
                                  Course: {Id: varCertCourseID, Value: Coalesce(varCertCourseName, "")},
                                  CourseID: varCertCourseID,
                                  SessionID: If(Coalesce(varCertSessionID, 0) > 0, varCertSessionID, Blank()),
                                  IssueDate: Today()
                              }
                          )
                      ),
                      Set(varSavedCert, Blank());
                      Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                  );
                  If(
                      !IsBlank(varSavedCert.ID),
                      fnLogHR("Training Certificate", varSavedCert.ID, "", "Issued", "Important", 0, Blank(), "", "Status", "", "Pending", "id=" & varSavedCert.ID, "", false);
                      Notify(If(gblLanguage = "Arabic", "تم إنشاء الشهادة. الرقم ما زال قيد الإصدار.", "Certificate row created. The number is still pending."), NotificationType.Success);
                      Select(btnTrainMgmtReload)
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnCertRevokeDo:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء الشهادة", "Revoke certificate")
            Height: =1
            OnSelect: |-
              =With(
                  {fresh: LookUp(TrainingCertificates, ID = varCertID)},
                  If(
                      Or(Not(hrIsHR), IsBlank(fresh.ID), Len(Trim(Coalesce(txtRevokeWhy.Text, ""))) < 10),
                      Notify(If(gblLanguage = "Arabic", "اكتب سبب الإلغاء من 10 أحرف على الأقل.", "Write a revoke reason of at least 10 characters."), NotificationType.Error),
                      If(
                          fresh.Status.Value = "Revoked",
                          Notify(If(gblLanguage = "Arabic", "تغيّر هذا الطلب. حدّث الصفحة ثم أعد المحاولة.", "This request changed. Refresh and try again."), NotificationType.Warning),
                          IfError(
                              Set(varSavedCert, Patch(TrainingCertificates, fresh, {Status: {Value: "Revoked"}, RevokedDate: Now(), RevokeReason: txtRevokeWhy.Text})),
                              Set(varSavedCert, Blank());
                              Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                          );
                          If(
                              !IsBlank(varSavedCert.ID),
                              fnLogHR("Training Certificate", varSavedCert.ID, Coalesce(varSavedCert.CertificateNumber, ""), "Revoked", "Important", 0, Blank(), "", "Status", Coalesce(fresh.Status.Value, ""), "Revoked", "id=" & varSavedCert.ID, "", false);
                              Notify(If(gblLanguage = "Arabic", "تم إلغاء الشهادة.", "Certificate revoked."), NotificationType.Success);
                              Select(btnTrainMgmtReload)
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
