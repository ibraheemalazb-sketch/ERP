                                  Provider: Coalesce(txtCourseProvider.Text, ""),
                                  IsActive: true,
                                  CostPerPerson: IfError(Value(txtCourseCost.Text), 0),
                                  Currency: {Value: Coalesce(ddCourseCur.Selected.Value, "USD")},
                                  Status: {Value: "Active"},
                                  Category: If(Coalesce(ddCourseCat.Selected.ID, 0) > 0, {Id: ddCourseCat.Selected.ID, Value: ddCourseCat.Selected.Title}, Blank()),
                                  CategoryID: If(Coalesce(ddCourseCat.Selected.ID, 0) > 0, ddCourseCat.Selected.ID, Blank())
                              }
