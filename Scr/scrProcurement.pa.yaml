            - cmpPcActivity:
                Control: CanvasComponent
                ComponentName: cmpLastActivities
                Properties:
                  Height: =420
                  Items: |-
                    =ForAll(
                        FirstN(SortByColumns(ProcurementActivityLog, "ActionDate", SortOrder.Descending), 20) As log,
                        {
                            ID: log.ID,
                            Title: Coalesce(log.ActionType.Value, "") & " · " & Coalesce(log.EntityType.Value, "") & " " & Coalesce(log.EntityNumber, ""),
                            Action: Coalesce(log.ActionType.Value, ""),
                            EntityType: Coalesce(log.EntityType.Value, ""),
                            EntityNumber: Coalesce(log.EntityNumber, ""),
                            ProjectCode: "",
                            ActorName: Coalesce(log.PerformedByName, ""),
                            ActivityDate: log.ActionDate,
                            Severity: Switch(Coalesce(log.Severity.Value, "Info"), "Critical", "Critical", "Important", "Important", "Info"),
                            Icon: Switch(
                                Coalesce(log.EntityType.Value, ""),
                                "Purchase Request", "Clipboard",
                                "PR Line", "Clipboard",
                                "Purchase Order", "Receipt",
                                "PO Line", "Receipt",
                                "GRN", "Truck",
                                "Vendor", "Users",
                                "Activity"
                            ),
                            Details: If(log.IsSensitive, If(gblLanguage = "Arabic", "التفاصيل مخفية", "Details hidden"), Coalesce(log.Details, "")),
                            Amount: 0,
                            Currency: "",
                            RecordID: Coalesce(log.EntityID, 0),
                            RecordType: Coalesce(log.EntityType.Value, ""),
                            ProjectId: 0,
                            IsSensitive: Coalesce(log.IsSensitive, false)
                        }
                    )
                  Layout: ="List"
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  MaxItems: =12
                  OnSelect: |-
                    =With(
                        {row: cmpPcActivity.SelectedActivity},
                        Switch(
                            row.RecordType,
                            "Purchase Request",
                                Set(varCurrentPR, LookUp(PurchaseRequests, ID = row.RecordID));
                                Set(varProcurementEntity, "PurchaseRequest");
                                Set(varProcurementMode, "View");
                                Set(varProcurementTab, "PRs");
                                Set(varNavSelectedID, 32);
                                Navigate(scrPRs, ScreenTransition.None),
                            "PR Line",
                                Set(varCurrentPR, LookUp(PurchaseRequests, ID = LookUp(PurchaseRequestLines, ID = row.RecordID, PRID)));
                                Set(varProcurementEntity, "PurchaseRequest");
                                Set(varProcurementMode, "View");
                                Set(varProcurementTab, "PRs");
                                Set(varNavSelectedID, 32);
                                Navigate(scrPRs, ScreenTransition.None),
                            "Purchase Order",
                                Set(varCurrentPO, LookUp(PurchaseOrders, ID = row.RecordID));
                                Set(varProcurementEntity, "PurchaseOrder");
                                Set(varProcurementMode, "View");
                                Set(varProcurementTab, "POs");
                                Set(varNavSelectedID, 33);
                                Navigate(scrPOs, ScreenTransition.None),
                            "PO Line",
                                Set(varCurrentPO, LookUp(PurchaseOrders, ID = LookUp(PurchaseOrderLines, ID = row.RecordID, POID)));
                                Set(varProcurementEntity, "PurchaseOrder");
                                Set(varProcurementMode, "View");
                                Set(varProcurementTab, "POs");
                                Set(varNavSelectedID, 33);
                                Navigate(scrPOs, ScreenTransition.None),
                            "GRN",
                                Set(varCurrentGRN, LookUp(GoodsReceivedNotes, ID = row.RecordID));
                                Set(varProcurementEntity, "GRN");
                                Set(varProcurementMode, "View");
                                Set(varProcurementTab, "GRNs");
                                Set(varNavSelectedID, 34);
                                Navigate(ScrGRN, ScreenTransition.None),
                            "Vendor",
                                Set(varCurrentVendor, LookUp(Vendors, ID = row.RecordID));
                                Set(varaddvendor, false);
                                Set(varProcurementTab, "Vendors");
                                Set(varNavSelectedID, 35);
                                Set(varProcurementMode, "View");
                                Navigate(scrVendors, ScreenTransition.None),
                            Notify(If(gblLanguage = "Arabic", "لا توجد شاشة لهذا السجل.", "This activity has no screen to open."), NotificationType.Information)
                        )
                    )
                  OnViewAll: =
                  Refresh: =Refresh(ProcurementActivityLog)
                  ShowSummary: =true
                  ShowViewAll: =false
                  Title: =If(gblLanguage = "Arabic", "آخر أنشطة المشتريات", "Procurement activity")
                  Width: =Parent.Width
