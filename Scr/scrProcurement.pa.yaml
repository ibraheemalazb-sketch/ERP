Screens:
  scrProcurement:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, Coalesce(varProcurementTab, "Main"));
        Set(
            varNavSelectedID,
            Switch(
                varProcurementTab,
                "PRs", 32,
                "POs", 33,
                "GRNs", 34,
                "Vendors", 35,
                "Contracts", 37,
                "Plans", 39,
                31
            )
        );
        Set(varSelectedSupplier, "");
        Set(varSelectedCurrency, "");
        IfError(
            If(
                varProcurementScope = "Own",
                ClearCollect(
                    colPurchaseRequests,
                    FirstN(
                        SortByColumns(
                            Filter(PurchaseRequests, 'Created By'.Email = gblUserEmail),
                            "ID",
                            SortOrder.Descending
                        ),
                        500
                    )
                ),
                If(
                    varProcurementScope = "Project",
                    ClearCollect(
                        colPurchaseRequests,
                        Filter(
                            FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500),
                            Project.Value in colProjects.ProjectCode
                        )
                    ),
                    ClearCollect(
                        colPurchaseRequests,
                        FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500)
                    )
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل طلبات الشراء.", "Purchase requests could not be loaded."),
                NotificationType.Error
            )
        );
        IfError(
            If(
                varProcurementScope = "Own",
                ClearCollect(
                    colPurchaseOrders,
                    FirstN(
                        SortByColumns(
                            Filter(PurchaseOrders, 'Created By'.Email = gblUserEmail),
                            "ID",
                            SortOrder.Descending
                        ),
                        500
                    )
                ),
                If(
                    varProcurementScope = "Project",
                    ClearCollect(
                        colPurchaseOrders,
                        Filter(
                            FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500),
                            Project.Value in colProjects.ProjectCode
                        )
                    ),
                    ClearCollect(
                        colPurchaseOrders,
                        FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500)
                    )
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل أوامر الشراء.", "Purchase orders could not be loaded."),
                NotificationType.Error
            )
        );
        IfError(
            If(
                varProcurementScope = "Own",
                ClearCollect(
                    colGoodsReceipts,
                    FirstN(
                        SortByColumns(
                            Filter(GoodsReceivedNotes, 'Created By'.Email = gblUserEmail),
                            "ID",
                            SortOrder.Descending
                        ),
                        500
                    )
                ),
                If(
                    varProcurementScope = "Project",
                    ClearCollect(
                        colGoodsReceipts,
                        Filter(
                            FirstN(SortByColumns(GoodsReceivedNotes, "ID", SortOrder.Descending), 500),
                            Project.Value in colProjects.ProjectCode
                        )
                    ),
                    ClearCollect(
                        colGoodsReceipts,
                        FirstN(SortByColumns(GoodsReceivedNotes, "ID", SortOrder.Descending), 500)
                    )
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل الاستلامات.", "Goods receipts could not be loaded."),
                NotificationType.Error
            )
        );
        IfError(
            ClearCollect(
                colPurchaseRequestLines,
                Filter(
                    FirstN(SortByColumns(PurchaseRequestLines, "ID", SortOrder.Descending), 500),
                    PR.Id in colPurchaseRequests.ID
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل بنود طلبات الشراء.", "Purchase request lines could not be loaded."),
                NotificationType.Warning
            )
        );
        IfError(
            ClearCollect(
                colPurchaseOrderLines,
                Filter(
                    FirstN(SortByColumns(PurchaseOrderLines, "ID", SortOrder.Descending), 500),
                    PO.Id in colPurchaseOrders.ID
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل بنود أوامر الشراء.", "Purchase order lines could not be loaded."),
                NotificationType.Warning
            )
        );
        IfError(
            ClearCollect(
                colGoodsReceiptLines,
                Filter(
                    FirstN(SortByColumns(GoodsReceivedNoteLines, "ID", SortOrder.Descending), 500),
                    GRN.Id in colGoodsReceipts.ID
                )
            ),
            Notify(
                If(gblLanguage = "Arabic", "تعذر تحميل بنود الاستلام.", "Goods receipt lines could not be loaded."),
                NotificationType.Warning
            )
        );
        Set(varPOTotal, CountRows(colPurchaseOrders));
        Set(varPOSubmitted, CountIf(colPurchaseOrders, POStatus.Value = "Submitted"));
        Set(varPOPending, CountIf(colPurchaseOrders, POStatus.Value = "Issued"));
        Set(varPOInProgress, CountIf(colPurchaseOrders, POStatus.Value = "InProgress"));
        Set(varPOCompleted, CountIf(colPurchaseOrders, POStatus.Value = "Completed"));
        Set(varPOCancelled, CountIf(colPurchaseOrders, POStatus.Value = "Cancelled"))
    Children:
      - conPcNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpPcNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conPcPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpPcPhone.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =16
            PaddingTop: =cmpPcTop.Height + 12
            Width: =Parent.Width
          Children:
            - cmpPcKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AnimationEffect: ="None"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 5,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "Clipboard",
                            Value: CountRows(colPurchaseRequests),
                            Label: If(gblLanguage = "Arabic", "طلبات الشراء", "Purchase requests"),
                            Subtitle: If(gblLanguage = "Arabic", "ضمن النطاق", "In scope"),
                            Screen: "PRs",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Clock",
                            Value: CountIf(colPurchaseOrders, ApprovalStatus.Value = "Pending"),
                            Label: If(gblLanguage = "Arabic", "أوامر معلّقة", "Pending orders"),
                            Subtitle: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Awaiting approval"),
                            Screen: "Approvals",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Receipt",
                            Value: CountRows(colPurchaseOrders),
                            Label: If(gblLanguage = "Arabic", "أوامر الشراء", "Purchase orders"),
                            Subtitle: If(gblLanguage = "Arabic", "ضمن النطاق", "In scope"),
                            Screen: "POs",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Truck",
                            Value: CountRows(colGoodsReceipts),
                            Label: If(gblLanguage = "Arabic", "الاستلامات", "Goods receipts"),
                            Subtitle: If(gblLanguage = "Arabic", "ضمن النطاق", "In scope"),
                            Screen: "GRNs",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 5,
                            Icon: "Money",
                            Value: CountIf(colPurchaseOrders, PaymentStatus.Value = "unpaid"),
                            Label: If(gblLanguage = "Arabic", "غير مدفوعة", "Unpaid orders"),
                            Subtitle: If(gblLanguage = "Arabic", "بانتظار السداد", "Outstanding payment"),
                            Screen: "POs",
                            IconBg: "",
                            IconColor: fxThemeInk("Primary"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FontsSizesTitle: =
                  Height: |-
                    =With(
                        {cols: If(Parent.Width < 640, 1, If(Parent.Width < 1024, 2, 5))},
                        RoundUp(5 / cols, 0) * 108
                    )
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  IconsSize: =
                  IsLoading: =false
                  KPINav: |-
                    =Switch(
                        varClickScreen,
                        "PRs", Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varNavSelectedID, 32); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        "POs", Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varNavSelectedID, 33); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        "GRNs", Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varNavSelectedID, 34); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        "Approvals", Navigate(ScrApprovalCenter, ScreenTransition.None)
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: =
                  Style: ="Compact"
                  StyleConfig: =
                  SubtitleFS: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
            - conPcCharts:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 420 + 12 + 420 + 12 + 240, 420)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - conPcPrStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =If(App.Width < 700, 420, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                      Children:
                        - lblPcPrChart:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.Body
                              Text: =If(gblLanguage = "Arabic", "طلبات الشراء حسب الحالة", "Purchase requests by status")
                              Width: =Parent.Width
                        - cmpPcPrPie:
                            Control: CanvasComponent
                            ComponentName: cmpPieChart
                            Properties:
                              Animate: =
                              AnimationDuration: =
                              ChartData: |-
                                =Table(
                                    {Label: If(gblLanguage = "Arabic", "مسودة", "Draft"), Value: CountIf(colPurchaseRequests, Status.Value = "Draft"), Color: If(gblTheme.Mode = "Dark", "#93C5FD", "#2563EB")},
                                    {Label: If(gblLanguage = "Arabic", "مقدّم", "Submitted"), Value: CountIf(colPurchaseRequests, Status.Value = "Submitted"), Color: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706")},
                                    {Label: If(gblLanguage = "Arabic", "معتمد", "Approved"), Value: CountIf(colPurchaseRequests, Status.Value = "Approved"), Color: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A")},
                                    {Label: If(gblLanguage = "Arabic", "مرفوض", "Rejected"), Value: CountIf(colPurchaseRequests, Status.Value = "Rejected"), Color: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626")},
                                    {Label: If(gblLanguage = "Arabic", "ملغى", "Cancelled"), Value: CountIf(colPurchaseRequests, Status.Value = "Cancelled"), Color: If(gblTheme.Mode = "Dark", "#9CA3AF", "#6B7280")}
                                )
                              ChartTitle: =If(gblLanguage = "Arabic", "طلبات الشراء حسب الحالة", "Purchase requests by status")
                              DefaultColors: =
                              DonutMode: =true
                              DonutThickness: =0.24
                              FillPortions: =1
                              Height: =360
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LegendSize: =24
                              PieSize: =180
                              ShowLabels: =false
                              ShowLegend: =true
                              ShowPercentages: =true
                              ShowTitle: =false
                              ShowValues: =true
                              Theme: =gblTheme.Mode
                              Width: =Parent.Width
                  - conPcPoStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =If(App.Width < 700, 420, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                      Children:
                        - lblPcPoChart:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.Body
                              Text: =If(gblLanguage = "Arabic", "أوامر الشراء حسب الحالة", "Purchase orders by status")
                              Width: =Parent.Width
                        - cmpPcPoPie:
                            Control: CanvasComponent
                            ComponentName: cmpPieChart
                            Properties:
                              Animate: =
                              AnimationDuration: =
                              ChartData: |-
                                =Table(
                                    {Label: If(gblLanguage = "Arabic", "مقدّم", "Submitted"), Value: varPOSubmitted, Color: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706")},
                                    {Label: If(gblLanguage = "Arabic", "صادر", "Issued"), Value: varPOPending, Color: If(gblTheme.Mode = "Dark", "#22D3EE", "#0E7490")},
                                    {Label: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress"), Value: varPOInProgress, Color: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5")},
                                    {Label: If(gblLanguage = "Arabic", "مكتمل", "Completed"), Value: varPOCompleted, Color: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A")},
                                    {Label: If(gblLanguage = "Arabic", "ملغى", "Cancelled"), Value: varPOCancelled, Color: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626")}
                                )
                              ChartTitle: =If(gblLanguage = "Arabic", "أوامر الشراء حسب الحالة", "Purchase orders by status")
                              DefaultColors: =
                              DonutMode: =true
                              DonutThickness: =0.24
                              FillPortions: =1
                              Height: =360
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LegendSize: =24
                              PieSize: =180
                              ShowLabels: =false
                              ShowLegend: =true
                              ShowPercentages: =true
                              ShowTitle: =false
                              ShowValues: =true
                              Theme: =gblTheme.Mode
                              Width: =Parent.Width
                  - cmpPcMoney:
                      Control: CanvasComponent
                      ComponentName: cmpBarList
                      Properties:
                        AbbreviateAt: =1000
                        Currency: ="USD"
                        Data: |-
                          =Table(
                              {
                                  Label: If(gblLanguage = "Arabic", "مدفوع", "Paid"),
                                  Value: Sum(colPurchaseOrders, Coalesce(PaidAmount, 0)),
                                  Subtitle: If(gblLanguage = "Arabic", "المسدد على الأوامر", "Paid against orders"),
                                  Icon: "Money",
                                  Color: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "ملتزم", "Committed"),
                                  Value: Sum(colPurchaseOrders, Coalesce(Total, 0)),
                                  Subtitle: If(gblLanguage = "Arabic", "قيمة أوامر الشراء", "Purchase order value"),
                                  Icon: "Receipt",
                                  Color: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                  isHidden: false
                              }
                          )
                        EmptyMessage: =If(gblLanguage = "Arabic", "لا توجد أوامر", "No orders")
