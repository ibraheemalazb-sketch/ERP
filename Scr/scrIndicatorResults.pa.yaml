Screens:
  scrIndicatorResults:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "IndicatorResults");
        Set(varNavSelectedID, 67);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealIRForm), Set(varMealIRForm, Blank()));
        If(IsBlank(varMealIRError), Set(varMealIRError, false));
        If(IsBlank(varSelectedIndResult), Set(varSelectedIndResult, Blank()));
        If(Not(IsBlank(varSelectedProject)), Set(varMealIRProject, varSelectedProject));
        Select(btnMealIRLoad)
    Children:
      - conMealIRNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpMealIRNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conMealIRSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealIRLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealIRError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealIR,
                                If(
                                    Coalesce(varMealIRProject.ID, cmbMealIRFltProject.Selected.ID, 0) > 0,
                                    Filter(
                                        IndicatorResults,
                                        ProjectID = Coalesce(varMealIRProject.ID, cmbMealIRFltProject.Selected.ID)
                                    ),
                                    FirstN(SortByColumns(IndicatorResults, "Modified", SortOrder.Descending), 500)
                                )
                            ),
                            ClearCollect(
                                colMealIRPeriods,
                                FirstN(SortByColumns(ReportingPeriods, "StartDate", SortOrder.Descending), 200)
                            )
                        );
                        If(
                            Not(IsBlank(varSelectedIndResult)),
                            Set(varSelectedIndResult, LookUp(IndicatorResults, ID = varSelectedIndResult.ID));
                            Select(btnMealIREnrich),
                            Set(varMealIRTarget, Blank());
                            Set(varMealIRIndicator, Blank())
                        ),
                        Set(varMealIRError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل نتائج المؤشرات.", "Could not load indicator results."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealIREnrich:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {r: varSelectedIndResult},
                        If(
                            IsBlank(r),
                            Set(varMealIRTarget, Blank());
                            Set(varMealIRIndicator, Blank());
                            Set(varMealIRAch, Blank()),
                            Set(varMealIRIndicator, LookUp(Indicators, ID = Coalesce(r.IndicatorID, r.Indicator.Id)));
                            Set(
                                varMealIRTarget,
                                LookUp(
                                    IndicatorTargets,
                                    And(
                                        IndicatorID = Coalesce(r.IndicatorID, r.Indicator.Id),
                                        ReportingPeriodID = Coalesce(r.ReportingPeriodID, r.ReportingPeriod.Id)
                                    )
                                )
                            );
                            Set(
                                varMealIRAch,
                                If(
                                    Or(IsBlank(varMealIRTarget), Coalesce(varMealIRTarget.TargetValue, 0) = 0),
                                    Blank(),
                                    r.ActualValue / varMealIRTarget.TargetValue * 100
                                )
                            )
                        )
                    )
                  Text: ="Enrich"
                  Visible: =false
                  Width: =1
            - btnMealIRSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealIRForm, "") = "new",
                            ind: cmbMealIRIndicator.Selected,
                            per: cmbMealIRPeriod.Selected,
                            dis: cmbMealIRDisagg.Selected,
                            pid: Coalesce(ind.ProjectID, ind.Project.Id, varMealIRProject.ID, 0),
                            ptt: Coalesce(ind.Project.Value, LookUp(Projects, ID = Coalesce(ind.ProjectID, ind.Project.Id), Title), varMealIRProject.Title, "")
                        },
                        If(
                            Or(IsBlank(ind), IsBlank(per), IsBlank(Trim(txtMealIRActual.Text))),
                            Notify(If(ar, "المؤشر والفترة والقيمة الفعلية مطلوبة.", "Indicator, period, and actual value are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedIndResult,
                                    Patch(
                                        IndicatorResults,
                                        If(isNew, Defaults(IndicatorResults), LookUp(IndicatorResults, ID = varSelectedIndResult.ID)),
                                        {
                                            Title: Coalesce(ind.IndicatorCode, ind.Title) & " — " & Coalesce(per.Title, Text(per.ID)),
                                            Indicator: {Id: ind.ID, Value: Coalesce(ind.IndicatorCode, ind.Title)},
                                            IndicatorID: ind.ID,
                                            ReportingPeriod: {Id: per.ID, Value: Coalesce(per.Title, "")},
                                            ReportingPeriodID: per.ID,
                                            Disaggregation: If(IsBlank(dis), Blank(), {Id: dis.ID, Value: Coalesce(dis.Title, "")}),
                                            DisaggregationID: If(IsBlank(dis), Blank(), dis.ID),
                                            Project: If(pid > 0, {Id: pid, Value: ptt}, Blank()),
                                            ProjectID: If(pid > 0, pid, Blank()),
                                            ActualValue: Value(txtMealIRActual.Text),
                                            DataCollectionDate: dteMealIRCollect.SelectedDate,
                                            LocationPCode: Trim(txtMealIRLocation.Text),
                                            EvidenceUrl: Trim(txtMealIREvidence.Text),
                                            EnteredBy: {Id: varMeID, Value: varMeName},
                                            EnteredByID: varMeID,
                                            ApprovalStatus: {Value: If(isNew, "Draft", Coalesce(varSelectedIndResult.ApprovalStatus.Value, "Draft"))},
                                            VerificationStatus: {Value: If(isNew, "Unverified", Coalesce(varSelectedIndResult.VerificationStatus.Value, "Unverified"))}
                                        }
                                    )
                                );
                                fnMealLog("Indicator Result", varSelectedIndResult.ID, Coalesce(varSelectedIndResult.Title, ""), If(isNew, "Created", "Updated"), "Info", pid, Coalesce(LookUp(Projects, ID = pid, ProjectCode), ""), "ActualValue", "", txtMealIRActual.Text, "", false);
                                Set(varMealIRForm, Blank());
                                Select(btnMealIRLoad);
                                Notify(If(ar, "تم حفظ النتيجة.", "Result saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ النتيجة.", "Could not save the result."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
            - btnMealIRAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            r: varSelectedIndResult,
                            op: varMealIROp,
                            nextAppr: Switch(
                                varMealIROp,
                                "submit", "Submitted",
                                "review", "Under Review",
                                "approve", "Approved",
                                "reject", "Rejected",
                                Coalesce(varSelectedIndResult.ApprovalStatus.Value, "Draft")
                            ),
                            nextVer: Switch(
                                varMealIROp,
                                "approve", "Verified",
                                "reject", "Rejected",
                                Coalesce(varSelectedIndResult.VerificationStatus.Value, "Unverified")
                            ),
                            notifyWho: Coalesce(varSelectedIndResult.EnteredByID, varSelectedIndResult.EnteredBy.Id, 0),
                            notifyName: Coalesce(varSelectedIndResult.EnteredBy.Value, LookUp(Employees, ID = Coalesce(varSelectedIndResult.EnteredByID, varSelectedIndResult.EnteredBy.Id), FullName), "")
                        },
                        If(
                            IsBlank(r),
                            Notify(If(ar, "اختر نتيجة أولاً.", "Select a result first."), NotificationType.Warning),
                            If(
                                And(op = "reject", IsBlank(Trim(txtMealIRNote.Text))),
                                Notify(If(ar, "يرجى كتابة سبب الرفض.", "Please add a rejection note."), NotificationType.Error),
                                IfError(
                                    Set(
                                        varSelectedIndResult,
                                        Patch(
                                            IndicatorResults,
                                            LookUp(IndicatorResults, ID = r.ID),
                                            {
                                                ApprovalStatus: {Value: nextAppr},
                                                VerificationStatus: {Value: nextVer},
                                                ReviewedBy: If(Or(op = "review", op = "approve", op = "reject"), {Id: varMeID, Value: varMeName}, r.ReviewedBy),
                                                ReviewedByID: If(Or(op = "review", op = "approve", op = "reject"), varMeID, r.ReviewedByID),
                                                ReviewComments: If(IsBlank(Trim(txtMealIRNote.Text)), r.ReviewComments, Trim(txtMealIRNote.Text)),
                                                DecisionDate: If(Or(op = "approve", op = "reject"), Now(), r.DecisionDate)
                                            }
                                        )
                                    );
                                    fnMealLog("Indicator Result", r.ID, Coalesce(r.Title, ""), "Status Changed", "Info", Coalesce(r.ProjectID, 0), "", "ApprovalStatus", Coalesce(r.ApprovalStatus.Value, ""), nextAppr, Trim(txtMealIRNote.Text), false);
                                    If(
                                        And(notifyWho > 0, notifyWho <> varMeID),
                                        IfError(
                                            Patch(
                                                Notifications,
                                                Defaults(Notifications),
                                                {
                                                    Title: Left(
                                                        Switch(
                                                            op,
                                                            "submit", If(ar, "نتيجة مؤشر مقدمة للمراجعة", "Indicator result submitted for review"),
                                                            "review", If(ar, "نتيجة مؤشر قيد المراجعة", "Indicator result under review"),
                                                            "approve", If(ar, "تمت الموافقة على نتيجة المؤشر", "Indicator result approved"),
                                                            "reject", If(ar, "رُفضت نتيجة المؤشر", "Indicator result rejected"),
                                                            If(ar, "تحديث نتيجة مؤشر", "Indicator result update")
                                                        ),
                                                        255
                                                    ),
                                                    Message: Left(
                                                        Concatenate(
                                                            Coalesce(r.Title, ""),
                                                            " · ",
                                                            nextAppr,
                                                            If(IsBlank(Trim(txtMealIRNote.Text)), "", " — " & Trim(txtMealIRNote.Text))
                                                        ),
                                                        500
                                                    ),
                                                    IsRead: "No",
                                                    Createddate: Now(),
                                                    RecipientID: notifyWho,
                                                    Recipient: {Id: notifyWho, Value: notifyName},
                                                    RecipientNo: LookUp(Employees, ID = notifyWho, EmployeeNumber),
                                                    RelatedEntity: {Value: "IndicatorResult"},
                                                    RelatedItemID: r.ID,
                                                    RecordType: "IndicatorResult",
                                                    Module: {Value: "MEAL"},
                                                    Status: {Value: "Unread"},
                                                    Duration: 0,
                                                    ReadDate: Blank()
                                                }
                                            ),
                                            Trace("MealIR notify failed", TraceSeverity.Warning)
                                        )
                                    );
                                    Reset(txtMealIRNote);
                                    Select(btnMealIRLoad);
                                    Notify(If(ar, "تم تحديث حالة النتيجة.", "Result status updated."), NotificationType.Success),
                                    Notify(If(ar, "تعذر تحديث الحالة.", "Could not update status."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="Act"
                  Visible: =false
                  Width: =1
            - btnMealIRDelete:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", r: varSelectedIndResult},
                        If(
                            IsBlank(r),
                            Notify(If(ar, "اختر نتيجة أولاً.", "Select a result first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف هذه النتيجة؟", "Delete this result?") & Char(10) & Coalesce(r.Title, "")),
                                IfError(
                                    Remove(IndicatorResults, LookUp(IndicatorResults, ID = r.ID));
                                    Set(varSelectedIndResult, Blank());
                                    Set(varMealIRForm, Blank());
                                    Select(btnMealIRLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="Delete"
                  Visible: =false
                  Width: =1
      - conMealIRPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealIRPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealIRTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealIRHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealIRTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "نتائج المؤشرات", "Indicator Results")
                        Width: =200
                        Wrap: =false
                  - btnMealIRRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnMealIRLoad)
                        Text: =""
                        Width: =44
                  - btnMealIRNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSelectedIndResult, Blank());
                          Set(varMealIRForm, "new");
                          Set(varMealIRTarget, Blank());
                          Set(varMealIRAch, Blank())
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "جديد", "New"))
                        Width: =If(App.Width < 700, 44, 100)
            - lblMealIRError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealIRError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل بعض البيانات.", "Some data could not be loaded.")
                  Visible: =varMealIRError
                  Width: =Parent.Width
                  Wrap: =false
            - conMealIRBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 60
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conMealIRList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =Or(App.Width >= 700, And(IsBlank(varMealIRForm), IsBlank(varSelectedIndResult)))
                        Width: =If(App.Width < 700, Parent.Width, If(Or(Not(IsBlank(varMealIRForm)), Not(IsBlank(varSelectedIndResult))), Parent.Width - 400, Parent.Width))
                      Children:
                        - conMealIRTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 160, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =App.Width < 700
                            Children:
                              - txtMealIRSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                                    Width: =If(App.Width < 700, Parent.Width, 140)
                              - cmbMealIRFltProject:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =If(Not(IsBlank(varMealIRProject)), Filter(Projects, ID = varMealIRProject.ID), Filter(Projects, false))
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Projects
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
