Screens:
  scrProjects:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PHome");
        Set(varNavSelectedID, 21);
        Set(VSc, "VarProgrammodule");
        Set(varEditorEntity, "");
        Set(varEditorMode, "");
        Set(varReturnTab, "General");
        Set(varEditingProject, Blank());
        Set(varEditingMember, Blank());
        Set(varEditingActivity, "");
        Set(varEditingTask, "");
        Set(varEditingRisk, "");
        Set(varUserHasAllProjects, CountIf(colUserProjectAccess, AllProjects = true) > 0);
        ClearCollect(
            colUserProjectIDs,
            Filter(colUserProjectAccess, AllProjects = false).ProjectID
        );
        If(
            CountRows(colProjects) = 0,
            ClearCollect(colProjects, FirstN(SortByColumns(Projects, "StartDate", SortOrder.Descending), 500))
        );
        Clear(colProjectScope);
        If(
            varUserHasAllProjects,
            Collect(colProjectScope, colProjects),
            Collect(colProjectScope, Filter(colProjects, ID in colUserProjectIDs))
        );
        Set(gblProjectCount, CountRows(colProjects));
        Set(varAllprojects, CountRows(colProjectScope));
        Set(varActiveProjects, CountIf(colProjectScope, Status.Value = "Active"));
        Set(varAtRiskProjects, CountIf(colProjectScope, HealthStatus.Value = "At Risk"));
        Set(varCompletedProjects, CountIf(colProjectScope, Status.Value = "Completed"));
        Set(varOnTrackProjects, CountIf(colProjectScope, HealthStatus.Value = "On Track"));
        Set(varDelayedProjects, CountIf(colProjectScope, HealthStatus.Value = "Delayed"));
        Set(varPlanedProjects, CountIf(colProjectScope, Status.Value = "Planed"));
        If(IsBlank(varProjectKpiOpen), Set(varProjectKpiOpen, true));
        Clear(colProjectActivityRaw);
        If(
            Not(Coalesce(LookUp(colUserPermissions, Module.Value = "Projects").CanRead, false)),
            Clear(colProjectActivityRaw),
            Switch(
                Coalesce(varProgramScope, "Project"),
                "All",
                Collect(
                    colProjectActivityRaw,
                    FirstN(SortByColumns(ProjectActivityLog, "Date", SortOrder.Descending), 20)
                ),
                "Own",
                Collect(
                    colProjectActivityRaw,
                    FirstN(
                        SortByColumns(
                            Filter(
                                ProjectActivityLog,
                                PerformedBy.Id = Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0)
                            ),
                            "Date",
                            SortOrder.Descending
                        ),
                        20
                    )
                ),
                If(
                    varUserHasAllProjects,
                    Collect(
                        colProjectActivityRaw,
                        FirstN(SortByColumns(ProjectActivityLog, "Date", SortOrder.Descending), 20)
                    ),
                    ForAll(
                        colUserProjectIDs As access,
                        Collect(
                            colProjectActivityRaw,
                            FirstN(
                                SortByColumns(
                                    Filter(ProjectActivityLog, Project.Id = access.ProjectID),
                                    "Date",
                                    SortOrder.Descending
                                ),
                                20
                            )
                        )
                    );
                    If(
                        And(CountRows(colProjectActivityRaw) = 0, !IsBlank(gblSProject.ID)),
                        Collect(
                            colProjectActivityRaw,
                            FirstN(
                                SortByColumns(
                                    Filter(ProjectActivityLog, Project.Id = gblSProject.ID),
                                    "Date",
                                    SortOrder.Descending
                                ),
                                20
                            )
                        )
                    )
                )
            )
        );
        Clear(colProjectActivityFeed);
        ForAll(
            FirstN(
                SortByColumns(colProjectActivityRaw, "Date", SortOrder.Descending),
                20
            ) As log,
            Collect(
                colProjectActivityFeed,
                {
                    ID: log.ID,
                    Module: "Projects",
                    ActivityType: log.RelatedEntity.Value,
                    Action: log.ActionType.Value,
                    Title: Coalesce(log.RelatedEntity.Value, "") & " · " & Coalesce(log.ActionType.Value, ""),
                    Description: Coalesce(log.Details, ""),
                    ActorName: Coalesce(log.PerformedBy.Value, ""),
                    ActivityDate: Coalesce(log.Date, log.Created),
                    RecordType: Coalesce(log.RelatedEntity.Value, ""),
                    RecordID: Coalesce(log.RelatedItemId, 0),
                    Status: Coalesce(log.ActionType.Value, ""),
                    Icon: Switch(
                        log.RelatedEntity.Value,
                        "Task", "Grid",
                        "Activity", "Activity",
                        "Risk", "Warning",
                        "Member", "Users",
                        "Project", "Box",
                        "Activity"
                    ),
                    ProjectId: log.Project.Id
                }
            )
        )
    Children:
      - cmpProjectTopBar:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            Y: =0
            ActionsVisible: =true
            BadgeColor: =
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            FontSizeTitle: =
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            HoverText: =
            IconColor: =
            IconSvg: =
            ModuleIcon: ="Layers"
            ModuleName: =If(gblLanguage = "Arabic", "الرئيسية", "Home")
            OnSearch: =
            OnSelect: =
            OnSelectSubtitle: =
            OnSelectTitle: =Navigate(ScrHome, ScreenTransition.None)
            ScreenSubtitle: =If(gblLanguage = "Arabic", "البرامج", "Programs")
            ScreenTitle: =If(gblLanguage = "Arabic", "البرامج", "Programs")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =true
            ShowTheme: =true
            ShowUser: =true
            Size: =
            SubTitleWidth: =
            Theme: =gblTheme.Mode
            TitleWidth: =
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
      - cmpProjectPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            SelectedID: =20
            Visible: =App.Width < 700
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
      - conProjectPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - cmpProjectTopBar.Height - If(App.Width < 700, cmpProjectPhoneNav.Height, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =12
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =8
            Width: =Parent.Width
            Y: =cmpProjectTopBar.Height
          Children:
            - btnProjectKpi:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        varProjectKpiOpen,
                        If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                        If(gblLanguage = "Arabic", "إظهار المؤشرات", "Show KPIs")
                    )
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Outline
                  BasePaletteColor: =fxThemeColor("Primary")
                  Height: =32
                  Icon: =If(varProjectKpiOpen, "ChevronUp", "ChevronDown")
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Set(varProjectKpiOpen, !varProjectKpiOpen)
                  Text: |-
                    =If(
                        varProjectKpiOpen,
                        If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                        If(gblLanguage = "Arabic", "إظهار المؤشرات", "Show KPIs")
                    )
                  Visible: =App.Width < 700
                  Width: =Parent.Width
            - cmpProjectKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AnimationEffect: ="pop"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 5,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "Box",
                            Value: varAllprojects,
                            Label: If(gblLanguage = "Arabic", "إجمالي المشاريع", "Total Projects"),
                            Subtitle: If(gblLanguage = "Arabic", "ضمن صلاحيتك", "In your scope"),
                            Screen: "Projects",
                            IconBg: If(gblTheme.Mode = "Dark", "#172030", "#ECF2FF"),
                            IconColor: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Activity",
                            Value: varActiveProjects,
                            Label: If(gblLanguage = "Arabic", "المشاريع النشطة", "Active Projects"),
                            Subtitle: If(varAllprojects = 0, "0", Text(Round(varActiveProjects / varAllprojects * 100, 0), "0")) & If(gblLanguage = "Arabic", "% من الإجمالي", "% of all projects"),
                            Screen: "",
                            IconBg: If(gblTheme.Mode = "Dark", "#164E63", "#ECFEFF"),
                            IconColor: If(gblTheme.Mode = "Dark", "#22D3EE", "#0E7490"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Target",
                            Value: varOnTrackProjects,
                            Label: If(gblLanguage = "Arabic", "على المسار", "On Track"),
                            Subtitle: If(varAllprojects = 0, "0", Text(Round(varOnTrackProjects / varAllprojects * 100, 0), "0")) & If(gblLanguage = "Arabic", "% من الإجمالي", "% of all projects"),
                            Screen: "",
                            IconBg: If(gblTheme.Mode = "Dark", "#14532D", "#F0FDF4"),
                            IconColor: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Warning",
                            Value: varAtRiskProjects,
                            Label: If(gblLanguage = "Arabic", "معرضة للخطر", "At Risk"),
                            Subtitle: If(varAllprojects = 0, "0", Text(Round(varAtRiskProjects / varAllprojects * 100, 0), "0")) & If(gblLanguage = "Arabic", "% من الإجمالي", "% of all projects"),
                            Screen: "",
                            IconBg: If(gblTheme.Mode = "Dark", "#5C400E", "#FFFBEB"),
                            IconColor: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 5,
                            Icon: "Package",
                            Value: varCompletedProjects,
                            Label: If(gblLanguage = "Arabic", "مكتملة", "Completed"),
                            Subtitle: If(varAllprojects = 0, "0", Text(Round(varCompletedProjects / varAllprojects * 100, 0), "0")) & If(gblLanguage = "Arabic", "% من الإجمالي", "% of all projects"),
                            Screen: "",
                            IconBg: If(gblTheme.Mode = "Dark", "#2E1065", "#F5F3FF"),
                            IconColor: If(gblTheme.Mode = "Dark", "#C4B5FD", "#6D28D9"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FontsSizesTitle: =12
                  Height: |-
                    =If(
                        Or(App.Width >= 700, varProjectKpiOpen),
                        With(
                            {cols: If(Parent.Width < 640, 1, If(Parent.Width < 1024, 2, 5))},
                            RoundUp(5 / cols, 0) * 108
                        ),
                        0
                    )
                  Visible: =Or(App.Width >= 700, varProjectKpiOpen)
                  Icons: |-
                    =Table({Name: "Box", SVG: ""})
                  IconsSize: =30
                  IsLoading: =false
                  KPINav: =If(varClickScreen = "Projects", Navigate(ScrAllProjects, ScreenTransition.Cover))
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: =
                  Style: ="Compact"
                  StyleConfig: =
                  SubtitleFS: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
            - conProjectOverview:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 460 + 12 + 360 + 12 + 220, 400)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - conProjectHealth:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =If(App.Width < 700, 460, Parent.Height)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                      Children:
                        - lblProjectHealth:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.Body
                              Text: =If(gblLanguage = "Arabic", "المشاريع حسب الحالة الصحية", "Projects by Health")
                              Width: =Parent.Width
                        - cmpProjectHealthChart:
                            Control: CanvasComponent
                            ComponentName: cmpPieChart
                            Properties:
                              Animate: =
                              AnimationDuration: =
                              ChartData: |-
                                =Table(
                                    {
                                        Label: If(gblLanguage = "Arabic", "على المسار", "On Track"),
                                        Value: varOnTrackProjects,
                                        Color: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A")
                                    },
                                    {
                                        Label: If(gblLanguage = "Arabic", "معرضة للخطر", "At Risk"),
                                        Value: varAtRiskProjects,
                                        Color: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706")
                                    },
                                    {
                                        Label: If(gblLanguage = "Arabic", "متأخرة", "Delayed"),
                                        Value: varDelayedProjects,
                                        Color: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626")
                                    }
                                )
                              ChartTitle: =If(gblLanguage = "Arabic", "المشاريع حسب الحالة الصحية", "Projects by Health")
                              DefaultColors: =
                              DonutMode: =true
                              DonutThickness: =0.24
                              FillPortions: =1
                              Height: =400
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowLabels: =false
                              ShowLegend: =true
                              ShowPercentages: =true
                              ShowTitle: =false
                              ShowValues: =true
                              Theme: =gblTheme.Mode
                              Width: =Parent.Width
                  - cmpProjectSectors:
                      Control: CanvasComponent
                      ComponentName: cmpBarList
                      Properties:
                        AbbreviateAt: =
                        Currency: =
                        Data: |-
                          =ForAll(
                              Distinct(colProjectScope, Sector.Value) As sector,
                              {
                                  Label: If(
                                      IsBlank(sector.Value),
                                      If(gblLanguage = "Arabic", "بدون قطاع", "No sector"),
                                      sector.Value
                                  ),
                                  Value: If(
                                      IsBlank(sector.Value),
                                      CountIf(colProjectScope, IsBlank(Sector.Value)),
                                      CountRows(Filter(colProjectScope, Sector.Value = sector.Value))
                                  ),
                                  Subtitle: If(gblLanguage = "Arabic", "مشروع", "Projects"),
                                  Icon: "Flag",
                                  Color: "",
                                  isHidden: false
                              }
                          )
                        EmptyMessage: =If(gblLanguage = "Arabic", "لا توجد مشاريع", "No projects")
                        Height: =If(App.Width < 700, 360, Parent.Height)
                        IsLoading: =false
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnBarClick: =
                        Palette: =
                        ShowRowSubtitle: =false
                        Subtitle: =If(gblLanguage = "Arabic", "عدد المشاريع", "Project count")
                        Theme: =gblTheme.Mode
                        Title: =If(gblLanguage = "Arabic", "المشاريع حسب القطاع", "Projects by Sector")
                        ValueFormat: ="Number"
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
                  - cmpProjectBudgetSpent:
                      Control: CanvasComponent
                      ComponentName: cmpBarList
                      Properties:
                        AbbreviateAt: =10000
                        Currency: ="USD"
                        Data: |-
                          =Table(
                              {
                                  Label: If(gblLanguage = "Arabic", "الميزانية", "Budget"),
                                  Value: Sum(colProjectScope, Budget),
                                  Subtitle: If(gblLanguage = "Arabic", "إجمالي الميزانية", "Total budget"),
                                  Icon: "Wallet",
                                  Color: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                  isHidden: false
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "المنصرف", "Spent"),
                                  Value: Sum(colProjectScope, Spent),
                                  Subtitle: If(gblLanguage = "Arabic", "إجمالي المنصرف", "Total spent"),
                                  Icon: "Money",
                                  Color: If(gblTheme.Mode = "Dark", "#FB923C", "#C2410C"),
                                  isHidden: false
                              }
                          )
                        EmptyMessage: =If(gblLanguage = "Arabic", "لا توجد أرقام", "No figures")
                        Height: =If(App.Width < 700, 220, Parent.Height)
                        IsLoading: =false
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnBarClick: =
                        Palette: =
                        ShowRowSubtitle: =true
                        Subtitle: =If(gblLanguage = "Arabic", "ضمن صلاحيتك", "In your scope")
                        Theme: =gblTheme.Mode
                        Title: =If(gblLanguage = "Arabic", "الميزانية والمنصرف", "Budget and Spent")
                        ValueFormat: ="Currency"
                        Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 3)
            - conProjectLower:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 360, 380)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - cmpProjectActivity:
                      Control: CanvasComponent
                      ComponentName: cmpLastActivities
                      Properties:
                        Height: =Parent.Height
                        Items: |-
                          =ForAll(
                              colProjectActivityFeed As row,
                              {
                                  ID: row.ID,
                                  Title: Coalesce(row.Title, ""),
                                  Action: Coalesce(row.Action, ""),
                                  EntityType: Coalesce(row.RecordType, ""),
                                  EntityNumber: "",
                                  ProjectCode: "",
                                  ActorName: Coalesce(row.ActorName, ""),
                                  ActivityDate: row.ActivityDate,
                                  Severity: Coalesce(row.Status, "Info"),
                                  Icon: Coalesce(row.Icon, "Activity"),
                                  Details: Coalesce(row.Description, ""),
                                  Amount: 0,
                                  Currency: "",
                                  RecordID: Coalesce(row.RecordID, 0),
                                  RecordType: Coalesce(row.RecordType, ""),
                                  ProjectId: Coalesce(row.ProjectId, 0),
                                  IsSensitive: false
                              }
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxItems: =20
                        OnSelect: |-
                          =With(
                              {row: cmpProjectActivity.SelectedActivity},
                              Set(varSelectedProject, LookUp(colProjects, ID = row.ProjectId));
                              Set(varSelectedTask, Blank());
                              Set(varSelectedActivity, Blank());
                              Set(varSelectedRisk, Blank());
                              Set(varSelectedMember, Blank());
                              Set(
                                  varProjectTab,
                                  Switch(
                                      row.RecordType,
                                      "Task", "Tasks",
                                      "Activity", "Activities",
                                      "Risk", "Risks",
                                      "Member", "Members",
                                      "General"
                                  )
                              );
                              Switch(
                                  row.RecordType,
                                  "Task", Set(varSelectedTask, LookUp(ProjectsTasks, ID = row.RecordID)),
                                  "Activity", Set(varSelectedActivity, LookUp(ProjectsActivities, ID = row.RecordID)),
                                  "Risk", Set(varSelectedRisk, LookUp(Risks, ID = row.RecordID)),
                                  "Member", Set(varSelectedMember, LookUp(ProjectMembers, ID = row.RecordID))
                              );
                              Navigate(ScrAllProjects, ScreenTransition.Cover, {varShowDetails: true})
                          )
                        OnViewAll: =Navigate(scrActivities, ScreenTransition.Cover)
                        Refresh: |-
                          =Refresh(ProjectActivityLog);
                          Clear(colProjectActivityRaw);
                          If(
                              Not(Coalesce(LookUp(colUserPermissions, Module.Value = "Projects").CanRead, false)),
                              Clear(colProjectActivityRaw),
                              Switch(
                                  Coalesce(varProgramScope, "Project"),
                                  "All",
                                  Collect(
                                      colProjectActivityRaw,
                                      FirstN(SortByColumns(ProjectActivityLog, "Date", SortOrder.Descending), 20)
                                  ),
                                  "Own",
                                  Collect(
                                      colProjectActivityRaw,
                                      FirstN(
                                          SortByColumns(
                                              Filter(
                                                  ProjectActivityLog,
                                                  PerformedBy.Id = Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0)
                                              ),
                                              "Date",
                                              SortOrder.Descending
                                          ),
                                          20
                                      )
                                  ),
                                  If(
                                      varUserHasAllProjects,
                                      Collect(
                                          colProjectActivityRaw,
                                          FirstN(SortByColumns(ProjectActivityLog, "Date", SortOrder.Descending), 20)
                                      ),
                                      ForAll(
                                          colUserProjectIDs As access,
                                          Collect(
                                              colProjectActivityRaw,
                                              FirstN(
                                                  SortByColumns(
                                                      Filter(ProjectActivityLog, Project.Id = access.ProjectID),
                                                      "Date",
                                                      SortOrder.Descending
                                                  ),
                                                  20
                                              )
                                          )
                                      );
                                      If(
                                          And(CountRows(colProjectActivityRaw) = 0, !IsBlank(gblSProject.ID)),
                                          Collect(
                                              colProjectActivityRaw,
                                              FirstN(
                                                  SortByColumns(
                                                      Filter(ProjectActivityLog, Project.Id = gblSProject.ID),
                                                      "Date",
                                                      SortOrder.Descending
                                                  ),
                                                  20
                                              )
                                          )
                                      )
                                  )
                              )
                          );
                          Clear(colProjectActivityFeed);
                          ForAll(
                              FirstN(SortByColumns(colProjectActivityRaw, "Date", SortOrder.Descending), 20) As log,
                              Collect(
                                  colProjectActivityFeed,
                                  {
                                      ID: log.ID,
                                      Module: "Projects",
                                      ActivityType: log.RelatedEntity.Value,
                                      Action: log.ActionType.Value,
                                      Title: Coalesce(log.RelatedEntity.Value, "") & " · " & Coalesce(log.ActionType.Value, ""),
                                      Description: Coalesce(log.Details, ""),
                                      ActorName: Coalesce(log.PerformedBy.Value, ""),
                                      ActivityDate: Coalesce(log.Date, log.Created),
                                      RecordType: Coalesce(log.RelatedEntity.Value, ""),
                                      RecordID: Coalesce(log.RelatedItemId, 0),
                                      Status: Coalesce(log.ActionType.Value, ""),
                                      Icon: Switch(
                                          log.RelatedEntity.Value,
                                          "Task", "Grid",
                                          "Activity", "Activity",
                                          "Risk", "Warning",
                                          "Member", "Users",
                                          "Project", "Box",
                                          "Activity"
                                      ),
                                      ProjectId: log.Project.Id
                                  }
                              )
                          )
                        ShowSummary: =true
                        ShowViewAll: =true
                        Title: =If(gblLanguage = "Arabic", "الأنشطة الأخيرة", "Recent Activities")
                        Width: =Parent.Width
            - lblProjectSections:
                Control: ModernText@1.0.0
                Properties:
