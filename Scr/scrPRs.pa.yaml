                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الإجمالي", "Total")
                        HeaderTitle: =If(gblLanguage = "Arabic", "رقم الطلب", "PR number")
                        HeaderWhen: =If(gblLanguage = "Arabic", "التاريخ المطلوب", "Required date")
                        Height: =Max(420, App.Height - cmpPrTop.Height - If(App.Width < 700, cmpPrPhone.Height, 0) - 240)
                        Items: |-
                          =ForAll(
                              Filter(
                                  colPurchaseRequests,
                                  And(
                                      Or(IsBlank(varPrStatus), varPrStatus = "All", Status.Value = varPrStatus),
                                      Or(Coalesce(varPrProjectID, 0) = 0, ProjectID = varPrProjectID),
                                      Or(Not(Coalesce(varPrMine, false)), RequesterID = gblCurrentEmployee.ID),
                                      Or(Or(IsBlank(varPrRequester), varPrRequester = "All"), Requester.Value = varPrRequester),
                                      Or(Or(IsBlank(varPrApprover), varPrApprover = "All"), CountRows(Filter(colPrApprovals, And(RequestNumber = PRNumber, Approver.Value = varPrApprover))) > 0),
                                      Or(Or(IsBlank(varPrPriority), varPrPriority = "All"), Priority.Value = varPrPriority),
                                      Or(
                                          IsBlank(Trim(txtPrSearch.Text)),
                                          Trim(txtPrSearch.Text) in Coalesce(PRNumber, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(ReasonRequired, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(Requester.Value, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(Project.Value, "")
                                      )
                                  )
                              ) As req,
                              {
                                  RowKey: Text(req.ID),
                                  Title: Coalesce(req.PRNumber, "-"),
                                  Subtitle: Concatenate(Text(Coalesce(req.TotalAmount, 0), "#,##0.00"), " $"),
                                  Column1: If(IsBlank(req.RequestDate), "-", Text(req.RequestDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(req.Project.Value, "-"),
                                  Column3: "",
                                  Status: Coalesce(req.Status.Value, "-"),
                                  Tone: Switch(
                                      req.Status.Value,
                                      "Approved", "approved",
                                      "Completed", "completed",
                                      "Rejected", "rejected",
                                      "Cancelled", "danger",
                                      "Submitted", "in progress",
                                      "PO Created", "info",
                                      "POcreated", "info",
                                      "pending"
                                  ),
                                  Priority: Coalesce(req.Priority.Value, "-"),
                                  PriorityTone: Switch(req.Priority.Value, "High", "high", "Low", "low", "medium"),
                                  Person: Coalesce(req.Requester.Value, "-"),
                                  WhenText: If(IsBlank(req.RequiredDate), "-", Text(req.RequiredDate, "dd-mmm-yyyy")),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: "FileText"
                              }
                          )
                        LayoutMinHeight: =360
                        LayoutMinWidth: =320
                        OnMenuItemSelect: |-
                          =With(
                              {row: LookUp(colPurchaseRequests, ID = Value(cmpPrTable.SelectedItem.RowKey))},
                              Switch(
                                  cmpPrTable.SelectedMenuItem.ItemKey,
                                  "view", Set(varPrQuick, row),
                                  "edit",
                                  Set(varCurrentPR, row);
                                  Set(varProcurementEntity, "PurchaseRequest");
                                  Set(varProcurementMode, "Edit");
                                  Set(varPrPane, "Details");
                                  Set(varPrQuick, Blank());
                                  Navigate(scrPREditor, ScreenTransition.Cover)
                              )
                          );
                          ClearCollect(
                              colPrQuickFacts,
                              {Label: If(gblLanguage = "Arabic", "المشروع", "Project"), Icon: "Folder", Value: Coalesce(varPrQuick.Project.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "مقدم الطلب", "Requester"), Icon: "User", Value: Coalesce(varPrQuick.Requester.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "تاريخ الطلب", "Requested"), Icon: "Calendar", Value: If(IsBlank(varPrQuick.RequestDate), "-", Text(varPrQuick.RequestDate, "dd mmm yyyy"))},
                              {Label: If(gblLanguage = "Arabic", "تاريخ الاحتياج", "Required"), Icon: "Clock", Value: If(IsBlank(varPrQuick.RequiredDate), "-", Text(varPrQuick.RequiredDate, "dd mmm yyyy"))},
                              {Label: If(gblLanguage = "Arabic", "الأولوية", "Priority"), Icon: "Flag", Value: Coalesce(varPrQuick.Priority.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "الإجمالي", "Total"), Icon: "Money", Value: Text(Coalesce(varPrQuick.TotalAmount, 0), "#,##0.00") & " $"}
                          )
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colPurchaseRequests, ID = Value(cmpPrTable.SelectedItem.RowKey))},
                              If(
                                  varPrQuick.ID = row.ID,
                                  Set(varPrQuick, Blank()),
                                  Set(varPrQuick, row)
                              )
                          );
                          ClearCollect(
                              colPrQuickFacts,
                              {Label: If(gblLanguage = "Arabic", "المشروع", "Project"), Icon: "Folder", Value: Coalesce(varPrQuick.Project.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "مقدم الطلب", "Requester"), Icon: "User", Value: Coalesce(varPrQuick.Requester.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "تاريخ الطلب", "Requested"), Icon: "Calendar", Value: If(IsBlank(varPrQuick.RequestDate), "-", Text(varPrQuick.RequestDate, "dd mmm yyyy"))},
                              {Label: If(gblLanguage = "Arabic", "تاريخ الاحتياج", "Required"), Icon: "Clock", Value: If(IsBlank(varPrQuick.RequiredDate), "-", Text(varPrQuick.RequiredDate, "dd mmm yyyy"))},
                              {Label: If(gblLanguage = "Arabic", "الأولوية", "Priority"), Icon: "Flag", Value: Coalesce(varPrQuick.Priority.Value, "-")},
                              {Label: If(gblLanguage = "Arabic", "الإجمالي", "Total"), Icon: "Money", Value: Text(Coalesce(varPrQuick.TotalAmount, 0), "#,##0.00") & " $"}
                          )
                        OnViewChange: =
                        PersonAsAvatar: =
                        RowHeight: =52
                        ShowAction: =true
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =false
                        ShowHeader: =true
