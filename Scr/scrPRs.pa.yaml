Screens:
  scrPRs:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "PRs");
        Set(varNavSelectedID, 32);
        Set(varProcurementEntity, "PurchaseRequest");
        Set(varProcurementMode, "View");
        Set(varPrQuick, Blank());
        Set(varPrMenuId, 0);
        Set(varPrFilters, false);
        Set(varPrView, If(App.Width < 700, "list", "table"));
        Set(varPrMine, false);
        Set(varPrPane, "Details");
        Reset(cmpPrView);
        Reset(cmpPrTable);
        Reset(cmpPrNew);
        Reset(cmpPrStep);
        If(IsBlank(varPrStatus), Set(varPrStatus, "All"));
        If(IsBlank(varPrProjectID), Set(varPrProjectID, 0));
        If(IsBlank(varPrRequester), Set(varPrRequester, "All"));
        If(IsBlank(varPrApprover), Set(varPrApprover, "All"));
        If(IsBlank(varPrPriority), Set(varPrPriority, "All"));
        Set(varPrMailOpen, false);
        Set(varPrMailBusy, false);
        UpdateContext({locPrHistTop: 50});
        Reset(cmpPrHistory);
        Select(btnPrReload)
    Children:
      - conPrReload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =1
            Width: =1
            X: =0
            Y: =0
          Children:
            - btnPrReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        If(
                            varProcurementScope = "Own",
                            ClearCollect(
                                colPurchaseRequests,
                                FirstN(
                                    SortByColumns(
                                        Filter(
                                            PurchaseRequests,
                                            And(
                                                ProjectID = gblUser.ProjectID,
                                                Or(
                                                    RequesterID = gblCurrentEmployee.ID,
                                                    ReceivedByID = gblCurrentEmployee.ID
                                                )
                                            )
                                        ),
                                        "ID",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            If(
                                varProcurementScope = "Project",
                                ClearCollect(
                                    colPurchaseRequests,
                                    Filter(
                                        FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500),
                                        Project.Value in colProjects.ProjectCode
                                    )
                                ),
                                ClearCollect(
                                    colPurchaseRequests,
                                    FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500)
                                )
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل طلبات الشراء.", "Purchase requests could not be loaded."),
                            NotificationType.Error
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPurchaseRequestLines,
                            Filter(
                                FirstN(SortByColumns(PurchaseRequestLines, "ID", SortOrder.Descending), 500),
                                PR.Id in colPurchaseRequests.ID
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل بنود الطلب.", "Request lines could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        If(
                            varProcurementScope = "Own",
                            ClearCollect(
                                colPurchaseOrders,
                                FirstN(
                                    SortByColumns(
                                        Filter(
                                            PurchaseOrders,
                                            And(
                                                ProjectID = gblUser.ProjectID,
                                                Or(
                                                    PreparedByID = gblCurrentEmployee.ID,
                                                    ApprovedByID = gblCurrentEmployee.ID
                                                )
                                            )
                                        ),
                                        "ID",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            ClearCollect(
                                colPurchaseOrders,
                                FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500)
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل أوامر الشراء.", "Purchase orders could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPrApprovals,
                            Filter(
                                FirstN(SortByColumns(ApprovalHistory, "ID", SortOrder.Descending), 500),
                                RequestType.Value = "Purchase Request"
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل مسار الاعتماد.", "Approval history could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colProcPeople,
                            ForAll(
                                FirstN(
                                    SortByColumns(
                                        Filter(Employees, Status.Value = "Active"),
                                        "FullName",
                                        SortOrder.Ascending
                                    ),
                                    200
                                ),
                                {
                                    ID: ID,
                                    FullName: FullName,
                                    Email: Email,
                                    EmployeeNumber: Coalesce(EmployeeNumber, "")
                                }
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل الموظفين.", "People could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    With(
                        {row: LookUp(colPurchaseRequests, ID = varCurrentPR.ID)},
                        If(
                            Not(IsBlank(row)),
                            Set(varCurrentPR, row);
                            UpdateContext({locPrHistTop: 50});
                            Reset(cmpPrHistory)
                        )
                    )
                  Text: ="Reload"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
      - conPrNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpPrNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpPrTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            ModuleIcon: ="ShoppingCart"
            ModuleName: =If(gblLanguage = "Arabic", "المشتريات", "Procurement")
            OnSelectTitle: |-
              =Set(varProcurementTab, "Main");
              Set(varNavSelectedID, 31);
              Navigate(scrProcurement, ScreenTransition.None)
            ScreenSubtitle: =If(gblLanguage = "Arabic", "المشتريات", "Procurement")
            ScreenTitle: =If(gblLanguage = "Arabic", "طلبات الشراء", "Purchase requests")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =true
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPrPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conPrPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpPrPhone.Height, 0) + If(IsBlank(varCurrentPR), 80, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 16)
            PaddingRight: =16
            PaddingTop: =cmpPrTop.Height + 12
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conPrList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsBlank(varCurrentPR)
                  Width: =Parent.Width
                Children:
                  - conPrHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conPrTitles:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Start
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - lblPrTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Bold
                                    Height: =24
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =If(gblLanguage = "Arabic", "كل طلبات الشراء", "All purchase requests")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblPrCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.BodySmall
                                    Text: |-
                                      =Concatenate(
                                          Text(
                                              CountRows(
                                                  Filter(
                                                      colPurchaseRequests,
                                                      And(
                                                          Or(IsBlank(varPrStatus), varPrStatus = "All", Status.Value = varPrStatus),
                                                          Or(Coalesce(varPrProjectID, 0) = 0, ProjectID = varPrProjectID),
                                                          Or(Not(Coalesce(varPrMine, false)), RequesterID = gblCurrentEmployee.ID),
                                                          Or(Or(IsBlank(varPrRequester), varPrRequester = "All"), Requester.Value = varPrRequester),
                                                          Or(Or(IsBlank(varPrApprover), varPrApprover = "All"), CountRows(Filter(colPrApprovals, And(RequestNumber = PRNumber, Approver.Value = varPrApprover))) > 0),
                                                          Or(Or(IsBlank(varPrPriority), varPrPriority = "All"), Priority.Value = varPrPriority),
                                                          Or(
                                                              IsBlank(Trim(txtPrSearch.Text)),
                                                              Trim(txtPrSearch.Text) in Coalesce(PRNumber, ""),
                                                              Trim(txtPrSearch.Text) in Coalesce(ReasonRequired, ""),
                                                              Trim(txtPrSearch.Text) in Coalesce(Requester.Value, ""),
                                                              Trim(txtPrSearch.Text) in Coalesce(Project.Value, "")
                                                          )
                                                      )
                                                  )
                                              )
                                          ),
                                          If(gblLanguage = "Arabic", " من ", " of "),
                                          Text(CountRows(colPurchaseRequests)),
                                          If(gblLanguage = "Arabic", " طلب", " requests")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - btnPrNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Primary
                              FillPortions: =0
                              Height: =36
                              Icon: ="Add"
                              LayoutMinWidth: =140
                              OnSelect: |-
                                =Set(varProcurementEntity, "PurchaseRequest");
                                Set(varProcurementMode, "New");
                                Set(varCurrentPR, Blank());
                                Set(varPrQuick, Blank());
                                Set(varPrPane, "Details");
                                Navigate(scrPREditor, ScreenTransition.Cover)
                              Text: =If(gblLanguage = "Arabic", "طلب شراء", "Purchase request")
                              Visible: =App.Width >= 700
                              Width: =160
                  - conPrTools:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 96, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =App.Width < 700
                        Width: =Parent.Width
                      Children:
                        - txtPrSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في طلبات الشراء", "Search purchase requests")
                              FillPortions: =0
                              Height: =40
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "ابحث في الطلبات", "Search requests...")
                              Width: =If(App.Width < 700, Max(160, Parent.Width - 56), Max(200, Parent.Width - 378))
                        - btnPrFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varPrFilters, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              FillPortions: =0
                              Height: =40
                              Icon: ="Filter"
                              OnSelect: =Set(varPrFilters, Not(varPrFilters))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                              Width: =If(App.Width < 700, 44, 110)
                        - btnPrRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              FillPortions: =0
                              Height: =40
                              Icon: ="ArrowSync"
                              OnSelect: =Select(btnPrReload)
                              Text: =""
                              Tooltip: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Width: =44
                        - cmpPrView:
                            Control: CanvasComponent
                            ComponentName: cmpSegmentedControl
                            Properties:
                              DefaultValue: =varPrView
                              DisplayMode: ="Both"
                              EqualWidth: =true
                              Height: =40
                              IconPosition: ="Left"
                              OnChange: =Set(varPrView, cmpPrView.SelectedValue)
                              Options: |-
                                =Table(
                                    {Value: "table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                    {Value: "list", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                )
                              Size: ="Medium"
                              Visible: =App.Width >= 700
                              Width: =188

                  - conPrFilterRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 300, 96)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        LayoutWrap: =App.Width >= 700
                        Visible: =Or(App.Width >= 700, varPrFilters)
                        Width: =Parent.Width
                      Children:
                        - cmbPrProject:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              DefaultSelectedItems: |-
                                =If(
                                    Coalesce(varPrProjectID, 0) = 0,
                                    Filter(colProjects, false),
                                    Filter(colProjects, ID = varPrProjectID)
                                )
                              FillPortions: =0
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                              IsSearchable: =true
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =colProjects
                              LayoutMinWidth: =160
                              OnChange: |-
                                =If(
                                    And(
                                        IsBlank(Self.Selected.ID),
                                        Not(Coalesce(LookUp(colUserPermissions, Module.Value = "Procurement").CanViewAll, true))
                                    ),
                                    Reset(cmbPrProject),
                                    Set(varPrProjectID, Coalesce(Self.Selected.ID, 0))
                                )
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbPrStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              DefaultSelectedItems: |-
                                =Table({K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")})
                              FillPortions: =0
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All statuses")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.L
                              Items: |-
                                =Table(
                                    {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {K: "Draft", L: If(gblLanguage = "Arabic", "مسودة", "Draft")},
                                    {K: "Submitted", L: If(gblLanguage = "Arabic", "مقدم", "Submitted")},
                                    {K: "PendingApproval", L: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending approval")},
                                    {K: "Approved", L: If(gblLanguage = "Arabic", "معتمد", "Approved")},
                                    {K: "Rejected", L: If(gblLanguage = "Arabic", "مرفوض", "Rejected")},
                                    {K: "PO Created", L: If(gblLanguage = "Arabic", "تم إنشاء أمر الشراء", "PO created")},
                                    {K: "Completed", L: If(gblLanguage = "Arabic", "مكتمل", "Completed")},
                                    {K: "Cancelled", L: If(gblLanguage = "Arabic", "ملغي", "Cancelled")}
                                )
                              LayoutMinWidth: =160
                              OnChange: =Set(varPrStatus, Coalesce(Self.Selected.K, "All"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbPrRequester:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مقدم الطلب", "Requester")
                              DefaultSelectedItems: =Filter(colProcPeople, And(varPrRequester <> "All", FullName = varPrRequester))
                              FillPortions: =0
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل مقدمي الطلبات", "All requesters")
                              IsSearchable: =true
                              ItemDisplayText: =ThisItem.FullName
                              Items: =colProcPeople
                              LayoutMinWidth: =160
                              OnChange: =Set(varPrRequester, Coalesce(Self.Selected.FullName, "All"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbPrApprover:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المعتمد", "Approver")
                              DefaultSelectedItems: =Filter(colProcPeople, And(varPrApprover <> "All", FullName = varPrApprover))
                              FillPortions: =0
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المعتمدين", "All approvers")
                              IsSearchable: =true
                              ItemDisplayText: =ThisItem.FullName
                              Items: =colProcPeople
                              LayoutMinWidth: =160
                              OnChange: =Set(varPrApprover, Coalesce(Self.Selected.FullName, "All"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbPrPriority:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                              DefaultSelectedItems: |-
                                =Filter(
                                    Table(
                                        {K: "All", L: If(gblLanguage = "Arabic", "كل الأولويات", "All priorities")},
                                        {K: "High", L: If(gblLanguage = "Arabic", "عالية", "High")},
                                        {K: "Medium", L: If(gblLanguage = "Arabic", "متوسطة", "Medium")},
                                        {K: "Low", L: If(gblLanguage = "Arabic", "منخفضة", "Low")}
                                    ),
                                    K = Coalesce(varPrPriority, "All")
                                )
                              FillPortions: =0
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الأولويات", "All priorities")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.L
                              Items: |-
                                =Table(
                                    {K: "All", L: If(gblLanguage = "Arabic", "كل الأولويات", "All priorities")},
                                    {K: "High", L: If(gblLanguage = "Arabic", "عالية", "High")},
                                    {K: "Medium", L: If(gblLanguage = "Arabic", "متوسطة", "Medium")},
                                    {K: "Low", L: If(gblLanguage = "Arabic", "منخفضة", "Low")}
                                )
                              LayoutMinWidth: =140
                              OnChange: =Set(varPrPriority, Coalesce(Self.Selected.K, "All"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 160)
                        - btnPrClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              FillPortions: =0
                              Height: =40
                              Icon: ="Dismiss"
                              OnSelect: |-
                                =Reset(txtPrSearch);
                                Reset(cmbPrStatus);
                                Reset(cmbPrProject);
                                Reset(cmbPrRequester);
                                Reset(cmbPrApprover);
                                Reset(cmbPrPriority);
                                Set(varPrStatus, "All");
                                Set(varPrProjectID, 0);
                                Set(varPrRequester, "All");
                                Set(varPrApprover, "All");
                                Set(varPrPriority, "All");
