                                      =With(
                                          {
                                              named: Filter(
                                                  Table(
                                                      {UserID: Coalesce(varCurrentPR.RequesterID, 0), UserName: Coalesce(varCurrentPR.Requester.Value, "")},
                                                      {UserID: Coalesce(varCurrentPR.SupervisorID, 0), UserName: Coalesce(varCurrentPR.Supervisor.Value, "")},
                                                      {UserID: Coalesce(varCurrentPR.ApproverID, 0), UserName: Coalesce(varCurrentPR.Approver.Value, "")},
                                                      {UserID: Coalesce(varCurrentPR.FinancialApproverID, 0), UserName: Coalesce(varCurrentPR.FinancialApprover.Value, "")},
                                                      {UserID: Coalesce(varCurrentPR.ReceivedByID, 0), UserName: Coalesce(varCurrentPR.ReceivedBy.Value, "")}
                                                  ),
                                                  UserID > 0
                                              ),
                                              steps: ForAll(
                                                  Filter(colPrApprovals, RequestNumber = varCurrentPR.PRNumber),
                                                  {UserID: Coalesce(ApproverID, 0), UserName: Coalesce(Approver.Value, "")}
                                              )
                                          },
                                          Filter(Ungroup(Table({Items: named}, {Items: steps}), "Items"), UserID > 0)
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ModuleName: ="Procurement"
                                    People: =colProcPeople
                                    RecordID: =Coalesce(varCurrentPR.ID, 0)
                                    RecordNumber: =Coalesce(varCurrentPR.PRNumber, "")
                                    RecordType: ="PurchaseRequest"
                                    RelatedEntity: ="PurchaseRequest"
                                    Title: =If(gblLanguage = "Arabic", "النقاش", "Discussion")
                                    Visible: =varPrPane = "Discussion"
                                    Width: =Parent.Width
                        - conPrSide:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =If(App.Width < 1100, AlignInContainer.Stretch, AlignInContainer.Start)
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              Height: |-
                                =conPrSummary.Height + cmpPrFlow.Height + cmpPrQuick.Height + 2 * Self.LayoutGap
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(App.Width < 1100, Parent.Width, 320)
                            Children:
                              - conPrSummary:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =fxThemeColor("Border")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Surface")
                                    FillPortions: =0
                                    Height: =330
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =16
                                    PaddingLeft: =16
                                    PaddingRight: =16
                                    PaddingTop: =16
                                    RadiusBottomLeft: =gblTheme.Radius.Large
                                    RadiusBottomRight: =gblTheme.Radius.Large
                                    RadiusTopLeft: =gblTheme.Radius.Large
                                    RadiusTopRight: =gblTheme.Radius.Large
                                    Width: =Parent.Width
                                  Children:
                                    - lblPrSideTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("TextPrimary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Medium
                                          Height: =22
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =15
                                          Text: =If(gblLanguage = "Arabic", "الملخص", "Summary")
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - galPrSummary:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          DelayItemLoading: =false
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =224
                                          Items: |-
                                            =Table(
                                                {K: If(gblLanguage = "Arabic", "المرجع", "Reference"), V: Coalesce(varCurrentPR.PRNumber, "-")},
                                                {K: If(gblLanguage = "Arabic", "المشروع", "Project"), V: Coalesce(varCurrentPR.Project.Value, "-")},
                                                {K: If(gblLanguage = "Arabic", "مقدم الطلب", "Requester"), V: Coalesce(varCurrentPR.Requester.Value, "-")},
                                                {K: If(gblLanguage = "Arabic", "الأولوية", "Priority"), V: Coalesce(varCurrentPR.Priority.Value, "-")},
                                                {K: If(gblLanguage = "Arabic", "تاريخ الطلب", "Requested"), V: If(IsBlank(varCurrentPR.RequestDate), "-", Text(varCurrentPR.RequestDate, "dd mmm yyyy"))},
                                                {K: If(gblLanguage = "Arabic", "تاريخ الاحتياج", "Required"), V: If(IsBlank(varCurrentPR.RequiredDate), "-", Text(varCurrentPR.RequiredDate, "dd mmm yyyy"))},
                                                {K: If(gblLanguage = "Arabic", "الإجمالي", "Total"), V: Concatenate(Text(Coalesce(varCurrentPR.TotalAmount, 0), "#,##0.00"), " $")},
                                                {K: If(gblLanguage = "Arabic", "الاستلام", "Received by"), V: Coalesce(varCurrentPR.ReceivedBy.Value, "-")}
                                            )
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          LoadingSpinner: =LoadingSpinner.None
                                          ShowScrollbar: =false
                                          TemplatePadding: =0
                                          TemplateSize: =28
                                          Width: =Parent.Width
                                        Children:
                                          - conPrSumRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                Height: =Parent.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =8
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - lblPrSumK:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Color: =fxThemeColor("TextMuted")
                                                      Font: =gblTheme.Typography.FontFamily
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: =ThisItem.K
                                                      Width: =110
                                                      Wrap: =false
                                                - lblPrSumV:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Color: =fxThemeColor("TextPrimary")
                                                      FillPortions: =1
                                                      Font: =gblTheme.Typography.FontFamily
                                                      FontWeight: =gblTheme.FontWeights.Medium
                                                      Height: =20
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =11
                                                      Text: =ThisItem.V
                                                      Wrap: =false
                                    - btnPrViewAll:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varPrPane, "Details")
                                          Text: =If(gblLanguage = "Arabic", "عرض كل التفاصيل", "View all details")
                                          Width: =Parent.Width
                              - cmpPrFlow:
                                  Control: CanvasComponent
                                  ComponentName: cmpApprovalFlow
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    EmptyText: =If(gblLanguage = "Arabic", "لا توجد خطوات اعتماد", "No approval steps yet")
                                    Height: =400
                                    Items: |-
                                      =SortByColumns(
                                          Filter(colPrApprovals, RequestNumber = varCurrentPR.PRNumber),
                                          "Sequence",
                                          SortOrder.Ascending
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Title: =If(gblLanguage = "Arabic", "مسار الاعتماد", "Approval flow")
                                    Width: =Min(320, Parent.Width)
                              - cmpPrQuick:
                                  Control: CanvasComponent
                                  ComponentName: cmpQuickActions
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    Height: =560
                                    Items: |-
                                      =Table(
                                          {ActionKey: "Print", Label: If(gblLanguage = "Arabic", "طباعة", "Print"), Icon: "Print", Visible: true},
                                          {ActionKey: "SendEmail", Label: If(gblLanguage = "Arabic", "إرسال بريد", "Send Email"), Icon: "Mail", Visible: true},
                                          {ActionKey: "AttachDocument", Label: If(gblLanguage = "Arabic", "إرفاق مستند", "Attach Document"), Icon: "Paperclip", Visible: true},
                                          {ActionKey: "AddComment", Label: If(gblLanguage = "Arabic", "إضافة تعليق", "Add Comment"), Icon: "Message", Visible: true},
                                          {ActionKey: "Edit", Label: If(gblLanguage = "Arabic", "تعديل", "Edit"), Icon: "Edit", Visible: varCurrentPR.Status.Value = "Draft"},
                                          {
                                              ActionKey: "Approve",
                                              Label: If(gblLanguage = "Arabic", "اعتماد", "Approve"),
                                              Icon: "Check",
                                              Visible: Not(IsBlank(LookUp(colPrApprovals, And(RequestNumber = varCurrentPR.PRNumber, Decision.Value = "Pending", ApproverID = gblCurrentEmployee.ID))))
                                          },
                                          {
                                              ActionKey: "Reject",
                                              Label: If(gblLanguage = "Arabic", "رفض", "Reject"),
                                              Icon: "Warning",
                                              Visible: Not(IsBlank(LookUp(colPrApprovals, And(RequestNumber = varCurrentPR.PRNumber, Decision.Value = "Pending", ApproverID = gblCurrentEmployee.ID))))
                                          },
                                          {
                                              ActionKey: "CreatePO",
                                              Label: If(gblLanguage = "Arabic", "إنشاء أمر شراء", "Create PO"),
                                              Icon: "Receipt",
                                              Visible: And(varCurrentPR.Status.Value = "Approved", CountRows(Filter(colPurchaseOrders, Or(PRNo = varCurrentPR.PRNumber, PurchaseRequest.Id = varCurrentPR.ID))) = 0)
                                          }
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Switch(
                                          cmpPrQuick.SelectedAction.ActionKey,
                                          "Print",
                                          Navigate(scrPrintPR, ScreenTransition.None),
                                          "SendEmail",
                                          Set(varPrMailOpen, true),
                                          "AttachDocument",
                                          Set(varProcurementEntity, "PurchaseRequest");
                                          Set(varProcurementMode, If(varCurrentPR.Status.Value = "Draft", "Edit", "View"));
                                          Navigate(scrPREditor, ScreenTransition.Cover),
                                          "AddComment",
                                          Set(varPrPane, "Discussion");
                                          SetFocus(btnPrCommentsAnchor),
                                          "Edit",
                                          Set(varProcurementEntity, "PurchaseRequest");
                                          Set(varProcurementMode, "Edit");
                                          Navigate(scrPREditor, ScreenTransition.Cover),
                                          "Approve",
                                          With(
                                              {
                                                  step: LookUp(
                                                      colPrApprovals,
                                                      And(
                                                          RequestNumber = varCurrentPR.PRNumber,
                                                          Decision.Value = "Pending",
                                                          ApproverID = gblCurrentEmployee.ID
                                                      )
                                                  )
                                              },
                                              If(
                                                  IsBlank(step),
                                                  Navigate(ScrApprovalCenter, ScreenTransition.None),
                                                  IfError(
                                                      Patch(
                                                          ApprovalHistory,
                                                          LookUp(ApprovalHistory, ID = step.ID),
                                                          {Decision: {Value: "Approved"}, DecisionDate: Now()}
                                                      );
                                                      If(
                                                          CountRows(
                                                              Filter(
                                                                  colPrApprovals,
                                                                  And(
                                                                      RequestNumber = varCurrentPR.PRNumber,
                                                                      Decision.Value = "Pending",
                                                                      ID <> step.ID
                                                                  )
                                                              )
                                                          ) = 0,
                                                          Patch(
                                                              PurchaseRequests,
                                                              LookUp(PurchaseRequests, ID = varCurrentPR.ID),
                                                              {Status: {Value: "Approved"}}
                                                          )
                                                      );
                                                      fnWriteLog(
                                                          "Purchase Request",
                                                          varCurrentPR.ID,
                                                          varCurrentPR.PRNumber,
                                                          "Approved",
                                                          "Important",
                                                          Coalesce(varCurrentPR.ProjectID, 0),
                                                          Coalesce(varCurrentPR.Project.Value, ""),
                                                          Coalesce(varCurrentPR.TotalAmount, 0),
                                                          Coalesce(varCurrentPR.Currency.Value, ""),
                                                          "Decision",
                                                          "Pending",
                                                          "Approved",
                                                          "",
                                                          "",
                                                          Coalesce(step.Sequence, 0)
                                                      );
                                                      ClearCollect(
                                                          colProcNotice,
                                                          Filter(
                                                              Table(
                                                                  {UserID: Coalesce(varCurrentPR.RequesterID, 0), UserName: Coalesce(varCurrentPR.Requester.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.SupervisorID, 0), UserName: Coalesce(varCurrentPR.Supervisor.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.ApproverID, 0), UserName: Coalesce(varCurrentPR.Approver.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.FinancialApproverID, 0), UserName: Coalesce(varCurrentPR.FinancialApprover.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.ReceivedByID, 0), UserName: Coalesce(varCurrentPR.ReceivedBy.Value, "")}
                                                              ),
                                                              And(UserID > 0, UserID <> Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0))
                                                          )
                                                      );
                                                      ForAll(
                                                          ForAll(Distinct(colProcNotice, UserID), LookUp(colProcNotice, UserID = Value)) As person,
                                                          fnProcNotify(person.UserID, person.UserName, varCurrentPR.PRNumber & " approved", Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "") & " approved " & varCurrentPR.PRNumber & ".", "PurchaseRequest", varCurrentPR.ID, "PurchaseRequest")
                                                      );
                                                      Select(btnPrReload);
                                                      Notify(If(gblLanguage = "Arabic", "تم اعتماد الطلب.", "Request approved."), NotificationType.Success),
                                                      Notify(If(gblLanguage = "Arabic", "تعذر حفظ الاعتماد.", "The decision could not be saved."), NotificationType.Error)
                                                  )
                                              )
                                          ),
                                          "Reject",
                                          With(
                                              {
                                                  step: LookUp(
                                                      colPrApprovals,
                                                      And(
                                                          RequestNumber = varCurrentPR.PRNumber,
                                                          Decision.Value = "Pending",
                                                          ApproverID = gblCurrentEmployee.ID
                                                      )
                                                  )
                                              },
                                              If(
                                                  IsBlank(step),
                                                  Navigate(ScrApprovalCenter, ScreenTransition.None),
                                                  IfError(
                                                      Patch(
                                                          ApprovalHistory,
                                                          LookUp(ApprovalHistory, ID = step.ID),
                                                          {Decision: {Value: "Rejected"}, DecisionDate: Now()}
                                                      );
                                                      Patch(
                                                          PurchaseRequests,
                                                          LookUp(PurchaseRequests, ID = varCurrentPR.ID),
                                                          {Status: {Value: "Rejected"}}
                                                      );
                                                      fnWriteLog(
                                                          "Purchase Request",
                                                          varCurrentPR.ID,
                                                          varCurrentPR.PRNumber,
                                                          "Rejected",
                                                          "Important",
                                                          Coalesce(varCurrentPR.ProjectID, 0),
                                                          Coalesce(varCurrentPR.Project.Value, ""),
                                                          Coalesce(varCurrentPR.TotalAmount, 0),
                                                          Coalesce(varCurrentPR.Currency.Value, ""),
                                                          "Decision",
                                                          "Pending",
                                                          "Rejected",
                                                          "",
                                                          "",
                                                          Coalesce(step.Sequence, 0)
                                                      );
                                                      ClearCollect(
                                                          colProcNotice,
                                                          Filter(
                                                              Table(
                                                                  {UserID: Coalesce(varCurrentPR.RequesterID, 0), UserName: Coalesce(varCurrentPR.Requester.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.SupervisorID, 0), UserName: Coalesce(varCurrentPR.Supervisor.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.ApproverID, 0), UserName: Coalesce(varCurrentPR.Approver.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.FinancialApproverID, 0), UserName: Coalesce(varCurrentPR.FinancialApprover.Value, "")},
                                                                  {UserID: Coalesce(varCurrentPR.ReceivedByID, 0), UserName: Coalesce(varCurrentPR.ReceivedBy.Value, "")}
                                                              ),
                                                              And(UserID > 0, UserID <> Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0))
                                                          )
                                                      );
                                                      ForAll(
                                                          ForAll(Distinct(colProcNotice, UserID), LookUp(colProcNotice, UserID = Value)) As person,
                                                          fnProcNotify(person.UserID, person.UserName, varCurrentPR.PRNumber & " rejected", Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "") & " rejected " & varCurrentPR.PRNumber & ".", "PurchaseRequest", varCurrentPR.ID, "PurchaseRequest")
                                                      );
                                                      Select(btnPrReload);
                                                      Notify(If(gblLanguage = "Arabic", "تم رفض الطلب.", "Request rejected."), NotificationType.Success),
                                                      Notify(If(gblLanguage = "Arabic", "تعذر حفظ الرفض.", "The decision could not be saved."), NotificationType.Error)
                                                  )
                                              )
                                          ),
                                          "CreatePO",
                                          Set(varSourcePR, varCurrentPR);
                                          Set(varSelectedPR, varCurrentPR);
                                          Set(varProcProject, LookUp(colProjects, ID = varCurrentPR.ProjectID));
                                          Set(varProcurementEntity, "PurchaseOrder");
                                          Set(varProcurementMode, "New");
                                          Set(varCurrentPO, Blank());
                                          Navigate(scrPOEditor, ScreenTransition.Cover)
                                      )
                                    Title: =If(gblLanguage = "Arabic", "إجراءات سريعة", "Quick actions")
                                    Width: =Min(320, Parent.Width)
      - conPrQuick:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
