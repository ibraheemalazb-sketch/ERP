      - cmpPrNew:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =fxThemeColor("Primary")
            Height: =56
            Icon: ="Plus"
            Label: =If(gblLanguage = "Arabic", "طلب شراء", "Purchase request")
            OnSelect: |-
              =Set(varProcurementEntity, "PurchaseRequest");
              Set(varProcurementMode, "New");
              Set(varCurrentPR, Blank());
              Set(varPrQuick, Blank());
              Set(varPrPane, "Details");
              Navigate(scrPREditor, ScreenTransition.Cover)
            Size: ="regular"
            SpeedDialItems: |-
              =Filter(
                  Table({Icon: "Plus", Label: "New", Color: RGBA(0, 0, 0, 1)}),
                  false
              )
            Style: ="standard"
            Visible: =And(App.Width < 700, IsBlank(varCurrentPR))
            Width: =56
            X: =Parent.Width - 76
            Y: =Parent.Height - If(App.Width < 700, cmpPrPhone.Height, 16) - 72
      - cmpPrMail:
          Control: CanvasComponent
          ComponentName: cmpSendEmail
          Properties:
            Busy: =varPrMailBusy
            ContextLine: =Coalesce(varCurrentPR.PRNumber, "")
            DefaultSubject: |-
              =Concatenate(
                  If(gblLanguage = "Arabic", "طلب شراء ", "Purchase request "),
                  Coalesce(varCurrentPR.PRNumber, "")
              )
            Directory: |-
              =ForAll(
                  colProcPeople,
                  {DisplayName: FullName, Mail: Email, JobTitle: ""}
              )
            Height: =App.Height
            OnCancel: |-
              =Set(varPrMailOpen, false);
              Reset(cmpPrMail)
            OnSend: |-
              =Set(varPrMailBusy, true);
              Notify(
                  Concatenate(If(gblLanguage = "Arabic", "الرسالة جاهزة: ", "Message ready: "), cmpPrMail.Subject),
                  NotificationType.Success
              );
              Set(varPrMailBusy, false);
              Set(varPrMailOpen, false);
              Reset(cmpPrMail)
            Title: =If(gblLanguage = "Arabic", "رسالة عن الطلب", "Message about this request")
            Visible: =varPrMailOpen
            Width: =App.Width
            X: =0
            Y: =0
