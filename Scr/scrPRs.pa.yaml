                        WidthColumn2: =120
                        WidthColumn3: =110
                        WidthPerson: =160
                        WidthPriority: =110
                        WidthStatus: =120
                        WidthSubtitle: =120
                        WidthTitle: =150
                        WidthWhen: =130
