Screens:
  scrPRs:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "PRs");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "PRs");
        Set(varNavSelectedID, 32);
        Set(varProcurementEntity, "PurchaseRequest");
        Set(varProcurementMode, "View");
        Set(varPrQuick, Blank());
        Set(varPrMenuId, 0);
        Set(varPrFilters, false);
        Set(varPrView, If(App.Width < 700, "list", "table"));
        Set(varPrMine, false);
        Set(varPrPane, "Details");
        Reset(cmpPrView);
        Reset(cmpPrTable);
        Reset(cmpPrNew);
        Reset(cmpPrStep);
        If(IsBlank(varPrStatus), Set(varPrStatus, "All"));
        If(IsBlank(varPrProjectID), Set(varPrProjectID, 0));
        If(IsBlank(varPrRequester), Set(varPrRequester, "All"));
        If(IsBlank(varPrApprover), Set(varPrApprover, "All"));
        If(IsBlank(varPrPriority), Set(varPrPriority, "All"));
        Set(varPrMailOpen, false);
        Set(varPrMailBusy, false);
        Select(btnPrReload);
        ClearCollect(
            colPrQuickFacts,
            {
                Label: If(gblLanguage = "Arabic", "المشروع", "Project"),
                Icon: "Folder",
                Value: Coalesce(varPrQuick.Project.Value, "-")
            },
            {
                Label: If(gblLanguage = "Arabic", "مقدم الطلب", "Requester"),
                Icon: "User",
                Value: Coalesce(varPrQuick.Requester.Value, "-")
            },
            {
                Label: If(gblLanguage = "Arabic", "تاريخ الطلب", "Requested"),
                Icon: "Calendar",
                Value: If(IsBlank(varPrQuick.RequestDate), "-", Text(varPrQuick.RequestDate, "dd mmm yyyy"))
            },
            {
                Label: If(gblLanguage = "Arabic", "تاريخ الاحتياج", "Required"),
                Icon: "Clock",
                Value: If(IsBlank(varPrQuick.RequiredDate), "-", Text(varPrQuick.RequiredDate, "dd mmm yyyy"))
            },
            {
                Label: If(gblLanguage = "Arabic", "الأولوية", "Priority"),
                Icon: "Flag",
                Value: Coalesce(varPrQuick.Priority.Value, "-")
            },
            {
                Label: If(gblLanguage = "Arabic", "الإجمالي", "Total"),
                Icon: "Money",
                Value: Text(Coalesce(varPrQuick.TotalAmount, 0), "#,##0.00") & " $"
            }
        )
    Children:
      - conPrReload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =1
            Width: =1
          Children:
            - btnPrReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        If(
                            varProcurementScope = "Own",
                            ClearCollect(
                                colPurchaseRequests,
                                FirstN(
                                    SortByColumns(
                                        Filter(
                                            PurchaseRequests,
                                            And(
                                                ProjectID = gblUser.ProjectID,
                                                Or(
                                                    RequesterID = gblCurrentEmployee.ID,
                                                    ReceivedByID = gblCurrentEmployee.ID
                                                )
                                            )
                                        ),
                                        "ID",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            If(
                                varProcurementScope = "Project",
                                ClearCollect(
                                    colPurchaseRequests,
                                    Filter(
                                        FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500),
                                        Project.Value in colProjects.ProjectCode
                                    )
                                ),
                                ClearCollect(
                                    colPurchaseRequests,
                                    FirstN(SortByColumns(PurchaseRequests, "ID", SortOrder.Descending), 500)
                                )
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل طلبات الشراء.", "Purchase requests could not be loaded."),
                            NotificationType.Error
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPurchaseRequestLines,
                            Filter(
                                FirstN(SortByColumns(PurchaseRequestLines, "ID", SortOrder.Descending), 500),
                                PR.Id in colPurchaseRequests.ID
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل بنود الطلب.", "Request lines could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        If(
                            varProcurementScope = "Own",
                            ClearCollect(
                                colPurchaseOrders,
                                FirstN(
                                    SortByColumns(
                                        Filter(
                                            PurchaseOrders,
                                            And(
                                                ProjectID = gblUser.ProjectID,
                                                Or(
                                                    PreparedByID = gblCurrentEmployee.ID,
                                                    ApprovedByID = gblCurrentEmployee.ID
                                                )
                                            )
                                        ),
                                        "ID",
                                        SortOrder.Descending
                                    ),
                                    500
                                )
                            ),
                            ClearCollect(
                                colPurchaseOrders,
                                FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500)
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل أوامر الشراء.", "Purchase orders could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPrApprovals,
                            Filter(
                                FirstN(SortByColumns(ApprovalHistory, "ID", SortOrder.Descending), 500),
                                RequestType.Value = "Purchase Request"
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل مسار الاعتماد.", "Approval history could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colProcPeople,
                            ForAll(
                                FirstN(
                                    SortByColumns(
                                        Filter(Employees, Status.Value = "Active"),
                                        "FullName",
                                        SortOrder.Ascending
                                    ),
                                    200
                                ),
                                {
                                    ID: ID,
                                    FullName: FullName,
                                    Email: Email,
                                    EmployeeNumber: Coalesce(EmployeeNumber, "")
                                }
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل الموظفين.", "People could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    With(
                        {row: LookUp(colPurchaseRequests, ID = varCurrentPR.ID)},
                        If(
                            Not(IsBlank(row)),
                            Set(varCurrentPR, row)
                        )
                    )
                  Text: ="Reload"
                  Width: =1
