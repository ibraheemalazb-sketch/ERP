                      Variant: Horizontal
                      Properties:
                        Height: =36
                        Items: |-
                          =Table(
                              {K: "Mine", L: If(gblLanguage = "Arabic", "طلباتي", "My requests")},
                              {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                              {K: "Submitted", L: If(gblLanguage = "Arabic", "مقدم", "Submitted")},
                              {K: "PendingApproval", L: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending")},
                              {K: "Approved", L: If(gblLanguage = "Arabic", "معتمد", "Approved")}
                          )
                        ShowScrollbar: =false
                        TemplatePadding: =8
                        TemplateSize: =128
                        Visible: =App.Width < 700
                        Width: =Parent.Width
                      Children:
                        - btnPrChip:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: |-
                                =If(
                                    If(
                                        ThisItem.K = "Mine",
                                        Coalesce(varPrMine, false),
                                        Coalesce(varPrStatus, "All") = ThisItem.K
                                    ),
                                    ButtonAppearance.Primary,
                                    ButtonAppearance.Outline
                                )
                              Height: =32
                              OnSelect: |-
                                =If(
                                    ThisItem.K = "Mine",
                                    Set(varPrMine, Not(Coalesce(varPrMine, false))),
                                    Set(varPrStatus, ThisItem.K)
                                )
                              Text: =ThisItem.L
                              Width: =120
                  - cmpPrTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =148
                        ContextMenuItems: |-
                          =Table(
                              {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض سريع", "Quick view"), ItemVisible: true},
                              {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: true}
                          )
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
                        EmptyTitle: =If(gblLanguage = "Arabic", "لا توجد طلبات شراء", "No purchase requests")
                        EnableHover: =true
                        EnableMenu: =true
                        HeaderAction: =""
                        HeaderColumn1: =If(gblLanguage = "Arabic", "تاريخ الطلب", "Requested date")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        HeaderColumn3: =""
                        HeaderHeight: =40
                        HeaderPerson: =If(gblLanguage = "Arabic", "مقدم الطلب", "Requester")
                        HeaderPriority: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                        HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الإجمالي", "Total")
                        HeaderTitle: =If(gblLanguage = "Arabic", "رقم الطلب", "PR number")
                        HeaderWhen: =If(gblLanguage = "Arabic", "التاريخ المطلوب", "Required date")
                        Height: =Max(420, App.Height - cmpPrTop.Height - If(App.Width < 700, cmpPrPhone.Height, 0) - 240)
                        LayoutMinHeight: =360
                        LayoutMinWidth: =320
                        Items: |-
                          =ForAll(
                              Filter(
                                  colPurchaseRequests,
                                  And(
                                      Or(IsBlank(varPrStatus), varPrStatus = "All", Status.Value = varPrStatus),
                                      Or(Coalesce(varPrProjectID, 0) = 0, ProjectID = varPrProjectID),
                                      Or(Not(Coalesce(varPrMine, false)), RequesterID = gblCurrentEmployee.ID),
                                      Or(Or(IsBlank(varPrRequester), varPrRequester = "All"), Requester.Value = varPrRequester),
                                      Or(Or(IsBlank(varPrApprover), varPrApprover = "All"), CountRows(Filter(colPrApprovals, And(RequestNumber = PRNumber, Approver.Value = varPrApprover))) > 0),
                                      Or(Or(IsBlank(varPrPriority), varPrPriority = "All"), Priority.Value = varPrPriority),
                                      Or(
                                          IsBlank(Trim(txtPrSearch.Text)),
                                          Trim(txtPrSearch.Text) in Coalesce(PRNumber, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(ReasonRequired, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(Requester.Value, ""),
                                          Trim(txtPrSearch.Text) in Coalesce(Project.Value, "")
                                      )
                                  )
                              ) As req,
                              {
                                  RowKey: Text(req.ID),
                                  Title: Coalesce(req.PRNumber, "-"),
                                  Subtitle: Concatenate(Text(Coalesce(req.TotalAmount, 0), "#,##0.00"), " $"),
                                  Column1: If(IsBlank(req.RequestDate), "-", Text(req.RequestDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(req.Project.Value, "-"),
                                  Column3: "",
                                  Status: Coalesce(req.Status.Value, "-"),
                                  Tone: Switch(
                                      req.Status.Value,
                                      "Approved", "approved",
                                      "Completed", "completed",
                                      "Rejected", "rejected",
                                      "Cancelled", "danger",
                                      "Submitted", "in progress",
                                      "PO Created", "info",
                                      "POcreated", "info",
                                      "pending"
                                  ),
                                  Priority: Coalesce(req.Priority.Value, "-"),
                                  PriorityTone: Switch(req.Priority.Value, "High", "high", "Low", "low", "medium"),
                                  Person: Coalesce(req.Requester.Value, "-"),
                                  WhenText: If(IsBlank(req.RequiredDate), "-", Text(req.RequiredDate, "dd-mmm-yyyy")),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: "FileText"
                              }
                          )
                        OnMenuItemSelect: |-
                          =With(
                              {row: LookUp(colPurchaseRequests, ID = Value(cmpPrTable.SelectedItem.RowKey))},
                              Switch(
                                  cmpPrTable.SelectedMenuItem.ItemKey,
                                  "view", Set(varPrQuick, row),
                                  "edit",
                                  Set(varCurrentPR, row);
                                  Set(varProcurementEntity, "PurchaseRequest");
                                  Set(varProcurementMode, "Edit");
                                  Set(varPrPane, "Details");
                                  Set(varPrQuick, Blank());
                                  Navigate(scrPREditor, ScreenTransition.Cover)
                              )
                          )
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colPurchaseRequests, ID = Value(cmpPrTable.SelectedItem.RowKey))},
                              If(
                                  varPrQuick.ID = row.ID,
                                  Set(varPrQuick, Blank()),
                                  Set(varPrQuick, row)
                              )
                          )
                        RowHeight: =52
                        ShowAction: =true
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =false
                        ShowHeader: =true
                        ShowId: =false
                        ShowPerson: =true
                        ShowPriority: =true
                        ShowProgress: =false
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
                        SubtitleAsPill: =false
                        TitleBold: =true
                        ViewMode: =If(App.Width < 700, "list", Coalesce(varPrView, "table"))
                        Width: =Parent.Width
