Screens:
  scrVendors:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "Vendors");
        Set(varNavSelectedID, 35);
        Set(varVnQuick, Blank());
        Set(varaddvendor, false);
        Set(varVnMenuId, 0);
        Set(varVnFilters, false);
        Set(varVnView, If(App.Width < 700, "list", "table"));
        Set(varVnPane, "Details");
        Reset(cmpVnView);
        Reset(cmpVnTable);
        Reset(cmpVnNew);
        Reset(cmpVnStep);
        If(IsBlank(varVendorStatus), Set(varVendorStatus, "All"));
        If(IsBlank(varVnType), Set(varVnType, "All"));
        Set(varVnMailOpen, false);
        Set(varVnMailBusy, false);
        Select(btnVnReload)
    Children:
      - conVnReload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =1
            Width: =1
          Children:
            - btnVnReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        ClearCollect(
                            colProcVendors,
                            FirstN(SortByColumns(Vendors, "Title", SortOrder.Ascending), 500)
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل الموردين.", "Vendors could not be loaded."),
                            NotificationType.Error
                        )
                    );
                    IfError(
                        ClearCollect(
                            colPurchaseOrders,
                            FirstN(SortByColumns(PurchaseOrders, "ID", SortOrder.Descending), 500)
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل أوامر الشراء.", "Purchase orders could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    IfError(
                        ClearCollect(
                            colProcPeople,
                            ForAll(
                                FirstN(
                                    SortByColumns(
                                        Filter(Employees, Status.Value = "Active"),
                                        "FullName",
                                        SortOrder.Ascending
                                    ),
                                    200
                                ),
                                {
                                    ID: ID,
                                    FullName: FullName,
                                    Email: Email,
                                    EmployeeNumber: Coalesce(EmployeeNumber, "")
                                }
                            )
                        ),
                        Notify(
                            If(gblLanguage = "Arabic", "تعذر تحميل الموظفين.", "People could not be loaded."),
                            NotificationType.Warning
                        )
                    );
                    With(
                        {row: LookUp(colProcVendors, ID = varCurrentVendor.ID)},
                        If(Not(IsBlank(row)), Set(varCurrentVendor, row))
                    )
                  Text: ="Reload"
                  Width: =1
      - conVnNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpVnNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conVnPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            PaddingBottom: =If(App.Width < 700, cmpVnPhone.Height, 0)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 16)
            PaddingRight: =12
            PaddingTop: =cmpVnTop.Height + 12
            Width: =Parent.Width
          Children:
            - conVnList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =And(IsBlank(varCurrentVendor), Not(varaddvendor))
                  Width: =Parent.Width
                Children:
                  - conVnHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conVnTitles:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =44
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =5
                              PaddingRight: =5
                              Width: =Parent.Width
                            Children:
                              - lblVnTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =If(gblLanguage = "Arabic", "كل الموردين", "All vendors")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblVnCount:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.BodySmall
                                    Text: |-
                                      =Concatenate(
                                          Text(
                                              CountRows(
                                                  Filter(
                                                      colProcVendors,
                                                      And(
                                                          Or(IsBlank(varVendorStatus), varVendorStatus = "All", Status.Value = varVendorStatus),
                                                          Or(IsBlank(varVnType), varVnType = "All", SupplierType.Value = varVnType),
                                                          Or(
                                                              IsBlank(Trim(txtVnSearch.Text)),
                                                              Trim(txtVnSearch.Text) in Coalesce(Title, ""),
                                                              Trim(txtVnSearch.Text) in Coalesce(SupplierCode, ""),
                                                              Trim(txtVnSearch.Text) in Coalesce(ContactPerson, ""),
                                                              Trim(txtVnSearch.Text) in Coalesce(MainSupply, "")
                                                          )
                                                      )
                                                  )
                                              )
                                          ),
                                          If(gblLanguage = "Arabic", " من ", " of "),
                                          Text(CountRows(colProcVendors)),
                                          If(gblLanguage = "Arabic", " مورد", " vendors")
                                      )
                                    Width: =Parent.Width
                                    Wrap: =false
                        - btnVnNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              Icon: ="Add"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =140
                              OnSelect: |-
                                =Set(varFMode, "Add");
                                Set(varCurrentVendor, Blank());
                                Set(varVnQuick, Blank());
                                Set(varaddvendor, true);
                                Reset(txtVnTitle);
                                Reset(txtVnCode);
                                Reset(cmbVnType);
                                Reset(cmbVnStatus);
                                Reset(txtVnContact);
                                Reset(txtVnPhone);
                                Reset(txtVnEmail);
                                Reset(txtVnGov);
                                Reset(txtVnSupply);
                                Reset(txtVnAddress);
                                Reset(txtVnRating);
                                Reset(txtVnBank);
                                Reset(txtVnRemarks)
                              PaddingLeft: =0
                              PaddingRight: =0
                              Text: =If(gblLanguage = "Arabic", "مورد", "Vendor")
                              Visible: =App.Width >= 700
                              Width: =160
                  - lblVnEditor:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextSecondary")
                        Fill: =Color.Transparent
                        Font: =gblTheme.Typography.FontFamily
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Caption
                        Text: =If(gblLanguage = "Arabic", "الإنشاء والتعديل على هذه الشاشة.", "Create and edit stay on this screen.")
                        Visible: =false
                        Width: =Parent.Width
                        Wrap: =false
                  - Container6:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =conVnTools.Height+If(varVnFilters,conVnFilterRow.Height,0)+If(App.Width<700,galVnChips.Height,0)+Self.PaddingBottom*2.5
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =7
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                      Children:
                        - conVnTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 50, 44)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - txtVnSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في الموردين", "Search vendors")
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "ابحث في الموردين", "Search vendors...")
                                    Width: =If(App.Width < 700, Max(160, Parent.Width - 120), Max(200, Parent.Width - 378))
                              - btnVnFilters:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =If(varVnFilters, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                    Height: =40
                                    Icon: ="Filter"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varVnFilters, Not(varVnFilters))
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                                    Width: =If(App.Width < 700, 44, 110)
                              - btnVnRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Height: =40
                                    Icon: ="ArrowSync"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnVnReload)
                                    Text: =""
                                    Tooltip: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                                    Width: =44
                              - cmpVnView:
                                  Control: CanvasComponent
                                  ComponentName: cmpSegmentedControl
                                  Properties:
                                    DefaultValue: =varVnView
                                    Disabled: =
                                    DisplayMode: ="Both"
                                    EqualWidth: =true
                                    Height: =40
                                    IconPosition: ="Left"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varVnView, cmpVnView.SelectedValue)
                                    Options: |-
                                      =Table(
                                          {Value: "table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                          {Value: "list", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                      )
                                    Size: ="Medium"
                                    Theme: =
                                    Visible: =App.Width >= 700
                                    Width: =188
                        - galVnChips:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              FillPortions: =0
                              Height: =36
                              Items: |-
                                =Table(
                                    {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {K: "Active", L: If(gblLanguage = "Arabic", "نشط", "Active")},
                                    {K: "Pending", L: If(gblLanguage = "Arabic", "معلق", "Pending")},
                                    {K: "Inactive", L: If(gblLanguage = "Arabic", "غير نشط", "Inactive")}
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =128
                              Visible: =App.Width < 700
                              Width: =Parent.Width
                            Children:
                              - btnVnChip:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |-
                                      =If(
                                          Coalesce(varVendorStatus, "All") = ThisItem.K,
                                          ButtonAppearance.Primary,
                                          ButtonAppearance.Outline
                                      )
                                    Height: =30
                                    OnSelect: =Set(varVendorStatus, ThisItem.K)
                                    Text: =ThisItem.L
                                    Width: =120
                        - conVnFilterRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 150, 50)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =5
                              LayoutMinHeight: =44
                              LayoutMinWidth: =0
                              LayoutWrap: =true
                              PaddingBottom: =5
                              PaddingTop: =5
                              Visible: =varVnFilters
                              Width: =Parent.Width
                            Children:
                              - cmbVnStatusFilter:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                    DefaultSelectedItems: |-
                                      =Table({K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")})
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All statuses")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.L
                                    Items: |-
                                      =Table(
                                          {K: "All", L: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                          {K: "Active", L: If(gblLanguage = "Arabic", "نشط", "Active")},
                                          {K: "Pending", L: If(gblLanguage = "Arabic", "معلق", "Pending")},
                                          {K: "Inactive", L: If(gblLanguage = "Arabic", "غير نشط", "Inactive")}
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: =Set(varVendorStatus, Coalesce(Self.Selected.K, "All"))
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 180)
                              - cmbVnTypeFilter:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "النوع", "Type")
                                    DefaultSelectedItems: =Filter(Choices(Vendors.SupplierType), And(Not(IsBlank(varVnType)), varVnType <> "All", Value = varVnType))
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الأنواع", "All types")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Vendors.SupplierType)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =160
                                    OnChange: =Set(varVnType, Coalesce(Self.Selected.Value, "All"))
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 180)
                              - btnVnClear:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =40
                                    Icon: ="Dismiss"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Reset(txtVnSearch);
                                      Reset(cmbVnStatusFilter);
                                      Set(varVendorStatus, "All");
                                      Reset(cmbVnTypeFilter);
                                      Set(varVnType, "All")
                                    Text: =If(gblLanguage = "Arabic", "مسح", "Clear")
                                    Width: =100
                  - cmpVnTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        CardHeight: =148
                        ContextMenuItems: |-
                          =Table(
                              {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض سريع", "Quick view"), ItemVisible: true},
                              {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: true}
                          )
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
                        EmptyTitle: =If(gblLanguage = "Arabic", "لا يوجد موردون", "No vendors")
                        EnableHover: =true
                        EnableMenu: =true
                        HeaderAction: =""
                        HeaderColumn1: =If(gblLanguage = "Arabic", "النوع", "Type")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المحافظة", "Governorate")
                        HeaderColumn3: =""
                        HeaderHeight: =40
                        HeaderId: =
                        HeaderPerson: =If(gblLanguage = "Arabic", "جهة الاتصال", "Contact")
                        HeaderPriority: =If(gblLanguage = "Arabic", "التقييم", "Rating")
                        HeaderProgress: =
