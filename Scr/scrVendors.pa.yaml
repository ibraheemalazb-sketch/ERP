            DefaultSubject: |-
              =Concatenate(
                  If(gblLanguage = "Arabic", "مورد ", "Vendor "),
                  Coalesce(varCurrentVendor.Title, "")
              )
            Directory: |-
              =ForAll(
                  colProcPeople,
                  {DisplayName: FullName, Mail: Email, JobTitle: ""}
              )
            Height: =App.Height
            OnCancel: |-
              =Set(varVnMailOpen, false);
              Reset(cmpVnMail)
            OnSend: |-
              =Set(varVnMailBusy, true);
              Notify(
