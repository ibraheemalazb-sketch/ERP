                          =ForAll(
                              Filter(
                                  colProcVendors,
                                  And(
                                      Or(IsBlank(varVendorStatus), varVendorStatus = "All", Status.Value = varVendorStatus),
                                      Or(IsBlank(varVnType), varVnType = "All", SupplierType.Value = varVnType),
                                      Or(
                                          IsBlank(Trim(txtVnSearch.Text)),
                                          Trim(txtVnSearch.Text) in Coalesce(Title, ""),
                                          Trim(txtVnSearch.Text) in Coalesce(SupplierCode, ""),
                                          Trim(txtVnSearch.Text) in Coalesce(ContactPerson, ""),
                                          Trim(txtVnSearch.Text) in Coalesce(MainSupply, "")
                                      )
                                  )
                              ) As req,
                              {
                                  RowKey: Text(req.ID),
                                  Title: Coalesce(req.Title, "-"),
                                  Subtitle: Coalesce(req.Phone, "-"),
                                  Column1: Coalesce(req.SupplierType.Value, "-"),
                                  Column2: Coalesce(req.Governorate, "-"),
                                  Column3: "",
                                  Status: Coalesce(req.Status.Value, "-"),
                                  Tone: Switch(
                                      req.Status.Value,
                                      "Active", "approved",
                                      "Pending", "pending",
                                      "Inactive", "neutral",
                                      "info"
                                  ),
                                  Priority: Text(Coalesce(req.Evulation, 0), "0.0"),
                                  PriorityTone: "medium",
                                  Person: Coalesce(req.ContactPerson, "-"),
                                  WhenText: Coalesce(req.SupplierCode, "-"),
                                  ProgressDone: 0,
