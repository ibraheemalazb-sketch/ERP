                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =If(gblLeaveConfirmAction = "Delete", fxThemeColor("Danger"), fxThemeColor("Primary"))
                              Height: =36
                              Icon: =If(gblLeaveConfirmAction = "Delete", "Delete", "Checkmark")
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    gblLeaveConfirmAction = "Delete",
                                    If(
                                        IsBlank(gblSelectedLeaveRequest),
                                        Notify(If(gblLanguage = "Arabic", "لم يتم اختيار طلب.", "No leave request was selected."), NotificationType.Error),
                                        IfError(
                                            Remove(LeaveRequests, gblSelectedLeaveRequest);
                                            Refresh(LeaveRequests);
                                            Remove(colUserLeaveRequests, LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID));
                                            Remove(colLeaveAll, LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID));
                                            Set(gblSelectedLeaveRequest, Blank());
                                            Set(gblShowLeaveConfirm, false);
                                            Set(VarNewLeave, false);
                                            Set(VarShowLeave, false);
                                            Set(gblLeaveRequestMode, Blank());
                                            Notify(If(gblLanguage = "Arabic", "تم حذف طلب الإجازة.", "Leave request deleted."), NotificationType.Success),
                                            Notify(If(gblLanguage = "Arabic", "تعذر الحذف.", "Delete failed."), NotificationType.Error)
                                        )
                                    ),
                                    If(
                                        gblLeaveConfirmAction = "Save",
                                        If(
                                            IsBlank(gblSelectedLeaveRequest),
                                            Notify(If(gblLanguage = "Arabic", "لم يتم اختيار طلب.", "No leave request was selected."), NotificationType.Error),
                                            IfError(
                                                Set(
                                                    gblSelectedLeaveRequest,
                                                    Patch(
                                                        LeaveRequests,
                                                        LookUp(LeaveRequests, ID = gblSelectedLeaveRequest.ID),
                                                        {
                                                            LeaveType: cmbLeaveType.Selected,
                                                            StartDate: dteLeaveStart.SelectedDate,
                                                            EndDate: dteLeaveEnd.SelectedDate,
                                                            Substitute: cmbLeaveSubstitute.Selected,
                                                            Reason: txtLeaveReason.Text,
                                                            Duration: CountIf(
                                                                ForAll(Sequence(DateDiff(dteLeaveStart.SelectedDate, dteLeaveEnd.SelectedDate) + 1), DateAdd(dteLeaveStart.SelectedDate, Value - 1)),
                                                                And(Weekday(Value, StartOfWeek.Monday) <> 5, Weekday(Value, StartOfWeek.Monday) <> 6)
                                                            )
                                                        }
                                                    )
                                                );
                                                Refresh(LeaveRequests);
                                                Remove(colUserLeaveRequests, LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID));
                                                Collect(colUserLeaveRequests, gblSelectedLeaveRequest);
                                                Remove(colLeaveAll, LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID));
                                                Collect(colLeaveAll, gblSelectedLeaveRequest);
                                                Set(gblShowLeaveConfirm, false);
                                                Set(VarNewLeave, false);
                                                Set(VarShowLeave, false);
                                                Set(gblLeaveRequestMode, "View");
                                                Notify(If(gblLanguage = "Arabic", "تم حفظ التغييرات.", "Changes saved."), NotificationType.Success),
                                                Notify(If(gblLanguage = "Arabic", "تعذر الحفظ.", "Save failed."), NotificationType.Error)
                                            )
                                        ),
                                        With(
                                            {
                                                startDate: dteLeaveStart.SelectedDate,
                                                endDate: dteLeaveEnd.SelectedDate,
                                                workingDays: CountIf(
                                                    ForAll(Sequence(DateDiff(dteLeaveStart.SelectedDate, dteLeaveEnd.SelectedDate) + 1), DateAdd(dteLeaveStart.SelectedDate, Value - 1)),
                                                    And(Weekday(Value, StartOfWeek.Monday) <> 5, Weekday(Value, StartOfWeek.Monday) <> 6)
                                                )
                                            },
                                            If(
                                                Or(IsBlank(cmbLeaveType.Selected), IsBlank(startDate), IsBlank(endDate), IsBlank(Trim(txtLeaveReason.Text)), endDate < startDate, workingDays <= 0, IsBlank(gblLeaveBalance), workingDays > gblLeaveBalance.Remaining),
                                                Notify(If(gblLanguage = "Arabic", "راجع بيانات الطلب قبل الإرسال.", "Check the request before submitting."), NotificationType.Error),
                                                IfError(
                                                    Set(
                                                        gblSelectedLeaveRequest,
                                                        Patch(
                                                            LeaveRequests,
                                                            Defaults(LeaveRequests),
                                                            {
                                                                Title: gblCurrentEmployee.FullName & " - " & cmbLeaveType.Selected.Value & "_" & txtLeaveReason.Text,
                                                                Employee: {Id: gblCurrentEmployee.ID, Value: gblCurrentEmployee.FullName},
                                                                EmployeeID: gblUser.ID,
                                                                LeaveType: cmbLeaveType.Selected,
                                                                StartDate: startDate,
                                                                EndDate: endDate,
                                                                Substitute: cmbLeaveSubstitute.Selected,
                                                                Duration: workingDays,
                                                                Reason: txtLeaveReason.Text,
                                                                Approver: gblCurrentEmployee.Manager,
                                                                Status: {Value: "Pending"}
                                                            }
                                                        )
                                                    );
                                                    Refresh(LeaveRequests);
                                                    Collect(colUserLeaveRequests, gblSelectedLeaveRequest);
                                                    Collect(colLeaveAll, gblSelectedLeaveRequest);
                                                    Set(vRequestDuration, workingDays);
                                                    Set(gblShowLeaveConfirm, false);
                                                    Set(VarNewLeave, false);
                                                    Set(VarShowLeave, false);
                                                    Set(gblLeaveBalance, Blank());
                                                    Set(gblLeaveRequestMode, Blank());
                                                    Reset(cmbLeaveType);
                                                    Reset(dteLeaveStart);
                                                    Reset(dteLeaveEnd);
                                                    Reset(cmbLeaveSubstitute);
                                                    Reset(txtLeaveReason);
                                                    Notify(If(gblLanguage = "Arabic", "تم إرسال طلب الإجازة.", "Leave request submitted."), NotificationType.Success),
                                                    Notify(If(gblLanguage = "Arabic", "تعذر الإرسال.", "Submit failed."), NotificationType.Error)
                                                )
                                            )
                                        )
                                    )
                                )
                              Text: |-
                                =Switch(
                                    gblLeaveConfirmAction,
                                    "Delete", If(gblLanguage = "Arabic", "حذف", "Delete"),
                                    "Save", If(gblLanguage = "Arabic", "حفظ", "Save"),
                                    If(gblLanguage = "Arabic", "إرسال", "Submit")
                                )
                              Width: =120
