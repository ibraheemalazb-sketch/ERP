                              {
                                  RowKey: Text(lv.ID),
                                  Title: Coalesce(lv.LeaveType.Value, "-"),
                                  Subtitle: Text(lv.StartDate, "dd mmm yyyy") & " - " & Text(lv.EndDate, "dd mmm yyyy"),
                                  Column1: Coalesce(lv.Reason, "-"),
                                  Column2: "",
                                  Column3: "",
                                  Status: Coalesce(lv.Status.Value, "-"),
                                  Tone: Switch(lv.Status.Value, "Approved", "success", "Completed", "success", "Rejected", "danger", "Cancelled", "danger", "Pending", "pending", "Pending Approval", "pending", "Submitted", "info", ""),
                                  Priority: Text(Coalesce(lv.Duration, DateDiff(lv.StartDate, lv.EndDate, TimeUnit.Days) + 1)) & If(gblLanguage = "Arabic", " يوم", " days"),
                                  PriorityTone: "info",
                                  Person: Coalesce(lv.Approver.Value, "-"),
                                  WhenText: If(IsBlank(lv.StartDate), "-", Text(lv.StartDate, "dd mmm yyyy")),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: "Calendar"
                              }
                          )
                        LayoutMinHeight: =160
                        LayoutMinWidth: =280
                        OnMenuItemSelect: |-
                          =With(
                              {row: LookUp(colUserLeaveRequests, ID = Value(cmpLeaveMine.SelectedItem.RowKey))},
                              If(
                                  IsBlank(row),
                                  Notify(If(gblLanguage = "Arabic", "تعذر العثور على الطلب.", "That leave request could not be found."), NotificationType.Error),
                                  Switch(
                                      cmpLeaveMine.SelectedMenuItem.ItemKey,
                                      "view",
                                      Set(gblSelectedLeaveRequest, row);
                                      Set(gblLeaveRequestMode, "View");
                                      Set(VarShowLeave, true);
                                      Set(gblCanEditLeave, false),
                                      "edit",
                                      If(
                                          Coalesce(row.Status.Value, "") <> "Pending",
                                          Notify(If(gblLanguage = "Arabic", "يمكن تعديل الطلبات المعلّقة فقط.", "Only pending requests can be edited."), NotificationType.Warning),
                                          Set(gblSelectedLeaveRequest, row);
                                          Set(gblLeaveRequestMode, "Edit");
                                          Set(VarShowLeave, true);
                                          Set(gblCanEditLeave, true);
                                          Set(gblShowLeaveConfirm, false)
                                      ),
                                      "delete",
                                      If(
                                          Coalesce(row.Status.Value, "") <> "Pending",
                                          Notify(If(gblLanguage = "Arabic", "يمكن حذف الطلبات المعلّقة فقط.", "Only pending requests can be deleted."), NotificationType.Warning),
                                          Set(gblSelectedLeaveRequest, row);
                                          Set(gblLeaveConfirmAction, "Delete");
                                          Set(gblShowLeaveConfirm, true)
                                      ),
                                      "approve",
                                      If(
                                          Or(
                                              Coalesce(row.Status.Value, "") <> "Pending",
                                              And(
                                                  row.Approver.Id <> Coalesce(gblCurrentEmployee.ID, 0),
                                                  row.Approver.Id <> Coalesce(gblUser.ID, 0)
                                              )
                                          ),
                                          Notify(If(gblLanguage = "Arabic", "يمكن للمعتمد فقط الموافقة على الطلب المعلّق.", "Only the assigned approver can approve a pending request."), NotificationType.Warning),
                                          IfError(
                                              Set(
                                                  gblSelectedLeaveRequest,
                                                  Patch(
                                                      LeaveRequests,
                                                      LookUp(LeaveRequests, ID = row.ID),
                                                      {
                                                          Status: {Value: "Approved"},
                                                          ApprovalDate: Now(),
                                                          Approver: {Id: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0), Value: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")}
                                                      }
                                                  )
                                              );
                                              If(
                                                  !IsBlank(LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID)),
                                                  Remove(colUserLeaveRequests, LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID));
                                                  Collect(colUserLeaveRequests, gblSelectedLeaveRequest)
                                              );
                                              If(
                                                  !IsBlank(LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID)),
                                                  Remove(colLeaveAll, LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID));
                                                  Collect(colLeaveAll, gblSelectedLeaveRequest)
                                              );
                                              IfError(
                                                  With(
                                                      {
                                                          step: LookUp(ApprovalHistory, And(RequestItemID = Text(gblSelectedLeaveRequest.ID), EntityType.Value = "LeaveRequest", Decision.Value = "Pending")),
                                                          approverId: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                                                          projectId: Coalesce(LookUp(Employees, ID = gblSelectedLeaveRequest.EmployeeID).ProjectID, 0)
                                                      },
                                                      If(
                                                          IsBlank(step),
                                                          Patch(
                                                              ApprovalHistory,
                                                              Defaults(ApprovalHistory),
                                                              {
                                                                  Title: Left(Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " - " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, "Leave"), 255),
                                                                  RequestItemID: Text(gblSelectedLeaveRequest.ID),
                                                                  RequestType: {Value: "Leave Request"},
                                                                  RequestNumber: "LV-" & Text(gblSelectedLeaveRequest.ID, "000"),
                                                                  Decision: {Value: "Approved"},
                                                                  DecisionDate: Now(),
                                                                  Approver: {Id: approverId, Value: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")},
                                                                  ApproverID: approverId,
                                                                  Module: {Value: "HR"},
                                                                  Sequence: 1,
                                                                  EntityType: {Value: "LeaveRequest"},
                                                                  Requester: {Id: Coalesce(gblSelectedLeaveRequest.EmployeeID, 0), Value: Coalesce(gblSelectedLeaveRequest.Employee.Value, "")},
                                                                  AssignedDate: Now(),
                                                                  ProjectID: If(projectId > 0, projectId, Blank())
                                                              }
                                                          ),
                                                          Patch(ApprovalHistory, step, {Decision: {Value: "Approved"}, DecisionDate: Now()})
                                                      )
                                                  ),
                                                  Notify(If(gblLanguage = "Arabic", "تم اعتماد الإجازة. تعذر تحديث سجل الاعتماد.", "Leave approved. The approval history could not be updated."), NotificationType.Warning)
                                              );
                                              fnLogHR("Leave Request", gblSelectedLeaveRequest.ID, Text(gblSelectedLeaveRequest.ID), "Approved", "Important", Coalesce(LookUp(Employees, ID = gblSelectedLeaveRequest.EmployeeID).ProjectID, 0), Blank(), "", "Status", "Pending", "Approved", Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " · " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, ""), "", false);
                                              fnHRNotify(Coalesce(gblSelectedLeaveRequest.EmployeeID, 0), Coalesce(gblSelectedLeaveRequest.Employee.Value, ""), If(gblLanguage = "Arabic", "تمت الموافقة على الإجازة", "Leave approved"), Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " · " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, ""), "Leave Request", gblSelectedLeaveRequest.ID, "Leave Request");
                                              Notify(If(gblLanguage = "Arabic", "تمت الموافقة على الإجازة.", "Leave approved."), NotificationType.Success),
                                              Notify(If(gblLanguage = "Arabic", "تعذرت الموافقة.", "Approve failed."), NotificationType.Error)
                                          )
                                      ),
                                      "reject",
                                      If(
                                          Or(
                                              Coalesce(row.Status.Value, "") <> "Pending",
                                              And(
                                                  row.Approver.Id <> Coalesce(gblCurrentEmployee.ID, 0),
                                                  row.Approver.Id <> Coalesce(gblUser.ID, 0)
                                              )
                                          ),
                                          Notify(If(gblLanguage = "Arabic", "يمكن للمعتمد فقط رفض الطلب المعلّق.", "Only the assigned approver can reject a pending request."), NotificationType.Warning),
                                          IfError(
                                              Set(
                                                  gblSelectedLeaveRequest,
                                                  Patch(
                                                      LeaveRequests,
                                                      LookUp(LeaveRequests, ID = row.ID),
                                                      {
                                                          Status: {Value: "Rejected"},
                                                          ApprovalDate: Now(),
                                                          Approver: {Id: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0), Value: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")}
                                                      }
                                                  )
                                              );
                                              If(
                                                  !IsBlank(LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID)),
                                                  Remove(colUserLeaveRequests, LookUp(colUserLeaveRequests, ID = gblSelectedLeaveRequest.ID));
                                                  Collect(colUserLeaveRequests, gblSelectedLeaveRequest)
                                              );
                                              If(
                                                  !IsBlank(LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID)),
                                                  Remove(colLeaveAll, LookUp(colLeaveAll, ID = gblSelectedLeaveRequest.ID));
                                                  Collect(colLeaveAll, gblSelectedLeaveRequest)
                                              );
                                              IfError(
                                                  With(
                                                      {
                                                          step: LookUp(ApprovalHistory, And(RequestItemID = Text(gblSelectedLeaveRequest.ID), EntityType.Value = "LeaveRequest", Decision.Value = "Pending")),
                                                          approverId: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                                                          projectId: Coalesce(LookUp(Employees, ID = gblSelectedLeaveRequest.EmployeeID).ProjectID, 0)
                                                      },
                                                      If(
                                                          IsBlank(step),
                                                          Patch(
                                                              ApprovalHistory,
                                                              Defaults(ApprovalHistory),
                                                              {
                                                                  Title: Left(Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " - " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, "Leave"), 255),
                                                                  RequestItemID: Text(gblSelectedLeaveRequest.ID),
                                                                  RequestType: {Value: "Leave Request"},
                                                                  RequestNumber: "LV-" & Text(gblSelectedLeaveRequest.ID, "000"),
                                                                  Decision: {Value: "Rejected"},
                                                                  DecisionDate: Now(),
                                                                  Approver: {Id: approverId, Value: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")},
                                                                  ApproverID: approverId,
                                                                  Module: {Value: "HR"},
                                                                  Sequence: 1,
                                                                  EntityType: {Value: "LeaveRequest"},
                                                                  Requester: {Id: Coalesce(gblSelectedLeaveRequest.EmployeeID, 0), Value: Coalesce(gblSelectedLeaveRequest.Employee.Value, "")},
                                                                  AssignedDate: Now(),
                                                                  ProjectID: If(projectId > 0, projectId, Blank())
                                                              }
                                                          ),
                                                          Patch(ApprovalHistory, step, {Decision: {Value: "Rejected"}, DecisionDate: Now()})
                                                      )
                                                  ),
                                                  Notify(If(gblLanguage = "Arabic", "تم رفض الإجازة. تعذر تحديث سجل الاعتماد.", "Leave rejected. The approval history could not be updated."), NotificationType.Warning)
                                              );
                                              fnLogHR("Leave Request", gblSelectedLeaveRequest.ID, Text(gblSelectedLeaveRequest.ID), "Rejected", "Important", Coalesce(LookUp(Employees, ID = gblSelectedLeaveRequest.EmployeeID).ProjectID, 0), Blank(), "", "Status", "Pending", "Rejected", Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " · " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, ""), "", false);
                                              fnHRNotify(Coalesce(gblSelectedLeaveRequest.EmployeeID, 0), Coalesce(gblSelectedLeaveRequest.Employee.Value, ""), If(gblLanguage = "Arabic", "تم رفض الإجازة", "Leave rejected"), Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " · " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, ""), "Leave Request", gblSelectedLeaveRequest.ID, "Leave Request");
                                              Notify(If(gblLanguage = "Arabic", "تم رفض الإجازة.", "Leave rejected."), NotificationType.Success),
                                              Notify(If(gblLanguage = "Arabic", "تعذر الرفض.", "Reject failed."), NotificationType.Error)
                                          )
                                      )
                                  )
                              )
                          )
                        OnRowSelect: |-
                          =With(
