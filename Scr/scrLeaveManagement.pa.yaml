                                                    fnHRNotify(Coalesce(gblSelectedLeaveRequest.Approver.Id, gblCurrentEmployee.Manager.Id, 0), Coalesce(gblSelectedLeaveRequest.Approver.Value, gblCurrentEmployee.Manager.Value, ""), If(gblLanguage = "Arabic", "طلب إجازة جديد", "New leave request"), Coalesce(gblSelectedLeaveRequest.Employee.Value, "") & " · " & Coalesce(gblSelectedLeaveRequest.LeaveType.Value, ""), "Leave Request", gblSelectedLeaveRequest.ID, "Leave Request");
                                                    Notify(If(gblLanguage = "Arabic", "تم إرسال طلب الإجازة.", "Leave request submitted."), NotificationType.Success),
                                                    Notify(If(gblLanguage = "Arabic", "تعذر الإرسال.", "Submit failed."), NotificationType.Error)
                                                )
                                            )
                                        )
                                    )
