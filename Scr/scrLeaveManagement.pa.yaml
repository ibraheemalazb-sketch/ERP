                                          IconBg: If(gblTheme.Mode = "Dark", "#172030", "#ECF2FF"),
                                          IconColor: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                          SparklineData: "",
                                          isHidden: false
                                      },
                                      {
                                          ID: 2,
                                          Icon: "Heart",
                                          Value: Coalesce(sick.Used, 0),
                                          Label: If(gblLanguage = "Arabic", "الإجازة المرضية المستخدمة", "Sick Leave Used"),
                                          Subtitle: Text(Coalesce(sick.Remaining, 0), "0") & If(gblLanguage = "Arabic", " يوم متبقي", " days remaining"),
                                          Screen: "",
                                          IconBg: If(gblTheme.Mode = "Dark", "#632424", "#FEF2F2"),
                                          IconColor: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626"),
                                          SparklineData: "",
                                          isHidden: false
                                      },
                                      {
                                          ID: 3,
                                          Icon: "Warning",
                                          Value: Coalesce(emergency.Used, 0),
                                          Label: If(gblLanguage = "Arabic", "الإجازة الطارئة المستخدمة", "Emergency Leave Used"),
                                          Subtitle: Text(Coalesce(emergency.Remaining, 0), "0") & If(gblLanguage = "Arabic", " يوم متبقي", " days remaining"),
                                          Screen: "",
                                          IconBg: If(gblTheme.Mode = "Dark", "#5C400E", "#FFFBEB"),
                                          IconColor: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                                          SparklineData: "",
                                          isHidden: false
                                      },
                                      {
                                          ID: 4,
                                          Icon: "BarChart",
                                          Value: totalUsed,
                                          Label: If(gblLanguage = "Arabic", "إجمالي الإجازات", "All Leaves"),
                                          Subtitle: Text(totalUsed, "0") & If(gblLanguage = "Arabic", " مستخدم · ", " used · ") & Text(totalRemaining, "0") & If(gblLanguage = "Arabic", " متبقي", " remaining"),
                                          Screen: "",
                                          IconBg: If(gblTheme.Mode = "Dark", "#14532D", "#F0FDF4"),
                                          IconColor: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                                          SparklineData: "",
                                          isHidden: false
                                      }
                                  )
                              )
