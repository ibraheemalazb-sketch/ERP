                                          )
                                      )
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - cmbLeaveSubstitute:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الموظف البديل", "Substitute")
                                    DefaultSelectedItems: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.Substitute)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف البديل", "Substitute")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(LeaveRequests.Substitute)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - dteLeaveStart:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ البداية", "Start date")
                                    DefaultDate: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.StartDate)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(
                                          gblLeaveBalance,
                                          LookUp(
                                              colLeaveBalances,
                                              And(
                                                  LeaveType.Value = cmbLeaveType.Selected.Value,
                                                  LeaveYear = Year(Self.SelectedDate)
                                              )
                                          )
                                      )
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ البداية", "Start date")
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - dteLeaveEnd:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ النهاية", "End date")
                                    DefaultDate: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.EndDate)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ النهاية", "End date")
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                        - conLeaveBalance:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("SurfaceHover")
                              FillPortions: =0
                              Height: =If(App.Width < 700, 168, 96)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =gblTheme.Radius.Large
                              RadiusBottomRight: =gblTheme.Radius.Large
                              RadiusTopLeft: =gblTheme.Radius.Large
                              RadiusTopRight: =gblTheme.Radius.Large
                              Width: =Parent.Width
                            Children:
                              - lblLeaveBalanceTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: |-
                                      =If(gblLanguage = "Arabic", "رصيد الإجازات", "Leave Balance") & " · " &
                                      Coalesce(cmbLeaveType.Selected.Value, If(gblLanguage = "Arabic", "لم يتم الاختيار", "Not selected"))
                                    Width: =Parent.Width
                              - conLeaveBalanceTiles:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - lblLeaveDays:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =fxThemeColor("Primary")
                                          Fill: =fxThemeColor("PrimaryLighter")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =56
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =gblTheme.Radius.Medium
                                          RadiusBottomRight: =gblTheme.Radius.Medium
                                          RadiusTopLeft: =gblTheme.Radius.Medium
                                          RadiusTopRight: =gblTheme.Radius.Medium
                                          Size: =14
