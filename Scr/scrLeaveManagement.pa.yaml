                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Visible: =Or(VarNewLeave, And(VarShowLeave, gblLeaveRequestMode = "Edit"))
                  Width: =Parent.Width
                Children:
                  - conLeaveFormHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("SurfaceHover")
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        Width: =Parent.Width
                      Children:
                        - icoLeaveForm:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =28
                              Icon: ="Calendar"
                              IconColor: =fxThemeColor("Primary")
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =28
                        - lblLeaveFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =If(App.Width < 700, 14, 16)
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "طلب إجازة جديد", "New Leave Request"),
                                    If(gblLanguage = "Arabic", "طلب إجازة رقم ", "Leave Request #") & Coalesce(gblSelectedLeaveRequest.ID, "")
                                )
                              Width: =Parent.Width - 220
                        - lblLeaveFormStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =fxToneInk(If(gblLeaveRequestMode = "New", "", Switch(gblSelectedLeaveRequest.Status.Value, "Approved", "success", "Rejected", "danger", "Pending", "pending", "")))
                              Fill: =fxToneFill(If(gblLeaveRequestMode = "New", "", Switch(gblSelectedLeaveRequest.Status.Value, "Approved", "success", "Rejected", "danger", "Pending", "pending", "")))
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =gblTheme.Radius.Round
                              RadiusBottomRight: =gblTheme.Radius.Round
                              RadiusTopLeft: =gblTheme.Radius.Round
                              RadiusTopRight: =gblTheme.Radius.Round
                              Size: =11
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "مسودة", "Draft"),
                                    Switch(
                                        gblSelectedLeaveRequest.Status.Value,
                                        "Pending", If(gblLanguage = "Arabic", "قيد الانتظار", "Pending"),
                                        "Approved", If(gblLanguage = "Arabic", "معتمد", "Approved"),
                                        "Rejected", If(gblLanguage = "Arabic", "مرفوض", "Rejected"),
                                        "Cancelled", If(gblLanguage = "Arabic", "ملغى", "Cancelled"),
                                        Coalesce(gblSelectedLeaveRequest.Status.Value, "-")
                                    )
                                )
                              Width: =100
                        - btnLeaveFormBack:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "رجوع", "Back")
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="ArrowExit"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(VarNewLeave, false);
                                Set(VarShowLeave, false);
                                Set(gblLeaveRequestMode, Blank())
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "رجوع", "Back"))
                              Width: =If(App.Width < 700, 44, 90)
                  - conLeaveFormBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        Width: =Parent.Width
                      Children:
                        - lblLeaveFormSub:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.BodySmall
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "قدّم طلب إجازة للحصول على موافقة المدير", "Submit a leave request for manager approval"),
                                    Coalesce(gblSelectedLeaveRequest.Employee.Value, "")
                                )
                              Width: =Parent.Width
                        - conLeaveFormFields:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 320, 76)
                              LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - cmbLeaveType:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الإجازة", "Leave type")
                                    DefaultSelectedItems: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.LeaveType)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "نوع الإجازة", "Leave type")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(LeaveRequests.LeaveType)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(
                                          gblLeaveBalance,
                                          LookUp(
                                              colLeaveBalances,
                                              And(
                                                  LeaveType.Value = Self.Selected.Value,
                                                  LeaveYear = Year(Coalesce(dteLeaveStart.SelectedDate, Today()))
