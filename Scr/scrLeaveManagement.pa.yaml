                                ClearCollect(colLeaveBalances, Filter(LeaveBalances, EmployeeID = gblUser.ID))
                              Text: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Width: =110
                  - cmpLeaveKpi:
                      Control: CanvasComponent
                      ComponentName: cmpKPIwNav
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AnimationEffect: ="Pop"
                        ColumnsLayout: |-
                          ={
                              Mobile: 1,
                              Tablet: 2,
                              Desktop: 4,
                              MobileBreakpoint: 640,
                              TabletBreakpoint: 1024,
                              DesktopBreakpoint: 1366
                          }
                        Data: |-
                          =With(
                              {
                                  annual: LookUp(colLeaveBalances, And(LeaveYear = Year(Today()), LeaveType.Value = "Annual")),
                                  sick: LookUp(colLeaveBalances, And(LeaveYear = Year(Today()), LeaveType.Value = "Sick")),
                                  emergency: LookUp(colLeaveBalances, And(LeaveYear = Year(Today()), LeaveType.Value = "Emergency"))
                              },
                              With(
                                  {
                                      totalUsed: Coalesce(annual.Used, 0) + Coalesce(sick.Used, 0) + Coalesce(emergency.Used, 0),
                                      totalRemaining: Coalesce(annual.Remaining, 0) + Coalesce(sick.Remaining, 0) + Coalesce(emergency.Remaining, 0)
                                  },
                                  Table(
                                      {
                                          ID: 1,
                                          Icon: "Calendar",
                                          Value: Coalesce(annual.Used, 0),
                                          Label: If(gblLanguage = "Arabic", "الإجازة السنوية المستخدمة", "Annual Leave Used"),
                                          Subtitle: Text(Coalesce(annual.Remaining, 0), "0") & If(gblLanguage = "Arabic", " يوم متبقي", " days remaining"),
