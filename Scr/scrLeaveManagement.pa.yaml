                                                Or(IsBlank(cmbLeaveType.Selected), IsBlank(startDate), IsBlank(endDate), IsBlank(Trim(txtLeaveReason.Text)), endDate < startDate, workingDays <= 0, IsBlank(gblLeaveBalance), workingDays > gblLeaveBalance.Remaining),
                                                Notify(If(gblLanguage = "Arabic", "راجع بيانات الطلب قبل الإرسال.", "Check the request before submitting."), NotificationType.Error),
