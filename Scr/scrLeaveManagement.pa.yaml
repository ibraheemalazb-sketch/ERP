Screens:
  scrLeaveManagement:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "HR");
        Set(varNavSelectedID, 14);
        Set(VarHRmodule, "Leaves");
        If(IsBlank(VarLeavesTab), Set(VarLeavesTab, "userleaves"));
        If(IsBlank(varLeaveViewMode), Set(varLeaveViewMode, If(App.Width < 700, "list", "table")));
        If(IsBlank(varLeaveKpiOpen), Set(varLeaveKpiOpen, true));
        If(IsBlank(ShowLeaveFilter), Set(ShowLeaveFilter, false));
        Set(gblShowLeaveConfirm, false);
        Set(varLeavePeriod, "This Month");
        Set(varLeaveStart, Date(Year(Today()), Month(Today()), 1));
        Set(varLeaveEnd, DateAdd(Date(Year(Today()), Month(Today()), 1), 1, TimeUnit.Months));
        Set(varLeavePageNumber, 1);
        If(
            VarNewLeave,
            Set(gblLeaveRequestMode, "New");
            Set(VarShowLeave, false);
            Set(gblCanEditLeave, true),
            IsBlank(varCurrentLeave),
            Set(VarNewLeave, false);
            Set(VarShowLeave, false);
            Set(gblSelectedLeaveRequest, Blank());
            Set(gblLeaveRequestMode, Blank())
        );
        If(
            !varUserHasAllProjects,
            Clear(colUserAccessibleProjects);
            ForAll(
                Filter(colUserProjectAccess, AllProjects = false) As access,
                With(
                    {proj: LookUp(Projects, ID = access.ProjectID)},
                    If(!IsBlank(proj.ID), Collect(colUserAccessibleProjects, proj))
                )
            )
        );
        ClearCollect(colLeaveProjects, If(varUserHasAllProjects, Projects, colUserAccessibleProjects));
        Clear(colLeaveEmployees);
        If(
            varHRScope = "Own",
            Collect(colLeaveEmployees, Filter(Employees, ID = gblUser.ID)),
            If(
                Or(varHRScope = "All", varUserHasAllProjects),
                Collect(colLeaveEmployees, Employees),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colLeaveEmployees, Filter(Employees, ProjectID = proj.ID))
                )
            )
        );
        ClearCollect(colUserLeaveRequests, Filter(LeaveRequests, EmployeeID = gblUser.ID));
        ClearCollect(colLeaveBalances, Filter(LeaveBalances, EmployeeID = gblUser.ID));
        Clear(colLeaveAll);
        If(
            varHRScope = "Own",
            Collect(colLeaveAll, colUserLeaveRequests),
            If(
                Or(varHRScope = "All", varUserHasAllProjects),
                Collect(colLeaveAll, LeaveRequests),
                ForAll(
                    colLeaveEmployees As emp,
                    Collect(colLeaveAll, Filter(LeaveRequests, EmployeeID = emp.ID))
                )
            )
        );
        Reset(cmpLeaveMine);
        Reset(cmpLeaveAll);
        If(
            !IsBlank(varCurrentLeave),
            Set(gblSelectedLeaveRequest, If(IsBlank(LookUp(LeaveRequests, ID = varCurrentLeave.ID)), varCurrentLeave, LookUp(LeaveRequests, ID = varCurrentLeave.ID)));
            Set(gblLeaveRequestMode, "View");
            Set(VarShowLeave, true);
            Set(VarNewLeave, false);
            Set(gblCanEditLeave, false);
            Set(VarLeavesTab, If(Coalesce(gblSelectedLeaveRequest.EmployeeID, 0) = Coalesce(gblUser.ID, 0), "userleaves", "AllLeaves"));
            Set(varCurrentLeave, Blank())
        )
    Children:
      - conLeaveNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpLeaveNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
                    If(!gblMenuExpanded, Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conLeavePage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpLeavePhoneNav.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpLeaveTopBar.Height + 8
            Width: =Parent.Width
          Children:
            - conLeaveTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =!VarNewLeave
                  Width: =Parent.Width
                Children:
                  - btnLeaveMine:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إجازاتي", "My leaves")
                        Appearance: =If(VarLeavesTab = "userleaves", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="Person"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(VarLeavesTab, "userleaves")
                        Text: =If(gblLanguage = "Arabic", "إجازاتي", "My Leaves")
                        Width: =If(App.Width < 700, 120, 150)
                  - btnLeaveAll:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إجازات الموظفين", "All employee leaves")
                        Appearance: =If(VarLeavesTab = "AllLeaves", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="People"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(VarLeavesTab, "AllLeaves")
                        Text: =If(App.Width < 700, If(gblLanguage = "Arabic", "الجميع", "All"), If(gblLanguage = "Arabic", "إجازات الموظفين", "All Employees"))
                        Visible: =Coalesce(LookUp(colUserPermissions, Module.Value = "HR").CanViewAll, false)
                        Width: =If(App.Width < 700, 110, 170)
                  - btnLeaveNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "طلب إجازة جديد", "New leave request")
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(gblSelectedLeaveRequest, Blank());
                          Set(gblCanEditLeave, true);
                          Set(gblLeaveRequestMode, "New");
                          Set(gblLeaveBalance, Blank());
                          Set(VarShowLeave, false);
                          Set(VarNewLeave, true)
                        Text: =If(gblLanguage = "Arabic", "طلب إجازة جديد", "New Leave Request")
                        Visible: =App.Width >= 700
                        Width: =180
            - conLeaveForm:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =If(Or(VarNewLeave, And(VarShowLeave, gblLeaveRequestMode = "Edit")), 1, 0)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Visible: =Or(VarNewLeave, And(VarShowLeave, gblLeaveRequestMode = "Edit"))
                  Width: =Parent.Width
                Children:
                  - conLeaveFormHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("SurfaceHover")
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        Width: =Parent.Width
                      Children:
                        - icoLeaveForm:
                            Control: ModernIcon@1.1.1
                            Properties:
                              Height: =28
                              Icon: ="Calendar"
                              IconColor: =fxThemeColor("Primary")
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =28
                        - lblLeaveFormTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =If(App.Width < 700, 14, 16)
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "طلب إجازة جديد", "New Leave Request"),
                                    If(gblLanguage = "Arabic", "طلب إجازة رقم ", "Leave Request #") & Coalesce(gblSelectedLeaveRequest.ID, "")
                                )
                              Width: =Parent.Width - 220
                        - lblLeaveFormStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =fxToneInk(If(gblLeaveRequestMode = "New", "", Switch(gblSelectedLeaveRequest.Status.Value, "Approved", "success", "Rejected", "danger", "Pending", "pending", "")))
                              Fill: =fxToneFill(If(gblLeaveRequestMode = "New", "", Switch(gblSelectedLeaveRequest.Status.Value, "Approved", "success", "Rejected", "danger", "Pending", "pending", "")))
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =gblTheme.Radius.Round
                              RadiusBottomRight: =gblTheme.Radius.Round
                              RadiusTopLeft: =gblTheme.Radius.Round
                              RadiusTopRight: =gblTheme.Radius.Round
                              Size: =11
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "مسودة", "Draft"),
                                    Switch(
                                        gblSelectedLeaveRequest.Status.Value,
                                        "Pending", If(gblLanguage = "Arabic", "قيد الانتظار", "Pending"),
                                        "Approved", If(gblLanguage = "Arabic", "معتمد", "Approved"),
                                        "Rejected", If(gblLanguage = "Arabic", "مرفوض", "Rejected"),
                                        "Cancelled", If(gblLanguage = "Arabic", "ملغى", "Cancelled"),
                                        Coalesce(gblSelectedLeaveRequest.Status.Value, "-")
                                    )
                                )
                              Width: =100
                        - btnLeaveFormBack:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "رجوع", "Back")
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="ArrowExit"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(VarNewLeave, false);
                                Set(VarShowLeave, false);
                                Set(gblLeaveRequestMode, Blank())
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "رجوع", "Back"))
                              Width: =If(App.Width < 700, 44, 90)
                  - conLeaveFormBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        Width: =Parent.Width
                      Children:
                        - lblLeaveFormSub:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.BodySmall
                              Text: |-
                                =If(
                                    gblLeaveRequestMode = "New",
                                    If(gblLanguage = "Arabic", "قدّم طلب إجازة للحصول على موافقة المدير", "Submit a leave request for manager approval"),
                                    Coalesce(gblSelectedLeaveRequest.Employee.Value, "")
                                )
                              Width: =Parent.Width
                        - conLeaveFormFields:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 320, 76)
                              LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - cmbLeaveType:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الإجازة", "Leave type")
                                    DefaultSelectedItems: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.LeaveType)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "نوع الإجازة", "Leave type")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(LeaveRequests.LeaveType)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(
                                          gblLeaveBalance,
                                          LookUp(
                                              colLeaveBalances,
                                              And(
                                                  LeaveType.Value = Self.Selected.Value,
                                                  LeaveYear = Year(Coalesce(dteLeaveStart.SelectedDate, Today()))
                                              )
                                          )
                                      )
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - cmbLeaveSubstitute:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الموظف البديل", "Substitute")
                                    DefaultSelectedItems: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.Substitute)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف البديل", "Substitute")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(LeaveRequests.Substitute)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - dteLeaveStart:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ البداية", "Start date")
                                    DefaultDate: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.StartDate)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(
                                          gblLeaveBalance,
                                          LookUp(
                                              colLeaveBalances,
                                              And(
                                                  LeaveType.Value = cmbLeaveType.Selected.Value,
                                                  LeaveYear = Year(Self.SelectedDate)
                                              )
                                          )
                                      )
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ البداية", "Start date")
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                              - dteLeaveEnd:
                                  Control: ModernDatePicker@1.0.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ النهاية", "End date")
                                    DefaultDate: =If(gblLeaveRequestMode = "New", Blank(), gblSelectedLeaveRequest.EndDate)
                                    DisplayMode: =If(Or(gblLeaveRequestMode = "New", gblCanEditLeave), DisplayMode.Edit, DisplayMode.View)
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "تاريخ النهاية", "End date")
                                    Width: =If(App.Width < 700, Parent.Width, (Parent.Width - 24) / 4)
                        - conLeaveBalance:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("SurfaceHover")
                              FillPortions: =0
                              Height: =If(App.Width < 700, 168, 96)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =gblTheme.Radius.Large
                              RadiusBottomRight: =gblTheme.Radius.Large
                              RadiusTopLeft: =gblTheme.Radius.Large
                              RadiusTopRight: =gblTheme.Radius.Large
                              Width: =Parent.Width
                            Children:
                              - lblLeaveBalanceTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: |-
                                      =If(gblLanguage = "Arabic", "رصيد الإجازات", "Leave Balance") & " · " &
                                      Coalesce(cmbLeaveType.Selected.Value, If(gblLanguage = "Arabic", "لم يتم الاختيار", "Not selected"))
                                    Width: =Parent.Width
                              - conLeaveBalanceTiles:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Horizontal
