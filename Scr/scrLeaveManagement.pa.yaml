                                  cardBg: ColorValue("#FFFFFF"),
                                  border: ColorValue("#E5E7EB"),
                                  text: ColorValue("#111827"),
                                  textMuted: ColorValue("#6B7280"),
                                  positive: ColorValue("#22C55E"),
                                  negative: ColorValue("#EF4444"),
                                  neutral: ColorValue("#9E9E9E"),
                                  skeletonBase: ColorValue("#E5E7EB"),
                                  skeletonShine: ColorValue("#F3F4F6")
                              },
                              space: {xs: 4, sm: 8, md: 12, lg: 16, xl: 24},
                              radius: {md: 8, lg: 12},
                              type: {value: {size: 28, sizeCompact: 22}, label: {size: 12}, body: {size: 12}},
                              heights: {statsCardMax: 168},
                              abbreviateThreshold: 10000
                          }
                        SubtitleFS: =
                        Theme: =gblTheme.Mode
                        Visible: =Coalesce(varLeaveKpiOpen, true)
                        Width: =Parent.Width
                  - cmpLeaveMine:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =220
                        ContextMenuItems: |-
                          =Table(
                              {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض", "View"), ItemVisible: true},
                              {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: true},
                              {ItemKey: "delete", ItemDisplayName: If(gblLanguage = "Arabic", "حذف", "Delete"), ItemVisible: true},
                              {ItemKey: "approve", ItemDisplayName: If(gblLanguage = "Arabic", "موافقة", "Approve"), ItemVisible: CountRows(Filter(colUserLeaveRequests, And(Status.Value = "Pending", Or(Approver.Id = Coalesce(gblCurrentEmployee.ID, 0), Approver.Id = Coalesce(gblUser.ID, 0))))) > 0},
                              {ItemKey: "reject", ItemDisplayName: If(gblLanguage = "Arabic", "رفض", "Reject"), ItemVisible: CountRows(Filter(colUserLeaveRequests, And(Status.Value = "Pending", Or(Approver.Id = Coalesce(gblCurrentEmployee.ID, 0), Approver.Id = Coalesce(gblUser.ID, 0))))) > 0}
