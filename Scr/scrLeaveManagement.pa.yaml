                              Visible: =And(gblLeaveRequestMode = "Edit", gblCanEditLeave, gblSelectedLeaveRequest.Status.Value = "Pending")
                              Width: =110
                        - btnLeaveSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="Save"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(gblLeaveConfirmAction, "Save");
                                Set(gblShowLeaveConfirm, true)
                              Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                              Visible: =And(gblLeaveRequestMode = "Edit", gblCanEditLeave, gblSelectedLeaveRequest.Status.Value = "Pending")
                              Width: =120
                        - btnLeaveSubmit:
                            Control: ModernButton@1.0.0
                            Properties:
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="Send"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    {arabic: gblLanguage = "Arabic"},
                                    If(
                                        IsBlank(gblCurrentEmployee.Manager),
                                        Notify(If(arabic, "لا يوجد مدير معيّن لك. لا يمكن الإرسال.", "You do not have a manager assigned. Cannot submit."), NotificationType.Error),
                                        IsBlank(cmbLeaveType.Selected),
                                        Notify(If(arabic, "الرجاء اختيار نوع الإجازة.", "Please select a leave type."), NotificationType.Error),
                                        IsBlank(dteLeaveStart.SelectedDate),
                                        Notify(If(arabic, "الرجاء اختيار تاريخ البداية.", "Please select a start date."), NotificationType.Error),
                                        IsBlank(dteLeaveEnd.SelectedDate),
                                        Notify(If(arabic, "الرجاء اختيار تاريخ النهاية.", "Please select an end date."), NotificationType.Error),
                                        dteLeaveEnd.SelectedDate < dteLeaveStart.SelectedDate,
                                        Notify(If(arabic, "تاريخ النهاية لا يمكن أن يسبق تاريخ البداية.", "End date cannot be before start date."), NotificationType.Error),
                                        IsBlank(Trim(txtLeaveReason.Text)),
                                        Notify(If(arabic, "الرجاء كتابة سبب الإجازة.", "Please provide a reason for your leave request."), NotificationType.Error),
                                        With(
                                            {
                                                workingDays: CountIf(
                                                    ForAll(Sequence(DateDiff(dteLeaveStart.SelectedDate, dteLeaveEnd.SelectedDate) + 1), DateAdd(dteLeaveStart.SelectedDate, Value - 1)),
                                                    And(Weekday(Value, StartOfWeek.Monday) <> 5, Weekday(Value, StartOfWeek.Monday) <> 6)
                                                )
                                            },
                                            If(
                                                workingDays <= 0,
                                                Notify(If(arabic, "لا توجد أيام عمل في الفترة المحددة.", "No working days in the selected range."), NotificationType.Error),
                                                IsBlank(gblLeaveBalance),
                                                Notify(If(arabic, "لا يوجد رصيد لهذا النوع أو السنة.", "No leave balance record found for this leave type and year."), NotificationType.Error),
                                                workingDays > gblLeaveBalance.Remaining,
                                                Notify(If(arabic, "الرصيد غير كافٍ.", "Insufficient leave balance."), NotificationType.Error),
                                                Set(gblLeaveConfirmAction, "Submit");
                                                Set(gblShowLeaveConfirm, true)
                                            )
                                        )
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "إرسال", "Submit")
                              Visible: =gblLeaveRequestMode = "New"
                              Width: =120
