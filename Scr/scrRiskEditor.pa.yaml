Screens:
  scrRiskEditor:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PRisks");
        Set(varNavSelectedID, If(varRiskReturn = "project", 22, 28));
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        If(IsBlank(varRiskForm), Set(varRiskForm, "new"));
        ClearCollect(
            colRkEdStatus,
            {Value: "Identified"},
            {Value: "Under Assessment"},
            {Value: "Mitigation Planned"},
            {Value: "Mitigation In Progress"},
            {Value: "Accepted"}
        );
        ClearCollect(
            colRkEdTrend,
            {Value: "Rising"},
            {Value: "Stable"},
            {Value: "Falling"}
        );
        Reset(txtEdRkTitle);
        Reset(cmbEdRkProject);
        Reset(cmbEdRkCat);
        Reset(cmbEdRkPro);
        Reset(cmbEdRkImp);
        Reset(cmbEdRkOwn);
        Reset(cmbEdRkApr);
        Reset(cmbEdRkSt);
        Reset(cmbEdRkTrend);
        Reset(dteEdRkDate);
        Reset(dteEdRkReview);
        Reset(dteEdRkClose);
        Reset(txtEdRkTrigger);
        Reset(txtEdRkCost);
        Reset(txtEdRkResidual);
        Reset(txtEdRkDesc);
        Reset(txtEdRkMit);
        Reset(txtEdRkCont);
        Reset(txtEdRkResp)
    Children:
      - conEdRkNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpEdRkNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conEdRkPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpEdRkPhone.Height + 12, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpEdRkTop.Height + 12
            Width: =Parent.Width
          Children:
            - conEdRkCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =1680
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Min(760, Parent.Width)
                Children:
                  - conEdRkHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnEdRkBack:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              Icon: ="ArrowLeft"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    varRiskReturn = "project",
                                    Set(varProjectTab, "Risks");
                                    Set(varShowDetails, true);
                                    Navigate(ScrAllProjects, ScreenTransition.UnCover),
                                    Navigate(scrRisks, ScreenTransition.UnCover)
                                )
                              Text: =If(gblLanguage = "Arabic", "رجوع", "Back")
                              Width: =90
                        - lblEdRkTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              FillPortions: =1
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =16
                              Text: =If(varRiskForm = "new", If(gblLanguage = "Arabic", "مخاطرة جديدة", "New risk"), If(gblLanguage = "Arabic", "تعديل المخاطرة", "Edit risk"))
                              Width: =160
                              Wrap: =false
                  - lblEdRkSec1:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("Primary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: =If(gblLanguage = "Arabic", "الأساسيات", "Basics")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtEdRkTitle:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "عنوان المخاطرة", "Risk title")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.Title, ""))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "عنوان المخاطرة (صياغة الحدث)", "Risk title (describe the event)")
                        Width: =Parent.Width
                  - cmbEdRkProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        DefaultSelectedItems: |-
                          =If(
                              varRiskForm = "edit",
                              Filter(Projects, ID = varSelectedRisk.ProjectID),
                              If(Coalesce(varSelectedProject.ID, 0) > 0, Filter(Projects, ID = varSelectedProject.ID), Filter(Projects, false))
                          )
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        ItemDisplayText: =If(IsBlank(ThisItem.ProjectCode), ThisItem.Title, Concatenate(ThisItem.ProjectCode, " · ", ThisItem.Title))
                        Items: |-
                          =If(
                              varUserHasAllProjects,
                              Projects,
                              Filter(
                                  ForAll(
                                      Filter(colUserProjectAccess, AllProjects = false) As access,
                                      LookUp(Projects, ID = access.ProjectID)
                                  ),
                                  !IsBlank(ID)
                              )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - cmbEdRkCat:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الفئة", "Category")
                        DefaultSelectedItems: =If(varRiskForm = "edit", Filter(Choices(Risks.Category), Value = varSelectedRisk.Category.Value), Filter(Choices(Risks.Category), false))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الفئة", "Category")
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(Risks.Category)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - lblEdRkSec2:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("Primary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: =If(gblLanguage = "Arabic", "التقييم", "Assessment")
                        Width: =Parent.Width
                        Wrap: =false
                  - cmbEdRkPro:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الاحتمالية", "Probability")
                        DefaultSelectedItems: =If(varRiskForm = "edit", Filter(Choices(Risks.Probability), Value = varSelectedRisk.Probability.Value), Filter(Choices(Risks.Probability), Value = "Low"))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الاحتمالية", "Probability")
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(Risks.Probability)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - cmbEdRkImp:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الأثر", "Impact")
                        DefaultSelectedItems: =If(varRiskForm = "edit", Filter(Choices(Risks.Impact), Value = varSelectedRisk.Impact.Value), Filter(Choices(Risks.Impact), Value = "Low"))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الأثر", "Impact")
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(Risks.Impact)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - lblEdRkScore:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Fill: =fxThemeColor("SurfaceHover")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: |-
                          =With(
                              {
                                  pn: Switch(cmbEdRkPro.Selected.Value, "High", 3, "Medium", 2, "Low", 1, 0),
                                  im: Switch(cmbEdRkImp.Selected.Value, "High", 3, "Medium", 2, "Low", 1, 0)
                              },
                              With(
                                  {sc: pn * im},
                                  If(
                                      sc = 0,
                                      If(gblLanguage = "Arabic", "اختر الاحتمالية والأثر لحساب الدرجة", "Select probability and impact to calculate the score"),
                                      If(gblLanguage = "Arabic", "الدرجة ", "Score ") & sc & "  ·  " & If(sc >= 9, If(gblLanguage = "Arabic", "حرج", "Critical"), sc >= 6, If(gblLanguage = "Arabic", "مرتفع", "High"), sc >= 3, If(gblLanguage = "Arabic", "متوسط", "Medium"), If(gblLanguage = "Arabic", "منخفض", "Low"))
                                  )
                              )
                          )
                        Width: =Parent.Width
                        Wrap: =false
                  - cmbEdRkTrend:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الاتجاه", "Trend")
                        DefaultSelectedItems: =If(varRiskForm = "edit", Filter(colRkEdTrend, Value = varSelectedRisk.Trend.Value), Filter(colRkEdTrend, Value = "Stable"))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الاتجاه", "Trend")
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =colRkEdTrend
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - txtEdRkResidual:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الأثر المتبقي", "Residual impact")
                        Default: =If(Or(varRiskForm = "new", IsBlank(varSelectedRisk.ResidualImpact)), "", Text(varSelectedRisk.ResidualImpact))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "الأثر المتبقي (رقم)", "Residual impact (number)")
                        Width: =Parent.Width
                  - txtEdRkCost:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "التكلفة التقديرية", "Estimated cost")
                        Default: =If(Or(varRiskForm = "new", IsBlank(varSelectedRisk.EstimatedCost)), "", Text(varSelectedRisk.EstimatedCost))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "التكلفة التقديرية", "Estimated cost")
                        Width: =Parent.Width
                  - lblEdRkSec3:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("Primary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: =If(gblLanguage = "Arabic", "الملكية والتواريخ", "Ownership and dates")
                        Width: =Parent.Width
                        Wrap: =false
                  - cmbEdRkOwn:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "مسؤول المخاطرة", "Risk owner")
                        DefaultSelectedItems: |-
                          =If(
                              varRiskForm = "edit",
                              Filter(Employees, ID = Coalesce(varSelectedRisk.OwnerID, varSelectedRisk.Owner.Id)),
                              Filter(Employees, ID = varMeID)
                          )
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "مسؤول المخاطرة", "Risk owner")
                        ItemDisplayText: =ThisItem.FullName
                        Items: =Filter(Employees, Status.Value = "Active")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - cmbEdRkApr:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المعتمِد", "Approver")
                        DefaultSelectedItems: |-
                          =If(
                              And(varRiskForm = "edit", Coalesce(varSelectedRisk.ApproverID, 0) > 0),
                              Filter(Employees, ID = varSelectedRisk.ApproverID),
                              Filter(Employees, false)
                          )
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المعتمِد (اختياري)", "Approver (optional)")
                        ItemDisplayText: =ThisItem.FullName
                        Items: =Filter(Employees, Status.Value = "Active")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =Parent.Width
                  - cmbEdRkSt:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        DefaultSelectedItems: |-
                          =If(
                              varRiskForm = "edit",
                              Filter(colRkEdStatus, Value = varSelectedRisk.Status.Value),
                              Filter(colRkEdStatus, Value = "Identified")
                          )
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.Value
                        Items: =colRkEdStatus
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Visible: =varRiskForm = "edit"
                        Width: =Parent.Width
                  - dteEdRkDate:
                      Control: ModernDatePicker@1.0.2
                      Properties:
                        DefaultDate: =If(varRiskForm = "new", Today(), varSelectedRisk.RiskDate)
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "تاريخ المخاطرة", "Risk date")
                        Width: =Parent.Width
                  - dteEdRkReview:
                      Control: ModernDatePicker@1.0.2
                      Properties:
                        DefaultDate: =If(varRiskForm = "new", DateAdd(Today(), 30, TimeUnit.Days), varSelectedRisk.ReviewDate)
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "تاريخ المراجعة القادمة", "Next review date")
                        Width: =Parent.Width
                  - dteEdRkClose:
                      Control: ModernDatePicker@1.0.2
                      Properties:
                        DefaultDate: =If(varRiskForm = "new", Blank(), varSelectedRisk.ClosingDate)
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "تاريخ الإغلاق", "Closing date")
                        Visible: =false
                        Width: =Parent.Width
                  - txtEdRkTrigger:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "مؤشر التحفيز", "Trigger indicator")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.TriggerIndicator, ""))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "مؤشر التحفيز", "Trigger indicator")
                        Width: =Parent.Width
                  - lblEdRkSec4:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("Primary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Text: =If(gblLanguage = "Arabic", "الوصف والخطط", "Description and plans")
                        Width: =Parent.Width
                        Wrap: =false
                  - lblEdRkDescL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextSecondary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: =If(gblLanguage = "Arabic", "وصف المخاطرة", "Risk description")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtEdRkDesc:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "وصف المخاطرة", "Risk description")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.RiskDescription, ""))
                        Height: =160
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "اكتب وصفاً تفصيلياً للمخاطرة", "Write a detailed description of the risk")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - lblEdRkMitL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextSecondary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: =If(gblLanguage = "Arabic", "خطة المعالجة", "Mitigation plan")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtEdRkMit:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "خطة المعالجة", "Mitigation plan")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.Mitigation, ""))
                        Height: =160
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "ما الإجراءات التي ستقلل الاحتمالية أو الأثر؟", "What actions will reduce the probability or impact?")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - lblEdRkContL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextSecondary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: =If(gblLanguage = "Arabic", "خطة الطوارئ", "Contingency plan")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtEdRkCont:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "خطة الطوارئ", "Contingency plan")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.ContingencyPlan, ""))
                        Height: =160
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "ماذا تفعل إذا تحققت المخاطرة؟", "What will you do if the risk materializes?")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - lblEdRkRespL:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextSecondary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: =If(gblLanguage = "Arabic", "الاستجابة", "Response")
                        Width: =Parent.Width
                        Wrap: =false
                  - txtEdRkResp:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الاستجابة", "Response")
                        Default: =If(varRiskForm = "new", "", Coalesce(varSelectedRisk.Response, ""))
                        Height: =160
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "استراتيجية الاستجابة (تجنب، تخفيف، نقل، قبول…)", "Response strategy (avoid, mitigate, transfer, accept…)")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - conEdRkSave:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =44
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - btnEdRkCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    varRiskReturn = "project",
                                    Set(varProjectTab, "Risks");
                                    Set(varShowDetails, true);
                                    Navigate(ScrAllProjects, ScreenTransition.UnCover),
                                    Navigate(scrRisks, ScreenTransition.UnCover)
                                )
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =90
                        - btnEdRkSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    {
                                        isNew: varRiskForm = "new",
                                        ar: gblLanguage = "Arabic",
                                        pn: Switch(cmbEdRkPro.Selected.Value, "High", 3, "Medium", 2, "Low", 1, 0),
                                        im: Switch(cmbEdRkImp.Selected.Value, "High", 3, "Medium", 2, "Low", 1, 0)
                                    },
                                    If(
                                        IsBlank(Trim(txtEdRkTitle.Text)),
                                        Notify(If(ar, "يرجى إدخال عنوان المخاطرة.", "Please enter a risk title."), NotificationType.Error),
                                        IsBlank(cmbEdRkProject.Selected),
                                        Notify(If(ar, "يرجى اختيار المشروع.", "Please select a project."), NotificationType.Error),
                                        IsBlank(cmbEdRkCat.Selected),
                                        Notify(If(ar, "يرجى اختيار الفئة.", "Please select a category."), NotificationType.Error),
                                        Or(IsBlank(cmbEdRkPro.Selected), IsBlank(cmbEdRkImp.Selected), pn = 0, im = 0),
                                        Notify(If(ar, "يرجى اختيار الاحتمالية والأثر.", "Please select probability and impact."), NotificationType.Error),
                                        IsBlank(cmbEdRkOwn.Selected),
                                        Notify(If(ar, "يرجى اختيار مسؤول المخاطرة.", "Please select the risk owner."), NotificationType.Error),
                                        And(Not(IsBlank(dteEdRkReview.SelectedDate)), Not(IsBlank(dteEdRkDate.SelectedDate)), dteEdRkReview.SelectedDate < dteEdRkDate.SelectedDate),
                                        Notify(If(ar, "لا يمكن أن يسبق تاريخ المراجعة تاريخ المخاطرة.", "Review date cannot be earlier than the risk date."), NotificationType.Error),
                                        And(Not(IsBlank(Trim(txtEdRkResidual.Text))), Not(IsNumeric(txtEdRkResidual.Text))),
                                        Notify(If(ar, "الأثر المتبقي يجب أن يكون رقماً.", "Residual impact must be a number."), NotificationType.Error),
                                        And(Not(IsBlank(Trim(txtEdRkCost.Text))), Not(IsNumeric(txtEdRkCost.Text))),
                                        Notify(If(ar, "التكلفة التقديرية يجب أن تكون رقماً.", "Estimated cost must be a number."), NotificationType.Error),
                                        With(
                                            {
                                                pid: cmbEdRkProject.Selected.ID,
                                                ptt: cmbEdRkProject.Selected.Title,
                                                sc: pn * im,
                                                notifyOwner: Or(isNew, cmbEdRkOwn.Selected.ID <> Coalesce(varSelectedRisk.OwnerID, 0))
                                            },
                                            Set(
                                                varEdSaved,
                                                IfError(
                                                    Patch(
                                                        Risks,
                                                        If(isNew, Defaults(Risks), LookUp(Risks, ID = varSelectedRisk.ID)),
                                                        {
                                                            Title: Trim(txtEdRkTitle.Text),
                                                            Project: {Id: pid, Value: ptt},
                                                            ProjectID: pid,
                                                            Category: {Value: cmbEdRkCat.Selected.Value},
                                                            Probability: {Value: cmbEdRkPro.Selected.Value},
                                                            Impact: {Value: cmbEdRkImp.Selected.Value},
                                                            Score: sc,
                                                            Level: {Value: If(sc >= 9, "Critical", sc >= 6, "High", sc >= 3, "Medium", "Low")},
                                                            Mitigation: txtEdRkMit.Text,
                                                            ContingencyPlan: txtEdRkCont.Text,
                                                            Response: txtEdRkResp.Text,
                                                            RiskDescription: txtEdRkDesc.Text,
                                                            TriggerIndicator: Trim(txtEdRkTrigger.Text),
                                                            EstimatedCost: If(IsBlank(Trim(txtEdRkCost.Text)), Blank(), Value(txtEdRkCost.Text)),
                                                            ResidualImpact: If(IsBlank(Trim(txtEdRkResidual.Text)), Blank(), Value(txtEdRkResidual.Text)),
                                                            Trend: {Value: Coalesce(cmbEdRkTrend.Selected.Value, "Stable")},
                                                            Owner: {Id: cmbEdRkOwn.Selected.ID, Value: cmbEdRkOwn.Selected.FullName},
                                                            OwnerID: cmbEdRkOwn.Selected.ID,
                                                            Approver: If(IsBlank(cmbEdRkApr.Selected), Blank(), {Id: cmbEdRkApr.Selected.ID, Value: cmbEdRkApr.Selected.FullName}),
                                                            ApproverID: If(IsBlank(cmbEdRkApr.Selected), Blank(), cmbEdRkApr.Selected.ID),
                                                            Status: {Value: If(isNew, "Identified", Coalesce(cmbEdRkSt.Selected.Value, varSelectedRisk.Status.Value, "Identified"))},
                                                            RiskDate: dteEdRkDate.SelectedDate,
                                                            ReviewDate: dteEdRkReview.SelectedDate
                                                        }
                                                    ),
                                                    Blank()
                                                )
                                            );
                                            If(
                                                IsBlank(varEdSaved),
                                                Notify(If(ar, "لم يتم حفظ المخاطرة. حاول مرة أخرى.", "Risk was not saved. Please try again."), NotificationType.Error),
                                                If(
                                                    And(notifyOwner, cmbEdRkOwn.Selected.ID <> varMeID),
                                                    fnProjNotify(
                                                        cmbEdRkOwn.Selected.ID,
                                                        cmbEdRkOwn.Selected.FullName,
                                                        "تم إسناد مخاطرة إليك / Risk assigned to you: " & Trim(txtEdRkTitle.Text),
                                                        Coalesce(gblUser.FullName, ""),
                                                        "Risk",
                                                        varEdSaved.ID,
                                                        "Risk"
                                                    )
                                                );
                                                fnProjLog(
                                                    "Risk: " & Trim(txtEdRkTitle.Text),
                                                    pid,
                                                    ptt,
                                                    "Risk",
                                                    varEdSaved.ID,
                                                    If(isNew, "Created", "Updated"),
                                                    "Score " & sc
                                                );
                                                Set(varSelectedRisk, varEdSaved);
                                                Set(gblSelectedRiskID, varEdSaved.ID);
                                                Set(varSelectedProject, cmbEdRkProject.Selected);
                                                Notify(
                                                    If(
                                                        isNew,
                                                        If(ar, "تم تسجيل المخاطرة بنجاح.", "Risk registered successfully."),
                                                        If(ar, "تم تحديث المخاطرة بنجاح.", "Risk updated successfully.")
                                                    ),
                                                    NotificationType.Success
                                                );
                                                If(
                                                    varRiskReturn = "project",
                                                    Set(varProjectTab, "Risks");
                                                    Set(varShowDetails, true);
                                                    Navigate(ScrAllProjects, ScreenTransition.UnCover),
                                                    Navigate(scrRisks, ScreenTransition.UnCover)
                                                )
                                            )
                                        )
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                              Width: =90
      - cmpEdRkTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
