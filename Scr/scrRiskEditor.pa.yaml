            ScreenSubtitle: =If(varRiskForm = "new", If(gblLanguage = "Arabic", "مخاطرة جديدة", "New risk"), If(gblLanguage = "Arabic", "تعديل المخاطرة", "Edit risk"))
            ScreenTitle: =If(gblLanguage = "Arabic", "البرامج", "Programs")
            ShowBreadcrumb: =true
