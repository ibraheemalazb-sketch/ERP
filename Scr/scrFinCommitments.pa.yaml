      - btnComQuery:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({
                  locLoading: true, locError: false,
                  locQ: {
                      Project: Coalesce(varProjectID, 0),
                      Search: cmpFilterBar_Com.SearchText,
                      PayStatus: cmpFilterBar_Com.SelectedStatus,
                      Vendor: Coalesce(drpComVendor.Selected.Key, 0),
                      Overdue: drpComDelivery.Selected.Key = "overdue",
                      Today: Today()
                  }
              });
              // scoped user + "All my projects": latest page of each project (no paging); otherwise one delegable query
              UpdateContext({locPerProject: !canViewAllProjects && locQ.Project = 0});
              IfError(
                  If(
                      locPerProject,
                      Clear(colComRaw);
                      ForAll(colMyProjects As p, Collect(colComRaw, ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PurchaseOrders,
                                      ProjectID = p.ID,
                                      IsBlank(locQ.Search) || StartsWith(PONumber, locQ.Search),
                                      IsBlank(locQ.PayStatus) || PaymentStatus.Value = locQ.PayStatus,
                                      locQ.Vendor = 0 || VendorID = locQ.Vendor,
                                      !locQ.Overdue || ExpectedDeliveryDate < locQ.Today
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As o,
                          With(
                              {_rv: If(Coalesce(o.OrderdQty, 0) > 0, o.Total * Min(1, Coalesce(o.ReceivedQty, 0) / o.OrderdQty), Blank())},
                              {
                                  ID: o.ID, PONumber: o.PONumber, Title: o.Title, ProjectID: o.ProjectID, ProjectCode: o.Project.Value,
                                  Supplier: o.Supplier.Value, VendorID: o.VendorID, PRID: o.PRID, Currency: o.Currency.Value,
                                  Total: o.Total, PaidAmount: o.PaidAmount, ApprovalStatus: o.Status.Value, POStatus: o.POStatus.Value,
                                  PaymentStatus: o.PaymentStatus.Value, IssueDate: o.IssueDate, ExpectedDeliveryDate: o.ExpectedDeliveryDate,
                                  OrderdQty: o.OrderdQty, ReceivedQty: o.ReceivedQty,
                                  ReceivedValue: _rv,
                                  Outstanding: Coalesce(o.Total, 0) - Coalesce(o.PaidAmount, 0),
                                  Overdue: !IsBlank(o.ExpectedDeliveryDate) && o.ExpectedDeliveryDate < Today() &&
                                      Coalesce(o.ReceivedQty, 0) < Coalesce(o.OrderdQty, 0) && !(o.POStatus.Value in cfgPOClosedStatus),
                                  RecvUnpaid: Coalesce(_rv, 0) - Coalesce(o.PaidAmount, 0) > cfgComTolerance
                              }
                          )
                      ))),
                      ClearCollect(
                          colComRaw,
                      ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      PurchaseOrders,
                                      locQ.Project = 0 || ProjectID = locQ.Project,
                                      IsBlank(locQ.Search) || StartsWith(PONumber, locQ.Search),
                                      IsBlank(locQ.PayStatus) || PaymentStatus.Value = locQ.PayStatus,
                                      locQ.Vendor = 0 || VendorID = locQ.Vendor,
                                      !locQ.Overdue || ExpectedDeliveryDate < locQ.Today,
                                      locCursor = 0 || ID < locCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As o,
                          With(
                              {_rv: If(Coalesce(o.OrderdQty, 0) > 0, o.Total * Min(1, Coalesce(o.ReceivedQty, 0) / o.OrderdQty), Blank())},
                              {
                                  ID: o.ID, PONumber: o.PONumber, Title: o.Title, ProjectID: o.ProjectID, ProjectCode: o.Project.Value,
                                  Supplier: o.Supplier.Value, VendorID: o.VendorID, PRID: o.PRID, Currency: o.Currency.Value,
                                  Total: o.Total, PaidAmount: o.PaidAmount, ApprovalStatus: o.Status.Value, POStatus: o.POStatus.Value,
                                  PaymentStatus: o.PaymentStatus.Value, IssueDate: o.IssueDate, ExpectedDeliveryDate: o.ExpectedDeliveryDate,
                                  OrderdQty: o.OrderdQty, ReceivedQty: o.ReceivedQty,
                                  ReceivedValue: _rv,
                                  Outstanding: Coalesce(o.Total, 0) - Coalesce(o.PaidAmount, 0),
                                  Overdue: !IsBlank(o.ExpectedDeliveryDate) && o.ExpectedDeliveryDate < Today() &&
                                      Coalesce(o.ReceivedQty, 0) < Coalesce(o.OrderdQty, 0) && !(o.POStatus.Value in cfgPOClosedStatus),
                                  RecvUnpaid: Coalesce(_rv, 0) - Coalesce(o.PaidAmount, 0) > cfgComTolerance
                              }
                          )
                      )
                      )
                  );
                  // overdue = expected date passed (server side) AND not fully received AND not closed (client side, this page only)
                  ClearCollect(colComPage, Sort(Filter(colComRaw, !locQ.Overdue || Overdue), ID, SortOrder.Descending)),
                  UpdateContext({locError: true});
                  Trace("PO query failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false})
