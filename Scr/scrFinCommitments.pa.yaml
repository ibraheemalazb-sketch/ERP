      - btnComOpen:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locDrawer: true, locDrawerLoading: true, locDrawerErr: false});
              IfError(
                  UpdateContext({locPORec: LookUp(PurchaseOrders, ID = locPOID)});
                  // scope check: the PO's project must be one of mine unless I see all projects
                  If(
                      IsBlank(locPORec) || (!canViewAllProjects && IsBlank(LookUp(colMyProjects, ID = locPORec.ProjectID))),
                      UpdateContext({locDrawer: false});
                      Notify(fnT("com.noAccess", "This purchase order does not exist or belongs to a project you cannot access."), NotificationType.Warning),
                      With(
                          {o: locPORec},
                          UpdateContext({locPO: With(
                                  {_rv: If(Coalesce(o.OrderdQty, 0) > 0, o.Total * Min(1, Coalesce(o.ReceivedQty, 0) / o.OrderdQty), Blank())},
                                  {
                                      ID: o.ID, PONumber: o.PONumber, Title: o.Title, ProjectID: o.ProjectID, ProjectCode: o.Project.Value,
                                      Supplier: o.Supplier.Value, VendorID: o.VendorID, PRID: o.PRID, Currency: o.Currency.Value,
                                      Total: o.Total, PaidAmount: o.PaidAmount, ApprovalStatus: o.Status.Value, POStatus: o.POStatus.Value,
                                      PaymentStatus: o.PaymentStatus.Value, IssueDate: o.IssueDate, ExpectedDeliveryDate: o.ExpectedDeliveryDate,
                                      OrderdQty: o.OrderdQty, ReceivedQty: o.ReceivedQty,
                                      ReceivedValue: _rv,
                                      Outstanding: Coalesce(o.Total, 0) - Coalesce(o.PaidAmount, 0),
                                      Overdue: !IsBlank(o.ExpectedDeliveryDate) && o.ExpectedDeliveryDate < Today() &&
                                          Coalesce(o.ReceivedQty, 0) < Coalesce(o.OrderdQty, 0) && !(o.POStatus.Value in cfgPOClosedStatus),
                                      RecvUnpaid: Coalesce(_rv, 0) - Coalesce(o.PaidAmount, 0) > cfgComTolerance
                                  }
                              )})
                      );
                      Concurrent(
                          // POID is the documented filter column of PurchaseOrderLines
                          ClearCollect(colComLines, ForAll(FirstN(Sort(Filter(PurchaseOrderLines, POID = locPOID), LineNumber, SortOrder.Ascending), 200) As l,
                              {ID: l.ID, LineNumber: l.LineNumber, BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLine.Value, Title: l.Title,
                               Quantity: l.Quantity, UnitPrice: l.UnitPrice, Total: l.Total, ReceivedQuantity: l.ReceivedQuantity,
                               RemainingQuantity: l.RemainingQuantity, LineStatus: l.LineStatus.Value,
                               ReceivedValue: Coalesce(l.ReceivedQuantity, 0) * Coalesce(l.UnitPrice, 0)})),
                          // ledger rows posted by flow 1 for this PO (SourceModule is Indexed; SourceID index requested, question H7)
                          ClearCollect(colComTxn, ForAll(FirstN(Sort(Filter(FinancialTransactions, SourceModule.Value = cfgSourceModule.PurchaseOrder,
                              SourceID = locPOID), ID, SortOrder.Descending), 20) As t,
                              {ID: t.ID, TransactionNumber: t.TransactionNumber, PeriodKey: t.PeriodKey, Type: t.TransactionType.Value,
                               Amount: t.Amount, Currency: t.Currency.Value, AmountUSD: t.AmountUSD, Status: t.Status.Value}))
                      )
                  ),
                  UpdateContext({locDrawerErr: true});
                  Trace("PO detail failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locDrawerLoading: false})
      - btnComLite:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =If(IsEmpty(colVendorsLite), IfError(ClearCollect(colVendorsLite, ForAll(FirstN(Sort(Vendors, ID, SortOrder.Ascending), 2000) As v, {Key: v.ID, Value: v.Title})), Trace("Vendors load failed: " & FirstError.Message, TraceSeverity.Warning)))
      - tmrComBoot:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Duration: =300
            Start: =varFinReady && !locBooted
            AutoStart: =false
            Repeat: =false
            OnTimerEnd: |-
              =UpdateContext({locBooted: true});
              UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery);
              Select(btnComTotals);
              If(Coalesce(varComPOID, 0) > 0, UpdateContext({locPOID: varComPOID}); Set(varComPOID, 0); Select(btnComOpen))
