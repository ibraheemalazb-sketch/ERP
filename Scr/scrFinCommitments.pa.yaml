# scrFinCommitments - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinCommitments, set its properties from 04-screens-batch-b.md,
# then paste screens/paste/scrFinCommitments.controls.pa.yaml onto it.
Screens:
  scrFinCommitments:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 52);
        If(
            !hasFinanceAccess,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locMoreOpen: false, locNotifOpen: false, locFilterSheet: false, locDrawer: false});
            fnRefreshHeaderData();
            Select(btnComLite);
            If(varFinReady, UpdateContext({locBooted: true}); UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery);
        Select(btnComTotals);
        If(Coalesce(varComPOID, 0) > 0, UpdateContext({locPOID: varComPOID}); Set(varComPOID, 0); Select(btnComOpen)))
        )
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_Com:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_Com:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Navigate(scrFinance, ScreenTransition.None)
            ScreenTitle: =fnT("nav.commitments", "Procurement commitments")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_Com:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conComRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conComMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - cmpCtx_Com:
                    Control: CanvasComponent
                    ComponentName: cmpFinContext
                    Properties:
                      ProjectOptions: |-
                        =Table({Key: 0, Value: fnT("hdr.allProjects", "All my projects")}, colProjectOptions)
                      PeriodOptions: =tblPeriods
                      DefaultProjectKey: =Coalesce(varProjectID, 0)
                      DefaultPeriodKey: =Coalesce(varPeriodKey, currentPeriodKey)
                      Height: =48
                      FillPortions: =0
                      AlignInContainer: =AlignInContainer.Stretch
                      LayoutMinWidth: =0
                      LayoutMinHeight: =0
                      OnProjectChange: |-
                        =Set(varProjectID, cmpCtx_Com.SelectedProjectKey);
                        UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery);
                        Select(btnComTotals)
                      OnPeriodChange: =Set(varPeriodKey, cmpCtx_Com.SelectedPeriodKey)
                  - conComBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - conComKPI:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp2
                              LayoutWrap: =true
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =true
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =RoundUp(4 / kpiColumns, 0) * 128 + (RoundUp(4 / kpiColumns, 0) - 1) * sp2
                            Children:
                              - cmpKPI_ComCommitted:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("com.kpiCommitted", "Open commitments")
                                    KPIValue: =locTot.Committed
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =If(Coalesce(varProjectID, 0) = 0, fnT("com.pickProject", "Select a project"), fnT("com.stored", "Budgets, stored by flow (USD est.)"))
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_ComProc:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("com.kpiProc", "Procurement spent")
                                    KPIValue: =locTot.Procurement
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =If(Coalesce(varProjectID, 0) = 0, fnT("com.pickProject", "Select a project"), fnT("com.stored", "Budgets, stored by flow (USD est.)"))
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_ComOverdue:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("com.kpiOverdue", "Overdue deliveries")
                                    KPIValue: =CountRows(Filter(colComPage, Overdue))
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =If(CountRows(Filter(colComPage, Overdue)) > 0, "danger", "")
                                    Subtext: =fnT("com.thisPage", "on this page")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_ComRecvUnpaid:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("com.kpiRecvUnpaid", "Received, not fully paid")
                                    KPIValue: =CountRows(Filter(colComPage, RecvUnpaid))
                                    ValueFormat: ="count"
                                    Currency: ="USD"
                                    Tone: =If(CountRows(Filter(colComPage, RecvUnpaid)) > 0, "warning", "")
                                    Subtext: =fnT("com.thisPage", "on this page")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conComListCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =cmpFilterBar_Com.DesiredHeight + sp1 + If(conComExtra.Visible, conComExtra.Height + sp1, 0) + If(locError, 240, If(isMobile, Max(1, Min(CountRows(colComPage), 8)) * 104 + 60, 40 + Max(1, Min(CountRows(colComPage), 12)) * 52 + 60)) + sp1 + 36 + 2 * sp2
                            Children:
                              - cmpFilterBar_Com:
                                  Control: CanvasComponent
                                  ComponentName: cmpFilterBar
                                  Properties:
                                    ShowSearch: =true
                                    SearchHint: =fnT("com.searchHint", "PO number starts with...")
                                    ShowStatus: =true
                                    StatusOptions: =Choices([@PurchaseOrders].PaymentStatus)
                                    ShowPeriod: =false
                                    ShowProject: =false
                                    SheetOpen: =locFilterSheet
                                    Height: =cmpFilterBar_Com.DesiredHeight
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnChange: |-
                                      =UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery)
                                    OnClear: |-
                                      =Reset(drpComVendor); Reset(txtComVendorSearch); Reset(drpComDelivery); UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery)
                                    OnToggleSheet: |-
                                      =UpdateContext({locFilterSheet: !locFilterSheet})
                              - conComExtra:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =sp1
                                    LayoutWrap: =true
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Visible: =!isMobile || locFilterSheet
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 3 * touchMin + 2 * sp1, touchMin)
                                  Children:
                                    - txtComVendorSearch:
                                        Control: Classic/TextInput@2.3.2
                                        Properties:
                                          Default: =""
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          HoverFill: =FinTheme.Surface
                                          HoverBorderColor: =FinTheme.Primary
                                          HintText: =fnT("com.vendorSearch", "Find vendor")
                                          Height: =touchMin
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          Align: =alignStart
                                          TabIndex: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Width: =If(isMobile, Parent.Width, 200)
                                          FillPortions: =0
                                          AccessibleLabel: =fnT("com.vendorSearch", "Find vendor")
                                          DelayOutput: =true
                                    - drpComVendor:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          HoverFill: =FinTheme.RowHover
                                          HoverBorderColor: =FinTheme.Primary
                                          HoverColor: =FinTheme.Text
                                          PressedFill: =FinTheme.RowSelected
                                          PressedColor: =FinTheme.Text
                                          SelectionFill: =FinTheme.Primary
                                          SelectionColor: =FinTheme.OnPrimary
                                          ChevronBackground: =FinTheme.Surface
                                          ChevronFill: =FinTheme.TextSecondary
                                          PaddingLeft: =8
                                          Height: =touchMin
                                          TabIndex: =0
                                          AllowEmptySelection: =false
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Items: |-
                                            =Table({Key: 0, Value: fnT("com.allVendors", "All vendors")}, Sort(Filter(colVendorsLite, !IsBlank(txtComVendorSearch.Text) && StartsWith(Value, txtComVendorSearch.Text)), Value, SortOrder.Ascending))
                                          Width: =If(isMobile, Parent.Width, 240)
                                          FillPortions: =0
                                          AccessibleLabel: =fnT("com.vendor", "Vendor")
                                          OnChange: |-
                                            =UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery)
                                    - drpComDelivery:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =FinTheme.Surface
                                          BorderColor: =FinTheme.Border
                                          BorderThickness: =1
                                          FocusedBorderThickness: =2
                                          FocusedBorderColor: =FinTheme.Focus
                                          HoverFill: =FinTheme.RowHover
                                          HoverBorderColor: =FinTheme.Primary
                                          HoverColor: =FinTheme.Text
                                          PressedFill: =FinTheme.RowSelected
                                          PressedColor: =FinTheme.Text
                                          SelectionFill: =FinTheme.Primary
                                          SelectionColor: =FinTheme.OnPrimary
                                          ChevronBackground: =FinTheme.Surface
                                          ChevronFill: =FinTheme.TextSecondary
                                          PaddingLeft: =8
                                          Height: =touchMin
                                          TabIndex: =0
                                          AllowEmptySelection: =false
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Items: |-
                                            =Table({Key: "", Value: fnT("com.allDeliveries", "All deliveries")}, {Key: "overdue", Value: fnT("com.overdueOnly", "Overdue delivery")})
                                          Width: =If(isMobile, Parent.Width, 200)
                                          FillPortions: =0
                                          AccessibleLabel: =fnT("com.delivery", "Delivery")
                                          OnChange: |-
                                            =UpdateContext({locCursor: 0, locPage: 1}); Clear(colComStack); Select(btnComQuery)
                              - cmpEmpty_ComErr:
                                  Control: CanvasComponent
                                  ComponentName: cmpEmptyState
                                  Properties:
                                    Visible: =locError
                                    Variant: ="error"
                                    Message: =fnT("common.loadError", "The data could not be loaded.")
                                    Height: =240
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    ActionText: =fnT("common.retry", "Retry")
                                    OnAction: =Select(btnComQuery)
                              - cmpDataTable_Com:
                                  Control: CanvasComponent
                                  ComponentName: cmpDataTable
                                  Properties:
                                    Visible: =!locError
                                    RowItems: |-
                                      =ForAll(colComPage As r, {RowID: r.ID, Primary: Coalesce(r.PONumber, r.Title), Secondary: Coalesce(r.Supplier, "-") & If(r.Overdue, " | ⚠ " & fnT("com.overdue", "Delivery overdue") & " " & DateDiff(r.ExpectedDeliveryDate, Today(), TimeUnit.Days) & " " & fnT("common.days", "days"), "") & If(r.RecvUnpaid, " | ⚑ " & fnT("com.recvUnpaid", "Received, not fully paid"), ""), C1: r.ProjectCode, C2: If(IsBlank(r.ReceivedValue), "-", "≈ " & fnMoney(r.ReceivedValue, r.Currency)), C3: fnMoney(r.PaidAmount, r.Currency), C4: fnMoney(r.Outstanding, r.Currency), Util: Blank(), Amount: r.Total, Currency: r.Currency, AmountUSD: Blank(), Status: Coalesce(r.PaymentStatus, "-"), StatusDomain: "POPaymentStatus"})
                                    ColumnConfig: |-
                                      =Table(
                                          {Key: "Primary", Header: fnT("col.po", "PO / vendor"), Portion: 2.2, ShowOnTablet: true, Sortable: false},
                                          {Key: "C1", Header: fnT("col.project", "Project"), Portion: 1, ShowOnTablet: false, Sortable: false},
                                          {Key: "Amount", Header: fnT("col.ordered", "Ordered"), Portion: 1.4, ShowOnTablet: true, Sortable: false},
                                          {Key: "C2", Header: fnT("col.receivedValue", "Received (est.)"), Portion: 1.4, ShowOnTablet: false, Sortable: false},
                                          {Key: "C3", Header: fnT("col.paid", "Paid"), Portion: 1.3, ShowOnTablet: false, Sortable: false},
                                          {Key: "C4", Header: fnT("col.outstanding", "Outstanding"), Portion: 1.4, ShowOnTablet: true, Sortable: false},
                                          {Key: "Status", Header: fnT("col.payStatus", "Payment"), Portion: 1.2, ShowOnTablet: true, Sortable: false}
                                      )
                                    PageNumber: =Coalesce(locPage, 1)
                                    HasMore: =!locPerProject && CountRows(colComRaw) = cfgPageSize
                                    Loading: =locLoading || !varFinReady
                                    EmptyText: =If(cmpFilterBar_Com.ActiveCount > 0 || Coalesce(drpComVendor.Selected.Key, 0) > 0 || drpComDelivery.Selected.Key <> "", fnT("com.emptyFilter", "No purchase orders match the filters."), fnT("com.empty", "No purchase orders for your projects yet."))
                                    Height: =If(isMobile, Max(1, Min(CountRows(colComPage), 8)) * 104 + 60, 40 + Max(1, Min(CountRows(colComPage), 12)) * 52 + 60)
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnNextPage: |-
                                      =Collect(colComStack, {Cursor: locCursor});
                                      UpdateContext({locCursor: Min(colComRaw, ID), locPage: locPage + 1});
                                      Select(btnComQuery)
                                    OnPrevPage: |-
                                      =UpdateContext({locCursor: Last(colComStack).Cursor, locPage: Max(1, locPage - 1)});
                                      Remove(colComStack, Last(colComStack));
                                      Select(btnComQuery)
                                    OnRowSelect: |-
                                      =UpdateContext({locPOID: cmpDataTable_Com.SelectedRow.RowID}); Select(btnComOpen)
                              - lblComNote:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(locPerProject, fnT("com.perProjectNote", "Latest purchase orders of each of your projects. Select a project in the header to page through older ones."), fnT("com.listNote", "Read-only. Received value is estimated from the PO quantities (exact per line in the detail). Outstanding = ordered - paid.")) & If(cfgComInvoiceFlags, "", " " & fnT("com.invoiceNote", "Invoice-based flags need invoice data (not in the data model yet)."))
                                    Font: =fontBase
                                    Size: =fsCaption
                                    Color: =FinTheme.TextSecondary
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =true
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =36
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
      - conComPanelOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =RGBA(0, 0, 0, 0)
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            Visible: =locDrawer
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - rectComScrim:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(0, 0, 0, 0.45)
                  BorderThickness: =0
                  TabIndex: =-1
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  OnSelect: |-
                    =UpdateContext({locDrawer: false})
            - conComPanel:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.ExtraBold
                  BorderThickness: =0
                  Fill: =FinTheme.Surface
                  RadiusTopLeft: =0
