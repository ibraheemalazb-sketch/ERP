Screens:
  scrIndicators:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Indicators");
        Set(varNavSelectedID, 62);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealIndForm), Set(varMealIndForm, Blank()));
        If(IsBlank(varMealIndTab), Set(varMealIndTab, "Overview"));
        If(IsBlank(varMealIndChild), Set(varMealIndChild, Blank()));
        If(IsBlank(varMealIndError), Set(varMealIndError, false));
        If(IsBlank(varSelectedIndicator), Set(varSelectedIndicator, Blank()));
        If(Not(IsBlank(varSelectedProject)), Set(varMealIndProject, varSelectedProject));
        Select(btnMealIndLoad)
    Children:
      - conMealIndNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpMealIndNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conMealIndSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealIndLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealIndError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    IfError(
                        ClearCollect(
                            colMealInd,
                            If(
                                Coalesce(varMealIndProject.ID, cmbMealIndFltProject.Selected.ID, 0) > 0,
                                Filter(
                                    Indicators,
                                    ProjectID = Coalesce(varMealIndProject.ID, cmbMealIndFltProject.Selected.ID)
                                ),
                                FirstN(SortByColumns(Indicators, "Modified", SortOrder.Descending), 500)
                            )
                        );
                        If(
                            Not(IsBlank(varSelectedIndicator)),
                            Set(varSelectedIndicator, LookUp(Indicators, ID = varSelectedIndicator.ID));
                            Select(btnMealIndLoadChildren),
                            Clear(colMealIndTargets);
                            Clear(colMealIndResults);
                            Clear(colMealIndDisagg);
                            Clear(colMealIndEvidence)
                        ),
                        Set(varMealIndError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل المؤشرات.", "Could not load indicators."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealIndLoadChildren:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =If(
                        IsBlank(varSelectedIndicator),
                        Clear(colMealIndTargets);
                        Clear(colMealIndResults);
                        Clear(colMealIndDisagg);
                        Clear(colMealIndEvidence),
                        Concurrent(
                            ClearCollect(colMealIndTargets, Filter(IndicatorTargets, IndicatorID = varSelectedIndicator.ID)),
                            ClearCollect(colMealIndResults, Filter(IndicatorResults, IndicatorID = varSelectedIndicator.ID)),
                            ClearCollect(colMealIndDisagg, Filter(IndicatorDisaggregations, IndicatorID = varSelectedIndicator.ID)),
                            ClearCollect(colMealIndEvidence, Filter(ActivityEvidence, IndicatorID = varSelectedIndicator.ID))
                        )
                    )
                  Text: ="Children"
                  Visible: =false
                  Width: =1
            - btnMealIndSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealIndForm, "") = "new",
                            pid: Coalesce(cmbMealIndProject.Selected.ID, 0),
                            ptt: Coalesce(cmbMealIndProject.Selected.Title, ""),
                            resp: cmbMealIndResp.Selected,
                            res: cmbMealIndResult.Selected
                        },
                        If(
                            Or(IsBlank(Trim(txtMealIndTitle.Text)), IsBlank(Trim(txtMealIndCode.Text)), pid <= 0),
                            Notify(If(ar, "العنوان ورمز المؤشر والمشروع مطلوبة.", "Title, indicator code, and project are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedIndicator,
                                    Patch(
                                        Indicators,
                                        If(isNew, Defaults(Indicators), LookUp(Indicators, ID = varSelectedIndicator.ID)),
                                        {
                                            Title: Trim(txtMealIndTitle.Text),
                                            IndicatorCode: Trim(txtMealIndCode.Text),
                                            Project: {Id: pid, Value: ptt},
                                            ProjectID: pid,
                                            ResultID: If(IsBlank(res), Blank(), res.ID),
                                            ResponsiblePerson: If(IsBlank(resp), Blank(), {Id: resp.ID, Value: resp.FullName}),
                                            ResponsiblePersonID: If(IsBlank(resp), Blank(), resp.ID),
                                            Level: {Value: Coalesce(cmbMealIndLevel.Selected.Value, "Output")},
                                            IndicatorType: {Value: Coalesce(cmbMealIndType.Selected.Value, "")},
                                            Method: {Value: Coalesce(cmbMealIndMethod.Selected.Value, "")},
                                            Frequency: {Value: Coalesce(cmbMealIndFreq.Selected.Value, "")},
                                            Status: {Value: Coalesce(cmbMealIndStatus.Selected.Value, "Active")},
                                            Sector: {Value: Coalesce(cmbMealIndSector.Selected.Value, "")},
                                            Baseline: If(IsBlank(Trim(txtMealIndBaseline.Text)), Blank(), Value(txtMealIndBaseline.Text)),
                                            LoPTarget: If(IsBlank(Trim(txtMealIndLoP.Text)), Blank(), Value(txtMealIndLoP.Text)),
                                            Description: txtMealIndDesc.Text
                                        }
                                    )
                                );
                                fnMealLog("Indicator", varSelectedIndicator.ID, Coalesce(varSelectedIndicator.IndicatorCode, ""), If(isNew, "Created", "Updated"), "Info", pid, Coalesce(LookUp(Projects, ID = pid, ProjectCode), ""), "", "", "", Trim(txtMealIndTitle.Text), false);
                                If(
                                    And(!IsBlank(resp), resp.ID <> varMeID),
                                    fnMealNotify(resp.ID, Coalesce(resp.FullName, ""), If(ar, "أُسند إليك مؤشر", "An indicator was assigned to you"), Coalesce(varSelectedIndicator.IndicatorCode, varSelectedIndicator.Title, ""), "Indicator", varSelectedIndicator.ID, "Unread")
                                );
                                Set(varMealIndForm, Blank());
                                Select(btnMealIndLoad);
                                Notify(If(ar, "تم حفظ المؤشر.", "Indicator saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ المؤشر.", "Could not save the indicator."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
            - btnMealIndSaveTarget:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealIndChild, "") = "target-new",
                            ind: varSelectedIndicator,
                            per: cmbMealIndTgtPeriod.Selected
                        },
                        If(
                            Or(IsBlank(ind), IsBlank(per), IsBlank(Trim(txtMealIndTgtValue.Text))),
                            Notify(If(ar, "الفترة والقيمة مطلوبة.", "Period and target value are required."), NotificationType.Error),
                            IfError(
                                Patch(
                                    IndicatorTargets,
                                    If(isNew, Defaults(IndicatorTargets), LookUp(IndicatorTargets, ID = varSelectedIndTarget.ID)),
                                    {
                                        Title: Coalesce(ind.IndicatorCode, ind.Title) & " — " & Coalesce(per.Title, Text(per.ID)),
                                        IndicatorID: ind.ID,
                                        ReportingPeriod: {Id: per.ID, Value: Coalesce(per.Title, "")},
                                        ReportingPeriodID: per.ID,
                                        TargetValue: Value(txtMealIndTgtValue.Text),
                                        Notes: txtMealIndTgtNotes.Text
                                    }
                                );
                                Set(varMealIndChild, Blank());
                                Set(varSelectedIndTarget, Blank());
                                fnMealLog("Indicator Target", ind.ID, Coalesce(ind.IndicatorCode, ""), If(isNew, "Created", "Updated"), "Info", Coalesce(ind.ProjectID, 0), "", "TargetValue", "", txtMealIndTgtValue.Text, Coalesce(per.Title, ""), false);
                                Select(btnMealIndLoadChildren);
                                Notify(If(ar, "تم حفظ الهدف.", "Target saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الهدف.", "Could not save the target."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveTgt"
                  Visible: =false
                  Width: =1
            - btnMealIndSaveDisagg:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealIndChild, "") = "disagg-new",
                            ind: varSelectedIndicator
                        },
                        If(
                            Or(IsBlank(ind), IsBlank(Trim(txtMealIndDisName.Text))),
                            Notify(If(ar, "اسم التفصيل مطلوب.", "Disaggregation name is required."), NotificationType.Error),
                            IfError(
                                Patch(
                                    IndicatorDisaggregations,
                                    If(isNew, Defaults(IndicatorDisaggregations), LookUp(IndicatorDisaggregations, ID = varSelectedIndDisagg.ID)),
                                    {
                                        Title: Trim(txtMealIndDisName.Text),
                                        IndicatorID: ind.ID,
                                        Category: Coalesce(cmbMealIndDisCat.Selected.Value, Trim(txtMealIndDisCat.Text)),
                                        ValueLabel: Trim(txtMealIndDisValue.Text),
                                        IsActive: togMealIndDisActive.Checked
                                    }
                                );
                                Set(varMealIndChild, Blank());
                                Set(varSelectedIndDisagg, Blank());
                                Select(btnMealIndLoadChildren);
                                Notify(If(ar, "تم حفظ التفصيل.", "Disaggregation saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ التفصيل.", "Could not save the disaggregation."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveDis"
                  Visible: =false
                  Width: =1
            - btnMealIndDelete:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", i: varSelectedIndicator},
                        If(
                            IsBlank(i),
                            Notify(If(ar, "اختر مؤشراً أولاً.", "Select an indicator first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف هذا المؤشر؟", "Delete this indicator?") & Char(10) & Coalesce(i.Title, "")),
                                IfError(
                                    Remove(Indicators, LookUp(Indicators, ID = i.ID));
                                    Set(varSelectedIndicator, Blank());
                                    Set(varMealIndForm, Blank());
                                    Select(btnMealIndLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="Delete"
                  Visible: =false
                  Width: =1
      - conMealIndPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealIndPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealIndTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealIndHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealIndTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "المؤشرات", "Indicators")
                        Width: =200
                        Wrap: =false
                  - btnMealIndRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnMealIndLoad)
                        Text: =""
                        Width: =44
                  - btnMealIndNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSelectedIndicator, Blank());
                          Set(varMealIndForm, "new");
                          Set(varMealIndChild, Blank())
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "جديد", "New"))
                        Width: =If(App.Width < 700, 44, 100)
            - lblMealIndError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealIndError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل بعض البيانات.", "Some data could not be loaded.")
                  Visible: =varMealIndError
                  Width: =Parent.Width
                  Wrap: =false
            - conMealIndBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 60
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conMealIndList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =Or(App.Width >= 700, And(IsBlank(varMealIndForm), IsBlank(varSelectedIndicator)))
                        Width: =If(App.Width < 700, Parent.Width, If(Or(Not(IsBlank(varMealIndForm)), Not(IsBlank(varSelectedIndicator))), Parent.Width - 420, Parent.Width))
                      Children:
                        - conMealIndTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 160, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =App.Width < 700
                            Children:
                              - txtMealIndSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                                    Width: =If(App.Width < 700, Parent.Width, 140)
                              - cmbMealIndFltProject:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =If(Not(IsBlank(varMealIndProject)), Filter(Projects, ID = varMealIndProject.ID), Filter(Projects, false))
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Projects
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varMealIndProject, cmbMealIndFltProject.Selected);
                                      Select(btnMealIndLoad)
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 150)
                              - cmbMealIndFltLevel:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =Filter(Choices(Indicators.Level), false)
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المستوى", "Level")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Indicators.Level)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 120)
                              - cmbMealIndFltSector:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =Filter(Choices(Indicators.Sector), false)
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Indicators.Sector)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 120)
                              - cmbMealIndFltStatus:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: =Filter(Choices(Indicators.Status), false)
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
