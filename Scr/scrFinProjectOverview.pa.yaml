                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =20
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                    - cmpDataTable_ProjTxn:
                                        Control: CanvasComponent
                                        ComponentName: cmpDataTable
                                        Properties:
                                          RowItems: |-
                                            =ForAll(colProjTxn As t, {RowID: t.ID, Primary: t.TransactionNumber, Secondary: t.Description, C1: fnPeriodLabel(t.PeriodKey), C2: fnT("txn." & t.Type, t.Type), C3: t.Source & If(IsBlank(t.SourceNumber), "", " " & t.SourceNumber), C4: Text(t.TransactionDate, "dd mmm yyyy", appLocale), Util: Blank(), Amount: t.Amount, Currency: t.Currency, AmountUSD: t.AmountUSD, Status: t.Status, StatusDomain: "Ledger"})
                                          ColumnConfig: |-
                                            =Table(
                                                {Key: "Primary", Header: fnT("col.txn", "Transaction"), Portion: 1.8, ShowOnTablet: true, Sortable: false},
                                                {Key: "C1", Header: fnT("col.period", "Period"), Portion: 1, ShowOnTablet: true, Sortable: false},
                                                {Key: "C2", Header: fnT("col.type", "Type"), Portion: 1.2, ShowOnTablet: false, Sortable: false},
                                                {Key: "C3", Header: fnT("col.source", "Source"), Portion: 1.6, ShowOnTablet: false, Sortable: false},
                                                {Key: "Amount", Header: fnT("col.amount", "Amount"), Portion: 1.5, ShowOnTablet: true, Sortable: false},
                                                {Key: "Status", Header: fnT("col.status", "Status"), Portion: 1.1, ShowOnTablet: true, Sortable: false}
                                            )
                                          PageNumber: =Coalesce(locTxnPage, 1)
                                          HasMore: =CountRows(colProjTxn) = cfgPageSize
                                          Loading: =locTxnLoading
                                          EmptyText: =fnT("txn.empty", "No ledger transactions for these filters.")
                                          Height: =If(isMobile, Max(1, Min(CountRows(colProjTxn), 6)) * 104 + 60, 40 + Max(1, Min(CountRows(colProjTxn), 10)) * 52 + 60)
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          OnNextPage: |-
                                            =Collect(colProjTxnStack, {Cursor: locTxnCursor});
                                            UpdateContext({locTxnCursor: Min(colProjTxn, ID), locTxnPage: locTxnPage + 1});
                                            Select(btnProjTxnQuery)
                                          OnPrevPage: |-
                                            =UpdateContext({locTxnCursor: Last(colProjTxnStack).Cursor, locTxnPage: Max(1, locTxnPage - 1)});
                                            Remove(colProjTxnStack, Last(colProjTxnStack));
                                            Select(btnProjTxnQuery)
                                          OnRowSelect: |-
                                            =With(
                                                {_t: LookUp(colProjTxn, ID = cmpDataTable_ProjTxn.SelectedRow.RowID)},
                                                If(
                                                    _t.Source = "Payment Request" && Coalesce(_t.SourceID, 0) > 0,
                                                    Set(varPRID, _t.SourceID); Navigate(scrFinPaymentDetail, ScreenTransition.None),
                                                    Set(varLedTxnID, _t.ID); fnNavigate("ledger")
                                                )
                                            )
                              - conProjTabDocs:
