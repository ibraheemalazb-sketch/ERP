                                  ComponentName: cmpEmptyState
                                  Properties:
                                    Variant: ="empty"
                                    Title: =fnT("proj.chooseTitle", "Choose a project")
                                    Message: =fnT("proj.chooseMsg", "Select a project in the header or from the list below.")
                                    Height: =200
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                              - galProjPick:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
