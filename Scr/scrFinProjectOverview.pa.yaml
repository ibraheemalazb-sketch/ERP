                                    ItemAccessibleLabel: =ThisItem.ProjectCode & " " & ThisItem.Title
                                    OnSelect: =Set(varProjectID, ThisItem.ID); Select(btnProjReload)
                                  Children:
                                    - lblProjPickItem:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =ThisItem.ProjectCode & "  |  " & ThisItem.Title
                                          Font: =fontBase
                                          Size: =fsBody
                                          Color: =FinTheme.Text
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =false
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
