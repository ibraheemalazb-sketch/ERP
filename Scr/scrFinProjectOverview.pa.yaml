                                                  =Filter(Table({Key: "", Value: fnT("flt.allSources", "All sources")}, {Key: "Payroll", Value: fnT("src.Payroll", "Payroll")}, {Key: "Payment Request", Value: fnT("src.Payment Request", "Payment Request")}, {Key: "Purchase Order", Value: fnT("src.Purchase Order", "Purchase Order")}, {Key: "Manual", Value: fnT("src.Manual", "Manual")}, {Key: "Donor Funding", Value: fnT("src.Donor Funding", "Donor Funding")}), Key <> cfgSourceModule.Payroll || canSeePayrollLedger)
                                                AccessibleLabel: =fnT("txn.source", "Source module")
                                    - lblProjTxnNote:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =fnT("txn.readOnly", "Read-only ledger. Newest first, 100 per page, max 12 months per query.")
                                          Font: =fontBase
                                          Size: =fsCaption
                                          Color: =FinTheme.TextSecondary
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =true
