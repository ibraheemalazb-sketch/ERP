      - btnProjReload:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locLoading: true, locError: false, locLoadedTabs: "|budget|payroll|history|", locCat: "", locHistTop: 50,
                  locProj: LookUp(colMyProjects, ID = varProjectID)});
              If(
                  !IsBlank(locProj),
                  IfError(
                      fnLoadBudgetLines(varProjectID); true,
                      UpdateContext({locError: true});
                      Trace("Budget lines load failed: " & FirstError.Message, TraceSeverity.Error)
                  );
                  // KPIs from STORED budget-line totals (Budgets is not a ledger list; no ledger sums - spec rule 2)
                  With(
                      {
                          _b: Sum(colBudgetLines, TotalUSD), _c: Sum(colBudgetLines, CommittedUSD), _s: Sum(colBudgetLines, SpentUSD),
                          _r: Sum(colBudgetLines, RemainingUSD), _start: locProj.StartDate, _end: locProj.EndDate
                      },
                      With(
                          {
                              _total: Max(1, DateDiff(_start, _end, TimeUnit.Days)),
                              _done: Max(0, DateDiff(_start, Min(Today(), _end), TimeUnit.Days)),
                              _months: Max(1, DateDiff(_start, Min(Today(), _end), TimeUnit.Months)),
                              _allMonths: Max(1, DateDiff(_start, _end, TimeUnit.Months))
                          },
                          UpdateContext({locPK: {
                              Budget: _b, Committed: _c, Spent: _s, Remaining: _r,
                              Util: fnUtilRatio(_b, _c, _s),
                              SpentPct: If(_b > 0, _s / _b, Blank()),
                              ElapsedPct: If(IsBlank(_start) || IsBlank(_end), Blank(), Min(1, _done / _total)),
                              Burn: _s / _months,
                              ExpectedBurn: _b / _allMonths,
                              Payroll: Sum(colBudgetLines, PayrollUSD)
                          }})
                      )
                  );
                  ClearCollect(colProjPayrollRows, Filter(colBudgetLines, Coalesce(PayrollAmount, 0) <> 0));
                  // If the user came back to a lazy tab, load it again
                  If(!(("|" & locTab & "|") in locLoadedTabs), Select(btnProjLoadTab))
              );
              UpdateContext({locLoading: false})
      - btnProjLoadTab:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =IfError(
                  Switch(
                      locTab,
                      // Commitments: POs of this project (PurchaseOrders.ProjectID is a Number column -> delegable)
                      "po", ClearCollect(colProjPOs, ForAll(FirstN(Sort(Filter(PurchaseOrders, ProjectID = varProjectID), ID, SortOrder.Descending), cfgPageSize) As o, {ID: o.ID, PONumber: o.PONumber, Supplier: o.Supplier.Value, Total: o.Total, PaidAmount: o.PaidAmount, Currency: o.Currency.Value, POStatus: o.POStatus.Value, ApprovalStatus: o.Status.Value, ExpectedDeliveryDate: o.ExpectedDeliveryDate})),
                      // Payments: PaymentRequests.ProjectID is Indexed
                      "pay", ClearCollect(colProjPRs, ForAll(FirstN(Sort(Filter(PaymentRequests, ProjectID = varProjectID), ID, SortOrder.Descending), cfgPageSize) As r, {ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, PaidTo: r.PaidTo, RequestDate: r.RequestDate, RequestedAmount: r.RequestedAmount, Currency: r.Currency.Value, TotalAmountUSD: r.TotalAmountUSD, RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, Stage: fnPRStage(r.RequestStatus.Value, r.PaymentStatus.Value, r.FinanceOfficerApproved, r.ProjectManagerApproved, r.FinanceManagerApproved)})),
                      // Funding: DonorFunding.ProjectID is Indexed
                      "fund", ClearCollect(colProjFunding, ForAll(FirstN(Sort(Filter(DonorFunding, ProjectID = varProjectID), ExpectedDate, SortOrder.Descending), cfgPageSize) As d, {ID: d.ID, Donor: d.Donor, AgreementNumber: d.AgreementNumber, TrancheNo: d.TrancheNo, ExpectedDate: d.ExpectedDate, ReceivedDate: d.ReceivedDate, Amount: d.Amount, Currency: d.Currency.Value, AmountUSD: d.AmountUSD, Status: d.Status.Value})),
                      // Transactions: ledger, ProjectID + PeriodKey range (both Indexed), paged
                      "txn", UpdateContext({locTxnCursor: 0, locTxnPage: 1}); Clear(colProjTxnStack); Select(btnProjTxnQuery),
                      // Documents: Attachments list (RelatedEntity + RelatedItemID are Indexed TEXT columns)
                      "docs", ClearCollect(colProjDocs, ForAll(FirstN(Sort(Filter(Attachments, RelatedEntity = cfgDocEntity.Project, RelatedItemID = Text(varProjectID)), ID, SortOrder.Descending), 100) As a,
                              {Title: a.Title, Url: a.File, UploadedBy: a.UploadedBy.Value, Modified: a.Modified}))
                  ),
                  Notify(fnT("common.loadError", "This section could not be loaded. Please retry."), NotificationType.Error);
                  Trace("Project tab load failed (" & locTab & "): " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoadedTabs: locLoadedTabs & "|" & locTab & "|"})
      - btnProjTxnQuery:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locTxnLoading: true, locTxnError: false});
              IfError(
                  ClearCollect(
                      colProjTxn,
                      ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      FinancialTransactions,
                                      ProjectID = varProjectID,
                                      PeriodKey >= drpProjTxnFrom.Selected.Key,
                                      PeriodKey <= drpProjTxnTo.Selected.Key,
                                      drpProjTxnType.Selected.Key = "" || TransactionType.Value = drpProjTxnType.Selected.Key,
                                      drpProjTxnSource.Selected.Key = "" || SourceModule.Value = drpProjTxnSource.Selected.Key,
                                      canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding,
                                      locTxnCursor = 0 || ID < locTxnCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As t,
                          {
                              ID: t.ID, TransactionNumber: t.TransactionNumber, TransactionDate: t.TransactionDate, PeriodKey: t.PeriodKey,
                              Type: t.TransactionType.Value, Source: t.SourceModule.Value, SourceID: t.SourceID, SourceNumber: t.SourceNumber,
                              Description: t.Description, Currency: t.Currency.Value, Amount: t.Amount, AmountUSD: t.AmountUSD,
                              Status: t.Status.Value, BudgetLineID: t.BudgetLineID
                          }
                      )
                  ),
                  UpdateContext({locTxnError: true});
                  Notify(fnT("txn.loadError", "The transactions could not be loaded. Try a shorter period or retry."), NotificationType.Error);
                  Trace("Ledger query failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locTxnLoading: false})
