      - cmpDlg_PRD:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =locDlg in ["submit", "check", "approve", "return", "reject", "paid", "cancel"]
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: =Switch(locDlg, "submit", fnT("prd.dlgSubmit", "Submit for approval?"), "check", fnT("prd.dlgCheck", "Confirm finance check?"), "approve", fnT("prd.dlgApprove", "Approve this payment request?"), "return", fnT("prd.dlgReturn", "Return to the preparer?"), "reject", fnT("prd.dlgReject", "Reject this payment request?"), "paid", fnT("prd.dlgPaid", "Mark as paid?"), "cancel", fnT("prd.dlgCancel", "Cancel this payment request?"), "")
            Message: =Switch(locDlg, "paid", fnT("prd.dlgPaidMsg", "This starts the posting to the ledger and budget. It cannot be undone from the app."), "reject", fnT("prd.dlgRejectMsg", "The request is closed and cannot be resubmitted."), "return", fnT("prd.dlgReturnMsg", "The request goes back to draft; all approvals restart after it is resubmitted."), "cancel", fnT("prd.dlgCancelMsg", "The request is closed without payment."), "")
            ConfirmText: =Switch(locDlg, "submit", fnT("prf.submit", "Submit"), "check", fnT("prd.check", "Confirm check"), "approve", fnT("prd.approve", "Approve"), "return", fnT("prd.return", "Return"), "reject", fnT("prd.reject", "Reject"), "paid", fnT("prd.markPaid", "Mark as paid"), "cancel", fnT("prd.cancelReq", "Cancel request"), fnT("common.ok", "OK"))
            CancelText: =fnT("common.back", "Back")
            Destructive: =locDlg in ["reject", "cancel"]
            RequireReason: =locDlg in ["return", "reject", "cancel"]
            ShowReason: =locDlg in ["check", "approve"]
            ReasonLabel: =If(locDlg in ["return", "reject", "cancel"], fnT("dlg.reasonRequired", "Reason (required)"), fnT("dlg.commentOptional", "Comment (optional)"))
            MinReasonLength: =cfgReasonMinChars
            Busy: =locBusy
            OnCancel: |-
              =UpdateContext({locDlg: ""})
            OnConfirm: |-
              =UpdateContext({locBusy: true});
              With(
                  {_r: Trim(cmpDlg_PRD.Reason), _corr: Text(GUID()), _rec: LookUp(PaymentRequests, ID = varPRID), _num: Coalesce(locPR.RequestNumber, "")},
                  If(
                      // optimistic concurrency: someone else acted since this screen loaded
                      fnPRStage(_rec.RequestStatus.Value, _rec.PaymentStatus.Value, _rec.FinanceOfficerApproved, _rec.ProjectManagerApproved, _rec.FinanceManagerApproved) <> locStage,
                      UpdateContext({locBusy: false, locDlg: ""});
                      Notify(fnT("prd.changed", "This request was changed by someone else. The latest version is now shown."), NotificationType.Warning);
                      Select(btnPRDLoad),
                      IfError(
                          Switch(
                              locDlg,
                              "submit", Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Pending},
                                  FinanceOfficerApproved: false, ProjectManagerApproved: false, FinanceManagerApproved: false}),
                              "check", Patch(PaymentRequests, _rec, {FinanceOfficer: {Id: varMeID, Value: varMe.FullName}, FinanceOfficerApproved: true,
                                  CheckedDate: Now(), FinanceOfficerComment: _r}),
                              "approve", If(
                                  locStage = "pm",
                                  Patch(PaymentRequests, _rec, {ProjectManager: {Id: varMeID, Value: varMe.FullName}, ProjectManagerApproved: true,
                                      ProjectManagerDate: Now(), ProjectManagerComment: _r}),
                                  Patch(PaymentRequests, _rec, {FinanceManager: {Id: varMeID, Value: varMe.FullName}, FinanceManagerApproved: true,
                                      FinanceManagerDate: Now(), FinanceManagerComment: _r, RequestStatus: {Value: cfgPRStatus.Approved}})
                              ),
                              "return", Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Returned},
                                  FinanceOfficerApproved: false, ProjectManagerApproved: false, FinanceManagerApproved: false,
                                  FinanceOfficerComment: If(locStage = "check", _r, _rec.FinanceOfficerComment),
                                  ProjectManagerComment: If(locStage = "pm", _r, _rec.ProjectManagerComment),
                                  FinanceManagerComment: If(locStage = "fm" || locStage = "approved", _r, _rec.FinanceManagerComment)}),
                              "reject", Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Rejected},
                                  FinanceOfficerComment: If(locStage = "check", _r, _rec.FinanceOfficerComment),
                                  ProjectManagerComment: If(locStage = "pm", _r, _rec.ProjectManagerComment),
                                  FinanceManagerComment: If(locStage = "fm" || locStage = "approved", _r, _rec.FinanceManagerComment)}),
                              // Paid -> flow 2 (posting) is triggered by the PaymentStatus change; the app writes nothing else
                              "paid", Patch(PaymentRequests, _rec, {PaymentStatus: {Value: cfgPRPaymentStatus.Paid}}),
                              "cancel", Patch(PaymentRequests, _rec, {RequestStatus: {Value: cfgPRStatus.Cancelled}})
                          ),
                          UpdateContext({locBusy: false});
                          Notify(fnT("prd.actionError", "The action could not be completed. Please retry.") & " " & FirstError.Message, NotificationType.Error);
                          Trace("PR action " & locDlg & " failed: " & FirstError.Message, TraceSeverity.Error),
                          // ---- success: ApprovalHistory (decisions only) + one FinanceActivityLog row
                          If(
                              locDlg in ["check", "approve", "return", "reject"],
                              fnRecordDecision(cfgRequestType.PaymentRequest, varPRID, _num, Switch(locDlg, "return", cfgApprDecision.Returned, "reject", cfgApprDecision.Rejected, cfgApprDecision.Approved), _r, locPR.ProjectID)
                          );
                          fnLogActivityFull(
                              "Payment Request", varPRID, _num,
                              Switch(locDlg, "submit", "Submitted", "check", "Approved", "approve", "Approved", "return", "Returned",
                                  "reject", "Rejected", "paid", "Status Changed", "cancel", "Cancelled", "Updated"),
                              If(locDlg in ["reject", "cancel", "paid"], "Important", "Info"),
                              locPR.ProjectID, locPR.ProjectCode,
                              If(locDlg = "paid", "PaymentStatus", "RequestStatus"),
                              If(locDlg = "paid", locPR.PaymentStatus, locPR.RequestStatus),
                              Switch(locDlg, "submit", cfgPRStatus.Pending, "return", cfgPRStatus.Returned, "reject", cfgPRStatus.Rejected,
                                  "paid", cfgPRPaymentStatus.Paid, "cancel", cfgPRStatus.Cancelled,
                                  "approve", If(locStage = "fm", cfgPRStatus.Approved, locPR.RequestStatus), locPR.RequestStatus),
                              fnPRStageLabel(locStage) & " -> " & locDlg, _r, locPR.RequestedAmount, locPR.Currency, _corr
                          );
                          UpdateContext({locDlg: "", locBusy: false});
                          Notify(fnT("prd.done", "Done."), NotificationType.Success);
                          fnRefreshHeaderData();
                          Select(btnPRDLoad)
                      )
                  )
              )
