            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
