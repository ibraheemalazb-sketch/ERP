            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locLoading: true, locError: false, locDlg: "", locBusy: false, locHistTop: 50, locCmtTop: 50});
              IfError(
                  Concurrent(
                      UpdateContext({locPRRec: LookUp(PaymentRequests, ID = varPRID)}),
                      // lines: PaymentRequestID is Indexed
                      ClearCollect(colPRDLines, ForAll(Sort(Filter(PaymentRequesttLines, PaymentRequestID = varPRID), LineNumber, SortOrder.Ascending) As l,
                          {ID: l.ID, LineNumber: l.LineNumber, BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLineCode,
                           RequestDescription: l.RequestDescription, Currency: l.Currency.Value, Amount: l.Amount, AmountUSD: l.AmountUSD})),
                      // documents: Attachments list, RelatedEntity + RelatedItemID (TEXT) are Indexed (C2 / N10)
                      ClearCollect(colPRDDocs, ForAll(FirstN(Sort(Filter(Attachments, RelatedEntity = cfgDocEntity.PaymentRequest, RelatedItemID = Text(varPRID)), ID, SortOrder.Descending), 100) As a,
                          {Title: a.Title, Url: a.File, UploadedBy: a.UploadedBy.Value, Modified: a.Modified}))
                  );
                  With(
                      {r: locPRRec},
                      UpdateContext({
                          locPR: {
                              ID: r.ID, RequestNumber: r.RequestNumber, Title: r.Title, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode,
                              RequestDate: r.RequestDate, PaidTo: r.PaidTo, RequestType: r.RequestType.Value, Description: r.Description,
                              Currency: r.Currency.Value, RequestedAmount: r.RequestedAmount, TotalAmountUSD: r.TotalAmountUSD, ExchangeRate: r.ExchangeRate,
                              RequestStatus: r.RequestStatus.Value, PaymentStatus: r.PaymentStatus.Value, PreparedByID: r.PreparedByID, PreparedDate: r.PreparedDate,
                              FOName: r.FinanceOfficer.Value, Checked: r.FinanceOfficerApproved, CheckedDate: r.CheckedDate, FOComment: r.FinanceOfficerComment,
                              PMName: r.ProjectManager.Value, PMApproved: r.ProjectManagerApproved, PMDate: r.ProjectManagerDate, PMComment: r.ProjectManagerComment,
                              FMName: r.FinanceManager.Value, FMApproved: r.FinanceManagerApproved, FMDate: r.FinanceManagerDate, FMComment: r.FinanceManagerComment,
                              ComplianceRequired: r.ComplianceRequired, VendorID: r.VendorID, PurchaseOrderID: r.PurchaseOrderID, PostedToLedger: r.PostedToLedger
                          },
                          locProjRec: LookUp(colMyProjects, ID = r.ProjectID)
                      })
                  );
                  UpdateContext({
                      locNoAccess: IsBlank(locPRRec) || (IsBlank(locProjRec) && locPR.PreparedByID <> varMeID),
                      locStage: fnPRStage(locPR.RequestStatus, locPR.PaymentStatus, locPR.Checked, locPR.PMApproved, locPR.FMApproved)
                  });
                  // names for the summary: one small call each, only when the ID is set (no lookups inside galleries)
                  If(
                      !locNoAccess,
                      Concurrent(
                          UpdateContext({locVendorName: If(Coalesce(locPR.VendorID, 0) > 0,
                              Coalesce(LookUp(colVendorsLite, Key = locPR.VendorID).Value, LookUp(Vendors, ID = locPR.VendorID).Title), "")}),
                          UpdateContext({locPONumber: If(Coalesce(locPR.PurchaseOrderID, 0) > 0, LookUp(PurchaseOrders, ID = locPR.PurchaseOrderID).PONumber, "")}),
                          UpdateContext({locPreparedBy: If(Coalesce(locPR.PreparedByID, 0) > 0,
                              Coalesce(LookUp(colEmpLite, Key = locPR.PreparedByID).Value, LookUp(Employees, ID = locPR.PreparedByID).FullName), "")})
                      )
                  );
                  // role-specific actions (segregation of duties: nobody checks or approves their own request)
                  With(
                      {_own: locPR.PreparedByID = varMeID, _s: locStage},
                      UpdateContext({locCan: {
                          Edit: _s = "draft" && (_own || canEdit),
                          Submit: _s = "draft" && canSubmit && (_own || canEdit) && !IsEmpty(colPRDLines),
                          Check: _s = "check" && !_own && canEdit && (isFinanceManager || (isFinanceOfficer && locProjRec.FinanceID = varMeID)),
                          Approve: !_own && canApprove && ((_s = "pm" && locProjRec.ManagerID = varMeID) || (_s = "fm" && isFinanceManager)),
                          MarkPaid: _s = "approved" && canMarkPaid,
                          Cancel: (_own && (_s = "draft" || _s = "check")) || (isFinanceManager && canEdit && _s in ["draft", "check", "pm", "fm", "approved"])
                      }})
                  ),
                  UpdateContext({locError: true});
                  Trace("Payment request load failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false})
