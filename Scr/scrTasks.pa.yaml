                              Width: =If(App.Width < 700, Parent.Width * 0.48, 160)
                        - cmbAtPriority:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الأولويات", "All priorities")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ProjectsTasks.Priority)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 150)
                        - cmbAtProject:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =colAtProjects
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 160)
                        - cmbAtAssignee:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المكلّف", "Assignee")
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المكلّفين", "All assignees")
                              ItemDisplayText: =ThisItem.FullName
                              Items: =colAtAssignees
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 170)
                        - btnAtArchived:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varAtArchived, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              Height: =40
                              Icon: ="Folder"
                              OnSelect: =Set(varAtArchived, Not(varAtArchived))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "المؤرشفة", "Archived"))
                              Width: =If(App.Width < 700, 44, 120)
                        - btnAtClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =40
                              Icon: ="Dismiss"
                              OnSelect: |-
                                =Reset(txtAtSearch);
                                Reset(cmbAtPriority);
                                Reset(cmbAtProject);
                                Reset(cmbAtAssignee);
                                Set(varAtStatus, "All");
                                Reset(cmbAtStatus);
                                Set(varAtQuick, "open");
                                Set(varAtArchived, false)
                              Text: =If(gblLanguage = "Arabic", "مسح", "Clear")
                              Width: =If(App.Width < 700, Parent.Width * 0.48, 100)
                        - cmpAtView:
                            Control: CanvasComponent
                            ComponentName: cmpSegmentedControl
                            Properties:
                              DefaultValue: =varAtView
                              DisplayMode: ="Both"
                              EqualWidth: =true
                              Height: =40
                              IconPosition: ="Left"
                              OnChange: =Set(varAtView, cmpAtView.SelectedValue)
                              Options: |-
                                =Table(
                                    {Value: "table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                    {Value: "list", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                )
                              Size: ="Medium"
                              Visible: =App.Width >= 700
                              Width: =188
                  - cmpAtTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =148
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
                        EmptyTitle: =If(gblLanguage = "Arabic", "لا توجد مهام", "No tasks")
                        EnableHover: =true
                        EnableMenu: =false
                        HeaderColumn1: =If(gblLanguage = "Arabic", "الاستحقاق", "Due")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        HeaderColumn3: =If(gblLanguage = "Arabic", "النشاط", "Activity")
                        HeaderHeight: =40
                        HeaderPerson: =If(gblLanguage = "Arabic", "المكلّف", "Assignee")
                        HeaderPriority: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                        HeaderProgress: =If(gblLanguage = "Arabic", "الإنجاز", "Progress")
                        HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "النشاط", "Activity")
                        HeaderTitle: =If(gblLanguage = "Arabic", "المهمة", "Task")
                        HeaderWhen: =If(gblLanguage = "Arabic", "الاستحقاق", "Due")
                        Height: =Max(420, App.Height - cmpAtTop.Height - If(App.Width < 700, cmpAtPhone.Height, 0) - 330)
                        Items: |-
                          =ForAll(
                              Sort(
                                  Filter(
                                      colAtRows,
                                      Or(varAtArchived, Not(Coalesce(IsArchived, false))),
                                      Switch(varAtQuick, "open", IsOpen, "overdue", IsOverdue, "soon", IsDueSoon, "done", StatusText = "Completed", true),
                                      Or(varAtStatus = "All", StatusText = varAtStatus),
                                      Or(IsBlank(cmbAtPriority.Selected), PriorityText = cmbAtPriority.Selected.Value),
                                      Or(IsBlank(cmbAtProject.Selected), ProjectID = cmbAtProject.Selected.ID),
                                      Or(IsBlank(cmbAtAssignee.Selected), AssignedToID = cmbAtAssignee.Selected.ID),
                                      Or(
                                          IsBlank(Trim(txtAtSearch.Text)),
                                          Trim(txtAtSearch.Text) in Title,
                                          Trim(txtAtSearch.Text) in ProjectText,
                                          Trim(txtAtSearch.Text) in AssigneeText,
                                          Trim(txtAtSearch.Text) in ActivityText
                                      )
                                  ),
                                  DaysLeft,
                                  SortOrder.Ascending
                              ) As task,
                              {
                                  RowKey: Text(task.ID),
                                  Title: Coalesce(task.Title, "-"),
                                  Subtitle: Coalesce(task.ActivityText, "-"),
                                  Column1: If(IsBlank(task.DueDate), "-", Text(task.DueDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(task.ProjectText, "-"),
                                  Column3: Coalesce(task.ActivityText, "-"),
                                  Status: task.StatusText,
                                  Tone: If(task.IsOverdue, "danger", fxStatusPillTone(task.StatusText)),
                                  Priority: task.PriorityText,
                                  PriorityTone: task.PriorityTone,
                                  Person: If(IsBlank(task.AssigneeText), "-", task.AssigneeText),
                                  WhenText: If(IsBlank(task.DueDate), "-", Text(task.DueDate, "dd-mmm-yyyy")),
                                  ProgressDone: task.ProgressPct,
                                  ProgressTotal: 100,
                                  IconName: "Clipboard"
                              }
                          )
                        LayoutMinHeight: =360
                        LayoutMinWidth: =0
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colAtRows, ID = Value(cmpAtTable.SelectedItem.RowKey))},
                              Set(varAtSelID, row.ID);
                              Set(varAtSel, row);
                              Set(varAtPane, "details");
                              Select(btnAtDetail)
                          )
                        RowHeight: =52
                        ShowAction: =false
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =true
                        ShowHeader: =true
                        ShowId: =false
                        ShowPerson: =true
                        ShowPriority: =true
                        ShowProgress: =true
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
                        SubtitleAsPill: =true
                        TitleBold: =true
                        ViewMode: =If(App.Width < 700, "list", Coalesce(varAtView, "table"))
                        Width: =Parent.Width
                        WidthColumn1: =120
                        WidthColumn2: =120
                        WidthColumn3: =140
                        WidthPerson: =150
                        WidthPriority: =90
                        WidthProgress: =110
                        WidthStatus: =120
                        WidthSubtitle: =0
                        WidthTitle: =220
                        WidthWhen: =120
            - conAtDetail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
