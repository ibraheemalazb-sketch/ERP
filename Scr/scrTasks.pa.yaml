Screens:
  scrTasks:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PTasks");
        Set(varNavSelectedID, 29);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, ""));
        If(IsBlank(varTkQuick), Set(varTkQuick, "open"));
        If(IsBlank(varTkShowArchived), Set(varTkShowArchived, false));
        If(IsBlank(varTkPane), Set(varTkPane, "Details"));
        Set(varAllTkError, false);
        Select(btnAllTkReload)
    Children:
      - conAllTkNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpAllTkNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conAllTkSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnAllTkReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, ""));
                    Set(varAllTkError, false);
                    Clear(colAllTkRaw);
                    If(
                        And(varTkScope = "project", Coalesce(varSelectedProject.ID, 0) > 0),
                        IfError(
                            Collect(colAllTkRaw, Filter(ProjectsTasks, ProjectID = varSelectedProject.ID)),
                            Set(varAllTkError, true)
                        ),
                        If(
                            varUserHasAllProjects,
                            IfError(
                                Collect(colAllTkRaw, FirstN(SortByColumns(ProjectsTasks, "ID", SortOrder.Descending), 500)),
                                Set(varAllTkError, true)
                            ),
                            ForAll(
                                Filter(colUserProjectAccess, And(AllProjects = false, IsActive = true)) As access,
                                IfError(
                                    Collect(colAllTkRaw, Filter(ProjectsTasks, ProjectID = access.ProjectID)),
                                    Set(varAllTkError, true)
                                )
                            )
                        )
                    );
                    If(
                        varAllTkError,
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل بعض المهام.", "Some tasks could not be loaded."), NotificationType.Warning)
                    );
                    Clear(colAllTk);
                    ForAll(
                        Distinct(colAllTkRaw, ID) As row,
                        Collect(colAllTk, LookUp(colAllTkRaw, ID = row.Value))
                    );
                    If(
                        Coalesce(gblSelectedTaskID, 0) > 0,
                        Set(varTask, LookUp(ProjectsTasks, ID = gblSelectedTaskID));
                        Set(gblSelectedTaskID, 0),
                        If(
                            Not(IsBlank(varCurrentTask)),
                            Set(varTask, LookUp(ProjectsTasks, ID = varCurrentTask.ID));
                            Set(varCurrentTask, Blank()),
                            If(
                                Coalesce(varTask.ID, 0) > 0,
                                Set(varTask, LookUp(ProjectsTasks, ID = varTask.ID))
                            )
                        )
                    );
                    If(
                        Coalesce(varTask.ID, 0) > 0,
                        ClearCollect(colTkHistory, Filter(ApprovalHistory, RequestItemID = Text(varTask.ID)));
                        Clear(colTkPeople);
                        With({p: LookUp(Employees, ID = varTask.AssignedToID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)));
                        With({p: LookUp(Employees, ID = varTask.AssignedByID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)));
                        With({p: LookUp(Employees, ID = varTask.ReviewerID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)))
                    )
                  Text: ="Reload"
                  Visible: =false
                  Width: =1
            - btnAllTkAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        If(
                            varTkOp = "start",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "In Progress"}, ActualStart: If(IsBlank(varTask.ActualStart), Now(), varTask.ActualStart)}))
                        );
                        If(
                            And(varTkOp = "submit", Or(Coalesce(varTask.AssignedByID, 0) = 0, varTask.AssignedByID = varTask.AssignedToID)),
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Completed"}, Progress: 100, CompletedDate: Now(), SubmittedDate: Now(), ApprovedDate: Now(), ActualStart: If(IsBlank(varTask.ActualStart), Now(), varTask.ActualStart)}))
                        );
                        If(
                            And(varTkOp = "submit", Coalesce(varTask.AssignedByID, 0) > 0, varTask.AssignedByID <> varTask.AssignedToID),
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Pending Approval"}, SubmittedDate: Now(), ReviewerID: varTask.AssignedByID, ActualStart: If(IsBlank(varTask.ActualStart), Now(), varTask.ActualStart)}))
                        );
                        If(
                            varTkOp = "approve",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Completed"}, Progress: 100, CompletedDate: Now(), ApprovedDate: Now()}))
                        );
                        If(
                            varTkOp = "return",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Reopened"}, ReturnCount: Coalesce(varTask.ReturnCount, 0) + 1}))
                        );
                        If(
                            varTkOp = "cancel",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Cancelled"}}))
                        );
                        If(
                            varTkOp = "reopen",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Status: {Value: "Reopened"}, CompletedDate: Blank(), Progress: If(Coalesce(varTask.Progress, 0) >= 100, 90, Coalesce(varTask.Progress, 0))}))
                        );
                        If(
                            varTkOp = "progress",
                            Set(varTask, Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varTask.ID), {Progress: Min(100, Max(0, Coalesce(varTkNum, 0))), Status: {Value: If(And(varTask.Status.Value = "Not Started", Coalesce(varTkNum, 0) > 0), "In Progress", varTask.Status.Value)}, ActualStart: If(And(Coalesce(varTkNum, 0) > 0, IsBlank(varTask.ActualStart)), Now(), varTask.ActualStart)}))
                        );
                        If(
                            And(varTkOp <> "start", varTkOp <> "progress"),
                            IfError(
                                Patch(
                                    ApprovalHistory,
                                    Defaults(ApprovalHistory),
                                    {
                                        Title: varTask.Title,
                                        RequestType: {Value: "Task"},
                                        RequestItemID: Text(varTask.ID),
                                        Action: {Value: Switch(varTkOp, "submit", "Submitted", "approve", "Approved", "return", "Returned", "cancel", "Cancelled", "reopen", "Reopened", "Submitted")},
                                        Decision: {Value: Switch(varTkOp, "approve", "Approved", "return", "Returned", "cancel", "Cancelled", "submit", If(Or(Coalesce(varTask.AssignedByID, 0) = 0, varTask.AssignedByID = varTask.AssignedToID), "Approved", "Pending"), "Pending")},
                                        Comments: Left(Coalesce(varTkNote, ""), 255),
                                        PerformedBy: {Id: varMeID, Value: varMeName},
                                        RequesterID: varTask.AssignedToID,
                                        RequestorID: varTask.AssignedToID,
                                        DecisionDate: Now()
                                    }
                                ),
                                Notify(If(gblLanguage = "Arabic", "حُفظت المهمة. تعذر كتابة سجل الاعتماد.", "The task was saved. The approval row could not be written."), NotificationType.Warning)
                            );
                            With(
                                {
                                    who: If(
                                        varTkOp = "submit",
                                        If(Or(Coalesce(varTask.AssignedByID, 0) = 0, varTask.AssignedByID = varTask.AssignedToID), 0, varTask.AssignedByID),
                                        If(varTask.AssignedToID = varMeID, 0, varTask.AssignedToID)
                                    )
                                },
                                If(
                                    who > 0,
                                    fnProjNotify(
                                        who,
                                        Coalesce(LookUp(colTkPeople, ID = who).FullName, ""),
                                        varTask.Title,
                                        Coalesce(varTkNote, varTask.Status.Value),
                                        "Task",
                                        varTask.ID,
                                        "Task"
                                    )
                                )
                            )
                        );
                        fnProjLog(
                            "Task: " & varTask.Title,
                            Coalesce(varTask.ProjectID, 0),
                            Coalesce(varTask.Project.Value, ""),
                            "Task",
                            varTask.ID,
                            Switch(
                                varTkOp,
                                "start", "Started",
                                "submit", "Submitted",
                                "approve", "Approved",
                                "return", "Returned",
                                "cancel", "Cancelled",
                                "reopen", "Reopened",
                                "progress", "Progress Updated",
                                "Updated"
                            ),
                            Coalesce(varTkNote, Text(Coalesce(varTask.Progress, 0)) & "%")
                        );
                        Select(btnAllTkReload);
                        Notify(If(gblLanguage = "Arabic", "تم تحديث المهمة.", "Task updated."), NotificationType.Success),
                        Notify(If(gblLanguage = "Arabic", "تعذر تحديث المهمة.", "The task could not be updated."), NotificationType.Error)
                    )
                  Text: ="Act"
                  Visible: =false
                  Width: =1
      - conAllTkPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpAllTkPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpAllTkTop.Height + 8
            Width: =Parent.Width
          Children:
            - conAllTkHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblAllTkTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "كل المهام", "All tasks")
                        Width: =160
                        Wrap: =false
                  - btnAllTkAll:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varTkScope, "my");
                          Set(varTask, Blank());
                          Navigate(scrMyTasks, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "مهامي", "My tasks")
                        Width: =110
                  - btnAllTkNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varTaskForm, "new");
                          Set(varTaskReturn, "all");
                          Set(varTkPresetActivityID, 0);
                          Set(varTask, Blank());
                          Navigate(scrTaskEditor, ScreenTransition.Cover)
                        Text: =If(gblLanguage = "Arabic", "مهمة", "Task")
                        Width: =100
            - conAllTkTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 100, 40)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                Children:
                  - txtAllTkSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في كل المهام", "Search all tasks")
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "ابحث بالعنوان أو المشروع", "Search title or project")
                        Width: =If(App.Width < 700, Parent.Width, 220)
                  - galAllTkChips:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =36
                        Items: |-
                          =Table(
                              {Key: "open", Label: If(gblLanguage = "Arabic", "المفتوحة", "Open")},
                              {Key: "review", Label: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "To approve")},
                              {Key: "overdue", Label: If(gblLanguage = "Arabic", "المتأخرة", "Overdue")},
                              {Key: "done", Label: If(gblLanguage = "Arabic", "المكتملة", "Done")},
                              {Key: "all", Label: If(gblLanguage = "Arabic", "الكل", "All")}
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =120
                        Width: =If(App.Width < 700, Parent.Width, 400)
                      Children:
                        - btnAllTkChip:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varTkQuick = ThisItem.Key, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              Height: =30
                              OnSelect: =Set(varTkQuick, ThisItem.Key)
                              Text: =ThisItem.Label
                              Width: =110
                  - btnAllTkArchived:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =If(varTkShowArchived, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTkShowArchived, Not(varTkShowArchived))
                        Text: =If(gblLanguage = "Arabic", "المؤرشفة", "Archived")
                        Width: =110
            - lblAllTkError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varAllTkError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل المهام.", "Tasks could not be loaded.")
                  Visible: =varAllTkError
                  Width: =Parent.Width
                  Wrap: =false
            - conAllTkBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 140
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - galAllTk:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 700, 1, 0)
                        Height: =Parent.Height
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  colAllTk,
                                  And(
                                      Or(varTkShowArchived, Not(Coalesce(IsArchived, false))),
                                      Or(
                                          varTkQuick = "all",
                                          And(varTkQuick = "open", Status.Value <> "Completed", Status.Value <> "Cancelled"),
                                          And(varTkQuick = "review", Or(Status.Value = "Pending Approval", Status.Value = "In Review")),
                                          And(varTkQuick = "overdue", Not(IsBlank(DueDate)), DueDate < Today(), Status.Value <> "Completed", Status.Value <> "Cancelled"),
                                          And(varTkQuick = "done", Status.Value = "Completed")
                                      ),
                                      Or(
                                          IsBlank(Trim(txtAllTkSearch.Text)),
                                          Trim(txtAllTkSearch.Text) in Coalesce(Title, ""),
                                          Trim(txtAllTkSearch.Text) in Coalesce(Project.Value, ""),
                                          Trim(txtAllTkSearch.Text) in Coalesce(AssignedTo.Value, "")
                                      )
                                  )
                              ),
                              "DueDate",
                              SortOrder.Ascending
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =72
                        Visible: =Or(App.Width >= 700, IsBlank(varTask))
                        Width: =If(App.Width < 700, Parent.Width, 360)
                      Children:
                        - btnAllTkRow:
                            Control: ModernButton@1.0.0
                            Properties:
                              Align: =Align.Left
                              Appearance: =If(ThisItem.ID = varTask.ID, ButtonAppearance.Primary, ButtonAppearance.Transparent)
                              Height: =64
                              OnSelect: |-
                                =Set(varTask, ThisItem);
                                Set(varTkPane, "Details");
                                ClearCollect(colTkHistory, Filter(ApprovalHistory, RequestItemID = Text(ThisItem.ID)));
                                Clear(colTkPeople);
                                With({p: LookUp(Employees, ID = ThisItem.AssignedToID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)));
                                With({p: LookUp(Employees, ID = ThisItem.AssignedByID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)));
                                With({p: LookUp(Employees, ID = ThisItem.ReviewerID)}, If(Coalesce(p.ID, 0) > 0, Collect(colTkPeople, p)))
                              Text: |-
                                =Concatenate(
                                    Coalesce(ThisItem.Title, ""),
                                    Char(10),
                                    Coalesce(ThisItem.Status.Value, ""),
                                    " · ",
                                    Coalesce(ThisItem.Project.Value, ""),
