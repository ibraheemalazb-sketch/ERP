Screens:
  scrTasks:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PTasks");
        Set(varNavSelectedID, 29);
        Set(varTkScope, "all");
        If(IsBlank(varAtQuick), Set(varAtQuick, "open"));
        If(IsBlank(varAtStatus), Set(varAtStatus, "All"));
        If(IsBlank(varAtView), Set(varAtView, "table"));
        If(IsBlank(varAtPane), Set(varAtPane, "details"));
        If(IsBlank(varAtArchived), Set(varAtArchived, false));
        If(IsBlank(varAtKpiOpen), Set(varAtKpiOpen, false));
        Set(varAtDlg, false);
        If(
            varAtFromEditor,
            Set(varAtFromEditor, false);
            Set(varAtSelID, Coalesce(If(Coalesce(gblSelectedTaskID, 0) > 0, gblSelectedTaskID), varEditingTask.ID, varAtSelID, 0));
            Set(gblSelectedTaskID, 0)
        );
        Reset(cmpAtView);
        Reset(cmpAtTable);
        Select(btnAtReload)
    Children:
      - conAtSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnAtReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varAtMe, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varAtMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, ""));
                    Set(varAtIsAdmin, Coalesce(gblUser.Role, "") in ["System Administrator", "Administrator", "Admin"]);
                    With(
                        {p: LookUp(colUserPermissions, Module.Value = "Projects")},
                        Set(varAtCanEdit, Or(varAtIsAdmin, Coalesce(p.CanEdit, false)));
                        Set(varAtCanCreate, Or(varAtIsAdmin, Coalesce(p.CanCreate, false)));
                        Set(
                            varAtScope,
                            If(
                                Or(varAtIsAdmin, Coalesce(p.CanViewAll, false), Coalesce(p.Scope.Value, "") = "All"),
                                "All",
                                Coalesce(p.Scope.Value, "Own")
                            )
                        )
                    );
                    Set(varAtErr, false);
                    Clear(colAtRaw);
                    Switch(
                        varAtScope,
                        "All",
                        IfError(
                            Collect(colAtRaw, SortByColumns(ProjectsTasks, "ID", SortOrder.Descending));
                            true,
                            Set(varAtErr, true)
                        ),
                        "Department",
                        IfError(
                            ForAll(
                                Filter(Projects, DepartmentID = Coalesce(gblCurrentEmployee.DepartmentID, -1)) As pr,
                                Collect(colAtRaw, Filter(ProjectsTasks, ProjectID = pr.ID))
                            );
                            true,
                            Set(varAtErr, true)
                        ),
                        "Project",
                        IfError(
                            If(
                                varUserHasAllProjects,
                                Collect(colAtRaw, SortByColumns(ProjectsTasks, "ID", SortOrder.Descending)),
                                ForAll(
                                    Filter(colUserProjectAccess, AllProjects = false, IsActive = true) As a,
                                    Collect(colAtRaw, Filter(ProjectsTasks, ProjectID = a.ProjectID))
                                )
                            );
                            true,
                            Set(varAtErr, true)
                        )
                    );
                    IfError(
                        Collect(colAtRaw, Filter(ProjectsTasks, Or(AssignedToID = varAtMe, AssignedByID = varAtMe)));
                        true,
                        Set(varAtErr, true)
                    );
                    ClearCollect(colAtTasks, ForAll(Distinct(colAtRaw, ID) As d, LookUp(colAtRaw, ID = d.Value)));
                    IfError(
                        ClearCollect(colAtProjAll, Projects);
                        true,
                        Set(varAtErr, true)
                    );
                    ClearCollect(colAtProjects, SortByColumns(Filter(colAtProjAll, ID in colAtTasks.ProjectID), "ProjectCode", SortOrder.Ascending));
                    ClearCollect(
                        colAtRows,
                        AddColumns(
                            colAtTasks,
                            StatusText, Coalesce(Status.Value, "Not Started"),
                            PriorityText, Coalesce(Priority.Value, "-"),
                            ProjectText, Coalesce(Project.Value, ""),
                            AssigneeText, Coalesce(AssignedTo.Value, ""),
                            ActivityText, Coalesce(Activity.Value, ""),
                            IsOpen, Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"]),
                            IsOverdue, And(Not(IsBlank(DueDate)), DueDate < Today(), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"])),
                            IsDueSoon, And(Not(IsBlank(DueDate)), DueDate >= Today(), DueDate <= DateAdd(Today(), 7, TimeUnit.Days), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"])),
                            DaysLeft, If(IsBlank(DueDate), 9999, DateDiff(Today(), DueDate, TimeUnit.Days)),
                            ProgressPct, Min(100, Max(0, Coalesce(Progress, 0))),
                            StatusGroup, Switch(
                                Coalesce(Status.Value, "Not Started"),
                                "In Progress", "doing",
                                "On Hold", "hold",
                                "Pending Approval", "review",
                                "In Review", "review",
                                "Completed", "done",
                                "Cancelled", "cancelled",
                                "todo"
                            ),
                            PriorityTone, With(
                                {pv: Coalesce(Priority.Value, "")},
                                If(
                                    Or("P1" in pv, "P2" in pv, "Critical" in pv, "High" in pv, "Urgent" in pv),
                                    "high",
                                    Or("P3" in pv, "Medium" in pv),
                                    "medium",
                                    "low"
                                )
                            )
                        )
                    );
                    ClearCollect(
                        colAtAssignees,
                        SortByColumns(
                            Filter(
                                ForAll(
                                    Distinct(colAtTasks, AssignedToID) As d,
                                    {ID: Coalesce(d.Value, 0), FullName: Coalesce(LookUp(colAtTasks, AssignedToID = d.Value).AssignedTo.Value, "")}
                                ),
                                ID > 0
                            ),
                            "FullName",
                            SortOrder.Ascending
                        )
                    );
                    Set(varAtSel, LookUp(colAtRows, ID = varAtSelID));
                    If(IsBlank(varAtSel), Set(varAtSelID, 0), Select(btnAtDetail));
                    If(
                        varAtErr,
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل بعض المهام.", "Some tasks could not be loaded."), NotificationType.Warning)
                    )
                  Text: ="Reload"
                  Visible: =false
                  Width: =1
            - btnAtDetail:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Clear(colAtPeople);
                    With(
                        {pr: LookUp(colAtProjAll, ID = varAtSel.ProjectID)},
                        ForAll(
                            Filter(
                                Distinct(
                                    Table(
                                        {v: Coalesce(varAtSel.AssignedToID, 0)},
                                        {v: Coalesce(varAtSel.AssignedByID, 0)},
                                        {v: Coalesce(varAtSel.ReviewerID, 0)},
                                        {v: Coalesce(pr.ProjectManagerID, pr.ProjectManager.Id, 0)}
                                    ),
                                    v
                                ),
                                Value > 0
                            ) As u,
                            With({e: LookUp(Employees, ID = u.Value)}, If(Not(IsBlank(e)), Collect(colAtPeople, e)))
                        )
                    );
                    IfError(
                        ClearCollect(
                            colAtLog,
                            SortByColumns(Filter(ProjectActivityLog, EntityID = varAtSel.ID, EntityType.Value = "Task"), "ID", SortOrder.Descending)
                        );
                        true,
                        Clear(colAtLog);
                        true
                    )
                  Text: ="Detail"
                  Visible: =false
                  Width: =1
            - btnAtAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varAtOk, true);
                    Set(varAtNote, Trim(txtAtDlgNote.Text));
                    Set(varAtCur, LookUp(ProjectsTasks, ID = varAtSel.ID));
                    Set(varAtOldStatus, Coalesce(varAtCur.Status.Value, "Not Started"));
                    Set(
                        varAtNewStatus,
                        Switch(varAtOp, "start", "In Progress", "resume", "In Progress", "complete", "Completed", "block", "On Hold", "reopen", "Reopened", varAtOldStatus)
                    );
                    If(
                        IsBlank(varAtCur),
                        Set(varAtOk, false);
                        Notify(If(gblLanguage = "Arabic", "لم يتم العثور على المهمة.", "The task could not be found."), NotificationType.Error),
                        Not(Or(varAtCur.AssignedToID = varAtMe, varAtCur.AssignedByID = varAtMe, varAtCanEdit)),
                        Set(varAtOk, false);
                        Notify(If(gblLanguage = "Arabic", "ليست لديك صلاحية تغيير حالة هذه المهمة.", "You do not have permission to change this task."), NotificationType.Error),
                        Not(Switch(
                            varAtOp,
                            "start", varAtOldStatus in ["Not Started", "Reopened"],
                            "resume", varAtOldStatus = "On Hold",
                            "complete", Not(varAtOldStatus in ["Completed", "Cancelled"]),
                            "block", varAtOldStatus in ["Not Started", "In Progress", "Reopened"],
                            "reopen", varAtOldStatus = "Completed",
                            false
                        )),
                        Set(varAtOk, false);
                        Notify(If(gblLanguage = "Arabic", "تغيرت حالة المهمة. تم تحديث القائمة.", "The task status has changed. The list has been refreshed."), NotificationType.Warning);
                        Select(btnAtReload),
                        And(varAtOp = "block", IsBlank(varAtNote)),
                        Set(varAtOk, false);
                        Notify(If(gblLanguage = "Arabic", "الرجاء كتابة سبب التعليق.", "Please enter the reason the task is on hold."), NotificationType.Warning)
                    );
                    If(
                        varAtOk,
                        IfError(
                            Set(
                                varAtPatched,
                                Patch(
                                    ProjectsTasks,
                                    varAtCur,
                                    {
                                        Status: {Value: varAtNewStatus},
                                        ActualStart: If(And(varAtOp in ["start", "resume", "complete"], IsBlank(varAtCur.ActualStart)), Today(), varAtCur.ActualStart),
                                        CompletedDate: Switch(varAtOp, "complete", Today(), "reopen", If(false, Today()), varAtCur.CompletedDate),
                                        Progress: Switch(varAtOp, "complete", 100, "reopen", Min(Coalesce(varAtCur.Progress, 0), 90), Coalesce(varAtCur.Progress, 0)),
                                        ReturnCount: If(varAtOp = "reopen", Coalesce(varAtCur.ReturnCount, 0) + 1, varAtCur.ReturnCount)
                                    }
                                )
                            ),
                            Set(varAtOk, false);
                            Notify(If(gblLanguage = "Arabic", "تعذر تحديث المهمة. حاول مرة أخرى.", "The task could not be updated. Please try again."), NotificationType.Error)
                        )
                    );
                    If(And(varAtOk, IsBlank(varAtPatched)), Set(varAtOk, false));
                    If(
                        varAtOk,
                        With(
                            {
                                pr: LookUp(colAtProjAll, ID = varAtPatched.ProjectID),
                                act: Switch(varAtOp, "start", "Started", "resume", "Resumed", "complete", "Completed", "block", "Blocked", "reopen", "Reopened", "Updated")
                            },
                            fnProjLog(
                                "Task: " & varAtPatched.Title,
                                Coalesce(varAtPatched.ProjectID, 0),
                                Coalesce(pr.ProjectCode, varAtPatched.Project.Value, ""),
                                "Task",
                                varAtPatched.ID,
                                act,
                                varAtOldStatus & " → " & varAtNewStatus & If(IsBlank(varAtNote), "", ": " & varAtNote)
                            );
                            ClearCollect(
                                colAtNotice,
                                Filter(
                                    Table(
                                        {UserID: Coalesce(varAtPatched.AssignedToID, 0), UserName: Coalesce(varAtPatched.AssignedTo.Value, "")},
                                        {UserID: Coalesce(varAtPatched.AssignedByID, 0), UserName: Coalesce(LookUp(Employees, ID = Coalesce(varAtPatched.AssignedByID, -1)).FullName, "")},
                                        {UserID: Coalesce(pr.ProjectManagerID, pr.ProjectManager.Id, 0), UserName: Coalesce(pr.ProjectManager.Value, "")}
                                    ),
                                    And(UserID > 0, UserID <> varAtMe)
                                )
                            );
                            ForAll(
                                ForAll(Distinct(colAtNotice, UserID), LookUp(colAtNotice, UserID = Value)) As person,
                                fnProjNotify(
                                    person.UserID,
                                    person.UserName,
                                    varAtPatched.Title,
                                    If(
                                        gblLanguage = "Arabic",
                                        varAtMeName & " غيّر حالة المهمة إلى " & varAtNewStatus & If(IsBlank(varAtNote), "", ": " & varAtNote),
                                        varAtMeName & " changed the task status to " & varAtNewStatus & If(IsBlank(varAtNote), "", ": " & varAtNote)
                                    ),
                                    "Task",
                                    varAtPatched.ID,
                                    "Task"
                                )
                            )
                        );
                        Set(varAtDlg, false);
                        Set(varAtSelID, varAtPatched.ID);
                        Select(btnAtReload);
                        Notify(
                            If(gblLanguage = "Arabic", "تم تحديث حالة المهمة إلى " & varAtNewStatus & ".", "Task status changed to " & varAtNewStatus & "."),
                            NotificationType.Success
                        )
                    )
                  Text: ="Act"
                  Visible: =false
                  Width: =1
      - conAtPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(And(App.Width < 700, IsBlank(varAtSel)), cmpAtPhone.Height, 0) + If(IsBlank(varAtSel), 80, 16)
            PaddingLeft: =If(App.Width < 700, 15, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth + 12, gblTheme.Controls.SideNavCollapsedWidth + 12))
            PaddingRight: =8
            PaddingTop: =cmpAtTop.Height + 12
            Width: =Parent.Width
          Children:
            - conAtList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 40
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsBlank(varAtSel)
                  Width: =Parent.Width
                Children:
                  - conAtHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =48
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - conAtHeadIcon:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("PrimaryLight")
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Width: =44
                            Children:
                              - imgAtHeadIcon:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =22
                                    Image: =fxSvg("List", fxThemeInk("Primary"))
                                    Width: =22
                        - conAtHeadText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =44
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                            Children:
                              - lblAtTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =24
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =15
                                    Text: =If(gblLanguage = "Arabic", "كل المهام", "All tasks")
                                    Width: =Parent.Width
                                    Wrap: =false
                              - lblAtSubtitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =20
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =If(gblLanguage = "Arabic", "النطاق: ", "Scope: ") & Switch(varAtScope, "All", If(gblLanguage = "Arabic", "كل المشاريع", "all projects"), "Department", If(gblLanguage = "Arabic", "مشاريع إدارتك", "your department"), "Project", If(gblLanguage = "Arabic", "مشاريعك", "your projects"), If(gblLanguage = "Arabic", "مهامك فقط", "your tasks only")) & " · " & Text(CountRows(colAtRows)) & If(gblLanguage = "Arabic", " مهمة", " tasks")
                                    Width: =Parent.Width
                                    Wrap: =false
                        - btnAtMine:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              Icon: ="Person"
                              OnSelect: |-
                                =Set(varTkScope, "my");
                                Set(varNavSelectedID, 24);
                                Navigate(scrMyTasks, ScreenTransition.None)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "مهامي", "My tasks"))
                              Width: =If(App.Width < 700, 44, 120)
                        - btnAtRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              Icon: ="ArrowSync"
                              OnSelect: =Select(btnAtReload)
                              Text: =""
                              Width: =44
                        - btnAtNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              Icon: ="Add"
                              OnSelect: |-
                                =Set(varEditorEntity, "Task");
                                Set(varParentActivity, Blank());
                                Set(varTkPresetActivityID, 0);
                                Set(varReturnScreen, "AllTasks");
                                Set(varMeID, varAtMe);
                                Set(varAtFromEditor, true);
                                Set(varEditorMode, "New");
                                Set(varEditingTask, Blank());
                                Set(varSelectedProject, If(IsBlank(cmbAtProject.Selected), Blank(), LookUp(Projects, ID = cmbAtProject.Selected.ID)));
                                Navigate(scrProjectEditor, ScreenTransition.Cover)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "مهمة جديدة", "New task"))
                              Visible: =varAtCanCreate
                              Width: =140
                  - btnAtKpi:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Outline
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =32
                        Icon: =If(varAtKpiOpen, "ChevronUp", "ChevronDown")
                        OnSelect: =Set(varAtKpiOpen, Not(Coalesce(varAtKpiOpen, false)))
                        Text: |-
                          =If(
                              varAtKpiOpen,
                              If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                              If(gblLanguage = "Arabic", "عرض المؤشرات", "View KPIs")
                          )
                        Visible: =App.Width < 700
                        Width: =Parent.Width
                  - cmpAtKpi:
                      Control: CanvasComponent
                      ComponentName: cmpKPIwNav
                      Properties:
                        AnimationEffect: ="None"
                        ColumnsLayout: |-
                          ={
                              Mobile: 2,
                              Tablet: 2,
                              Desktop: 4,
                              MobileBreakpoint: 700,
                              TabletBreakpoint: 1100,
                              DesktopBreakpoint: 1366
                          }
                        Data: |-
                          =Table(
                              {
                                  ID: 1,
                                  Icon: "List",
                                  Value: CountRows(Filter(colAtRows, IsOpen, Or(varAtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "مفتوحة", "Open"),
                                  Subtitle: If(gblLanguage = "Arabic", "لم تكتمل", "Still open"),
                                  Screen: "open",
                                  IconBg: If(gblTheme.Mode = "Dark", "#172030", "#ECF2FF"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#79B0FF", "#1B56E5"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 2,
                                  Icon: "Warning",
                                  Value: CountRows(Filter(colAtRows, IsOverdue, Or(varAtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "متأخرة", "Overdue"),
                                  Subtitle: If(gblLanguage = "Arabic", "تجاوزت الاستحقاق", "Past the due date"),
                                  Screen: "overdue",
                                  IconBg: If(gblTheme.Mode = "Dark", "#450A0A", "#FEF2F2"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#F87171", "#DC2626"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 3,
                                  Icon: "Clock",
                                  Value: CountRows(Filter(colAtRows, IsDueSoon, Or(varAtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "خلال 7 أيام", "Due in 7 days"),
                                  Subtitle: If(gblLanguage = "Arabic", "تستحق قريباً", "Coming due"),
                                  Screen: "soon",
                                  IconBg: If(gblTheme.Mode = "Dark", "#5C400E", "#FFFBEB"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#FBBF24", "#D97706"),
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 4,
                                  Icon: "Check",
                                  Value: CountRows(Filter(colAtRows, StatusText = "Completed", Or(varAtArchived, Not(Coalesce(IsArchived, false))))),
                                  Label: If(gblLanguage = "Arabic", "مكتملة", "Completed"),
                                  Subtitle: If(gblLanguage = "Arabic", "أُنجزت", "Finished tasks"),
                                  Screen: "done",
                                  IconBg: If(gblTheme.Mode = "Dark", "#14532D", "#F0FDF4"),
                                  IconColor: If(gblTheme.Mode = "Dark", "#4ADE80", "#16A34A"),
                                  SparklineData: "",
                                  isHidden: false
                              }
                          )
                        FontsSizesTitle: =12
                        Height: |-
                          =If(
                              Or(App.Width >= 700, Coalesce(varAtKpiOpen, false)),
                              With({cols: If(Parent.Width < 700, 2, 4)}, RoundUp(4 / cols, 0) * 108),
                              0
                          )
                        Icons: |-
                          =Table({Name: "List", SVG: ""})
                        IconsSize: =20
                        IsLoading: =false
                        KPINav: =
                        OnCardClick: |-
                          =Set(varAtQuick, Coalesce(varClickScreen, "open"));
                          Set(varAtStatus, "All");
                          Reset(cmbAtStatus)
                        Style: ="Compact"
                        StyleConfig: =
                        Theme: =gblTheme.Mode
                        Visible: =Or(App.Width >= 700, Coalesce(varAtKpiOpen, false))
                        Width: =Parent.Width
                  - conAtTools:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =If(App.Width < 700, 150, 44)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =44
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        Width: =Parent.Width
                      Children:
                        - txtAtSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في المهام", "Search tasks")
                              Height: =40
