                                  ComponentName: cmpStatusPill
                                  Properties:
                                    Compact: =false
                                    Height: =26
                                    Label: =Coalesce(varAtSel.PriorityText, "-")
                                    Status: =Coalesce(varAtSel.PriorityText, "-")
                                    Width: =Max(70, Len(Coalesce(cmpAtPriority.Label, "-")) * 7 + 24)
                        - lblAtMeta:
