                                    {Key: "In Progress", Label: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress")},
                                    {Key: "On Hold", Label: If(gblLanguage = "Arabic", "معلّقة", "On hold")},
                                    {Key: "Pending Approval", Label: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending approval")},
                                    {Key: "In Review", Label: If(gblLanguage = "Arabic", "قيد المراجعة", "In review")},
                                    {Key: "Reopened", Label: If(gblLanguage = "Arabic", "أعيد فتحها", "Reopened")},
                                    {Key: "Completed", Label: If(gblLanguage = "Arabic", "مكتملة", "Completed")},
                                    {Key: "Cancelled", Label: If(gblLanguage = "Arabic", "ملغاة", "Cancelled")}
                                ), Key = Coalesce(varAtStatus, "All"))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Label
                              Items: |-
                                =Table(
                                    {Key: "All", Label: If(gblLanguage = "Arabic", "كل الحالات", "All statuses")},
                                    {Key: "Not Started", Label: If(gblLanguage = "Arabic", "لم تبدأ", "Not started")},
                                    {Key: "In Progress", Label: If(gblLanguage = "Arabic", "قيد التنفيذ", "In progress")},
                                    {Key: "On Hold", Label: If(gblLanguage = "Arabic", "معلّقة", "On hold")},
                                    {Key: "Pending Approval", Label: If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending approval")},
                                    {Key: "In Review", Label: If(gblLanguage = "Arabic", "قيد المراجعة", "In review")},
                                    {Key: "Reopened", Label: If(gblLanguage = "Arabic", "أعيد فتحها", "Reopened")},
                                    {Key: "Completed", Label: If(gblLanguage = "Arabic", "مكتملة", "Completed")},
                                    {Key: "Cancelled", Label: If(gblLanguage = "Arabic", "ملغاة", "Cancelled")}
                                )
                              OnChange: |-
                                =Set(varAtStatus, Coalesce(Self.Selected.Key, "All"));
                                If(varAtStatus <> "All", Set(varAtQuick, "all"))
