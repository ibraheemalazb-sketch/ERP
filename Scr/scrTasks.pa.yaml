                                =Coalesce(varAtSel.ProjectText, "-") & "   •   " & If(IsBlank(varAtSel.ActivityText), "-", varAtSel.ActivityText) & "   •   " & If(IsBlank(varAtSel.AssigneeText), "-", varAtSel.AssigneeText)
