                        - galAttAll:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "سجلات الحضور", "Attendance records")
                              BorderStyle: =BorderStyle.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Items: |-
                                =With(
                                    {
                                        rows: SortByColumns(
                                            Filter(
                                                colAttendanceAll,
                                                Or(
                                                    varHRScope = "Own",
                                                    And(varHRScope = "All", Or(varUserHasAllProjects, ProjectID = gblSProject.ID)),
                                                    And(varHRScope <> "Own", varHRScope <> "All", ProjectID = gblSProject.ID)
                                                ),
                                                Or(IsBlank(cmbAttEmployee.Selected), EmployeeID = cmbAttEmployee.Selected.ID),
                                                Or(IsBlank(cmbAttDepartment.Selected), DepartmentID = cmbAttDepartment.Selected.ID),
                                                Or(IsBlank(cmbAttProject.Selected), ProjectID = cmbAttProject.Selected.ID),
                                                Or(IsBlank(cmbAttStatus.Selected), Status.Value = cmbAttStatus.Selected.Value),
                                                Or(IsBlank(dpAttFrom.SelectedDate), Date >= dpAttFrom.SelectedDate),
                                                Or(IsBlank(dpAttTo.SelectedDate), Date < DateAdd(dpAttTo.SelectedDate, 1, TimeUnit.Days))
                                            ),
                                            "Date",
                                            SortOrder.Descending
                                        ),
                                        pageSize: Coalesce(varAttendancePageSize, 15),
                                        pageNumber: Coalesce(varAttendancePage, 1)
                                    },
                                    FirstN(
                                        LastN(
                                            rows,
                                            Max(0, CountRows(rows) - ((pageNumber - 1) * pageSize))
                                        ),
                                        pageSize
                                    )
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =true
                              TemplatePadding: =If(Parent.Width >= 900, 0, 8)
                              TemplateSize: =If(Parent.Width >= 900, 44, 128)
                              Width: =Parent.Width
                              WrapCount: =If(Parent.Width >= 900, 1, If(Parent.Width >= 640, 2, 1))
