Screens:
  scrAttendance:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "HR");
        Set(VSc, "Attendance");
        Set(varAttendancePage, 1);
        Set(varAttendancePageSize, 15);
        Set(varShowAttendanceDetails, false);
        Set(varShowAttendanceEdit, false);
        If(IsBlank(varAttendanceTab), Set(varAttendanceTab, "My Attendance"));
        Set(AttView, "Mine");
        Set(VarUserAttendance, true);
        If(IsBlank(varAttFlt), Set(varAttFlt, true));
        If(IsBlank(varAttendancePeriod), Set(varAttendancePeriod, "This Month"));
        If(IsBlank(varCurrentEmployeeOfficeId), Set(varCurrentEmployeeOfficeId, gblUser.OfficeId));
        ClearCollect(
            colAttendancePeriods,
            {Value: "This Month", Label: If(gblLanguage = "Arabic", "هذا الشهر", "This Month")},
            {Value: "Last Month", Label: If(gblLanguage = "Arabic", "الشهر الماضي", "Last Month")},
            {Value: "Last 3 Months", Label: If(gblLanguage = "Arabic", "آخر 3 أشهر", "Last 3 Months")},
            {Value: "This Year", Label: If(gblLanguage = "Arabic", "هذه السنة", "This Year")},
            {Value: "All", Label: If(gblLanguage = "Arabic", "الكل", "All")}
        );
        ClearCollect(colAttendanceDepartments, Departments);
        ClearCollect(colAttendanceOffices, Offices);
        If(
            !varUserHasAllProjects,
            Clear(colUserAccessibleProjects);
            ForAll(
                Filter(colUserProjectAccess, AllProjects = false) As access,
                With(
                    {proj: LookUp(Projects, ID = access.ProjectID)},
                    If(!IsBlank(proj.ID), Collect(colUserAccessibleProjects, proj))
                )
            )
        );
        ClearCollect(
            colAttendanceProjects,
            If(varUserHasAllProjects, Projects, colUserAccessibleProjects)
        );
        Clear(colAttendanceEmployees);
        If(
            varHRScope = "Own",
            Collect(colAttendanceEmployees, Filter(Employees, ID = gblUser.ID)),
            If(
                Or(varHRScope = "All", varUserHasAllProjects),
                Collect(colAttendanceEmployees, Employees),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colAttendanceEmployees, Filter(Employees, ProjectID = proj.ID))
                )
            )
        );
        ClearCollect(
            colUserAttendance,
            Filter(AttendanceRecords, EmployeeNumber = gblUser.EmployeeNumber)
        );
        Clear(colAttendanceAll);
        If(
            varHRScope = "Own",
            Collect(colAttendanceAll, colUserAttendance),
            If(
                Or(varHRScope = "All", varUserHasAllProjects),
                Collect(colAttendanceAll, AttendanceRecords),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colAttendanceAll, Filter(AttendanceRecords, ProjectID = proj.ID))
                )
            )
        );
        If(
            And(varHRScope = "Project", IsEmpty(colAttendanceAll), !IsBlank(gblSProject.ID)),
            Collect(colAttendanceAll, Filter(AttendanceRecords, ProjectID = gblSProject.ID))
        );
        Set(
            varTodayAttendance,
            LookUp(
                colUserAttendance,
                And(
                    Date >= Today(),
                    Date < DateAdd(Today(), 1, TimeUnit.Days)
                )
            )
        );
        ClearCollect(colAttendanceSettings, AttendanceSettings);
        Set(
            varAttendanceSettings,
            LookUp(
                colAttendanceSettings,
                Or(
                    Office.Id = gblUser.OfficeId,
                    Office.Value = gblUser.Office
                )
            )
        )
    Children:
      - conAttNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpAttNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
                    If(!gblMenuExpanded, Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpAttTopBar:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            ModuleIcon: ="Clock"
            ModuleName: =If(gblLanguage = "Arabic", "الموارد البشرية", "Human Resources")
            OnSelectTitle: =Navigate(ScrHR, ScreenTransition.None)
            ScreenSubtitle: =If(gblLanguage = "Arabic", "الحضور", "Attendance")
            ScreenTitle: =If(gblLanguage = "Arabic", "قسم الموارد البشرية", "Human Resources")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =true
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpAttPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conAttPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =If(App.Width < 700, cmpAttPhoneNav.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 12)
            PaddingRight: =12
            PaddingTop: =cmpAttTopBar.Height + 8
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conAttHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 88, 48)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - lblAttTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        Size: =If(App.Width < 700, 15, 18)
                        Text: |-
                          =If(
                              AttView = "All",
                              If(gblLanguage = "Arabic", "حضور جميع الموظفين", "All Employees Attendance"),
                              If(
                                  Hour(Now()) < 12,
                                  If(gblLanguage = "Arabic", "صباح الخير", "Good Morning"),
                                  If(Hour(Now()) < 17, If(gblLanguage = "Arabic", "مساء الخير", "Good Afternoon"), If(gblLanguage = "Arabic", "مساء الخير", "Good Evening"))
                              ) & ", " & Coalesce(gblUser.FullName, "")
                          )
                        Width: =If(App.Width < 700, Parent.Width, Parent.Width - 280)
                  - conAttViewToggle:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width < 700, Parent.Width, 272)
                      Children:
                        - btnAttMine:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "حضوري", "My attendance")
                              Appearance: =If(AttView = "Mine", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="Clock"
                              OnSelect: =Set(AttView, "Mine")
                              Text: =If(gblLanguage = "Arabic", "حضوري", "My Attendance")
                              Width: =If(App.Width < 700, (Parent.Width - 8) / 2, 132)
                        - btnAttAll:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "حضور الجميع", "All attendance")
                              Appearance: =If(AttView = "All", ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="People"
                              OnSelect: =Set(AttView, "All")
                              Text: =If(gblLanguage = "Arabic", "الجميع", "All")
                              Width: =If(App.Width < 700, (Parent.Width - 8) / 2, 132)
            - conAttMine:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =AttView = "Mine"
                  Width: =Parent.Width
                Children:
                  - conAttMineTop:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =Parent.Width
                      Children:
                        - lblAttMineSub:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =24
                              Size: =gblTheme.Typography.BodySmall
                              Text: =If(gblLanguage = "Arabic", "إدارة الحضور", "Manage Attendance")
                              Width: =Parent.Width - 280
                        - lblAttTodayDate:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("Primary")
                              Fill: =fxThemeColor("PrimaryLighter")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =36
                              RadiusBottomLeft: =gblTheme.Radius.Round
                              RadiusBottomRight: =gblTheme.Radius.Round
                              RadiusTopLeft: =gblTheme.Radius.Round
                              RadiusTopRight: =gblTheme.Radius.Round
                              Size: =gblTheme.Typography.BodySmall
                              Text: |-
                                =With(
                                    {ar: gblLanguage = "Arabic"},
                                    Switch(Weekday(Today()), 1, If(ar, "الأحد", "Sunday"), 2, If(ar, "الإثنين", "Monday"), 3, If(ar, "الثلاثاء", "Tuesday"), 4, If(ar, "الأربعاء", "Wednesday"), 5, If(ar, "الخميس", "Thursday"), 6, If(ar, "الجمعة", "Friday"), If(ar, "السبت", "Saturday"))
                                    & " - " & Text(Today(), "dd") & " " &
                                    Switch(Month(Today()), 1, If(ar, "يناير", "January"), 2, If(ar, "فبراير", "February"), 3, If(ar, "مارس", "March"), 4, If(ar, "أبريل", "April"), 5, If(ar, "مايو", "May"), 6, If(ar, "يونيو", "June"), 7, If(ar, "يوليو", "July"), 8, If(ar, "أغسطس", "August"), 9, If(ar, "سبتمبر", "September"), 10, If(ar, "أكتوبر", "October"), 11, If(ar, "نوفمبر", "November"), If(ar, "ديسمبر", "December"))
                                    & " " & Text(Today(), "yyyy")
                                )
                              Visible: =App.Width >= 1100
                              Width: =260
                  - conAttMineBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(App.Width >= 1100, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =If(App.Width >= 1100, LayoutOverflow.Hide, LayoutOverflow.Scroll)
                        Width: =Parent.Width
                      Children:
                        - conAttMineSide:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width >= 1100, Parent.Height, 420)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =If(App.Width >= 1100, (Parent.Width - 8) / 3, Parent.Width)
                            Children:
                              - conAttToday:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =fxThemeColor("Border")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Surface")
                                    FillPortions: =0
                                    Height: =310
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    RadiusBottomLeft: =gblTheme.Radius.XL
                                    RadiusBottomRight: =gblTheme.Radius.XL
                                    RadiusTopLeft: =gblTheme.Radius.XL
                                    RadiusTopRight: =gblTheme.Radius.XL
                                    Width: =Parent.Width
                                  Children:
                                    - conAttTodayHead:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =32
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =Parent.Width
                                        Children:
                                          - icoAttToday:
                                              Control: ModernIcon@1.1.1
                                              Properties:
                                                Height: =24
                                                Icon: ="Clock"
                                                IconColor: =fxThemeColor("Primary")
                                                Width: =24
                                          - lblAttTodayTitle:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =fxThemeColor("TextPrimary")
                                                Font: =gblTheme.Typography.FontFamily
                                                FontWeight: =gblTheme.FontWeights.Bold
                                                Height: =24
                                                Size: =gblTheme.Typography.Body
                                                Text: =If(gblLanguage = "Arabic", "حضور اليوم", "Today's Attendance")
                                                Width: =Parent.Width - 150
                                          - tmrAttClock:
                                              Control: Timer@2.1.0
                                              Properties:
                                                AutoStart: =true
                                                Duration: =1000
                                                Height: =1
                                                OnTimerEnd: =Set(varClockTick, !varClockTick)
                                                Repeat: =true
                                                Visible: =false
                                                Width: =1
                                          - lblAttClock:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Align: =Align.Right
                                                Color: =fxThemeColor("Primary")
                                                Font: =gblTheme.Typography.FontFamily
                                                FontWeight: =gblTheme.FontWeights.Bold
                                                Height: =24
                                                Size: =gblTheme.Typography.Body
                                                Text: =Text(Now(), "hh:mm:ss AM/PM") & If(varClockTick, "", "")
                                                Width: =110
                                    - lblAttTodayMessage:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =fxThemeColor("TextPrimary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Medium
                                          Height: =40
                                          Size: =gblTheme.Typography.BodySmall
                                          Text: |-
                                            =If(
                                                IsBlank(varTodayAttendance.CheckInTime),
                                                If(gblLanguage = "Arabic", "لم تسجل حضورك اليوم.", "You have not marked yourself as present today."),
                                                If(
                                                    IsBlank(varTodayAttendance.CheckOutTime),
                                                    If(gblLanguage = "Arabic", "تم تسجيلك حاضرًا اليوم.", "You are marked present today."),
                                                    If(gblLanguage = "Arabic", "تم إكمال حضور اليوم.", "Today's attendance is complete.")
                                                )
                                            )
                                          Width: =Parent.Width
                                    - lblAttTodayStatus:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: |-
                                            =fxToneInk(
                                                Switch(
                                                    varTodayAttendance.Status.Value,
                                                    "Present", "success",
                                                    "Late", "warning",
                                                    "Pending Approval", "pending",
                                                    "Leave", "info",
                                                    "Absent", "danger",
                                                    "Exception", "info",
                                                    ""
                                                )
                                            )
                                          Fill: |-
                                            =fxToneFill(
                                                Switch(
                                                    varTodayAttendance.Status.Value,
                                                    "Present", "success",
                                                    "Late", "warning",
                                                    "Pending Approval", "pending",
                                                    "Leave", "info",
                                                    "Absent", "danger",
                                                    "Exception", "info",
                                                    ""
                                                )
                                            )
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =34
                                          RadiusBottomLeft: =gblTheme.Radius.Medium
                                          RadiusBottomRight: =gblTheme.Radius.Medium
                                          RadiusTopLeft: =gblTheme.Radius.Medium
                                          RadiusTopRight: =gblTheme.Radius.Medium
                                          Size: =gblTheme.Typography.Body
                                          Text: |-
                                            =If(
                                                IsBlank(varTodayAttendance),
                                                If(gblLanguage = "Arabic", "لم يتم تسجيل الحضور", "Not checked in"),
                                                Switch(
                                                    varTodayAttendance.Status.Value,
                                                    "Present", If(gblLanguage = "Arabic", "حاضر", "Present"),
                                                    "Late", If(gblLanguage = "Arabic", "متأخر", "Late"),
                                                    "Pending Approval", If(gblLanguage = "Arabic", "بانتظار الاعتماد", "Pending Approval"),
                                                    "Leave", If(gblLanguage = "Arabic", "إجازة", "Leave"),
                                                    "Absent", If(gblLanguage = "Arabic", "غائب", "Absent"),
                                                    "Exception", If(gblLanguage = "Arabic", "استثناء", "Exception"),
                                                    Coalesce(varTodayAttendance.Status.Value, "-")
                                                )
                                            )
                                          Width: =Parent.Width
                                    - galAttTodayStats:
                                        Control: Gallery@2.15.0
                                        Variant: Horizontal
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "ملخص اليوم", "Today summary")
                                          BorderStyle: =BorderStyle.None
                                          Fill: =Color.Transparent
                                          FillPortions: =0
                                          Height: =84
                                          Items: |-
                                            =Table(
                                                {k: If(gblLanguage = "Arabic", "تسجيل الحضور", "Check-In"), v: If(IsBlank(varTodayAttendance.CheckInTime), "--", Text(varTodayAttendance.CheckInTime, "hh:mm AM/PM")), ic: "Clock"},
                                                {k: If(gblLanguage = "Arabic", "تسجيل الانصراف", "Check-Out"), v: If(IsBlank(varTodayAttendance.CheckOutTime), "--", Text(varTodayAttendance.CheckOutTime, "hh:mm AM/PM")), ic: "ArrowExit"},
                                                {k: If(gblLanguage = "Arabic", "ساعات العمل", "Work Hours"), v: If(IsBlank(varTodayAttendance.WorkedHours), "--", Text(varTodayAttendance.WorkedHours, "0.00") & " h"), ic: "Clock"}
                                            )
                                          ShowScrollbar: =false
                                          TemplatePadding: =4
                                          TemplateSize: =If(Parent.Width < 360, Parent.Width, Parent.Width / 3)
                                          Width: =Parent.Width
                                        Children:
                                          - conAttTodayStat:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =fxThemeColor("SurfaceHover")
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =2
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =6
                                                PaddingTop: =6
                                                RadiusBottomLeft: =gblTheme.Radius.Large
                                                RadiusBottomRight: =gblTheme.Radius.Large
                                                RadiusTopLeft: =gblTheme.Radius.Large
                                                RadiusTopRight: =gblTheme.Radius.Large
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - icoAttTodayStat:
                                                    Control: ModernIcon@1.1.1
                                                    Properties:
                                                      Height: =18
                                                      Icon: =ThisItem.ic
                                                      IconColor: =fxThemeColor("Primary")
                                                      Width: =18
                                                - lblAttTodayStatLabel:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Align: =Align.Center
                                                      Color: =fxThemeColor("TextMuted")
                                                      Font: =gblTheme.Typography.FontFamily
                                                      Height: =16
                                                      Size: =10
                                                      Text: =ThisItem.k
                                                      Width: =Parent.Width
                                                - lblAttTodayStatValue:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      Align: =Align.Center
                                                      Color: =fxThemeColor("TextPrimary")
                                                      Font: =gblTheme.Typography.FontFamily
                                                      FontWeight: =gblTheme.FontWeights.Bold
                                                      Height: =20
                                                      Size: =gblTheme.Typography.BodySmall
                                                      Text: =ThisItem.v
                                                      Width: =Parent.Width
                                    - btnAttCheck:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "تسجيل الحضور أو الانصراف", "Check in or check out")
                                          Appearance: =ButtonAppearance.Primary
                                          BasePaletteColor: |-
                                            =If(
                                                IsBlank(varTodayAttendance.CheckInTime),
                                                fxThemeColor("Success"),
                                                If(IsBlank(varTodayAttendance.CheckOutTime), fxThemeColor("Danger"), fxThemeColor("TextMuted"))
                                            )
                                          DisplayMode: |-
                                            =If(
                                                And(!IsBlank(varTodayAttendance), !IsBlank(varTodayAttendance.CheckOutTime)),
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Height: =44
                                          Icon: =If(IsBlank(varTodayAttendance.CheckInTime), "CheckmarkCircle", If(IsBlank(varTodayAttendance.CheckOutTime), "ArrowExit", "Checkmark"))
                                          OnSelect: |-
                                            =Set(varAttendanceAction, If(IsBlank(varTodayAttendance.CheckInTime), "CheckIn", "CheckOut"));
                                            Set(varLocationCaptured, Location);
                                            If(
                                                Or(
                                                    IsBlank(varLocationCaptured.Latitude),
                                                    And(varLocationCaptured.Latitude = 0, varLocationCaptured.Longitude = 0)
                                                ),
                                                Notify(If(gblLanguage = "Arabic", "تعذر تحديد موقعك. يرجى تفعيل خدمة الموقع والمحاولة مرة أخرى.", "Unable to get your location. Please enable location services and try again."), NotificationType.Error),
                                                Set(varOfficeRadius, LookUp(colAttendanceOffices, ID = varCurrentEmployeeOfficeId).GeofenceRadiusMeters);
                                                Set(
                                                    varDistanceMeters,
                                                    With(
                                                        {
                                                            office: LookUp(colAttendanceOffices, ID = varCurrentEmployeeOfficeId),
                                                            devLat: varLocationCaptured.Latitude,
                                                            devLong: varLocationCaptured.Longitude
                                                        },
                                                        With(
                                                            {
                                                                lat1: Radians(devLat),
                                                                lat2: Radians(office.Latitude),
                                                                dLat: Radians(office.Latitude - devLat),
                                                                dLong: Radians(office.Longitude - devLong)
                                                            },
                                                            With(
                                                                {a: Power(Sin(dLat / 2), 2) + Cos(lat1) * Cos(lat2) * Power(Sin(dLong / 2), 2)},
                                                                6371000 * 2 * Asin(Sqrt(Min(1, Max(0, a))))
                                                            )
                                                        )
                                                    )
                                                );
                                                If(
                                                    varAttendanceAction = "CheckIn",
                                                    If(
                                                        varDistanceMeters > varOfficeRadius,
                                                        Notify(
                                                            If(
                                                                gblLanguage = "Arabic",
                                                                "تم رفض تسجيل الحضور. أنت خارج النطاق بمسافة " & Round(varDistanceMeters - varOfficeRadius, 0) & " متر." & Char(10) & "مسافتك: " & Round(varDistanceMeters, 0) & " متر." & Char(10) & "النطاق المطلوب: " & Round(varOfficeRadius, 0) & " متر.",
                                                                "Check-in rejected. You are " & Round(varDistanceMeters - varOfficeRadius, 0) & " meters outside the required range." & Char(10) & "Your distance: " & Round(varDistanceMeters, 0) & " meters." & Char(10) & "Required range: " & Round(varOfficeRadius, 0) & " meters."
                                                            ),
                                                            NotificationType.Error
                                                        ),
                                                        With(
                                                            {
                                                                lateMin: If(
                                                                    IsBlank(varAttendanceSettings.WorkStartTime),
                                                                    0,
                                                                    Max(0, DateDiff(DateValue(Today()) + TimeValue(varAttendanceSettings.WorkStartTime), Now(), TimeUnit.Minutes))
                                                                )
                                                            },
                                                            Set(
                                                                varTodayAttendance,
                                                                Patch(
                                                                    AttendanceRecords,
                                                                    If(IsBlank(varTodayAttendance), Defaults(AttendanceRecords), varTodayAttendance),
                                                                    {
                                                                        EmployeeNumber: gblUser.EmployeeNumber,
                                                                        EmployeeID: gblUser.ID,
                                                                        Date: If(IsBlank(varTodayAttendance.Date), Today(), varTodayAttendance.Date),
                                                                        OfficeID: varCurrentEmployeeOfficeId,
                                                                        ProjectID: gblUser.ProjectID,
                                                                        DepartmentID: gblCurrentEmployee.Department.Id,
                                                                        Employee: {Id: gblUser.ID, Value: gblUser.FullName},
                                                                        CheckInTime: Now(),
                                                                        DeviceTimestamp: Now(),
                                                                        CheckInLat: varLocationCaptured.Latitude,
                                                                        CheckInLong: varLocationCaptured.Longitude,
                                                                        DistanceFromOfficeMeters: varDistanceMeters,
                                                                        IsWithinGeofence: true,
                                                                        LateMinutes: lateMin,
                                                                        Status: {Value: If(lateMin > Coalesce(varAttendanceSettings.LateThresholdMinutes, 0), "Late", "Present")},
                                                                        SyncStatus: {Value: "Synced"}
                                                                    }
                                                                )
                                                            );
                                                            Refresh(AttendanceRecords);
                                                            Remove(colUserAttendance, LookUp(colUserAttendance, ID = varTodayAttendance.ID));
                                                            Collect(colUserAttendance, varTodayAttendance);
                                                            Remove(colAttendanceAll, LookUp(colAttendanceAll, ID = varTodayAttendance.ID));
                                                            Collect(colAttendanceAll, varTodayAttendance);
                                                            Notify(
                                                                If(
                                                                    lateMin > Coalesce(varAttendanceSettings.LateThresholdMinutes, 0),
                                                                    If(gblLanguage = "Arabic", "تم تسجيل الحضور. أنت متأخر " & lateMin & " دقيقة.", "Checked in successfully. You are " & lateMin & " minutes late."),
                                                                    If(gblLanguage = "Arabic", "تم تسجيل الحضور بنجاح.", "Checked in successfully.")
                                                                ),
                                                                NotificationType.Success
                                                            )
                                                        )
                                                    ),
                                                    Set(
                                                        varTodayAttendance,
                                                        Patch(
                                                            AttendanceRecords,
                                                            varTodayAttendance,
                                                            {
                                                                CheckOutTime: Now(),
                                                                CheckOutLat: varLocationCaptured.Latitude,
                                                                CheckOutLong: varLocationCaptured.Longitude,
                                                                WorkedHours: Round(DateDiff(varTodayAttendance.CheckInTime, Now(), TimeUnit.Minutes) / 60, 2)
                                                            }
                                                        )
                                                    );
                                                    Refresh(AttendanceRecords);
                                                    Remove(colUserAttendance, LookUp(colUserAttendance, ID = varTodayAttendance.ID));
                                                    Collect(colUserAttendance, varTodayAttendance);
                                                    Remove(colAttendanceAll, LookUp(colAttendanceAll, ID = varTodayAttendance.ID));
                                                    Collect(colAttendanceAll, varTodayAttendance);
                                                    Notify(If(gblLanguage = "Arabic", "تم تسجيل الانصراف بنجاح.", "Checked out successfully."), NotificationType.Success)
                                                )
                                            )
                                          Text: |-
                                            =If(
                                                IsBlank(varTodayAttendance.CheckInTime),
                                                If(gblLanguage = "Arabic", "تسجيل الحضور", "Mark Present"),
                                                If(
                                                    IsBlank(varTodayAttendance.CheckOutTime),
                                                    If(gblLanguage = "Arabic", "تسجيل الانصراف", "Check Out"),
                                                    If(gblLanguage = "Arabic", "مكتمل لليوم", "Completed for Today")
                                                )
                                            )
                                          Width: =Parent.Width
