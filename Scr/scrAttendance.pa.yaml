                                          FontWeight: =gblTheme.FontWeights.Medium
                                          Height: =20
                                          Size: =12
                                          Text: =Coalesce(ThisItem.Employee.Value, "-")
                                          Width: =If(Parent.Width >= 900, 80, Parent.Width - 100)
