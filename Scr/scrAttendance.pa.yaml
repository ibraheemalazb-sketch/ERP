                              AccessibleLabel: =If(gblLanguage = "Arabic", "القسم", "Department")
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "القسم", "Department")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Title
                              Items: =colAttendanceDepartments
                              OnChange: =Set(varAttendancePage, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 160)
                        - cmbAttProject:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              DefaultSelectedItems: =If(Or(varUserHasAllProjects, IsBlank(gblSProject)), Blank(), [gblSProject])
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =colAttendanceProjects
                              OnChange: |-
                                =If(
                                    And(!varUserHasAllProjects, IsBlank(Self.Selected)),
                                    Reset(cmbAttProject)
                                );
                                Set(gblSProject, Self.Selected);
                                Set(varAttendancePage, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 160)
                        - cmbAttStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(AttendanceRecords.Status)
                              OnChange: =Set(varAttendancePage, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, 140)
                        - dpAttFrom:
                            Control: ModernDatePicker@1.0.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "من تاريخ", "From date")
                              Height: =36
                              OnChange: =Set(varAttendancePage, 1)
                              Placeholder: =If(gblLanguage = "Arabic", "من تاريخ", "From date")
                              Width: =If(App.Width < 700, Parent.Width, 150)
                        - dpAttTo:
                            Control: ModernDatePicker@1.0.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إلى تاريخ", "To date")
                              Height: =36
                              OnChange: =Set(varAttendancePage, 1)
                              Placeholder: =If(gblLanguage = "Arabic", "إلى تاريخ", "To date")
                              Width: =If(App.Width < 700, Parent.Width, 150)
                        - btnAttClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح جميع عوامل التصفية", "Clear all filters")
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="Dismiss"
                              OnSelect: |-
                                =Reset(cmbAttEmployee);
                                Reset(cmbAttDepartment);
                                If(varUserHasAllProjects, Reset(cmbAttProject));
                                Reset(cmbAttStatus);
                                Reset(dpAttFrom);
                                Reset(dpAttTo);
                                Set(varAttendancePage, 1)
                              Text: =If(gblLanguage = "Arabic", "مسح الكل", "Clear all")
                              Width: =If(App.Width < 700, Parent.Width, 120)
