                                    Height: =24
                                    Size: =gblTheme.Typography.Caption
                                    Text: =If(gblLanguage = "Arabic", "جرّب تغيير عوامل التصفية أو نطاق التاريخ.", "Try changing the filters or the date range.")
                                    Width: =Parent.Width
                        - conAttFooter:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("SurfaceHover")
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              Width: =Parent.Width
                            Children:
                              - lblAttCount:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =24
                                    Size: =11
                                    Text: =If(gblLanguage = "Arabic", "عرض " & CountRows(galAttAll.AllItems) & " سجل", "Showing " & CountRows(galAttAll.AllItems) & " records")
                                    Width: =Parent.Width - 160
                              - btnAttPrev:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الصفحة السابقة", "Previous page")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    DisplayMode: =If(varAttendancePage > 1, DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    Icon: ="ChevronLeft"
                                    OnSelect: =Set(varAttendancePage, varAttendancePage - 1)
                                    Text: =""
                                    Width: =36
                              - lblAttPage:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =24
                                    Size: =11
                                    Text: =If(gblLanguage = "Arabic", "صفحة ", "Page ") & varAttendancePage
                                    Width: =70
                              - btnAttNext:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الصفحة التالية", "Next page")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    DisplayMode: =If(CountRows(galAttAll.AllItems) = Coalesce(varAttendancePageSize, 15), DisplayMode.Edit, DisplayMode.Disabled)
                                    Height: =36
                                    Icon: ="ChevronRight"
                                    OnSelect: =Set(varAttendancePage, varAttendancePage + 1)
                                    Text: =""
                                    Width: =36
