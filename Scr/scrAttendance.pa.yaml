                                            =fxToneInk(
                                                Switch(ThisItem.Status.Value, "Present", "success", "Late", "warning", "Absent", "danger", "Leave", "info", "Holiday", "info", "Weekend", "", "Pending Approval", "pending", "Exception", "info", "")
                                            )
                                          Fill: |-
                                            =fxToneFill(
                                                Switch(ThisItem.Status.Value, "Present", "success", "Late", "warning", "Absent", "danger", "Leave", "info", "Holiday", "info", "Weekend", "", "Pending Approval", "pending", "Exception", "info", "")
                                            )
