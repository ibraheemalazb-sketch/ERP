                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - lblAttAllTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =32
                              Size: =gblTheme.Typography.BodySmall
                              Text: |-
                                =Switch(
                                    varHRScope,
                                    "All", If(gblLanguage = "Arabic", "النطاق: الكل", "Scope: All"),
                                    "Own", If(gblLanguage = "Arabic", "النطاق: خاص بي", "Scope: Own"),
                                    "Project", If(gblLanguage = "Arabic", "النطاق: المشروع", "Scope: Project"),
                                    Coalesce(varHRScope, "")
                                )
                              Width: =Parent.Width - 160
                        - btnAttFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "التصفية", "Filters")
                              Appearance: =If(Coalesce(varAttFlt, true), ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="Filter"
                              OnSelect: =Set(varAttFlt, !Coalesce(varAttFlt, true))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                              Width: =If(App.Width < 700, 44, 110)
                        - btnAttAllRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث الحضور", "Refresh attendance")
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("Primary")
                              Height: =36
                              Icon: ="ArrowClockwise"
                              OnSelect: |-
                                =Refresh(AttendanceRecords);
                                Refresh(Employees);
                                Refresh(Departments);
                                ClearCollect(colAttendanceDepartments, Departments);
                                ClearCollect(colAttendanceOffices, Offices);
                                Clear(colAttendanceEmployees);
                                If(
                                    varHRScope = "Own",
                                    Collect(colAttendanceEmployees, Filter(Employees, ID = gblUser.ID)),
                                    If(
                                        Or(varHRScope = "All", varUserHasAllProjects),
                                        Collect(colAttendanceEmployees, Employees),
                                        ForAll(
                                            colUserAccessibleProjects As proj,
                                            Collect(colAttendanceEmployees, Filter(Employees, ProjectID = proj.ID))
                                        )
                                    )
                                );
                                ClearCollect(colUserAttendance, Filter(AttendanceRecords, EmployeeNumber = gblUser.EmployeeNumber));
                                Clear(colAttendanceAll);
                                If(
                                    varHRScope = "Own",
                                    Collect(colAttendanceAll, colUserAttendance),
                                    If(
                                        Or(varHRScope = "All", varUserHasAllProjects),
                                        Collect(colAttendanceAll, AttendanceRecords),
                                        ForAll(
                                            colUserAccessibleProjects As proj,
                                            Collect(colAttendanceAll, Filter(AttendanceRecords, ProjectID = proj.ID))
                                        )
                                    )
                                );
                                Set(varAttendancePage, 1)
                              Text: =""
                              Width: =36
                  - conAttFilters:
