      - cmpNotif_Dash:
          Control: CanvasComponent
          ComponentName: cmpNotificationsPanel
          Properties:
            Visible: =locNotifOpen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: |-
              =ForAll(colFinNotif As n, {ID: n.ID, Title: n.Title, Message: n.Message, Created: n.Created, Link: n.Link, RelatedEntity: n.RelatedEntity.Value, RelatedItemID: n.RelatedItemID})
            OnClose: |-
              =UpdateContext({locNotifOpen: false})
            OnMarkAllRead: =fnMarkAllNotificationsRead()
            OnOpenItem: |-
              =UpdateContext({locNotifOpen: false});
              fnOpenNotification(cmpNotif_Dash.SelectedItem.ID, cmpNotif_Dash.SelectedItem.RelatedEntity, cmpNotif_Dash.SelectedItem.RelatedItemID, cmpNotif_Dash.SelectedItem.Link)
      - btnDashReload:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locLoading: true, locError: false});
              Clear(colDashSnap); Clear(colDashMonthly); Clear(colDashSource); Clear(colDashDelayed); Clear(colDashOverdue);
              IfError(
                  Concurrent(
                      // 1. KPI snapshot rows (MainFinanceProcurement; KPIType choice equality, small fixed OR set = delegable)
                      If(
                  canViewAllProjects,
                  Collect(colDashSnap, ForAll(Filter(MainFinanceProcurement, KPIType.Value = cfgKPI.TotalBudget || KPIType.Value = cfgKPI.Committed || KPIType.Value = cfgKPI.Spent || KPIType.Value = cfgKPI.Remaining || KPIType.Value = cfgKPI.CashPosition) As r, {ProjectID: r.ProjectID, KPIType: r.KPIType.Value, AmountValue: r.AmountValue, LastUpdated: r.LastUpdated})),
                  ForAll(colMyProjects As p, Collect(colDashSnap, ForAll(Filter(MainFinanceProcurement, ProjectID = p.ID, KPIType.Value = cfgKPI.TotalBudget || KPIType.Value = cfgKPI.Committed || KPIType.Value = cfgKPI.Spent || KPIType.Value = cfgKPI.Remaining || KPIType.Value = cfgKPI.CashPosition) As r, {ProjectID: r.ProjectID, KPIType: r.KPIType.Value, AmountValue: r.AmountValue, LastUpdated: r.LastUpdated})))
              ),
                      // 2. Monthly spend rows, last 12 months (DateValue >= date is delegable)
                      If(
                  canViewAllProjects,
                  Collect(colDashMonthly, ForAll(Filter(MainFinanceProcurement, KPIType.Value = cfgKPI.MonthlySpend, DateValue >= locFromMonth) As r, {ProjectID: r.ProjectID, Month: Date(Year(r.DateValue), Month(r.DateValue), 1), AmountValue: r.AmountValue})),
                  ForAll(colMyProjects As p, Collect(colDashMonthly, ForAll(Filter(MainFinanceProcurement, ProjectID = p.ID, KPIType.Value = cfgKPI.MonthlySpend, DateValue >= locFromMonth) As r, {ProjectID: r.ProjectID, Month: Date(Year(r.DateValue), Month(r.DateValue), 1), AmountValue: r.AmountValue})))
              ),
                      // 3. Spend by source rows
                      If(
                  canViewAllProjects,
                  Collect(colDashSource, ForAll(Filter(MainFinanceProcurement, KPIType.Value = cfgKPI.SpendBySource) As r, {ProjectID: r.ProjectID, Category: r.Category, AmountValue: r.AmountValue})),
                  ForAll(colMyProjects As p, Collect(colDashSource, ForAll(Filter(MainFinanceProcurement, ProjectID = p.ID, KPIType.Value = cfgKPI.SpendBySource) As r, {ProjectID: r.ProjectID, Category: r.Category, AmountValue: r.AmountValue})))
              ),
                      // 4. Delayed donor tranches (DonorFunding.Status is Indexed; exact value "Delayed")
                      If(
                  canViewAllProjects,
                  Collect(colDashDelayed, ForAll(FirstN(Sort(Filter(DonorFunding, Status.Value = "Delayed"), ExpectedDate, SortOrder.Ascending), 50) As r, {ID: r.ID, ProjectID: r.ProjectID, Donor: r.Donor, TrancheNo: r.TrancheNo, ExpectedDate: r.ExpectedDate, Amount: r.Amount, Currency: r.Currency.Value})),
                  ForAll(colMyProjects As p, Collect(colDashDelayed, ForAll(FirstN(Sort(Filter(DonorFunding, ProjectID = p.ID, Status.Value = "Delayed"), ExpectedDate, SortOrder.Ascending), 20) As r, {ID: r.ID, ProjectID: r.ProjectID, Donor: r.Donor, TrancheNo: r.TrancheNo, ExpectedDate: r.ExpectedDate, Amount: r.Amount, Currency: r.Currency.Value})))
              ),
                      // 5. Overdue payment requests: Pending and older than cfgPROverdueDays (no CountRows - list only)
                      If(
                  canViewAllProjects,
                  Collect(colDashOverdue, ForAll(FirstN(Sort(Filter(PaymentRequests, RequestStatus.Value = cfgPRStatus.Pending, RequestDate < DateAdd(Today(), -cfgPROverdueDays, TimeUnit.Days)), RequestDate, SortOrder.Ascending), 50) As r, {ID: r.ID, RequestNumber: r.RequestNumber, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, RequestedAmount: r.RequestedAmount, Currency: r.Currency.Value})),
                  ForAll(colMyProjects As p, Collect(colDashOverdue, ForAll(FirstN(Sort(Filter(PaymentRequests, ProjectID = p.ID, RequestStatus.Value = cfgPRStatus.Pending, RequestDate < DateAdd(Today(), -cfgPROverdueDays, TimeUnit.Days)), RequestDate, SortOrder.Ascending), 20) As r, {ID: r.ID, RequestNumber: r.RequestNumber, ProjectID: r.ProjectID, ProjectCode: r.ProjectCode, RequestDate: r.RequestDate, RequestedAmount: r.RequestedAmount, Currency: r.Currency.Value})))
              )
                  ),
                  UpdateContext({locError: true});
                  Trace("Dashboard load failed: " & FirstError.Message, TraceSeverity.Error)
              );
              // ---- everything below is LOCAL (small collections) - no data calls ----
              With(
                  {_p: Coalesce(varProjectID, 0)},
                  With(
                      {_rows: Filter(colDashSnap, _p = 0 || ProjectID = _p)},
                      UpdateContext({locKPI: {
                          Budget: Sum(Filter(_rows, KPIType = cfgKPI.TotalBudget), AmountValue),
                          Committed: Sum(Filter(_rows, KPIType = cfgKPI.Committed), AmountValue),
                          Spent: Sum(Filter(_rows, KPIType = cfgKPI.Spent), AmountValue),
                          Remaining: Sum(Filter(_rows, KPIType = cfgKPI.Remaining), AmountValue),
                          Cash: Sum(Filter(_rows, KPIType = cfgKPI.CashPosition), AmountValue),
                          HasSnapshot: !IsEmpty(_rows),
                          Updated: Max(_rows, LastUpdated),
                          Projects: CountRows(Filter(colMyProjects, _p = 0 || ID = _p))
                      }})
                  );
                  // Project table rows, pre-joined with their snapshot values (no LookUp inside gallery templates - spec 9)
                  ClearCollect(
                      colDashProjects,
                      ForAll(
                          Filter(colMyProjects, _p = 0 || ID = _p) As pr,
                          With(
                              {
                                  _b: Coalesce(LookUp(colDashSnap, ProjectID = pr.ID && KPIType = cfgKPI.TotalBudget).AmountValue, pr.Budget),
                                  _c: LookUp(colDashSnap, ProjectID = pr.ID && KPIType = cfgKPI.Committed).AmountValue,
                                  _s: LookUp(colDashSnap, ProjectID = pr.ID && KPIType = cfgKPI.Spent).AmountValue,
                                  _r: LookUp(colDashSnap, ProjectID = pr.ID && KPIType = cfgKPI.Remaining).AmountValue
                              },
                              {
                                  ID: pr.ID, ProjectCode: pr.ProjectCode, Title: pr.Title, Donor: pr.Donor,
                                  Budget: _b, Committed: _c, Spent: _s,
                                  Remaining: Coalesce(_r, _b - Coalesce(_c, 0) - Coalesce(_s, 0)),
                                  Util: Coalesce(fnUtilFromProject(pr.BudgetUtilization), fnUtilRatio(_b, _c, _s)),
                                  Health: pr.HealthStatus.Value
                              }
                          )
                      )
                  );
                  // 12-month trend (sum of per-project monthly snapshot rows) and spend by source
                  ClearCollect(
                      colDashTrend,
                      ForAll(
                          Sequence(12, 0) As i,
                          With(
                              {_m: DateAdd(locFromMonth, i.Value, TimeUnit.Months)},
                              {Month: _m, Amount: Sum(Filter(colDashMonthly, Month = _m && (_p = 0 || ProjectID = _p)), AmountValue)}
                          )
                      )
                  );
                  ClearCollect(
                      colDashSourceAgg,
                      Table(
                          {Order: 1, Label: fnT("src.payroll", "Payroll"), Amount: Sum(Filter(colDashSource, Category = cfgSpendSource.Payroll && (_p = 0 || ProjectID = _p)), AmountValue)},
                          {Order: 2, Label: fnT("src.procurement", "Procurement"), Amount: Sum(Filter(colDashSource, Category = cfgSpendSource.Procurement && (_p = 0 || ProjectID = _p)), AmountValue)},
                          {Order: 3, Label: fnT("src.payments", "Payment requests"), Amount: Sum(Filter(colDashSource, Category = cfgSpendSource.Payments && (_p = 0 || ProjectID = _p)), AmountValue)}
                      )
                  );
                  // Alerts: unread budget alerts (flow 9 writes Notifications), delayed tranches, overdue requests
                  ClearCollect(
                      colDashAlerts,
                      ForAll(
                          Filter(colFinNotif, RelatedEntity.Value = cfgNotifEntity.BudgetLine) As n,
                          {Kind: "budget", RefID: n.RelatedItemID, Title: n.Title, Sub: n.Message, Days: DateDiff(n.Created, Now(), TimeUnit.Days), Tone: "danger"}
                      ),
                      ForAll(
                          Filter(colDashDelayed, _p = 0 || ProjectID = _p) As d,
                          {Kind: "funding", RefID: d.ID, Title: d.Donor & " - " & fnT("fund.tranche", "tranche") & " " & d.TrancheNo,
                            Sub: fnMoney(d.Amount, d.Currency) & " | " & fnT("fund.expected", "expected") & " " & Text(d.ExpectedDate, "dd mmm yyyy", appLocale),
                            Days: DateDiff(d.ExpectedDate, Today(), TimeUnit.Days), Tone: "danger"}
                      ),
                      ForAll(
                          Filter(colDashOverdue, _p = 0 || ProjectID = _p) As o,
                          {Kind: "pr", RefID: o.ID, Title: Coalesce(o.RequestNumber, fnT("pr.numberPending", "(number pending)")) & " - " & o.ProjectCode,
                            Sub: fnMoney(o.RequestedAmount, o.Currency), Days: DateDiff(o.RequestDate, Today(), TimeUnit.Days), Tone: "warning"}
                      )
                  )
              );
              UpdateContext({locLoading: false})
      - tmrDashBoot:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Start: =varFinReady && !locBooted
            Duration: =1
            AutoStart: =false
            Repeat: =false
            OnTimerEnd: |-
              =UpdateContext({locBooted: true});
              If(
                  !hasFinanceAccess,
                  Navigate(scrFinNoAccess, ScreenTransition.None),
                  fnRefreshHeaderData(); Select(btnDashReload)
              )
