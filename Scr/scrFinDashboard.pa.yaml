# scrFinDashboard - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinDashboard, set its properties from 03-screens-batch-a.md,
# then paste screens/paste/scrFinDashboard.controls.pa.yaml onto it.
Screens:
  scrFinDashboard:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 51);
        UpdateContext({locFromMonth: DateAdd(Date(Year(Today()), Month(Today()), 1), -11, TimeUnit.Months)});
        If(
            varFinReady,
            UpdateContext({locBooted: true});
            If(!hasFinanceAccess, Navigate(scrFinNoAccess, ScreenTransition.None), fnRefreshHeaderData(); Select(btnDashReload))
        )
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_Dash:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_Dash:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Navigate(scrFinance, ScreenTransition.None)
            ScreenTitle: =fnT("nav.dashboard", "Finance dashboard")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_Dash:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conDashRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conDashMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - cmpCtx_Dash:
                    Control: CanvasComponent
                    ComponentName: cmpFinContext
                    Properties:
                      ProjectOptions: |-
                        =Table({Key: 0, Value: fnT("hdr.allProjects", "All my projects")}, colProjectOptions)
                      PeriodOptions: =tblPeriods
                      DefaultProjectKey: =Coalesce(varProjectID, 0)
                      DefaultPeriodKey: =Coalesce(varPeriodKey, currentPeriodKey)
                      Height: =48
                      FillPortions: =0
                      AlignInContainer: =AlignInContainer.Stretch
                      LayoutMinWidth: =0
                      LayoutMinHeight: =0
                      OnProjectChange: =Set(varProjectID, cmpCtx_Dash.SelectedProjectKey); Select(btnDashReload)
                      OnPeriodChange: =Set(varPeriodKey, cmpCtx_Dash.SelectedPeriodKey)
                  - conDashBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - lblDashSnapInfo:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =If(locLoading || !varFinReady, fnT("common.loading", "Loading..."), If(locKPI.HasSnapshot, fnT("dash.snapshotFrom", "Figures from the nightly snapshot, updated") & " " & Text(locKPI.Updated, "dd mmm yyyy hh:mm", appLocale), fnT("dash.noSnapshot", "No snapshot rows found for these KPI types yet (KPIs show 0). Project budgets in the table fall back to Projects.Budget.")))
                              Font: =fontBase
                              Size: =fsCaption
                              Color: =FinTheme.TextSecondary
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Wrap: =true
                              Align: =alignStart
                              VerticalAlign: =VerticalAlign.Middle
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =20
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - cmpEmpty_DashErr:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =locError
                              Variant: ="error"
                              ActionText: =fnT("common.retry", "Retry")
                              Height: =280
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              OnAction: =Select(btnDashReload)
                        - conDashKPI:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp2
                              LayoutWrap: =true
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!locError
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =RoundUp(6 / kpiColumns, 0) * 128 + (RoundUp(6 / kpiColumns, 0) - 1) * sp2
                            Children:
                              - cmpKPI_DashBudget:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.totalBudget", "Total budget")
                                    KPIValue: =locKPI.Budget
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =fnCount(locKPI.Projects) & " " & fnT("kpi.projects", "projects")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =true
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnCardSelect: =fnNavigate("budgets")
                              - cmpKPI_DashCommitted:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.committed", "Committed")
                                    KPIValue: =locKPI.Committed
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =fnPct(If(locKPI.Budget > 0, locKPI.Committed / locKPI.Budget, Blank())) & " " & fnT("kpi.ofBudget", "of budget")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_DashSpent:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.spent", "Spent")
                                    KPIValue: =locKPI.Spent
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =""
                                    Subtext: =fnPct(If(locKPI.Budget > 0, locKPI.Spent / locKPI.Budget, Blank())) & " " & fnT("kpi.ofBudget", "of budget")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =true
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnCardSelect: =fnNavigate("payments")
                              - cmpKPI_DashRemaining:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.remaining", "Remaining")
                                    KPIValue: =locKPI.Remaining
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =If(locKPI.Remaining < 0, "dangerStrong", "")
                                    Subtext: =""
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =true
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    OnCardSelect: =fnNavigate("budgets")
                              - cmpKPI_DashUtil:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.utilization", "Utilization")
                                    KPIValue: =fnUtilRatio(locKPI.Budget, locKPI.Committed, locKPI.Spent)
                                    ValueFormat: ="percent"
                                    Currency: ="USD"
                                    Tone: =fnUtilTone(fnUtilRatio(locKPI.Budget, locKPI.Committed, locKPI.Spent))
                                    Subtext: =fnT("kpi.utilFormula", "(committed + spent) / budget")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                              - cmpKPI_DashCash:
                                  Control: CanvasComponent
                                  ComponentName: cmpKPICard
                                  Properties:
                                    Label: =fnT("kpi.cash", "Cash position")
                                    KPIValue: =locKPI.Cash
                                    ValueFormat: ="money"
                                    Currency: ="USD"
                                    Tone: =If(locKPI.Cash < 0, "danger", "")
                                    Subtext: =fnT("kpi.cashSub", "Funds received minus spent")
                                    Loading: =locLoading || !varFinReady
                                    Selectable: =false
                                    Width: =(Parent.Width - (kpiColumns - 1) * sp2) / kpiColumns - 1
                                    Height: =128
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                        - conDashRow1:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =If(isDesktop, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp2
                              LayoutWrap: =false
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!locError
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =If(isDesktop, Max((28 + sp1 + If(isMobile, Max(1, Min(CountRows(colDashProjects), 5)) * 104 + 60, 40 + Max(1, Min(CountRows(colDashProjects), 8)) * 52 + 60) + sp2 * 2), 320 * 2 + sp2), (28 + sp1 + If(isMobile, Max(1, Min(CountRows(colDashProjects), 5)) * 104 + 60, 40 + Max(1, Min(CountRows(colDashProjects), 8)) * 52 + 60) + sp2 * 2) + sp2 + If(isMobile, 320 * 2 + sp2, 320))
                            Children:
                              - conDashProjCard:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =sp1
                                    LayoutWrap: =false
                                    PaddingTop: =sp2
                                    PaddingRight: =sp2
                                    PaddingBottom: =sp2
                                    PaddingLeft: =sp2
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =borderWidth
                                    Fill: =FinTheme.Surface
                                    RadiusTopLeft: =radiusCard
                                    RadiusTopRight: =radiusCard
                                    RadiusBottomLeft: =radiusCard
                                    RadiusBottomRight: =radiusCard
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    BorderColor: =FinTheme.Border
                                    FillPortions: =If(isDesktop, 2, 0)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =(28 + sp1 + If(isMobile, Max(1, Min(CountRows(colDashProjects), 5)) * 104 + 60, 40 + Max(1, Min(CountRows(colDashProjects), 8)) * 52 + 60) + sp2 * 2)
                                  Children:
                                    - lblDashProjTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: =fnT("dash.projects", "Projects")
                                          Font: =fontBase
                                          Size: =fsSection
                                          Color: =FinTheme.Text
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =false
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: =28
                                          FontWeight: =FontWeight.Semibold
                                          Role: =TextRole.Heading2
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                    - cmpDataTable_DashProj:
                                        Control: CanvasComponent
                                        ComponentName: cmpDataTable
                                        Properties:
                                          RowItems: |-
                                            =ForAll(Sort(colDashProjects, ProjectCode, SortOrder.Ascending) As r, {RowID: r.ID, Primary: r.ProjectCode, Secondary: r.Title, C1: r.Donor, C2: fnMoney(r.Committed, "USD"), C3: fnMoney(r.Spent, "USD"), C4: fnMoney(r.Remaining, "USD"), Util: r.Util, Amount: r.Budget, Currency: "USD", AmountUSD: r.Budget, Status: r.Health, StatusDomain: "ProjectHealth"})
                                          ColumnConfig: |-
                                            =Table(
                                                {Key: "Primary", Header: fnT("col.project", "Project"), Portion: 2, ShowOnTablet: true, Sortable: false},
                                                {Key: "C1", Header: fnT("col.donor", "Donor"), Portion: 1.4, ShowOnTablet: false, Sortable: false},
                                                {Key: "Amount", Header: fnT("col.budget", "Budget"), Portion: 1.5, ShowOnTablet: true, Sortable: false},
                                                {Key: "C2", Header: fnT("col.committed", "Committed"), Portion: 1.4, ShowOnTablet: false, Sortable: false},
                                                {Key: "C3", Header: fnT("col.spent", "Spent"), Portion: 1.4, ShowOnTablet: false, Sortable: false},
                                                {Key: "C4", Header: fnT("col.remaining", "Remaining"), Portion: 1.4, ShowOnTablet: true, Sortable: false},
                                                {Key: "Util", Header: fnT("col.utilization", "Utilization"), Portion: 1.6, ShowOnTablet: true, Sortable: false},
                                                {Key: "Status", Header: fnT("col.health", "Health"), Portion: 1.3, ShowOnTablet: false, Sortable: false}
                                            )
                                          PageNumber: =1
                                          HasMore: =false
                                          Loading: =locLoading
                                          EmptyText: =fnT("dash.noProjects", "No projects are assigned to you yet.")
                                          Height: =If(isMobile, Max(1, Min(CountRows(colDashProjects), 5)) * 104 + 60, 40 + Max(1, Min(CountRows(colDashProjects), 8)) * 52 + 60)
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          OnRowSelect: =Set(varProjectID, cmpDataTable_DashProj.SelectedRow.RowID); fnNavigate("projects")
                              - conDashSide:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =If(isTablet, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =sp2
                                    LayoutWrap: =false
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =If(isDesktop, 1, 0)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 320 * 2 + sp2, 320)
                                  Children:
                                    - conDashAlertsCard:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =sp1
                                          LayoutWrap: =false
                                          PaddingTop: =sp2
                                          PaddingRight: =sp2
                                          PaddingBottom: =sp2
                                          PaddingLeft: =sp2
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =borderWidth
                                          Fill: =FinTheme.Surface
                                          RadiusTopLeft: =radiusCard
                                          RadiusTopRight: =radiusCard
                                          RadiusBottomLeft: =radiusCard
                                          RadiusBottomRight: =radiusCard
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          BorderColor: =FinTheme.Border
                                          FillPortions: =If(isMobile, 0, 1)
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =320
                                        Children:
                                          - lblDashAlertsTitle:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("dash.alerts", "Alerts") & If(CountRows(colDashAlerts) > 0, " (" & CountRows(colDashAlerts) & ")", "")
                                                Font: =fontBase
                                                Size: =fsSection
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =28
                                                FontWeight: =FontWeight.Semibold
                                                Role: =TextRole.Heading2
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - lblDashAlertsEmpty:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("dash.noAlerts", "No overspent budget lines, delayed funds or overdue requests.")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.TextSecondary
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =true
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =40
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Visible: =!locLoading && IsEmpty(colDashAlerts)
                                          - galDashAlerts:
                                              Control: Gallery@2.15.0
                                              Variant: Vertical
                                              Properties:
                                                TemplatePadding: =0
                                                ShowScrollbar: =true
                                                BorderThickness: =0
                                                Fill: =RGBA(0, 0, 0, 0)
                                                TemplateFill: =RGBA(0, 0, 0, 0)
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                DelayItemLoading: =false
                                                LoadingSpinner: =LoadingSpinner.None
                                                Items: =Sort(colDashAlerts, Switch(Kind, "budget", 1, "funding", 2, 3) * 100000 - Days, SortOrder.Ascending)
                                                TemplateSize: =64
                                                FillPortions: =1
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Selectable: =true
                                                AccessibleLabel: =fnT("dash.alerts", "Alerts")
                                                ItemAccessibleLabel: =ThisItem.Title & ", " & ThisItem.Sub & ", " & ThisItem.Days & " " & fnT("common.days", "days")
                                                OnSelect: |-
                                                  =Switch(
                                                      ThisItem.Kind,
                                                      "pr", Set(varPRID, ThisItem.RefID); Navigate(scrFinPaymentDetail, ScreenTransition.None),
                                                      "budget", Set(varBudgetLineID, ThisItem.RefID); Navigate(scrFinBudgetDetail, ScreenTransition.None),
                                                      Set(varFundID, ThisItem.RefID); fnNavigate("funding")
                                                  )
                                              Children:
                                                - icoDashAlert:
