                                                        PlannedEnd: dpPlnEnd.SelectedDate,
                                                        ActualStart: dpPlnActualStart.SelectedDate,
                                                        ActualEnd: dpPlnActualEnd.SelectedDate,
                                                        ResponsiblePerson: If(IsBlank(cmbPlnPerson.Selected), Blank(), {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName}),
                                                        ResponsiblePersonID: If(IsBlank(cmbPlnPerson.Selected), Blank(), cmbPlnPerson.Selected.ID),
                                                        Progress: _progress,
                                                        Status: LookUp(Choices(ProjectsActivities.Status), Value = _status),
                                                        Description: txtPlnDescription.Text,
                                                        TotalTasks: 0,
                                                        'Completed Tasks': 0
                                                    }
                                                ),
                                                Patch(
                                                    ProjectsActivities,
