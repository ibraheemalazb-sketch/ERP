                                                        TaskDescription: txtPlnTaskDescription.Text,
                                                        Remarks: txtPlnRemarks.Text
                                                    }
                                                )
                                            )
                                        )
                                        );
                                        fnProjLog(
                                            If(varPlanningFormType = "Task", "Task: ", "Activity: ") & Coalesce(varPlnSaved.Title, Trim(txtPlnTitle.Text)),
                                            gblPlanningProject.ID,
                                            Coalesce(gblPlanningProject.Title, ""),
                                            If(varPlanningFormType = "Task", "Task", "Activity"),
                                            Coalesce(varPlnSaved.ID, 0),
                                            If(varPlanningSaveMode = "Edit", "Updated", "Created"),
                                            Coalesce(varPlnSaved.Status.Value, "")
                                        );
                                        If(
                                            And(!IsBlank(cmbPlnPerson.Selected), cmbPlnPerson.Selected.ID <> Coalesce(varMeID, 0), Coalesce(varPlnSaved.ID, 0) > 0),
                                            fnProjNotify(
