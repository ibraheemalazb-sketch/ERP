                                                        Project: {Id: gblPlanningProject.ID, Value: gblPlanningProject.Title},
                                                        ProjectID: gblPlanningProject.ID,
                                                        ActivityType: {Value: "SubActivity"},
                                                        ParentActivity: {Id: varPlanningParentActivity.ID, Value: varPlanningParentActivity.Title},
                                                        ParentActivityID: varPlanningParentActivity.ID,
                                                        PlannedStart: dpPlnStart.SelectedDate,
                                                        PlannedEnd: dpPlnEnd.SelectedDate,
                                                        ActualStart: dpPlnActualStart.SelectedDate,
                                                        ActualEnd: dpPlnActualEnd.SelectedDate,
                                                        ResponsiblePerson: If(IsBlank(cmbPlnPerson.Selected), Blank(), {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName}),
                                                        ResponsiblePersonID: If(IsBlank(cmbPlnPerson.Selected), Blank(), cmbPlnPerson.Selected.ID),
                                                        Progress: _progress,
                                                        Status: LookUp(Choices(ProjectsActivities.Status), Value = _status),
                                                        Description: txtPlnDescription.Text
                                                    }
                                                )
                                            ),
                                            "Task",
                                            If(
                                                varPlanningMode = "New",
                                                Patch(
                                                    ProjectsTasks,
                                                    Defaults(ProjectsTasks),
                                                    {
                                                        Title: Trim(txtPlnTitle.Text),
                                                        Project: {Id: gblPlanningProject.ID, Value: Coalesce(gblPlanningProject.ProjectCode, gblPlanningProject.Title)},
                                                        ProjectID: gblPlanningProject.ID,
                                                        Activity: {Id: varPlanningParentActivity.ID, Value: varPlanningParentActivity.Title},
                                                        ActivityID: varPlanningParentActivity.ID,
                                                        AssignedTo: {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName},
                                                        AssignedToID: cmbPlnPerson.Selected.ID,
                                                        Priority: ddPlnPriority.Selected,
                                                        PlannedStart: dpPlnStart.SelectedDate,
                                                        DueDate: dpPlnEnd.SelectedDate,
                                                        ActualStart: dpPlnActualStart.SelectedDate,
                                                        CompletedDate: dpPlnActualEnd.SelectedDate,
                                                        Progress: _progress,
                                                        Status: LookUp(Choices(ProjectsTasks.Status), Value = _status),
                                                        TaskDescription: txtPlnTaskDescription.Text,
                                                        Remarks: txtPlnRemarks.Text
                                                    }
                                                ),
                                                Patch(
                                                    ProjectsTasks,
                                                    LookUp(ProjectsTasks, ID = gblPlanningActionItem.ID),
                                                    {
                                                        Title: Trim(txtPlnTitle.Text),
                                                        Project: {Id: gblPlanningProject.ID, Value: Coalesce(gblPlanningProject.ProjectCode, gblPlanningProject.Title)},
                                                        ProjectID: gblPlanningProject.ID,
                                                        Activity: {Id: varPlanningParentActivity.ID, Value: varPlanningParentActivity.Title},
                                                        ActivityID: varPlanningParentActivity.ID,
                                                        AssignedTo: {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName},
                                                        AssignedToID: cmbPlnPerson.Selected.ID,
                                                        Priority: ddPlnPriority.Selected,
                                                        PlannedStart: dpPlnStart.SelectedDate,
                                                        DueDate: dpPlnEnd.SelectedDate,
