                              Height: =40
                              OnSelect: |-
                                =With(
                                    {
                                        _progress: Value(txtPlnProgress.Text),
                                        _status: If(Value(txtPlnProgress.Text) <= 0, "Not Started", If(Value(txtPlnProgress.Text) >= 100, "Completed", "In Progress"))
                                    },
                                    If(
                                        IsBlank(gblPlanningProject),
                                        Notify(If(gblLanguage = "Arabic", "اختر مشروعاً.", "Select a project."), NotificationType.Error),
                                        IsBlank(Trim(txtPlnTitle.Text)),
                                        Notify(If(gblLanguage = "Arabic", "أدخل العنوان.", "Enter a title."), NotificationType.Error),
                                        Or(_progress < 0, _progress > 100),
                                        Notify(If(gblLanguage = "Arabic", "النسبة بين 0 و 100.", "Progress must be between 0 and 100."), NotificationType.Error),
                                        And(!IsBlank(dpPlnStart.SelectedDate), !IsBlank(dpPlnEnd.SelectedDate), dpPlnEnd.SelectedDate < dpPlnStart.SelectedDate),
                                        Notify(If(gblLanguage = "Arabic", "تاريخ النهاية قبل البداية.", "The end date is before the start date."), NotificationType.Error),
                                        And(varPlanningFormType = "Task", IsBlank(cmbPlnPerson.Selected)),
                                        Notify(If(gblLanguage = "Arabic", "اختر المكلف.", "Select an assignee."), NotificationType.Error),
                                        And(varPlanningFormType <> "Main", IsBlank(varPlanningParentActivity)),
                                        Notify(If(gblLanguage = "Arabic", "البند الأب غير محدد.", "The parent item is missing."), NotificationType.Error),
                                        Set(varPlanningSaveMode, varPlanningMode);
                                        Set(
                                            varPlnSaved,
                                            Switch(
                                            varPlanningFormType,
                                            "Main",
                                            If(
                                                varPlanningMode = "New",
                                                Patch(
                                                    ProjectsActivities,
                                                    Defaults(ProjectsActivities),
                                                    {
                                                        Title: Trim(txtPlnTitle.Text),
                                                        Project: {Id: gblPlanningProject.ID, Value: gblPlanningProject.Title},
                                                        ProjectID: gblPlanningProject.ID,
                                                        ActivityType: {Value: "Main"},
                                                        PlannedStart: dpPlnStart.SelectedDate,
                                                        PlannedEnd: dpPlnEnd.SelectedDate,
                                                        ActualStart: dpPlnActualStart.SelectedDate,
                                                        ActualEnd: dpPlnActualEnd.SelectedDate,
                                                        ResponsiblePerson: If(IsBlank(cmbPlnPerson.Selected), Blank(), {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName}),
                                                        ResponsiblePersonID: If(IsBlank(cmbPlnPerson.Selected), Blank(), cmbPlnPerson.Selected.ID),
                                                        Progress: _progress,
                                                        Status: LookUp(Choices(ProjectsActivities.Status), Value = _status),
                                                        Description: txtPlnDescription.Text,
                                                        TotalTasks: 0,
                                                        'Completed Tasks': 0
                                                    }
                                                ),
                                                Patch(
                                                    ProjectsActivities,
                                                    LookUp(ProjectsActivities, ID = gblPlanningActionItem.ID),
                                                    {
                                                        Title: Trim(txtPlnTitle.Text),
                                                        Project: {Id: gblPlanningProject.ID, Value: gblPlanningProject.Title},
                                                        ProjectID: gblPlanningProject.ID,
                                                        PlannedStart: dpPlnStart.SelectedDate,
                                                        PlannedEnd: dpPlnEnd.SelectedDate,
                                                        ActualStart: dpPlnActualStart.SelectedDate,
                                                        ActualEnd: dpPlnActualEnd.SelectedDate,
                                                        ResponsiblePerson: If(IsBlank(cmbPlnPerson.Selected), Blank(), {Id: cmbPlnPerson.Selected.ID, Value: cmbPlnPerson.Selected.FullName}),
                                                        ResponsiblePersonID: If(IsBlank(cmbPlnPerson.Selected), Blank(), cmbPlnPerson.Selected.ID),
                                                        Progress: _progress,
                                                        Status: LookUp(Choices(ProjectsActivities.Status), Value = _status),
                                                        Description: txtPlnDescription.Text
                                                    }
                                                )
                                            ),
                                            "SubActivity",
