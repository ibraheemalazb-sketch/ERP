Screens:
  scrMELActions:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Actions");
        Set(varNavSelectedID, 80);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealActnMode), Set(varMealActnMode, "list"));
        If(IsBlank(varMealActnTab), Set(varMealActnTab, "all"));
        If(IsBlank(varMealActnQ), Set(varMealActnQ, ""));
        Set(varMealActnError, false);
        Select(btnMealActnLoad)
    Children:
      - conMealActnSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealActnLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealActnError, false);
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealActnRaw,
                                FirstN(
                                    SortByColumns(
                                        If(
                                            Coalesce(varMealActnFltProject.ID, 0) > 0,
                                            Filter(MELActions, ProjectID = varMealActnFltProject.ID),
                                            MELActions
                                        ),
                                        "DueDate",
                                        SortOrder.Ascending
                                    ),
                                    500
                                )
                            ),
                            ClearCollect(
                                colMealActnPeople,
                                FirstN(SortByColumns(Filter(Employees, Status.Value = "Active"), "FullName", SortOrder.Ascending), 300)
                            )
                        );
                        ClearCollect(
                            colMealActnEnriched,
                            AddColumns(
                                colMealActnRaw,
                                IsClosed,
                                Or(Status.Value = "Completed", Status.Value = "Closed", Status.Value = "Dropped"),
                                IsOverdue,
                                And(
                                    Not(IsBlank(DueDate)),
                                    DueDate < Today(),
                                    Not(Or(Status.Value = "Completed", Status.Value = "Closed", Status.Value = "Dropped"))
                                ),
                                IsDueSoon,
                                And(
                                    Not(IsBlank(DueDate)),
                                    DueDate >= Today(),
                                    DueDate <= DateAdd(Today(), 7, TimeUnit.Days),
                                    Not(Or(Status.Value = "Completed", Status.Value = "Closed", Status.Value = "Dropped"))
                                ),
                                IsMine,
                                Or(ResponsibleID = varMeID, ResponsiblePersonID = varMeID)
                            )
                        );
                        ClearCollect(
                            colMealActnView,
                            Filter(
                                colMealActnEnriched,
                                And(
                                    Switch(
                                        Coalesce(varMealActnTab, "all"),
                                        "my", IsMine,
                                        "overdue", IsOverdue,
                                        "duesoon", IsDueSoon,
                                        "completed", Or(Status.Value = "Completed", Status.Value = "Closed"),
                                        true
                                    ),
                                    Or(
                                        IsBlank(Trim(Coalesce(varMealActnQ, ""))),
                                        Trim(varMealActnQ) in Coalesce(ActionNumber, ""),
                                        Trim(varMealActnQ) in Coalesce(Finding, ""),
                                        Trim(varMealActnQ) in Coalesce(ActionRequired, ""),
                                        Trim(varMealActnQ) in Coalesce(SourceNumber, "")
                                    ),
                                    Or(IsBlank(varMealActnFltSource), SourceType.Value = varMealActnFltSource),
                                    Or(IsBlank(varMealActnFltPriority), Priority.Value = varMealActnFltPriority),
                                    Or(IsBlank(varMealActnFltStatus), Status.Value = varMealActnFltStatus),
                                    Or(IsBlank(varMealActnFltResp), Or(ResponsibleID = varMealActnFltResp.ID, ResponsiblePersonID = varMealActnFltResp.ID))
                                )
                            )
                        );
                        If(
                            Coalesce(varSelectedMELAction.ID, 0) > 0,
                            Set(varSelectedMELAction, LookUp(MELActions, ID = varSelectedMELAction.ID))
                        ),
                        Set(varMealActnError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل الإجراءات.", "Could not load MEL actions."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealActnSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealActnMode, "") = "new",
                            resp: cmbMealActnEdResp.Selected,
                            finding: Trim(txtMealActnEdFinding.Text),
                            action: Trim(txtMealActnEdAction.Text),
                            due: dteMealActnEdDue.SelectedDate,
                            pri: Coalesce(cmbMealActnEdPriority.Selected.Value, ""),
                            proj: cmbMealActnEdProject.Selected
                        },
                        If(
                            Or(IsBlank(finding), IsBlank(action), IsBlank(resp), Coalesce(resp.ID, 0) <= 0, IsBlank(due), IsBlank(pri)),
                            Notify(If(ar, "النتيجة والإجراء المطلوب والمسؤول وتاريخ الاستحقاق والأولوية مطلوبة.", "Finding, action required, responsible, due date, and priority are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedMELAction,
                                    Patch(
                                        MELActions,
                                        If(isNew, Defaults(MELActions), LookUp(MELActions, ID = varSelectedMELAction.ID)),
                                        {
                                            Title: Left(Coalesce(Trim(txtMealActnEdTitle.Text), action), 255),
                                            ActionNumber: Trim(txtMealActnEdNumber.Text),
                                            ProjectID: If(IsBlank(proj), Blank(), proj.ID),
                                            SourceType: {Value: Coalesce(cmbMealActnEdSource.Selected.Value, "")},
                                            SourceID: If(IsBlank(Trim(txtMealActnEdSourceID.Text)), Blank(), Value(txtMealActnEdSourceID.Text)),
                                            SourceNumber: Trim(txtMealActnEdSourceNum.Text),
                                            Finding: finding,
                                            ActionRequired: action,
                                            Responsible: {Id: resp.ID, Value: Coalesce(resp.FullName, "")},
                                            ResponsibleID: resp.ID,
                                            ResponsiblePersonID: resp.ID,
                                            DueDate: due,
                                            CompletionDate: dteMealActnEdDone.SelectedDate,
                                            Priority: {Value: pri},
                                            Status: {Value: Coalesce(cmbMealActnEdStatus.Selected.Value, If(isNew, "Open", "Open"))},
                                            ManagementResponse: txtMealActnEdMgmt.Text,
                                            IsEscalated: togMealActnEdEsc.Checked
                                        }
                                    )
                                );
                                If(
                                    isNew,
                                    fnMealLog("MEL Action", varSelectedMELAction.ID, Coalesce(varSelectedMELAction.ActionNumber, ""), "Created", "Info", Coalesce(proj.ID, 0), Coalesce(proj.ProjectCode, ""), "", "", "", "New MEL action", false);
                                    fnMealNotify(resp.ID, Coalesce(resp.FullName, ""), If(ar, "إجراء متابعة جديد", "New MEL action"), action, "MEL Action", varSelectedMELAction.ID, "Unread")
                                );
                                Set(varMealActnMode, "list");
                                Select(btnMealActnLoad);
                                Notify(If(ar, "تم حفظ الإجراء.", "Action saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الإجراء.", "Could not save the action."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
      - conMealActnPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealActnPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealActnTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealActnHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealActnTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "إجراءات المتابعة", "MEL Actions")
                  - btnMealActnNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMealActnMode, "new"); Set(varSelectedMELAction, Blank())
                        Text: =If(gblLanguage = "Arabic", "إجراء جديد", "New action")
                        Visible: =varMealActnMode = "list"
                        Width: =120
                  - btnMealActnBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varMealActnMode, "list"); Select(btnMealActnLoad)
                        Text: =If(gblLanguage = "Arabic", "القائمة", "List")
                        Visible: =varMealActnMode <> "list"
                        Width: =90
            - galMealActnTabs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  FillPortions: =0
                  Height: =40
                  Items: |-
                    =Table(
                        {k: "all", en: "All", ar: "الكل"},
                        {k: "my", en: "My", ar: "لي"},
                        {k: "overdue", en: "Overdue", ar: "متأخرة"},
                        {k: "duesoon", en: "Due Soon", ar: "قريبة"},
                        {k: "completed", en: "Completed", ar: "مكتملة"}
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =100
                  Visible: =varMealActnMode = "list"
                Children:
                  - btnMealActnTab:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =If(varMealActnTab = ThisItem.k, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =30
                        OnSelect: =Set(varMealActnTab, ThisItem.k); Select(btnMealActnLoad)
                        Text: =If(gblLanguage = "Arabic", ThisItem.ar, ThisItem.en)
                        Width: =92
            - conMealActnTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 140, 40)
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  Visible: =varMealActnMode = "list"
                Children:
                  - txtMealActnSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =varMealActnQ
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnQ, Self.Text); Select(btnMealActnLoad)
                        Placeholder: =If(gblLanguage = "Arabic", "بحث", "Search")
                        Width: =140
                  - cmbMealActnFltProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealActnFltProject), Filter(Projects, false), Filter(Projects, ID = varMealActnFltProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Items: =Projects
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnFltProject, Self.Selected); Select(btnMealActnLoad)
                        SelectMultiple: =false
                        Width: =140
                  - cmbMealActnFltSource:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealActnFltSource), Filter(Choices(MELActions.SourceType), false), Filter(Choices(MELActions.SourceType), Value = varMealActnFltSource))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المصدر", "Source")
                        Items: =Choices(MELActions.SourceType)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnFltSource, Self.Selected.Value); Select(btnMealActnLoad)
                        SelectMultiple: =false
                        Width: =130
                  - cmbMealActnFltPriority:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealActnFltPriority), Filter(Choices(MELActions.Priority), false), Filter(Choices(MELActions.Priority), Value = varMealActnFltPriority))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الأولوية", "Priority")
                        Items: =Choices(MELActions.Priority)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnFltPriority, Self.Selected.Value); Select(btnMealActnLoad)
                        SelectMultiple: =false
                        Width: =120
                  - cmbMealActnFltStatus:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealActnFltStatus), Filter(Choices(MELActions.Status), false), Filter(Choices(MELActions.Status), Value = varMealActnFltStatus))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        Items: =Choices(MELActions.Status)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnFltStatus, Self.Selected.Value); Select(btnMealActnLoad)
                        SelectMultiple: =false
                        Width: =120
                  - cmbMealActnFltResp:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(IsBlank(varMealActnFltResp), Filter(colMealActnPeople, false), Filter(colMealActnPeople, ID = varMealActnFltResp.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المسؤول", "Responsible")
                        Items: =colMealActnPeople
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(varMealActnFltResp, Self.Selected); Select(btnMealActnLoad)
                        SelectMultiple: =false
                        Width: =140
            - conMealActnBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varMealActnMode = "list"
                Children:
                  - galMealActnList:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 900, 1, 0)
                        Items: =colMealActnView
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =86
                        Visible: =Or(App.Width >= 900, IsBlank(varSelectedMELAction))
                        Width: =If(App.Width < 900, Parent.Width, 360)
                      Children:
                        - conMealActnCard:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderColor: =If(ThisItem.IsOverdue, fxThemeColor("Danger"), fxThemeColor("Border"))
                              BorderThickness: =1
                              Fill: =If(Coalesce(varSelectedMELAction.ID, 0) = ThisItem.ID, fxThemeColor("PrimarySubtle"), fxThemeColor("Background"))
                              Height: =Parent.TemplateHeight - 6
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =Parent.TemplateWidth - 8
                              X: =4
                              Y: =3
                            Children:
                              - lblMealActnCardTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    OnSelect: =Set(varSelectedMELAction, LookUp(MELActions, ID = ThisItem.ID))
                                    Text: =Coalesce(ThisItem.ActionNumber, ThisItem.Title, "-")
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =6
                              - lblMealActnCardMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =If(ThisItem.IsOverdue, fxThemeColor("Danger"), fxThemeColor("TextMuted"))
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =48
                                    Size: =11
                                    Text: =Coalesce(ThisItem.SourceType.Value, "-") & " · " & Coalesce(ThisItem.Priority.Value, "-") & " · " & Coalesce(ThisItem.Status.Value, "-") & Char(10) & Coalesce(ThisItem.Responsible.Value, "-") & " · " & Text(ThisItem.DueDate, "dd mmm yyyy") & If(ThisItem.IsOverdue, " · OVERDUE", "") & Char(10) & Left(Coalesce(ThisItem.ActionRequired, ""), 50)
                                    Width: =Parent.Width - 16
                                    X: =8
                                    Y: =28
                  - conMealActnDetail:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        Visible: =Not(IsBlank(varSelectedMELAction))
                      Children:
                        - conMealActnDetHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblMealActnDetTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    FillPortions: =1
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =FontWeight.Semibold
                                    Height: =32
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =15
                                    Text: =Coalesce(varSelectedMELAction.ActionNumber, varSelectedMELAction.Title, "-")
                              - btnMealActnEdit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMealActnMode, "edit")
                                    Text: =If(gblLanguage = "Arabic", "تعديل", "Edit")
                                    Width: =80
                        - lblMealActnInfo:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextSecondary")
                              FillPortions: =1
                              Font: =gblTheme.Typography.FontFamily
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {ar: gblLanguage = "Arabic", a: varSelectedMELAction},
                                    If(ar, "المصدر: ", "Source: ") & Coalesce(a.SourceType.Value, "-") & " / " & Coalesce(a.SourceNumber, Text(a.SourceID), "-") & Char(10) &
                                    If(ar, "النتيجة: ", "Finding: ") & Coalesce(a.Finding, "-") & Char(10) &
                                    If(ar, "الإجراء المطلوب: ", "Action required: ") & Coalesce(a.ActionRequired, "-") & Char(10) &
                                    If(ar, "المسؤول: ", "Responsible: ") & Coalesce(a.Responsible.Value, "-") & Char(10) &
                                    If(ar, "الأولوية / الحالة: ", "Priority / status: ") & Coalesce(a.Priority.Value, "-") & " / " & Coalesce(a.Status.Value, "-") & Char(10) &
                                    If(ar, "الاستحقاق: ", "Due: ") & Text(a.DueDate, "dd mmm yyyy") & Char(10) &
                                    If(ar, "اكتمال: ", "Completed: ") & Text(a.CompletionDate, "dd mmm yyyy") & Char(10) &
                                    If(ar, "رد الإدارة: ", "Management response: ") & Coalesce(a.ManagementResponse, "-") & Char(10) &
                                    If(ar, "تصعيد: ", "Escalated: ") & Text(a.IsEscalated)
                                )
            - conMealActnEditor:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Or(varMealActnMode = "new", varMealActnMode = "edit")
                Children:
                  - txtMealActnEdNumber:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =If(varMealActnMode = "new", "", Coalesce(varSelectedMELAction.ActionNumber, ""))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "رقم الإجراء", "Action number")
                  - txtMealActnEdTitle:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =If(varMealActnMode = "new", "", Coalesce(varSelectedMELAction.Title, ""))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "العنوان", "Title")
                  - cmbMealActnEdProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(varMealActnMode = "edit", Filter(Projects, ID = varSelectedMELAction.ProjectID), If(IsBlank(varMealActnFltProject), Filter(Projects, false), Filter(Projects, ID = varMealActnFltProject.ID)))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Items: =Projects
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                  - cmbMealActnEdSource:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        DefaultSelectedItems: =If(varMealActnMode = "edit", Filter(Choices(MELActions.SourceType), Value = varSelectedMELAction.SourceType.Value), Filter(Choices(MELActions.SourceType), false))
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "نوع المصدر", "Source type")
                        Items: =Choices(MELActions.SourceType)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                  - txtMealActnEdSourceID:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =If(varMealActnMode = "new", "", If(IsBlank(varSelectedMELAction.SourceID), "", Text(varSelectedMELAction.SourceID)))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "معرّف المصدر", "Source ID")
                  - txtMealActnEdSourceNum:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Default: =If(varMealActnMode = "new", "", Coalesce(varSelectedMELAction.SourceNumber, ""))
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
