Screens:
  scrResultsFramework:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Results");
        Set(varNavSelectedID, 77);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varMealRFForm), Set(varMealRFForm, Blank()));
        If(IsBlank(varMealRFError), Set(varMealRFError, false));
        If(IsBlank(varSelectedResult), Set(varSelectedResult, Blank()));
        ClearCollect(
            colMealRFLevels,
            {k: "Goal", n: 1, en: "Goal", ar: "هدف"},
            {k: "Impact", n: 2, en: "Impact", ar: "أثر"},
            {k: "Outcome", n: 3, en: "Outcome", ar: "نتيجة"},
            {k: "Intermediate Outcome", n: 4, en: "Intermediate Outcome", ar: "نتيجة وسيطة"},
            {k: "Output", n: 5, en: "Output", ar: "مخرج"},
            {k: "Activity", n: 6, en: "Activity", ar: "نشاط"}
        );
        If(
            Not(IsBlank(varSelectedProject)),
            Set(varMealRFProject, varSelectedProject)
        );
        Select(btnMealRFLoad)
    Children:
      - conMealRFSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealRFLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealRFError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colMealRF,
                                If(
                                    Coalesce(varMealRFProject.ID, cmbMealRFFltProject.Selected.ID, 0) > 0,
                                    Filter(
                                        ResultsFramework,
                                        ProjectID = Coalesce(varMealRFProject.ID, cmbMealRFFltProject.Selected.ID)
                                    ),
                                    FirstN(SortByColumns(ResultsFramework, "DisplayOrder", SortOrder.Ascending), 500)
                                )
                            ),
                            ClearCollect(
                                colMealRFParents,
                                If(
                                    Coalesce(varMealRFProject.ID, cmbMealRFFltProject.Selected.ID, 0) > 0,
                                    Filter(
                                        ResultsFramework,
                                        ProjectID = Coalesce(varMealRFProject.ID, cmbMealRFFltProject.Selected.ID)
                                    ),
                                    FirstN(ResultsFramework, 200)
                                )
                            )
                        );
                        ClearCollect(
                            colMealRFSorted,
                            SortByColumns(
                                AddColumns(
                                    colMealRF,
                                    LevelOrd,
                                    Coalesce(LookUp(colMealRFLevels, k = ResultLevel.Value).n, 99),
                                    IndentN,
                                    Coalesce(LookUp(colMealRFLevels, k = ResultLevel.Value).n, 1) - 1
                                ),
                                "LevelOrd",
                                SortOrder.Ascending,
                                "DisplayOrder",
                                SortOrder.Ascending
                            )
                        );
                        If(
                            Not(IsBlank(varSelectedResult)),
                            Set(varSelectedResult, LookUp(ResultsFramework, ID = varSelectedResult.ID));
                            ClearCollect(colMealRFIndicators, Filter(Indicators, ResultID = varSelectedResult.ID)),
                            Clear(colMealRFIndicators)
                        ),
                        Set(varMealRFError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل إطار النتائج.", "Could not load the results framework."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealRFSave:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealRFForm, "") = "new",
                            pid: Coalesce(cmbMealRFProject.Selected.ID, 0),
                            ptt: Coalesce(cmbMealRFProject.Selected.Title, ""),
                            parent: cmbMealRFParent.Selected,
                            resp: cmbMealRFResp.Selected
                        },
                        If(
                            Or(IsBlank(Trim(txtMealRFTitle.Text)), IsBlank(Trim(txtMealRFCode.Text)), pid <= 0),
                            Notify(If(ar, "العنوان ورمز النتيجة والمشروع مطلوبة.", "Title, result code, and project are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedResult,
                                    Patch(
                                        ResultsFramework,
                                        If(isNew, Defaults(ResultsFramework), LookUp(ResultsFramework, ID = varSelectedResult.ID)),
                                        {
                                            Title: Trim(txtMealRFTitle.Text),
                                            ResultCode: Trim(txtMealRFCode.Text),
                                            Project: {Id: pid, Value: ptt},
                                            ProjectID: pid,
                                            ParentResultID: If(IsBlank(parent), Blank(), parent.ID),
                                            ResultLevel: {Value: Coalesce(cmbMealRFLevel.Selected.Value, "Outcome")},
                                            Sector: If(IsBlank(cmbMealRFSector.Selected), Blank(), {Value: cmbMealRFSector.Selected.Value}),
                                            Assumptions: txtMealRFAssumptions.Text,
                                            Risks: txtMealRFRisks.Text,
                                            ResponsiblePersonID: If(IsBlank(resp), Blank(), resp.ID),
                                            ResponsiblePerson: If(IsBlank(resp), Blank(), {Id: resp.ID, Value: resp.FullName}),
                                            DisplayOrder: If(IsBlank(Trim(txtMealRFOrder.Text)), 0, Value(txtMealRFOrder.Text)),
                                            IsActive: togMealRFActive.Checked
                                        }
                                    )
                                );
                                fnMealLog("Result", varSelectedResult.ID, Coalesce(varSelectedResult.ResultCode, ""), If(isNew, "Created", "Updated"), "Info", pid, Coalesce(LookUp(Projects, ID = pid, ProjectCode), ""), "", "", "", Trim(txtMealRFTitle.Text), false);
                                If(
                                    And(!IsBlank(resp), resp.ID <> varMeID),
                                    fnMealNotify(resp.ID, Coalesce(resp.FullName, ""), If(ar, "أُسندت إليك نتيجة", "A result was assigned to you"), Coalesce(varSelectedResult.ResultCode, varSelectedResult.Title, ""), "Result", varSelectedResult.ID, "Unread")
                                );
                                Set(varMealRFForm, Blank());
                                Select(btnMealRFLoad);
                                Notify(If(ar, "تم حفظ النتيجة.", "Result saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ النتيجة.", "Could not save the result."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="Save"
                  Visible: =false
                  Width: =1
            - btnMealRFDelete:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", r: varSelectedResult},
                        If(
                            IsBlank(r),
                            Notify(If(ar, "اختر نتيجة أولاً.", "Select a result first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف هذه النتيجة؟", "Delete this result?") & Char(10) & Coalesce(r.Title, "")),
                                IfError(
                                    Remove(ResultsFramework, LookUp(ResultsFramework, ID = r.ID));
                                    fnMealLog("Result", r.ID, Coalesce(r.ResultCode, ""), "Deleted", "Important", Coalesce(r.ProjectID, 0), "", "", "", "", Coalesce(r.Title, ""), false);
                                    Set(varSelectedResult, Blank());
                                    Set(varMealRFForm, Blank());
                                    Clear(colMealRFIndicators);
                                    Select(btnMealRFLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="Delete"
                  Visible: =false
                  Width: =1
      - conMealRFPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealRFPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealRFTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealRFHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealRFTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "إطار النتائج", "Results Framework")
                        Width: =200
                        Wrap: =false
                  - btnMealRFRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnMealRFLoad)
                        Text: =""
                        Width: =44
                  - btnMealRFNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSelectedResult, Blank());
                          Set(varMealRFForm, "new");
                          Clear(colMealRFIndicators)
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "جديد", "New"))
                        Width: =If(App.Width < 700, 44, 100)
            - lblMealRFError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealRFError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل بعض البيانات.", "Some data could not be loaded.")
                  Visible: =varMealRFError
                  Width: =Parent.Width
                  Wrap: =false
            - conMealRFBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 60
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - conMealRFList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =Or(App.Width >= 700, And(IsBlank(varMealRFForm), IsBlank(varSelectedResult)))
                        Width: =If(App.Width < 700, Parent.Width, If(Or(Not(IsBlank(varMealRFForm)), Not(IsBlank(varSelectedResult))), Parent.Width - 380, Parent.Width))
                      Children:
                        - conMealRFTools:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 88, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =App.Width < 700
                            Children:
                              - cmbMealRFFltProject:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    DefaultSelectedItems: |-
                                      =If(
                                          Not(IsBlank(varMealRFProject)),
                                          Filter(Projects, ID = varMealRFProject.ID),
                                          Filter(Projects, false)
                                      )
                                    Height: =36
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                                    ItemDisplayText: =ThisItem.Title
                                    Items: =Projects
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varMealRFProject, cmbMealRFFltProject.Selected);
                                      Select(btnMealRFLoad)
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 220)
                              - txtMealRFSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    FillPortions: =1
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Placeholder: =If(gblLanguage = "Arabic", "بحث بالرمز أو العنوان", "Search code or title")
                                    Width: =160
                        - galMealRF:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Fill: =fxThemeColor("Surface")
                              Height: =Parent.Height - 56
                              Items: |-
                                =With(
                                    {q: Lower(Trim(txtMealRFSearch.Text))},
                                    Filter(
                                        colMealRFSorted,
                                        Or(
                                            IsBlank(q),
                                            q in Lower(Coalesce(ResultCode, "")),
                                            q in Lower(Coalesce(Title, "")),
                                            q in Lower(Coalesce(ResultLevel.Value, ""))
                                        )
                                    )
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplateSize: =64
                              Width: =Parent.Width
                            Children:
                              - conMealRFRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    Fill: |-
                                      =If(
                                          ThisItem.ID = varSelectedResult.ID,
                                          ColorFade(fxThemeColor("Primary"), 0.85),
                                          Color.Transparent
                                      )
                                    Height: =Parent.TemplateHeight - 4
                                    Width: =Parent.TemplateWidth - 8
                                    X: =4
                                    Y: =2
                                  Children:
                                    - btnMealRFRow:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Align: =Align.Left
                                          Appearance: =ButtonAppearance.Transparent
                                          Height: =Parent.Height
                                          OnSelect: |-
                                            =Set(varSelectedResult, LookUp(ResultsFramework, ID = ThisItem.ID));
                                            Set(varMealRFForm, Blank());
                                            ClearCollect(colMealRFIndicators, Filter(Indicators, ResultID = ThisItem.ID))
                                          Text: |-
                                            =Concatenate(
                                                Coalesce(ThisItem.ResultCode, "-"),
                                                "  ",
                                                Coalesce(ThisItem.Title, "-"),
                                                Char(10),
                                                Coalesce(ThisItem.ResultLevel.Value, "-"),
                                                " · ",
                                                If(ThisItem.IsActive, If(gblLanguage = "Arabic", "نشط", "Active"), If(gblLanguage = "Arabic", "غير نشط", "Inactive"))
                                            )
                                          Width: =Parent.Width - Coalesce(ThisItem.IndentN, 0) * 16
                                          X: =Coalesce(ThisItem.IndentN, 0) * 16
                  - conMealRFDetail:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =gblTheme.Radius.Large
                        RadiusBottomRight: =gblTheme.Radius.Large
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Visible: =And(IsBlank(varMealRFForm), Not(IsBlank(varSelectedResult)))
                        Width: =If(App.Width < 700, Parent.Width, 360)
                      Children:
                        - conMealRFDetHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnMealRFDetBack:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="ArrowLeft"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varSelectedResult, Blank())
                                    Text: =""
                                    Visible: =App.Width < 700
                                    Width: =44
                              - lblMealRFDetTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    FillPortions: =1
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Bold
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: =If(gblLanguage = "Arabic", "تفاصيل النتيجة", "Result details")
                                    Width: =140
                                    Wrap: =false
                              - btnMealRFEdit:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =36
                                    Icon: ="Edit"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMealRFForm, "edit")
                                    Text: =""
                                    Width: =44
                        - lblMealRFDetCode:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "الرمز: ", "Code: ") & Coalesce(varSelectedResult.ResultCode, "-")
                              Width: =Parent.Width
                        - lblMealRFDetName:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Semibold
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =14
                              Text: =Coalesce(varSelectedResult.Title, "-")
                              Width: =Parent.Width
                        - lblMealRFDetLevel:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "المستوى: ", "Level: ") & Coalesce(varSelectedResult.ResultLevel.Value, "-")
                              Width: =Parent.Width
                              Wrap: =false
                        - lblMealRFDetSector:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "القطاع: ", "Sector: ") & Coalesce(varSelectedResult.Sector.Value, "-")
                              Width: =Parent.Width
                              Wrap: =false
                        - lblMealRFDetResp:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "المسؤول: ", "Responsible: ") & Coalesce(
                                    varSelectedResult.ResponsiblePerson.Value,
                                    LookUp(Employees, ID = varSelectedResult.ResponsiblePersonID, FullName),
                                    "-"
                                )
                              Width: =Parent.Width
                              Wrap: =false
                        - lblMealRFDetAssumptions:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =60
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "الافتراضات: ", "Assumptions: ") & Coalesce(varSelectedResult.Assumptions, "-")
                              Width: =Parent.Width
                        - lblMealRFDetRisks:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =60
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: |-
                                =If(gblLanguage = "Arabic", "المخاطر: ", "Risks: ") & Coalesce(varSelectedResult.Risks, "-")
                              Width: =Parent.Width
                        - lblMealRFIndHead:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("Primary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: =If(gblLanguage = "Arabic", "المؤشرات", "Indicators") & " (" & Text(CountRows(colMealRFIndicators)) & ")"
                              Width: =Parent.Width
                              Wrap: =false
                        - galMealRFIndicators:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Fill: =Color.Transparent
                              Height: =180
                              Items: =colMealRFIndicators
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplateSize: =48
                              Width: =Parent.Width
                            Children:
                              - btnMealRFIndRow:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =40
                                    OnSelect: |-
                                      =Set(varSelectedIndicator, LookUp(Indicators, ID = ThisItem.ID));
                                      Navigate(scrIndicators, ScreenTransition.None)
                                    Text: =Coalesce(ThisItem.IndicatorCode, ThisItem.Title, "-") & Char(10) & Coalesce(ThisItem.Status.Value, "-")
                                    Width: =Parent.TemplateWidth - 4
                                    X: =2
                                    Y: =2
                  - conMealRFForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
