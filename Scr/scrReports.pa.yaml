Screens:
  scrReports:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "Reporting");
        Set(VarMEALmodule, "Reports");
        Set(varNavSelectedID, 74);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        If(IsBlank(varRepViewMode), Set(varRepViewMode, "list"));
        If(IsBlank(varRepQ), Set(varRepQ, ""));
        If(IsBlank(varRepFltProject), Set(varRepFltProject, Blank()));
        If(IsBlank(varRepFltType), Set(varRepFltType, Blank()));
        If(IsBlank(varRepFltPeriod), Set(varRepFltPeriod, Blank()));
        If(IsBlank(varRepFltStatus), Set(varRepFltStatus, Blank()));
        If(IsBlank(varRepListError), Set(varRepListError, false));
        If(IsBlank(varRepPane), Set(varRepPane, "Details"));
        Select(btnRepListLoad)
    Children:
      - conRepListSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnRepListLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varRepListError, false);
                    Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
                    ClearCollect(
                        colRepStatusUI,
                        {k: "Draft", en: "Draft", ar: "مسودة"},
                        {k: "In Preparation", en: "In Preparation", ar: "قيد الإعداد"},
                        {k: "Pending Project Manager", en: "Pending Project Manager", ar: "بانتظار مدير المشروع"},
                        {k: "Pending MEAL", en: "Pending MEAL", ar: "بانتظار المتابعة والتقييم"},
                        {k: "Pending Program Director", en: "Pending Program Director", ar: "بانتظار مدير البرنامج"},
                        {k: "Approved", en: "Approved", ar: "معتمد"},
                        {k: "Sent to Donor", en: "Sent to Donor", ar: "أُرسل للمانح"},
                        {k: "Returned for Revision", en: "Returned for Revision", ar: "مُعاد للمراجعة"},
                        {k: "Archived", en: "Archived", ar: "مؤرشف"}
                    );
                    ClearCollect(
                        colRepTypeUI,
                        {k: "Narrative", en: "Narrative", ar: "سردي"},
                        {k: "Financial", en: "Financial", ar: "مالي"},
                        {k: "Indicator", en: "Indicator", ar: "مؤشرات"},
                        {k: "Donor", en: "Donor", ar: "مانح"},
                        {k: "Internal", en: "Internal", ar: "داخلي"},
                        {k: "Other", en: "Other", ar: "أخرى"}
                    );
                    IfError(
                        Concurrent(
                            ClearCollect(
                                colRepPeriods,
                                Filter(ReportingPeriods, Status.Value = "Active")
                            ),
                            ClearCollect(
                                colRepListRaw,
                                If(
                                    Coalesce(varRepFltProject.ID, 0) > 0,
                                    Filter(ProjectReports, ProjectID = varRepFltProject.ID),
                                    FirstN(SortByColumns(ProjectReports, "Modified", SortOrder.Descending), 500)
                                )
                            )
                        );
                        ClearCollect(
                            colRepList,
                            Filter(
                                colRepListRaw,
                                And(
                                    Or(
                                        IsBlank(Trim(Coalesce(varRepQ, ""))),
                                        Trim(varRepQ) in Coalesce(ReportNumber, ""),
                                        Trim(varRepQ) in Coalesce(Title, ""),
                                        Trim(varRepQ) in Coalesce(Project.Value, "")
                                    ),
                                    Or(
                                        IsBlank(varRepFltType),
                                        IsBlank(varRepFltType.k),
                                        ReportType.Value = varRepFltType.k
                                    ),
                                    Or(
                                        IsBlank(varRepFltPeriod),
                                        ReportingPeriodID = varRepFltPeriod.ID
                                    ),
                                    Or(
                                        IsBlank(varRepFltStatus),
                                        IsBlank(Trim(Coalesce(varRepFltStatus, ""))),
                                        And(varRepFltStatus = "Pending", "Pending" in Coalesce(Status.Value, "")),
                                        And(varRepFltStatus = "Approved", Or(Status.Value = "Approved", Status.Value = "Sent to Donor")),
                                        Status.Value = varRepFltStatus
                                    )
                                )
                            )
                        );
                        If(
                            Coalesce(varSelectedReport.ID, 0) > 0,
                            Set(varSelectedReport, LookUp(ProjectReports, ID = varSelectedReport.ID))
                        ),
                        Set(varRepListError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل التقارير.", "Could not load reports."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnRepListAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =IfError(
                        With(
                            {
                                r: varSelectedReport,
                                st: Coalesce(varSelectedReport.Status.Value, "")
                            },
                            With(
                                {
                                    nextSt: Switch(
                                        varRepOp,
                                        "submit", "Pending Project Manager",
                                        "approve", Switch(
                                            st,
                                            "Pending Project Manager", "Pending MEAL",
                                            "Pending MEAL", "Pending Program Director",
                                            "Pending Program Director", "Approved",
                                            "Approved", "Sent to Donor",
                                            Coalesce(st, "Approved")
                                        ),
                                        "return", "Returned for Revision",
                                        "senddonor", "Sent to Donor",
                                        Coalesce(st, "Draft")
                                    ),
                                    nextLevel: Switch(
                                        varRepOp,
                                        "submit", 1,
                                        "approve", Coalesce(r.CurrentLevel, 0) + 1,
                                        "return", 0,
                                        Coalesce(r.CurrentLevel, 0)
                                    )
                                },
                                With(
                                    {
                                        notifyWho: Switch(
                                            varRepOp,
                                            "submit", Coalesce(r.ReviewerID, r.ProjectManagerID, 0),
                                            "approve", Switch(
                                                nextSt,
                                                "Pending MEAL", Coalesce(r.MEALReviewerID, r.ReviewerID, 0),
                                                "Pending Program Director", Coalesce(r.ProgramDirectorID, r.ApproverID, 0),
                                                "Approved", Coalesce(r.PreparedByID, 0),
                                                "Sent to Donor", Coalesce(r.PreparedByID, 0),
                                                0
                                            ),
                                            "return", Coalesce(r.PreparedByID, 0),
                                            "senddonor", Coalesce(r.PreparedByID, 0),
                                            0
                                        )
                                    },
                                    If(
                                        varRepOp = "delete",
                                        Remove(ProjectReports, LookUp(ProjectReports, ID = r.ID));
                                        fnRepLog("Report", r.ID, Coalesce(r.ReportNumber, r.Title, ""), "Deleted", "Important", Coalesce(r.ProjectID, 0), "", "Status", Coalesce(r.Status.Value, ""), "", Coalesce(varRepNote, ""));
                                        Set(varSelectedReport, Blank()),
                                        If(
                                            Or(varRepOp = "submit", varRepOp = "approve", varRepOp = "return", varRepOp = "senddonor"),
                                            Set(
                                                varSelectedReport,
                                                Patch(
                                                    ProjectReports,
                                                    LookUp(ProjectReports, ID = r.ID),
                                                    {
                                                        Status: {Value: nextSt},
                                                        SubmittedDate: If(varRepOp = "submit", Now(), r.SubmittedDate),
                                                        SubmittedBID: If(varRepOp = "submit", varMeID, r.SubmittedBID),
                                                        ApprovalStarted: If(Or(varRepOp = "submit", varRepOp = "approve"), true, If(varRepOp = "return", false, r.ApprovalStarted)),
                                                        CurrentLevel: nextLevel,
                                                        ApprovedDate: If(And(varRepOp = "approve", nextSt = "Approved"), Now(), r.ApprovedDate),
                                                        ReturnCount: If(varRepOp = "return", Coalesce(r.ReturnCount, 0) + 1, r.ReturnCount),
                                                        SentToDonorDate: If(varRepOp = "senddonor", Now(), r.SentToDonorDate)
                                                    }
                                                )
                                            );
                                            IfError(
                                                Patch(
                                                    ApprovalHistory,
                                                    Defaults(ApprovalHistory),
                                                    {
                                                        Title: Coalesce(r.ReportNumber, r.Title),
                                                        RequestType: {Value: "Report"},
                                                        RequestItemID: Text(r.ID),
                                                        Action: {Value: Switch(varRepOp, "submit", "Submitted", "approve", "Approved", "return", "Returned", "senddonor", "Sent to Donor", "Updated")},
                                                        Decision: {Value: Switch(varRepOp, "approve", If(nextSt = "Approved", "Approved", "Pending"), "return", "Returned", "senddonor", "Approved", "submit", "Pending", "Pending")},
                                                        Comments: Left(Coalesce(varRepNote, ""), 255),
                                                        PerformedBy: {Id: varMeID, Value: varMeName},
                                                        RequesterID: Coalesce(r.PreparedByID, varMeID),
                                                        RequestorID: Coalesce(r.PreparedByID, varMeID),
                                                        DecisionDate: Now(),
                                                        Module: {Value: "MEAL"}
                                                    }
                                                ),
                                                Notify(If(gblLanguage = "Arabic", "حُفظ التقرير. تعذر كتابة سجل الاعتماد.", "Report saved. Approval history could not be written."), NotificationType.Warning)
                                            );
                                            If(
                                                And(notifyWho > 0, notifyWho <> varMeID),
                                                IfError(
                                                    Patch(
                                                        Notifications,
                                                        Defaults(Notifications),
                                                        {
                                                            Title: Left(
                                                                Switch(
                                                                    varRepOp,
                                                                    "submit", If(gblLanguage = "Arabic", "تقرير بانتظار المراجعة", "Report pending review"),
                                                                    "approve", If(gblLanguage = "Arabic", "تحديث اعتماد التقرير", "Report approval update"),
                                                                    "return", If(gblLanguage = "Arabic", "تقرير مُعاد للمراجعة", "Report returned for revision"),
                                                                    "senddonor", If(gblLanguage = "Arabic", "أُرسل التقرير للمانح", "Report sent to donor"),
                                                                    If(gblLanguage = "Arabic", "تحديث تقرير", "Report update")
                                                                ),
                                                                255
                                                            ),
                                                            Message: Left(
                                                                Concatenate(
                                                                    Coalesce(r.ReportNumber, r.Title, ""),
                                                                    " · ",
                                                                    nextSt,
                                                                    If(IsBlank(varRepNote), "", " — " & varRepNote)
                                                                ),
                                                                500
                                                            ),
                                                            IsRead: "No",
                                                            Createddate: Now(),
                                                            RecipientID: notifyWho,
                                                            Recipient: {Id: notifyWho, Value: Coalesce(LookUp(Employees, ID = notifyWho, FullName), "")},
                                                            RecipientNo: LookUp(Employees, ID = notifyWho, EmployeeNumber),
                                                            RelatedEntity: {Value: "Report"},
                                                            RelatedItemID: r.ID,
                                                            RecordType: "Report",
                                                            Module: {Value: "MEAL"},
                                                            Status: {Value: "Unread"},
                                                            Duration: 0,
                                                            ReadDate: Blank()
                                                        }
                                                    ),
                                                    Trace("Report notify failed", TraceSeverity.Warning)
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        );
                        fnRepLog("Report", Coalesce(varSelectedReport.ID, 0), Coalesce(varSelectedReport.ReportNumber, varSelectedReport.Title, ""), "Status Changed", "Important", Coalesce(varSelectedReport.ProjectID, 0), "", "Status", "", Coalesce(varSelectedReport.Status.Value, ""), Coalesce(varRepNote, ""));
                        Set(varRepNote, "");
                        Select(btnRepListLoad);
                        Notify(If(gblLanguage = "Arabic", "تم تحديث التقرير.", "Report updated."), NotificationType.Success),
                        Notify(If(gblLanguage = "Arabic", "تعذر تحديث التقرير.", "The report could not be updated."), NotificationType.Error)
                    )
                  Text: ="Act"
                  Visible: =false
                  Width: =1
      - conRepListPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpRepListPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpRepListTop.Height + 8
            Width: =Parent.Width
          Children:
            - conRepListHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblRepListTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "قائمة التقارير", "Reports")
                        Width: =160
                        Wrap: =false
                  - btnRepListDash:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrReporting, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "لوحة التقارير", "Dashboard")
                        Width: =120
                  - btnRepListFromSched:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varRepStartFromSchedule, true);
                          Navigate(scrReportSchedules, ScreenTransition.None)
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "من جدول", "From Schedule"))
                        Width: =If(App.Width < 700, 44, 140)
                  - btnRepListArchive:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrReportArchive, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "الأرشيف", "Archive")
                        Width: =100
                  - btnRepListRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowClockwise"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnRepListLoad)
                        Text: =""
                        Width: =44
            - conRepListTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 160, 40)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                Children:
                  - txtRepListSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في التقارير", "Search reports")
                        Default: =varRepQ
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepQ, Self.Text);
                          Select(btnRepListLoad)
                        Placeholder: =If(gblLanguage = "Arabic", "رقم التقرير أو العنوان أو المشروع", "Report number, title, or project")
                        Width: =If(App.Width < 700, Parent.Width, 220)
                  - cmbRepListProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        DefaultSelectedItems: =If(IsBlank(varRepFltProject), Filter(Projects, false), Filter(Projects, ID = varRepFltProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                        ItemDisplayText: =If(IsBlank(ThisItem.ProjectCode), ThisItem.Title, Concatenate(ThisItem.ProjectCode, " · ", ThisItem.Title))
                        Items: |-
                          =If(
                              varUserHasAllProjects,
                              Projects,
                              Filter(
                                  ForAll(
                                      Filter(colUserProjectAccess, AllProjects = false) As access,
                                      LookUp(Projects, ID = access.ProjectID)
                                  ),
                                  !IsBlank(ID)
                              )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepFltProject, Self.Selected);
                          Select(btnRepListLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - cmbRepListType:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "نوع التقرير", "Report type")
                        DefaultSelectedItems: =If(IsBlank(varRepFltType), Filter(colRepTypeUI, false), Filter(colRepTypeUI, k = varRepFltType.k))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الأنواع", "All types")
                        IsSearchable: =false
                        ItemDisplayText: =If(gblLanguage = "Arabic", ThisItem.ar, ThisItem.en)
                        Items: =colRepTypeUI
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepFltType, Self.Selected);
                          Select(btnRepListLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 140)
                  - cmbRepListPeriod:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الفترة", "Period")
                        DefaultSelectedItems: =If(IsBlank(varRepFltPeriod), Filter(colRepPeriods, false), Filter(colRepPeriods, ID = varRepFltPeriod.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الفترات", "All periods")
                        ItemDisplayText: =Coalesce(ThisItem.Title, ThisItem.PeriodName, Text(ThisItem.ID))
                        Items: =colRepPeriods
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepFltPeriod, Self.Selected);
                          Select(btnRepListLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 140)
                  - cmbRepListStatus:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        DefaultSelectedItems: =If(IsBlank(varRepFltStatus), Filter(colRepStatusUI, false), Filter(colRepStatusUI, k = varRepFltStatus))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All statuses")
                        IsSearchable: =false
                        ItemDisplayText: =If(gblLanguage = "Arabic", ThisItem.ar, ThisItem.en)
                        Items: =colRepStatusUI
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varRepFltStatus, Self.Selected.k);
                          Select(btnRepListLoad)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 160)
                  - btnRepListViewList:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "قائمة", "List")
                        Appearance: =If(varRepViewMode = "list", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varRepViewMode, "list")
                        Text: =If(gblLanguage = "Arabic", "قائمة", "List")
                        Width: =80
                  - btnRepListViewCards:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "بطاقات", "Cards")
                        Appearance: =If(varRepViewMode = "cards", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varRepViewMode, "cards")
                        Text: =If(gblLanguage = "Arabic", "بطاقات", "Cards")
                        Width: =90
            - lblRepListError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varRepListError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل التقارير.", "Reports could not be loaded.")
                  Visible: =varRepListError
                  Width: =Parent.Width
                  Wrap: =false
            - conRepListBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 160
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - galRepList:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 700, 1, 0)
                        Height: =Parent.Height
                        Items: =SortByColumns(colRepList, "Modified", SortOrder.Descending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =If(varRepViewMode = "cards", 120, 80)
                        Visible: =Or(App.Width >= 700, IsBlank(varSelectedReport))
                        Width: =If(App.Width < 700, Parent.Width, If(varRepViewMode = "cards", Parent.Width * 0.55, 420))
                      Children:
                        - btnRepListRow:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(Coalesce(varSelectedReport.ID, 0) = ThisItem.ID, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              Height: =Parent.TemplateHeight - 8
                              OnSelect: |-
                                =Set(varSelectedReport, ThisItem);
                                Set(varRepPane, "Details");
                                Set(varRepNote, "")
                              Text: |-
                                =If(
                                    varRepViewMode = "cards",
                                    Concatenate(
                                        Coalesce(ThisItem.ReportNumber, "-"),
                                        Char(10),
                                        Coalesce(ThisItem.Title, Coalesce(ThisItem.ReportType.Value, "-")),
                                        Char(10),
                                        Coalesce(ThisItem.Project.Value, "-"),
                                        " · ",
                                        Coalesce(ThisItem.ReportingPeriod.Value, "-"),
                                        Char(10),
                                        Coalesce(ThisItem.Status.Value, "-"),
                                        " · ",
                                        Text(Coalesce(ThisItem.OverallProgress, 0)),
                                        "% · ",
                                        Coalesce(ThisItem.HealthStatus.Value, "-")
                                    ),
                                    Concatenate(
                                        Coalesce(ThisItem.ReportNumber, "-"),
                                        " · ",
                                        Coalesce(ThisItem.Project.Value, "-"),
                                        Char(10),
                                        Coalesce(ThisItem.ReportType.Value, "-"),
                                        " · ",
                                        Coalesce(ThisItem.ReportingPeriod.Value, "-"),
                                        " · ",
                                        Coalesce(LookUp(Employees, ID = ThisItem.PreparedByID, FullName), ThisItem.PreparedBy.Value, "-"),
                                        Char(10),
                                        Coalesce(ThisItem.Status.Value, "-"),
                                        " · ",
                                        Text(Coalesce(ThisItem.OverallProgress, 0)),
                                        "% · ",
                                        Coalesce(ThisItem.HealthStatus.Value, "-"),
                                        " · ",
                                        If(IsBlank(ThisItem.SubmittedDate), "-", Text(ThisItem.SubmittedDate, "yyyy-mm-dd")),
                                        " · ",
                                        If(IsBlank(ThisItem.Modified), "-", Text(ThisItem.Modified, "yyyy-mm-dd"))
                                    )
                                )
