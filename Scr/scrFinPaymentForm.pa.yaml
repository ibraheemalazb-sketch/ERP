# scrFinPaymentForm - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinPaymentForm, set its properties from 03-screens-batch-a.md,
# then paste screens/paste/scrFinPaymentForm.controls.pa.yaml onto it.
Screens:
  scrFinPaymentForm:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 52);
        If(
            !hasFinanceAccess,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locMoreOpen: false, locNotifOpen: false});
            Select(btnPRFLoad)
        )
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_PRF:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_PRF:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: |-
              =If(locDirty, UpdateContext({locPendingNav: "back", locDlg: "discard"}), Back())
            ScreenTitle: =If(varPRFormID = 0, fnT("prf.newTitle", "New payment request"), fnT("prf.editTitle", "Edit payment request") & " " & Coalesce(locPR.RequestNumber, ""))
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_PRF:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conPRFRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conPRFMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - conPRFBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - cmpSkel_PRF:
                            Control: CanvasComponent
                            ComponentName: cmpSkeleton
                            Properties:
                              Visible: =locLoading
                              Variant: ="cards"
                              Rows: =3
                              Height: =320
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - cmpEmpty_PRFErr:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =locError
                              Variant: ="error"
                              ActionText: =fnT("common.retry", "Retry")
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              OnAction: =Select(btnPRFLoad)
                        - cmpEmpty_PRFLocked:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =!locLoading && !locError && locLocked
                              Variant: ="noaccess"
                              Title: =fnT("prf.lockedTitle", "This request cannot be edited")
                              Message: =If(varPRFormID = 0, fnT("prf.noCreate", "You do not have permission to create payment requests."), fnT("prf.lockedMsg", "Only draft or returned requests can be edited, by the preparer or a finance user with edit rights."))
                              ActionText: =If(varPRFormID > 0, fnT("prf.openDetail", "Open request"), fnT("nav.payments", "Payments"))
                              OnAction: =If(varPRFormID > 0, Set(varPRID, varPRFormID); Navigate(scrFinPaymentDetail, ScreenTransition.None), fnNavigate("payments"))
                              Height: =280
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - conPRFHeaderCard:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =!locLoading && !locError && !locLocked
                              Height: =28 + sp1 + conPRFFields.Height + 2 * sp2
                            Children:
                              - lblPRFHdrT:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =fnT("prf.details", "Request details")
                                    Font: =fontBase
                                    Size: =fsSection
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =false
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =28
                                    FontWeight: =FontWeight.Semibold
                                    Role: =TextRole.Heading2
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                              - conPRFFields:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =sp2
                                    LayoutWrap: =true
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =If(isMobile, 6 * 90 + (20 + 4 + 2 * touchMin + 4 + 22) + (20 + 4 + 88 + 22) + 7 * sp2, 3 * 90 + (20 + 4 + 2 * touchMin + 4 + 22) + (20 + 4 + 88 + 22) + 4 * sp2)
                                  Children:
                                    - conPRFProject:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =90
                                          Width: =If(isMobile, Parent.Width, (Parent.Width - sp2) / 2 - 1)
                                        Children:
                                          - lblPRFProject:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("prf.project", "Project") & " *"
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =20
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - drpPRFProject:
                                              Control: Classic/DropDown@2.3.1
                                              Properties:
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =FinTheme.Surface
                                                BorderColor: =FinTheme.Border
                                                BorderThickness: =1
                                                FocusedBorderThickness: =2
                                                FocusedBorderColor: =FinTheme.Focus
                                                HoverFill: =FinTheme.RowHover
                                                HoverBorderColor: =FinTheme.Primary
                                                HoverColor: =FinTheme.Text
                                                PressedFill: =FinTheme.RowSelected
                                                PressedColor: =FinTheme.Text
                                                SelectionFill: =FinTheme.Primary
                                                SelectionColor: =FinTheme.OnPrimary
                                                ChevronBackground: =FinTheme.Surface
                                                ChevronFill: =FinTheme.TextSecondary
                                                PaddingLeft: =8
                                                Height: =touchMin
                                                TabIndex: =0
                                                AllowEmptySelection: =false
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                                Items: |-
                                                  =Table({Key: 0, Value: fnT("prf.pickProject", "Select project")}, colProjectOptions)
                                                Default: =Coalesce(LookUp(colProjectOptions, Key = locProjID).Value, fnT("prf.pickProject", "Select project"))
                                                OnChange: =Select(btnPRFProjChange)
                                                AccessibleLabel: =fnT("prf.project", "Project")
                                          - lblPRFProjectErr:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: ="⚠ " & fnT("val.required", "Required.")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Danger
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =true
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                Visible: =locTriedSave && !(drpPRFProject.Selected.Key > 0)
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Live: =Live.Polite
                                    - conPRFType:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =90
                                          Width: =If(isMobile, Parent.Width, (Parent.Width - sp2) / 2 - 1)
                                        Children:
                                          - lblPRFType:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("prf.type", "Request type") & " *"
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =20
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - drpPRFType:
                                              Control: Classic/DropDown@2.3.1
                                              Properties:
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =FinTheme.Surface
                                                BorderColor: =FinTheme.Border
                                                BorderThickness: =1
                                                FocusedBorderThickness: =2
                                                FocusedBorderColor: =FinTheme.Focus
                                                HoverFill: =FinTheme.RowHover
                                                HoverBorderColor: =FinTheme.Primary
                                                HoverColor: =FinTheme.Text
                                                PressedFill: =FinTheme.RowSelected
                                                PressedColor: =FinTheme.Text
                                                SelectionFill: =FinTheme.Primary
                                                SelectionColor: =FinTheme.OnPrimary
                                                ChevronBackground: =FinTheme.Surface
                                                ChevronFill: =FinTheme.TextSecondary
                                                PaddingLeft: =8
                                                Height: =touchMin
                                                TabIndex: =0
                                                AllowEmptySelection: =true
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                                Items: =Choices([@PaymentRequests].RequestType)
                                                Default: =locPR.RequestType.Value
                                                OnChange: |-
                                                  =UpdateContext({locDirty: true})
                                                AccessibleLabel: =fnT("prf.type", "Request type")
                                          - lblPRFTypeErr:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: ="⚠ " & fnT("val.required", "Required.")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Danger
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =true
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                Visible: =locTriedSave && !(!IsBlank(drpPRFType.Selected.Value))
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Live: =Live.Polite
                                    - conPRFDate:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =90
                                          Width: =If(isMobile, Parent.Width, (Parent.Width - sp2) / 2 - 1)
                                        Children:
                                          - lblPRFDate:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("prf.date", "Request date") & " *"
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =20
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - dtePRFDate:
                                              Control: Classic/DatePicker@2.6.0
                                              Properties:
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =FinTheme.Surface
                                                BorderColor: =FinTheme.Border
                                                BorderThickness: =1
                                                IconFill: =FinTheme.OnPrimary
                                                IconBackground: =FinTheme.Primary
                                                Height: =touchMin
                                                TabIndex: =0
                                                StartYear: =2015
                                                EndYear: =Year(Today()) + 2
                                                IsEditable: =false
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                                                DefaultDate: =Coalesce(locPR.RequestDate, Today())
                                                OnChange: |-
                                                  =UpdateContext({locDirty: true})
                                                AccessibleLabel: =fnT("prf.date", "Request date")
                                          - lblPRFDateErr:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: ="⚠ " & fnT("val.required", "Required.")
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Danger
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =true
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =18
                                                Visible: =locTriedSave && !(!IsBlank(dtePRFDate.SelectedDate))
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Live: =Live.Polite
                                    - conPRFPaidTo:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Start
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =4
                                          LayoutWrap: =false
                                          PaddingTop: =0
                                          PaddingRight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          DropShadow: =DropShadow.None
                                          BorderThickness: =0
                                          Fill: =RGBA(0, 0, 0, 0)
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Height: =90
                                          Width: =If(isMobile, Parent.Width, (Parent.Width - sp2) / 2 - 1)
                                        Children:
                                          - lblPRFPaidTo:
                                              Control: Label@2.5.1
                                              Properties:
                                                Text: =fnT("prf.paidTo", "Paid to") & " *"
                                                Font: =fontBase
                                                Size: =fsCaption
                                                Color: =FinTheme.Text
                                                Fill: =RGBA(0, 0, 0, 0)
                                                BorderThickness: =0
                                                Wrap: =false
                                                Align: =alignStart
                                                VerticalAlign: =VerticalAlign.Middle
                                                PaddingTop: =0
                                                PaddingRight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
                                                Height: =20
                                                FontWeight: =FontWeight.Semibold
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                          - txtPRFPaidTo:
                                              Control: Classic/TextInput@2.3.2
                                              Properties:
                                                Default: =locPR.PaidTo
                                                Font: =fontBase
                                                Size: =fsBody
                                                Color: =FinTheme.Text
                                                Fill: =FinTheme.Surface
                                                BorderColor: =FinTheme.Border
                                                BorderThickness: =1
                                                FocusedBorderThickness: =2
                                                FocusedBorderColor: =FinTheme.Focus
                                                HoverFill: =FinTheme.Surface
                                                HoverBorderColor: =FinTheme.Primary
                                                HintText: =""
                                                Height: =touchMin
                                                PaddingLeft: =8
                                                PaddingRight: =8
                                                RadiusTopLeft: =6
                                                RadiusTopRight: =6
                                                RadiusBottomLeft: =6
                                                RadiusBottomRight: =6
                                                Align: =alignStart
                                                TabIndex: =0
                                                LayoutMinWidth: =0
                                                LayoutMinHeight: =0
