      - btnPRFDoSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({locTriedSave: true, locDlg: ""});
              If(
                  !((drpPRFProject.Selected.Key > 0) && (!IsBlank(drpPRFType.Selected.Value)) && (!IsBlank(Trim(txtPRFPaidTo.Text))) && (!IsBlank(drpPRFCurrency.Selected.Value)) && (!IsBlank(dtePRFDate.SelectedDate)) && (!IsEmpty(Filter(colPRLines, !Deleted))) && (IsEmpty(Filter(Filter(colPRLines, !Deleted), BudgetLineID = 0 || Coalesce(Amount, 0) <= 0)))),
                  Notify(fnT("form.fixErrors", "Please correct the highlighted fields."), NotificationType.Error),
                  UpdateContext({locSaving: true});
                  With(
                      {
                          _isNew: varPRFormID = 0, _proj: LookUp(colMyProjects, ID = drpPRFProject.Selected.Key), _cur: drpPRFCurrency.Selected.Value,
                          _total: Sum(Filter(colPRLines, !Deleted), Amount), _corr: Text(GUID()),
                          _status: If(locSubmit, cfgPRStatus.Pending, cfgPRStatus.Draft)
                      },
                      With(
                          {
                              // header fields. Flow-maintained / flow-generated fields (RequestNumber, TotalAmountUSD, AmountUSD,
                              // PostedToLedger, PaymentStatus) are NOT written. Approval flags restart at false on every save/submit.
                              _hdr: {
                                  Title: Left(_proj.ProjectCode & " - " & Trim(txtPRFPaidTo.Text), 255),
                                  RequestDate: dtePRFDate.SelectedDate,
                                  Project: {Id: _proj.ID, Value: _proj.ProjectCode},
                                  ProjectID: _proj.ID,
                                  ProjectCode: _proj.ProjectCode,
                                  PaidTo: Trim(txtPRFPaidTo.Text),
                                  RequestType: {Value: drpPRFType.Selected.Value},
                                  Description: txtPRFDesc.Text,
                                  Currency: {Value: _cur},
                                  RequestedAmount: _total,
                                  ExchangeRate: fnRateToUSD(_cur),
                                  VendorID: If(drpPRFVendor.Selected.Key = 0, Blank(), drpPRFVendor.Selected.Key),
                                  PurchaseOrderID: If(drpPRFPO.Selected.Key = 0, Blank(), drpPRFPO.Selected.Key),
                                  RequestStatus: {Value: _status},
                                  FinanceOfficerApproved: false,
                                  ProjectManagerApproved: false,
                                  FinanceManagerApproved: false
                              }
                          },
                          IfError(
                              If(
                                  _isNew,
                                  // NEW: the lines need the header ID, so the header is saved first, then all line writes run in one Concurrent()
                                  UpdateContext({locSavedPR: Patch(PaymentRequests, Defaults(PaymentRequests), _hdr, {PreparedByID: varMeID, PreparedDate: Now()})});
                                  Concurrent(
                          If(
                              !IsEmpty(Filter(colPRLines, ID = 0 && !Deleted)),
                              Collect(
                                  PaymentRequesttLines,
                                  ForAll(Filter(colPRLines, ID = 0 && !Deleted) As l, {
                                      Title: _proj.ProjectCode & "-" & l.LineNumber,
                                      PaymenetRequest: {Id: locSavedPR.ID, Value: Coalesce(locSavedPR.RequestNumber, "")},
                                      PaymentRequestID: locSavedPR.ID, ProjectID: _proj.ID, LineNumber: l.LineNumber,
                                      BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLineCode,
                                      RequestDescription: l.RequestDescription, Currency: {Value: _cur}, Amount: l.Amount
                                  })
                              )
                          ),
                          If(
                              !IsEmpty(Filter(colPRLines, ID > 0 && !Deleted)),
                              Patch(
                                  PaymentRequesttLines,
                                  ForAll(Filter(colPRLines, ID > 0 && !Deleted) As l, LookUp(colPRLinesSrc, ID = l.ID)),
                                  ForAll(Filter(colPRLines, ID > 0 && !Deleted) As l, {
                                      ProjectID: _proj.ID, LineNumber: l.LineNumber, BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLineCode,
                                      RequestDescription: l.RequestDescription, Currency: {Value: _cur}, Amount: l.Amount
                                  })
                              )
                          ),
                          If(
                              !IsEmpty(Filter(colPRLines, ID > 0 && Deleted)),
                              Remove(PaymentRequesttLines, ForAll(Filter(colPRLines, ID > 0 && Deleted) As l, LookUp(colPRLinesSrc, ID = l.ID)))
                          )
                                  ),
                                  // EDIT: header + all line writes in one Concurrent() (spec 7.4)
                                  Concurrent(
                                      UpdateContext({locSavedPR: Patch(PaymentRequests, LookUp(PaymentRequests, ID = varPRFormID), _hdr)}),
                          If(
                              !IsEmpty(Filter(colPRLines, ID = 0 && !Deleted)),
                              Collect(
                                  PaymentRequesttLines,
                                  ForAll(Filter(colPRLines, ID = 0 && !Deleted) As l, {
                                      Title: _proj.ProjectCode & "-" & l.LineNumber,
                                      PaymenetRequest: {Id: varPRFormID, Value: Coalesce(locPR.RequestNumber, "")},
                                      PaymentRequestID: varPRFormID, ProjectID: _proj.ID, LineNumber: l.LineNumber,
                                      BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLineCode,
                                      RequestDescription: l.RequestDescription, Currency: {Value: _cur}, Amount: l.Amount
                                  })
                              )
                          ),
                          If(
                              !IsEmpty(Filter(colPRLines, ID > 0 && !Deleted)),
                              Patch(
                                  PaymentRequesttLines,
                                  ForAll(Filter(colPRLines, ID > 0 && !Deleted) As l, LookUp(colPRLinesSrc, ID = l.ID)),
                                  ForAll(Filter(colPRLines, ID > 0 && !Deleted) As l, {
                                      ProjectID: _proj.ID, LineNumber: l.LineNumber, BudgetLineID: l.BudgetLineID, BudgetLineCode: l.BudgetLineCode,
                                      RequestDescription: l.RequestDescription, Currency: {Value: _cur}, Amount: l.Amount
                                  })
                              )
                          ),
                          If(
                              !IsEmpty(Filter(colPRLines, ID > 0 && Deleted)),
                              Remove(PaymentRequesttLines, ForAll(Filter(colPRLines, ID > 0 && Deleted) As l, LookUp(colPRLinesSrc, ID = l.ID)))
                          )
                                  )
                              ),
                              UpdateContext({locSaving: false});
                              Notify(fnT("prf.saveError", "The payment request could not be saved. Nothing was submitted.") & " " & FirstError.Message, NotificationType.Error);
                              Trace("PR save failed: " & FirstError.Message, TraceSeverity.Error),
                              // ---- success
                              If(
                                  cfgPRWriteUSDPreview,
                                  IfError(Patch(PaymentRequests, locSavedPR, {TotalAmountUSD: fnToUSD(_total, _cur)}),
                                      Trace("USD preview write failed: " & FirstError.Message, TraceSeverity.Warning))
                              );
                              fnLogActivityFull("Payment Request", locSavedPR.ID, Coalesce(locSavedPR.RequestNumber, ""), If(_isNew, "Created", "Updated"), "Info",
                                  _proj.ID, _proj.ProjectCode, "", "", "", CountRows(Filter(colPRLines, !Deleted)) & " line(s)", "", _total, _cur, _corr);
                              If(
                                  locSubmit,
                                  fnLogActivityFull("Payment Request", locSavedPR.ID, Coalesce(locSavedPR.RequestNumber, ""), "Submitted", "Important",
                                      _proj.ID, _proj.ProjectCode, "RequestStatus", locPR.RequestStatus.Value, _status, "Submitted for approval", "", _total, _cur, _corr)
                              );
                              UpdateContext({locSaving: false, locDirty: false});
                              Notify(If(locSubmit, fnT("prf.submitted", "Payment request submitted for approval."), fnT("prf.saved", "Draft saved.")), NotificationType.Success);
                              Set(varPRID, locSavedPR.ID);
                              Navigate(scrFinPaymentDetail, ScreenTransition.None)
                          )
                      )
                  )
              )
