            Message: =fnT("dlg.discardMsg", "Your changes have not been saved. Leave and lose them?")
            ConfirmText: =fnT("dlg.discard", "Discard")
            CancelText: =fnT("dlg.keepEditing", "Keep editing")
            Destructive: =true
