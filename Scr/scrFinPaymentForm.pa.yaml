      - btnPRFLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =Set(varPRFormID, Coalesce(varPRFormID, 0));
              UpdateContext({locLoading: true, locError: false, locLocked: false, locDlg: "", locDirty: false, locTriedSave: false,
                  locSaving: false, locLineSeq: 0, locPR: Blank(), locSubmit: false});
              Clear(colPRLinesSrc);
              IfError(
                  Concurrent(
                      // vendors for the dropdown: once per session, max 2000 rows (N13)
                      If(IsEmpty(colVendorsLite), ClearCollect(colVendorsLite, ForAll(FirstN(Sort(Vendors, ID, SortOrder.Ascending), 2000) As v, {Key: v.ID, Value: v.Title}))),
                      If(varPRFormID > 0, UpdateContext({locPR: LookUp(PaymentRequests, ID = varPRFormID)})),
                      // lines of this request: PaymentRequestID is Indexed (real records kept as Patch/Remove bases)
                      If(varPRFormID > 0, ClearCollect(colPRLinesSrc, Filter(PaymentRequesttLines, PaymentRequestID = varPRFormID)))
                  );
                  UpdateContext({
                      locProjID: If(varPRFormID > 0, locPR.ProjectID, If(!IsBlank(LookUp(colMyProjects, ID = varProjectID)), varProjectID, 0)),
                      locLocked: If(
                          varPRFormID > 0,
                          IsBlank(locPR) ||
                          fnPRStage(locPR.RequestStatus.Value, locPR.PaymentStatus.Value, locPR.FinanceOfficerApproved, locPR.ProjectManagerApproved, locPR.FinanceManagerApproved) <> "draft" ||
                          !(locPR.PreparedByID = varMeID || canEdit) ||
                          IsBlank(LookUp(colMyProjects, ID = locPR.ProjectID)),
                          !canCreate
                      )
                  });
                  If(locProjID > 0 && varBudgetLinesProjectID <> locProjID, fnLoadBudgetLines(locProjID));
                  If(locProjID > 0, ClearCollect(
                      colPRFPOs,
                      Table({Key: 0, Value: fnT("prf.noPO", "(no purchase order)"), VendorID: 0}),
                      // PurchaseOrders.ProjectID is a Number column (delegable). Which PO statuses may be paid is open (N9): all are listed.
                      ForAll(FirstN(Sort(Filter(PurchaseOrders, ProjectID = locProjID), ID, SortOrder.Descending), cfgPageSize) As o,
                          {Key: o.ID, Value: o.PONumber & " - " & o.Supplier.Value, VendorID: Coalesce(o.VendorID, 0)})
                  ), Clear(colPRFPOs));
                  ClearCollect(
                      colPRFBudOpts,
                      Table({Key: 0, Value: fnT("prf.pickBudget", "Select budget line"), Code: "", Remaining: Blank(), Currency: ""}),
                      ForAll(Sort(colBudgetLines, BudgetLineCode, SortOrder.Ascending) As b,
                          {Key: b.ID, Value: b.BudgetLineCode & " - " & b.Description, Code: b.BudgetLineCode, Remaining: b.RemainingBalance, Currency: b.Currency})
                  );
                  ClearCollect(
                      colPRLines,
                      ForAll(Sort(colPRLinesSrc, LineNumber, SortOrder.Ascending) As l,
                          With({_b: LookUp(colBudgetLines, ID = l.BudgetLineID)}, {LineKey: l.ID, ID: l.ID, LineNumber: l.LineNumber, BudgetLineID: Coalesce(l.BudgetLineID, 0), BudgetLineCode: l.BudgetLineCode, RequestDescription: l.RequestDescription, Amount: l.Amount, Deleted: false, BudLabel: If(IsBlank(_b), l.BudgetLineCode, _b.BudgetLineCode & " - " & _b.Description), BudRemaining: _b.RemainingBalance, BudCurrency: _b.Currency}))
                  );
                  // a new request starts with one empty line
                  If(
                      varPRFormID = 0,
                      Collect(colPRLines, {
                          LineKey: -1, ID: 0, LineNumber: 1, BudgetLineID: 0, BudgetLineCode: "", RequestDescription: "", Amount: 0,
                          Deleted: false, BudLabel: "", BudRemaining: Blank(), BudCurrency: ""
                      });
                      UpdateContext({locLineSeq: -1})
                  ),
                  UpdateContext({locError: true});
                  Trace("Payment request form load failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locLoading: false});
              Reset(drpPRFProject); Reset(drpPRFType); Reset(dtePRFDate); Reset(txtPRFPaidTo); Reset(drpPRFVendor); Reset(txtPRFVendorSearch);
              Reset(drpPRFPO); Reset(drpPRFCurrency); Reset(txtPRFDesc)
      - btnPRFProjChange:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
