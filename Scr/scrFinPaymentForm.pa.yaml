                  ),
                  Notify(fnT("common.loadError", "This section could not be loaded. Please retry."), NotificationType.Error)
              );
              // budget lines belong to one project: clear the choices made for the previous project
              If(
                  CountRows(Filter(colPRLines, BudgetLineID > 0)) > 0,
                  UpdateIf(colPRLines, BudgetLineID > 0, {BudgetLineID: 0, BudgetLineCode: "", BudLabel: "", BudRemaining: Blank(), BudCurrency: ""});
                  Notify(fnT("prf.budgetCleared", "Project changed: choose the budget lines again."), NotificationType.Warning)
              )
