                      ForAll(FirstN(Sort(Filter(PurchaseOrders, ProjectID = locProjID), ID, SortOrder.Descending), cfgPageSize) As o,
                          {Key: o.ID, Value: o.PONumber & " - " & o.Supplier.Value, VendorID: Coalesce(o.VendorID, 0)})
                  ), Clear(colPRFPOs));
