Screens:
  ScrAllProjects:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Projects");
        Set(VarProgrammodule, "Pprojects");
        If(
            Not(gblProjectsInitialized),
            If(IsBlank(varSelectedProject), UpdateContext({varShowDetails: false}));
            Set(gblProjectsInitialized, true)
        );
        If(IsBlank(varProjectTab), Set(varProjectTab, "General"));
        If(IsBlank(varProjectViewMode), Set(varProjectViewMode, "table"));
        Set(varProjectDocFolder, "01_Project_Management/01_Project_Proposal");
        Set(varShowProjectDocUpload, false);
        If(
            And(varShowDetails, Not(IsBlank(varSelectedProject))),
            Set(ProjectsPan, "None"),
            Set(ProjectsPan, "Yes")
        );
        ClearCollect(
            colProjectManagementFolders,
            {EnglishName: "Project Proposal", ArabicName: "مقترح المشروع", FolderPath: "01_Project_Management/01_Project_Proposal"},
            {EnglishName: "Agreements & MoUs", ArabicName: "الاتفاقيات ومذكرات التفاهم", FolderPath: "01_Project_Management/02_Agreements_MoUs"},
            {EnglishName: "Project Amendments", ArabicName: "تعديلات المشروع", FolderPath: "01_Project_Management/03_Project_Amendments"},
            {EnglishName: "Correspondence", ArabicName: "المراسلات", FolderPath: "01_Project_Management/04_Correspondence"},
            {EnglishName: "Meeting Minutes", ArabicName: "محاضر الاجتماعات", FolderPath: "01_Project_Management/05_Meeting_Minutes"},
            {EnglishName: "Decision Records", ArabicName: "سجلات القرارات", FolderPath: "01_Project_Management/06_Decision_Records"},
            {EnglishName: "Other Project Management", ArabicName: "أخرى - إدارة المشروع", FolderPath: "01_Project_Management/07_Other_Project_Management"}
        );
        Set(varApForceReload, false);
        Select(btnApReload)
    Children:
      - conApNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpApNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpApTopBar:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            ModuleIcon: ="Layers"
            ModuleName: =If(gblLanguage = "Arabic", "البرامج", "Programs")
            OnSelectTitle: =Navigate(scrProjects, ScreenTransition.None)
            ScreenSubtitle: =If(gblLanguage = "Arabic", "إدارة المشاريع", "Projects Management")
            ScreenTitle: =If(gblLanguage = "Arabic", "البرامج", "Programs")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =true
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpApPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 21, Module: "Tasks", Title: If(gblLanguage = "Arabic", "المهام", "Tasks"), Icon: "Grid", Visible: true},
                  {ID: 22, Module: "Plans", Title: If(gblLanguage = "Arabic", "الخطط", "Plans"), Icon: "Calendar", Visible: true},
                  {ID: 23, Module: "Reports", Title: If(gblLanguage = "Arabic", "التقارير", "Reports"), Icon: "Chart", Visible: true},
                  {ID: 24, Module: "Risks", Title: If(gblLanguage = "Arabic", "المخاطر", "Risks"), Icon: "Warning", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Tasks", Navigate(scrTasks, ScreenTransition.None),
                  "Plans", Navigate(scrProjectsPlans, ScreenTransition.None),
                  "Reports", Notify(If(gblLanguage = "Arabic", "قريباً", "Coming Soon"), NotificationType.Information),
                  "Risks", Navigate(scrRisk, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conApSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
            X: =0
            Y: =0
          Children:
            - lblApEffView:
                Control: Label@2.5.1
                Properties:
                  Height: =1
                  Text: |-
                    =If(
                        And(Not(varShowDetails), App.Width >= 700, Coalesce(varProjectViewMode, "table") = "table"),
                        "table",
                        If(
                            And(Not(varShowDetails), Coalesce(varProjectViewMode, "table") = "card"),
                            "card",
                            "list"
                        )
                    )
                  Width: =1
                  X: =0
                  Y: =0
            - btnApReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Refresh(Projects);
                    Set(varUserHasAllProjects, Not(IsEmpty(Filter(colUserProjectAccess, AllProjects = true))));
                    ClearCollect(
                        colUserProjectIDs,
                        ForAll(
                            Filter(
                                colUserProjectAccess,
                                And(EmployeeID = gblCurrentEmployee.ID, IsActive = true, AllProjects = false)
                            ),
                            {Value: ProjectID}
                        )
                    );
                    If(
                        Or(varApForceReload, CountRows(colProjects) = 0),
                        ClearCollect(colProjects, FirstN(SortByColumns(Projects, "StartDate", SortOrder.Descending), 500))
                    );
                    ClearCollect(colApEmployees, FirstN(Filter(Employees, Status.Value = "Active"), 500));
                    If(
                        Not(IsBlank(varSelectedProject)),
                        Set(varSelectedProject, LookUp(colProjects, ID = varSelectedProject.ID))
                    );
                    Select(btnApApply);
                    Select(btnApLoadKids)
                  Text: ="Reload"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
            - btnApApply:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =ClearCollect(
                        colApFiltered,
                        Sort(
                            Filter(
                                colProjects,
                                And(
                                    Or(
                                        IsBlank(txtApSearch.Text),
                                        txtApSearch.Text in Coalesce(Title, ""),
                                        txtApSearch.Text in Coalesce(ProjectCode, "")
                                    ),
                                    Or(IsBlank(cmbApStatus.Selected.Value), Status.Value = cmbApStatus.Selected.Value),
                                    Or(IsBlank(cmbApSector.Selected.Value), Sector.Value = cmbApSector.Selected.Value),
                                    Or(IsBlank(txtApDonor.Text), txtApDonor.Text in Coalesce(Donor, "")),
                                    Or(varUserHasAllProjects, ID in colUserProjectIDs)
                                )
                            ),
                            StartDate,
                            SortOrder.Descending
                        )
                    )
                  Text: ="Apply"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
            - btnApLoadKids:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =If(
                        IsBlank(varSelectedProject),
                        Clear(colProjMembers);
                        Clear(colProjActivities);
                        Clear(colProjTasks);
                        Clear(colProjRisks);
                        Clear(colProjDocs),
                        ClearCollect(colProjMembers, Filter(ProjectMembers, Project.Id = varSelectedProject.ID));
                        ClearCollect(colProjActivities, Filter(ProjectsActivities, Project.Id = varSelectedProject.ID));
                        ClearCollect(colProjTasks, Filter(ProjectsTasks, ProjectID = varSelectedProject.ID));
                        ClearCollect(colProjRisks, Filter(Risks, ProjectID = varSelectedProject.ID));
                        Select(btnApLoadDocs)
                    )
                  Text: ="Load"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
            - btnApLoadDocs:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =If(
                        IsBlank(varSelectedProject),
                        Clear(colProjDocs),
                        ClearCollect(
                            colApDocsRaw,
                            Filter(
                                ProjectDocuments,
                                'Folder path' = "ProjectDocuments/" & varSelectedProject.ProjectCode & "/" & varProjectDocFolder & "/"
                            )
                        );
                        ClearCollect(colProjDocs, Filter(colApDocsRaw, Not('Is folder')))
                    )
                  Text: ="Docs"
                  Visible: =true
                  Width: =1
                  X: =0
                  Y: =0
      - conApPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =If(App.Width < 700, cmpApPhoneNav.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 12)
            PaddingRight: =12
            PaddingTop: =cmpApTopBar.Height + 8
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conApHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =56
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - btnApBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "رجوع", "Back")
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="ArrowLeft"
                        OnSelect: |-
                          =If(
                              varShowDetails,
                              UpdateContext({varShowDetails: false});
                              Set(ProjectsPan, "Yes"),
                              Navigate(scrProjects, ScreenTransition.UnCover)
                          )
                        Text: =If(varShowDetails, If(gblLanguage = "Arabic", "القائمة", "List"), If(gblLanguage = "Arabic", "البرامج", "Programs"))
                        Width: =120
                  - lblApTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =28
                        Size: =gblTheme.Typography.SectionTitle
                        Text: =If(And(varShowDetails, Not(IsBlank(varSelectedProject))), Coalesce(varSelectedProject.Title, ""), If(gblLanguage = "Arabic", "كل المشاريع", "All projects"))
                        Width: =200
                  - btnApTasks:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المهام", "Tasks")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="Grid"
                        OnSelect: |-
                          =Set(varTkScope, If(IsBlank(varSelectedProject), "my", "project"));
                          Navigate(scrTasks, ScreenTransition.Cover)
                        Text: =If(gblLanguage = "Arabic", "المهام", "Tasks")
                        Width: =110
                  - btnApNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "مشروع جديد", "New project")
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =36
                        Icon: ="Add"
                        OnSelect: |-
                          =Set(varEditorEntity, "Project");
                          Set(varEditorMode, "New");
                          Set(varEditingProject, Blank());
                          Set(varReturnScreen, "Projects");
                          Set(varReturnTab, "General");
                          Set(varEdContinue, false);
                          Navigate(scrProjectEditor, ScreenTransition.Cover)
                        Text: =If(gblLanguage = "Arabic", "جديد", "New")
                        Visible: =Coalesce(LookUp(colUserPermissions, Module.Value = "Projects", CanViewAll), false)
                        Width: =100
            - conApSplit:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Parent.Height - cmpApTopBar.Height - 8 - If(App.Width < 700, cmpApPhoneNav.Height + 8, 12) - 64
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(And(varShowDetails, ProjectsPan = "Yes", App.Width > 700), LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - conApList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Visible: =ProjectsPan = "Yes"
                        Width: =If(And(varShowDetails, App.Width > 700), Parent.Width * 0.2, Parent.Width)
                      Children:
                        - conApFilters:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(App.Width < 700, 168, 84)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - txtApSearch:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بحث", "Search")
                                    Height: =40
                                    OnChange: =Select(btnApApply)
                                    Placeholder: =If(gblLanguage = "Arabic", "ابحث بالاسم أو الرمز", "Search name or code")
                                    Width: =If(App.Width < 700, Parent.Width, Parent.Width - 280)
                              - txtApDonor:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                    Height: =40
                                    OnChange: =Select(btnApApply)
                                    Placeholder: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                    Width: =If(App.Width < 700, Parent.Width, 160)
                              - cmbApSector:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                                    DefaultSelectedItems: =Filter(Choices(Projects.Sector), false)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل القطاعات", "All Sectors")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Projects.Sector)
                                    OnChange: =Select(btnApApply)
                                    SelectMultiple: =false
                                    Width: =If(App.Width < 700, Parent.Width, 150)
                        - conApFilterRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - cmbApStatus:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                    DefaultSelectedItems: =Filter(Choices(Projects.Status), false)
                                    Height: =40
                                    InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All Statuses")
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.Value
                                    Items: =Choices(Projects.Status)
                                    OnChange: =Select(btnApApply)
                                    SelectMultiple: =false
                                    Width: =160
                              - btnApViewTable:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "جدول", "Table")
                                    Appearance: =If(varProjectViewMode = "table", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =36
                                    Icon: ="Table"
                                    OnSelect: =Set(varProjectViewMode, "table")
                                    Text: =""
                                    Visible: =And(Not(varShowDetails), App.Width >= 700)
                                    Width: =40
                              - btnApViewCard:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بطاقات", "Cards")
                                    Appearance: =If(varProjectViewMode = "card", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =36
                                    Icon: ="Grid"
                                    OnSelect: =Set(varProjectViewMode, "card")
                                    Text: =""
                                    Visible: =Not(varShowDetails)
                                    Width: =40
                              - btnApViewList:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "قائمة", "List")
                                    Appearance: =If(varProjectViewMode = "list", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =36
                                    Icon: ="BulletedList"
                                    OnSelect: =Set(varProjectViewMode, "list")
                                    Text: =""
                                    Visible: =Not(varShowDetails)
                                    Width: =40
                              - btnApRefresh:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =36
                                    Icon: ="ArrowClockwise"
                                    OnSelect: |-
                                      =Set(varApForceReload, true);
                                      Select(btnApReload)
                                    Text: =""
                                    Visible: =Not(varShowDetails)
                                    Width: =40
                              - btnApClear:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "مسح جميع عوامل التصفية", "Clear all filters")
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    Icon: ="Dismiss"
                                    OnSelect: |-
                                      =Reset(txtApSearch);
                                      Reset(txtApDonor);
                                      Reset(cmbApSector);
                                      Reset(cmbApStatus);
                                      Select(btnApApply)
                                    Text: =If(gblLanguage = "Arabic", "مسح", "Clear")
                                    Width: =80
                        - lblApEmpty:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =32
                              Size: =gblTheme.Typography.Body
                              Text: =If(gblLanguage = "Arabic", "لا توجد مشاريع ضمن هذا البحث", "No projects match this search")
                              Visible: =CountRows(colApFiltered) = 0
                              Width: =Parent.Width
                        - galApTable:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشاريع", "Projects")
                              Fill: =fxThemeColor("Surface")
                              FillPortions: =1
                              Items: =colApFiltered
                              LayoutMinHeight: =80
                              ShowScrollbar: =true
                              TemplatePadding: =4
                              TemplateSize: =52
                              Visible: =lblApEffView.Text = "table"
                              Width: =Parent.Width
                            Children:
                              - btnApTableRow:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =Parent.TemplateHeight
                                    OnSelect: |-
                                      =Set(varSelectedProject, ThisItem);
                                      UpdateContext({varShowDetails: true});
                                      Set(varProjectTab, "General");
                                      Set(varSelectedMember, Blank());
                                      Set(varSelectedActivity, Blank());
                                      Set(varSelectedTask, Blank());
                                      Set(varSelectedRisk, Blank());
                                      Set(varTaskActivityFilter, Blank());
                                      Set(ProjectsPan, "None");
                                      Select(btnApLoadKids)
                                    Text: =Coalesce(ThisItem.ProjectCode, "")
                                    Width: =Parent.TemplateWidth
                              - lblApTableTitle:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =22
                                    Size: =12
                                    Text: =Coalesce(ThisItem.Title, "")
                                    Width: =Parent.TemplateWidth - 220
                                    X: =110
                                    Y: =14
                              - lblApTableStatus:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =fxToneInk(Switch(ThisItem.Status.Value, "Active", "success", "Completed", "completed", "Planed", "info", "On Hold", "warning", "Cancelled", "danger", "muted"))
                                    Fill: =fxToneFill(Switch(ThisItem.Status.Value, "Active", "success", "Completed", "completed", "Planed", "info", "On Hold", "warning", "Cancelled", "danger", "muted"))
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =24
                                    RadiusBottomLeft: =gblTheme.Radius.Round
                                    RadiusBottomRight: =gblTheme.Radius.Round
                                    RadiusTopLeft: =gblTheme.Radius.Round
                                    RadiusTopRight: =gblTheme.Radius.Round
                                    Size: =11
                                    Text: =Coalesce(ThisItem.Status.Value, "-")
                                    Width: =90
                                    X: =Parent.TemplateWidth - 100
                                    Y: =14
                        - galApList:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Fill: =fxThemeColor("Surface")
                              FillPortions: =1
                              Items: =colApFiltered
                              LayoutMinHeight: =80
                              ShowScrollbar: =true
                              TemplatePadding: =4
                              TemplateSize: =72
                              Visible: =lblApEffView.Text = "list"
                              Width: =Parent.Width
                            Children:
                              - conApListRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Surface")
                                    Height: =Parent.TemplateHeight
