                        Width: =Parent.Width
                  - attApUpload:
                      Control: Attachments@2.3.0
                      Properties:
                        AddAttachmentText: =If(gblLanguage = "Arabic", "اختيار ملف", "Select a file")
                        BorderStyle: =BorderStyle.None
                        Height: =120
                        MaxAttachmentSize: =25
                        MaxAttachments: =1
                        Width: =Parent.Width
                  - conApUploadActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnApUploadCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(gblProjectDocumentToReplace, Blank());
                                Set(varShowProjectDocUpload, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =90
                        - btnApUploadSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    CountRows(attApUpload.Attachments) = 0,
                                    Notify(If(gblLanguage = "Arabic", "اختر ملفاً", "Choose a file"), NotificationType.Warning),
                                    IfError(
                                        ForAll(
                                            attApUpload.Attachments As doc,
                                            ProgramDoc.Run(
                                                varSelectedProject.ProjectCode,
                                                varProjectDocFolder,
                                                doc.Name,
                                                {file: {name: doc.Name, contentBytes: doc.Value}}
                                            )
                                        );
                                        If(Not(IsBlank(gblProjectDocumentToReplace)), Remove(ProjectDocuments, gblProjectDocumentToReplace));
                                        Set(gblProjectDocumentToReplace, Blank());
                                        Set(varShowProjectDocUpload, false);
                                        Select(btnApLoadDocs);
                                        Notify(If(gblLanguage = "Arabic", "تم الرفع", "Uploaded"), NotificationType.Success),
                                        Notify(If(gblLanguage = "Arabic", "تعذر الرفع", "Upload failed"), NotificationType.Error)
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                              Width: =90
