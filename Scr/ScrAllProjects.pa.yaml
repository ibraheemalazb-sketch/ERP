                                                      Patch(ProjectsTasks, LookUp(ProjectsTasks, ID = varSelectedTask.ID), {Status: {Value: "Cancelled"}});
                                                      Select(btnApLoadKids);
                                                      Notify(If(gblLanguage = "Arabic", "أُلغيت المهمة", "Task cancelled"), NotificationType.Success),
                                                      Notify(If(gblLanguage = "Arabic", "تعذر الإلغاء", "Could not cancel"), NotificationType.Error)
                                                  )
                                                Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                                                Width: =80
                        - conApRisks:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =520
                              LayoutDirection: =If(App.Width >= 1100, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varProjectTab = "Risks"
                              Width: =Parent.Width
                            Children:
                              - conApRiskList:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =If(App.Width >= 1100, Parent.Height, 260)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =If(App.Width >= 1100, 340, Parent.Width)
                                  Children:
                                    - btnApRiskAdd:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Primary
                                          Height: =36
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(varEditorEntity, "Risk");
                                            Set(varEditorMode, "New");
                                            Set(varEditingRisk, Blank());
                                            Set(varReturnScreen, "Projects");
                                            Set(varReturnTab, "Risks");
                                            Navigate(scrProjectEditor, ScreenTransition.Cover)
                                          Text: =If(gblLanguage = "Arabic", "خطر جديد", "New risk")
                                          Width: =140
                                    - txtApRiskSearch:
                                        Control: ModernTextInput@1.1.2
                                        Properties:
                                          Height: =36
                                          Placeholder: =If(gblLanguage = "Arabic", "البحث في المخاطر", "Search risks")
                                          Width: =Parent.Width
                                    - cmbApRiskCat:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          DefaultSelectedItems: =Filter(Choices(Risks.Category), false)
                                          Height: =36
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل التصنيفات", "All Categories")
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices(Risks.Category)
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                                    - cmbApRiskOwn:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          DefaultSelectedItems: =Filter(colApEmployees, false)
                                          Height: =36
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "المالك", "Owner")
                                          ItemDisplayText: =ThisItem.FullName
                                          Items: =colApEmployees
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                                    - cmbApRiskStat:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          DefaultSelectedItems: =Filter(Choices(Risks.Status), false)
                                          Height: =36
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All Statuses")
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices(Risks.Status)
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                                    - galApRisks:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          FillPortions: =1
                                          Items: |-
                                            =SortByColumns(
                                                Filter(
                                                    colProjRisks,
                                                    And(
                                                        Or(IsBlank(txtApRiskSearch.Text), StartsWith(Title, txtApRiskSearch.Text)),
                                                        Or(IsBlank(cmbApRiskCat.Selected.Value), Category.Value = cmbApRiskCat.Selected.Value),
                                                        Or(IsBlank(cmbApRiskOwn.Selected), Or(Owner.Id = cmbApRiskOwn.Selected.ID, OwnerID = cmbApRiskOwn.Selected.ID)),
                                                        Or(IsBlank(cmbApRiskStat.Selected.Value), Status.Value = cmbApRiskStat.Selected.Value)
                                                    )
                                                ),
                                                "Created",
                                                SortOrder.Descending
                                            )
                                          TemplateSize: =64
                                          Width: =Parent.Width
                                        Children:
                                          - conApRiskRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                Height: =Parent.TemplateHeight
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =4
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - btnApRiskPick:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Height: =36
                                                      OnSelect: =Set(varSelectedRisk, ThisItem)
                                                      Text: |-
                                                        =Coalesce(ThisItem.Title, "") & " · " & Coalesce(ThisItem.Level.Value, "") & " · " & Coalesce(ThisItem.Owner.Value, "")
                                                      Width: =Parent.Width - 150
                                                - btnApRiskMitigate:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Height: =32
                                                      OnSelect: |-
                                                        =IfError(
                                                            Patch(Risks, LookUp(Risks, ID = ThisItem.ID), {Status: {Value: "Mitigation In Progress"}});
                                                            Select(btnApLoadKids);
                                                            Notify(If(gblLanguage = "Arabic", "بدأ التخفيف", "Mitigation started"), NotificationType.Success),
                                                            Notify(If(gblLanguage = "Arabic", "تعذر التحديث", "Could not update"), NotificationType.Error)
                                                        )
                                                      Text: =If(gblLanguage = "Arabic", "تخفيف", "Mitigate")
                                                      Width: =70
                                                - btnApRiskClose:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Height: =32
                                                      OnSelect: |-
                                                        =If(
                                                            Confirm(If(gblLanguage = "Arabic", "إغلاق هذا الخطر؟", "Close this risk?")),
                                                            IfError(
                                                                Patch(Risks, LookUp(Risks, ID = ThisItem.ID), {Status: {Value: "Closed"}, ClosingDate: Today()});
                                                                Select(btnApLoadKids);
                                                                Notify(If(gblLanguage = "Arabic", "أُغلق الخطر", "Risk closed"), NotificationType.Success),
                                                                Notify(If(gblLanguage = "Arabic", "تعذر الإغلاق", "Could not close"), NotificationType.Error)
                                                            )
                                                        )
                                                      Text: =If(gblLanguage = "Arabic", "إغلاق", "Close")
                                                      Width: =70
                              - conApRiskDetail:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =fxThemeColor("Border")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Background")
                                    Height: =If(App.Width >= 1100, Parent.Height, 200)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =8
                                    PaddingTop: =8
                                    Visible: =Not(IsBlank(varSelectedRisk))
                                    Width: =If(App.Width >= 1100, Parent.Width - 348, Parent.Width)
                                  Children:
                                    - lblApRiskTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =fxThemeColor("TextPrimary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          Size: =15
                                          Text: =Coalesce(varSelectedRisk.Title, "")
                                          Width: =Parent.Width
                                    - lblApRiskMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Color: =fxThemeColor("TextSecondary")
                                          Font: =gblTheme.Typography.FontFamily
                                          Height: =48
                                          Size: =12
                                          Text: |-
                                            =Coalesce(varSelectedRisk.Status.Value, "") & " · " & Coalesce(varSelectedRisk.Category.Value, "-") & " · " & Coalesce(varSelectedRisk.Level.Value, "-") & Char(10) & Coalesce(varSelectedRisk.Owner.Value, "-") & " · " & Coalesce(varSelectedRisk.Probability.Value, "-") & " / " & Coalesce(varSelectedRisk.Impact.Value, "-") & Char(10) & Coalesce(varSelectedRisk.Mitigation, "-")
                                          Width: =Parent.Width
                                    - btnApRiskEdit:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =36
                                          OnSelect: |-
                                            =Set(varEditorEntity, "Risk");
                                            Set(varEditorMode, "Edit");
                                            Set(varEditingRisk, varSelectedRisk);
                                            Set(varReturnScreen, "Projects");
                                            Set(varReturnTab, "Risks");
                                            Navigate(scrProjectEditor, ScreenTransition.Cover)
                                          Text: =If(gblLanguage = "Arabic", "تعديل", "Edit")
                                          Width: =90
                        - conApReports:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =160
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varProjectTab = "Reports"
                              Width: =Parent.Width
                            Children:
                              - lblApReports:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =48
                                    Size: =14
                                    Text: =If(gblLanguage = "Arabic", "تقارير المشروع ستُضاف لاحقاً", "Project reports are coming soon")
                                    Width: =Parent.Width
                        - conApDocs:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =480
                              LayoutDirection: =If(App.Width >= 1100, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =varProjectTab = "Documents"
                              Width: =Parent.Width
                            Children:
                              - galApFolders:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    Height: =If(App.Width >= 1100, Parent.Height, 180)
                                    Items: =colProjectManagementFolders
                                    TemplateSize: =40
                                    Width: =If(App.Width >= 1100, 240, Parent.Width)
                                  Children:
                                    - btnApFolder:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =If(varProjectDocFolder = ThisItem.FolderPath, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                                          Height: =36
                                          OnSelect: |-
                                            =Set(varProjectDocFolder, ThisItem.FolderPath);
                                            Select(btnApLoadDocs)
                                          Text: =If(gblLanguage = "Arabic", ThisItem.ArabicName, ThisItem.EnglishName)
                                          Width: =Parent.TemplateWidth
                              - conApDocList:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    Height: =If(App.Width >= 1100, Parent.Height, 280)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =If(App.Width >= 1100, Parent.Width - 248, Parent.Width)
                                  Children:
                                    - btnApDocUpload:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          Appearance: =ButtonAppearance.Primary
                                          Height: =36
                                          Icon: ="Upload"
                                          OnSelect: |-
                                            =Set(gblProjectDocumentToReplace, Blank());
                                            Set(varShowProjectDocUpload, true)
                                          Text: =If(gblLanguage = "Arabic", "رفع", "Upload")
                                          Width: =110
                                    - galApDocs:
                                        Control: Gallery@2.15.0
                                        Variant: Vertical
                                        Properties:
                                          FillPortions: =1
                                          Items: =colProjDocs
                                          TemplateSize: =44
                                          Width: =Parent.Width
                                        Children:
                                          - conApDocRow:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =Color.Transparent
                                                Height: =Parent.TemplateHeight
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =4
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Width: =Parent.TemplateWidth
                                              Children:
                                                - lblApDocName:
                                                    Control: ModernText@1.0.0
                                                    Properties:
                                                      FillPortions: =1
                                                      Height: =28
                                                      Size: =12
                                                      Text: =Coalesce(ThisItem.Name, "")
                                                      Width: =120
                                                - btnApDocOpen:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Height: =32
                                                      OnSelect: =Launch(ThisItem.'Link to item')
                                                      Text: =If(gblLanguage = "Arabic", "فتح", "Open")
                                                      Width: =60
                                                - btnApDocReplace:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Subtle
                                                      Height: =32
                                                      OnSelect: |-
                                                        =Set(gblProjectDocumentToReplace, ThisItem);
                                                        Set(varShowProjectDocUpload, true)
                                                      Text: =If(gblLanguage = "Arabic", "استبدال", "Replace")
                                                      Width: =80
                                                - btnApDocDelete:
                                                    Control: ModernButton@1.0.0
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Subtle
                                                      BasePaletteColor: =fxThemeColor("Danger")
                                                      Height: =32
                                                      OnSelect: |-
                                                        =If(
                                                            IsBlank(ThisItem.'Full Path'),
                                                            Notify(If(gblLanguage = "Arabic", "تعذر تحديد المستند.", "Unable to identify the document."), NotificationType.Error),
                                                            If(
                                                                Confirm(If(gblLanguage = "Arabic", "هل أنت متأكد من حذف المستند؟", "Are you sure you want to delete this document?") & Char(10) & ThisItem.Name),
                                                                Remove(ProjectDocuments, ThisItem);
                                                                Select(btnApLoadDocs);
                                                                Notify(If(gblLanguage = "Arabic", "تم حذف المستند بنجاح.", "Document deleted successfully."), NotificationType.Success)
                                                            )
                                                        )
                                                      Text: =If(gblLanguage = "Arabic", "حذف", "Delete")
                                                      Width: =60
      - conApUpload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Background")
            Height: =Parent.Height
            Visible: =varShowProjectDocUpload
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conApUploadCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  Height: =280
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Min(480, Parent.Width - 24)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =80
                Children:
                  - lblApUploadTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =24
                        Size: =15
                        Text: =If(IsBlank(gblProjectDocumentToReplace), If(gblLanguage = "Arabic", "رفع وثيقة", "Upload a document"), If(gblLanguage = "Arabic", "استبدال وثيقة", "Replace a document"))
                        Width: =Parent.Width
                  - attApUpload:
                      Control: Attachments@2.3.0
                      Properties:
                        AddAttachmentText: =If(gblLanguage = "Arabic", "اختيار ملف", "Select a file")
                        BorderStyle: =BorderStyle.None
                        Height: =120
                        MaxAttachments: =1
                        MaxAttachmentSize: =25
                        Width: =Parent.Width
                  - conApUploadActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =40
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnApUploadCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Subtle
                              Height: =36
                              OnSelect: |-
                                =Set(gblProjectDocumentToReplace, Blank());
                                Set(varShowProjectDocUpload, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =90
                        - btnApUploadSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Primary
                              Height: =36
                              OnSelect: |-
                                =If(
                                    CountRows(attApUpload.Attachments) = 0,
                                    Notify(If(gblLanguage = "Arabic", "اختر ملفاً", "Choose a file"), NotificationType.Warning),
                                    IfError(
                                        ForAll(
                                            attApUpload.Attachments As doc,
                                            ProgramDoc.Run(
                                                varSelectedProject.ProjectCode,
                                                varProjectDocFolder,
                                                doc.Name,
                                                {file: {name: doc.Name, contentBytes: doc.Value}}
                                            )
                                        );
                                        If(Not(IsBlank(gblProjectDocumentToReplace)), Remove(ProjectDocuments, gblProjectDocumentToReplace));
                                        Set(gblProjectDocumentToReplace, Blank());
                                        Set(varShowProjectDocUpload, false);
                                        Select(btnApLoadDocs);
                                        Notify(If(gblLanguage = "Arabic", "تم الرفع", "Uploaded"), NotificationType.Success),
                                        Notify(If(gblLanguage = "Arabic", "تعذر الرفع", "Upload failed"), NotificationType.Error)
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                              Width: =90
