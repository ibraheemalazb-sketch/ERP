Screens:
  ScrAllProjects:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Projects");
        Set(VarProgrammodule, "Pprojects");
        If(
            Not(gblProjectsInitialized),
            If(IsBlank(varSelectedProject), UpdateContext({varShowDetails: false}));
            Set(gblProjectsInitialized, true)
        );
        If(IsBlank(varProjectTab), Set(varProjectTab, "General"));
        If(IsBlank(varProjectViewMode), Set(varProjectViewMode, "table"));
        If(IsBlank(varProjectShowFilter), Set(varProjectShowFilter, true));
        If(IsBlank(varActShowFilter), Set(varActShowFilter, true));
        If(IsBlank(varMemShowFilter), Set(varMemShowFilter, true));
        Set(varProjectDocFolder, "01_Project_Management/01_Project_Proposal");
        Set(varShowProjectDocUpload, false);
        If(
            And(varShowDetails, Not(IsBlank(varSelectedProject))),
            Set(ProjectsPan, "None"),
            Set(ProjectsPan, "Yes")
        );
        ClearCollect(
            colProjectManagementFolders,
            {EnglishName: "Project Proposal", ArabicName: "مقترح المشروع", FolderPath: "01_Project_Management/01_Project_Proposal"},
            {EnglishName: "Agreements & MoUs", ArabicName: "الاتفاقيات ومذكرات التفاهم", FolderPath: "01_Project_Management/02_Agreements_MoUs"},
            {EnglishName: "Project Amendments", ArabicName: "تعديلات المشروع", FolderPath: "01_Project_Management/03_Project_Amendments"},
            {EnglishName: "Correspondence", ArabicName: "المراسلات", FolderPath: "01_Project_Management/04_Correspondence"},
            {EnglishName: "Meeting Minutes", ArabicName: "محاضر الاجتماعات", FolderPath: "01_Project_Management/05_Meeting_Minutes"},
            {EnglishName: "Decision Records", ArabicName: "سجلات القرارات", FolderPath: "01_Project_Management/06_Decision_Records"},
            {EnglishName: "Other Project Management", ArabicName: "أخرى - إدارة المشروع", FolderPath: "01_Project_Management/07_Other_Project_Management"}
        );
        Set(varApForceReload, false);
        Select(btnApReload)
    Children:
      - conApSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnApReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Refresh(Projects);
                    Set(varUserHasAllProjects, Not(IsEmpty(Filter(colUserProjectAccess, AllProjects = true))));
                    ClearCollect(
                        colUserProjectIDs,
                        Filter(colUserProjectAccess, AllProjects = false).ProjectID
                    );
                    If(
                        Or(varApForceReload, CountRows(colProjects) = 0),
                        ClearCollect(colProjects, FirstN(SortByColumns(Projects, "StartDate", SortOrder.Descending), 500))
                    );
                    ClearCollect(colApEmployees, FirstN(Filter(Employees, Status.Value = "Active"), 500));
                    If(
                        Not(IsBlank(varSelectedProject)),
                        Set(varSelectedProject, LookUp(colProjects, ID = varSelectedProject.ID))
                    );
                    Select(btnApApply);
                    Select(btnApLoadKids)
                  Text: ="Reload"
                  Width: =1
            - btnApApply:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =ClearCollect(
                        colApFiltered,
                        Sort(
                            Filter(
                                colProjects,
                                And(
                                    Or(
                                        IsBlank(txtApSearch.Text),
                                        txtApSearch.Text in Coalesce(Title, ""),
                                        txtApSearch.Text in Coalesce(ProjectCode, "")
                                    ),
                                    Or(IsBlank(cmbApStatus.Selected.Value), Status.Value = cmbApStatus.Selected.Value),
                                    Or(IsBlank(cmbApSector.Selected.Value), Sector.Value = cmbApSector.Selected.Value),
                                    Or(IsBlank(txtApDonor.Text), txtApDonor.Text in Coalesce(Donor, "")),
                                    Or(varUserHasAllProjects, ID in colUserProjectIDs.ProjectID)
                                )
                            ),
                            StartDate,
                            SortOrder.Descending
                        )
                    )
                  Text: ="Apply"
                  Width: =1
            - btnApLoadKids:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varSelectedDoc, Blank());
                    If(
                        IsBlank(varSelectedProject),
                        Clear(colProjMembers);
                        Clear(colProjActivities);
                        Clear(colProjTasks);
                        Clear(colProjRisks);
                        Clear(colProjDocs),
                        ClearCollect(colProjMembers, Filter(ProjectMembers, Project.Id = varSelectedProject.ID));
                        ClearCollect(colProjActivities, Filter(ProjectsActivities, Project.Id = varSelectedProject.ID));
                        ClearCollect(colProjTasks, Filter(ProjectsTasks, ProjectID = varSelectedProject.ID));
                        ClearCollect(colProjRisks, Filter(Risks, ProjectID = varSelectedProject.ID));
                        Select(btnApLoadDocs)
                    )
                  Text: ="Load"
                  Width: =1
            - btnApLoadDocs:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varSelectedDoc, Blank());
                    If(
                        IsBlank(varSelectedProject),
                        Clear(colProjDocs),
                        ClearCollect(
                            colApDocsRaw,
                            Filter(
                                ProjectDocuments,
                                'Folder path' = "ProjectDocuments/" & varSelectedProject.ProjectCode & "/" & varProjectDocFolder & "/"
                            )
                        );
                        ClearCollect(colProjDocs, Filter(colApDocsRaw, Not('Is folder')))
                    )
                  Text: ="Docs"
                  Width: =1
      - conApPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =0
            PaddingBottom: =If(App.Width < 700, cmpApPhoneNav.Height, 8)
            PaddingLeft: =If(App.Width < 700, 8, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            PaddingRight: =If(App.Width < 700, 8, 12)
            PaddingTop: =cmpApTopBar.Height
            Width: =Parent.Width
          Children:
            - conApSplit:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Parent.Height - cmpApTopBar.Height - If(App.Width < 700, cmpApPhoneNav.Height, 8)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(And(varShowDetails, ProjectsPan = "Yes", App.Width > 700), LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - conApList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Fill: =If(varShowDetails, fxThemeColor("Background"), Color.Transparent)
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Visible: =ProjectsPan = "Yes"
                        Width: =If(And(varShowDetails, App.Width > 700), Parent.Width * 0.2, Parent.Width)
                      Children:
                        - conApToolbar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Surface")
                              FillPortions: =0
                              Height: |-
                                =conApToolbarRow.Height
                                + If(Coalesce(varProjectShowFilter, true), conApFilterRow.Height + Self.LayoutGap, 0)
                                + Self.PaddingTop
                                + Self.PaddingBottom
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =gblTheme.Radius.XL
                              RadiusBottomRight: =gblTheme.Radius.XL
                              RadiusTopLeft: =gblTheme.Radius.Large
                              RadiusTopRight: =gblTheme.Radius.XL
                              Width: =Parent.Width
                            Children:
                              - conApToolbarRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =Parent.Width
                                  Children:
                                    - txtApSearch:
                                        Control: ModernTextInput@1.1.2
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "البحث في المشاريع", "Search projects")
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =Appearance.Outline
                                          Fill: =fxThemeColor("SurfaceHover")
                                          FillPortions: =1
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =80
                                          OnChange: =Select(btnApApply)
                                          Placeholder: =If(gblLanguage = "Arabic", "البحث في المشاريع (الاسم أو الرمز)", "Search projects (name or code)")
                                          Size: =13
                                    - btnApFilters:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "التصفية", "Filters")
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =If(Coalesce(varProjectShowFilter, true), ButtonAppearance.Primary, ButtonAppearance.Outline)
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          Icon: ="Filter"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varProjectShowFilter, Not(Coalesce(varProjectShowFilter, true)))
                                          Text: |-
                                            =If(
                                                varShowDetails,
                                                "",
                                                If(gblLanguage = "Arabic", "تصفية", "Filters") &
                                                With(
                                                    {
                                                        n: If(Not(IsBlank(txtApDonor.Text)), 1, 0) + If(Not(IsBlank(cmbApSector.Selected.Value)), 1, 0) + If(Not(IsBlank(cmbApStatus.Selected.Value)), 1, 0)
                                                    },
                                                    If(n > 0, " (" & n & ")", "")
                                                )
                                            )
                                          Width: =If(varShowDetails, 44, 112)
                                    - btnApRefresh:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          Icon: ="ArrowClockwise"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varApForceReload, true);
                                            Select(btnApReload)
                                          Text: =""
                                          Visible: =Not(varShowDetails)
                                          Width: =40
                                    - btnApCollapse:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "إخفاء التفاصيل", "Hide details")
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: =ButtonAppearance.Subtle
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          Icon: ="ArrowLeft"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =UpdateContext({varShowDetails: false});
                                            Set(ProjectsPan, "Yes")
                                          Text: =""
                                          Visible: =varShowDetails
                                          Width: =40
                                    - btnApNew:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "مشروع جديد", "New Project")
                                          AlignInContainer: =AlignInContainer.Center
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          Icon: ="Add"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varEditorEntity, "Project");
                                            Set(varEditorMode, "New");
                                            Set(varEditingProject, Blank());
                                            Set(varReturnScreen, "Projects");
                                            Set(varReturnTab, "General");
                                            Set(varEdContinue, false);
                                            Navigate(scrProjectEditor, ScreenTransition.Cover)
                                          Text: =If(Or(App.Width < 700, varShowDetails), "", If(gblLanguage = "Arabic", "مشروع جديد", "New Project"))
                                          Visible: =Coalesce(LookUp(colUserPermissions, Module.Value = "Projects", CanViewAll), false)
                                          Width: =If(Or(App.Width < 700, varShowDetails), 44, 140)
                              - conApFilterRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =If(Or(varShowDetails, App.Width < 640), 4 * 36 + 3 * 6, 36)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =If(Or(varShowDetails, App.Width < 640), LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =6
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Visible: =Coalesce(varProjectShowFilter, true)
                                    Width: =Parent.Width
                                  Children:
                                    - txtApDonor:
                                        Control: ModernTextInput@1.1.2
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                          Appearance: =Appearance.Outline
                                          Fill: =fxThemeColor("SurfaceHover")
                                          FillPortions: =If(Or(varShowDetails, App.Width < 640), 0, 1)
                                          Height: =36
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Select(btnApApply)
                                          Placeholder: =If(gblLanguage = "Arabic", "الجهة المانحة", "Donor")
                                          Size: =12
                                          Width: =If(Or(varShowDetails, App.Width < 640), Parent.Width, 160)
                                    - cmbApSector:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                                          Appearance: =Appearance.Outline
                                          DefaultSelectedItems: =Filter(Choices(Projects.Sector), false)
                                          FillPortions: =If(Or(varShowDetails, App.Width < 640), 0, 1)
                                          Height: =36
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل القطاعات", "All Sectors")
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices(Projects.Sector)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Select(btnApApply)
                                          SelectMultiple: =false
                                          Size: =12
                                          Width: =If(Or(varShowDetails, App.Width < 640), Parent.Width, 160)
                                    - cmbApStatus:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                                          Appearance: =Appearance.Outline
                                          DefaultSelectedItems: =Filter(Choices(Projects.Status), false)
                                          FillPortions: =If(Or(varShowDetails, App.Width < 640), 0, 1)
                                          Height: =36
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الحالات", "All Statuses")
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices(Projects.Status)
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: =Select(btnApApply)
                                          SelectMultiple: =false
                                          Size: =12
                                          Width: =If(Or(varShowDetails, App.Width < 640), Parent.Width, 160)
                                    - btnApClear:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "مسح جميع عوامل التصفية", "Clear all filters")
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          Height: =36
                                          Icon: ="Dismiss"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Reset(txtApSearch);
                                            Reset(txtApDonor);
                                            Reset(cmbApSector);
                                            Reset(cmbApStatus);
                                            Select(btnApApply)
                                          Text: =If(gblLanguage = "Arabic", "مسح الكل", "Clear all")
                                          Width: =If(Or(varShowDetails, App.Width < 640), Parent.Width, 110)
                        - cmpApTable:
                            Control: CanvasComponent
                            ComponentName: cmpMyTable
                            Properties:
                              CardHeight: =188
                              EmptySubtitle: =If(gblLanguage = "Arabic", "لا توجد مشاريع تطابق معايير البحث أو التصفية الحالية.", "No projects match the current search or filters.")
                              EmptyTitle: =If(gblLanguage = "Arabic", "لا توجد مشاريع", "No Projects Found")
                              EnableHover: =true
                              EnableMenu: =false
                              FillPortions: =1
                              HeaderColumn1: =If(gblLanguage = "Arabic", "الجهة المانحة", "DONOR")
                              HeaderColumn2: =If(gblLanguage = "Arabic", "القطاع", "SECTOR")
                              HeaderProgress: =If(gblLanguage = "Arabic", "التقدم", "PROGRESS")
                              HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "STATUS")
                              HeaderSubtitle: =If(gblLanguage = "Arabic", "الرمز", "CODE")
                              HeaderTitle: =If(gblLanguage = "Arabic", "المشروع", "PROJECT")
                              HeaderHeight: =36
                              Height: =Max(280, Parent.Height - conApToolbar.Height - Parent.LayoutGap - Parent.PaddingTop - Parent.PaddingBottom)
                              Items: |-
                                =ForAll(
                                    colApFiltered As project,
                                    {
                                        RowKey: Text(project.ID),
                                        Title: Coalesce(project.Title, "-"),
                                        Subtitle: Coalesce(project.ProjectCode, "-"),
                                        Column1: Coalesce(project.Donor, "-"),
                                        Column2: Coalesce(project.Sector.Value, "-"),
                                        Column3: "",
                                        Status: Coalesce(project.Status.Value, "-"),
                                        Tone: Switch(project.Status.Value, "Active", "success", "Completed", "completed", "Planed", "info", "On Hold", "warning", "Cancelled", "danger", "muted"),
                                        Priority: "",
                                        PriorityTone: "",
                                        Person: "",
                                        WhenText: "",
                                        ProgressDone: Round(Coalesce(project.Progress, 0), 0),
                                        ProgressTotal: 100,
                                        IconName: "Box"
                                    }
                                )
                              LayoutMinHeight: =240
                              LayoutMinWidth: =0
                              OnRowSelect: |-
                                =With(
                                    {row: LookUp(colApFiltered, ID = Value(cmpApTable.SelectedItem.RowKey))},
                                    If(
                                        Not(IsBlank(row)),
                                        Set(varSelectedProject, row);
                                        UpdateContext({varShowDetails: true});
                                        Set(varProjectTab, "General");
                                        Set(varSelectedMember, Blank());
                                        Set(varSelectedActivity, Blank());
                                        Set(varSelectedTask, Blank());
                                        Set(varSelectedRisk, Blank());
                                        Set(varSelectedDoc, Blank());
                                        Set(varTaskActivityFilter, Blank());
                                        Set(ProjectsPan, "None");
                                        Select(btnApLoadKids)
                                    )
                                )
                              OnViewChange: =Set(varProjectViewMode, cmpApTable.SelectedViewMode)
                              RowHeight: =52
                              ShowAction: =false
                              ShowColumn1: =Not(varShowDetails)
                              ShowColumn2: =Not(varShowDetails)
                              ShowColumn3: =false
                              ShowHeader: =true
                              ShowId: =false
                              ShowPerson: =false
                              ShowPriority: =false
                              ShowProgress: =true
                              ShowStatus: =true
                              ShowSubtitle: =true
                              ShowViewToggle: =Not(varShowDetails)
                              ShowWhen: =false
                              TitleBold: =true
                              ViewMode: |-
                                =If(
                                    varShowDetails,
                                    "list",
                                    With(
                                        {mode: Lower(Coalesce(varProjectViewMode, "table"))},
                                        If(
                                            App.Width < 700,
                                            If(mode = "card", "card", "list"),
                                            If(Or(mode = "table", mode = "card", mode = "list"), mode, "table")
                                        )
                                    )
                                )
                              Width: =Parent.Width
                              WidthColumn1: =180
                              WidthColumn2: =140
                              WidthProgress: =150
                              WidthStatus: =110
                              WidthSubtitle: =120
                              WidthTitle: =220
                  - conApDetail:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Visible: =varShowDetails
                        Width: =If(And(ProjectsPan = "Yes", App.Width > 700), Parent.Width * 0.8, Parent.Width)
                      Children:
                        - conApTabBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderThickness: =0
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =If(Parent.Width >= 800, 48, 64)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusTopLeft: =gblTheme.Radius.XL
                              RadiusTopRight: =gblTheme.Radius.XL
                              Width: =Parent.Width
                            Children:
                              - btnApTabBack:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "إغلاق التفاصيل", "Close details")
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =36
                                    Icon: ="ArrowLeft"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =UpdateContext({varShowDetails: false});
                                      Set(ProjectsPan, "Yes")
                                    Text: =""
                                    Visible: =varShowDetails
                                    Width: =40
                              - galApTabs:
                                  Control: Gallery@2.15.0
                                  Variant: Horizontal
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "تبويبات المشروع", "Project tabs")
                                    BorderStyle: =BorderStyle.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Height: =Parent.Height
                                    Items: |-
                                      =Table(
                                          {ID: "General", Label: If(gblLanguage = "Arabic", "عام", "General"), Icon: "Home"},
                                          {ID: "Members", Label: If(gblLanguage = "Arabic", "الأعضاء", "Members"), Icon: "People"},
                                          {ID: "Activities", Label: If(gblLanguage = "Arabic", "الأنشطة", "Activities"), Icon: "Library"},
                                          {ID: "Tasks", Label: If(gblLanguage = "Arabic", "المهام", "Tasks"), Icon: "AppsListDetail"},
                                          {ID: "Risks", Label: If(gblLanguage = "Arabic", "المخاطر", "Risks"), Icon: "Warning"},
                                          {ID: "Reports", Label: If(gblLanguage = "Arabic", "التقارير", "Reports"), Icon: "DocumentArrowUp"},
                                          {ID: "Documents", Label: If(gblLanguage = "Arabic", "الوثائق", "Documents"), Icon: "Folder"}
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TemplatePadding: =0
