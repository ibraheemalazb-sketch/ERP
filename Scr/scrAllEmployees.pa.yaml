                  - attEmployeeDoc:
                      Control: Attachments@2.3.0
                      Properties:
                        AddAttachmentText: =If(gblLanguage = "Arabic", "اختيار ملف", "Select a file")
                        BorderStyle: =BorderStyle.None
                        Height: =120
                        MaxAttachments: =1
                        Width: =Parent.Width
                  - conEmpUploadActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnEmpUploadCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Appearance: =ButtonAppearance.Secondary
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Reset(attEmployeeDoc);
                                Set(VarHRDocUpload, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =100
                        - btnEmpUpload:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "رفع", "Upload")
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="ArrowUpload"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    IsBlank(gblSelectedEmployee),
                                    Notify(If(gblLanguage = "Arabic", "اختر موظفاً أولاً.", "Select an employee first."), NotificationType.Error),
                                    IsEmpty(attEmployeeDoc.Attachments),
                                    Notify(If(gblLanguage = "Arabic", "اختر ملفاً أولاً.", "Select a file first."), NotificationType.Error),
                                    With(
                                        {
                                            folder: Switch(
                                                VarHRDocType,
                                                "Job Application", "Recruitment",
                                                "CV", "Recruitment",
                                                "Cover Letter", "Recruitment",
                                                "References", "Recruitment",
                                                "Job Description", "Recruitment",
                                                "Job Advertisement", "Recruitment",
                                                "Shortlist", "Recruitment",
                                                "Tests", "Recruitment",
                                                "Interview", "Recruitment",
                                                "Job Offer", "Employment",
                                                "Employment Contract", "Employment",
                                                "Code of Conduct", "Employment",
                                                "Conflict of Interest", "Employment",
                                                "Academic Certificate", "Qualifications",
                                                "Professional Certificate", "Qualifications",
                                                "Training Certificate", "Training",
                                                "Performance Appraisal", "Performance",
                                                "Performance Review", "Performance",
                                                "Performance Improvement Plan", "Performance",
                                                "Recognition & Awards", "Performance",
                                                "Other Performance Documents", "Performance",
                                                "Other HR Document", "Other",
                                                Blank()
                                            )
                                        },
                                        If(
                                            IsBlank(folder),
                                            Notify(If(gblLanguage = "Arabic", "نوع المستند غير معروف.", "Select a valid document type."), NotificationType.Error),
                                            UploadHRDoc.Run(
                                                Text(gblSelectedEmployee.ID),
                                                gblSelectedEmployee.EmployeeFolderPath,
                                                gblSelectedEmployee.EmployeeNumber,
                                                folder,
                                                VarHRDocType,
                                                Text(gblSelectedEmployee.Project.Id),
                                                gblSelectedEmployee.FullName,
                                                {
                                                    file: {
                                                        name: First(attEmployeeDoc.Attachments).Name,
                                                        contentBytes: First(attEmployeeDoc.Attachments).Value
                                                    }
                                                }
                                            );
                                            Reset(attEmployeeDoc);
                                            Notify(If(gblLanguage = "Arabic", "تم رفع الملف.", "File uploaded."), NotificationType.Success);
                                            Set(VarHRDocUpload, false);
                                            Refresh(HumanResourcesDoc);
                                            ClearCollect(colEmployeeDocs, Filter(HumanResourcesDoc, EmployeeNumber = gblSelectedEmployee.EmployeeNumber))
                                        )
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "رفع", "Upload")
                              Width: =110
