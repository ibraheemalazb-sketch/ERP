Screens:
  scrAllEmployees:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =Set(gblSelectedEmployee, Blank());
        Set(VarNewEmployee, false);
        Set(VarHRDocUpload, false);
        Set(VarEmployeeDoc, false);
        If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        If(IsBlank(varEmployeeViewMode), Set(varEmployeeViewMode, "table"));
        Set(VarEmpFilter, false);
        Set(varEmployeeQuickFilter, "All");
        Set(gblSelectedModule, "HR");
        Set(varNavSelectedID, 12);
        Set(
            gblSProject,
            If(
                varUserHasAllProjects,
                Blank(),
                First(SortByColumns(colUserAccessibleProjects, "ID", SortOrder.Ascending))
            )
        );
        Clear(colAllEmployees);
        If(
            varHRScope = "Own",
            Collect(colAllEmployees, Filter(Employees, ID = gblUser.ID)),
            If(
                varUserHasAllProjects,
                Collect(colAllEmployees, Employees),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colAllEmployees, Filter(Employees, ProjectID = proj.ID))
                )
            )
        );
        If(
            And(varHRScope <> "Own", IsEmpty(colAllEmployees), !IsBlank(gblSProject.ID)),
            Collect(colAllEmployees, Filter(Employees, ProjectID = gblSProject.ID))
        );
        Clear(colEmployeeDocs);
        Reset(cmpEmpTable)
    Children:
      - conEmpWorkspace:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 56 - If(App.Width < 700, 52, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =8
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            Y: =56
          Children:
            - conEmpHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - icoEmpHeader:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Height: =28
                        Icon: ="People"
                        IconColor: =fxThemeColor("Primary")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =28
                  - lblEmpTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =16
                        Text: =If(gblLanguage = "Arabic", "جميع الموظفين", "All Employees")
                        Width: =If(App.Width < 700, 160, 220)
                  - lblEmpCount:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextMuted")
                        Font: =Font.'Segoe UI'
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: |-
                          =CountRows(
                              Filter(
                                  colAllEmployees,
                                  Or(IsBlank(cmbEmployeeFilter.Selected), ID = cmbEmployeeFilter.Selected.ID),
                                  Or(IsBlank(cmbProjectFilter.Selected), ProjectID = cmbProjectFilter.Selected.ID),
                                  Or(IsBlank(cmbDepartmentFilter.Selected), Department.Value = cmbDepartmentFilter.Selected.Value),
                                  Or(IsBlank(cmbOfficeFilter.Selected), Office.Value = cmbOfficeFilter.Selected.Value),
                                  Or(IsBlank(cmbRoleFilter.Selected), Role.Value = cmbRoleFilter.Selected.Value),
                                  Or(
                                      Or(varEmployeeQuickFilter = "All", IsBlank(varEmployeeQuickFilter)),
                                      And(varEmployeeQuickFilter = "Active", Status.Value = "Active"),
                                      And(varEmployeeQuickFilter = "On Leave", Status.Value = "On Leave"),
                                      And(varEmployeeQuickFilter = "Inactive", Status.Value = "Inactive")
                                  )
                              )
                          ) & If(gblLanguage = "Arabic", " موظف", " employees")
                        Visible: =App.Width >= 700
                        Width: =120
                  - btnEmpNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "موظف جديد", "New employee")
                        Align: =Align.Center
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="PersonAdd"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(gblSelectedEmployee, Blank());
                          Set(gblEmployeeMode, "Add");
                          Set(varEmployeeMode, "Add");
                          Set(gblCanEditEmployee, true);
                          Set(VarNewEmployee, true);
                          Set(VarEmployeeDoc, false)
                        Text: =If(gblLanguage = "Arabic", "موظف جديد", "New Employee")
                        Visible: =And(App.Width >= 700, LookUp(colUserPermissions, Module.Value = "HR").Scope.Value = "All")
                        Width: =160
            - conEmpFilters:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: |-
                    =56 + If(
                        VarEmpFilter,
                        6 + If(App.Width < 700, 204, If(App.Width < 1200, 86, 40)),
                        0
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Width: =Parent.Width
                Children:
                  - conEmpFilterActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - galEmpQuick:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "حالة الموظف", "Employee status")
                              BorderStyle: =BorderStyle.None
                              Fill: =Color.Transparent
                              Height: =36
                              Items: |-
                                =Table(
                                    {K: "All", L: If(gblLanguage = "Arabic", "الكل", "All")},
                                    {K: "Active", L: If(gblLanguage = "Arabic", "نشط", "Active")},
                                    {K: "On Leave", L: If(gblLanguage = "Arabic", "إجازة", "On Leave")},
                                    {K: "Inactive", L: If(gblLanguage = "Arabic", "غير نشط", "Inactive")}
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =6
                              TemplateSize: =104
                              Width: =Parent.Width - If(App.Width < 700, 158, 314)
                            Children:
                              - btnEmpQuickChip:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =If(Or(varEmployeeQuickFilter = ThisItem.K, And(ThisItem.K = "All", IsBlank(varEmployeeQuickFilter))), ButtonAppearance.Primary, ButtonAppearance.Subtle)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Font: =Font.'Segoe UI'
                                    Height: =32
                                    OnSelect: |-
                                      =Set(varEmployeeQuickFilter, ThisItem.K);
                                      Set(varEmployeePageNumber, 1)
                                    Text: =ThisItem.L
                                    Width: =Parent.TemplateWidth - 6
                        - btnEmpFilter:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إظهار التصفية أو إخفاؤها", "Show or hide filters")
                              Appearance: |-
                                =If(
                                    Or(
                                        VarEmpFilter,
                                        !IsBlank(cmbEmployeeFilter.Selected),
                                        !IsBlank(cmbProjectFilter.Selected),
                                        !IsBlank(cmbDepartmentFilter.Selected),
                                        !IsBlank(cmbOfficeFilter.Selected),
                                        !IsBlank(cmbRoleFilter.Selected)
                                    ),
                                    ButtonAppearance.Primary,
                                    ButtonAppearance.Outline
                                )
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              Icon: ="Filter"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(VarEmpFilter, !VarEmpFilter)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                              Width: =If(App.Width < 700, 44, 104)
                        - btnEmpClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح التصفية", "Clear filters")
                              Appearance: =ButtonAppearance.Outline
                              Font: =Font.'Segoe UI'
                              Icon: ="DismissCircle"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Reset(cmbEmployeeFilter);
                                Reset(cmbDepartmentFilter);
                                Reset(cmbOfficeFilter);
                                Reset(cmbRoleFilter);
                                If(
                                    varUserHasAllProjects,
                                    Reset(cmbProjectFilter);
                                    Set(gblSProject, Blank())
                                );
                                Set(gblSelectedEmployee, Blank());
                                Set(varEmployeeQuickFilter, "All");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "مسح", "Clear"))
                              Width: =If(App.Width < 700, 44, 88)
                        - btnEmpRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Appearance: =ButtonAppearance.Outline
                              Font: =Font.'Segoe UI'
                              Icon: ="ArrowSync"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Refresh(Employees);
                                Clear(colAllEmployees);
                                If(
                                    varHRScope = "Own",
                                    Collect(colAllEmployees, Filter(Employees, ID = gblUser.ID)),
                                    If(
                                        varUserHasAllProjects,
                                        Collect(colAllEmployees, Employees),
                                        ForAll(
                                            colUserAccessibleProjects As proj,
                                            Collect(colAllEmployees, Filter(Employees, ProjectID = proj.ID))
                                        )
                                    )
                                );
                                If(
                                    And(varHRScope <> "Own", IsEmpty(colAllEmployees), !IsBlank(gblSProject.ID)),
                                    Collect(colAllEmployees, Filter(Employees, ProjectID = gblSProject.ID))
                                );
                                Set(varEmployeePageNumber, 1)
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تحديث", "Refresh"))
                              Width: =If(App.Width < 700, 44, 96)
                  - conEmpFilterRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 204, If(App.Width < 1200, 86, 40))
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =And(App.Width >= 700, App.Width < 1200)
                        Visible: =VarEmpFilter
                        Width: =Parent.Width
                      Children:
                        - cmbEmployeeFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                              AlignInContainer: =AlignInContainer.Center
                              FillPortions: =If(App.Width >= 1200, 2, 0)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                              ItemDisplayText: =ThisItem.FullName
                              Items: =colAllEmployees
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =Set(varEmployeePageNumber, 1);
                                Set(gblSelectedEmployee, Self.Selected)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, If(App.Width < 1200, (Parent.Width - 12) / 3, 160))
                        - cmbProjectFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              DefaultSelectedItems: =If(Or(varUserHasAllProjects, IsBlank(gblSProject)), Blank(), [gblSProject])
                              FillPortions: =If(App.Width >= 1200, 1, 0)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =If(varUserHasAllProjects, Projects, colUserAccessibleProjects)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =If(
                                    And(!varUserHasAllProjects, IsBlank(Self.Selected)),
                                    Reset(cmbProjectFilter)
                                );
                                Set(gblSProject, Self.Selected);
                                Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, If(App.Width < 1200, (Parent.Width - 12) / 3, 120))
                        - cmbDepartmentFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "القسم", "Department")
                              FillPortions: =If(App.Width >= 1200, 1, 0)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "القسم", "Department")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Department)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, If(App.Width < 1200, (Parent.Width - 12) / 3, 120))
                        - cmbOfficeFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المكتب", "Office")
                              FillPortions: =If(App.Width >= 1200, 1, 0)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المكتب", "Office")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Office)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, If(App.Width < 1200, (Parent.Width - 12) / 3, 120))
                        - cmbRoleFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الوظيفة", "Role")
                              FillPortions: =If(App.Width >= 1200, 1, 0)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الوظيفة", "Role")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Role)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, If(App.Width < 1200, (Parent.Width - 12) / 3, 120))
            - cmpEmpTable:
                Control: CanvasComponent
                ComponentName: cmpMyTable
                Properties:
                  CardHeight: =236
                  ContextMenuItems: |-
                    =Table(
                        {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض", "View"), ItemVisible: true},
                        {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: true},
                        {ItemKey: "delete", ItemDisplayName: If(gblLanguage = "Arabic", "حذف", "Delete"), ItemVisible: Coalesce(LookUp(colUserPermissions, Module.Value = "HR").CanDelete, false)}
                    )
                  EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب تصفية أو حالة مختلفة.", "Try a different filter or status.")
                  EmptyTitle: =If(gblLanguage = "Arabic", "لا يوجد موظفون", "No employees")
                  EnableHover: =true
                  EnableMenu: =true
                  FillPortions: =1
                  HeaderAction: =""
                  HeaderColumn1: =If(gblLanguage = "Arabic", "القسم", "DEPARTMENT")
                  HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "PROJECT")
                  HeaderColumn3: =If(gblLanguage = "Arabic", "الوظيفة", "ROLE")
                  HeaderHeight: =40
                  HeaderId: =If(gblLanguage = "Arabic", "الرقم", "NO.")
                  HeaderPerson: =""
                  HeaderPriority: =If(gblLanguage = "Arabic", "العقد", "CONTRACT")
                  HeaderProgress: =""
                  HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "STATUS")
                  HeaderSubtitle: =If(gblLanguage = "Arabic", "البريد", "EMAIL")
                  HeaderTitle: =If(gblLanguage = "Arabic", "الموظف", "EMPLOYEE")
                  HeaderWhen: =If(gblLanguage = "Arabic", "التعيين", "HIRED")
                  Height: |-
                    =Max(
                        320,
                        Parent.Height - If(
                            VarEmpFilter,
                            If(App.Width < 700, 346, If(App.Width < 1200, 228, 182)),
                            136
                        )
                    )
                  Items: |-
                    =ForAll(
                        SortByColumns(
                            Filter(
                                colAllEmployees,
                                Or(IsBlank(cmbEmployeeFilter.Selected), ID = cmbEmployeeFilter.Selected.ID),
                                Or(IsBlank(cmbProjectFilter.Selected), ProjectID = cmbProjectFilter.Selected.ID),
                                Or(IsBlank(cmbDepartmentFilter.Selected), Department.Value = cmbDepartmentFilter.Selected.Value),
                                Or(IsBlank(cmbOfficeFilter.Selected), Office.Value = cmbOfficeFilter.Selected.Value),
                                Or(IsBlank(cmbRoleFilter.Selected), Role.Value = cmbRoleFilter.Selected.Value),
                                Or(
                                    Or(varEmployeeQuickFilter = "All", IsBlank(varEmployeeQuickFilter)),
                                    And(varEmployeeQuickFilter = "Active", Status.Value = "Active"),
                                    And(varEmployeeQuickFilter = "On Leave", Status.Value = "On Leave"),
                                    And(varEmployeeQuickFilter = "Inactive", Status.Value = "Inactive")
                                )
                            ),
                            "ID",
                            SortOrder.Ascending
                        ) As emp,
                        {
                            RowKey: Coalesce(emp.EmployeeNumber, Text(emp.ID)),
                            Title: Coalesce(emp.FullName, "-"),
                            Subtitle: Coalesce(emp.Email, "-"),
                            Column1: Coalesce(emp.Department.Value, "-"),
                            Column2: Coalesce(emp.Project.Value, "-"),
                            Column3: Coalesce(emp.Role.Value, "-"),
                            Status: Coalesce(emp.Status.Value, "-"),
                            Tone: Switch(emp.Status.Value, "Active", "success", "On Leave", "warning", ""),
                            Priority: If(
                                IsBlank(emp.EndDate),
                                If(gblLanguage = "Arabic", "بدون نهاية", "No end"),
                                If(
                                    emp.EndDate < Today(),
                                    If(gblLanguage = "Arabic", "منتهي", "Expired"),
                                    If(
                                        DateDiff(Today(), emp.EndDate, TimeUnit.Months) < 1,
                                        If(gblLanguage = "Arabic", "أقل من شهر", "< 1 month"),
                                        DateDiff(Today(), emp.EndDate, TimeUnit.Months) & If(gblLanguage = "Arabic", " ش", " mo")
                                    )
                                )
                            ),
                            PriorityTone: If(
                                IsBlank(emp.EndDate),
                                "",
                                If(
                                    emp.EndDate < Today(),
                                    "danger",
                                    If(DateDiff(Today(), emp.EndDate, TimeUnit.Months) <= 3, "warning", "success")
                                )
                            ),
                            Person: "",
                            WhenText: If(IsBlank(emp.HireDate), "-", Text(emp.HireDate, "mmm yyyy")),
                            ProgressDone: 0,
                            ProgressTotal: 0,
                            IconName: "User"
                        }
                    )
                  LayoutMinHeight: =280
                  LayoutMinWidth: =280
                  OnMenuItemSelect: |-
                    =With(
                        {
                            row: If(
                                IsBlank(LookUp(colAllEmployees, EmployeeNumber = cmpEmpTable.SelectedItem.RowKey)),
                                LookUp(colAllEmployees, Text(ID) = cmpEmpTable.SelectedItem.RowKey),
                                LookUp(colAllEmployees, EmployeeNumber = cmpEmpTable.SelectedItem.RowKey)
                            )
                        },
                        If(
                            IsBlank(row),
                            Notify(If(gblLanguage = "Arabic", "تعذر العثور على الموظف.", "That employee could not be found."), NotificationType.Error),
                        Switch(
                            cmpEmpTable.SelectedMenuItem.ItemKey,
                            "view",
                            Set(gblSelectedEmployee, row);
                            Set(VarNewEmployee, false);
                            Set(VarEmployeeDoc, false),
                            "edit",
                            Set(gblSelectedEmployee, row);
                            Set(gblEmployeeMode, "Edit");
                            Set(varEmployeeMode, "Edit");
                            Set(gblCanEditEmployee, true);
                            Set(VarEmployeeDoc, false);
                            Set(VarNewEmployee, true),
                            "delete",
                            If(
                                Confirm(If(gblLanguage = "Arabic", "هل تريد حذف هذا الموظف؟", "Delete this employee?")),
                                Remove(Employees, LookUp(Employees, ID = row.ID));
                                Remove(colAllEmployees, LookUp(colAllEmployees, ID = row.ID));
                                If(gblSelectedEmployee.ID = row.ID, Set(gblSelectedEmployee, Blank()));
                                Notify(If(gblLanguage = "Arabic", "تم حذف الموظف.", "Employee deleted."), NotificationType.Success)
                            )
                        )
                        )
                    )
                  OnRowSelect: |-
                    =With(
                        {
                            row: If(
                                IsBlank(LookUp(colAllEmployees, EmployeeNumber = cmpEmpTable.SelectedItem.RowKey)),
                                LookUp(colAllEmployees, Text(ID) = cmpEmpTable.SelectedItem.RowKey),
                                LookUp(colAllEmployees, EmployeeNumber = cmpEmpTable.SelectedItem.RowKey)
                            )
                        },
                        If(
                            !IsBlank(row),
                            Set(gblSelectedEmployee, row);
                            Set(VarNewEmployee, false);
                            Set(VarEmployeeDoc, false)
                        )
                    )
                  OnViewChange: =Set(varEmployeeViewMode, cmpEmpTable.SelectedViewMode)
                  PersonAsAvatar: =false
                  PlaceColumn2AfterId: =true
                  RowHeight: =52
                  ShowAction: =true
                  ShowColumn1: =true
                  ShowColumn2: =true
                  ShowColumn3: =true
                  ShowHeader: =true
                  ShowId: =true
                  ShowPerson: =false
                  ShowPriority: =true
                  ShowProgress: =false
                  ShowStatus: =true
                  ShowSubtitle: =true
                  ShowViewToggle: =true
                  ShowWhen: =true
                  SubtitleAsPill: =false
                  TitleBold: =true
                  ViewMode: |-
                    =With(
                        {mode: Lower(Coalesce(varEmployeeViewMode, ""))},
                        If(
                            App.Width < 700,
                            If(Or(mode = "card", mode = "list"), mode, "list"),
                            If(Or(mode = "table", mode = "card", mode = "list"), mode, "table")
                        )
                    )
                  Width: =Parent.Width
                  WidthAction: =48
                  WidthColumn1: =140
                  WidthColumn2: =120
                  WidthColumn3: =140
                  WidthId: =88
                  WidthPerson: =0
                  WidthPriority: =110
                  WidthProgress: =0
                  WidthStatus: =100
                  WidthSubtitle: =180
                  WidthTitle: =180
                  WidthWhen: =100
      - cmpEmpNew:
          Control: CanvasComponent
          ComponentName: cmpFloatingActionButton
          Properties:
            Color: =fxThemeColor("Primary")
            Height: =56
            Icon: ="Plus"
            Label: =If(gblLanguage = "Arabic", "موظف جديد", "New employee")
            OnSelect: |-
