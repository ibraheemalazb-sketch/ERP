                                                AccessibleLabel: =If(gblLanguage = "Arabic", "استبدال", "Replace")
                                                Appearance: =ButtonAppearance.Subtle
                                                Font: =Font.'Segoe UI'
                                                Height: =28
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: |-
                                                  =Set(gblHRDocumentToReplace, ThisItem);
                                                  Set(VarHRDocType, ThisItem.DocType.Value);
                                                  Set(VarHRDocUpload, true)
                                                Text: =If(gblLanguage = "Arabic", "استبدال", "Replace")
                                                Width: =80
                              - lblEmpDocsEmpty:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =fxThemeColor("TextMuted")
                                    Font: =Font.'Segoe UI'
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: =If(gblLanguage = "Arabic", "لا توجد مستندات في هذا القسم.", "No documents in this section yet.")
                                    Visible: =IsEmpty(galEmpDocs.AllItems)
                                    Width: =Parent.Width
      - conEmpUpload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.45)
            Height: =Parent.Height
            Visible: =VarHRDocUpload
            Width: =Parent.Width
          Children:
            - conEmpUploadCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  Height: =280
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  RadiusBottomLeft: =gblTheme.Radius.Large
                  RadiusBottomRight: =gblTheme.Radius.Large
                  RadiusTopLeft: =gblTheme.Radius.Large
                  RadiusTopRight: =gblTheme.Radius.Large
                  Width: =Min(480, Parent.Width - 32)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblEmpUploadTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =15
                        Text: =If(gblLanguage = "Arabic", "إرفاق ", "Attach ") & Coalesce(VarHRDocType, "")
                        Width: =Parent.Width
                  - attEmployeeDoc:
                      Control: Attachments@2.3.0
                      Properties:
                        AddAttachmentText: =If(gblLanguage = "Arabic", "اختيار ملف", "Select a file")
                        BorderStyle: =BorderStyle.None
                        Height: =120
                        MaxAttachments: =1
                        Width: =Parent.Width
                  - conEmpUploadActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnEmpUploadCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Appearance: =ButtonAppearance.Secondary
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Reset(attEmployeeDoc);
                                Set(VarHRDocUpload, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =100
                        - btnEmpUpload:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "رفع", "Upload")
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="ArrowUpload"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                    IsBlank(gblSelectedEmployee),
                                    Notify(If(gblLanguage = "Arabic", "اختر موظفاً أولاً.", "Select an employee first."), NotificationType.Error),
                                    IsEmpty(attEmployeeDoc.Attachments),
                                    Notify(If(gblLanguage = "Arabic", "اختر ملفاً أولاً.", "Select a file first."), NotificationType.Error),
                                    With(
                                        {
                                            folder: Switch(
                                                VarHRDocType,
                                                "Job Application", "Recruitment",
                                                "CV", "Recruitment",
                                                "Cover Letter", "Recruitment",
                                                "References", "Recruitment",
                                                "Job Description", "Recruitment",
                                                "Job Advertisement", "Recruitment",
                                                "Shortlist", "Recruitment",
                                                "Tests", "Recruitment",
                                                "Interview", "Recruitment",
                                                "Job Offer", "Employment",
                                                "Employment Contract", "Employment",
                                                "Code of Conduct", "Employment",
                                                "Conflict of Interest", "Employment",
                                                "Academic Certificate", "Qualifications",
                                                "Professional Certificate", "Qualifications",
                                                "Training Certificate", "Training",
                                                "Performance Appraisal", "Performance",
                                                "Performance Review", "Performance",
                                                "Performance Improvement Plan", "Performance",
                                                "Recognition & Awards", "Performance",
                                                "Other Performance Documents", "Performance",
                                                "Other HR Document", "Other",
                                                Blank()
                                            )
                                        },
                                        If(
                                            IsBlank(folder),
                                            Notify(If(gblLanguage = "Arabic", "نوع المستند غير معروف.", "Select a valid document type."), NotificationType.Error),
                                            UploadHRDoc.Run(
                                                Text(gblSelectedEmployee.ID),
                                                gblSelectedEmployee.EmployeeFolderPath,
                                                gblSelectedEmployee.EmployeeNumber,
                                                folder,
                                                VarHRDocType,
                                                Text(gblSelectedEmployee.Project.Id),
                                                gblSelectedEmployee.FullName,
                                                {
                                                    file: {
                                                        name: First(attEmployeeDoc.Attachments).Name,
                                                        contentBytes: First(attEmployeeDoc.Attachments).Value
                                                    }
                                                }
                                            );
                                            Reset(attEmployeeDoc);
                                            Notify(If(gblLanguage = "Arabic", "تم رفع الملف.", "File uploaded."), NotificationType.Success);
                                            Set(VarHRDocUpload, false);
                                            Refresh(HumanResourcesDoc);
                                            ClearCollect(colEmployeeDocs, Filter(HumanResourcesDoc, EmployeeNumber = gblSelectedEmployee.EmployeeNumber))
                                        )
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "رفع", "Upload")
                              Width: =110
      - conEmpNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
