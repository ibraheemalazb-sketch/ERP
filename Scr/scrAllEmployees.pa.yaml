                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Refresh(HumanResourcesDoc);
                                            ClearCollect(colEmployeeDocs, Filter(HumanResourcesDoc, EmployeeNumber = gblSelectedEmployee.EmployeeNumber))
                                          Text: =""
                                          Width: =32
                                    - btnEmpFolder:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "فتح المجلد", "Open folder")
                                          Appearance: =ButtonAppearance.Subtle
                                          Font: =Font.'Segoe UI'
                                          Height: =28
                                          Icon: ="Folder"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
