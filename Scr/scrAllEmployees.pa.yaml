                                    Color: =fxThemeColor("TextMuted")
                                    Font: =Font.'Segoe UI'
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Size: =12
                                    Text: =If(gblLanguage = "Arabic", "لا توجد مستندات في هذا القسم.", "No documents in this section yet.")
                                    Visible: =IsEmpty(galEmpDocs.AllItems)
                                    Width: =Parent.Width
      - conEmpUpload:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.45)
            Height: =Parent.Height
            Visible: =VarHRDocUpload
            Width: =Parent.Width
          Children:
            - conEmpUploadCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  Height: =280
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
