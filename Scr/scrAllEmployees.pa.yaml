                                                    "CV", "السيرة الذاتية",
                                                    "Cover Letter", "خطاب التغطية",
                                                    "Job Advertisement", "إعلان الوظيفة",
                                                    "Shortlist", "القائمة المختصرة",
                                                    "Tests", "الاختبارات",
                                                    "References", "المراجع",
                                                    "Interview", "المقابلة",
                                                    "Job Offer", "عرض العمل",
                                                    "Employment Contract", "عقد العمل",
                                                    "Code of Conduct", "مدونة السلوك",
                                                    "Conflict of Interest", "تعارض المصالح",
                                                    "Academic Certificate", "الشهادة الأكاديمية",
                                                    "Professional Certificate", "الشهادة المهنية",
                                                    "Training Certificate", "شهادة التدريب",
                                                    ThisItem.DocType
                                                ),
                                                ThisItem.DocType
                                            )
                                          Width: =Parent.Width - 100
                                    - btnEmpDocUpload:
                                        Control: ModernButton@1.0.0
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "رفع", "Upload")
                                          Appearance: =If(CountRows(Filter(colEmployeeDocs, DocType.Value = ThisItem.DocType, !'Is folder')) > 0, ButtonAppearance.Primary, ButtonAppearance.Secondary)
