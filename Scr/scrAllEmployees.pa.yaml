                                                  Set(VarHRDocType, ThisItem.DocType.Value);
                                                  Set(VarHRDocUpload, true)
                                                Text: =If(gblLanguage = "Arabic", "استبدال", "Replace")
                                                Width: =80
                              - lblEmpDocsEmpty:
                                  Control: Label@2.5.1
