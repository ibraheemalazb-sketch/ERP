                                    BorderStyle: =BorderStyle.None
                                    Fill: =Color.Transparent
                                    Items: |-
                                      =SortByColumns(
                                          Filter(
                                              colEmployeeDocs,
                                              !'Is folder',
                                              DocType.Value in Filter(colHRDocTypes, Section = VarHRSection).DocType
                                          ),
                                          "Modified",
                                          SortOrder.Descending
                                      )
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    TemplatePadding: =4
                                    TemplateSize: =48
                                    Width: =Parent.Width
                                  Children:
                                    - conEmpDocRow:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =fxThemeColor("SurfaceHover")
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          PaddingLeft: =8
                                          PaddingRight: =6
                                          RadiusBottomLeft: =gblTheme.Radius.Small
                                          RadiusBottomRight: =gblTheme.Radius.Small
                                          RadiusTopLeft: =gblTheme.Radius.Small
                                          RadiusTopRight: =gblTheme.Radius.Small
                                          Width: =Parent.TemplateWidth
                                        Children:
