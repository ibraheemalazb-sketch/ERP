                        Items: =colHRSections
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =Set(VarHRSection, Self.Selected.Section)
                        Width: =Parent.Width
                  - conEmpDocBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 640, 420)
