                  RadiusBottomRight: =gblTheme.Radius.Large
                  RadiusTopLeft: =gblTheme.Radius.Large
                  RadiusTopRight: =gblTheme.Radius.Large
                  Width: =Min(480, Parent.Width - 32)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - lblEmpUploadTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =15
                        Text: =If(gblLanguage = "Arabic", "إرفاق ", "Attach ") & Coalesce(VarHRDocType, "")
