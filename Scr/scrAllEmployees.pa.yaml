                  "Performance", Notify(If(gblLanguage = "Arabic", "إدارة الأداء ستكون متاحة قريباً.", "Performance is coming soon."), NotificationType.Information),
                  "Training", Notify(If(gblLanguage = "Arabic", "إدارة التدريب ستكون متاحة قريباً.", "Training is coming soon."), NotificationType.Information),
                  "Recruitment", Notify(If(gblLanguage = "Arabic", "التوظيف سيكون متاحاً قريباً.", "Recruitment is coming soon."), NotificationType.Information)
