Screens:
  scrAllEmployees:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =Set(gblSelectedEmployee, Blank());
        Set(VarNewEmployee, false);
        Set(VarHRDocUpload, false);
        Set(VarEmployeeDoc, false);
        If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        If(IsBlank(varEmployeeViewMode), Set(varEmployeeViewMode, "Table"));
        Set(varEmployeeQuickFilter, "All");
        Set(gblSelectedModule, "HR");
        Set(varNavSelectedID, 12);
        Set(
            gblSProject,
            If(
                varUserHasAllProjects,
                Blank(),
                First(SortByColumns(colUserAccessibleProjects, "ID", SortOrder.Ascending))
            )
        );
        Clear(colAllEmployees);
        If(
            varHRScope = "Own",
            Collect(colAllEmployees, Filter(Employees, ID = gblUser.ID)),
            If(
                varUserHasAllProjects,
                Collect(colAllEmployees, Employees),
                ForAll(
                    colUserAccessibleProjects As proj,
                    Collect(colAllEmployees, Filter(Employees, ProjectID = proj.ID))
                )
            )
        );
        If(
            And(varHRScope <> "Own", IsEmpty(colAllEmployees), !IsBlank(gblSProject.ID)),
            Collect(colAllEmployees, Filter(Employees, ProjectID = gblSProject.ID))
        );
        Clear(colEmployeeDocs)
    Children:
      - conEmpWorkspace:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 56 - If(App.Width < 700, 52, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =8
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =8
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            Y: =56
          Children:
            - conEmpHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - icoEmpHeader:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Height: =28
                        Icon: ="People"
                        IconColor: =fxThemeColor("Primary")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =28
                  - lblEmpTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =16
                        Text: =If(gblLanguage = "Arabic", "جميع الموظفين", "All Employees")
                        Width: =If(App.Width < 700, Parent.Width - 250, 220)
                  - lblEmpCount:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextMuted")
                        Font: =Font.'Segoe UI'
                        Height: =28
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: |-
                          =CountRows(
                              Filter(
                                  colAllEmployees,
                                  Or(IsBlank(cmbEmployeeFilter.Selected), ID = cmbEmployeeFilter.Selected.ID),
                                  Or(IsBlank(cmbProjectFilter.Selected), ProjectID = cmbProjectFilter.Selected.ID),
                                  Or(IsBlank(cmbDepartmentFilter.Selected), Department.Value = cmbDepartmentFilter.Selected.Value),
                                  Or(IsBlank(cmbOfficeFilter.Selected), Office.Value = cmbOfficeFilter.Selected.Value),
                                  Or(IsBlank(cmbRoleFilter.Selected), Role.Value = cmbRoleFilter.Selected.Value),
                                  Or(
                                      Or(varEmployeeQuickFilter = "All", IsBlank(varEmployeeQuickFilter)),
                                      And(varEmployeeQuickFilter = "Active", Status.Value = "Active"),
                                      And(varEmployeeQuickFilter = "On Leave", Status.Value = "On Leave"),
                                      And(varEmployeeQuickFilter = "Inactive", Status.Value = "Inactive")
                                  )
                              )
                          ) & If(gblLanguage = "Arabic", " موظف", " employees")
                        Visible: =App.Width >= 700
                        Width: =120
                  - btnEmpNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "موظف جديد", "New employee")
                        Align: =Align.Center
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="PersonAdd"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(gblSelectedEmployee, Blank());
                          Set(gblEmployeeMode, "Add");
                          Set(varEmployeeMode, "Add");
                          Set(gblCanEditEmployee, true);
                          Set(VarNewEmployee, true);
                          Set(VarEmployeeDoc, false)
                        Text: =If(gblLanguage = "Arabic", "موظف جديد", "New Employee")
                        Visible: =LookUp(colUserPermissions, Module.Value = "HR").Scope.Value = "All"
                        Width: =If(App.Width < 700, 150, 160)
            - conEmpFilters:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 292, 108)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Width: =Parent.Width
                Children:
                  - conEmpFilterRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 210, 40)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - cmbEmployeeFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                              AlignInContainer: =AlignInContainer.Center
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                              ItemDisplayText: =ThisItem.FullName
                              Items: =colAllEmployees
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =Set(varEmployeePageNumber, 1);
                                Set(gblSelectedEmployee, Self.Selected)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.22)
                        - cmbProjectFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              DefaultSelectedItems: =If(Or(varUserHasAllProjects, IsBlank(gblSProject)), Blank(), [gblSProject])
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              ItemDisplayText: =ThisItem.ProjectCode
                              Items: =If(varUserHasAllProjects, Projects, colUserAccessibleProjects)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: |-
                                =If(
                                    And(!varUserHasAllProjects, IsBlank(Self.Selected)),
                                    Reset(cmbProjectFilter)
                                );
                                Set(gblSProject, Self.Selected);
                                Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.16)
                        - cmbDepartmentFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "القسم", "Department")
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "القسم", "Department")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Department)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.16)
                        - cmbOfficeFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المكتب", "Office")
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المكتب", "Office")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Office)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.14)
                        - cmbRoleFilter:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الوظيفة", "Role")
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الوظيفة", "Role")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Role)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varEmployeePageNumber, 1)
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.16)
                        - conEmpViewToggle:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("SurfaceHover")
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =2
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =gblTheme.Radius.Small
                              RadiusBottomRight: =gblTheme.Radius.Small
                              RadiusTopLeft: =gblTheme.Radius.Small
                              RadiusTopRight: =gblTheme.Radius.Small
                              Visible: =App.Width >= 700
                              Width: =150
                            Children:
                              - btnEmpViewTable:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "جدول", "Table")
                                    Appearance: =If(varEmployeeViewMode = "Table", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Font: =Font.'Segoe UI'
                                    Icon: ="Table"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varEmployeeViewMode, "Table")
                                    Text: =If(gblLanguage = "Arabic", "جدول", "Table")
                                    Width: =72
                              - btnEmpViewCard:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بطاقة", "Card")
                                    Appearance: =If(varEmployeeViewMode = "Card", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Font: =Font.'Segoe UI'
                                    Icon: ="Grid"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varEmployeeViewMode, "Card")
                                    Text: =If(gblLanguage = "Arabic", "بطاقة", "Card")
                                    Width: =72
                  - conEmpFilterActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnEmpQuickAll:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varEmployeeQuickFilter = "All", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varEmployeeQuickFilter, "All");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(gblLanguage = "Arabic", "الكل", "All")
                              Width: =72
                        - btnEmpQuickActive:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varEmployeeQuickFilter = "Active", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varEmployeeQuickFilter, "Active");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(gblLanguage = "Arabic", "نشط", "Active")
                              Width: =80
                        - btnEmpQuickLeave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varEmployeeQuickFilter = "On Leave", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varEmployeeQuickFilter, "On Leave");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(gblLanguage = "Arabic", "إجازة", "On Leave")
                              Width: =88
                        - btnEmpQuickInactive:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(varEmployeeQuickFilter = "Inactive", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varEmployeeQuickFilter, "Inactive");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(gblLanguage = "Arabic", "غير نشط", "Inactive")
                              Width: =88
                        - btnEmpClear:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح التصفية", "Clear filters")
                              Appearance: =ButtonAppearance.Outline
                              Font: =Font.'Segoe UI'
                              Icon: ="DismissCircle"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Reset(cmbEmployeeFilter);
                                Reset(cmbDepartmentFilter);
                                Reset(cmbOfficeFilter);
                                Reset(cmbRoleFilter);
                                If(
                                    varUserHasAllProjects,
                                    Reset(cmbProjectFilter);
                                    Set(gblSProject, Blank())
                                );
                                Set(gblSelectedEmployee, Blank());
                                Set(varEmployeeQuickFilter, "All");
                                Set(varEmployeePageNumber, 1)
                              Text: =If(App.Width < 700, "",If(gblLanguage = "Arabic", "مسح", "Clear"))
                              Width: =If(App.Width < 700, 44, 88)
                        - btnEmpRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Appearance: =ButtonAppearance.Outline
                              Font: =Font.'Segoe UI'
                              Icon: ="ArrowSync"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Refresh(Employees);
                                Clear(colAllEmployees);
                                If(
                                    varHRScope = "Own",
                                    Collect(colAllEmployees, Filter(Employees, ID = gblUser.ID)),
                                    If(
                                        varUserHasAllProjects,
                                        Collect(colAllEmployees, Employees),
                                        ForAll(
                                            colUserAccessibleProjects As proj,
                                            Collect(colAllEmployees, Filter(Employees, ProjectID = proj.ID))
                                        )
                                    )
                                );
                                If(
                                    And(varHRScope <> "Own", IsEmpty(colAllEmployees), !IsBlank(gblSProject.ID)),
                                    Collect(colAllEmployees, Filter(Employees, ProjectID = gblSProject.ID))
                                );
                                Set(varEmployeePageNumber, 1)
                              Text: =If(App.Width < 700, "",If(gblLanguage = "Arabic", "تحديث", "Refresh"))
                              Width: =If(App.Width < 700, 44, 96)
                        - btnEmpClear_1:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح التصفية", "Clear filters")
                              Appearance: =If(VarEmpFilter, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              Font: =Font.'Segoe UI'
                              Icon: ="Filter"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(VarEmpFilter,Not(VarEmpFilter))
                              Text: =If(App.Width < 700, "",If(gblLanguage = "Arabic", "تصفية", "Filter"))
                              Width: =If(App.Width < 700, 44, 88)
            - conEmpTable:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Visible: =And(varEmployeeViewMode <> "Card", App.Width >= 700)
                  Width: =Parent.Width
                Children:
                  - conEmpTableHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("SurfaceHover")
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        Width: =Parent.Width
                      Children:
                        - lblEmpHeadName:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "الموظف", "EMPLOYEE")
                              Width: =Parent.Width * 0.18
                        - lblEmpHeadProject:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "المشروع", "PROJECT")
                              Visible: =App.Width >= 1024
                              Width: =Parent.Width * 0.06
                        - lblEmpHeadHire:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "التعيين", "HIRED")
                              Visible: =App.Width >= 1024
                              Width: =Parent.Width * 0.08
                        - lblEmpHeadDept:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "القسم", "DEPARTMENT")
                              Width: =Parent.Width * 0.12
                        - lblEmpHeadRole:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "الوظيفة", "ROLE")
                              Width: =Parent.Width * 0.12
                        - lblEmpHeadOffice:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "المكتب", "OFFICE")
                              Visible: =App.Width >= 1024
                              Width: =Parent.Width * 0.1
                        - lblEmpHeadStatus:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "الحالة", "STATUS")
                              Width: =88
                        - lblEmpHeadContract:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "نهاية العقد", "CONTRACT")
                              Visible: =App.Width >= 1024
                              Width: =Parent.Width * 0.08
                        - lblEmpHeadService:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextMuted")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "الخدمة", "SERVICE")
                              Visible: =App.Width >= 1024
                              Width: =Parent.Width * 0.06
                        - lblEmpHeadActions:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("TextMuted")
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =10
                              Text: =If(gblLanguage = "Arabic", "إجراءات", "ACTIONS")
                              Width: =108
                  - galEmpTable:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "جدول الموظفين", "Employee table")
                        BorderStyle: =BorderStyle.None
                        Fill: =Color.Transparent
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  colAllEmployees,
                                  Or(IsBlank(cmbEmployeeFilter.Selected), ID = cmbEmployeeFilter.Selected.ID),
                                  Or(IsBlank(cmbProjectFilter.Selected), ProjectID = cmbProjectFilter.Selected.ID),
                                  Or(IsBlank(cmbDepartmentFilter.Selected), Department.Value = cmbDepartmentFilter.Selected.Value),
                                  Or(IsBlank(cmbOfficeFilter.Selected), Office.Value = cmbOfficeFilter.Selected.Value),
                                  Or(IsBlank(cmbRoleFilter.Selected), Role.Value = cmbRoleFilter.Selected.Value),
                                  Or(
                                      Or(varEmployeeQuickFilter = "All", IsBlank(varEmployeeQuickFilter)),
                                      And(varEmployeeQuickFilter = "Active", Status.Value = "Active"),
