                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - cmbProject:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              DefaultSelectedItems: =If(Or(gblEmployeeMode = "Add", IsBlank(gblSelectedEmployee.Project)), Blank(), Filter(Projects, ID = gblSelectedEmployee.Project.Id))
                              DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                              ItemDisplayText: =ThisItem.Title
                              Items: =Projects
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                        - cmbContractType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع العقد", "Contract type")
                              DefaultSelectedItems: =If(Or(gblEmployeeMode = "Add", IsBlank(gblSelectedEmployee.ContractType)), Blank(), [gblSelectedEmployee.ContractType])
                              DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "نوع العقد", "Contract type")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.ContractType)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                        - cmbEmploymentType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع التوظيف", "Employment type")
                              DefaultSelectedItems: =If(Or(gblEmployeeMode = "Add", IsBlank(gblSelectedEmployee.EmploymentType)), Blank(), [gblSelectedEmployee.EmploymentType])
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "نوع التوظيف", "Employment type")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.EmploymentType)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                  - conEmpDateRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 210, 72)
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - dteHireDate:
                            Control: ModernDatePicker@1.0.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ التعيين", "Hire date")
                              DefaultDate: =If(gblEmployeeMode = "Add", Today(), gblSelectedEmployee.HireDate)
                              DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                        - dteEndDate:
                            Control: ModernDatePicker@1.0.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تاريخ الانتهاء", "End date")
                              DefaultDate: =If(gblEmployeeMode = "Add", Blank(), gblSelectedEmployee.EndDate)
                              DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                        - cmbEmployeeStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              DefaultSelectedItems: =If(Or(gblEmployeeMode = "Add", IsBlank(gblSelectedEmployee.Status)), Blank(), [gblSelectedEmployee.Status])
                              DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الحالة", "Status")
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(Employees.Status)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                              SelectMultiple: =false
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width / 3 - 8)
                  - txtEmployeeRemarks:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "ملاحظات", "Remarks")
                        Default: =If(gblEmployeeMode = "Add", Blank(), gblSelectedEmployee.Remarks)
                        DisplayMode: =If(gblEmployeeMode = "View", DisplayMode.View, DisplayMode.Edit)
                        Height: =80
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: =If(gblEmployeeMode = "View", Set(gblEmployeeMode, "Edit"))
                        Placeholder: =If(gblLanguage = "Arabic", "ملاحظات", "Remarks")
                        Type: =TextInputType.Multiline
                        Width: =Parent.Width
                  - conEmpFormActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnCancelEmployee:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Appearance: =ButtonAppearance.Secondary
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(VarNewEmployee, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =100
                        - btnSaveEmployee:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ الموظف", "Save employee")
                              BasePaletteColor: =fxThemeColor("Primary")
                              Font: =Font.'Segoe UI'
                              Height: =36
                              Icon: ="Save"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varEmpSaveOk, false);
                                If(
                                    Or(IsBlank(Trim(txtFirstName.Text)), IsBlank(Trim(txtLastName.Text)), IsBlank(Trim(txtEmail.Text))),
                                    Notify(If(gblLanguage = "Arabic", "الاسم الأول واسم العائلة والبريد مطلوبة.", "First name, last name, and email are required."), NotificationType.Error),
                                    If(
                                        !IsMatch(Trim(txtEmail.Text), Match.Email),
                                        Notify(If(gblLanguage = "Arabic", "أدخل بريداً صحيحاً.", "Enter a valid email address."), NotificationType.Error),
                                        If(
                                            gblEmployeeMode = "Add",
                                            Set(
                                                varSavedEmployee,
                                                IfError(
                                                    Patch(
                                                        Employees,
                                                        Defaults(Employees),
                                                        {
                                                            FirstName: Trim(txtFirstName.Text),
                                                            LastName: Trim(txtLastName.Text),
                                                            DisplayName: If(IsBlank(Trim(txtDisplayName.Text)), Trim(txtFirstName.Text) & " " & Trim(txtLastName.Text), Trim(txtDisplayName.Text)),
                                                            Email: Lower(Trim(txtEmail.Text)),
                                                            UserPrincipalName: Lower(Trim(txtEmail.Text)),
                                                            JobTitle: Trim(txtJobTitle.Text),
                                                            Phone: Trim(txtPhone.Text),
                                                            Remarks: Trim(txtEmployeeRemarks.Text),
                                                            Status: If(IsBlank(cmbEmployeeStatus.Selected.Value), Blank(), {Value: cmbEmployeeStatus.Selected.Value}),
                                                            ContractType: If(IsBlank(cmbContractType.Selected.Value), Blank(), {Value: cmbContractType.Selected.Value}),
                                                            EmploymentType: If(IsBlank(cmbEmploymentType.Selected.Value), Blank(), {Value: cmbEmploymentType.Selected.Value}),
                                                            Department: If(IsBlank(cmbDepartment.Selected.ID), Blank(), {Id: cmbDepartment.Selected.ID, Value: cmbDepartment.Selected.Title}),
                                                            Office: If(IsBlank(cmbOffice.Selected.ID), Blank(), {Id: cmbOffice.Selected.ID, Value: cmbOffice.Selected.Title}),
                                                            Manager: If(IsBlank(cmbManager.Selected.ID), Blank(), {Id: cmbManager.Selected.ID, Value: cmbManager.Selected.FullName}),
                                                            Role: If(IsBlank(cmbRole.Selected.ID), Blank(), {Id: cmbRole.Selected.ID, Value: cmbRole.Selected.Title}),
                                                            Project: If(IsBlank(cmbProject.Selected.ID), Blank(), {Id: cmbProject.Selected.ID, Value: cmbProject.Selected.Title}),
                                                            ProjectID: cmbProject.Selected.ID,
                                                            HireDate: dteHireDate.SelectedDate,
                                                            EndDate: dteEndDate.SelectedDate
                                                        }
                                                    ),
                                                    Notify(If(gblLanguage = "Arabic", "تعذر إنشاء الموظف: ", "Employee could not be created: ") & FirstError.Message, NotificationType.Error);
                                                    Blank()
                                                )
                                            );
                                            If(
                                                !IsBlank(varSavedEmployee),
                                                Patch(Employees, varSavedEmployee, {EmployeeNumber: "EP-" & Text(varSavedEmployee.ID, "000")});
                                                Notify(If(gblLanguage = "Arabic", "تمت إضافة الموظف.", "Employee added."), NotificationType.Success);
                                                Set(gblSelectedEmployee, LookUp(Employees, ID = varSavedEmployee.ID));
                                                Set(gblEmployeeMode, "Add");
                                                Set(varEmpSaveOk, true);
                                                Set(VarNewEmployee, false)
                                            ),
                                            If(
                                                gblEmployeeMode = "Edit",
                                                Set(
                                                    varUpdatedEmployee,
                                                    IfError(
                                                        Patch(
                                                            Employees,
                                                            gblSelectedEmployee,
                                                            {
                                                                FirstName: Trim(txtFirstName.Text),
                                                                LastName: Trim(txtLastName.Text),
                                                                DisplayName: If(IsBlank(Trim(txtDisplayName.Text)), Trim(txtFirstName.Text) & " " & Trim(txtLastName.Text), Trim(txtDisplayName.Text)),
                                                                Email: Lower(Trim(txtEmail.Text)),
                                                                UserPrincipalName: Lower(Trim(txtEmail.Text)),
                                                                JobTitle: Trim(txtJobTitle.Text),
                                                                Phone: Trim(txtPhone.Text),
                                                                Remarks: Trim(txtEmployeeRemarks.Text),
                                                                Status: If(IsBlank(cmbEmployeeStatus.Selected.Value), Blank(), {Value: cmbEmployeeStatus.Selected.Value}),
                                                                ContractType: If(IsBlank(cmbContractType.Selected.Value), Blank(), {Value: cmbContractType.Selected.Value}),
                                                                EmploymentType: If(IsBlank(cmbEmploymentType.Selected.Value), Blank(), {Value: cmbEmploymentType.Selected.Value}),
                                                                Department: If(IsBlank(cmbDepartment.Selected.ID), Blank(), {Id: cmbDepartment.Selected.ID, Value: cmbDepartment.Selected.Title}),
                                                                Office: If(IsBlank(cmbOffice.Selected.ID), Blank(), {Id: cmbOffice.Selected.ID, Value: cmbOffice.Selected.Title}),
                                                                Manager: If(IsBlank(cmbManager.Selected.ID), Blank(), {Id: cmbManager.Selected.ID, Value: cmbManager.Selected.FullName}),
                                                                Role: If(IsBlank(cmbRole.Selected.ID), Blank(), {Id: cmbRole.Selected.ID, Value: cmbRole.Selected.Title}),
                                                                Project: If(IsBlank(cmbProject.Selected.ID), Blank(), {Id: cmbProject.Selected.ID, Value: cmbProject.Selected.Title}),
                                                                ProjectID: cmbProject.Selected.ID,
                                                                HireDate: dteHireDate.SelectedDate,
                                                                EndDate: dteEndDate.SelectedDate,
                                                                EmployeeNumber: If(IsBlank(gblSelectedEmployee.EmployeeNumber), "EP-" & Text(gblSelectedEmployee.ID, "000"), gblSelectedEmployee.EmployeeNumber)
                                                            }
                                                        ),
                                                        Notify(If(gblLanguage = "Arabic", "تعذر تحديث الموظف: ", "Employee could not be updated: ") & FirstError.Message, NotificationType.Error);
                                                        Blank()
                                                    )
                                                );
                                                If(
                                                    !IsBlank(varUpdatedEmployee),
                                                    Notify(If(gblLanguage = "Arabic", "تم تحديث الموظف.", "Employee updated."), NotificationType.Success);
                                                    Set(gblSelectedEmployee, LookUp(Employees, ID = varUpdatedEmployee.ID));
                                                    Set(gblEmployeeMode, "Add");
                                                    Set(varEmpSaveOk, true);
                                                    Set(VarNewEmployee, false)
                                                ),
                                                Notify(If(gblLanguage = "Arabic", "النموذج ليس في وضع تعديل.", "The form is not in edit mode."), NotificationType.Error)
                                            )
                                        )
                                    )
                                );
                                If(
                                    varEmpSaveOk,
                                    Refresh(Employees);
                                    Clear(colAllEmployees);
                                    If(
                                        varHRScope = "Own",
                                        Collect(colAllEmployees, Filter(Employees, ID = gblUser.ID)),
                                        If(
                                            varUserHasAllProjects,
                                            Collect(colAllEmployees, Employees),
                                            ForAll(
                                                colUserAccessibleProjects As proj,
                                                Collect(colAllEmployees, Filter(Employees, ProjectID = proj.ID))
                                            )
                                        )
                                    )
                                )
                              Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                              Width: =120
            - conEmpDocs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =200
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
