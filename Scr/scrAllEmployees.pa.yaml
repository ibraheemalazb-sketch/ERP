            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
      - cmpEmpPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table(
                  {
                      Name: "Home",
                      SVG: ""
                  }
              )
            ItemsBtnNav: |-
              =Table(
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Leaves", Title: If(gblLanguage = "Arabic", "الإجازات", "Leaves"), Icon: "Calendar", Visible: true},
                  {ID: 30, Module: "Attendance", Title: If(gblLanguage = "Arabic", "الحضور", "Attendance"), Icon: "Clock", Visible: true},
                  {ID: 40, Module: "Performance", Title: If(gblLanguage = "Arabic", "الأداء", "Performance"), Icon: "Activity", Visible: true},
                  {ID: 50, Module: "Training", Title: If(gblLanguage = "Arabic", "التدريب", "Training"), Icon: "Graduation", Visible: true},
                  {ID: 60, Module: "Recruitment", Title: If(gblLanguage = "Arabic", "التوظيف", "Recruitment"), Icon: "UserPlus", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "HR", Navigate(ScrHR, ScreenTransition.None),
