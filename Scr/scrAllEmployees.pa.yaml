                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.34)
                            Children:
                              - conEmpDocType:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("SurfaceHover")
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =6
