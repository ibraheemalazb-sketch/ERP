                                    ItemDisplayText: =ThisItem.PRNumber
                                    Items: |-
                                      =Filter(
                                          PurchaseRequests,
                                          Or(Status.Value = "Approved", ID = varCurrentPO.PRID)
                                      )
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =If(
                                          And(varProcurementMode = "New", Not(IsBlank(Self.Selected))),
                                          Set(varSelectedPR, Self.Selected);
                                          Set(varProcProject, LookUp(colProjects, ID = Self.Selected.ProjectID));
                                          ClearCollect(
                                              colPOLines,
                                              ForAll(
                                                  Filter(PurchaseRequestLines, PRID = varSelectedPR.ID) As L,
                                                  With(
                                                      {
                                                          prev: Coalesce(
                                                              Sum(
                                                                  Filter(
                                                                      PurchaseOrderLines,
                                                                      And(
                                                                          PRLineID = L.ID,
                                                                          POID <> Coalesce(varCurrentPO.ID, 0),
                                                                          LineStatus.Value <> "Cancelled"
                                                                      )
                                                                  ),
                                                                  Quantity
                                                              ),
                                                              0
                                                          )
                                                      },
                                                      {
                                                          PRLineID: L.ID,
                                                          LineNumber: L.LineNumber,
                                                          BudgetLine: L.BudgetLine,
                                                          ItemCategory: L.ItemCategory,
                                                          Description: L.Description,
                                                          Specification: L.Specification,
                                                          Unit: L.Unit,
                                                          QtyRequested: L.Quantity,
                                                          QtyPrevOrdered: prev,
                                                          QtyRemaining: L.Quantity - prev,
                                                          Quantity: L.Quantity - prev,
                                                          PRUnitPrice: L.EstimatedUnitPrice,
                                                          UnitPrice: L.EstimatedUnitPrice,
                                                          RequiredDate: L.RequiredDate,
                                                          Remarks: L.Remarks,
                                                          WareHouseID: L.WareHouseID
                                                      }
                                                  )
                                              )
                                          );
                                          RemoveIf(colPOLines, QtyRemaining <= 0);
