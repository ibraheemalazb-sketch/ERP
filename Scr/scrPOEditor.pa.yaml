Screens:
  scrPOEditor:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "POs");
        Set(varNavSelectedID, 33);
        Set(varProcurementEntity, "PurchaseOrder");
        If(
            And(varProcurementMode = "New", IsBlank(varSelectedPR), Not(IsBlank(varSourcePR))),
            Set(varSelectedPR, varSourcePR)
        );
        If(
            varProcurementMode = "New",
            Set(varCurrentPO, Blank());
            Set(varNewPO, Blank());
            If(
                IsBlank(varSelectedPR),
                Clear(colPOLines),
                Set(varProcProject, LookUp(colProjects, ID = varSelectedPR.ProjectID));
                ClearCollect(
                    colPOLines,
                    ForAll(
                        Filter(PurchaseRequestLines, PRID = varSelectedPR.ID) As L,
                        With(
                            {
                                prev: Coalesce(
                                    Sum(
                                        Filter(
                                            PurchaseOrderLines,
                                            And(
                                                PRLineID = L.ID,
                                                POID <> Coalesce(varCurrentPO.ID, 0),
                                                LineStatus.Value <> "Cancelled"
                                            )
                                        ),
                                        Quantity
                                    ),
                                    0
                                )
                            },
                            {
                                PRLineID: L.ID,
                                LineNumber: L.LineNumber,
                                BudgetLine: L.BudgetLine,
                                ItemCategory: L.ItemCategory,
                                Description: L.Description,
                                Specification: L.Specification,
                                Unit: L.Unit,
                                QtyRequested: L.Quantity,
                                QtyPrevOrdered: prev,
                                QtyRemaining: L.Quantity - prev,
                                Quantity: L.Quantity - prev,
                                PRUnitPrice: L.EstimatedUnitPrice,
                                UnitPrice: L.EstimatedUnitPrice,
                                RequiredDate: L.RequiredDate,
                                Remarks: L.Remarks,
                                WareHouseID: L.WareHouseID
                            }
                        )
                    )
                );
                RemoveIf(colPOLines, QtyRemaining <= 0)
            );
            Reset(cmbPRSelectPO);
            Reset(cmbVendorPO);
            Reset(dteExpectedDeliveryPO);
            Reset(cmbLocationPO);
            Reset(cmbPaymentTermsPO);
            Reset(txtNotesPO),
            If(
                Not(IsBlank(varCurrentPO)),
                Set(varSelectedPR, LookUp(PurchaseRequests, ID = varCurrentPO.PRID));
                Set(varProcProject, LookUp(colProjects, ID = varCurrentPO.ProjectID));
                ClearCollect(
                    colPOLines,
                    ForAll(
                        Filter(PurchaseOrderLines, POID = varCurrentPO.ID) As P,
                        With(
                            {
                                r: LookUp(PurchaseRequestLines, ID = P.PRLineID),
                                prev: Coalesce(
                                    Sum(
                                        Filter(
                                            PurchaseOrderLines,
                                            And(
                                                PRLineID = P.PRLineID,
                                                POID <> varCurrentPO.ID,
                                                LineStatus.Value <> "Cancelled"
                                            )
                                        ),
                                        Quantity
                                    ),
                                    0
                                )
                            },
                            {
                                PRLineID: P.PRLineID,
                                LineNumber: P.LineNumber,
                                BudgetLine: r.BudgetLine,
                                ItemCategory: r.ItemCategory,
                                Description: r.Description,
                                Specification: r.Specification,
                                Unit: r.Unit,
                                QtyRequested: r.Quantity,
                                QtyPrevOrdered: prev,
                                QtyRemaining: r.Quantity - prev,
                                Quantity: Min(P.Quantity, r.Quantity - prev),
                                PRUnitPrice: r.EstimatedUnitPrice,
                                UnitPrice: Min(P.UnitPrice, r.EstimatedUnitPrice * 1.25),
                                RequiredDate: Coalesce(r.RequiredDate, P.RequiredDate),
                                Remarks: Coalesce(r.Remarks, P.Remarks),
                                WareHouseID: Coalesce(r.WareHouseID, varCurrentPO.WarehouseID)
                            }
                        )
                    )
                );
                Reset(cmbPRSelectPO);
                Reset(cmbVendorPO);
                Reset(dteExpectedDeliveryPO);
                Reset(cmbLocationPO);
                Reset(cmbPaymentTermsPO);
                Reset(txtNotesPO),
                Notify(
                    If(gblLanguage = "Arabic", "لم يتم اختيار أمر شراء. ارجع واختر أمراً.", "No purchase order selected. Please go back and choose one."),
                    NotificationType.Error
                )
            )
        );
        Set(
            varPoCanEdit,
            Or(
                varProcurementMode = "New",
                And(Not(IsBlank(varCurrentPO)), varCurrentPO.POStatus.Value = "Draft")
            )
        )
    Children:
      - conEdPoNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpEdPoNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpEdPoTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =0
            HasNotifications: =false
            Height: =56
            ModuleIcon: ="ShoppingCart"
            ModuleName: =If(gblLanguage = "Arabic", "المشتريات", "Procurement")
            OnSelectTitle: |-
              =Set(varProcurementMode, "View");
              If(
                  And(IsBlank(varCurrentPO), Not(IsBlank(varSourcePR))),
                  Set(varCurrentPR, varSourcePR);
                  Set(varProcurementEntity, "PurchaseRequest");
                  Set(varProcurementTab, "PRs");
                  Set(varNavSelectedID, 32);
                  Navigate(scrPRs, ScreenTransition.UnCover),
                  Set(varProcurementEntity, "PurchaseOrder");
                  Set(varProcurementTab, "POs");
                  Set(varNavSelectedID, 33);
                  Navigate(scrPOs, ScreenTransition.UnCover)
              )
            ScreenSubtitle: |-
              =If(
                  varProcurementMode = "New",
                  If(gblLanguage = "Arabic", "أمر جديد", "New order"),
                  Coalesce(varCurrentPO.PONumber, If(gblLanguage = "Arabic", "تعديل", "Edit"))
              )
            ScreenTitle: =If(gblLanguage = "Arabic", "محرر أمر الشراء", "Purchase order editor")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpEdPoPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conEdPoPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpEdPoPhone.Height + 16, 24)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 16)
            PaddingRight: =16
            PaddingTop: =cmpEdPoTop.Height + 12
            Width: =Parent.Width
          Children:
            - conEdPoHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 148, 64)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =64
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Parent.Width
                Children:
                  - btnEdPoBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Transparent
                        BasePaletteColor: =fxThemeColor("Primary")
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="ArrowLeft"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =Set(varProcurementMode, "View");
                          If(
                              And(IsBlank(varCurrentPO), Not(IsBlank(varSourcePR))),
                              Set(varCurrentPR, varSourcePR);
                              Set(varProcurementEntity, "PurchaseRequest");
                              Set(varProcurementTab, "PRs");
                              Set(varNavSelectedID, 32);
                              Navigate(scrPRs, ScreenTransition.UnCover),
                              Set(varProcurementEntity, "PurchaseOrder");
                              Set(varProcurementTab, "POs");
                              Set(varNavSelectedID, 33);
                              Navigate(scrPOs, ScreenTransition.UnCover)
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "الأوامر", "Orders"))
                        Width: =If(App.Width < 700, 44, 110)
                  - lblEdPoTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinWidth: =140
                        PaddingBottom: =0
                        PaddingTop: =6
                        Size: =15
                        Text: |-
                          =If(
                              varProcurementMode = "New",
                              If(gblLanguage = "Arabic", "أمر شراء جديد", "New purchase order"),
                              Coalesce(varCurrentPO.PONumber, If(gblLanguage = "Arabic", "تعديل الأمر", "Edit order"))
                          )
                        Width: =If(App.Width < 700, Parent.Width - 180, 240)
                        Wrap: =false
                  - conEdPoStatus:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("SurfaceHover")
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinWidth: =88
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =110
                      Children:
                        - lblEdPoStatus:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingBottom: =0
                              PaddingTop: =4
                              Size: =12
                              Text: =If(varProcurementMode = "New", "Draft", Coalesce(varCurrentPO.POStatus.Value, "Draft"))
                              Width: =Parent.Width
                              Wrap: =false
                  - lblEdPoGap:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Height: =8
                        LayoutMinWidth: =8
                        Text: =""
                        Visible: =App.Width >= 700
                  - btnEdPoSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Save"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              IsBlank(cmbPRSelectPO.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار طلب الشراء.", "Please select a Purchase Request."), NotificationType.Error),
                              IsBlank(cmbVendorPO.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار المورد.", "Please select a Vendor."), NotificationType.Error),
                              IsBlank(dteExpectedDeliveryPO.SelectedDate),
                              Notify(If(gblLanguage = "Arabic", "الرجاء تحديد تاريخ التسليم المتوقع.", "Please select the expected delivery date."), NotificationType.Error),
                              CountRows(Filter(colPOLines, Quantity > 0)) = 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إدخال كمية لبند واحد على الأقل.", "Please order a quantity on at least one line."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colPOLines As L,
                                      And(
                                          L.Quantity > 0,
                                          Or(
                                              L.Quantity > L.QtyRequested,
                                              L.Quantity > L.QtyRemaining,
                                              L.Quantity > Coalesce(LookUp(PurchaseRequestLines, ID = L.PRLineID, Quantity), 0)
                                          )
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "الكمية لا يجب أن تتجاوز كمية طلب الشراء المتبقية.", "Qty ordered cannot exceed the quantity on the purchase request."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colPOLines As L,
                                      And(
                                          L.Quantity > 0,
                                          Or(
                                              L.UnitPrice > L.PRUnitPrice * 1.25,
                                              L.UnitPrice > Coalesce(LookUp(PurchaseRequestLines, ID = L.PRLineID, EstimatedUnitPrice), 0) * 1.25
                                          )
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "سعر الوحدة يتجاوز السعر التقديري بأكثر من 25%.", "Unit price exceeds the PR estimated price by more than 25%."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colPOLines As L,
                                      And(
                                          L.Quantity > 0,
                                          Or(
                                              IsBlank(LookUp(PurchaseRequestLines, ID = L.PRLineID, Description)),
                                              IsBlank(LookUp(PurchaseRequestLines, ID = L.PRLineID, Unit)),
                                              IsBlank(LookUp(PurchaseRequestLines, ID = L.PRLineID, BudgetLine))
                                          )
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "بند طلب الشراء ينقصه الوصف أو الوحدة أو بند الموازنة.", "A purchase request line is missing a description, unit, or budget line."), NotificationType.Error),
                              And(IsBlank(cmbLocationPO.Selected), IsBlank(cmbPRSelectPO.Selected.Location)),
                              Notify(If(gblLanguage = "Arabic", "الرجاء تحديد موقع التسليم.", "Please select a delivery location."), NotificationType.Error),
                              IsBlank(cmbPaymentTermsPO.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار شروط الدفع.", "Please select payment terms."), NotificationType.Error),
                              IsBlank(cmbPRSelectPO.Selected.Currency),
                              Notify(If(gblLanguage = "Arabic", "طلب الشراء لا يحتوي على عملة.", "The purchase request has no currency."), NotificationType.Error),
                              IsBlank(Coalesce(gblUser.ID, gblCurrentEmployee.ID)),
                              Notify(If(gblLanguage = "Arabic", "تعذر التعرف على الموظف الحالي.", "The current employee could not be identified."), NotificationType.Error),
                              Set(varProcLogNew, varProcurementMode = "New");
                              Set(varProcAttachNames, "");
                              Set(
                                  varPoWarehouse,
                                  LookUp(
                                      Warehouses,
                                      ID = LookUp(Filter(colPOLines, Quantity > 0), Not(IsBlank(WareHouseID)), WareHouseID)
                                  )
                              );
                              Set(varPOSubtotal, Sum(Filter(colPOLines, Quantity > 0), Quantity * Min(UnitPrice, PRUnitPrice * 1.25)));
                                  Set(
                                      varNewPO,
                                      Patch(
                                          PurchaseOrders,
                                          If(varProcurementMode = "New", Defaults(PurchaseOrders), varCurrentPO),
                                          {
                                              Title: If(varProcurementMode = "New", "TEMP-PO-" & Text(Now(), "yyyymmddhhmmss"), varCurrentPO.PONumber),
                                              PONumber: If(varProcurementMode = "New", "TEMP-PO-" & Text(Now(), "yyyymmddhhmmss"), varCurrentPO.PONumber),
                                              PurchaseRequest: {Id: cmbPRSelectPO.Selected.ID, Value: cmbPRSelectPO.Selected.PRNumber},
                                              PurchaseRequestID: cmbPRSelectPO.Selected.ID,
                                              PRID: cmbPRSelectPO.Selected.ID,
                                              PRNo: cmbPRSelectPO.Selected.PRNumber,
                                              Project: {Id: cmbPRSelectPO.Selected.ProjectID, Value: LookUp(colProjects, ID = cmbPRSelectPO.Selected.ProjectID, ProjectCode)},
                                              ProjectID: cmbPRSelectPO.Selected.ProjectID,
                                          Vendors: {Id: cmbVendorPO.Selected.ID, Value: cmbVendorPO.Selected.Title},
                                          VendorID: cmbVendorPO.Selected.ID,
                                          SupplierID: cmbVendorPO.Selected.ID,
                                              ExpectedDeliveryDate: dteExpectedDeliveryPO.SelectedDate,
                                              IssueDate: If(varProcurementMode = "New", Today(), varCurrentPO.IssueDate),
                                              DeliveryLocation: If(
                                                  Not(IsBlank(cmbLocationPO.Selected)),
                                                  {Id: cmbLocationPO.Selected.ID, Value: cmbLocationPO.Selected.LocationCode},
                                                  {Id: cmbPRSelectPO.Selected.Location.Id, Value: cmbPRSelectPO.Selected.Location.Value}
                                              ),
                                              DeliveryLocationID: If(
                                                  Not(IsBlank(cmbLocationPO.Selected)),
                                                  cmbLocationPO.Selected.ID,
                                                  cmbPRSelectPO.Selected.Location.Id
                                              ),
                                              Currency: cmbPRSelectPO.Selected.Currency,
                                              PaymentTerms: cmbPaymentTermsPO.Selected,
                                              Notes: txtNotesPO.Text,
                                              Subtotal: varPOSubtotal,
                                              Discount: 0,
                                              Total: varPOSubtotal,
                                              OrderdQty: Sum(Filter(colPOLines, Quantity > 0), Quantity),
                                              PreparedBy: {
                                                  Id: Coalesce(gblUser.ID, gblCurrentEmployee.ID),
                                                  Value: Coalesce(gblUser.FullName, gblCurrentEmployee.FullName)
                                              },
                                              PreparedByID: Coalesce(gblUser.ID, gblCurrentEmployee.ID),
                                              OrderType: {Value: "PurchaseOrder"},
                                              OrderValue: "PurchaseOrder",
                                          POStatus: {Value: "Draft"},
                                          POValue: "Draft",
                                          Warehouse: If(
                                              IsBlank(varPoWarehouse),
                                              Blank(),
                                              {Id: varPoWarehouse.ID, Value: varPoWarehouse.Title}
                                          ),
                                          WarehouseID: If(IsBlank(varPoWarehouse), Blank(), varPoWarehouse.ID)
                                      }
                                      )
                                  );
                              If(
                                  varProcurementMode = "New",
                                  Set(
                                      varNewPO,
                                      Patch(
                                          PurchaseOrders,
                                          varNewPO,
                                          {
                                              Title: LookUp(colProjects, ID = varNewPO.ProjectID, ProjectCode) & "-PO-" & Text(Year(Today()), "0000") & "-" & Text(varNewPO.ID, "0"),
                                              PONumber: LookUp(colProjects, ID = varNewPO.ProjectID, ProjectCode) & "-PO-" & Text(Year(Today()), "0000") & "-" & Text(varNewPO.ID, "0")
                                          }
                                      )
                                  )
                              );
                              If(
                                  CountRows(attEdPo.Attachments) > 0,
                                  IfError(
                                      Patch(PurchaseOrders, varNewPO, {Attachments: attEdPo.Attachments});
                                      Set(varProcAttachNames, Concat(attEdPo.Attachments, Name, ", ")),
                                      Notify(If(gblLanguage = "Arabic", "تم حفظ المسودة، وتعذر إرفاق الملفات.", "The draft was saved, but the files could not be attached."), NotificationType.Warning);
                                      Set(varProcAttachNames, "")
                                  )
                              );
                              RemoveIf(PurchaseOrderLines, POID = varNewPO.ID);
                              ForAll(
                                  Filter(colPOLines, Quantity > 0) As Line,
                                  With(
                                      {src: LookUp(PurchaseRequestLines, ID = Line.PRLineID)},
                                      Patch(
                                          PurchaseOrderLines,
                                          Defaults(PurchaseOrderLines),
                                          {
                                              Title: varNewPO.PONumber & "-" & Text(src.LineNumber),
                                              PO: {Id: varNewPO.ID, Value: varNewPO.PONumber},
                                              PONo: varNewPO.PONumber,
                                              POID: varNewPO.ID,
                                              PRLine: {Id: src.ID, Value: Coalesce(src.Title, varNewPO.PRNo & "-" & Text(src.LineNumber))},
                                              PRLineID: src.ID,
                                              LineNumber: src.LineNumber,
                                              BudgetLine: {Id: src.BudgetLine.Id, Value: src.BudgetLine.Value},
                                              BudgetLineID: src.BudgetLine.Id,
                                              ItemCategory: src.ItemCategory,
                                              Description: src.Description,
                                              Specification: src.Specification,
                                              Unit: src.Unit,
                                              Quantity: Min(Line.Quantity, src.Quantity, Line.QtyRemaining),
                                              UnitPrice: Min(Line.UnitPrice, src.EstimatedUnitPrice * 1.25),
                                              Total: Min(Line.Quantity, src.Quantity, Line.QtyRemaining) * Min(Line.UnitPrice, src.EstimatedUnitPrice * 1.25),
                                              ReceivedQuantity: 0,
                                              RemainingQuantity: Min(Line.Quantity, src.Quantity, Line.QtyRemaining),
                                              RequiredDate: src.RequiredDate,
                                              Remarks: src.Remarks,
                                              LineStatus: {Value: "Open"}
                                          }
                                      )
                                  )
                              );
                              Set(varCurrentPO, varNewPO);
                              Set(varProcurementMode, "Edit");
                              Set(varPoCanEdit, true);
                              Refresh(PurchaseOrders);
                              Refresh(PurchaseOrderLines);
                              Concurrent(
                                  fnWriteLog(
                                      "Purchase Order",
                                      varNewPO.ID,
                                      varNewPO.PONumber,
                                      If(varProcLogNew, "Created", "Updated"),
                                      "Info",
                                      Coalesce(varNewPO.ProjectID, 0),
                                      Coalesce(LookUp(colProjects, ID = varNewPO.ProjectID, ProjectCode), varNewPO.Project.Value, ""),
                                      Coalesce(varNewPO.Total, 0),
                                      Coalesce(varNewPO.Currency.Value, ""),
                                      "",
                                      "",
                                      "",
                                      "",
                                      "",
                                      0
                                  ),
                                  Notify(
                                      If(
                                          gblLanguage = "Arabic",
                                          "تم حفظ أمر الشراء " & varNewPO.PONumber & " كمسودة.",
                                          "Purchase Order " & varNewPO.PONumber & " has been saved as draft."
                                      ),
                                      NotificationType.Success
                                  )
                              );
                              If(
                                  Len(varProcAttachNames) > 0,
                                  fnWriteLog(
                                      "Purchase Order",
                                      varNewPO.ID,
                                      varNewPO.PONumber,
                                      "Attached",
                                      "Info",
                                      Coalesce(varNewPO.ProjectID, 0),
                                      Coalesce(LookUp(colProjects, ID = varNewPO.ProjectID, ProjectCode), varNewPO.Project.Value, ""),
                                      Blank(),
                                      "",
                                      "",
                                      "",
                                      "",
                                      varProcAttachNames,
                                      "",
                                      0
                                  )
                              )
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "حفظ كمسودة", "Save draft"))
                        Visible: =varPoCanEdit
                        Width: =If(App.Width < 700, 44, 140)
                  - btnEdPoSubmit:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Primary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Send"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              Or(IsBlank(varCurrentPO), varProcurementMode = "New"),
                              Notify(If(gblLanguage = "Arabic", "يرجى حفظ أمر الشراء كمسودة أولاً.", "Please save the purchase order as a draft first."), NotificationType.Error),
                              varCurrentPO.POStatus.Value <> "Draft",
                              Notify(If(gblLanguage = "Arabic", "يمكن الإرسال فقط عندما تكون الحالة مسودة.", "The purchase order can only be submitted when its status is Draft."), NotificationType.Error),
                              If(
                                  Confirm(
                                      If(
                                          gblLanguage = "Arabic",
                                          "إرسال أمر الشراء " & varCurrentPO.PONumber & " بقيمة " & Text(varCurrentPO.Total, "#,##0.00") & "؟",
                                          "Submit purchase order " & varCurrentPO.PONumber & " for " & Text(varCurrentPO.Total, "#,##0.00") & "?"
                                      )
                                  ),
                                  Set(
                                      varCurrentPO,
                                      Patch(
                                          PurchaseOrders,
                                          varCurrentPO,
                                          {
                                              POStatus: {Value: "Submitted"},
                                              POValue: "Submitted"
                                          }
                                      )
                                  );
                                  Set(varPoCanEdit, false);
                                  Refresh(PurchaseOrders);
                                  Concurrent(
                                      fnWriteLog(
                                          "Purchase Order",
                                          varCurrentPO.ID,
                                          varCurrentPO.PONumber,
                                          "Submitted",
                                          "Important",
                                          Coalesce(varCurrentPO.ProjectID, 0),
                                          Coalesce(varCurrentPO.Project.Value, ""),
                                          Coalesce(varCurrentPO.Total, 0),
                                          Coalesce(varCurrentPO.Currency.Value, ""),
                                          "POStatus",
                                          "Draft",
                                          "Submitted",
                                          "",
                                          "",
                                          0
                                      ),
                                      Notify(
                                          If(gblLanguage = "Arabic", "تم إرسال أمر الشراء.", "Purchase order submitted."),
                                          NotificationType.Success
                                      )
                                  );
                                  IfError(
                                      With(
                                          {
                                              pr: LookUp(PurchaseRequests, ID = varCurrentPO.PRID),
                                              me: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                                              who: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")
                                          },
                                          If(
                                              And(Coalesce(pr.SupervisorID, 0) > 0, pr.SupervisorID <> me),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varCurrentPO.PONumber, ApproverID = pr.SupervisorID, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varCurrentPO.PONumber & " - Pending", 255),
                                                          RequestItemID: Text(varCurrentPO.ID),
                                                          RequestType: {Value: "Purchase Order"},
                                                          RequestNumber: varCurrentPO.PONumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: pr.SupervisorID, Value: Coalesce(pr.Supervisor.Value, "")},
                                                          ApproverID: pr.SupervisorID,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 1,
                                                          EntityType: {Value: "PurchaseOrder"},
                                                          Requester: {Id: Coalesce(varCurrentPO.PreparedByID, 0), Value: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(pr.SupervisorID, Coalesce(pr.Supervisor.Value, ""), "Approval needed for " & varCurrentPO.PONumber, who & " submitted " & varCurrentPO.PONumber & " for your approval.", "PurchaseOrder", varCurrentPO.ID, "PurchaseOrder")
                                          );
                                          If(
                                              And(Coalesce(pr.ApproverID, 0) > 0, pr.ApproverID <> me, pr.ApproverID <> Coalesce(pr.SupervisorID, 0)),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varCurrentPO.PONumber, ApproverID = pr.ApproverID, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varCurrentPO.PONumber & " - Pending", 255),
                                                          RequestItemID: Text(varCurrentPO.ID),
                                                          RequestType: {Value: "Purchase Order"},
                                                          RequestNumber: varCurrentPO.PONumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: pr.ApproverID, Value: Coalesce(pr.Approver.Value, "")},
                                                          ApproverID: pr.ApproverID,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 2,
                                                          EntityType: {Value: "PurchaseOrder"},
                                                          Requester: {Id: Coalesce(varCurrentPO.PreparedByID, 0), Value: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(pr.ApproverID, Coalesce(pr.Approver.Value, ""), "Approval needed for " & varCurrentPO.PONumber, who & " submitted " & varCurrentPO.PONumber & " for your approval.", "PurchaseOrder", varCurrentPO.ID, "PurchaseOrder")
                                          );
                                          If(
                                              And(Coalesce(pr.FinancialApproverID, 0) > 0, pr.FinancialApproverID <> me, pr.FinancialApproverID <> Coalesce(pr.SupervisorID, 0), pr.FinancialApproverID <> Coalesce(pr.ApproverID, 0)),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varCurrentPO.PONumber, ApproverID = pr.FinancialApproverID, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varCurrentPO.PONumber & " - Pending", 255),
                                                          RequestItemID: Text(varCurrentPO.ID),
                                                          RequestType: {Value: "Purchase Order"},
                                                          RequestNumber: varCurrentPO.PONumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: pr.FinancialApproverID, Value: Coalesce(pr.FinancialApprover.Value, "")},
                                                          ApproverID: pr.FinancialApproverID,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 3,
                                                          EntityType: {Value: "PurchaseOrder"},
                                                          Requester: {Id: Coalesce(varCurrentPO.PreparedByID, 0), Value: Coalesce(varCurrentPO.PreparedBy.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(pr.FinancialApproverID, Coalesce(pr.FinancialApprover.Value, ""), "Approval needed for " & varCurrentPO.PONumber, who & " submitted " & varCurrentPO.PONumber & " for your approval.", "PurchaseOrder", varCurrentPO.ID, "PurchaseOrder")
                                          )
                                      ),
                                      Notify(If(gblLanguage = "Arabic", "تم إرسال الأمر، وتعذر إرسال إشعار الاعتماد.", "The order was submitted, but the approval notice could not be sent."), NotificationType.Warning)
                                  );
                                  Set(varProcurementMode, "View");
                                  Navigate(scrPOs, ScreenTransition.UnCover)
                              )
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "إرسال", "Submit"))
                        Visible: =varPoCanEdit
                        Width: =If(App.Width < 700, 44, 120)
