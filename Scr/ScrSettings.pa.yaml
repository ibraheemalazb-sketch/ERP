                  - btnSettingsPermSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ الصلاحيات", "Save permissions")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Save"
                        OnSelect: |-
                          =If(
                              IsBlank(cmbSettingsPermissionRole.Selected),
                              Notify(If(gblLanguage = "Arabic", "يرجى اختيار الدور.", "Please select a role."), NotificationType.Warning),
                              If(
                                  IsBlank(gblSelectedPermission),
                                  ForAll(
                                      colPermissionModules As P,
                                      Patch(
                                          Permissions,
                                          Defaults(Permissions),
                                          {
                                              Role: {Id: cmbSettingsPermissionRole.Selected.ID, Value: cmbSettingsPermissionRole.Selected.Title},
                                              RoleID: cmbSettingsPermissionRole.Selected.ID,
                                              Module: P.Module,
                                              Scope: P.Scope,
                                              CanCreate: P.CanCreate,
                                              CanRead: P.CanRead,
                                              CanEdit: P.CanEdit,
                                              CanDelete: P.CanDelete,
                                              CanApprove: P.CanApprove,
                                              CanExport: P.CanExport,
                                              CanSubmit: P.CanSubmit,
                                              CanViewAll: P.CanViewAll
                                          }
                                      )
                                  ),
                                  ForAll(
                                      colPermissionModules As P,
                                      Patch(
                                          Permissions,
                                          If(IsBlank(P.ID), Defaults(Permissions), LookUp(Permissions, ID = P.ID)),
                                          {
                                              Role: {Id: cmbSettingsPermissionRole.Selected.ID, Value: cmbSettingsPermissionRole.Selected.Title},
                                              RoleID: cmbSettingsPermissionRole.Selected.ID,
                                              Module: P.Module,
                                              Scope: P.Scope,
                                              CanCreate: P.CanCreate,
                                              CanRead: P.CanRead,
                                              CanEdit: P.CanEdit,
                                              CanDelete: P.CanDelete,
                                              CanApprove: P.CanApprove,
                                              CanExport: P.CanExport,
                                              CanSubmit: P.CanSubmit,
                                              CanViewAll: P.CanViewAll
                                          }
                                      )
                                  )
                              );
                              Refresh(Permissions);
                              ClearCollect(colSettingsPermissions, Permissions);
                              Notify(If(gblLanguage = "Arabic", "تم حفظ الصلاحيات.", "Permissions saved."), NotificationType.Success);
                              Clear(colPermissionModules);
                              Set(gblSelectedPermission, Blank());
                              Set(gblShowPermissionForm, false)
                          )
                        Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                        Width: =120
                  - btnSettingsPermFormDelete:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "حذف", "Delete")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Danger")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Delete"
                        OnSelect: |-
                          =If(
                              IsBlank(gblSelectedPermission),
                              Notify(If(gblLanguage = "Arabic", "لا توجد صلاحية محددة.", "There is no permission selected."), NotificationType.Warning),
                              If(
                                  Confirm(If(gblLanguage = "Arabic", "هل تريد حذف هذه الصلاحية؟", "Delete this permission?")),
                                  Remove(Permissions, LookUp(Permissions, ID = gblSelectedPermission.ID));
                                  Refresh(Permissions);
                                  ClearCollect(colSettingsPermissions, Permissions);
                                  Clear(colPermissionModules);
                                  Set(gblSelectedPermission, Blank());
                                  Set(gblShowPermissionForm, false);
                                  Notify(If(gblLanguage = "Arabic", "تم حذف الصلاحية.", "Permission deleted."), NotificationType.Success)
                              )
                          )
                        Text: =If(gblLanguage = "Arabic", "حذف", "Delete")
                        Visible: =!IsBlank(gblSelectedPermission)
                        Width: =100
