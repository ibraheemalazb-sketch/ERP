Screens:
  ScrSettings:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        If(IsBlank(VarSettingSection), Set(VarSettingSection, "Main"));
        Set(gblShowPermissionForm, false);
        Set(gblShowProjectAccessForm, false);
        Concurrent(
            ClearCollect(colSettingsPermissions, Permissions),
            ClearCollect(colSettingsProjectAccess, ProjectAccess),
            ClearCollect(colSettingsRoles, Roles),
            ClearCollect(colSettingsEmployees, Employees),
            ClearCollect(colSettingsProjects, Projects)
        )
    Children:
      - conSettingsNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpSettingsNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table(
                        {
                            Name: "Home",
                            SVG: ""
                        }
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
                    If(!gblMenuExpanded, Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpSettingsTopBar:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            ModuleIcon: ="Settings"
            ModuleName: =If(gblLanguage = "Arabic", "الإعدادات", "Settings")
            OnSelectTitle: =Navigate(ScrHome, ScreenTransition.None)
            ScreenSubtitle: |-
              =Switch(
                  VarSettingSection,
                  "UserPermissions", If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User Permissions"),
                  "ProjectAccess", If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project Access"),
                  "AppSettings", If(gblLanguage = "Arabic", "إعدادات التطبيق", "App Settings"),
                  If(gblLanguage = "Arabic", "إدارة الوصول", "Access administration")
              )
            ScreenTitle: =If(gblLanguage = "Arabic", "الإعدادات", "Settings")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpSettingsPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table(
                  {
                      Name: "Home",
                      SVG: ""
                  }
              )
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "UserPermissions", Title: If(gblLanguage = "Arabic", "الصلاحيات", "Permissions"), Icon: "Shield", Visible: true},
                  {ID: 20, Module: "ProjectAccess", Title: If(gblLanguage = "Arabic", "المشاريع", "Projects"), Icon: "Folder", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "UserPermissions", Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false),
                  "ProjectAccess", Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false)
              )
            SelectedID: |-
              =Switch(
                  VarSettingSection,
                  "UserPermissions", 10,
                  "ProjectAccess", 20,
                  1
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conSettingsHome:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 56 - If(App.Width < 700, 52, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Visible: |-
              =And(
                  Or(VarSettingSection = "Main", VarSettingSection = "AppSettings", IsBlank(VarSettingSection)),
                  !gblShowPermissionForm,
                  !gblShowProjectAccessForm
              )
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =56
          Children:
            - lblSettingsHomeTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("TextPrimary")
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  Size: =18
                  Text: =If(gblLanguage = "Arabic", "إدارة الوصول", "Access administration")
                  Width: =Parent.Width
            - lblSettingsHomeHint:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("TextSecondary")
                  Font: =Font.'Segoe UI'
                  Height: =36
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "اختر صلاحيات الأدوار أو وصول المشاريع. القوائم تُصفى محلياً بعد تحميلها.", "Choose role permissions or project access. Lists load once, then filter locally.")
                  Width: =Parent.Width
            - conSettingsHomeCards:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 120, 52)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - btnSettingsOpenPermissions:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User Permissions")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =52
                        Icon: ="Shield"
                        OnSelect: |-
                          =Set(VarSettingSection, "UserPermissions");
                          Set(gblShowPermissionForm, false)
                        Text: =If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User Permissions")
                        Width: =If(App.Width < 700, Parent.Width, 280)
                  - btnSettingsOpenProjects:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project Access")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =52
                        Icon: ="People"
                        OnSelect: |-
                          =Set(VarSettingSection, "ProjectAccess");
                          Set(gblShowProjectAccessForm, false)
                        Text: =If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project Access")
                        Width: =If(App.Width < 700, Parent.Width, 280)
      - conSettingsPermissions:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 56 - If(App.Width < 700, 52, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =8
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =8
            Visible: =And(VarSettingSection = "UserPermissions", !gblShowPermissionForm, !gblShowProjectAccessForm)
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =56
          Children:
            - conSettingsPermToolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 248, 72)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Width: =Parent.Width
                Children:
                  - lblSettingsPermTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =14
                        Text: =If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User Permissions")
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - cmbSettingsPermRole:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب الدور", "Filter by role")
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الدور", "Role")
                        ItemDisplayText: =ThisItem.Title
                        Items: =colSettingsRoles
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - ddSettingsPermModule:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب الوحدة", "Filter by module")
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(Permissions.Module)
                        Width: =If(App.Width < 700, Parent.Width, 160)
                  - ddSettingsPermScope:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب النطاق", "Filter by scope")
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(Permissions.Scope)
                        Width: =If(App.Width < 700, Parent.Width, 140)
                  - btnSettingsPermRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowSync"
                        OnSelect: |-
                          =Refresh(Permissions);
                          ClearCollect(colSettingsPermissions, Permissions)
                        Text: =""
                        Width: =36
                  - btnSettingsPermNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحية جديدة", "New Permission")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Add"
                        OnSelect: |-
                          =Clear(colPermissionModules);
                          Collect(
                              colPermissionModules,
                              {
                                  RowID: GUID(),
                                  Module: Blank(),
                                  Scope: Blank(),
                                  CanCreate: false,
                                  CanRead: true,
                                  CanEdit: false,
                                  CanDelete: false,
                                  CanApprove: false,
                                  CanExport: false,
                                  CanSubmit: false,
                                  CanViewAll: false
                              }
                          );
                          Set(gblSelectedPermission, Blank());
                          Set(gblShowPermissionForm, true)
                        Text: =If(gblLanguage = "Arabic", "صلاحية جديدة", "New Permission")
                        Width: =If(App.Width < 700, Parent.Width, 160)
            - galSettingsPermissions:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User permissions")
                  BorderStyle: =BorderStyle.None
                  Fill: =Color.Transparent
                  Items: |-
                    =SortByColumns(
                        Filter(
                            colSettingsPermissions,
                            Or(IsBlank(cmbSettingsPermRole.Selected), Role.Id = cmbSettingsPermRole.Selected.ID),
                            Or(IsBlank(ddSettingsPermModule.Selected), Module.Value = ddSettingsPermModule.Selected.Value),
                            Or(IsBlank(ddSettingsPermScope.Selected), Scope.Value = ddSettingsPermScope.Selected.Value)
                        ),
                        "Created",
                        SortOrder.Descending
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =6
                  TemplateSize: =If(App.Width < 700, 148, 52)
                  Width: =Parent.Width
                Children:
                  - conSettingsPermRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 6
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =10
                        PaddingRight: =8
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =Parent.TemplateWidth
                      Children:
                        - lblSettingsPermRole:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              Size: =12
                              Text: =Coalesce(ThisItem.Role.Value, "-")
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.16)
                        - lblSettingsPermModule:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("Primary")
                              Fill: =fxThemeColor("PrimaryLighter")
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =11
                              Text: =Coalesce(ThisItem.Module.Value, "-")
                              Width: =If(App.Width < 700, 110, Parent.Width * 0.12)
                        - lblSettingsPermScope:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Fill: =fxThemeColor("SurfaceHover")
                              Font: =Font.'Segoe UI'
                              Height: =22
                              PaddingLeft: =8
                              PaddingRight: =8
                              Size: =11
                              Text: =Coalesce(ThisItem.Scope.Value, "-")
                              Width: =If(App.Width < 700, 90, Parent.Width * 0.1)
                        - lblSettingsPermAccess:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =Font.'Segoe UI'
                              Height: =22
                              Size: =11
                              Text: |-
                                =Concat(
                                    Filter(
                                        Table(
                                            {On: ThisItem.CanCreate, Name: If(gblLanguage = "Arabic", "إنشاء", "Create")},
                                            {On: ThisItem.CanRead, Name: If(gblLanguage = "Arabic", "قراءة", "Read")},
                                            {On: ThisItem.CanEdit, Name: If(gblLanguage = "Arabic", "تعديل", "Edit")},
                                            {On: ThisItem.CanDelete, Name: If(gblLanguage = "Arabic", "حذف", "Delete")},
                                            {On: ThisItem.CanApprove, Name: If(gblLanguage = "Arabic", "اعتماد", "Approve")},
                                            {On: ThisItem.CanExport, Name: If(gblLanguage = "Arabic", "تصدير", "Export")},
                                            {On: ThisItem.CanSubmit, Name: If(gblLanguage = "Arabic", "تقديم", "Submit")},
                                            {On: ThisItem.CanViewAll, Name: If(gblLanguage = "Arabic", "عرض الكل", "View All")}
                                        ),
                                        On
                                    ),
                                    Name,
                                    " · "
                                )
                              Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.48)
                        - btnSettingsPermEdit:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تعديل", "Edit")
                              Appearance: =ButtonAppearance.Subtle
                              Height: =32
                              Icon: ="Edit"
                              OnSelect: |-
                                =Set(gblSelectedPermission, ThisItem);
                                Set(gblShowPermissionForm, true);
                                ClearCollect(
                                    colPermissionModules,
                                    AddColumns(
                                        Filter(colSettingsPermissions, RoleID = ThisItem.Role.Id),
                                        RowID,
                                        GUID()
                                    )
                                )
                              Text: =""
                              Width: =32
                        - btnSettingsPermDelete:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "حذف", "Delete")
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("Danger")
                              Height: =32
                              Icon: ="Delete"
                              OnSelect: |-
                                =If(
                                    Confirm(If(gblLanguage = "Arabic", "هل تريد حذف هذه الصلاحية؟", "Delete this permission?")),
                                    Remove(Permissions, LookUp(Permissions, ID = ThisItem.ID));
                                    Remove(colSettingsPermissions, LookUp(colSettingsPermissions, ID = ThisItem.ID));
                                    Notify(If(gblLanguage = "Arabic", "تم حذف الصلاحية.", "Permission deleted."), NotificationType.Success)
                                )
                              Text: =""
                              Width: =32
      - conSettingsProjects:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 56 - If(App.Width < 700, 52, 0)
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            PaddingBottom: =8
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =8
            Visible: =And(VarSettingSection = "ProjectAccess", !gblShowPermissionForm, !gblShowProjectAccessForm)
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =56
          Children:
            - conSettingsProjToolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 248, 72)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Width: =Parent.Width
                Children:
                  - lblSettingsProjTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        Size: =14
                        Text: =If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project Access")
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - cmbSettingsProjEmployee:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب الموظف", "Filter by employee")
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                        ItemDisplayText: =ThisItem.FullName
                        Items: =colSettingsEmployees
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 200)
                  - cmbSettingsProjProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب المشروع", "Filter by project")
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        ItemDisplayText: =ThisItem.Title
                        Items: =colSettingsProjects
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - ddSettingsProjLevel:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تصفية حسب مستوى الوصول", "Filter by access level")
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(ProjectAccess.AccessLevel)
                        Width: =If(App.Width < 700, Parent.Width, 160)
                  - btnSettingsProjRefresh:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        Icon: ="ArrowSync"
                        OnSelect: |-
                          =Refresh(ProjectAccess);
                          ClearCollect(colSettingsProjectAccess, ProjectAccess)
                        Text: =""
                        Width: =36
                  - btnSettingsProjNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحية وصول جديدة", "New Project Access")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Add"
                        OnSelect: |-
                          =Set(gblSelectedProjectAccess, Blank());
                          Clear(colSelectedProjectAccessProjects);
                          Set(gblShowProjectAccessForm, true)
                        Text: =If(gblLanguage = "Arabic", "وصول جديد", "New Access")
                        Width: =If(App.Width < 700, Parent.Width, 140)
            - galSettingsProjects:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project access")
                  BorderStyle: =BorderStyle.None
                  Fill: =Color.Transparent
                  Items: |-
                    =SortByColumns(
                        Filter(
                            colSettingsProjectAccess,
                            Or(IsBlank(cmbSettingsProjEmployee.Selected), Employee.Id = cmbSettingsProjEmployee.Selected.ID),
                            Or(IsBlank(cmbSettingsProjProject.Selected), Project.Id = cmbSettingsProjProject.Selected.ID),
                            Or(IsBlank(ddSettingsProjLevel.Selected), AccessLevel.Value = ddSettingsProjLevel.Selected.Value)
                        ),
                        "Created",
                        SortOrder.Descending
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =6
                  TemplateSize: =If(App.Width < 700, 112, 52)
                  Width: =Parent.Width
                Children:
                  - conSettingsProjRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight - 6
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =10
                        PaddingRight: =8
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =Parent.TemplateWidth
                      Children:
                        - lblSettingsProjEmployee:
                            Control: Label@2.5.1
                            Properties:
