                        DefaultSelectedItems: =If(IsBlank(gblSelectedProjectAccess), [], [LookUp(colSettingsEmployees, ID = gblSelectedProjectAccess.Employee.Id)])
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "الموظف", "Employee")
                        ItemDisplayText: =ThisItem.FullName
                        Items: =Filter(colSettingsEmployees, Or(IsBlank(Status.Value), Status.Value = "Active"))
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.34)
                  - ddSettingsAccessLevel:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "مستوى الوصول", "Access level")
                        Default: =If(IsBlank(gblSelectedProjectAccess), Blank(), gblSelectedProjectAccess.AccessLevel)
                        Height: =40
                        ItemDisplayText: =ThisItem.Value
                        Items: =Choices(ProjectAccess.AccessLevel)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width < 700, Parent.Width, Parent.Width * 0.22)
                  - togSettingsAllProjects:
                      Control: ModernToggle@1.0.1
                      Properties:
                        Default: =If(IsBlank(gblSelectedProjectAccess), false, gblSelectedProjectAccess.AllProjects)
                        Height: =36
                        Label: =If(gblLanguage = "Arabic", "جميع المشاريع", "All projects")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width < 700, Parent.Width, 180)
                  - togSettingsAccessActive:
                      Control: ModernToggle@1.0.1
                      Properties:
                        Default: =If(IsBlank(gblSelectedProjectAccess), true, gblSelectedProjectAccess.IsActive)
                        Height: =36
                        Label: =If(gblLanguage = "Arabic", "نشط", "Active")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =If(App.Width < 700, Parent.Width, 140)
            - conSettingsProjPicker:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 96, 56)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =8
                  PaddingRight: =8
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                  Visible: =!togSettingsAllProjects.Checked
                  Width: =Parent.Width
                Children:
                  - cmbSettingsAccessProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Height: =40
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "اختر المشروع", "Select project")
                        ItemDisplayText: =ThisItem.Title
                        Items: =colSettingsProjects
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, Parent.Width - 180)
                  - btnSettingsAddProject:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إضافة المشروع", "Add project")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              IsBlank(cmbSettingsAccessProject.Selected),
                              Notify(If(gblLanguage = "Arabic", "يرجى اختيار مشروع.", "Please select a project."), NotificationType.Warning),
                              !IsBlank(LookUp(colSelectedProjectAccessProjects, ProjectID = cmbSettingsAccessProject.Selected.ID)),
                              Notify(If(gblLanguage = "Arabic", "تمت إضافة هذا المشروع.", "This project is already added."), NotificationType.Warning),
                              Collect(
                                  colSelectedProjectAccessProjects,
                                  {
                                      ProjectID: cmbSettingsAccessProject.Selected.ID,
                                      ProjectTitle: cmbSettingsAccessProject.Selected.Title
                                  }
                              );
                              Reset(cmbSettingsAccessProject)
                          )
                        Text: =If(gblLanguage = "Arabic", "إضافة", "Add")
                        Width: =120
            - galSettingsSelectedProjects:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "المشاريع المحددة", "Selected projects")
                  BorderStyle: =BorderStyle.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =180
                  Items: =colSelectedProjectAccessProjects
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =4
                  TemplateSize: =40
                  Visible: =!togSettingsAllProjects.Checked
                  Width: =Parent.Width
                Children:
                  - conSettingsSelectedProject:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =10
                        RadiusBottomLeft: =gblTheme.Radius.Small
                        RadiusBottomRight: =gblTheme.Radius.Small
                        RadiusTopLeft: =gblTheme.Radius.Small
                        RadiusTopRight: =gblTheme.Radius.Small
                        Width: =Parent.TemplateWidth
                      Children:
                        - lblSettingsSelectedProject:
                            Control: Label@2.5.1
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =Font.'Segoe UI'
                              Height: =22
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: =ThisItem.ProjectTitle
                              Width: =Parent.Width - 40
                        - btnSettingsRemoveProject:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "إزالة", "Remove")
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("Danger")
                              Height: =28
                              Icon: ="Delete"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Remove(colSelectedProjectAccessProjects, ThisItem)
                              Text: =""
                              Width: =32
            - conSettingsProjFormFoot:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =Parent.Width
                Children:
                  - lblSettingsProjCount:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextMuted")
                        Font: =Font.'Segoe UI'
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =11
                        Text: =CountRows(colSelectedProjectAccessProjects) & " " & If(gblLanguage = "Arabic", "مشروع محدد", "project(s) selected")
                        Width: =Parent.Width - If(App.Width < 700, 0, 360)
                  - btnSettingsProjCancel:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                        Appearance: =ButtonAppearance.Secondary
                        Font: =Font.'Segoe UI'
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Clear(colSelectedProjectAccessProjects);
                          Set(gblSelectedProjectAccess, Blank());
                          Set(gblShowProjectAccessForm, false)
                        Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                        Width: =100
                  - btnSettingsProjSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ الصلاحية", "Save access")
                        Align: =Align.Center
                        BasePaletteColor: =fxThemeColor("Primary")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Save"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              IsBlank(cmbSettingsAccessEmployee.Selected),
                              Notify(If(gblLanguage = "Arabic", "يرجى اختيار موظف.", "Please select an employee."), NotificationType.Warning),
                              IsBlank(ddSettingsAccessLevel.Selected),
                              Notify(If(gblLanguage = "Arabic", "يرجى اختيار مستوى الوصول.", "Please select an access level."), NotificationType.Warning),
                              And(CountRows(colSelectedProjectAccessProjects) = 0, !togSettingsAllProjects.Checked),
                              Notify(If(gblLanguage = "Arabic", "أضف مشروعاً أو فعّل جميع المشاريع.", "Add a project or turn on All projects."), NotificationType.Warning),
                              If(
                                  IsBlank(gblSelectedProjectAccess),
                                  If(
                                      togSettingsAllProjects.Checked,
                                      Patch(
                                          ProjectAccess,
                                          Defaults(ProjectAccess),
                                          {
                                              Title: cmbSettingsAccessEmployee.Selected.FullName,
                                              Employee: {Id: cmbSettingsAccessEmployee.Selected.ID, Value: cmbSettingsAccessEmployee.Selected.FullName},
                                              EmployeeID: cmbSettingsAccessEmployee.Selected.ID,
                                              AccessLevel: ddSettingsAccessLevel.Selected,
                                              AllProjects: true,
                                              IsActive: togSettingsAccessActive.Checked,
                                              All: ddSettingsAccessLevel.Selected
                                          }
                                      ),
                                      ForAll(
                                          colSelectedProjectAccessProjects,
                                          Patch(
                                              ProjectAccess,
                                              Defaults(ProjectAccess),
                                              {
                                                  Title: cmbSettingsAccessEmployee.Selected.FullName & " - " & ProjectTitle,
                                                  Employee: {Id: cmbSettingsAccessEmployee.Selected.ID, Value: cmbSettingsAccessEmployee.Selected.FullName},
                                                  EmployeeID: cmbSettingsAccessEmployee.Selected.ID,
                                                  Project: {Id: ProjectID, Value: ProjectTitle},
                                                  ProjectID: ProjectID,
                                                  AccessLevel: ddSettingsAccessLevel.Selected,
                                                  AllProjects: false,
                                                  IsActive: togSettingsAccessActive.Checked,
                                                  All: ddSettingsAccessLevel.Selected
                                              }
                                          )
                                      )
                                  ),
                                  Patch(
                                      ProjectAccess,
                                      gblSelectedProjectAccess,
                                      {
                                          Title: cmbSettingsAccessEmployee.Selected.FullName & " - " & If(togSettingsAllProjects.Checked, "All Projects", Coalesce(First(colSelectedProjectAccessProjects).ProjectTitle, "")),
                                          Employee: {Id: cmbSettingsAccessEmployee.Selected.ID, Value: cmbSettingsAccessEmployee.Selected.FullName},
                                          EmployeeID: cmbSettingsAccessEmployee.Selected.ID,
                                          Project: If(togSettingsAllProjects.Checked, Blank(), {Id: First(colSelectedProjectAccessProjects).ProjectID, Value: First(colSelectedProjectAccessProjects).ProjectTitle}),
                                          ProjectID: If(togSettingsAllProjects.Checked, Blank(), First(colSelectedProjectAccessProjects).ProjectID),
                                          AccessLevel: ddSettingsAccessLevel.Selected,
                                          AllProjects: togSettingsAllProjects.Checked,
                                          IsActive: togSettingsAccessActive.Checked,
                                          All: ddSettingsAccessLevel.Selected
                                      }
                                  )
                              );
                              Refresh(ProjectAccess);
                              ClearCollect(colSettingsProjectAccess, ProjectAccess);
                              Notify(If(gblLanguage = "Arabic", "تم حفظ صلاحية المشروع.", "Project access saved."), NotificationType.Success);
                              Clear(colSelectedProjectAccessProjects);
                              Set(gblSelectedProjectAccess, Blank());
                              Set(gblShowProjectAccessForm, false)
                          )
                        Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                        Width: =120
                  - btnSettingsProjFormDelete:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "حذف", "Delete")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Danger")
                        Font: =Font.'Segoe UI'
                        Height: =36
                        Icon: ="Delete"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              IsBlank(gblSelectedProjectAccess),
                              Notify(If(gblLanguage = "Arabic", "لا توجد صلاحية للحذف.", "There is no project access to delete."), NotificationType.Warning),
                              If(
                                  Confirm(If(gblLanguage = "Arabic", "هل تريد حذف صلاحية المشروع؟", "Delete this project access?")),
                                  Remove(ProjectAccess, gblSelectedProjectAccess);
                                  Refresh(ProjectAccess);
                                  ClearCollect(colSettingsProjectAccess, ProjectAccess);
                                  Clear(colSelectedProjectAccessProjects);
                                  Set(gblSelectedProjectAccess, Blank());
                                  Set(gblShowProjectAccessForm, false);
                                  Notify(If(gblLanguage = "Arabic", "تم حذف صلاحية المشروع.", "Project access deleted."), NotificationType.Success)
                              )
                          )
                        Text: =If(gblLanguage = "Arabic", "حذف", "Delete")
                        Visible: =!IsBlank(gblSelectedProjectAccess)
                        Width: =100
      - conSettingsRestricted:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(15, 23, 42, 0.45)
            Height: =Parent.Height
            Visible: =gblUser.Role <> "System Administrator"
            Width: =Parent.Width
          Children:
            - conSettingsRestrictedCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  Height: =220
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =gblTheme.Radius.Large
                  RadiusBottomRight: =gblTheme.Radius.Large
                  RadiusTopLeft: =gblTheme.Radius.Large
                  RadiusTopRight: =gblTheme.Radius.Large
                  Width: =Min(420, Parent.Width - 32)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - icoSettingsRestricted:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Icon: ="Warning"
                        IconColor: =fxThemeColor("Danger")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                  - lblSettingsRestrictedTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =fxThemeColor("TextPrimary")
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =16
                        Text: =If(gblLanguage = "Arabic", "الوصول مقيّد", "Restricted access")
                        Width: =Parent.Width
                  - lblSettingsRestrictedBody:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =fxThemeColor("TextSecondary")
                        Font: =Font.'Segoe UI'
                        Height: =48
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =12
                        Text: =If(gblLanguage = "Arabic", "هذه الشاشة لمدير النظام فقط. ارجع إلى الرئيسية أو اطلب الوصول.", "This screen is for the system administrator. Go back home or ask for access.")
                        Width: =Parent.Width
                  - btnSettingsRestrictedBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "رجوع", "Go back")
                        Align: =Align.Center
                        Appearance: =ButtonAppearance.Secondary
                        Font: =Font.'Segoe UI'
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(ScrHome, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "رجوع", "Go back")
                        Width: =140
      - cmpSettingsTopBar:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            Y: =0
            ActionsVisible: =true
            BadgeColor: =
            BadgeCount: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              )
            FontSizeTitle: =
            HasNotifications: |-
              =CountRows(
                  Filter(
                      colNotifications,
                      With(
                          {flag: Lower(Trim(Coalesce(IsRead, "no")))},
                          And(flag <> "yes", flag <> "true", flag <> "1")
                      )
                  )
              ) > 0
            Height: =56
            HoverText: =
            IconColor: =
            IconSvg: =
            ModuleIcon: ="Settings"
            ModuleName: =If(gblLanguage = "Arabic", "الإعدادات", "Settings")
            OnSearch: =
            OnSelect: =
            OnSelectSubtitle: =
            OnSelectTitle: =Navigate(ScrHome, ScreenTransition.None)
            ScreenSubtitle: |-
              =Switch(
                  VarSettingSection,
                  "UserPermissions", If(gblLanguage = "Arabic", "صلاحيات المستخدمين", "User Permissions"),
                  "ProjectAccess", If(gblLanguage = "Arabic", "صلاحيات المشاريع", "Project Access"),
                  "AppSettings", If(gblLanguage = "Arabic", "إعدادات التطبيق", "App Settings"),
                  If(gblLanguage = "Arabic", "إدارة الوصول", "Access administration")
              )
            ScreenTitle: =If(gblLanguage = "Arabic", "الإعدادات", "Settings")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Size: =
            SubTitleWidth: =
            Theme: =gblTheme.Mode
            TitleWidth: =
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
      - cmpSettingsPhoneNav:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Background,
                  gblTheme.Light.Colors.Background
              )
            AccentColor: =
            Height: =52
            IconsBtn: |-
              =Table(
                  {
                      Name: "Home",
                      SVG: ""
                  }
              )
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "UserPermissions", Title: If(gblLanguage = "Arabic", "الصلاحيات", "Permissions"), Icon: "Shield", Visible: true},
                  {ID: 20, Module: "ProjectAccess", Title: If(gblLanguage = "Arabic", "المشاريع", "Projects"), Icon: "Folder", Visible: true}
              )
            ModuleBtnNav: =
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "UserPermissions", Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false),
                  "ProjectAccess", Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false)
              )
            SelectedID: |-
              =Switch(
                  VarSettingSection,
                  "UserPermissions", 10,
                  "ProjectAccess", 20,
                  1
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
