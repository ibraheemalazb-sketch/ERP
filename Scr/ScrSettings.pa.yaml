                                          If(IsBlank(P.ID), Defaults(Permissions), LookUp(Permissions, ID = P.ID)),
                                          {
                                              Role: {Id: cmbSettingsPermissionRole.Selected.ID, Value: cmbSettingsPermissionRole.Selected.Title},
                                              RoleID: cmbSettingsPermissionRole.Selected.ID,
