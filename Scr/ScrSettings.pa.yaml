Screens:
  ScrSettings:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        If(IsBlank(VarSettingSection), Set(VarSettingSection, "Main"));
        Set(gblShowPermissionForm, false);
        Set(gblShowProjectAccessForm, false);
        Concurrent(
            ClearCollect(colSettingsPermissions, Permissions),
            ClearCollect(colSettingsProjectAccess, ProjectAccess),
            ClearCollect(colSettingsRoles, Roles),
            ClearCollect(colSettingsEmployees, Employees),
            ClearCollect(colSettingsProjects, Projects)
        )
