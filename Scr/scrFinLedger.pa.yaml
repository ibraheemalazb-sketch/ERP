            OnSelect: |-
              =UpdateContext({locDrawer: true, locDrawerLoading: true, locDrawerErr: false, locTab: "approval", locHistTop: 50});
              IfError(
                  // the payroll gate is part of the query itself: a payroll row is never fetched without payroll access
                  UpdateContext({locTxnRec: LookUp(FinancialTransactions, ID = locTxnID && (canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding))});
                  If(
                      IsBlank(locTxnRec) || (!canViewAllProjects && IsBlank(LookUp(colMyProjects, ID = locTxnRec.ProjectID))),
                      UpdateContext({locDrawer: false});
                      Notify(fnT("led.noAccess", "This transaction does not exist or you cannot open it."), NotificationType.Warning),
                      With({t: locTxnRec}, UpdateContext({locTxn: {ID: t.ID, TransactionNumber: t.TransactionNumber, Title: t.Title, TransactionDate: t.TransactionDate, PeriodKey: t.PeriodKey, ProjectID: t.ProjectID, BudgetLineID: t.BudgetLineID, Type: t.TransactionType.Value, Source: t.SourceModule.Value, SourceID: t.SourceID, SourceNumber: t.SourceNumber, Description: t.Description, Currency: t.Currency.Value, Amount: t.Amount, ExchangeRate: t.ExchangeRate, AmountUSD: t.AmountUSD, FundingSource: t.FundingSource.Value, VendorID: t.VendorID, EmployeeID: t.EmployeeID, Status: t.Status.Value, PostedByID: t.PostedByID}}));
                      Concurrent(
                          UpdateContext({locTxnProj: Coalesce(LookUp(colProjectOptions, Key = locTxn.ProjectID).Value, LookUp(Projects, ID = locTxn.ProjectID).ProjectCode)}),
                          UpdateContext({locTxnBL: If(Coalesce(locTxn.BudgetLineID, 0) > 0, LookUp(Budgets, ID = locTxn.BudgetLineID).BudgetLineCode, "")}),
                          UpdateContext({locTxnVendor: If(Coalesce(locTxn.VendorID, 0) > 0, Coalesce(LookUp(colVendorsLite, Key = locTxn.VendorID).Value, LookUp(Vendors, ID = locTxn.VendorID).Title), "")}),
                          UpdateContext({locTxnEmp: If(Coalesce(locTxn.EmployeeID, 0) > 0 && (canAccessPayroll || locTxn.Source <> cfgSourceModule.Payroll),
                              Coalesce(LookUp(colEmpLite, Key = locTxn.EmployeeID).Value, LookUp(Employees, ID = locTxn.EmployeeID).FullName), "")}),
                          UpdateContext({locTxnBy: If(Coalesce(locTxn.PostedByID, 0) > 0, Coalesce(LookUp(colEmpLite, Key = locTxn.PostedByID).Value, LookUp(Employees, ID = locTxn.PostedByID).FullName), "")}),
                          // reversal link (H9): a Reversal row carries the original TransactionNumber in SourceNumber
                          UpdateContext({locTxnRevBy: If(locTxn.Status = cfgTxnStatus.Reversed,
                              LookUp(FinancialTransactions, TransactionType.Value = cfgTxnType.Reversal && SourceNumber = locTxn.TransactionNumber, TransactionNumber), "")})
                      )
                  ),
                  UpdateContext({locDrawerErr: true});
                  Trace("Ledger detail failed: " & FirstError.Message, TraceSeverity.Error)
              );
              UpdateContext({locDrawerLoading: false})
