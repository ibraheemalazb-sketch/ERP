            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =UpdateContext({
                  locQ: {
                      From: drpLedFrom.Selected.Key, To: drpLedTo.Selected.Key, Project: Coalesce(varProjectID, 0),
                      BL: If(Coalesce(varProjectID, 0) > 0, Coalesce(drpLedBL.Selected.Key, 0), 0),
                      Type: drpLedType.Selected.Key, Source: drpLedSource.Selected.Key, Fund: drpLedFund.Selected.Key,
                      Vendor: Coalesce(drpLedVendor.Selected.Key, 0), Emp: Coalesce(drpLedEmp.Selected.Key, 0), Search: Trim(txtLedSearch.Text)
                  }
              });
              // scoped users must pick a project (no cross-project ledger scan); finance-wide users may query all projects
              UpdateContext({locNeedProject: !canViewAllProjects && locQ.Project = 0, locError: false});
              If(
                  locNeedProject,
                  Clear(colLed),
                  UpdateContext({locLoading: true});
                  IfError(
                      ClearCollect(
                          colLed,
                      ForAll(
                          FirstN(
                              Sort(
                                  Filter(
                                      FinancialTransactions,
                                      PeriodKey >= locQ.From,
                                      PeriodKey <= locQ.To,
                                      locQ.Project = 0 || ProjectID = locQ.Project,
                                      locQ.BL = 0 || BudgetLineID = locQ.BL,
                                      IsBlank(locQ.Type) || TransactionType.Value = locQ.Type,
                                      IsBlank(locQ.Source) || SourceModule.Value = locQ.Source,
                                      IsBlank(locQ.Fund) || FundingSource.Value = locQ.Fund,
                                      locQ.Vendor = 0 || VendorID = locQ.Vendor,
                                      locQ.Emp = 0 || EmployeeID = locQ.Emp,
                                      IsBlank(locQ.Search) || StartsWith(TransactionNumber, locQ.Search),
                                      canSeePayrollLedger || SourceModule.Value = cfgSourceModule.PaymentRequest || SourceModule.Value = cfgSourceModule.PurchaseOrder || SourceModule.Value = cfgSourceModule.Manual || SourceModule.Value = cfgSourceModule.DonorFunding,
                                      locCursor = 0 || ID < locCursor
                                  ),
                                  ID,
                                  SortOrder.Descending
                              ),
                              cfgPageSize
                          ) As t,
                          {ID: t.ID, TransactionNumber: t.TransactionNumber, Title: t.Title, TransactionDate: t.TransactionDate, PeriodKey: t.PeriodKey, ProjectID: t.ProjectID, BudgetLineID: t.BudgetLineID, Type: t.TransactionType.Value, Source: t.SourceModule.Value, SourceID: t.SourceID, SourceNumber: t.SourceNumber, Description: t.Description, Currency: t.Currency.Value, Amount: t.Amount, ExchangeRate: t.ExchangeRate, AmountUSD: t.AmountUSD, FundingSource: t.FundingSource.Value, VendorID: t.VendorID, EmployeeID: t.EmployeeID, Status: t.Status.Value, PostedByID: t.PostedByID}
                      )
                      ),
                      UpdateContext({locError: true});
                      Trace("Ledger query failed: " & FirstError.Message, TraceSeverity.Error)
                  );
                  UpdateContext({locLoading: false})
              )
