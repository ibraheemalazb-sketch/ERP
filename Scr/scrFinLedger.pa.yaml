                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =touchMin
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
