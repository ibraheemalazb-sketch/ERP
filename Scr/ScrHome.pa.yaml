Screens:
  ScrHome:
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Background,
            gblTheme.Light.Colors.Background
        )
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =If(
            IsBlank(gblMenuExpanded),
            Set(gblMenuExpanded, true)
        );
        If(
            !IsBlank(gblUser.ID),
            Concurrent(
                ClearCollect(
                    colNotifications,
                    SortByColumns(
                        Filter(
                            Notifications,
                            RecipientID = gblUser.ID
                        ),
                        "Created",
                        SortOrder.Descending
                    )
                ),
                ClearCollect(
                    ColApproval,
                    Filter(
                        ApprovalHistory,
                        ApproverID = gblUser.ID
                    )
                ),
                ClearCollect(
                    ColUserTasks,
                    Filter(
                        ProjectsTasks,
                        AssignedToID = gblUser.ID
                    )
                )
            )
        );
        Set(
            VarScreen,
            "Home"
        )
    Children:
      - ConMainPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpBTNavHome.Height, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
            PaddingTop: =cmpTopBarHome.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conPageInset:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =conHero.Height + cmpKPIWithnavigation_1.Height + conDashMain.Height + conDeptHead.Height + cmpModuleNav_3.Height + Self.PaddingTop + Self.PaddingBottom + 72
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =24
                  PaddingLeft: =If(App.Width < 700, 12, 20)
                  PaddingRight: =If(App.Width < 700, 12, 20)
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conHero:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =96
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conHeroText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =64
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - txtGreeting:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextPrimary,
                                          gblTheme.Light.Colors.TextPrimary
                                      )
                                    Font: =App.Theme.Font
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < 640, 18, 24)
                                    Text: |-
                                      =With(
                                          {
                                              h: Hour(Now()),
                                              who: Coalesce(
                                                  First(
                                                      Split(
                                                          Coalesce(gblUser.FullName, ""),
                                                          " "
                                                      )
                                                  ).Value,
                                                  ""
                                              )
                                          },
                                          If(
                                              gblLanguage = "Arabic",
                                              If(
                                                  h < 12,
                                                  "صباح الخير",
                                                  If(
                                                      h < 17,
                                                      "طاب يومك",
                                                      "مساء الخير"
                                                  )
                                              ),
                                              If(
                                                  h < 12,
                                                  "Good morning",
                                                  If(
                                                      h < 17,
                                                      "Good afternoon",
                                                      "Good evening"
                                                  )
                                              )
                                          ) & If(
                                              Len(who) > 0,
                                              If(gblLanguage = "Arabic", "، ", ", ") & who,
                                              ""
                                          )
                                      )
                                    Wrap: =false
                              - txtWelcome:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextMuted,
                                          gblTheme.Light.Colors.TextMuted
                                      )
                                    Font: =App.Theme.Font
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =If(App.Width < 640, 12, 14)
                                    Text: |-
                                      =If(
                                          gblLanguage = "Arabic",
                                          "نظام إدارة المؤسسة" & If(
                                              IsBlank(gblUser.Role),
                                              "",
                                              "   ·   " & gblUser.Role
                                          ),
                                          "HDP ERP" & If(
                                              IsBlank(gblUser.Role),
                                              "",
                                              "   ·   " & gblUser.Role
                                          )
                                      )
                                    Wrap: =false
                        - conHeroAside:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =56
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =App.Width >= 700
                              Width: =240
                            Children:
                              - txtHomeDate:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextMuted,
                                          gblTheme.Light.Colors.TextMuted
                                      )
                                    Font: =App.Theme.Font
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: |-
                                      =If(
                                          gblLanguage = "Arabic",
                                          Text(Today(), "yyyy/mm/dd"),
                                          Text(Today(), "dddd, dd mmm yyyy")
                                      )
                                    Wrap: =false
                              - txtHomeMeta:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.Primary,
                                          gblTheme.Light.Colors.Primary
                                      )
                                    Font: =App.Theme.Font
                                    FontWeight: =FontWeight.Semibold
                                    Height: =24
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: |-
                                      =With(
                                          {
                                              n: CountRows(
                                                  Filter(
                                                      ColApproval,
                                                      Decision.Value = "Pending"
                                                  )
                                              ) + CountRows(
                                                  Filter(
                                                      ColUserTasks,
                                                      DueDate < Today(),
                                                      Status.Value <> "Completed"
                                                  )
                                              )
                                          },
                                          If(
                                              gblLanguage = "Arabic",
                                              Text(n) & " عناصر تحتاج إلى إجراء",
                                              Text(n) & If(
                                                  n = 1,
                                                  " item needs action",
                                                  " items need action"
                                              )
                                          )
                                      )
                                    Wrap: =false
                  - cmpKPIWithnavigation_1:
                      Control: CanvasComponent
                      ComponentName: cmpKPIwNav
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        AnimationEffect: ="Pop"
                        ColumnsLayout: |-
                          ={
                              Mobile: 1,
                              Tablet: 2,
                              Desktop: 4,
                              MobileBreakpoint: IfError(Index(App.SizeBreakpoints, 1).Value, 640),
                              TabletBreakpoint: IfError(Index(App.SizeBreakpoints, 2).Value, 1024),
                              DesktopBreakpoint: IfError(Index(App.SizeBreakpoints, 3).Value, 1366)
                          }
                        Data: |-
                          =Table(
                              {
                                  ID: 1,
                                  Icon: "Shield",
                                  Value: CountRows(
                                      Filter(
                                          ColApproval,
                                          Decision.Value = "Pending"
                                      )
                                  ),
                                  Label: If(
                                      gblLanguage = "Arabic",
                                      "الموافقات المعلقة",
                                      "Pending Approvals"
                                  ),
                                  Subtitle: If(
                                      gblLanguage = "Arabic",
                                      "بانتظار موافقتك",
                                      "Awaiting your approval"
                                  ),
                                  Screen: "ApprovalCenter",
                                  IconBg: "#EBF5FF",
                                  IconColor: "#2196F3",
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 2,
                                  Icon: "Clock",
                                  Value: CountRows(
                                      Filter(
                                          ColUserTasks,
                                          DueDate < Today(),
                                          Status.Value <> "Completed"
                                      )
                                  ),
                                  Label: If(
                                      gblLanguage = "Arabic",
                                      "المهام المتأخرة",
                                      "Overdue Tasks"
                                  ),
                                  Subtitle: If(
                                      gblLanguage = "Arabic",
                                      "تجاوزت تاريخ الاستحقاق",
                                      "Past due date"
                                  ),
                                  Screen: "Tasks",
                                  IconBg: "#FFEBEE",
                                  IconColor: "#F44336",
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 3,
                                  Icon: "Mail",
                                  Value: CountRows(
                                      Filter(
                                          colNotifications,
                                          With(
                                              {
                                                  flag: Lower(Trim(Coalesce(IsRead, "no")))
                                              },
                                              And(
                                                  flag <> "yes",
                                                  flag <> "true",
                                                  flag <> "1"
                                              )
                                          )
                                      )
                                  ),
                                  Label: If(
                                      gblLanguage = "Arabic",
                                      "الإشعارات",
                                      "Notifications"
                                  ),
                                  Subtitle: If(
                                      gblLanguage = "Arabic",
                                      "غير مقروءة",
                                      "Unread"
                                  ),
                                  Screen: "Notifications",
                                  IconBg: "#FFF8E1",
                                  IconColor: "#FF9800",
                                  SparklineData: "",
                                  isHidden: false
                              },
                              {
                                  ID: 4,
                                  Icon: "Calendar",
                                  Value: 0,
                                  Label: If(
                                      gblLanguage = "Arabic",
                                      "فعاليات اليوم",
                                      "Today's Events"
                                  ),
                                  Subtitle: If(
                                      gblLanguage = "Arabic",
                                      "الفعاليات المقررة اليوم",
                                      "Events happening today"
                                  ),
                                  Screen: "Events",
                                  IconBg: "#E8F5E9",
                                  IconColor: "#4CAF50",
                                  SparklineData: "",
                                  isHidden: false
                              }
                          )
                        FontsSizesTitle: =12
                        Height: |-
                          =IfError(
                              With(
                                  {
                                      bp: cmpKPIWithnavigation_1.ColumnsLayout,
                                      w: App.Width,
                                      cardCount: CountRows(
                                          Filter(
                                              cmpKPIWithnavigation_1.Data,
                                              !IfError(isHidden, false)
                                          )
                                      )
                                  },
                                  With(
                                      {
                                          cols: Max(
                                              1,
                                              If(
                                                  w < bp.MobileBreakpoint,
                                                  bp.Mobile,
                                                  w < bp.TabletBreakpoint,
                                                  bp.Tablet,
                                                  bp.Desktop
                                              )
                                          )
                                      },
                                      With(
                                          {
                                              rows: RoundUp(cardCount / cols, 0)
                                          },
                                          If(
                                              Or(
                                                  cmpKPIWithnavigation_1.Style = "Compact",
                                                  cmpKPIWithnavigation_1.Style = "Minimal"
                                              ),
                                              rows * (96 + cmpKPIWithnavigation_1.StyleConfig.space.md) + cmpKPIWithnavigation_1.StyleConfig.space.md,
                                              rows * (cmpKPIWithnavigation_1.StyleConfig.heights.statsCardMax + cmpKPIWithnavigation_1.StyleConfig.space.lg) + cmpKPIWithnavigation_1.StyleConfig.space.lg
                                          )
                                      )
                                  )
                              ),
                              If(
                                  App.Width < 640,
                                  440,
                                  If(
                                      App.Width < 1024,
                                      250,
                                      140
                                  )
                              )
                          )
                        Icons: |-
                          =Table(
                              {
                                  Name: "Clock",
                                  SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>"
                              },
                              {
                                  Name: "Shield",
                                  SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>"
                              },
                              {
                                  Name: "Calendar",
                                  SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2' ry='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>"
                              },
                              {
                                  Name: "Mail",
                                  SVG: "<svg viewBox='0 0 24 24' width='24' height='24' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='COLOR' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z'/><polyline points='22 6 12 13 2 6'/></svg>"
                              }
                          )
                        IconsSize: =28
                        IsLoading: =false
                        KPINav: |-
                          =Switch(
                              varClickScreen,
                              "ApprovalCenter",
                              Navigate(ScrApprovalCenter, ScreenTransition.None),
                              "Tasks",
                              Navigate(scrMyTasks, ScreenTransition.None)
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnCardClick: =
                        Style: ="Compact"
                        StyleConfig: |-
                          ={
                              colors: {
                                  cardBg: ColorValue("#FFFFFF"),
                                  border: ColorValue("#E5E7EB"),
                                  text: ColorValue("#111827"),
                                  textMuted: ColorValue("#6B7280"),
                                  positive: ColorValue("#22C55E"),
                                  negative: ColorValue("#EF4444"),
                                  neutral: ColorValue("#9E9E9E"),
                                  skeletonBase: ColorValue("#E5E7EB"),
                                  skeletonShine: ColorValue("#F3F4F6")
                              },
                              space: {
                                  xs: 4,
                                  sm: 8,
                                  md: 12,
                                  lg: 16,
                                  xl: 24
                              },
                              radius: {
                                  md: 8,
                                  lg: 12
                              },
                              type: {
                                  value: {
                                      size: 28,
                                      sizeCompact: 22
                                  },
                                  label: {
                                      size: 12
                                  },
                                  body: {
                                      size: 12
                                  }
                              },
                              heights: {
                                  statsCardMax: 168
                              },
                              abbreviateThreshold: 10000
                          }
                        SubtitleFS: =12
                        Theme: =gblTheme.Mode
                        Width: =Parent.Width
                  - conDashMain:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 1100, 420 + 12 + 420, 440)
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =true
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conTasks:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Border,
                                    gblTheme.Light.Colors.Border
                                )
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Surface,
                                    gblTheme.Light.Colors.Surface
                                )
                              FillPortions: =0
                              Height: =If(App.Width < 1100, 420, Parent.Height)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =gblTheme.Radius.Small
                              RadiusBottomRight: =gblTheme.Radius.Small
                              RadiusTopLeft: =gblTheme.Radius.Small
                              RadiusTopRight: =gblTheme.Radius.Small
                              Width: =If(App.Width < 1100, Parent.Width, (Parent.Width - 12) * 0.62)
                            Children:
                              - conTasksHead:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.SurfaceHover,
                                          gblTheme.Light.Colors.SurfaceHover
                                      )
                                    FillPortions: =0
                                    Height: =72
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingLeft: =16
                                    PaddingRight: =12
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =gblTheme.Radius.Small
                                    RadiusTopRight: =gblTheme.Radius.Small
                                  Children:
                                    - conTasksHeadText:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =Color.Transparent
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =2
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtTasksTitle:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: |-
                                                  =If(
                                                      gblTheme.Mode = "Dark",
                                                      gblTheme.Dark.Colors.TextPrimary,
                                                      gblTheme.Light.Colors.TextPrimary
                                                  )
                                                Font: =App.Theme.Font
                                                FontWeight: =gblTheme.FontWeights.Medium
                                                Height: =26
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =gblTheme.Typography.CardTitle
                                                Text: |-
                                                  =If(
                                                      gblLanguage = "Arabic",
                                                      "المهام الموكلة إليك",
                                                      "Tasks assigned to you"
                                                  )
                                                Wrap: =false
                                          - txtTasksSub:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                AccessibleLabel: =Self.Text
                                                Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: |-
                                                  =If(
                                                      gblTheme.Mode = "Dark",
                                                      gblTheme.Dark.Colors.TextMuted,
                                                      gblTheme.Light.Colors.TextMuted
                                                  )
                                                Font: =App.Theme.Font
                                                Height: =20
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =gblTheme.Typography.Caption
                                                Text: |-
                                                  =If(
                                                      gblLanguage = "Arabic",
                                                      "المهام المفتوحة التي تحتاج إلى إجراء",
                                                      "Open tasks that need action"
                                                  )
                                                Wrap: =false
                                    - lblHomeTaskCount:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AccessibleLabel: =Self.Text
                                          Align: =Align.Center
                                          AlignInContainer: =AlignInContainer.Center
                                          Color: |-
                                            =If(
                                                gblTheme.Mode = "Dark",
                                                gblTheme.Dark.Colors.Primary,
                                                gblTheme.Light.Colors.Primary
                                            )
                                          Font: =App.Theme.Font
                                          FontWeight: =FontWeight.Bold
                                          Height: =28
                                          LayoutMinHeight: =28
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =12
                                          Text: |-
                                            =Text(
                                                CountRows(
                                                    Filter(
                                                        ColUserTasks,
                                                        Status.Value <> "Completed"
                                                    )
                                                )
                                            )
                                          Width: =36
                                          Wrap: =false
                              - conTasksBody:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
