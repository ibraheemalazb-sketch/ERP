Screens:
  scrPrintPR:
    Properties:
      Fill: =If(scrPrintPR.Printing, RGBA(255, 255, 255, 1), fxThemeColor("Background"))
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "PRs");
        Set(varNavSelectedID, 32);
        Set(varProcurementEntity, "PurchaseRequest");
        ClearCollect(
            colPRPrintLines,
            SortByColumns(
                Filter(PurchaseRequestLines, PRID = varCurrentPR.ID),
                "LineNumber",
                SortOrder.Ascending
            )
        );
        Set(varPRNormalItemsPerPage, 20);
        Set(varPRLastPageItems, 11);
        Set(
            varPRTotalPages,
            If(
                CountRows(colPRPrintLines) <= varPRLastPageItems,
                1,
                1 + RoundUp(
                    (CountRows(colPRPrintLines) - varPRLastPageItems) / varPRNormalItemsPerPage,
                    0
                )
            )
        );
        Set(varSelectedPRPrintPage, 1);
        ClearCollect(
            colPRPrintPages,
            ForAll(
                Sequence(varPRTotalPages),
                With(
                    {
                        PageNum: Value,
                        StartLine: (Value - 1) * varPRNormalItemsPerPage + 1,
                        PageLineCount: If(
                            Value = varPRTotalPages,
                            CountRows(colPRPrintLines) - (Value - 1) * varPRNormalItemsPerPage,
                            varPRNormalItemsPerPage
                        )
                    },
                    {
                        PageNumber: PageNum,
                        IsFirstPage: PageNum = 1,
                        IsLastPage: PageNum = varPRTotalPages,
                        Lines: Filter(
                            colPRPrintLines,
                            LineNumber >= StartLine && LineNumber < StartLine + PageLineCount
                        )
                    }
                )
            )
        )
    Children:
      - cmpPrintNav:
