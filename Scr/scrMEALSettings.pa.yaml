Screens:
  scrMEALSettings:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "MEAL");
        Set(varCurrentScreen, "MEAL");
        Set(VarMEALmodule, "Settings");
        Set(varNavSelectedID, 81);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        Set(varMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, LookUp(Employees, ID = varMeID, FullName), ""));
        Set(varMealSetTab, Coalesce(varMealSetTab, "ActivityTypes"));
        If(IsBlank(varMealSetForm), Set(varMealSetForm, Blank()));
        Set(varMealSetError, false);
        Select(btnMealSetLoad)
    Children:
      - conMealSetSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnMealSetLoad:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varMealSetError, false);
                    IfError(
                        Concurrent(
                            Refresh(ActivityTypes),
                            Refresh(DisaggregationTypes),
                            Refresh(ReportingPeriods),
                            Refresh(MEALActivityLog)
                        );
                        ClearCollect(colMealSetActTypes, FirstN(SortByColumns(ActivityTypes, "Title", SortOrder.Ascending), 500));
                        ClearCollect(colMealSetDisagg, FirstN(SortByColumns(DisaggregationTypes, "DisplayOrder", SortOrder.Ascending), 500));
                        ClearCollect(colMealSetPeriods, FirstN(SortByColumns(ReportingPeriods, "StartDate", SortOrder.Descending), 500));
                        ClearCollect(
                            colMealSetAudit,
                            FirstN(
                                SortByColumns(
                                    Filter(MEALActivityLog, Module.Value = "MEAL"),
                                    "ActionDate",
                                    SortOrder.Descending
                                ),
                                200
                            )
                        );
                        If(Not(IsBlank(varSelectedActType)), Set(varSelectedActType, LookUp(ActivityTypes, ID = varSelectedActType.ID)));
                        If(Not(IsBlank(varSelectedDisagg)), Set(varSelectedDisagg, LookUp(DisaggregationTypes, ID = varSelectedDisagg.ID)));
                        If(Not(IsBlank(varSelectedPeriod)), Set(varSelectedPeriod, LookUp(ReportingPeriods, ID = varSelectedPeriod.ID))),
                        Set(varMealSetError, true);
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل إعدادات المتابعة.", "Could not load MEAL settings."), NotificationType.Warning)
                    )
                  Text: ="Load"
                  Visible: =false
                  Width: =1
            - btnMealSetSaveAT:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealSetForm, "") = "at-new",
                            title: Trim(txtMealSetATTitle.Text),
                            sec: cmbMealSetATSector.Selected
                        },
                        If(
                            IsBlank(title),
                            Notify(If(ar, "العنوان مطلوب.", "Title is required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedActType,
                                    Patch(
                                        ActivityTypes,
                                        If(isNew, Defaults(ActivityTypes), LookUp(ActivityTypes, ID = varSelectedActType.ID)),
                                        {
                                            Title: title,
                                            MEALFunction: {Value: Coalesce(cmbMealSetATFunc.Selected.Value, "")},
                                            ActivityCategory: {Value: Coalesce(cmbMealSetATCat.Selected.Value, "")},
                                            Sector: If(IsBlank(sec), Blank(), {Id: sec.ID, Value: Coalesce(sec.Title, "")}),
                                            SectorID: If(IsBlank(sec), Blank(), sec.ID)
                                        }
                                    )
                                );
                                Set(varMealSetForm, Blank());
                                Select(btnMealSetLoad);
                                Notify(If(ar, "تم حفظ نوع النشاط.", "Activity type saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر الحفظ.", "Could not save."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveAT"
                  Visible: =false
                  Width: =1
            - btnMealSetDelAT:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", r: varSelectedActType},
                        If(
                            IsBlank(r),
                            Notify(If(ar, "اختر سطراً أولاً.", "Select a row first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف نوع النشاط؟", "Delete this activity type?") & Char(10) & Coalesce(r.Title, "")),
                                IfError(
                                    Remove(ActivityTypes, LookUp(ActivityTypes, ID = r.ID));
                                    Set(varSelectedActType, Blank());
                                    Set(varMealSetForm, Blank());
                                    Select(btnMealSetLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="DelAT"
                  Visible: =false
                  Width: =1
            - btnMealSetSaveDT:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealSetForm, "") = "dt-new",
                            title: Trim(txtMealSetDTTitle.Text)
                        },
                        If(
                            IsBlank(title),
                            Notify(If(ar, "العنوان مطلوب.", "Title is required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedDisagg,
                                    Patch(
                                        DisaggregationTypes,
                                        If(isNew, Defaults(DisaggregationTypes), LookUp(DisaggregationTypes, ID = varSelectedDisagg.ID)),
                                        {
                                            Title: title,
                                            Code: Trim(txtMealSetDTCode.Text),
                                            Category: {Value: Coalesce(cmbMealSetDTCat.Selected.Value, Trim(txtMealSetDTCat.Text))},
                                            DisplayOrder: If(IsBlank(Trim(txtMealSetDTOrder.Text)), Blank(), Value(txtMealSetDTOrder.Text))
                                        }
                                    )
                                );
                                Set(varMealSetForm, Blank());
                                Select(btnMealSetLoad);
                                Notify(If(ar, "تم حفظ نوع التفكيك.", "Disaggregation type saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر الحفظ.", "Could not save."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SaveDT"
                  Visible: =false
                  Width: =1
            - btnMealSetDelDT:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", r: varSelectedDisagg},
                        If(
                            IsBlank(r),
                            Notify(If(ar, "اختر سطراً أولاً.", "Select a row first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف نوع التفكيك؟", "Delete this disaggregation type?") & Char(10) & Coalesce(r.Title, "")),
                                IfError(
                                    Remove(DisaggregationTypes, LookUp(DisaggregationTypes, ID = r.ID));
                                    Set(varSelectedDisagg, Blank());
                                    Set(varMealSetForm, Blank());
                                    Select(btnMealSetLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="DelDT"
                  Visible: =false
                  Width: =1
            - btnMealSetSavePer:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {
                            ar: gblLanguage = "Arabic",
                            isNew: Coalesce(varMealSetForm, "") = "per-new"
                        },
                        If(
                            Or(IsBlank(Trim(txtMealSetPerTitle.Text)), IsBlank(dteMealSetPerStart.SelectedDate), IsBlank(dteMealSetPerEnd.SelectedDate)),
                            Notify(If(ar, "العنوان وتواريخ البداية والنهاية مطلوبة.", "Title, start, and end dates are required."), NotificationType.Error),
                            IfError(
                                Set(
                                    varSelectedPeriod,
                                    Patch(
                                        ReportingPeriods,
                                        If(isNew, Defaults(ReportingPeriods), LookUp(ReportingPeriods, ID = varSelectedPeriod.ID)),
                                        {
                                            Title: Trim(txtMealSetPerTitle.Text),
                                            Year: If(IsBlank(Trim(txtMealSetPerYear.Text)), Year(dteMealSetPerStart.SelectedDate), Value(txtMealSetPerYear.Text)),
                                            PeriodType: {Value: Coalesce(cmbMealSetPerType.Selected.Value, "Quarterly")},
                                            PeriodNumber: If(IsBlank(Trim(txtMealSetPerNum.Text)), Blank(), Value(txtMealSetPerNum.Text)),
                                            StartDate: dteMealSetPerStart.SelectedDate,
                                            EndDate: dteMealSetPerEnd.SelectedDate,
                                            Status: {Value: Coalesce(cmbMealSetPerStatus.Selected.Value, "Active")}
                                        }
                                    )
                                );
                                Set(varMealSetForm, Blank());
                                Select(btnMealSetLoad);
                                Notify(If(ar, "تم حفظ الفترة.", "Period saved."), NotificationType.Success),
                                Notify(If(ar, "تعذر حفظ الفترة.", "Could not save the period."), NotificationType.Error)
                            )
                        )
                    )
                  Text: ="SavePer"
                  Visible: =false
                  Width: =1
            - btnMealSetDelPer:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =With(
                        {ar: gblLanguage = "Arabic", p: varSelectedPeriod},
                        If(
                            IsBlank(p),
                            Notify(If(ar, "اختر فترة أولاً.", "Select a period first."), NotificationType.Warning),
                            If(
                                Confirm(If(ar, "حذف الفترة؟", "Delete this period?") & Char(10) & Coalesce(p.Title, "")),
                                IfError(
                                    Remove(ReportingPeriods, LookUp(ReportingPeriods, ID = p.ID));
                                    Set(varSelectedPeriod, Blank());
                                    Set(varMealSetForm, Blank());
                                    Select(btnMealSetLoad);
                                    Notify(If(ar, "تم الحذف.", "Deleted."), NotificationType.Success),
                                    Notify(If(ar, "تعذر الحذف.", "Could not delete."), NotificationType.Error)
                                )
                            )
                        )
                    )
                  Text: ="DelPer"
                  Visible: =false
                  Width: =1
      - conMealSetPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpMealSetPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpMealSetTop.Height + 8
            Width: =Parent.Width
          Children:
            - conMealSetHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblMealSetTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "إعدادات المتابعة والتقييم", "MEAL Settings")
                  - btnMealSetReload:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Select(btnMealSetLoad)
                        Text: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                        Width: =90
            - lblMealSetErr:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varMealSetError, 28, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل الإعدادات.", "Could not load settings.")
                  Visible: =varMealSetError
            - galMealSetTabs:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  FillPortions: =0
                  Height: =40
                  Items: |-
                    =Table(
                        {k: "ActivityTypes", en: "Activity Types", ar: "أنواع الأنشطة"},
                        {k: "DisaggregationTypes", en: "Disaggregation", ar: "التفكيك"},
                        {k: "ReportingPeriods", en: "Periods", ar: "الفترات"},
                        {k: "AuditLog", en: "Audit Log", ar: "سجل التدقيق"}
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplateSize: =140
                Children:
                  - btnMealSetTab:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =If(varMealSetTab = ThisItem.k, ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        Height: =30
                        OnSelect: =Set(varMealSetTab, ThisItem.k); Set(varMealSetForm, Blank())
                        Text: =If(gblLanguage = "Arabic", ThisItem.ar, ThisItem.en)
                        Width: =132
            - conMealSetAT:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varMealSetTab = "ActivityTypes"
                Children:
                  - conMealSetATList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Visible: =Or(App.Width >= 900, IsBlank(varMealSetForm))
                      Children:
                        - btnMealSetATNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMealSetForm, "at-new"); Set(varSelectedActType, Blank())
                              Text: =If(gblLanguage = "Arabic", "+ نوع نشاط", "+ Activity type")
                              Width: =150
                        - galMealSetAT:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =colMealSetActTypes
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplateSize: =56
                            Children:
                              - lblMealSetATRow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Fill: =If(Coalesce(varSelectedActType.ID, 0) = ThisItem.ID, fxThemeColor("PrimarySubtle"), Color.Transparent)
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =Parent.TemplateHeight - 4
                                    OnSelect: =Set(varSelectedActType, ThisItem); Set(varMealSetForm, "at-edit")
                                    Size: =12
                                    Text: =Coalesce(ThisItem.Title, "-") & " · " & Coalesce(ThisItem.MEALFunction.Value, "-") & " · " & Coalesce(ThisItem.ActivityCategory.Value, "-")
                                    Width: =Parent.TemplateWidth
                                    Y: =2
                  - conMealSetATForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        Visible: =Or(varMealSetForm = "at-new", varMealSetForm = "at-edit")
                        Width: =If(App.Width < 900, Parent.Width, 320)
                      Children:
                        - txtMealSetATTitle:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =If(varMealSetForm = "at-new", "", Coalesce(varSelectedActType.Title, ""))
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "العنوان *", "Title *")
                        - cmbMealSetATFunc:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              DefaultSelectedItems: =If(varMealSetForm = "at-edit", Filter(Choices(ActivityTypes.MEALFunction), Value = varSelectedActType.MEALFunction.Value), Filter(Choices(ActivityTypes.MEALFunction), false))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "وظيفة MEAL", "MEAL function")
                              Items: =Choices(ActivityTypes.MEALFunction)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                        - cmbMealSetATCat:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              DefaultSelectedItems: =If(varMealSetForm = "at-edit", Filter(Choices(ActivityTypes.ActivityCategory), Value = varSelectedActType.ActivityCategory.Value), Filter(Choices(ActivityTypes.ActivityCategory), false))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "فئة النشاط", "Activity category")
                              Items: =Choices(ActivityTypes.ActivityCategory)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                        - cmbMealSetATSector:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              DefaultSelectedItems: =If(varMealSetForm = "at-edit", Filter(MainPrograms, ID = varSelectedActType.SectorID), Filter(MainPrograms, false))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "القطاع", "Sector")
                              Items: =MainPrograms
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                        - conMealSetATBtns:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - btnMealSetATSave:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnMealSetSaveAT)
                                    Text: =If(gblLanguage = "Arabic", "حفظ", "Save")
                                    Width: =80
                              - btnMealSetATDel:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Select(btnMealSetDelAT)
                                    Text: =If(gblLanguage = "Arabic", "حذف", "Delete")
                                    Visible: =varMealSetForm = "at-edit"
                                    Width: =80
                              - btnMealSetATCancel:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varMealSetForm, Blank())
                                    Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                                    Width: =80
            - conMealSetDT:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varMealSetTab = "DisaggregationTypes"
                Children:
                  - conMealSetDTList:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Visible: =Or(App.Width >= 900, IsBlank(varMealSetForm))
                      Children:
                        - btnMealSetDTNew:
                            Control: ModernButton@1.0.0
                            Properties:
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varMealSetForm, "dt-new"); Set(varSelectedDisagg, Blank())
                              Text: =If(gblLanguage = "Arabic", "+ تفكيك", "+ Disaggregation")
                              Width: =150
                        - galMealSetDT:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: =colMealSetDisagg
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              TemplateSize: =56
                            Children:
                              - lblMealSetDTRow:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =fxThemeColor("TextPrimary")
                                    Fill: =If(Coalesce(varSelectedDisagg.ID, 0) = ThisItem.ID, fxThemeColor("PrimarySubtle"), Color.Transparent)
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =Parent.TemplateHeight - 4
                                    OnSelect: =Set(varSelectedDisagg, ThisItem); Set(varMealSetForm, "dt-edit")
                                    Size: =12
                                    Text: |-
                                      =Coalesce(ThisItem.Title, "-") & " · " & Coalesce(ThisItem.Code, "-") & " · " & Coalesce(ThisItem.Category.Value, ThisItem.Category, "-") & " · #" & Text(Coalesce(ThisItem.DisplayOrder, 0))
                                    Width: =Parent.TemplateWidth
                                    Y: =2
                  - conMealSetDTForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =8
                        Visible: =Or(varMealSetForm = "dt-new", varMealSetForm = "dt-edit")
                        Width: =If(App.Width < 900, Parent.Width, 320)
                      Children:
                        - txtMealSetDTTitle:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =If(varMealSetForm = "dt-new", "", Coalesce(varSelectedDisagg.Title, ""))
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "العنوان *", "Title *")
                        - txtMealSetDTCode:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =If(varMealSetForm = "dt-new", "", Coalesce(varSelectedDisagg.Code, ""))
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "الرمز", "Code")
                        - cmbMealSetDTCat:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              DefaultSelectedItems: =If(varMealSetForm = "dt-edit", Filter(Choices(DisaggregationTypes.Category), Value = varSelectedDisagg.Category.Value), Filter(Choices(DisaggregationTypes.Category), false))
                              Height: =40
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "الفئة", "Category")
                              Items: =Choices(DisaggregationTypes.Category)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              SelectMultiple: =false
                        - txtMealSetDTCat:
                            Control: ModernTextInput@1.1.2
