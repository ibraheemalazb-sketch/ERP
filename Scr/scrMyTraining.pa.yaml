Screens:
  scrMyTraining:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "HR");
        Set(VarHRmodule, "Training");
        Set(varNavSelectedID, 17);
        If(IsBlank(varTrainTab), Set(varTrainTab, "Catalog"));
        Set(varShowTrainRequest, false);
        Select(btnTrainReload)
    Children:
      - conscrMyTrainingPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, 64, 16)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =68
            Width: =Parent.Width
          Children:
            - conTrainFail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =96
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =CountRows(colFailedWrites) > 0
                  Width: =Parent.Width
                Children:
                  - lblTrainFail:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("Warning")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "فشلت بعض كتابات السجل أو الإشعارات.", "Some log or notification writes failed.")
                        Width: =Parent.Width
                  - btnTrainFailClear:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "إخفاء", "Dismiss")
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Clear(colFailedWrites)
                        Text: =If(gblLanguage = "Arabic", "إخفاء", "Dismiss")
                        Width: =120
            - conTrainErr:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =72
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varTrainLoadError
                  Width: =Parent.Width
                Children:
                  - lblTrainErr:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("Danger")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =48
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "تعذر تحميل بيانات التدريب. أضف قوائم التدريب ثم حدّث.", "Training data could not be loaded. Add the training lists, then refresh.")
                        Width: =Parent.Width
            - lblTrainHead:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.PageTitle
                  Text: =If(gblLanguage = "Arabic", "تدريبي", "My training")
                  Width: =Parent.Width
            - lblTrainSub:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  Color: =fxThemeColor("TextSecondary")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =32
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.Body
                  Text: =If(gblLanguage = "Arabic", "اطلب برنامجاً، وتابع الموافقات، واحتفظ بشهاداتك.", "Request a course, follow your approvals, and keep your certificates.")
                  Width: =Parent.Width
            - conTrainTabs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =52
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  Width: =Parent.Width
                Children:
                  - btnTabCatalog:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الدليل", "Catalog")
                        Appearance: =If(varTrainTab = "Catalog", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Book"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTrainTab, "Catalog")
                        Text: =If(gblLanguage = "Arabic", "الدليل", "Catalog")
                        Width: =130
                  - btnTabReqs:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "طلباتي", "My requests")
                        Appearance: =If(varTrainTab = "Requests", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Clipboard"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTrainTab, "Requests")
                        Text: =If(gblLanguage = "Arabic", "طلباتي", "My requests")
                        Width: =150
                  - btnTabSess:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "جلساتي", "My sessions")
                        Appearance: =If(varTrainTab = "Sessions", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Calendar"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTrainTab, "Sessions")
                        Text: =If(gblLanguage = "Arabic", "جلساتي", "My sessions")
                        Width: =150
                  - btnTabCert:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "الشهادات", "Certificates")
                        Appearance: =If(varTrainTab = "Certs", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Certificate"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTrainTab, "Certs")
                        Text: =If(gblLanguage = "Arabic", "الشهادات", "Certificates")
                        Width: =150
                  - btnTabEval:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "التقييمات", "Evaluations")
                        Appearance: =If(varTrainTab = "Evals", ButtonAppearance.Primary, ButtonAppearance.Subtle)
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Star"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varTrainTab, "Evals")
                        Text: =If(gblLanguage = "Arabic", "التقييمات", "Evaluations")
                        Width: =150
                  - btnGoDesk:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "مكتب التدريب", "Training desk")
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        Icon: ="Settings"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(scrTrainingManagement, ScreenTransition.None)
                        Text: =If(gblLanguage = "Arabic", "مكتب التدريب", "Training desk")
                        Visible: =Or(hrCanManageTraining, hrCanApprove, hrCanFinanceApprove, hrIsHR)
                        Width: =170
            - txtTrainSearch:
                Control: ModernTextInput@1.1.2
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في الصفوف المحملة", "Search loaded rows")
                  Default: =varTrainSearch
                  Height: =40
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnChange: =Set(varTrainSearch, Self.Text)
                  Placeholder: =If(gblLanguage = "Arabic", "بحث في الصفوف المحملة", "Search loaded rows")
                  Width: =Parent.Width
            - conCatalog:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varTrainTab = "Catalog"
                  Width: =Parent.Width
                Children:
                  - galCourses:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "دليل البرامج", "Course catalog")
                        BorderStyle: =BorderStyle.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =420
                        Items: =Filter(colCoursesPage, IsBlank(varTrainSearch) || varTrainSearch in Coalesce(Title, ""))
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplatePadding: =4
                        TemplateSize: =132
                        Width: =Parent.Width
                      Children:
                        - congalCoursesRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("BorderLight")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Surface")
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              PaddingBottom: =6
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.TemplateWidth
                            Children:
                              - lblCourseName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.CardTitle
                                    Text: =Coalesce(ThisItem.Title, "-")
                                    Width: =Parent.Width - 180
                              - lblCourseMeta:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Caption
                                    Text: =Coalesce(ThisItem.DeliveryMode.Value, "") & "  " & Coalesce(Text(ThisItem.DurationHours), "")
                                    Width: =Parent.Width - 180
                              - btnCourseAsk:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "طلب", "Request")
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =If(App.Width < 700, 44, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Set(varTrainCourseID, ThisItem.ID);
                                      Set(varTrainCourseName, ThisItem.Title);
                                      Set(varTrainSessionID, 0);
                                      Set(varTrainSessionName, "");
                                      Set(varShowTrainRequest, true);
                                      ClearCollect(colCourseSessions, Filter(TrainingSessions, CourseID = ThisItem.ID))
                                    Text: =If(gblLanguage = "Arabic", "طلب", "Request")
                                    Width: =120
                  - lblCatalogEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        Color: =fxThemeColor("TextMuted")
                        Font: =gblTheme.Typography.FontFamily
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Body
                        Text: =If(gblLanguage = "Arabic", "لا يوجد شيء للعرض بعد.", "Nothing to show yet.")
                        Visible: =CountRows(galCourses.AllItems) = 0
                        Width: =Parent.Width
                  - btnCoursesMore:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "تحميل المزيد", "Load more")
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =fxThemeColor("Primary")
                        Height: =If(App.Width < 700, 44, 36)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varCourseCursor, Min(colCoursesPage, ID));
                          Collect(colCoursesPage, FirstN(Filter(TrainingCourses, IsActive = true && ID < varCourseCursor), hrPageSize))
                        Text: =If(gblLanguage = "Arabic", "تحميل المزيد", "Load more")
                        Width: =140
                  - conTrainForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Visible: =varShowTrainRequest
                        Width: =Parent.Width
                      Children:
                        - lblTrainPick:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.SectionTitle
                              Text: =Coalesce(varTrainCourseName, "")
                              Width: =Parent.Width
                        - ddTrainSession:
                            Control: ModernDropdown@1.0.3
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الجلسة", "Session")
                              Default: =Blank()
                              Height: =40
                              ItemDisplayText: =ThisItem.Title
                              Items: =Filter(colCourseSessions, Or(Status.Value = "Open", Status.Value = "Planned"))
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varTrainSessionID, Self.Selected.ID); Set(varTrainSessionName, Self.Selected.Title)
                              Width: =Parent.Width
                        - txtTrainCost:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "التكلفة التقديرية", "Estimated cost")
                              Default: ="0"
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "التكلفة التقديرية", "Estimated cost")
                              Width: =Parent.Width
                        - ddTrainCurrency:
                            Control: ModernDropdown@1.0.3
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "العملة", "Currency")
                              Default: |-
                                ={Value: "USD"}
                              Height: =40
                              ItemDisplayText: =ThisItem.Value
                              Items: |-
                                =Table({Value: "USD"}, {Value: "YER"}, {Value: "SAR"})
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =220
                        - txtTrainWhy:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "المبرر", "Justification")
                              Height: =96
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Placeholder: =If(gblLanguage = "Arabic", "لماذا تحتاج هذا البرنامج؟", "Why do you need this course?")
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                        - conTrainFormBtns:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =52
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              Width: =Parent.Width
                            Children:
                              - btnTrainDraft:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ مسودة", "Save draft")
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =If(App.Width < 700, 44, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varTrainSubmitMode, "Draft"); Select(btnTrainSave)
                                    Text: =If(gblLanguage = "Arabic", "حفظ مسودة", "Save draft")
                                    Width: =140
                              - btnTrainSend:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "إرسال", "Submit")
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =If(App.Width < 700, 44, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varTrainSubmitMode, "Submit"); Select(btnTrainSave)
                                    Text: =If(gblLanguage = "Arabic", "إرسال", "Submit")
                                    Width: =140
                              - btnTrainFormClose:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "إغلاق", "Close")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Height: =If(App.Width < 700, 44, 36)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varShowTrainRequest, false)
                                    Text: =If(gblLanguage = "Arabic", "إغلاق", "Close")
                                    Width: =120
            - conReqs:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Visible: =varTrainTab = "Requests"
                  Width: =Parent.Width
                Children:
                  - galMyReq:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "طلبات التدريب", "My training requests")
                        BorderStyle: =BorderStyle.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =420
                        Items: =colMyTrainReq
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplatePadding: =4
                        TemplateSize: =132
                        Width: =Parent.Width
                      Children:
                        - congalMyReqRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =fxThemeColor("BorderLight")
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Surface")
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =2
                              PaddingBottom: =6
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.TemplateWidth
                            Children:
                              - lblReqTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextPrimary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =28
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Body
                                    Text: =Coalesce(ThisItem.Course.Value, ThisItem.Title, "-")
                                    Width: =Parent.Width - 160
                              - lblReqStatus:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    Color: =fxThemeColor("TextSecondary")
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =22
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Caption
                                    Text: =Coalesce(ThisItem.Status.Value, "-") & "  " & If(IsBlank(ThisItem.RequestNumber), If(gblLanguage = "Arabic", "الرقم قيد الإصدار", "Number pending"), ThisItem.RequestNumber)
                                    Width: =Parent.Width - 160
                              - btnReqCancel:
                                  Control: ModernButton@1.0.0
                                  Properties:
