      - btnTrainReload:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث التدريب", "Refresh training")
            Height: =1
            OnSelect: |-
              =Set(varTrainLoadError, false);
              IfError(
                  Concurrent(
                      ClearCollect(colCoursesPage, FirstN(Sort(Filter(TrainingCourses, IsActive = true), ID, SortOrder.Descending), hrPageSize)),
                      ClearCollect(colTrainCats, Filter(TrainingCategories, IsActive = true)),
                      ClearCollect(colMyTrainReq, FirstN(Filter(TrainingRequests, EmployeeID = gblUser.ID), hrPageSize)),
                      ClearCollect(colMyEnroll, FirstN(Filter(TrainingEnrollments, EmployeeID = gblUser.ID), hrPageSize)),
                      ClearCollect(colMyCerts, FirstN(Filter(TrainingCertificates, EmployeeID = gblUser.ID), hrPageSize)),
                      ClearCollect(colMyEval, FirstN(Filter(TrainingEvaluations, EmployeeID = gblUser.ID), hrPageSize))
                  ),
                  Set(varTrainLoadError, true);
                  Notify(If(gblLanguage = "Arabic", "تعذر تحميل بيانات التدريب. أضف قوائم التدريب ثم حدّث.", "Training data could not be loaded. Add the training lists, then refresh."), NotificationType.Error)
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnTrainSave:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "حفظ طلب التدريب", "Save training request")
            Height: =1
            OnSelect: |-
              =If(
                  Or(Coalesce(varTrainCourseID, 0) <= 0, Len(Trim(Coalesce(txtTrainWhy.Text, ""))) < 10),
                  Notify(If(gblLanguage = "Arabic", "اختر برنامجاً واكتب مبرراً من 10 أحرف على الأقل.", "Choose a course and write a justification of at least 10 characters."), NotificationType.Error),
                  With(
                      {
                          nxt: If(varTrainSubmitMode = "Draft", "Draft", If(hrMyManagerID > 0, "Pending Manager", "Pending HR")),
                          cost: IfError(Value(txtTrainCost.Text), 0),
                          cur: Coalesce(ddTrainCurrency.Selected.Value, "USD")
                      },
                      IfError(
                          Set(
                              varSavedReq,
                              Patch(
                                  TrainingRequests,
                                  Defaults(TrainingRequests),
                                  {
                                      Title: Left(Coalesce(gblUser.FullName, "") & " - " & Coalesce(varTrainCourseName, ""), 255),
                                      Employee: {Id: gblUser.ID, Value: Coalesce(gblUser.FullName, "")},
                                      EmployeeID: gblUser.ID,
                                      Course: {Id: varTrainCourseID, Value: Coalesce(varTrainCourseName, "")},
                                      CourseID: varTrainCourseID,
                                      Session: If(Coalesce(varTrainSessionID, 0) > 0, {Id: varTrainSessionID, Value: Coalesce(varTrainSessionName, "")}, Blank()),
                                      SessionID: If(Coalesce(varTrainSessionID, 0) > 0, varTrainSessionID, Blank()),
                                      Status: {Value: nxt},
                                      ApprovalLevelNum: fnTrainingLevelNum(nxt),
                                      EstimatedCost: cost,
                                      Currency: If(Or(cur = "USD", cur = "YER", cur = "SAR"), {Value: cur}, {Value: "USD"}),
                                      Justification: txtTrainWhy.Text,
                                      ManagerID: hrMyManagerID,
                                      RequestedDate: Now(),
                                      ProjectID: If(Coalesce(gblUser.ProjectID, 0) > 0, gblUser.ProjectID, Blank()),
                                      Priority: {Value: "Medium"}
                                  }
                              )
                          ),
                          Set(varSavedReq, Blank());
                          Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                      );
                      If(
                          !IsBlank(varSavedReq.ID),
                          If(
                              varTrainSubmitMode <> "Draft",
                              fnLogHR("Training Request", varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, ""), "Submitted", "Important", Coalesce(varSavedReq.ProjectID, 0), cost, cur, "Status", "", nxt, "id=" & varSavedReq.ID, "", false);
                              fnApprovalRow(varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, Text(varSavedReq.ID)), "Pending", "Submitted", "", fnApprovalLevelLabel(nxt), gblUser.ID, "Medium");
                              fnNotifyHR(hrMyManagerID, Coalesce(gblCurrentEmployee.Manager.Value, ""), If(gblLanguage = "Arabic", "طلب تدريب بانتظارك", "Training request waiting for you"), If(gblLanguage = "Arabic", "طلب تدريب بانتظار قرارك.", "A training request is waiting for your decision."), "TrainingRequest", varSavedReq.ID, "Approval");
                              Notify(If(gblLanguage = "Arabic", "تم إرسال الطلب.", "Request submitted."), NotificationType.Success),
                              Notify(If(gblLanguage = "Arabic", "تم حفظ المسودة دون إرسال.", "Draft saved. It was not submitted."), NotificationType.Information)
                          );
                          Set(varShowTrainRequest, false);
                          Select(btnTrainReload)
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnTrainCancel:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "إلغاء طلب التدريب", "Cancel training request")
            Height: =1
            OnSelect: |-
              =With(
                  {fresh: LookUp(TrainingRequests, ID = varTrainReqID)},
                  If(
                      Or(IsBlank(fresh.ID), fresh.EmployeeID <> gblUser.ID),
                      Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Error),
                      If(
                          fresh.Status.Value <> varTrainExpected,
                          Notify(If(gblLanguage = "Arabic", "تغيّر هذا الطلب. حدّث الصفحة ثم أعد المحاولة.", "This request changed. Refresh and try again."), NotificationType.Warning),
                          If(
                              Not(Or(fresh.Status.Value = "Draft", fresh.Status.Value = "Pending Manager", fresh.Status.Value = "Returned")),
                              Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Error),
                              IfError(
                                  Set(varSavedReq, Patch(TrainingRequests, fresh, {Status: {Value: "Cancelled"}, ApprovalLevelNum: fnTrainingLevelNum("Cancelled")})),
                                  Set(varSavedReq, Blank());
                                  Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                              );
                              If(
                                  !IsBlank(varSavedReq.ID),
                                  If(
                                      varTrainExpected <> "Draft",
                                      fnLogHR("Training Request", varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, ""), "Cancelled", "Important", Coalesce(varSavedReq.ProjectID, 0), Blank(), "", "Status", varTrainExpected, "Cancelled", "id=" & varSavedReq.ID, "", false);
                                      fnApprovalRow(varSavedReq.ID, Coalesce(varSavedReq.RequestNumber, Text(varSavedReq.ID)), "Cancelled", "Cancelled", "", "Supervisor", gblUser.ID, "Medium")
                                  );
                                  Notify(If(gblLanguage = "Arabic", "تم حفظ القرار.", "Decision saved."), NotificationType.Success);
                                  Select(btnTrainReload)
                              )
                          )
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
      - btnEvalCommit:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: =If(gblLanguage = "Arabic", "إرسال التقييم", "Submit evaluation")
            Height: =1
            OnSelect: |-
              =If(
                  Or(Coalesce(varEvalEnrollID, 0) <= 0, Coalesce(varEvalRating, 0) < 1, Coalesce(varEvalRating, 0) > 5),
                  Notify(If(gblLanguage = "Arabic", "اختر برنامجاً واكتب مبرراً من 10 أحرف على الأقل.", "Choose a course and write a justification of at least 10 characters."), NotificationType.Error),
                  If(
                      !IsBlank(LookUp(colMyEval, EnrollmentID = varEvalEnrollID).ID),
                      Notify(If(gblLanguage = "Arabic", "لا يمكنك اتخاذ إجراء على هذا الطلب.", "You cannot act on this request."), NotificationType.Warning),
                      IfError(
                          Set(
                              varSavedEval,
                              Patch(
                                  TrainingEvaluations,
                                  Defaults(TrainingEvaluations),
                                  {
                                      Title: Left("Evaluation " & varEvalEnrollID, 255),
                                      EnrollmentID: varEvalEnrollID,
                                      EmployeeID: gblUser.ID,
                                      SessionID: varEvalSessionID,
                                      Rating: varEvalRating,
                                      Comments: Coalesce(txtEvalNote.Text, ""),
                                      SubmittedDate: Now()
                                  }
                              )
                          ),
                          Set(varSavedEval, Blank());
                          Notify(If(gblLanguage = "Arabic", "تعذر تحديث الطلب.", "Could not update the request.") & " " & FirstError.Message, NotificationType.Error)
                      );
                      If(
                          !IsBlank(varSavedEval.ID),
                          fnLogHR("Training Enrollment", varEvalEnrollID, "", "Updated", "Info", 0, Blank(), "", "Evaluation", "", Text(varEvalRating), "id=" & varSavedEval.ID & " enrollment=" & varEvalEnrollID, "", false);
                          Notify(If(gblLanguage = "Arabic", "تم حفظ القرار.", "Decision saved."), NotificationType.Success);
                          Select(btnTrainReload)
                      )
                  )
              )
            Text: =""
            Visible: =false
            Width: =1
