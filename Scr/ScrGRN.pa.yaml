                        EnableHover: =true
                        EnableMenu: =true
                        HeaderAction: =""
                        HeaderColumn1: =If(gblLanguage = "Arabic", "تاريخ الاستلام", "Receipt date")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
