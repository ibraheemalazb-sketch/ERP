                        HeaderWhen: =If(gblLanguage = "Arabic", "أمر الشراء", "Purchase order")
                        Height: =Max(550, App.Height - cmpGrTop.Height - If(App.Width < 700, cmpGrPhone.Height, 0) - 240)
                        Items: |-
                          =ForAll(
                              Filter(
                                  colGoodsReceipts,
                                  And(
                                      Or(IsBlank(varGrStatus), varGrStatus = "All", Status.Value = varGrStatus),
                                      Or(Coalesce(varGrProjectID, 0) = 0, ProjectID = varGrProjectID),
                                      Or(Or(IsBlank(varGrReceiver), varGrReceiver = "All"), ReceivedBy.Value = varGrReceiver),
                                      Or(
                                          IsBlank(Trim(txtGrSearch.Text)),
                                          Trim(txtGrSearch.Text) in Coalesce(GRNNumber, ""),
                                          Trim(txtGrSearch.Text) in Coalesce(PONumber, ""),
                                          Trim(txtGrSearch.Text) in Coalesce(Supplier.Value, ""),
                                          Trim(txtGrSearch.Text) in Coalesce(Project.Value, "")
                                      )
                                  )
                              ) As req,
                              {
                                  RowKey: Text(req.ID),
                                  Title: Coalesce(req.GRNNumber, "-"),
                                  Subtitle: Concatenate(Text(Coalesce(req.TotalReceived, 0), "#,##0.00"), " $"),
                                  Column1: If(IsBlank(req.ReceiptDate), "-", Text(req.ReceiptDate, "dd-mmm-yyyy")),
                                  Column2: Coalesce(req.Project.Value, "-"),
                                  Column3: "",
                                  Status: Coalesce(req.Status.Value, "-"),
                                  Tone: Switch(
                                      req.Status.Value,
                                      "Approved", "approved",
                                      "Completed", "completed",
                                      "Posted", "info",
                                      "Rejected", "rejected",
                                      "Cancelled", "danger",
                                      "Submitted", "in progress",
                                      "pending"
                                  ),
                                  Priority: Coalesce(req.InspectionStatus.Value, "-"),
                                  PriorityTone: "medium",
                                  Person: Coalesce(req.ReceivedBy.Value, "-"),
                                  WhenText: Coalesce(req.PONumber, "-"),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: "Box"
                              }
                          )
