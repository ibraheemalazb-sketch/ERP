                        PersonAsAvatar: =
                        RowHeight: =45
                        ShowAction: =true
                        ShowColumn1: =true
                        ShowColumn2: =true
                        ShowColumn3: =false
                        ShowHeader: =true
                        ShowId: =false
                        ShowPerson: =true
                        ShowPriority: =true
                        ShowProgress: =false
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
