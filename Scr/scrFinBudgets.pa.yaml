      - btnBudOpenForm:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =""
            Font: =fontBase
            Size: =fsBody
            FontWeight: =FontWeight.Semibold
            Height: =1
            BorderThickness: =0
            FocusedBorderThickness: =2
            FocusedBorderColor: =FinTheme.Focus
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            PaddingLeft: =12
            PaddingRight: =12
            PaddingTop: =0
            PaddingBottom: =0
            TabIndex: =-1
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DisabledFill: =RGBA(0, 0, 0, 0)
            DisabledColor: =FinTheme.TextSecondary
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Color: =FinTheme.Primary
            BorderColor: =RGBA(0, 0, 0, 0)
            HoverFill: =FinTheme.RowHover
            HoverColor: =FinTheme.Primary
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            PressedFill: =FinTheme.RowSelected
            PressedColor: =FinTheme.Primary
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            Visible: =false
            X: =0
            Y: =0
            Width: =1
            OnSelect: |-
              =With(
                  {_b: If(varBudgetEditID > 0, LookUp(colBudgetLines, ID = varBudgetEditID))},
                  If(
                      !canEditBudgets || (varBudgetEditID > 0 && IsBlank(_b)),
                      Notify(fnT("bud.cannotEdit", "You cannot edit this budget line."), NotificationType.Warning);
                      Set(varBudgetEditID, 0),
                      UpdateContext({
                          locReturnToDetail: varBudgetEditID > 0,
                          locForm: {
                              ID: Coalesce(_b.ID, 0), Title: _b.Title, Code: _b.BudgetLineCode, Description: _b.Description,
                              Category: _b.Category, SubCategory: _b.SubCategory, CostGroup: _b.CostGroup,
                              HolderID: Coalesce(_b.HolderID, 0), Holder: _b.Holder, Currency: _b.Currency,
                              Total: _b.TotalAmount, Partner: _b.PartnerShare, HSA: _b.HSAShare,
                              Committed: _b.CommittedAmount, Spent: _b.SpentAmount, Remaining: _b.RemainingBalance
                          },
                          locTriedSave: false, locDirty: false, locFormOpen: true
                      });
                      Reset(txtBudFCode); Reset(txtBudFDesc); Reset(txtBudFCat); Reset(txtBudFSub); Reset(txtBudFCostGroup);
                      Reset(txtBudFTotal); Reset(txtBudFPartner); Reset(txtBudFHSA); Reset(txtBudFReason); Reset(txtBudFHolderSearch);
                      Reset(drpBudFHolder); Reset(drpBudFCurrency);
                      // Employees for the holder dropdown: once per session, max 2000 rows (data row limit) - see N13
                      If(
                          IsEmpty(colEmpLite),
                          IfError(
                              ClearCollect(colEmpLite, ForAll(FirstN(Sort(Employees, ID, SortOrder.Ascending), 2000) As e, {Key: e.ID, Value: e.FullName})),
                              Trace("Employees load failed: " & FirstError.Message, TraceSeverity.Warning)
                          )
                      );
                      Set(varBudgetEditID, 0)
                  )
              )
