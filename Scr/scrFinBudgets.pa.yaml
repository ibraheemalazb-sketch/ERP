# scrFinBudgets - full screen source (pa.yaml v3). Reference/Git copy: a whole screen cannot be pasted in Studio.
# To build: create a blank screen named scrFinBudgets, set its properties from 03-screens-batch-a.md,
# then paste screens/paste/scrFinBudgets.controls.pa.yaml onto it.
Screens:
  scrFinBudgets:
    Properties:
      Fill: =FinTheme.Background
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Finance");
        Set(varNavSelectedID, 53);
        If(
            !hasFinanceAccess,
            Navigate(scrFinNoAccess, ScreenTransition.None),
            UpdateContext({locMoreOpen: false, locNotifOpen: false, locDlg: "", locDirty: false, locFormOpen: false,
                locSortCol: Coalesce(locSortCol, "Primary"), locSortDesc: Coalesce(locSortDesc, false)});
            fnRefreshHeaderData();
            If(
                Coalesce(varProjectID, 0) > 0 && !IsBlank(LookUp(colMyProjects, ID = varProjectID)),
                If(
                    varBudgetLinesProjectID <> varProjectID,
                    Select(btnBudReload),
                    Coalesce(varBudgetEditID, 0) > 0, Select(btnBudOpenForm)
                )
            )
        )
      LoadingSpinner: =LoadingSpinner.None
    Children:
      - cmpNav_Bud:
          Control: CanvasComponent
          ComponentName: cmpNavigationModern
          Properties:
            AppLogo: =hdp
            Expanded: =gblMenuExpanded
            Height: =Parent.Height
            Icons: |-
              =Table({Name: "Home", SVG: ""})
            OnToggle: |-
              =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
              If(!gblMenuExpanded, Set(gblNavOpenId, -1))
            Theme: =gblTheme.Mode
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
      - cmpTop_Bud:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =Coalesce(unreadCount, 0)
            HasNotifications: =Coalesce(unreadCount, 0) > 0
            Height: =56
            ModuleIcon: ="Money"
            ModuleName: =If(gblLanguage = "Arabic", "المالية", "Finance")
            OnSelect: |-
              =UpdateContext({locNotifOpen: true})
            OnSelectTitle: =Navigate(scrFinance, ScreenTransition.None)
            ScreenTitle: =fnT("nav.budgets", "Budgets")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =Parent.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpPhone_Bud:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conBudRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =56
            PaddingRight: =0
            PaddingBottom: =If(App.Width < 700, 52, 0)
            PaddingLeft: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =FinTheme.Background
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conBudMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =0
                  LayoutWrap: =false
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - cmpCtx_Bud:
                    Control: CanvasComponent
                    ComponentName: cmpFinContext
                    Properties:
                      ProjectOptions: |-
                        =Table({Key: 0, Value: fnT("hdr.allProjects", "All my projects")}, colProjectOptions)
                      PeriodOptions: =tblPeriods
                      DefaultProjectKey: =Coalesce(varProjectID, 0)
                      DefaultPeriodKey: =Coalesce(varPeriodKey, currentPeriodKey)
                      Height: =48
                      FillPortions: =0
                      AlignInContainer: =AlignInContainer.Stretch
                      LayoutMinWidth: =0
                      LayoutMinHeight: =0
                      OnProjectChange: |-
                        =If(locFormOpen, Notify(fnT("bud.closeFormFirst", "Close the form before changing the project."), NotificationType.Warning),
                        Set(varProjectID, cmpCtx_Bud.SelectedProjectKey);
                        If(Coalesce(varProjectID, 0) > 0 && !IsBlank(LookUp(colMyProjects, ID = varProjectID)), Select(btnBudReload)))
                      OnPeriodChange: =Set(varPeriodKey, cmpCtx_Bud.SelectedPeriodKey)
                  - conBudBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =sp2
                        LayoutWrap: =false
                        PaddingTop: =If(isMobile, sp2, sp3)
                        PaddingRight: =If(isMobile, sp2, sp3)
                        PaddingBottom: =If(isMobile, sp2 + 72, sp3)
                        PaddingLeft: =If(isMobile, sp2, sp3)
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutOverflowY: =LayoutOverflow.Scroll
                      Children:
                        - cmpEmpty_BudPick:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =Coalesce(varProjectID, 0) = 0
                              Variant: ="empty"
                              Title: =fnT("bud.chooseTitle", "Choose a project")
                              Message: =fnT("bud.chooseMsg", "Budget lines are managed per project. Select a project in the header.")
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - cmpEmpty_BudNoAccess:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =Coalesce(varProjectID, 0) > 0 && IsBlank(LookUp(colMyProjects, ID = varProjectID))
                              Variant: ="noaccess"
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - cmpEmpty_BudErr:
                            Control: CanvasComponent
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =locError
                              Variant: ="error"
                              ActionText: =fnT("common.retry", "Retry")
                              Height: =240
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              OnAction: =Select(btnBudReload)
                        - conBudToolbar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =sp1
                              LayoutWrap: =true
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              DropShadow: =DropShadow.None
                              BorderThickness: =0
                              Fill: =RGBA(0, 0, 0, 0)
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =Coalesce(varProjectID, 0) > 0 && !IsBlank(LookUp(colMyProjects, ID = varProjectID)) && !locError
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =If(isMobile, 4 * touchMin + 3 * sp1, If(isTablet, 2 * touchMin + sp1, touchMin))
                            Children:
                              - txtBudSearch:
                                  Control: Classic/TextInput@2.3.2
                                  Properties:
                                    Default: =""
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =FinTheme.Surface
                                    BorderColor: =FinTheme.Border
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    HoverFill: =FinTheme.Surface
                                    HoverBorderColor: =FinTheme.Primary
                                    HintText: =fnT("bud.search", "Search code or description")
                                    Height: =touchMin
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    Align: =alignStart
                                    TabIndex: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Width: =If(isMobile, Parent.Width, 260)
                                    FillPortions: =0
                                    AccessibleLabel: =fnT("bud.search", "Search code or description")
                                    DelayOutput: =true
                              - drpBudCat:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =FinTheme.Surface
                                    BorderColor: =FinTheme.Border
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    HoverFill: =FinTheme.RowHover
                                    HoverBorderColor: =FinTheme.Primary
                                    HoverColor: =FinTheme.Text
                                    PressedFill: =FinTheme.RowSelected
                                    PressedColor: =FinTheme.Text
                                    SelectionFill: =FinTheme.Primary
                                    SelectionColor: =FinTheme.OnPrimary
                                    ChevronBackground: =FinTheme.Surface
                                    ChevronFill: =FinTheme.TextSecondary
                                    PaddingLeft: =8
                                    Height: =touchMin
                                    TabIndex: =0
                                    AllowEmptySelection: =false
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Items: |-
                                      =Table({Key: "", Value: fnT("bud.allCategories", "All categories")}, ForAll(Sort(Distinct(Filter(colBudgetLines, !IsBlank(Category)), Category), Value, SortOrder.Ascending) As c, {Key: c.Value, Value: c.Value}))
                                    Width: =If(isMobile, Parent.Width, 180)
                                    FillPortions: =0
                                    AccessibleLabel: =fnT("bud.category", "Category")
                              - drpBudFund:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =FinTheme.Surface
                                    BorderColor: =FinTheme.Border
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    HoverFill: =FinTheme.RowHover
                                    HoverBorderColor: =FinTheme.Primary
                                    HoverColor: =FinTheme.Text
                                    PressedFill: =FinTheme.RowSelected
                                    PressedColor: =FinTheme.Text
                                    SelectionFill: =FinTheme.Primary
                                    SelectionColor: =FinTheme.OnPrimary
                                    ChevronBackground: =FinTheme.Surface
                                    ChevronFill: =FinTheme.TextSecondary
                                    PaddingLeft: =8
                                    Height: =touchMin
                                    TabIndex: =0
                                    AllowEmptySelection: =false
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Items: |-
                                      =Table({Key: "", Value: fnT("bud.allFunding", "All funding")}, {Key: "partner", Value: fnT("bud.fundPartner", "Has partner share")}, {Key: "hsa", Value: fnT("bud.fundHSA", "Has HSA share")}, {Key: "both", Value: fnT("bud.fundBoth", "Partner and HSA")})
                                    Width: =If(isMobile, Parent.Width, 180)
                                    FillPortions: =0
                                    AccessibleLabel: =fnT("bud.funding", "Funding source")
                              - drpBudUtil:
                                  Control: Classic/DropDown@2.3.1
                                  Properties:
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =FinTheme.Surface
                                    BorderColor: =FinTheme.Border
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    HoverFill: =FinTheme.RowHover
                                    HoverBorderColor: =FinTheme.Primary
                                    HoverColor: =FinTheme.Text
                                    PressedFill: =FinTheme.RowSelected
                                    PressedColor: =FinTheme.Text
                                    SelectionFill: =FinTheme.Primary
                                    SelectionColor: =FinTheme.OnPrimary
                                    ChevronBackground: =FinTheme.Surface
                                    ChevronFill: =FinTheme.TextSecondary
                                    PaddingLeft: =8
                                    Height: =touchMin
                                    TabIndex: =0
                                    AllowEmptySelection: =false
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Items: |-
                                      =Table({Key: "", Value: fnT("bud.allUtil", "Any utilization")}, {Key: "ok", Value: fnT("bud.utilOk", "Below") & " " & fnPct(utilWarnAt)}, {Key: "warn", Value: fnPct(utilWarnAt) & " - " & fnPct(utilOverAt)}, {Key: "over", Value: fnT("bud.utilOver", "Over") & " " & fnPct(utilOverAt)})
                                    Width: =If(isMobile, Parent.Width, 180)
                                    FillPortions: =0
                                    AccessibleLabel: =fnT("bud.utilization", "Utilization")
                              - lblBudSpacer:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =""
                                    Font: =fontBase
                                    Size: =fsBody
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =false
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =1
                                    FillPortions: =1
                                    Visible: =!isMobile
                              - btnBudNew:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =fnT("bud.newLine", "New budget line")
                                    Font: =fontBase
                                    Size: =fsBody
                                    FontWeight: =FontWeight.Semibold
                                    Height: =touchMin
                                    BorderThickness: =1
                                    FocusedBorderThickness: =2
                                    FocusedBorderColor: =FinTheme.Focus
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    TabIndex: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    DisabledFill: =FinTheme.Border
                                    DisabledColor: =FinTheme.TextSecondary
                                    DisabledBorderColor: =FinTheme.Border
                                    Fill: =FinTheme.Primary
                                    Color: =FinTheme.OnPrimary
                                    BorderColor: =FinTheme.Primary
                                    HoverFill: =ColorFade(FinTheme.Primary, -0.12)
                                    HoverColor: =FinTheme.OnPrimary
                                    HoverBorderColor: =FinTheme.Primary
                                    PressedFill: =ColorFade(FinTheme.Primary, -0.24)
                                    PressedColor: =FinTheme.OnPrimary
                                    PressedBorderColor: =FinTheme.Primary
                                    Visible: =canEditBudgets && !isMobile
                                    Width: =180
                                    FillPortions: =0
                                    OnSelect: =Set(varBudgetEditID, -1); Select(btnBudOpenForm)
                        - conBudTotals:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =sp1
                              LayoutWrap: =false
                              PaddingTop: =sp2
                              PaddingRight: =sp2
                              PaddingBottom: =sp2
                              PaddingLeft: =sp2
                              DropShadow: =DropShadow.None
                              BorderThickness: =borderWidth
                              Fill: =FinTheme.Surface
                              RadiusTopLeft: =radiusCard
                              RadiusTopRight: =radiusCard
                              RadiusBottomLeft: =radiusCard
                              RadiusBottomRight: =radiusCard
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              BorderColor: =FinTheme.Border
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Visible: =Coalesce(varProjectID, 0) > 0 && !IsBlank(LookUp(colMyProjects, ID = varProjectID)) && !locError && !IsEmpty(colBudgetLines)
                              Height: =28 + sp1 + 64 + sp1 + 46 + sp2 * 2
                            Children:
                              - lblBudTotalsT:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      =fnT("bud.totals", "Totals (USD) for the filtered lines") & " - " & fnCount(CountRows(Filter(
                                              colBudgetLines,
                                              drpBudCat.Selected.Key = "" || Category = drpBudCat.Selected.Key,
                                              Switch(drpBudFund.Selected.Key, "partner", Coalesce(PartnerShare, 0) > 0, "hsa", Coalesce(HSAShare, 0) > 0, "both", Coalesce(PartnerShare, 0) > 0 && Coalesce(HSAShare, 0) > 0, true),
                                              Switch(drpBudUtil.Selected.Key, "ok", Coalesce(Util, 0) < utilWarnAt, "warn", Util >= utilWarnAt && Util <= utilOverAt, "over", Util > utilOverAt, true),
                                              IsBlank(txtBudSearch.Text) || StartsWith(BudgetLineCode, Trim(txtBudSearch.Text)) || Trim(txtBudSearch.Text) in Description
                                          ))) & " " & fnT("kpi.lines", "budget lines")
                                    Font: =fontBase
                                    Size: =fsSection
                                    Color: =FinTheme.Text
                                    Fill: =RGBA(0, 0, 0, 0)
                                    BorderThickness: =0
                                    Wrap: =true
                                    Align: =alignStart
                                    VerticalAlign: =VerticalAlign.Middle
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =28
                                    FontWeight: =FontWeight.Semibold
                                    Role: =TextRole.Heading3
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                              - cmpUtil_BudTotal:
                                  Control: CanvasComponent
                                  ComponentName: cmpUtilizationBar
                                  Properties:
                                    Budgeted: |-
                                      =Sum(Filter(
                                              colBudgetLines,
                                              drpBudCat.Selected.Key = "" || Category = drpBudCat.Selected.Key,
                                              Switch(drpBudFund.Selected.Key, "partner", Coalesce(PartnerShare, 0) > 0, "hsa", Coalesce(HSAShare, 0) > 0, "both", Coalesce(PartnerShare, 0) > 0 && Coalesce(HSAShare, 0) > 0, true),
                                              Switch(drpBudUtil.Selected.Key, "ok", Coalesce(Util, 0) < utilWarnAt, "warn", Util >= utilWarnAt && Util <= utilOverAt, "over", Util > utilOverAt, true),
                                              IsBlank(txtBudSearch.Text) || StartsWith(BudgetLineCode, Trim(txtBudSearch.Text)) || Trim(txtBudSearch.Text) in Description
                                          ), TotalUSD)
                                    Committed: |-
                                      =Sum(Filter(
                                              colBudgetLines,
                                              drpBudCat.Selected.Key = "" || Category = drpBudCat.Selected.Key,
                                              Switch(drpBudFund.Selected.Key, "partner", Coalesce(PartnerShare, 0) > 0, "hsa", Coalesce(HSAShare, 0) > 0, "both", Coalesce(PartnerShare, 0) > 0 && Coalesce(HSAShare, 0) > 0, true),
                                              Switch(drpBudUtil.Selected.Key, "ok", Coalesce(Util, 0) < utilWarnAt, "warn", Util >= utilWarnAt && Util <= utilOverAt, "over", Util > utilOverAt, true),
                                              IsBlank(txtBudSearch.Text) || StartsWith(BudgetLineCode, Trim(txtBudSearch.Text)) || Trim(txtBudSearch.Text) in Description
                                          ), CommittedUSD)
                                    Spent: |-
                                      =Sum(Filter(
                                              colBudgetLines,
                                              drpBudCat.Selected.Key = "" || Category = drpBudCat.Selected.Key,
                                              Switch(drpBudFund.Selected.Key, "partner", Coalesce(PartnerShare, 0) > 0, "hsa", Coalesce(HSAShare, 0) > 0, "both", Coalesce(PartnerShare, 0) > 0 && Coalesce(HSAShare, 0) > 0, true),
                                              Switch(drpBudUtil.Selected.Key, "ok", Coalesce(Util, 0) < utilWarnAt, "warn", Util >= utilWarnAt && Util <= utilOverAt, "over", Util > utilOverAt, true),
                                              IsBlank(txtBudSearch.Text) || StartsWith(BudgetLineCode, Trim(txtBudSearch.Text)) || Trim(txtBudSearch.Text) in Description
                                          ), SpentUSD)
                                    Currency: ="USD"
                                    ShowLabel: =true
                                    ShowLegend: =true
                                    BarHeight: =12
                                    Height: =64
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                              - conBudTotalsRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutGap: =sp2
                                    LayoutWrap: =false
                                    PaddingTop: =0
                                    PaddingRight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    DropShadow: =DropShadow.None
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    Height: =46
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                  Children:
                                    - lblBudTotBudget:
                                        Control: Label@2.5.1
                                        Properties:
                                          Text: |-
                                            =fnT("kpi.budget", "Budget") & Char(10) & fnMoney(Sum(Filter(
                                                    colBudgetLines,
                                                    drpBudCat.Selected.Key = "" || Category = drpBudCat.Selected.Key,
                                                    Switch(drpBudFund.Selected.Key, "partner", Coalesce(PartnerShare, 0) > 0, "hsa", Coalesce(HSAShare, 0) > 0, "both", Coalesce(PartnerShare, 0) > 0 && Coalesce(HSAShare, 0) > 0, true),
                                                    Switch(drpBudUtil.Selected.Key, "ok", Coalesce(Util, 0) < utilWarnAt, "warn", Util >= utilWarnAt && Util <= utilOverAt, "over", Util > utilOverAt, true),
                                                    IsBlank(txtBudSearch.Text) || StartsWith(BudgetLineCode, Trim(txtBudSearch.Text)) || Trim(txtBudSearch.Text) in Description
                                                ), TotalUSD), "USD")
                                          Font: =fontBase
                                          Size: =fsCaption
                                          Color: =FinTheme.Text
                                          Fill: =RGBA(0, 0, 0, 0)
                                          BorderThickness: =0
                                          Wrap: =true
                                          Align: =alignStart
                                          VerticalAlign: =VerticalAlign.Middle
                                          PaddingTop: =0
                                          PaddingRight: =0
