                                =UpdateContext({locTriedSave: true});
                                If(
                                    !((!IsBlank(Trim(txtBudFCode.Text))) && (IsBlank(LookUp(colBudgetLines, Lower(BudgetLineCode) = Lower(Trim(txtBudFCode.Text)) && ID <> locForm.ID))) && (Value(txtBudFTotal.Text) > 0) && (Abs(Value(txtBudFPartner.Text) + Value(txtBudFHSA.Text) - Value(txtBudFTotal.Text)) < 0.01) && (locForm.ID = 0 || Value(txtBudFTotal.Text) >= Coalesce(locForm.Committed, 0) + Coalesce(locForm.Spent, 0)) && (!IsBlank(drpBudFCurrency.Selected.Value)) && (!(locForm.ID > 0 && (Value(txtBudFTotal.Text) <> locForm.Total || Value(txtBudFPartner.Text) <> Coalesce(locForm.Partner, 0) || Value(txtBudFHSA.Text) <> Coalesce(locForm.HSA, 0) || drpBudFCurrency.Selected.Value <> locForm.Currency)) || Len(Trim(txtBudFReason.Text)) >= cfgReasonMinChars)),
                                    Notify(fnT("form.fixErrors", "Please correct the highlighted fields."), NotificationType.Error),
                                    With(
                                        {
                                            _isNew: locForm.ID = 0, _code: Trim(txtBudFCode.Text), _total: Value(txtBudFTotal.Text),
                                            _partner: Value(txtBudFPartner.Text), _hsa: Value(txtBudFHSA.Text), _cur: drpBudFCurrency.Selected.Value,
                                            _holder: drpBudFHolder.Selected, _proj: LookUp(colMyProjects, ID = varProjectID), _corr: Text(GUID()),
                                            _money: locForm.ID > 0 && (Value(txtBudFTotal.Text) <> locForm.Total || Value(txtBudFPartner.Text) <> Coalesce(locForm.Partner, 0) || Value(txtBudFHSA.Text) <> Coalesce(locForm.HSA, 0) || drpBudFCurrency.Selected.Value <> locForm.Currency)
                                        },
                                        // field-level change table for the audit log (only changed fields are logged)
                                        With(
                                            {
                                                _chg: Filter(
                                                    Table(
                                                        {F: "BudgetLineCode", O: locForm.Code, N: _code},
                                                        {F: "Description", O: locForm.Description, N: txtBudFDesc.Text},
                                                        {F: "Category", O: locForm.Category, N: Trim(txtBudFCat.Text)},
                                                        {F: "SubCategory", O: locForm.SubCategory, N: Trim(txtBudFSub.Text)},
                                                        {F: "CostGroup", O: locForm.CostGroup, N: Trim(txtBudFCostGroup.Text)},
                                                        {F: "BudgetLineHolder", O: locForm.Holder, N: If(_holder.Key = 0, "", _holder.Value)},
                                                        {F: "Currency", O: locForm.Currency, N: _cur},
                                                        {F: "TotalAmount", O: Text(locForm.Total), N: Text(_total)},
                                                        {F: "PartnerShare", O: Text(locForm.Partner), N: Text(_partner)},
                                                        {F: "HSAShare", O: Text(locForm.HSA), N: Text(_hsa)}
                                                    ),
                                                    Coalesce(O, "") <> Coalesce(N, "")
                                                )
                                            },
                                            If(
                                                !_isNew && IsEmpty(_chg),
                                                UpdateContext({locFormOpen: false, locDirty: false}),
                                                UpdateContext({locSaving: true});
                                                IfError(
                                                    UpdateContext({locSaved: Patch(
                                                        Budgets,
                                                        If(_isNew, Defaults(Budgets), LookUp(Budgets, ID = locForm.ID)),
                                                        {
                                                            Title: If(_isNew, _code, Coalesce(locForm.Title, _code)),
                                                            Project: {Id: varProjectID, Value: _proj.Title},
                                                            ProjectID: varProjectID,
                                                            BudgetLineCode: _code,
                                                            Description: txtBudFDesc.Text,
                                                            Category: Trim(txtBudFCat.Text),
                                                            SubCategory: Trim(txtBudFSub.Text),
                                                            CostGroup: Trim(txtBudFCostGroup.Text),
                                                            Currency: {Value: _cur},
                                                            TotalAmount: _total,
                                                            PartnerShare: _partner,
                                                            HSAShare: _hsa,
                                                            BudgetLineHolder: If(_holder.Key = 0, Blank(), {Id: _holder.Key, Value: _holder.Value})
                                                        }
                                                    )}),
                                                    UpdateContext({locSaving: false});
                                                    Notify(fnT("bud.saveError", "The budget line could not be saved.") & " " & FirstError.Message, NotificationType.Error),
                                                    // success: audit log (Critical when money fields of an existing line change), reload, close
                                                    fnLogActivityFull(
                                                        "Budget Line", locSaved.ID, _code, If(_isNew, "Created", "Updated"),
                                                        If(_isNew, "Important", _money, "Critical", "Info"),
                                                        varProjectID, _proj.ProjectCode,
                                                        Left(Concat(_chg, F, ", "), 255), Left(Concat(_chg, F & "=" & O, "; "), 2000), Left(Concat(_chg, F & "=" & N, "; "), 2000),
                                                        If(_isNew, "Budget line created", _money, "Budget revision", "Budget line details updated"),
                                                        If(_money, Trim(txtBudFReason.Text), ""), _total, _cur, _corr
                                                    );
                                                    // optimistic UI: refresh only this line in colBudgetLines (same shape as fnLoadBudgetLines)
                                                    With(
                                                        {_s: locSaved},
                                                        With(
                                                            {_row: {
                                                                ID: _s.ID, ProjectID: _s.ProjectID, Title: _s.Title, BudgetLineCode: _s.BudgetLineCode,
                                                                Category: _s.Category, SubCategory: _s.SubCategory, CostGroup: _s.CostGroup, Description: _s.Description,
                                                                Currency: _s.Currency.Value, TotalAmount: _s.TotalAmount, CommittedAmount: _s.CommittedAmount,
                                                                SpentAmount: _s.SpentAmount, RemainingBalance: _s.RemainingBalance, PartnerShare: _s.PartnerShare,
                                                                HSAShare: _s.HSAShare, PayrollAmount: _s.PayrollAmount, ProcurementAmount: _s.ProcurementAmount,
                                                                HolderID: _s.BudgetLineHolder.Id, Holder: _s.BudgetLineHolder.Value,
                                                                TotalUSD: fnToUSD(_s.TotalAmount, _s.Currency.Value), CommittedUSD: fnToUSD(_s.CommittedAmount, _s.Currency.Value),
                                                                SpentUSD: fnToUSD(_s.SpentAmount, _s.Currency.Value), RemainingUSD: fnToUSD(_s.RemainingBalance, _s.Currency.Value),
                                                                PayrollUSD: fnToUSD(_s.PayrollAmount, _s.Currency.Value),
                                                                Util: fnUtilRatio(_s.TotalAmount, _s.CommittedAmount, _s.SpentAmount)
                                                            }},
                                                            If(
                                                                _isNew || IsBlank(LookUp(colBudgetLines, ID = _s.ID)),
                                                                Collect(colBudgetLines, _row),
                                                                Patch(colBudgetLines, LookUp(colBudgetLines, ID = _s.ID), _row)
                                                            )
                                                        )
                                                    );
                                                    UpdateContext({locSaving: false, locFormOpen: false, locDirty: false});
                                                    Notify(fnT("bud.saved", "Budget line saved."), NotificationType.Success);
                                                    If(locReturnToDetail, Set(varBudgetLineID, locSaved.ID); Navigate(scrFinBudgetDetail, ScreenTransition.None))
                                                )
                                            )
                                        )
                                    )
                                )
                              DisplayMode: =If(locSaving, DisplayMode.Disabled, DisplayMode.Edit)
                              Tooltip: =fnT("bud.saveLine", "Save budget line")
      - cmpDlgDiscard_Bud:
          Control: CanvasComponent
          ComponentName: cmpConfirmDialog
          Properties:
            Visible: =locDlg = "discard"
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Title: =fnT("dlg.discardTitle", "Discard changes?")
            Message: =fnT("dlg.discardMsg", "Your changes have not been saved. Leave and lose them?")
            ConfirmText: =fnT("dlg.discard", "Discard")
            CancelText: =fnT("dlg.keepEditing", "Keep editing")
            Destructive: =true
            RequireReason: =false
            ShowReason: =false
            Busy: =false
            OnCancel: |-
              =UpdateContext({locDlg: ""})
            OnConfirm: |-
              =UpdateContext({locDlg: "", locDirty: false});
              UpdateContext({locFormOpen: false});
              If(
                  locPendingNav = "back", Back(),
                  locPendingNav = "close", false,
                  fnNavigate(locPendingNav)
              )
      - cmpNotif_Bud:
          Control: CanvasComponent
          ComponentName: cmpNotificationsPanel
          Properties:
            Visible: =locNotifOpen
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: |-
              =ForAll(colFinNotif As n, {ID: n.ID, Title: n.Title, Message: n.Message, Created: n.Created, Link: n.Link, RelatedEntity: n.RelatedEntity.Value, RelatedItemID: n.RelatedItemID})
            OnClose: |-
              =UpdateContext({locNotifOpen: false})
            OnMarkAllRead: =fnMarkAllNotificationsRead()
            OnOpenItem: |-
              =UpdateContext({locNotifOpen: false});
              fnOpenNotification(cmpNotif_Bud.SelectedItem.ID, cmpNotif_Bud.SelectedItem.RelatedEntity, cmpNotif_Bud.SelectedItem.RelatedItemID, cmpNotif_Bud.SelectedItem.Link)
