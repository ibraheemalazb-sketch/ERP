Screens:
  ScrApprovalCenter:
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Background,
            gblTheme.Light.Colors.Background
        )
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gblSelectedApproval, Blank());
        Set(varShowApprovalDialog, false);
        Set(ShowFilter, false);
        Set(varApprovalSearch, "");
        Set(varApprovalModule, Blank());
        Set(varApprovalRequestType, Blank());
        Set(varApprovalEntityType, Blank());
        Set(varApprovalDecision, "Pending");
        Set(varApprovalShowKpi, App.Width >= 700);
        Set(
            varApprovalView,
            If(App.Width < 700, "List", "Table")
        );
        Reset(cmpApprovalTable);
        Reset(cmpApprovalView);
        If(
            IsBlank(gblMenuExpanded),
            Set(gblMenuExpanded, true)
        );
        If(
            !IsBlank(gblUser.ID),
            ClearCollect(
                colApprovalCenter,
                Sort(
                    Filter(
                        ApprovalHistory,
                        ApproverID = gblUser.ID
                    ),
                    AssignedDate,
                    SortOrder.Descending
                )
            )
        )
    Children:
      - conApprovalPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0,0,0,0)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpApprovalPhoneNav.Height, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpApprovalTopBar.Height + 8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblApprovalTitle:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.TextPrimary,
                        gblTheme.Light.Colors.TextPrimary
                    )
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Medium
                  Height: =22
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =16
                  Text: =If(gblLanguage = "Arabic", "مركز الموافقات", "Approval Center")
            - lblApprovalCount:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.TextMuted,
                        gblTheme.Light.Colors.TextMuted
                    )
                  Font: =gblTheme.Typography.FontFamily
                  Height: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =11
                  Text: |-
                    =Text(
                        CountRows(
                            Filter(
                                colApprovalCenter,
                                Decision.Value = "Pending"
                            )
                        )
                    ) & " " & If(gblLanguage = "Arabic", "بانتظار القرار", "pending")
                  Width: =Parent.Width
            - btnApprovalKpi:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        varApprovalShowKpi,
                        If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                        If(gblLanguage = "Arabic", "إظهار المؤشرات", "Show KPIs")
                    )
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Outline
                  Height: =32
                  Icon: =If(varApprovalShowKpi, "ChevronUp", "ChevronDown")
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Set(varApprovalShowKpi, !varApprovalShowKpi)
                  Text: |-
                    =If(
                        varApprovalShowKpi,
                        If(gblLanguage = "Arabic", "إخفاء المؤشرات", "Hide KPIs"),
                        If(gblLanguage = "Arabic", "إظهار المؤشرات", "Show KPIs")
                    )
                  Visible: =App.Width < 700
                  Width: =Parent.Width
            - cmpApprovalKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AnimationEffect: ="pop"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 4,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "ClipboardCheck",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Pending")),
                            Label: If(gblLanguage = "Arabic", "قيد الانتظار", "Pending"),
                            Subtitle: If(gblLanguage = "Arabic", "بانتظار قرارك", "Awaiting your decision"),
                            Screen: "Pending",
                            IconBg: If(gblTheme.Mode = "Dark", "rgb(23,32,48)", "rgb(236,242,255)"),
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(121,176,255)", "rgb(27,86,229)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Check",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Approved")),
                            Label: If(gblLanguage = "Arabic", "تمت الموافقة", "Approved"),
                            Subtitle: If(gblLanguage = "Arabic", "قرارات مكتملة", "Decisions completed"),
                            Screen: "Approved",
                            IconBg: If(gblTheme.Mode = "Dark", "rgb(20,83,45)", "rgb(240,253,244)"),
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(74,222,128)", "rgb(22,163,74)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Warning",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Rejected")),
                            Label: If(gblLanguage = "Arabic", "مرفوض", "Rejected"),
                            Subtitle: If(gblLanguage = "Arabic", "طلبات مرفوضة", "Requests turned down"),
                            Screen: "Rejected",
                            IconBg: If(gblTheme.Mode = "Dark", "rgb(99,36,36)", "rgb(254,242,242)"),
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(248,113,113)", "rgb(220,38,38)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Clock",
                            Value: CountRows(
                                Filter(
                                    colApprovalCenter,
                                    Decision.Value = "Pending",
                                    AssignedDate < DateAdd(Now(), -2, TimeUnit.Days)
                                )
                            ),
                            Label: If(gblLanguage = "Arabic", "متأخرة", "Waiting"),
                            Subtitle: If(gblLanguage = "Arabic", "أكثر من يومين", "Open more than 2 days"),
                            Screen: "Overdue",
                            IconBg: If(gblTheme.Mode = "Dark", "rgb(92,64,14)", "rgb(255,251,235)"),
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(251,191,36)", "rgb(217,119,6)"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FontsSizesTitle: =12
                  Height: |-
                    =If(
                        Or(App.Width >= 700, varApprovalShowKpi),
                        With(
                            {
                                cols: If(Parent.Width < 640, 1, If(Parent.Width < 1024, 2, 4))
                            },
                            RoundUp(4 / cols, 0) * 108
                        ),
                        0
                    )
                  Visible: =Or(App.Width >= 700, varApprovalShowKpi)
                  Icons: |-
                    =Table(
                        {
                            Name: "ClipboardCheck",
                            SVG: ""
                        }
                    )
                  IconsSize: =30
                  IsLoading: =false
                  KPINav: =
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: |-
                    =Set(
                        varApprovalDecision,
                        Switch(
                            varClickScreen,
                            "Approved", "Approved",
                            "Rejected", "Rejected",
                            "Pending"
                        )
                    )
                  Style: ="Compact"
                  StyleConfig: |-
                    ={
                        colors: {
                            cardBg: ColorValue("#FFFFFF"),
                            border: ColorValue("#E5E7EB"),
                            text: ColorValue("#111827"),
                            textMuted: ColorValue("#6B7280"),
                            positive: ColorValue("#22C55E"),
                            negative: ColorValue("#EF4444"),
                            neutral: ColorValue("#9E9E9E"),
                            skeletonBase: ColorValue("#E5E7EB"),
                            skeletonShine: ColorValue("#F3F4F6")
                        },
                        space: {
                            xs: 4,
                            sm: 8,
                            md: 12,
                            lg: 16,
                            xl: 24
                        },
                        radius: {
                            md: 8,
                            lg: 12
                        },
                        type: {
                            value: {
                                size: 28,
                                sizeCompact: 22
                            },
                            label: {
                                size: 12
                            },
                            body: {
                                size: 12
                            }
                        },
                        heights: {
                            statsCardMax: 168
                        },
                        abbreviateThreshold: 10000
                    }
                  SubtitleFS: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
            - conApprovalToolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.Border,
                        gblTheme.Light.Colors.Border
                    )
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.Surface,
                        gblTheme.Light.Colors.Surface
                    )
                  FillPortions: =0
                  Height: |-
                    =conApprovalToolbarRow.Height + If(
                        ShowFilter,
                        conApprovalFilterRow.Height + Self.LayoutGap,
                        0
                    ) + Self.PaddingTop + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - conApprovalToolbarRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - txtApprovalSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "البحث في سجل الموافقات", "Search approval history")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              FillPortions: =1
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =160
                              OnChange: =Set(varApprovalSearch, Self.Text)
                              Placeholder: =If(gblLanguage = "Arabic", "رقم الطلب أو العنوان", "Request number or title")
                              Size: =12
                        - cmbApprovalStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "القرار", "Decision")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.Decision), Value = varApprovalDecision)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل القرارات", "All decisions")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.Decision)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varApprovalDecision, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, 120, 150)
                        - btnApprovalClearStatus:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح الحالة", "Clear status")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Transparent
                              Height: =36
                              Icon: ="Dismiss"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varApprovalDecision, Blank());
                                Reset(cmbApprovalStatus)
                              Text: =""
                              Tooltip: =If(gblLanguage = "Arabic", "مسح الحالة", "Clear status")
                              Visible: =!IsBlank(varApprovalDecision)
                              Width: =36
                        - btnApprovalRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Transparent
                              Height: =36
                              Icon: ="ArrowSync"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Refresh(ApprovalHistory);
                                If(
                                    !IsBlank(gblUser.ID),
                                    ClearCollect(
                                        colApprovalCenter,
                                        Sort(
                                            Filter(
                                                ApprovalHistory,
                                                ApproverID = gblUser.ID
                                            ),
                                            AssignedDate,
                                            SortOrder.Descending
                                        )
                                    )
                                )
                              Text: =""
                              Tooltip: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Width: =36
                        - btnApprovalFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "عوامل التصفية", "Filters")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =If(ShowFilter, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              Height: =36
                              Icon: ="Filter"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(ShowFilter, !Coalesce(ShowFilter, false))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                              Tooltip: =If(gblLanguage = "Arabic", "إظهار التصفية", "Show filters")
                              Width: =If(App.Width < 700, 36, 96)
                        - cmpApprovalView:
                            Control: CanvasComponent
                            ComponentName: cmpSegmentedControl
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DefaultValue: |-
                                =If(
                                    App.Width < 700,
                                    If(
                                        Or(varApprovalView = "Card", varApprovalView = "List"),
                                        varApprovalView,
                                        "List"
                                    ),
                                    Coalesce(varApprovalView, "Table")
                                )
                              Disabled: =false
                              DisplayMode: =If(App.Width < 700, "Icons", "Both")
                              EqualWidth: =true
                              FillPortions: =0
                              Height: =36
                              IconPosition: ="Left"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varApprovalView, cmpApprovalView.SelectedValue)
                              Options: |-
                                =If(
                                    App.Width < 700,
                                    Table(
                                        {Value: "Card", Label: "", Icon: "Grid"},
                                        {Value: "List", Label: "", Icon: "List"}
                                    ),
                                    Table(
                                        {Value: "Table", Label: If(gblLanguage = "Arabic", "جدول", "Table"), Icon: "Table"},
                                        {Value: "Card", Label: If(gblLanguage = "Arabic", "بطاقة", "Card"), Icon: "Grid"},
                                        {Value: "List", Label: If(gblLanguage = "Arabic", "قائمة", "List"), Icon: "List"}
                                    )
                                )
                              Size: ="Small"
                              Theme: =gblTheme.Mode
                              Width: =If(App.Width < 700, 80, 248)
                  - conApprovalFilterRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 156, 36)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Visible: =ShowFilter = true
                      Children:
                        - cmbApprovalModule:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الوحدة", "Module")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.Module), Value = varApprovalModule)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الوحدات", "All modules")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.Module)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varApprovalModule, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbApprovalRequestType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الطلب", "Request type")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.RequestType), Value = varApprovalRequestType)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل أنواع الطلبات", "All request types")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.RequestType)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varApprovalRequestType, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbApprovalEntityType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الكيان", "Entity type")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.EntityType), Value = varApprovalEntityType)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الكيانات", "All entity types")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.EntityType)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varApprovalEntityType, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - btnApprovalClearFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح جميع عوامل التصفية", "Clear all filters")
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =Set(varApprovalSearch, "");
                                Set(varApprovalModule, Blank());
                                Set(varApprovalRequestType, Blank());
                                Set(varApprovalEntityType, Blank());
                                Set(varApprovalDecision, Blank());
                                Reset(txtApprovalSearch);
                                Reset(cmbApprovalModule);
                                Reset(cmbApprovalRequestType);
                                Reset(cmbApprovalEntityType);
                                Reset(cmbApprovalStatus)
                              Text: =If(gblLanguage = "Arabic", "مسح الكل", "Clear all")
                              Tooltip: =Self.Text
            - conApprovalBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - cmpApprovalTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        CardHeight: =210
                        ContextMenuItems: =
                        EmptySubtitle: =If(gblLanguage = "Arabic", "لا توجد طلبات تطابق البحث أو التصفية.", "No requests match the current search or filters.")
                        EmptyTitle: |-
                          =If(
                              gblLanguage = "Arabic",
                              Switch(
                                  Coalesce(varApprovalDecision, ""),
                                  "Pending", "لا توجد موافقات معلقة",
                                  "Approved", "لا توجد موافقات معتمدة",
                                  "Rejected", "لا توجد موافقات مرفوضة",
                                  "لا توجد طلبات موافقة"
                              ),
                              Switch(
                                  Coalesce(varApprovalDecision, ""),
                                  "Pending", "No pending approvals",
                                  "Approved", "No approved requests",
                                  "Rejected", "No rejected requests",
                                  "No approval requests"
                              )
                          )
                        EnableHover: =true
                        EnableMenu: =false
                        FillPortions: =1
                        HeaderAction: =If(gblLanguage = "Arabic", "إجراء", "ACTIONS")
                        HeaderColumn1: =
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "PROJECT")
                        HeaderColumn3: =
                        HeaderHeight: =40
                        HeaderId: =If(gblLanguage = "Arabic", "المعرف", "ID")
                        HeaderPerson: =If(gblLanguage = "Arabic", "مقدم الطلب", "REQUESTER")
                        HeaderPriority: =
                        HeaderProgress: =
                        HeaderStatus: =If(gblLanguage = "Arabic", "القرار", "DECISION")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الوحدة", "MODULE")
                        HeaderTitle: =If(gblLanguage = "Arabic", "نوع الطلب", "REQUEST TYPE")
                        HeaderWhen: =If(gblLanguage = "Arabic", "تاريخ الإسناد", "ASSIGNED DATE")
                        Height: =Max(Parent.Height, 360)
                        Items: |-
                          =ForAll(
                              Sort(
                                  Filter(
                                      colApprovalCenter,
                                      Or(
                                          IsBlank(varApprovalSearch),
                                          StartsWith(Title, varApprovalSearch),
                                          StartsWith(Coalesce(RequestNumber, ""), varApprovalSearch)
                                      ),
                                      Or(
                                          IsBlank(varApprovalModule),
                                          Module.Value = varApprovalModule
                                      ),
                                      Or(
                                          IsBlank(varApprovalRequestType),
                                          RequestType.Value = varApprovalRequestType
                                      ),
                                      Or(
                                          IsBlank(varApprovalEntityType),
                                          EntityType.Value = varApprovalEntityType
                                      ),
                                      Or(
                                          IsBlank(varApprovalDecision),
                                          Decision.Value = varApprovalDecision
                                      )
                                  ),
                                  AssignedDate,
                                  SortOrder.Descending
                              ) As row,
                              {
                                  RowKey: Text(row.ID),
                                  Title: Coalesce(row.RequestType.Value, "-"),
                                  Subtitle: Coalesce(row.Module.Value, "-"),
                                  Column1: "",
                                  Column2: With(
                                      {pid: Coalesce(row.ProjectID, 0)},
                                      If(
                                          pid <= 0,
                                          "-",
                                          Coalesce(LookUp(Projects, ID = pid, ProjectCode), "-")
                                      )
                                  ),
                                  Column3: "",
                                  Status: Coalesce(row.Decision.Value, "Pending"),
                                  Tone: Coalesce(row.Decision.Value, "Pending"),
                                  Priority: "",
                                  PriorityTone: "",
                                  Person: Coalesce(row.Requester.Value, "-"),
