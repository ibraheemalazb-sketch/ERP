Screens:
  ScrApprovalCenter:
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Background,
            gblTheme.Light.Colors.Background
        )
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Set(gblSelectedApproval, Blank());
        Set(ShowFilter, false);
        Set(varApprovalSearch, "");
        Set(varApprovalModule, Blank());
        Set(varApprovalRequestType, Blank());
        Set(varApprovalEntityType, Blank());
        Set(varApprovalDecision, "Pending");
        Set(
            varApprovalView,
            If(App.Width < 700, "Card", "Table")
        );
        Reset(cmpApprovalTable);
        If(
            IsBlank(gblMenuExpanded),
            Set(gblMenuExpanded, true)
        );
        If(
            !IsBlank(gblUser.ID),
            ClearCollect(
                colApprovalCenter,
                Sort(
                    Filter(
                        ApprovalHistory,
                        ApproverID = gblUser.ID
                    ),
                    AssignedDate,
                    SortOrder.Descending
                )
            )
        )
    Children:
      - conApprovalPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutWrap: =false
            PaddingBottom: =If(App.Width < 700, cmpApprovalPhoneNav.Height, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 12)
            PaddingRight: =12
            PaddingTop: =cmpApprovalTopBar.Height + 8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - lblApprovalTitle:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.TextPrimary,
                        gblTheme.Light.Colors.TextPrimary
                    )
                  FillPortions: =0
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Medium
                  Height: =22
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =16
                  Text: =If(gblLanguage = "Arabic", "مركز الموافقات", "Approval Center")
            - lblApprovalCount:
                Control: ModernText@1.0.0
                Properties:
                  AccessibleLabel: =Self.Text
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.TextMuted,
                        gblTheme.Light.Colors.TextMuted
                    )
                  FillPortions: =0
                  Font: =gblTheme.Typography.FontFamily
                  Height: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =11
                  Text: |-
                    =Text(
                        CountRows(
                            Filter(
                                colApprovalCenter,
                                Decision.Value = "Pending"
                            )
                        )
                    ) & " " & If(gblLanguage = "Arabic", "بانتظار القرار", "pending")
                  Width: =Parent.Width
            - cmpApprovalKpi:
                Control: CanvasComponent
                ComponentName: cmpKPIwNav
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  AnimationEffect: ="None"
                  ColumnsLayout: |-
                    ={
                        Mobile: 1,
                        Tablet: 2,
                        Desktop: 4,
                        MobileBreakpoint: 640,
                        TabletBreakpoint: 1024,
                        DesktopBreakpoint: 1366
                    }
                  Data: |-
                    =Table(
                        {
                            ID: 1,
                            Icon: "ClipboardCheck",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Pending")),
                            Label: If(gblLanguage = "Arabic", "قيد الانتظار", "Pending"),
                            Subtitle: If(gblLanguage = "Arabic", "بانتظار قرارك", "Awaiting your decision"),
                            Screen: "Pending",
                            IconBg: "",
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(121,176,255)", "rgb(27,86,229)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 2,
                            Icon: "Check",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Approved")),
                            Label: If(gblLanguage = "Arabic", "تمت الموافقة", "Approved"),
                            Subtitle: If(gblLanguage = "Arabic", "قرارات مكتملة", "Decisions completed"),
                            Screen: "Approved",
                            IconBg: "",
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(74,222,128)", "rgb(22,163,74)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 3,
                            Icon: "Warning",
                            Value: CountRows(Filter(colApprovalCenter, Decision.Value = "Rejected")),
                            Label: If(gblLanguage = "Arabic", "مرفوض", "Rejected"),
                            Subtitle: If(gblLanguage = "Arabic", "طلبات مرفوضة", "Requests turned down"),
                            Screen: "Rejected",
                            IconBg: "",
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(248,113,113)", "rgb(220,38,38)"),
                            SparklineData: "",
                            isHidden: false
                        },
                        {
                            ID: 4,
                            Icon: "Clock",
                            Value: CountRows(
                                Filter(
                                    colApprovalCenter,
                                    Decision.Value = "Pending",
                                    AssignedDate < DateAdd(Now(), -2, TimeUnit.Days)
                                )
                            ),
                            Label: If(gblLanguage = "Arabic", "متأخرة", "Waiting"),
                            Subtitle: If(gblLanguage = "Arabic", "أكثر من يومين", "Open more than 2 days"),
                            Screen: "Overdue",
                            IconBg: "",
                            IconColor: If(gblTheme.Mode = "Dark", "rgb(251,191,36)", "rgb(217,119,6)"),
                            SparklineData: "",
                            isHidden: false
                        }
                    )
                  FillPortions: =0
                  FontsSizesTitle: =12
                  Height: |-
                    =With(
                        {
                            cols: If(Parent.Width < 640, 1, If(Parent.Width < 1024, 2, 4))
                        },
                        RoundUp(4 / cols, 0) * 108
                    )
                  Icons: |-
                    =Table(
                        {
                            Name: "ClipboardCheck",
                            SVG: ""
                        }
                    )
                  IconsSize: =20
                  IsLoading: =false
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnCardClick: |-
                    =Set(
                        varApprovalDecision,
                        Switch(
                            varClickScreen,
                            "Approved", "Approved",
                            "Rejected", "Rejected",
                            "Pending"
                        )
                    )
                  Style: ="Compact"
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
            - conApprovalToolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.Border,
                        gblTheme.Light.Colors.Border
                    )
                  BorderThickness: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.Surface,
                        gblTheme.Light.Colors.Surface
                    )
                  FillPortions: =0
                  Height: |-
                    =conApprovalToolbarRow.Height + If(
                        ShowFilter,
                        conApprovalFilterRow.Height + Self.LayoutGap,
                        0
                    ) + Self.PaddingTop + Self.PaddingBottom
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =false
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width
                Children:
                  - conApprovalToolbarRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =36
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =false
                      Children:
                        - txtApprovalSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "البحث في سجل الموافقات", "Search approval history")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              FillPortions: =1
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =160
                              OnChange: =Set(varApprovalSearch, Self.Text)
                              Placeholder: =If(gblLanguage = "Arabic", "رقم الطلب أو العنوان", "Request number or title")
                              Size: =12
                        - cmbApprovalStatus:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "القرار", "Decision")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
                              FillPortions: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.Decision), Value = varApprovalDecision)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل القرارات", "All decisions")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.Decision)
                              OnChange: =Set(varApprovalDecision, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =150
                        - btnApprovalRefresh:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Transparent
                              FillPortions: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Height: =36
                              Icon: ="ArrowSync"
                              OnSelect: |-
                                =Refresh(ApprovalHistory);
                                If(
                                    !IsBlank(gblUser.ID),
                                    ClearCollect(
                                        colApprovalCenter,
                                        Sort(
                                            Filter(
                                                ApprovalHistory,
                                                ApproverID = gblUser.ID
                                            ),
                                            AssignedDate,
                                            SortOrder.Descending
                                        )
                                    )
                                )
                              Text: =""
                              Tooltip: =If(gblLanguage = "Arabic", "تحديث", "Refresh")
                              Width: =36
                        - btnApprovalFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "عوامل التصفية", "Filters")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =If(ShowFilter, ButtonAppearance.Primary, ButtonAppearance.Outline)
                              FillPortions: =0
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Height: =36
                              Icon: ="Filter"
                              OnSelect: =Set(ShowFilter, !Coalesce(ShowFilter, false))
                              Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "تصفية", "Filters"))
                              Tooltip: =If(gblLanguage = "Arabic", "إظهار التصفية", "Show filters")
                              Width: =If(App.Width < 700, 36, 96)
                        - conApprovalViewToggle:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Border,
                                    gblTheme.Light.Colors.Border
                                )
                              BorderThickness: =1
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =2
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =If(App.Width < 700, 76, 168)
                            Children:
                              - btnApprovalTableView:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "جدول", "Table")
                                    Appearance: =If(varApprovalView = "Table", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                    Height: =30
                                    Icon: ="Table"
                                    OnSelect: =Set(varApprovalView, "Table")
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "جدول", "Table"))
                                    Tooltip: =If(gblLanguage = "Arabic", "جدول", "Table")
                                    Visible: =App.Width >= 700
                                    Width: =72
                              - btnApprovalCardView:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "بطاقة", "Card")
                                    Appearance: =If(varApprovalView = "Card", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                    Height: =30
                                    Icon: ="Grid"
                                    OnSelect: =Set(varApprovalView, "Card")
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "بطاقة", "Card"))
                                    Tooltip: =If(gblLanguage = "Arabic", "بطاقة", "Card")
                                    Width: =If(App.Width < 700, 34, 64)
                              - btnApprovalListView:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "قائمة", "List")
                                    Appearance: =If(varApprovalView = "List", ButtonAppearance.Primary, ButtonAppearance.Transparent)
                                    Height: =30
                                    Icon: ="List"
                                    OnSelect: =Set(varApprovalView, "List")
                                    Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "قائمة", "List"))
                                    Tooltip: =If(gblLanguage = "Arabic", "قائمة", "List")
                                    Width: =If(App.Width < 700, 34, 64)
                  - conApprovalFilterRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(App.Width < 700, 156, 36)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =false
                        Visible: =ShowFilter = true
                      Children:
                        - cmbApprovalModule:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "الوحدة", "Module")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.Module), Value = varApprovalModule)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الوحدات", "All modules")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.Module)
                              OnChange: =Set(varApprovalModule, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbApprovalRequestType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الطلب", "Request type")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.RequestType), Value = varApprovalRequestType)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل أنواع الطلبات", "All request types")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.RequestType)
                              OnChange: =Set(varApprovalRequestType, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - cmbApprovalEntityType:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "نوع الكيان", "Entity type")
                              Appearance: =Appearance.Outline
                              DefaultSelectedItems: =Filter(Choices(ApprovalHistory.EntityType), Value = varApprovalEntityType)
                              Height: =36
                              InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل الكيانات", "All entity types")
                              IsSearchable: =false
                              ItemDisplayText: =ThisItem.Value
                              Items: =Choices(ApprovalHistory.EntityType)
                              OnChange: =Set(varApprovalEntityType, Self.Selected.Value)
                              SelectMultiple: =false
                              Size: =12
                              Width: =If(App.Width < 700, Parent.Width, 180)
                        - btnApprovalClearFilters:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "مسح جميع عوامل التصفية", "Clear all filters")
                              Appearance: =ButtonAppearance.Outline
                              Height: =36
                              OnSelect: |-
                                =Set(varApprovalSearch, "");
                                Set(varApprovalModule, Blank());
                                Set(varApprovalRequestType, Blank());
                                Set(varApprovalEntityType, Blank());
                                Set(varApprovalDecision, Blank());
                                Reset(txtApprovalSearch);
                                Reset(cmbApprovalModule);
                                Reset(cmbApprovalRequestType);
                                Reset(cmbApprovalEntityType);
                                Reset(cmbApprovalStatus)
                              Text: =If(gblLanguage = "Arabic", "مسح الكل", "Clear all")
                              Tooltip: =Self.Text
                              Width: =96
            - conApprovalBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =false
                Children:
                  - cmpApprovalTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        CardHeight: =210
                        EmptySubtitle: =If(gblLanguage = "Arabic", "لا توجد طلبات تطابق البحث أو التصفية.", "No requests match the current search or filters.")
                        EmptyTitle: |-
                          =If(
                              gblLanguage = "Arabic",
                              Switch(
                                  Coalesce(varApprovalDecision, ""),
                                  "Pending", "لا توجد موافقات معلقة",
                                  "Approved", "لا توجد موافقات معتمدة",
                                  "Rejected", "لا توجد موافقات مرفوضة",
                                  "لا توجد طلبات موافقة"
                              ),
                              Switch(
                                  Coalesce(varApprovalDecision, ""),
                                  "Pending", "No pending approvals",
                                  "Approved", "No approved requests",
                                  "Rejected", "No rejected requests",
                                  "No approval requests"
                              )
                          )
                        EnableHover: =true
                        EnableMenu: =false
                        FillPortions: =1
                        HeaderAction: =If(gblLanguage = "Arabic", "إجراء", "ACTIONS")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المستوى", "LEVEL")
                        HeaderHeight: =40
                        HeaderId: =If(gblLanguage = "Arabic", "المعرف", "ID")
                        HeaderPerson: =If(gblLanguage = "Arabic", "مقدم الطلب", "REQUESTER")
                        HeaderStatus: =If(gblLanguage = "Arabic", "القرار", "DECISION")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الوحدة", "MODULE")
                        HeaderTitle: =If(gblLanguage = "Arabic", "نوع الطلب", "REQUEST TYPE")
                        HeaderWhen: =If(gblLanguage = "Arabic", "تاريخ الإسناد", "ASSIGNED DATE")
                        Height: =Max(Parent.Height, 360)
                        Items: |-
                          =ForAll(
                              Sort(
                                  Filter(
                                      colApprovalCenter,
                                      Or(
                                          IsBlank(varApprovalSearch),
                                          StartsWith(Title, varApprovalSearch),
                                          StartsWith(Coalesce(RequestNumber, ""), varApprovalSearch)
                                      ),
                                      Or(
                                          IsBlank(varApprovalModule),
                                          Module.Value = varApprovalModule
                                      ),
                                      Or(
                                          IsBlank(varApprovalRequestType),
                                          RequestType.Value = varApprovalRequestType
                                      ),
                                      Or(
                                          IsBlank(varApprovalEntityType),
                                          EntityType.Value = varApprovalEntityType
                                      ),
                                      Or(
                                          IsBlank(varApprovalDecision),
                                          Decision.Value = varApprovalDecision
                                      )
                                  ),
                                  AssignedDate,
                                  SortOrder.Descending
                              ) As row,
                              {
                                  RowKey: Text(row.ID),
                                  Title: Coalesce(row.RequestType.Value, "-"),
                                  Subtitle: Coalesce(row.Module.Value, "-"),
                                  Column1: "",
                                  Column2: Coalesce(row.ApprovalLevel.Value, "-"),
                                  Column3: "",
                                  Status: Coalesce(row.Decision.Value, "Pending"),
                                  Tone: Coalesce(row.Decision.Value, "Pending"),
                                  Priority: "",
                                  PriorityTone: "",
                                  Person: Coalesce(row.Requester.Value, "-"),
                                  WhenText: If(IsBlank(row.AssignedDate), "-", Text(row.AssignedDate, "dd mmm yyyy")),
                                  ProgressDone: 0,
                                  ProgressTotal: 0,
                                  IconName: Switch(
                                      row.Module.Value,
                                      "Procurement", "ShoppingCart",
                                      "HR", "Users",
                                      "Projects", "List",
                                      "Finance", "Money",
                                      "MEAL", "Chart",
                                      "ClipboardCheck"
                                  )
                              }
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnRowSelect: |-
                          =Set(
                              gblSelectedApproval,
                              LookUp(
                                  colApprovalCenter,
                                  ID = Value(cmpApprovalTable.SelectedItem.RowKey)
                              )
                          )
                        PersonAsAvatar: =true
                        RowHeight: =56
                        ShowAction: =true
                        ShowColumn1: =false
                        ShowColumn2: =true
                        ShowColumn3: =false
                        ShowHeader: =true
                        ShowId: =true
                        ShowPerson: =true
                        ShowPriority: =false
                        ShowProgress: =false
                        ShowStatus: =true
                        ShowSubtitle: =true
                        ShowViewToggle: =false
                        ShowWhen: =true
                        SubtitleAsPill: =true
                        TitleBold: =false
                        ViewMode: =varApprovalView
                        Width: =Parent.Width
                        WidthAction: =72
                        WidthColumn2: =150
                        WidthId: =64
                        WidthPerson: =200
                        WidthStatus: =120
                        WidthSubtitle: =140
                        WidthTitle: =160
                        WidthWhen: =140
      - conApprovalNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Surface,
                  gblTheme.Light.Colors.Surface
              )
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpApprovalNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table(
                        {
                            Name: "Home",
                            SVG: ""
                        }
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, true));
                    If(!gblMenuExpanded, Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
