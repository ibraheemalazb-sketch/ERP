Screens:
  scrActivities:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PActivities");
        Set(varNavSelectedID, 25);
        Set(varMeID, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
        If(IsBlank(varActQuick), Set(varActQuick, "all"));
        If(IsBlank(varActTypeFilter), Set(varActTypeFilter, "All"));
        Set(varActError, false);
        If(IsBlank(varActProjectOnly), Set(varActProjectOnly, false));
        Select(btnActReload)
    Children:
      - conActNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
          Children:
            - cmpActNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AccentColor: =
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  HoverBackground: =
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  Items: =
                  OnFooterSettings: =
                  OnHelp: =
                  OnLanguageToggle: =
                  OnNavigate: |-
                    =Switch(
                        varNavSelectedID,
                        1, Navigate(ScrHome, ScreenTransition.None),
                        10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
                        12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
                        13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
                        14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
                        15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
                        16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
                        17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
                        20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
                        22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
                        23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
                        24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
                        29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
                        25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
                        26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
                        30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
                        32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
                        33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
                        34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
                        35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
                        37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
                        39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
                        50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
                        52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
                        53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
                        55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
                        56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
                        60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
                        77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
                        62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
                        67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
                        65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
                        63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
                        78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
                        79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
                        80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
                        64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
                        74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
                        75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
                        76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
                        68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
                        81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
                        70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
                        71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
                        73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
                    )
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  PrimaryText: =
                  SecondaryText: =
                  SelectedBackground: =
                  SelectedText: =
                  ShowFooterMenu: =
                  ShowLanguageToggle: =
                  ShowUser: =
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
      - conActSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnActReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Set(varActError, false);
                    Clear(colActRaw);
                    If(
                        And(varActProjectOnly, Coalesce(varSelectedProject.ID, 0) > 0),
                        IfError(
                            Collect(colActRaw, Filter(ProjectsActivities, ProjectID = varSelectedProject.ID)),
                            Set(varActError, true)
                        ),
                        If(
                            varUserHasAllProjects,
                            IfError(
                                Collect(colActRaw, FirstN(SortByColumns(ProjectsActivities, "ID", SortOrder.Descending), 500)),
                                Set(varActError, true)
                            ),
                            ForAll(
                                Filter(colUserProjectAccess, And(AllProjects = false, IsActive = true)) As access,
                                IfError(
                                    Collect(colActRaw, Filter(ProjectsActivities, ProjectID = access.ProjectID)),
                                    Set(varActError, true)
                                )
                            )
                        )
                    );
                    ClearCollect(colActList, colActRaw);
                    If(
                        Coalesce(gblSelectedActivityID, 0) > 0,
                        Set(varSelectedActivity, LookUp(ProjectsActivities, ID = gblSelectedActivityID));
                        Set(gblSelectedActivityID, 0),
                        If(
                            Coalesce(varSelectedActivity.ID, 0) > 0,
                            Set(varSelectedActivity, LookUp(ProjectsActivities, ID = varSelectedActivity.ID))
                        )
                    );
                    If(Coalesce(varSelectedActivity.ID, 0) > 0, Select(btnActLoadKids))
                  Text: ="Reload"
                  Visible: =false
                  Width: =1
            - btnActLoadKids:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Clear(colActChildren);
                    Clear(colActTasks);
                    Clear(colActStepLabels);
                    Set(varActStep, 1);
                    Set(varActCalcTotal, 0);
                    Set(varActCalcDone, 0);
                    Set(varActCalcProgress, 0);
                    Set(varActCalcStatus, Coalesce(varSelectedActivity.Status.Value, "Not Started"));
                    If(
                        Coalesce(varSelectedActivity.ID, 0) <= 0,
                        false,
                        If(
                            varSelectedActivity.ActivityType.Value = "Main",
                            ClearCollect(colActChildren, Filter(colActList, ParentActivityID = varSelectedActivity.ID));
                            ClearCollect(
                                colActStepLabels,
                                ForAll(
                                    SortByColumns(colActChildren, "PlannedStart", SortOrder.Ascending),
                                    {Label: Coalesce(Title, If(gblLanguage = "Arabic", "نشاط", "Activity"))}
                                )
                            );
                            Set(varActCalcTotal, CountRows(colActChildren));
                            Set(varActCalcDone, CountRows(Filter(colActChildren, Status.Value = "Completed")));
                            Set(
                                varActCalcProgress,
                                If(
                                    varActCalcTotal <= 0,
                                    0,
                                    Round((Sum(colActChildren, Coalesce(Progress, 0)) / varActCalcTotal), 0)
                                )
                            );
                            Set(
                                varActCalcStatus,
                                If(
                                    varActCalcTotal <= 0,
                                    "Not Started",
                                    If(
                                        varActCalcDone = varActCalcTotal,
                                        "Completed",
                                        If(
                                            CountRows(Filter(colActChildren, Status.Value = "Pending Review")) > 0,
                                            "Pending Review",
                                            If(
                                                Or(varActCalcDone > 0, CountRows(Filter(colActChildren, Status.Value = "In Progress")) > 0),
                                                "In Progress",
                                                "Not Started"
                                            )
                                        )
                                    )
                                )
                            );
                            Set(
                                varActStep,
                                If(
                                    varActCalcTotal <= 0,
                                    1,
                                    Min(varActCalcTotal, Max(1, varActCalcDone + If(varActCalcDone = varActCalcTotal, 0, 1)))
                                )
                            ),
                            IfError(
                                ClearCollect(colActTasks, Filter(ProjectsTasks, ActivityID = varSelectedActivity.ID)),
                                Clear(colActTasks);
                                Notify(If(gblLanguage = "Arabic", "تعذر تحميل مهام هذا النشاط.", "Tasks for this activity could not be loaded."), NotificationType.Warning)
                            );
                            ClearCollect(
                                colActStepLabels,
                                ForAll(
                                    SortByColumns(Filter(colActTasks, Status.Value <> "Cancelled"), "DueDate", SortOrder.Ascending),
                                    {Label: Coalesce(Title, If(gblLanguage = "Arabic", "مهمة", "Task"))}
                                )
                            );
                            Set(varActCalcTotal, CountRows(Filter(colActTasks, Status.Value <> "Cancelled")));
                            Set(varActCalcDone, CountRows(Filter(colActTasks, Status.Value = "Completed")));
                            Set(
                                varActCalcProgress,
                                If(varActCalcTotal <= 0, 0, Round((varActCalcDone / varActCalcTotal) * 100, 0))
                            );
                            Set(
                                varActCalcStatus,
                                If(
                                    varActCalcTotal <= 0,
                                    "Not Started",
                                    If(
                                        varActCalcDone = varActCalcTotal,
                                        "Completed",
                                        If(
                                            CountRows(Filter(colActTasks, Or(Status.Value = "Pending Approval", Status.Value = "In Review"))) > 0,
                                            "Pending Review",
                                            If(
                                                Or(varActCalcDone > 0, CountRows(Filter(colActTasks, Or(Status.Value = "In Progress", Status.Value = "Reopened"))) > 0),
                                                "In Progress",
                                                "Not Started"
                                            )
                                        )
                                    )
                                )
                            );
                            Set(
                                varActStep,
                                If(
                                    varActCalcTotal <= 0,
                                    1,
                                    Min(varActCalcTotal, Max(1, varActCalcDone + If(varActCalcDone = varActCalcTotal, 0, 1)))
                                )
                            )
                        )
                    )
                  Text: ="Kids"
                  Visible: =false
                  Width: =1
            - btnActRecalc:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  OnSelect: |-
                    =Select(btnActLoadKids);
                    IfError(
                        Set(
                            varSelectedActivity,
                            Patch(
                                ProjectsActivities,
                                LookUp(ProjectsActivities, ID = varSelectedActivity.ID),
                                {
                                    Progress: varActCalcProgress,
                                    TotalTasks: varActCalcTotal,
                                    'Completed Tasks': varActCalcDone,
                                    Status: {Value: varActCalcStatus},
                                    ActualStart: If(
                                        varSelectedActivity.ActivityType.Value = "Main",
                                        Min(Filter(colActChildren, Not(IsBlank(ActualStart))), ActualStart),
                                        Min(Filter(colActTasks, Not(IsBlank(ActualStart))), ActualStart)
                                    ),
                                    ActualEnd: If(
                                        varActCalcStatus = "Completed",
                                        If(
                                            varSelectedActivity.ActivityType.Value = "Main",
                                            Max(Filter(colActChildren, Not(IsBlank(ActualEnd))), ActualEnd),
                                            Max(Filter(colActTasks, Status.Value = "Completed"), CompletedDate)
                                        ),
                                        Blank()
                                    )
                                }
                            )
                        );
                        fnProjLog(
                            "Activity: " & varSelectedActivity.Title,
                            Coalesce(varSelectedActivity.ProjectID, 0),
                            Coalesce(varSelectedActivity.Project.Value, ""),
                            "Activity",
                            varSelectedActivity.ID,
                            "Progress Updated",
                            Text(Coalesce(varActCalcProgress, 0)) & "% / " & Coalesce(varActCalcStatus, "")
                        );
                        If(
                            And(
                                Coalesce(varSelectedActivity.ResponsiblePersonID, 0) > 0,
                                varSelectedActivity.ResponsiblePersonID <> varMeID,
                                Or(varActCalcStatus = "Completed", varActCalcStatus = "Pending Review")
                            ),
                            fnProjNotify(
                                varSelectedActivity.ResponsiblePersonID,
                                Coalesce(varSelectedActivity.ResponsiblePerson.Value, ""),
                                varSelectedActivity.Title,
                                If(gblLanguage = "Arabic", "تحديث تقدم النشاط: ", "Activity progress update: ") & Coalesce(varActCalcStatus, ""),
                                "Activity",
                                varSelectedActivity.ID,
                                "Activity"
                            )
                        );
                        Select(btnActReload);
                        Notify(If(gblLanguage = "Arabic", "تم تحديث التقدم من المهام.", "Progress was updated from related tasks."), NotificationType.Success),
                        Notify(If(gblLanguage = "Arabic", "تعذر تحديث التقدم.", "Progress could not be updated."), NotificationType.Error)
                    )
                  Text: ="Recalc"
                  Visible: =false
                  Width: =1
      - conActPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =If(App.Width < 700, cmpActPhone.Height + 8, 12)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth) + 12)
            PaddingRight: =12
            PaddingTop: =cmpActTop.Height + 8
            Width: =Parent.Width
          Children:
            - conActHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =44
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - lblActTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =18
                        Text: =If(gblLanguage = "Arabic", "الأنشطة", "Activities")
                        Width: =160
                        Wrap: =false
                  - btnActProject:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Subtle
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =If(
                              Coalesce(varSelectedActivity.ProjectID, varSelectedProject.ID, 0) > 0,
                              Set(varSelectedProject, LookUp(Projects, ID = Coalesce(varSelectedActivity.ProjectID, varSelectedProject.ID)));
                              Set(varProjectTab, "Activities");
                              Set(varShowDetails, true);
                              Navigate(ScrAllProjects, ScreenTransition.Cover)
                          )
                        Text: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        Visible: =Or(Not(IsBlank(varSelectedProject)), Not(IsBlank(varSelectedActivity)))
                        Width: =100
                  - btnActNew:
                      Control: ModernButton@1.0.0
                      Properties:
                        Height: =36
                        Icon: ="Add"
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varEditorEntity, "Activity");
                          Set(varEditorMode, "New");
                          Set(varEditingActivity, "");
                          Set(varIsSubActivity, false);
                          Set(varParentActivity, Blank());
                          Set(varSelectedActivity, Blank());
                          Set(varTkPresetActivityID, 0);
                          Set(varReturnScreen, "Activities");
                          Navigate(scrProjectEditor, ScreenTransition.Cover)
                        Text: =If(gblLanguage = "Arabic", "نشاط", "Activity")
                        Width: =110
            - conActTools:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =If(App.Width < 700, 120, 40)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                Children:
                  - txtActSearch:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "بحث في الأنشطة", "Search activities")
                        Height: =36
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Placeholder: =If(gblLanguage = "Arabic", "ابحث بالعنوان أو الرمز", "Search title or code")
                        Width: =If(App.Width < 700, Parent.Width, 220)
                  - cmbActProject:
                      Control: ModernCombobox@1.1.2
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        DefaultSelectedItems: =If(IsBlank(varSelectedProject), Filter(Projects, false), Filter(Projects, ID = varSelectedProject.ID))
                        Height: =36
                        InputTextPlaceholder: =If(gblLanguage = "Arabic", "كل المشاريع", "All projects")
                        ItemDisplayText: =If(IsBlank(ThisItem.ProjectCode), ThisItem.Title, Concatenate(ThisItem.ProjectCode, " · ", ThisItem.Title))
                        Items: |-
                          =If(
                              varUserHasAllProjects,
                              Projects,
                              Filter(
                                  ForAll(
                                      Filter(colUserProjectAccess, AllProjects = false) As access,
                                      LookUp(Projects, ID = access.ProjectID)
                                  ),
                                  !IsBlank(ID)
                              )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnChange: |-
                          =Set(varSelectedProject, Self.Selected);
                          Set(varActProjectOnly, Not(IsBlank(Self.Selected)));
                          Select(btnActReload)
                        SelectMultiple: =false
                        Width: =If(App.Width < 700, Parent.Width, 200)
                  - galActChips:
                      Control: Gallery@2.15.0
                      Variant: Horizontal
                      Properties:
                        Height: =36
                        Items: |-
                          =Table(
                              {Key: "all", Label: If(gblLanguage = "Arabic", "الكل", "All")},
                              {Key: "open", Label: If(gblLanguage = "Arabic", "المفتوحة", "Open")},
                              {Key: "review", Label: If(gblLanguage = "Arabic", "مراجعة", "Review")},
                              {Key: "done", Label: If(gblLanguage = "Arabic", "مكتملة", "Done")},
                              {Key: "main", Label: If(gblLanguage = "Arabic", "رئيسية", "Main")},
                              {Key: "sub", Label: If(gblLanguage = "Arabic", "فرعية", "Sub")}
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =100
                        Width: =If(App.Width < 700, Parent.Width, 420)
                      Children:
                        - btnActChip:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =If(Or(varActQuick = ThisItem.Key, And(ThisItem.Key = "main", varActTypeFilter = "Main"), And(ThisItem.Key = "sub", varActTypeFilter = "SubActivity")), ButtonAppearance.Primary, ButtonAppearance.Subtle)
                              Height: =30
                              OnSelect: |-
                                =If(
                                    ThisItem.Key = "main",
                                    Set(varActTypeFilter, If(varActTypeFilter = "Main", "All", "Main")),
                                    If(
                                        ThisItem.Key = "sub",
                                        Set(varActTypeFilter, If(varActTypeFilter = "SubActivity", "All", "SubActivity")),
                                        Set(varActQuick, ThisItem.Key)
                                    )
                                )
                              Text: =ThisItem.Label
                              Width: =90
            - lblActError:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  Color: =fxThemeColor("Danger")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =If(varActError, 24, 0)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =If(gblLanguage = "Arabic", "تعذر تحميل بعض الأنشطة.", "Some activities could not be loaded.")
                  Visible: =varActError
                  Width: =Parent.Width
                  Wrap: =false
            - conActBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 140
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(App.Width < 700, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - galAct:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =If(App.Width < 700, 1, 0)
                        Height: =Parent.Height
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  colActList,
                                  And(
                                      Or(varActTypeFilter = "All", ActivityType.Value = varActTypeFilter),
                                      Or(
                                          varActQuick = "all",
                                          And(varActQuick = "open", Status.Value <> "Completed", Status.Value <> "Cancelled"),
                                          And(varActQuick = "review", Status.Value = "Pending Review"),
                                          And(varActQuick = "done", Status.Value = "Completed"),
                                          And(varActQuick = "main", true),
                                          And(varActQuick = "sub", true)
                                      ),
                                      Or(
                                          IsBlank(Trim(txtActSearch.Text)),
                                          Trim(txtActSearch.Text) in Coalesce(Title, ""),
                                          Trim(txtActSearch.Text) in Coalesce(ActivityCode, ""),
                                          Trim(txtActSearch.Text) in Coalesce(Project.Value, "")
                                      )
                                  )
                              ),
                              "PlannedStart",
                              SortOrder.Ascending
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        TemplateSize: =72
                        Visible: =Or(App.Width >= 700, IsBlank(varSelectedActivity))
                        Width: =If(App.Width < 700, Parent.Width, 360)
                      Children:
                        - btnActRow:
