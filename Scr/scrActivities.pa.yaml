                                      =IfError(
                                          Set(varSelectedActivity, Patch(ProjectsActivities, LookUp(ProjectsActivities, ID = varSelectedActivity.ID), {Status: {Value: "Cancelled"}}));
                                          fnProjLog(
                                              "Activity: " & varSelectedActivity.Title,
                                              Coalesce(varSelectedActivity.ProjectID, 0),
                                              Coalesce(varSelectedActivity.Project.Value, ""),
                                              "Activity",
                                              varSelectedActivity.ID,
                                              "Cancelled",
                                              ""
                                          );
                                          If(
                                              And(
                                                  Coalesce(varSelectedActivity.ResponsiblePersonID, 0) > 0,
                                                  varSelectedActivity.ResponsiblePersonID <> varMeID
                                              ),
                                              fnProjNotify(
                                                  varSelectedActivity.ResponsiblePersonID,
                                                  Coalesce(varSelectedActivity.ResponsiblePerson.Value, ""),
                                                  varSelectedActivity.Title,
                                                  If(gblLanguage = "Arabic", "أُلغي النشاط.", "The activity was cancelled."),
                                                  "Activity",
                                                  varSelectedActivity.ID,
                                                  "Activity"
                                              )
                                          );
                                          Select(btnActReload);
                                          Notify(If(gblLanguage = "Arabic", "أُلغي النشاط.", "The activity was cancelled."), NotificationType.Success),
                                          Notify(If(gblLanguage = "Arabic", "تعذر الإلغاء.", "Could not cancel."), NotificationType.Error)
                                      )
