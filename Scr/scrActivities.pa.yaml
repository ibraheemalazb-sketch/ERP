                                      },
                                      {
                                          Label: If(gblLanguage = "Arabic", "المهام", "Tasks"),
                                          Icon: "ClipboardCheck",
                                          Value: Text(Coalesce(varAcQuick.TaskDone, 0)) & " / " & Text(Coalesce(varAcQuick.TaskTotal, 0)) & If(Coalesce(varAcQuick.TaskOverdue, 0) > 0, " · " & Text(varAcQuick.TaskOverdue) & If(gblLanguage = "Arabic", " متأخرة", " overdue"), "")
                                      },
                                      {Label: If(gblLanguage = "Arabic", "الإنجاز", "Progress"), Icon: "Performance", Value: Text(Coalesce(varAcQuick.Progress, 0)) & "%"}
                                  ),
                                  "open",
                                  Set(varAcQuick, Blank());
                                  Set(varAcPane, "Details");
                                  Set(varAcCurrent, row);
                                  Select(btnAcOpen),
                                  "edit",
                                  Set(varEditorEntity, "Activity");
                                  Set(varReturnScreen, "Activities");
                                  Set(varMeID, varAcMe);
                                  Set(varAcFromEditor, true);
                                  Set(varEditorMode, "Edit");
                                  Set(varEditingActivity, LookUp(ProjectsActivities, ID = row.ID));
                                  Set(varSelectedProject, LookUp(Projects, ID = row.ProjectID));
                                  Set(varParentActivity, Blank());
                                  Set(varIsSubActivity, row.TypeText = "SubActivity");
                                  Navigate(scrProjectEditor, ScreenTransition.Cover)
                              )
                          )
                        OnRowSelect: |-
                          =With(
                              {row: LookUp(colAcRows, ID = Value(cmpAcTable.SelectedItem.RowKey))},
                              If(varAcQuick.ID = row.ID, Set(varAcQuick, Blank()), Set(varAcQuick, row))
                          );
                          ClearCollect(
                              colAcQuickFacts,
                              {Label: If(gblLanguage = "Arabic", "المشروع", "Project"), Icon: "Folder", Value: Coalesce(varAcQuick.ProjectText, "-")},
                              {Label: If(gblLanguage = "Arabic", "المسؤول", "Responsible"), Icon: "User", Value: Coalesce(varAcQuick.OwnerText, "-")},
                              {Label: If(gblLanguage = "Arabic", "المرحلة", "Phase"), Icon: "Layers", Value: Coalesce(varAcQuick.PhaseText, "-")},
                              {
                                  Label: If(gblLanguage = "Arabic", "الفترة المخططة", "Planned"),
                                  Icon: "Calendar",
                                  Value: If(IsBlank(varAcQuick.PlannedStart), "-", Text(varAcQuick.PlannedStart, "dd mmm yyyy")) & " → " & If(IsBlank(varAcQuick.PlannedEnd), "-", Text(varAcQuick.PlannedEnd, "dd mmm yyyy"))
                              },
                              {
                                  Label: If(gblLanguage = "Arabic", "المهام", "Tasks"),
                                  Icon: "ClipboardCheck",
                                  Value: Text(Coalesce(varAcQuick.TaskDone, 0)) & " / " & Text(Coalesce(varAcQuick.TaskTotal, 0)) & If(Coalesce(varAcQuick.TaskOverdue, 0) > 0, " · " & Text(varAcQuick.TaskOverdue) & If(gblLanguage = "Arabic", " متأخرة", " overdue"), "")
                              },
                              {Label: If(gblLanguage = "Arabic", "الإنجاز", "Progress"), Icon: "Performance", Value: Text(Coalesce(varAcQuick.Progress, 0)) & "%"}
                          )
