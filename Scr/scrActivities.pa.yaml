                  - cmpAcTable:
                      Control: CanvasComponent
                      ComponentName: cmpMyTable
                      Properties:
                        CardHeight: =148
                        ContextMenuItems: |-
                          =Table(
                              {ItemKey: "view", ItemDisplayName: If(gblLanguage = "Arabic", "عرض سريع", "Quick view"), ItemVisible: true},
                              {ItemKey: "open", ItemDisplayName: If(gblLanguage = "Arabic", "فتح", "Open"), ItemVisible: true},
                              {ItemKey: "edit", ItemDisplayName: If(gblLanguage = "Arabic", "تعديل", "Edit"), ItemVisible: varAcCanEdit}
                          )
                        EmptySubtitle: =If(gblLanguage = "Arabic", "جرّب بحثاً أو تصفية مختلفة.", "Try a different search or filter.")
