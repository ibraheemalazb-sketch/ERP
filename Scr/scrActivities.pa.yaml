Screens:
  scrActivities:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Programs");
        Set(varCurrentScreen, "Programs");
        Set(VarProgrammodule, "PActivities");
        Set(varNavSelectedID, 25);
        If(IsBlank(varActProjectOnly), Set(varActProjectOnly, false));
        If(IsBlank(varAcStatus), Set(varAcStatus, "All"));
        If(IsBlank(varAcType), Set(varAcType, "All"));
        If(IsBlank(varAcProjectID), Set(varAcProjectID, 0));
        If(IsBlank(varAcOwner), Set(varAcOwner, "All"));
        If(IsBlank(varAcPane), Set(varAcPane, "Details"));
        Set(varAcView, If(App.Width < 700, "list", Coalesce(varAcView, "table")));
        Set(varAcFilters, Coalesce(varAcFilters, false));
        Set(varAcMine, Coalesce(varAcMine, false));
        Set(varAcLateOnly, false);
        Set(varAcDlg, false);
        Set(varAcTaskSel, 0);
        Set(varAcMailOpen, false);
        Set(varAcMailBusy, false);
        Set(varAcQuick, Blank());
        If(
            varAcFromEditor,
            Set(varAcFromEditor, false);
            Set(varAcOpenID, If(varEditorEntity = "Activity", Coalesce(varEditingActivity.ID, 0), Coalesce(varAcCurrent.ID, 0))),
            Set(varAcOpenID, 0);
            Set(varAcCurrent, Blank())
        );
        Reset(cmpAcView);
        Reset(cmpAcTable);
        Reset(cmpAcStep);
        Reset(cmpAcTasks);
        Select(btnAcReload)
    Children:
      - conAcSvc:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.Transparent
            Height: =1
            Width: =1
          Children:
            - btnAcReload:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varAcMe, Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0));
                    Set(varAcMeName, Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, ""));
                    Set(varAcIsAdmin, Coalesce(gblUser.Role, "") in ["System Administrator", "Administrator", "Admin"]);
                    With(
                        {p: LookUp(colUserPermissions, Module.Value = "Projects")},
                        Set(varAcCanEdit, Or(varAcIsAdmin, Coalesce(p.CanEdit, false)));
                        Set(varAcCanCreate, Or(varAcIsAdmin, Coalesce(p.CanCreate, false)));
                        Set(
                            varAcScope,
                            If(
                                Or(varAcIsAdmin, Coalesce(p.CanViewAll, false), Coalesce(p.Scope.Value, "") = "All"),
                                "All",
                                Coalesce(p.Scope.Value, "Own")
                            )
                        )
                    );
                    Set(varAcErr, false);
                    Clear(colAcRaw);
                    IfError(
                        If(
                            And(varActProjectOnly, Coalesce(varSelectedProject.ID, 0) > 0),
                            Collect(colAcRaw, Filter(ProjectsActivities, ProjectID = varSelectedProject.ID)),
                            varAcScope = "All",
                            Collect(colAcRaw, SortByColumns(ProjectsActivities, "ID", SortOrder.Descending)),
                            varAcScope = "Department",
                            ForAll(
                                Filter(Projects, DepartmentID = Coalesce(gblCurrentEmployee.DepartmentID, -1)) As pr,
                                Collect(colAcRaw, Filter(ProjectsActivities, ProjectID = pr.ID))
                            ),
                            varAcScope = "Project",
                            If(
                                varUserHasAllProjects,
                                Collect(colAcRaw, SortByColumns(ProjectsActivities, "ID", SortOrder.Descending)),
                                ForAll(
                                    Filter(colUserProjectAccess, AllProjects = false, IsActive = true) As a,
                                    Collect(colAcRaw, Filter(ProjectsActivities, ProjectID = a.ProjectID))
                                )
                            )
                        );
                        If(
                            Not(And(varActProjectOnly, Coalesce(varSelectedProject.ID, 0) > 0)),
                            Collect(colAcRaw, Filter(ProjectsActivities, ResponsiblePersonID = varAcMe));
                            ForAll(
                                Distinct(Filter(ProjectsTasks, AssignedToID = varAcMe), ActivityID) As t,
                                Collect(colAcRaw, Filter(ProjectsActivities, ID = Coalesce(t.Value, -1)))
                            )
                        );
                        true,
                        Set(varAcErr, true)
                    );
                    ClearCollect(colAcActs, ForAll(Distinct(colAcRaw, ID) As d, LookUp(colAcRaw, ID = d.Value)));
                    Clear(colAcTasks);
                    IfError(
                        ForAll(
                            Filter(Distinct(colAcActs, ProjectID), Coalesce(Value, 0) > 0) As p,
                            Collect(colAcTasks, Filter(ProjectsTasks, ProjectID = p.Value))
                        );
                        true,
                        Set(varAcErr, true)
                    );
                    IfError(
                        ClearCollect(colAcProjAll, Projects);
                        true,
                        Set(varAcErr, true)
                    );
                    ClearCollect(colAcProjects, SortByColumns(Filter(colAcProjAll, ID in colAcActs.ProjectID), "ProjectCode", SortOrder.Ascending));
                    IfError(
                        ClearCollect(
                            colAcPeople,
                            ForAll(
                                SortByColumns(Filter(Employees, Status.Value = "Active"), "FullName", SortOrder.Ascending),
                                {ID: ID, FullName: FullName, Email: Email, EmployeeNumber: Coalesce(EmployeeNumber, "")}
                            )
                        );
                        true,
                        Set(varAcErr, true)
                    );
                    ClearCollect(
                        colAcOwners,
                        SortByColumns(
                            Filter(
                                ForAll(
                                    Distinct(colAcActs, ResponsiblePersonID) As d,
                                    {ID: Coalesce(d.Value, 0), FullName: Coalesce(LookUp(colAcActs, ResponsiblePersonID = d.Value).ResponsiblePerson.Value, "")}
                                ),
                                ID > 0
                            ),
                            "FullName",
                            SortOrder.Ascending
                        )
                    );
                    ClearCollect(
                        colAcCounts,
                        ForAll(
                            colAcActs As a,
                            {
                                ActID: a.ID,
                                ParentID: Coalesce(a.ParentActivityID, a.ParentActivity.Id, 0),
                                Total: CountRows(Filter(colAcTasks, ActivityID = a.ID, Coalesce(Status.Value, "") <> "Cancelled")),
                                Done: CountRows(Filter(colAcTasks, ActivityID = a.ID, Status.Value = "Completed")),
                                Overdue: CountRows(Filter(colAcTasks, ActivityID = a.ID, Not(IsBlank(DueDate)), DueDate < Today(), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"])))
                            }
                        )
                    );
                    ClearCollect(
                        colAcRows,
                        AddColumns(
                            colAcActs,
                            StatusText, Coalesce(Status.Value, "Not Started"),
                            TypeText, Coalesce(ActivityType.Value, "Main"),
                            ProjectText, Coalesce(Project.Value, ""),
                            OwnerText, Coalesce(ResponsiblePerson.Value, ""),
                            PhaseText, Coalesce(Phase.Value, ""),
                            TaskTotal, Sum(Filter(colAcCounts, Or(ActID = ID, ParentID = ID)), Total),
                            TaskDone, Sum(Filter(colAcCounts, Or(ActID = ID, ParentID = ID)), Done),
                            TaskOverdue, Sum(Filter(colAcCounts, Or(ActID = ID, ParentID = ID)), Overdue),
                            IsLate, And(Not(IsBlank(PlannedEnd)), PlannedEnd < Today(), Not(Coalesce(Status.Value, "") in ["Completed", "Cancelled"]))
                        )
                    );
                    If(
                        Coalesce(varAcOpenID, 0) > 0,
                        Set(varAcCurrent, LookUp(colAcRows, ID = varAcOpenID));
                        Set(varAcOpenID, 0),
                        Not(IsBlank(varAcCurrent)),
                        Set(varAcCurrent, LookUp(colAcRows, ID = varAcCurrent.ID))
                    );
                    If(Not(IsBlank(varAcCurrent)), Select(btnAcOpen));
                    If(
                        varAcErr,
                        Notify(If(gblLanguage = "Arabic", "تعذر تحميل بعض الأنشطة.", "Some activities could not be loaded."), NotificationType.Warning)
                    )
                  Text: ="AcReload"
                  Visible: =false
                  Width: =1
            - btnAcOpen:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =With(
                        {s: Sort(Filter(colAcTasks, Or(ActivityID = varAcCurrent.ID, ActivityID in Filter(colAcActs, Coalesce(ParentActivityID, ParentActivity.Id, 0) = varAcCurrent.ID).ID)), Coalesce(PlannedStart, DueDate, Date(2100, 1, 1)), SortOrder.Ascending)},
                        ClearCollect(
                            colAcSteps,
                            ForAll(
                                Sequence(CountRows(s)),
                                With(
                                    {t: Index(s, Value)},
                                    {
                                        No: Value,
                                        TaskID: t.ID,
                                        Title: Coalesce(t.Title, ""),
                                        StatusText: Coalesce(t.Status.Value, "Not Started"),
                                        Assignee: Coalesce(t.AssignedTo.Value, ""),
                                        AssignedToID: Coalesce(t.AssignedToID, 0),
                                        AssignedByID: Coalesce(t.AssignedByID, 0),
                                        ActName: Coalesce(LookUp(colAcActs, ID = t.ActivityID).Title, t.Activity.Value, ""),
                                        ActivityID: Coalesce(t.ActivityID, 0),
                                        DueDate: t.DueDate,
                                        ProgressPct: Min(100, Max(0, Coalesce(t.Progress, 0))),
                                        IsOverdue: And(Not(IsBlank(t.DueDate)), t.DueDate < Today(), Not(Coalesce(t.Status.Value, "") in ["Completed", "Cancelled"])),
                                        IsLast: Value = CountRows(s)
                                    }
                                )
                            )
                        )
                    );
                    IfError(
                        ClearCollect(
                            colAcLog,
                            SortByColumns(Filter(ProjectActivityLog, RelatedItemId = varAcCurrent.ID, RelatedEntity.Value = "Activity"), "ID", SortOrder.Descending)
                        );
                        true,
                        Clear(colAcLog);
                        true
                    )
                  Text: ="AcOpen"
                  Visible: =false
                  Width: =1
            - btnAcAct:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varAcOk, true);
                    Set(varAcNote, Trim(txtAcDlgNote.Text));
                    Set(varAcCur, LookUp(ProjectsActivities, ID = varAcCurrent.ID));
                    Set(varAcOld, Coalesce(varAcCur.Status.Value, "Not Started"));
                    Set(varAcNew, Switch(varAcOp, "start", "In Progress", "resume", "In Progress", "complete", "Completed", "hold", "On Hold", "reopen", "In Progress", varAcOld));
                    Set(varAcOpenTasks, CountRows(Filter(colAcSteps, Not(StatusText in ["Completed", "Cancelled"]))));
                    If(
                        IsBlank(varAcCur),
                        Set(varAcOk, false);
                        Notify(If(gblLanguage = "Arabic", "لم يتم العثور على النشاط.", "The activity could not be found."), NotificationType.Error),
                        Not(Or(varAcCur.ResponsiblePersonID = varAcMe, varAcCanEdit)),
                        Set(varAcOk, false);
                        Notify(If(gblLanguage = "Arabic", "ليست لديك صلاحية تغيير حالة هذا النشاط.", "You do not have permission to change this activity."), NotificationType.Error),
                        varAcOld <> varAcCurrent.StatusText,
                        Set(varAcOk, false);
                        Notify(If(gblLanguage = "Arabic", "تغيرت حالة النشاط. تم تحديث القائمة.", "The activity status has changed. The list has been refreshed."), NotificationType.Warning);
                        Select(btnAcReload),
                        And(varAcOp = "complete", varAcOpenTasks > 0),
                        Set(varAcOk, false);
                        Notify(
                            If(
                                gblLanguage = "Arabic",
                                "لا يمكن إكمال النشاط: توجد " & Text(varAcOpenTasks) & " مهام مفتوحة.",
                                "The activity cannot be completed while " & Text(varAcOpenTasks) & " task(s) are still open."
                            ),
                            NotificationType.Warning
                        ),
                        And(varAcOp = "hold", IsBlank(varAcNote)),
                        Set(varAcOk, false);
                        Notify(If(gblLanguage = "Arabic", "الرجاء كتابة سبب التعليق.", "Please enter the reason for putting the activity on hold."), NotificationType.Warning)
                    );
                    If(
                        varAcOk,
                        IfError(
                            Set(
                                varAcSaved,
                                Patch(
                                    ProjectsActivities,
                                    varAcCur,
                                    {
                                        Status: {Value: varAcNew},
                                        ActualStart: If(And(varAcOp in ["start", "resume", "complete"], IsBlank(varAcCur.ActualStart)), Today(), varAcCur.ActualStart),
                                        ActualEnd: Switch(varAcOp, "complete", Today(), "reopen", If(false, Today()), varAcCur.ActualEnd),
                                        Progress: Switch(varAcOp, "complete", 100, "reopen", Min(Coalesce(varAcCur.Progress, 0), 90), Coalesce(varAcCur.Progress, 0))
                                    }
                                )
                            ),
                            Set(varAcOk, false);
                            Notify(If(gblLanguage = "Arabic", "تعذر تحديث النشاط. حاول مرة أخرى.", "The activity could not be updated. Please try again."), NotificationType.Error)
                        )
                    );
                    If(And(varAcOk, IsBlank(varAcSaved)), Set(varAcOk, false));
                    If(
                        varAcOk,
                        fnProjLog(
                            "Activity: " & varAcSaved.Title,
                            Coalesce(varAcSaved.ProjectID, 0),
                            Coalesce(LookUp(colAcProjAll, ID = varAcSaved.ProjectID).ProjectCode, varAcSaved.Project.Value, ""),
                            "Activity",
                            varAcSaved.ID,
                            Switch(varAcOp, "start", "Started", "resume", "Resumed", "complete", "Completed", "hold", "Blocked", "reopen", "Reopened", "Updated"),
                            varAcOld & " → " & varAcNew & If(IsBlank(varAcNote), "", ": " & varAcNote)
                        );
                        IfError(
                            With(
                                {pr: LookUp(colAcProjAll, ID = varAcSaved.ProjectID)},
                                ClearCollect(
                                    colAcNotice,
                                    Filter(
                                        Table(
                                            {UserID: Coalesce(varAcSaved.ResponsiblePersonID, varAcSaved.ResponsiblePerson.Id, 0), UserName: Coalesce(varAcSaved.ResponsiblePerson.Value, "")},
                                            {UserID: Coalesce(pr.ProjectManagerID, pr.ProjectManager.Id, 0), UserName: Coalesce(pr.ProjectManager.Value, "")}
                                        ),
                                        And(UserID > 0, UserID <> varAcMe)
                                    )
                                );
                                ForAll(
                                    ForAll(Distinct(colAcNotice, UserID), LookUp(colAcNotice, UserID = Value)) As person,
                                    fnProjNotify(
                                        person.UserID,
                                        person.UserName,
                                        varAcSaved.Title,
                                        If(gblLanguage = "Arabic", varAcMeName & " غيّر حالة النشاط إلى " & varAcNew & If(IsBlank(varAcNote), "", ": " & varAcNote), varAcMeName & " changed the activity status to " & varAcNew & If(IsBlank(varAcNote), "", ": " & varAcNote)),
                                        "Activity",
                                        varAcSaved.ID,
                                        "Activity"
                                    )
                                );
                                true
                            ),
                            Notify(If(gblLanguage = "Arabic", "تم التحديث، وتعذر إرسال الإشعار.", "Updated, but the notification could not be sent."), NotificationType.Warning)
                        );
                        Set(varAcDlg, false);
                        Set(varAcOpenID, varAcSaved.ID);
                        Select(btnAcReload);
                        Notify(
                            If(gblLanguage = "Arabic", "تم تحديث حالة النشاط إلى " & varAcNew & ".", "Activity status changed to " & varAcNew & "."),
                            NotificationType.Success
                        )
                    )
                  Text: ="AcAct"
                  Visible: =false
                  Width: =1
            - btnAcSync:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varAcOk, true);
                    With(
                        {
                            tot: CountRows(Filter(colAcSteps, StatusText <> "Cancelled")),
                            done: CountRows(Filter(colAcSteps, StatusText = "Completed"))
                        },
                        If(
                            Not(varAcCanEdit),
                            Set(varAcOk, false);
                            Notify(If(gblLanguage = "Arabic", "ليست لديك صلاحية تعديل الأنشطة.", "You do not have permission to edit activities."), NotificationType.Error),
                            IfError(
                                Set(
                                    varAcSaved,
                                    Patch(
                                        ProjectsActivities,
                                        LookUp(ProjectsActivities, ID = varAcCurrent.ID),
                                        {
                                            TotalTasks: tot,
                                            'Completed Tasks': done,
                                            Progress: If(tot = 0, Coalesce(varAcCurrent.Progress, 0), Round(done / tot * 100, 0))
                                        }
                                    )
                                ),
                                Set(varAcOk, false);
                                Notify(If(gblLanguage = "Arabic", "تعذر تحديث نسبة الإنجاز.", "The progress could not be updated."), NotificationType.Error)
                            )
                        )
                    );
                    If(
                        And(varAcOk, Not(IsBlank(varAcSaved))),
                        fnProjLog(
                            "Activity: " & varAcSaved.Title,
                            Coalesce(varAcSaved.ProjectID, 0),
                            Coalesce(LookUp(colAcProjAll, ID = varAcSaved.ProjectID).ProjectCode, varAcSaved.Project.Value, ""),
                            "Activity",
                            varAcSaved.ID,
                            "Progress Updated",
                            Text(Coalesce(varAcCurrent.Progress, 0)) & "% → " & Text(Coalesce(varAcSaved.Progress, 0)) & "% (" & Text(Coalesce(varAcSaved.'Completed Tasks', 0)) & "/" & Text(Coalesce(varAcSaved.TotalTasks, 0)) & ")"
                        );
                        Set(varAcOpenID, varAcSaved.ID);
                        Select(btnAcReload);
                        Notify(If(gblLanguage = "Arabic", "تم تحديث نسبة الإنجاز من المهام.", "Progress updated from the tasks."), NotificationType.Success)
                    )
                  Text: ="AcSync"
                  Visible: =false
                  Width: =1
      - conAcPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(And(App.Width < 700, IsBlank(varAcCurrent)), cmpAcPhone.Height, 0) + If(IsBlank(varAcCurrent), 80, 16)
            PaddingLeft: =If(App.Width < 700, 15, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth + 12, gblTheme.Controls.SideNavCollapsedWidth + 12))
            PaddingRight: =8
            PaddingTop: =cmpAcTop.Height + 12
            Width: =Parent.Width
          Children:
            - conAcList:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =Parent.Height - 40
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsBlank(varAcCurrent)
                  Width: =Parent.Width
                Children:
                  - conAcTB:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        FillPortions: =0
                        Height: =48 + 44 + 36 + If(varAcFilters, conAcFilterRow.Height + 5, 0) + 2 * 5 + 24
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                      Children:
                        - conAcHead:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - conAcHeadIcon:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("PrimaryLight")
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =12
                                    RadiusBottomRight: =12
                                    RadiusTopLeft: =12
                                    RadiusTopRight: =12
                                    Width: =44
                                  Children:
                                    - imgAcHeadIcon:
                                        Control: Image@2.2.3
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =22
                                          Image: =fxSvg("Activity", fxThemeInk("Primary"))
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Width: =22
                              - conAcTitles:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lblAcTitle:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                          Color: =fxThemeColor("TextPrimary")
                                          Font: =gblTheme.Typography.FontFamily
                                          FontWeight: =gblTheme.FontWeights.Bold
                                          Height: =24
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =15
                                          Text: =If(gblLanguage = "Arabic", "الأنشطة", "Activities")
                                          Width: =Parent.Width
                                          Wrap: =false
                                    - lblAcCount:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                          Color: =fxThemeColor("TextMuted")
                                          Font: =gblTheme.Typography.FontFamily
                                          Height: =20
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =gblTheme.Typography.BodySmall
                                          Text: |-
                                            =Concatenate(
                                                Text(CountRows(
                                                    Filter(
                                                        colAcRows,
                                                        Or(varAcStatus = "All", StatusText = varAcStatus),
                                                        Or(varAcType = "All", TypeText = varAcType),
                                                        Or(Coalesce(varAcProjectID, 0) = 0, ProjectID = varAcProjectID),
                                                        Or(varAcOwner = "All", OwnerText = varAcOwner),
                                                        Or(Not(varAcMine), ResponsiblePersonID = varAcMe),
                                                        Or(Not(Coalesce(varAcLateOnly, false)), IsLate),
                                                        Or(
                                                            IsBlank(Trim(txtAcSearch.Text)),
                                                            Trim(txtAcSearch.Text) in Title,
                                                            Trim(txtAcSearch.Text) in Coalesce(ActivityCode, ""),
                                                            Trim(txtAcSearch.Text) in ProjectText,
                                                            Trim(txtAcSearch.Text) in OwnerText
                                                        )
                                                    )
                                                )),
                                                If(gblLanguage = "Arabic", " من ", " of "),
                                                Text(CountRows(colAcRows)),
                                                If(gblLanguage = "Arabic", " نشاط", " activities"),
                                                If(And(varActProjectOnly, Coalesce(varSelectedProject.ID, 0) > 0), " · " & Coalesce(varSelectedProject.ProjectCode, varSelectedProject.Title, ""), "")
                                            )
                                          Width: =Parent.Width
                                          Wrap: =false
                              - conAcProjectOnly:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =fxThemeColor("Border")
                                    BorderThickness: =1
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Surface")
                                    FillPortions: =0
                                    Height: =36
