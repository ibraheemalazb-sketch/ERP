                        EnableHover: =true
                        EnableMenu: =true
                        HeaderAction: =""
                        HeaderColumn1: =If(gblLanguage = "Arabic", "البداية المخططة", "Planned start")
                        HeaderColumn2: =If(gblLanguage = "Arabic", "المشروع", "Project")
                        HeaderColumn3: =If(gblLanguage = "Arabic", "المرحلة", "Phase")
                        HeaderHeight: =40
                        HeaderId: =
                        HeaderPerson: =If(gblLanguage = "Arabic", "المسؤول", "Responsible")
                        HeaderPriority: =If(gblLanguage = "Arabic", "النوع", "Type")
                        HeaderProgress: =If(gblLanguage = "Arabic", "المهام", "Tasks")
                        HeaderStatus: =If(gblLanguage = "Arabic", "الحالة", "Status")
                        HeaderSubtitle: =If(gblLanguage = "Arabic", "الرمز", "Code")
                        HeaderTitle: =If(gblLanguage = "Arabic", "النشاط", "Activity")
                        HeaderWhen: =If(gblLanguage = "Arabic", "النهاية المخططة", "Planned end")
                        Height: =Max(480, App.Height - cmpAcTop.Height - If(App.Width < 700, cmpAcPhone.Height, 0) - 330)
                        Items: |-
                          =ForAll(
                              Sort(
                                  Filter(
                                      colAcRows,
                                      Or(varAcStatus = "All", StatusText = varAcStatus),
                                      Or(varAcType = "All", TypeText = varAcType),
                                      Or(Coalesce(varAcProjectID, 0) = 0, ProjectID = varAcProjectID),
                                      Or(varAcOwner = "All", OwnerText = varAcOwner),
                                      Or(Not(varAcMine), ResponsiblePersonID = varAcMe),
                                      Or(Not(Coalesce(varAcLateOnly, false)), IsLate),
                                      Or(
                                          IsBlank(Trim(txtAcSearch.Text)),
                                          Trim(txtAcSearch.Text) in Title,
                                          Trim(txtAcSearch.Text) in Coalesce(ActivityCode, ""),
                                          Trim(txtAcSearch.Text) in ProjectText,
                                          Trim(txtAcSearch.Text) in OwnerText
                                      )
                                  ),
                                  Coalesce(PlannedStart, Date(2100, 1, 1)),
                                  SortOrder.Ascending
                              ) As a,
                              {
                                  RowKey: Text(a.ID),
                                  Title: Coalesce(a.Title, "-"),
                                  Subtitle: Coalesce(a.ActivityCode, "-"),
                                  Column1: If(IsBlank(a.PlannedStart), "-", Text(a.PlannedStart, "dd-mmm-yyyy")),
                                  Column2: Coalesce(a.ProjectText, "-"),
                                  Column3: Coalesce(a.PhaseText, "-"),
                                  Status: If(gblLanguage = "Arabic", Switch(a.StatusText, "Not Started", "لم يبدأ", "In Progress", "قيد التنفيذ", "On Hold", "معلّق", "Pending Review", "بانتظار المراجعة", "Completed", "مكتمل", "Cancelled", "ملغي", a.StatusText), a.StatusText),
                                  Tone: If(a.IsLate, "danger", fxStatusPillTone(a.StatusText)),
                                  Priority: If(a.TypeText = "SubActivity", If(gblLanguage = "Arabic", "فرعي", "Sub"), If(gblLanguage = "Arabic", "رئيسي", "Main")),
                                  PriorityTone: If(a.TypeText = "SubActivity", "info", "low"),
                                  Person: If(IsBlank(a.OwnerText), "-", a.OwnerText),
                                  WhenText: If(IsBlank(a.PlannedEnd), "-", Text(a.PlannedEnd, "dd-mmm-yyyy")) & If(a.IsLate, " !", ""),
                                  ProgressDone: a.TaskDone,
                                  ProgressTotal: a.TaskTotal,
                                  IconName: If(a.TypeText = "SubActivity", "Layers", "Activity")
                              }
                          )
                        LayoutMinHeight: =360
                        LayoutMinWidth: =320
                        OnMenuItemSelect: |-
                          =With(
                              {row: LookUp(colAcRows, ID = Value(cmpAcTable.SelectedItem.RowKey))},
                              Switch(
                                  cmpAcTable.SelectedMenuItem.ItemKey,
                                  "view",
                                  Set(varAcQuick, row);
                                  ClearCollect(
                                      colAcQuickFacts,
                                      {Label: If(gblLanguage = "Arabic", "المشروع", "Project"), Icon: "Folder", Value: Coalesce(varAcQuick.ProjectText, "-")},
                                      {Label: If(gblLanguage = "Arabic", "المسؤول", "Responsible"), Icon: "User", Value: Coalesce(varAcQuick.OwnerText, "-")},
                                      {Label: If(gblLanguage = "Arabic", "المرحلة", "Phase"), Icon: "Layers", Value: Coalesce(varAcQuick.PhaseText, "-")},
                                      {
