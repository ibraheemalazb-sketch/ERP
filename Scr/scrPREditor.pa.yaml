                  - conPRItemPopupFooter:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - btnPRItemPopupCancel:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              FillPortions: =0
                              Height: =40
                              LayoutMinWidth: =88
                              OnSelect: =Set(varShowPRItemPopup, false)
                              Text: =If(gblLanguage = "Arabic", "إلغاء", "Cancel")
                              Width: =110
                        - btnPRItemPopupSave:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Primary
                              FillPortions: =0
                              Height: =40
                              LayoutMinWidth: =110
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(txtPRPopupDescription.Text)),
                                    Notify(If(gblLanguage = "Arabic", "يرجى إدخال وصف البند.", "Please enter the item description."), NotificationType.Error),
                                    Value(txtPRPopupQuantity.Text) <= 0,
                                    Notify(If(gblLanguage = "Arabic", "يجب أن تكون الكمية أكبر من صفر.", "Quantity must be greater than zero."), NotificationType.Error),
                                    Set(
                                        varSelectedPRLine,
                                        Patch(
                                            varSelectedPRLine,
                                            {
                                                Description: txtPRPopupDescription.Text,
                                                Specification: txtPRPopupSpecification.Text,
                                                Quantity: Value(txtPRPopupQuantity.Text),
                                                EstimatedUnitPrice: Value(txtPRPopupUnitPrice.Text),
                                                Total: Value(txtPRPopupQuantity.Text) * Value(txtPRPopupUnitPrice.Text),
                                                Remarks: txtPRPopupRemarks.Text
                                            }
                                        )
                                    );
                                    If(
                                        varPRItemMode = "New",
                                        Collect(colPRLines, varSelectedPRLine),
                                        Patch(
                                            colPRLines,
                                            LookUp(colPRLines, LineNumber = varSelectedPRLine.LineNumber),
                                            varSelectedPRLine
                                        )
                                    );
                                    Set(varShowPRItemPopup, false)
                                )
                              Text: =If(gblLanguage = "Arabic", "حفظ البند", "Save item")
                              Visible: =varPRItemMode <> "View"
                              Width: =140
