Screens:
  scrPREditor:
    Properties:
      Fill: =fxThemeColor("Background")
      LoadingSpinnerColor: =fxThemeColor("Primary")
      OnVisible: |-
        =If(IsBlank(gblMenuExpanded), Set(gblMenuExpanded, true));
        Set(gblSelectedModule, "Procurement");
        Set(varCurrentScreen, "Procurement");
        Set(VarScreen, "Procurement");
        Set(varProcurementTab, "PRs");
        Set(varNavSelectedID, 32);
        Set(varProcurementEntity, "PurchaseRequest");
        Set(varShowPRItemPopup, false);
        Set(varPRItemMode, "New");
        If(
            varProcurementMode = "New",
            Set(varCurrentPR, Blank());
            Set(varNewPR, Blank());
            Set(varProcProject, Blank());
            ClearCollect(
                colPRLines,
                {
                    LineNumber: 1,
                    BudgetLine: Blank(),
                    ItemCategory: Blank(),
                    Description: "",
                    Specification: "",
                    Unit: Blank(),
                    Quantity: 1,
                    EstimatedUnitPrice: 0,
                    Total: 0,
                    RequiredDate: Blank(),
                    Remarks: "",
                    WareHouseID: Blank()
                }
            );
            Reset(cmbProjectPR);
            Reset(cmbRequesterPR);
            Reset(dteRequestDatePR);
            Reset(dteRequiredDatePR);
            Reset(cmbPriorityPR);
            Reset(cmbCurrencyPR);
            Reset(cmbSupervisorPR);
            Reset(cmbApproverPR);
            Reset(cmbFinanceOfficerPR);
            Reset(cmbProcurementPR);
            Reset(cmbLocationPR);
            Reset(txtPurposePR),
            If(
                Not(IsBlank(varCurrentPR)),
                Set(varProcProject, LookUp(Projects, ID = varCurrentPR.Project.Id));
                Clear(colPRLines);
                With(
                    {Lines: Filter(PurchaseRequestLines, PRID = varCurrentPR.ID)},
                    If(
                        IsEmpty(Lines),
                        Notify(
                            If(gblLanguage = "Arabic", "لا توجد بنود لهذا الطلب.", "No lines found for this PR."),
                            NotificationType.Warning
                        );
                        Collect(
                            colPRLines,
                            {
                                LineNumber: 1,
                                BudgetLine: Blank(),
                                ItemCategory: Blank(),
                                Description: "",
                                Specification: "",
                                Unit: Blank(),
                                Quantity: 1,
                                EstimatedUnitPrice: 0,
                                Total: 0,
                                RequiredDate: Blank(),
                                Remarks: "",
                                WareHouseID: Blank()
                            }
                        ),
                        ForAll(
                            Sort(Lines, LineNumber, SortOrder.Ascending) As Line,
                            Collect(
                                colPRLines,
                                {
                                    LineNumber: Line.LineNumber,
                                    BudgetLine: If(
                                        Not(IsBlank(Line.BudgetLine)),
                                        {Id: Line.BudgetLine.Id, Value: Line.BudgetLine.Value},
                                        Blank()
                                    ),
                                    ItemCategory: Line.ItemCategory,
                                    Description: Coalesce(Line.Description, ""),
                                    Specification: Coalesce(Line.Specification, ""),
                                    Unit: Line.Unit,
                                    Quantity: Value(Coalesce(Line.Quantity, 0)),
                                    EstimatedUnitPrice: Value(Coalesce(Line.EstimatedUnitPrice, 0)),
                                    Total: Value(Coalesce(Line.Quantity, 0)) * Value(Coalesce(Line.EstimatedUnitPrice, 0)),
                                    RequiredDate: Line.RequiredDate,
                                    Remarks: Coalesce(Line.Remarks, ""),
                                    WareHouseID: Line.WareHouseID
                                }
                            )
                        )
                    )
                );
                Reset(cmbProjectPR);
                Reset(cmbRequesterPR);
                Reset(dteRequestDatePR);
                Reset(dteRequiredDatePR);
                Reset(cmbPriorityPR);
                Reset(cmbCurrencyPR);
                Reset(cmbSupervisorPR);
                Reset(cmbApproverPR);
                Reset(cmbFinanceOfficerPR);
                Reset(cmbProcurementPR);
                Reset(cmbLocationPR);
                Reset(txtPurposePR),
                Notify(
                    If(gblLanguage = "Arabic", "لم يتم اختيار طلب. ارجع واختر طلباً.", "No PR selected. Please go back and choose one."),
                    NotificationType.Error
                )
            )
        );
        Set(
            varPrCanEdit,
            Or(
                varProcurementMode = "New",
                And(Not(IsBlank(varCurrentPR)), varCurrentPR.Status.Value = "Draft")
            )
        )
    Children:
      - conEdPrNav:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fxThemeColor("Surface")
            Height: =Parent.Height
            Visible: =App.Width >= 700
            Width: =If(gblMenuExpanded, 240, 68)
            X: =0
            Y: =0
          Children:
            - cmpEdPrNav:
                Control: CanvasComponent
                ComponentName: cmpNavigationModern
                Properties:
                  AppLogo: =hdp
                  Expanded: =gblMenuExpanded
                  Height: =Parent.Height
                  Icons: |-
                    =Table({Name: "Home", SVG: ""})
                  OnToggle: |-
                    =Set(gblMenuExpanded, Not(Coalesce(gblMenuExpanded, true)));
                    If(Not(gblMenuExpanded), Set(gblNavOpenId, -1))
                  Theme: =gblTheme.Mode
                  Width: =Parent.Width
                  X: =0
                  Y: =0
      - cmpEdPrTop:
          Control: CanvasComponent
          ComponentName: cmpTopBar
          Properties:
            ActionsVisible: =true
            BadgeCount: =0
            HasNotifications: =false
            Height: =56
            ModuleIcon: ="ShoppingCart"
            ModuleName: =If(gblLanguage = "Arabic", "المشتريات", "Procurement")
            OnSelectTitle: |-
              =Set(varProcurementMode, "View");
              Navigate(scrPRs, ScreenTransition.UnCover)
            ScreenSubtitle: |-
              =If(
                  varProcurementMode = "New",
                  If(gblLanguage = "Arabic", "طلب جديد", "New request"),
                  Coalesce(varCurrentPR.PRNumber, If(gblLanguage = "Arabic", "تعديل", "Edit"))
              )
            ScreenTitle: =If(gblLanguage = "Arabic", "محرر طلب الشراء", "Purchase request editor")
            ShowBreadcrumb: =true
            ShowLanguage: =true
            ShowNotifications: =true
            ShowSearch: =false
            ShowTheme: =true
            ShowUser: =true
            Theme: =gblTheme.Mode
            Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            X: =If(App.Width < 700, 0, If(gblMenuExpanded, 240, 68))
            Y: =0
      - cmpEdPrPhone:
          Control: CanvasComponent
          ComponentName: cmpBTNav
          Properties:
            Height: =52
            IconsBtn: |-
              =Table({Name: "Home", SVG: ""})
            ItemsBtnNav: |-
              =Table(
                  {ID: 1, Module: "Home", Title: If(gblLanguage = "Arabic", "الرئيسية", "Home"), Icon: "Home", Visible: true},
                  {ID: 10, Module: "HR", Title: If(gblLanguage = "Arabic", "الموارد", "HR"), Icon: "Users", Visible: true},
                  {ID: 20, Module: "Programs", Title: If(gblLanguage = "Arabic", "البرامج", "Programs"), Icon: "Layers", Visible: true},
                  {ID: 30, Module: "Procurement", Title: If(gblLanguage = "Arabic", "المشتريات", "Procurement"), Icon: "ShoppingCart", Visible: true},
                  {ID: 40, Module: "MEAL", Title: If(gblLanguage = "Arabic", "التقييم", "MEAL"), Icon: "Dashboard", Visible: true},
                  {ID: 50, Module: "Finance", Title: If(gblLanguage = "Arabic", "المالية", "Finance"), Icon: "Money", Visible: true},
                  {ID: 70, Module: "Settings", Title: If(gblLanguage = "Arabic", "إعدادات", "Settings"), Icon: "Settings", Visible: true}
              )
            OnNavigateBtn: |-
              =Switch(
                  gblSelectedModule,
                  "Home", Navigate(ScrHome, ScreenTransition.None),
                  "HR", Navigate(ScrHR, ScreenTransition.None),
                  "Programs", Navigate(scrProjects, ScreenTransition.None),
                  "Procurement", Navigate(scrProcurement, ScreenTransition.None),
                  "MEAL", Navigate(scrMEAL, ScreenTransition.None),
                  "Finance", Navigate(scrFinance, ScreenTransition.None),
                  "Settings", Navigate(ScrSettings, ScreenTransition.None)
              )
            Visible: =App.Width < 700
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - Self.Height
      - conEdPrPage:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =12
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =If(App.Width < 700, cmpEdPrPhone.Height + 16, 24)
            PaddingLeft: =If(App.Width < 700, 12, If(gblMenuExpanded, 240, 68) + 16)
            PaddingRight: =16
            PaddingTop: =cmpEdPrTop.Height + 12
            Width: =Parent.Width
          Children:
            - conEdPrHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =If(App.Width < 700, 148, 64)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =64
                  LayoutMinWidth: =0
                  LayoutWrap: =App.Width < 700
                  PaddingLeft: =12
                  PaddingRight: =12
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Parent.Width
                Children:
                  - btnEdPrBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Transparent
                        BasePaletteColor: =fxThemeColor("Primary")
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="ArrowLeft"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =Set(varProcurementMode, "View");
                          Navigate(scrPRs, ScreenTransition.UnCover)
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "الطلبات", "Requests"))
                        Width: =If(App.Width < 700, 44, 120)
                  - lblEdPrTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        LayoutMinWidth: =140
                        PaddingBottom: =0
                        PaddingTop: =6
                        Size: =15
                        Text: |-
                          =If(
                              varProcurementMode = "New",
                              If(gblLanguage = "Arabic", "طلب شراء جديد", "New purchase request"),
                              Coalesce(varCurrentPR.PRNumber, If(gblLanguage = "Arabic", "تعديل الطلب", "Edit request"))
                          )
                        Width: =If(App.Width < 700, Parent.Width - 180, 240)
                        Wrap: =false
                  - lblEdPrStatus:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        Color: =fxThemeColor("TextSecondary")
                        Fill: =fxThemeColor("SurfaceHover")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =FontWeight.Semibold
                        Height: =32
                        LayoutMinWidth: =88
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =4
                        Size: =12
                        Text: =If(varProcurementMode = "New", "Draft", Coalesce(varCurrentPR.Status.Value, "Draft"))
                        Width: =110
                        Wrap: =false
                  - lblEdPrGap:
                      Control: Label@2.5.1
                      Properties:
                        FillPortions: =1
                        Height: =8
                        LayoutMinWidth: =8
                        Text: =""
                        Visible: =App.Width >= 700
                  - btnEdPrSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Secondary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Save"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              IsBlank(cmbProjectPR.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار مشروع.", "Please select a Project."), NotificationType.Error),
                              IsBlank(cmbRequesterPR.Selected),
                              Notify(If(gblLanguage = "Arabic", "تعذر التعرف على مقدم الطلب.", "Requester could not be identified automatically."), NotificationType.Error),
                              IsBlank(cmbSupervisorPR.Selected),
                              Notify(If(gblLanguage = "Arabic", "تعذر التعرف على المشرف المباشر.", "The Requester's direct Supervisor could not be identified."), NotificationType.Error),
                              IsBlank(cmbApproverPR.Selected),
                              Notify(If(gblLanguage = "Arabic", "تعذر التعرف على مدير المشروع.", "The Project Manager could not be identified automatically."), NotificationType.Error),
                              IsBlank(cmbLocationPR.Selected),
                              Notify(If(gblLanguage = "Arabic", "الرجاء اختيار موقع الاستلام.", "Please select a delivery location."), NotificationType.Error),
                              IsBlank(Trim(txtPurposePR.Text)),
                              Notify(If(gblLanguage = "Arabic", "الرجاء إدخال الغرض من الطلب.", "Please enter the Purpose of Request."), NotificationType.Error),
                              CountRows(colPRLines) = 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إضافة عنصر شراء واحد على الأقل.", "Please add at least one purchase item."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colPRLines,
                                      Or(
                                          IsBlank(BudgetLine),
                                          IsBlank(Trim(Description)),
                                          IsBlank(Unit),
                                          Value(Quantity) <= 0
                                      )
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إكمال جميع بنود الشراء قبل الحفظ.", "Please complete all purchase lines before saving."), NotificationType.Error),
                              Set(varTotalAmount, Sum(colPRLines, Value(Quantity) * Value(EstimatedUnitPrice)));
                              Set(varProcLogNew, varProcurementMode = "New");
                              Set(varProcAttachNames, "");
                              If(
                                  varProcurementMode = "New",
                                  Set(
                                      varNewPR,
                                      Patch(
                                          PurchaseRequests,
                                          Defaults(PurchaseRequests),
                                          {
                                              Title: "TEMP-PR-" & Text(Now(), "yyyymmddhhmmss"),
                                              PRNumber: "TEMP-PR-" & Text(Now(), "yyyymmddhhmmss"),
                                              RequestDate: dteRequestDatePR.SelectedDate,
                                              RequiredDate: dteRequiredDatePR.SelectedDate,
                                              ReceivedByID: cmbProcurementPR.Selected.ID,
                                              NoItems: CountRows(colPRLines),
                                              Location: {Id: cmbLocationPR.Selected.ID, Value: cmbLocationPR.Selected.LocationCode},
                                              LocationID: cmbLocationPR.Selected.ID,
                                              Project: {Id: cmbProjectPR.Selected.ID, Value: cmbProjectPR.Selected.ProjectCode},
                                              ProjectID: cmbProjectPR.Selected.ID,
                                              RequesterID: cmbRequesterPR.Selected.ID,
                                              Requester: {Id: cmbRequesterPR.Selected.ID, Value: cmbRequesterPR.Selected.FullName},
                                              Supervisor: {Id: cmbSupervisorPR.Selected.ID, Value: cmbSupervisorPR.Selected.FullName},
                                              SupervisorID: cmbSupervisorPR.Selected.ID,
                                              Approver: {Id: cmbApproverPR.Selected.ID, Value: cmbApproverPR.Selected.FullName},
                                              ApproverID: cmbApproverPR.Selected.ID,
                                              ReceivedBy: {Id: cmbProcurementPR.Selected.ID, Value: cmbProcurementPR.Selected.FullName},
                                              FinancialApprover: {Id: cmbFinanceOfficerPR.Selected.ID, Value: cmbFinanceOfficerPR.Selected.FullName},
                                              FinancialApproverID: cmbFinanceOfficerPR.Selected.ID,
                                              ReasonRequired: txtPurposePR.Text,
                                              TotalAmount: varTotalAmount,
                                              ProcurementMethod: {
                                                  Value: If(varTotalAmount < 100, "DirectPurchase", If(varTotalAmount < 5000, "RFQs", "Tender"))
                                              },
                                              Currency: If(
                                                  IsBlank(cmbCurrencyPR.Selected),
                                                  LookUp(Choices(PurchaseRequests.Currency), Value = "USD"),
                                                  cmbCurrencyPR.Selected
                                              ),
                                              Priority: cmbPriorityPR.Selected,
                                              Status: {Value: "Draft"}
                                          }
                                      )
                                  );
                                  Set(
                                      varPRNumber,
                                      cmbProjectPR.Selected.ProjectCode & "-PR-" & Text(Year(dteRequestDatePR.SelectedDate), "0000") & "-" & Text(varNewPR.ID, "0")
                                  );
                                  Set(
                                      varNewPR,
                                      Patch(
                                          PurchaseRequests,
                                          varNewPR,
                                          {Title: varPRNumber, PRNumber: varPRNumber, ProjectID: cmbProjectPR.Selected.ID}
                                      )
                                  ),
                                  Set(
                                      varNewPR,
                                      Patch(
                                          PurchaseRequests,
                                          varCurrentPR,
                                          {
                                              RequestDate: dteRequestDatePR.SelectedDate,
                                              RequiredDate: dteRequiredDatePR.SelectedDate,
                                              Project: {Id: cmbProjectPR.Selected.ID, Value: cmbProjectPR.Selected.ProjectCode},
                                              ProjectID: cmbProjectPR.Selected.ID,
                                              RequesterID: cmbRequesterPR.Selected.ID,
                                              ReceivedByID: cmbProcurementPR.Selected.ID,
                                              NoItems: CountRows(colPRLines),
                                              Requester: {Id: cmbRequesterPR.Selected.ID, Value: cmbRequesterPR.Selected.FullName},
                                              Supervisor: {Id: cmbSupervisorPR.Selected.ID, Value: cmbSupervisorPR.Selected.FullName},
                                              SupervisorID: cmbSupervisorPR.Selected.ID,
                                              Approver: {Id: cmbApproverPR.Selected.ID, Value: cmbApproverPR.Selected.FullName},
                                              ApproverID: cmbApproverPR.Selected.ID,
                                              ReceivedBy: {Id: cmbProcurementPR.Selected.ID, Value: cmbProcurementPR.Selected.FullName},
                                              FinancialApprover: {Id: cmbFinanceOfficerPR.Selected.ID, Value: cmbFinanceOfficerPR.Selected.FullName},
                                              FinancialApproverID: cmbFinanceOfficerPR.Selected.ID,
                                              Location: {Id: cmbLocationPR.Selected.ID, Value: cmbLocationPR.Selected.LocationCode},
                                              LocationID: cmbLocationPR.Selected.ID,
                                              ReasonRequired: txtPurposePR.Text,
                                              TotalAmount: varTotalAmount,
                                              ProcurementMethod: {
                                                  Value: If(varTotalAmount < 100, "DirectPurchase", If(varTotalAmount < 5000, "RFQs", "Tender"))
                                              },
                                              Currency: If(
                                                  IsBlank(cmbCurrencyPR.Selected),
                                                  LookUp(Choices(PurchaseRequests.Currency), Value = "USD"),
                                                  cmbCurrencyPR.Selected
                                              ),
                                              Priority: cmbPriorityPR.Selected,
                                              Status: {Value: "Draft"}
                                          }
                                      )
                                  )
                              );
                              If(
                                  CountRows(attEdPr.Attachments) > 0,
                                  IfError(
                                      Patch(PurchaseRequests, varNewPR, {Attachments: attEdPr.Attachments});
                                      Set(varProcAttachNames, Concat(attEdPr.Attachments, Name, ", ")),
                                      Notify(If(gblLanguage = "Arabic", "تم حفظ المسودة، وتعذر إرفاق الملفات.", "The draft was saved, but the files could not be attached."), NotificationType.Warning);
                                      Set(varProcAttachNames, "")
                                  )
                              );
                              RemoveIf(PurchaseRequestLines, PRID = varNewPR.ID);
                              ForAll(
                                  colPRLines As Line,
                                  Patch(
                                      PurchaseRequestLines,
                                      Defaults(PurchaseRequestLines),
                                      {
                                          Title: varNewPR.PRNumber & "-" & Text(Line.LineNumber),
                                          PR: {Id: varNewPR.ID, Value: varNewPR.PRNumber},
                                          PRNo: varNewPR.PRNumber,
                                          PRID: varNewPR.ID,
                                          LineNumber: Line.LineNumber,
                                          BudgetLine: If(
                                              Not(IsBlank(Line.BudgetLine)),
                                              {Id: Line.BudgetLine.Id, Value: Line.BudgetLine.Value},
                                              Blank()
                                          ),
                                          BudgetLineID: If(IsBlank(Line.BudgetLine), Blank(), Line.BudgetLine.Id),
                                          ItemCategory: Line.ItemCategory,
                                          Description: Line.Description,
                                          Specification: Line.Specification,
                                          Unit: Line.Unit,
                                          Quantity: Value(Line.Quantity),
                                          EstimatedUnitPrice: Value(Line.EstimatedUnitPrice),
                                          Total: Value(Line.Quantity) * Value(Line.EstimatedUnitPrice),
                                          RequiredDate: If(Not(IsBlank(Line.RequiredDate)), Line.RequiredDate, dteRequiredDatePR.SelectedDate),
                                          Remarks: Line.Remarks,
                                          WareHouseID: Line.WareHouseID
                                      }
                                  )
                              );
                              Set(varCurrentPR, varNewPR);
                              Set(varPRNumber, varNewPR.PRNumber);
                              Set(varProcurementMode, "Edit");
                              Set(varPrCanEdit, true);
                              Refresh(PurchaseRequests);
                              Refresh(PurchaseRequestLines);
                              Concurrent(
                                  fnWriteLog(
                                      "Purchase Request",
                                      varNewPR.ID,
                                      varNewPR.PRNumber,
                                      If(varProcLogNew, "Created", "Updated"),
                                      "Info",
                                      Coalesce(varNewPR.ProjectID, 0),
                                      Coalesce(cmbProjectPR.Selected.ProjectCode, ""),
                                      Coalesce(varNewPR.TotalAmount, 0),
                                      Coalesce(varNewPR.Currency.Value, ""),
                                      "",
                                      "",
                                      "",
                                      "",
                                      "",
                                      0
                                  ),
                                  Notify(
                                      If(
                                          gblLanguage = "Arabic",
                                          "تم حفظ طلب الشراء " & varNewPR.PRNumber & " كمسودة.",
                                          "Purchase Request " & varNewPR.PRNumber & " has been saved as draft."
                                      ),
                                      NotificationType.Success
                                  )
                              );
                              If(
                                  Len(varProcAttachNames) > 0,
                                  fnWriteLog(
                                      "Purchase Request",
                                      varNewPR.ID,
                                      varNewPR.PRNumber,
                                      "Attached",
                                      "Info",
                                      Coalesce(varNewPR.ProjectID, 0),
                                      Coalesce(cmbProjectPR.Selected.ProjectCode, ""),
                                      Blank(),
                                      "",
                                      "",
                                      "",
                                      "",
                                      varProcAttachNames,
                                      "",
                                      0
                                  )
                              )
                          )
                        Text: =If(App.Width < 700, "", If(gblLanguage = "Arabic", "حفظ كمسودة", "Save draft"))
                        Visible: =varPrCanEdit
                        Width: =If(App.Width < 700, 44, 140)
                  - btnEdPrSubmit:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Primary
                        FillPortions: =0
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Icon: ="Send"
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =If(
                              Or(IsBlank(varCurrentPR), varProcurementMode = "New"),
                              Notify(If(gblLanguage = "Arabic", "يرجى حفظ الطلب كمسودة أولاً.", "Please save the Purchase Request as a draft first."), NotificationType.Error),
                              varCurrentPR.Status.Value <> "Draft",
                              Notify(If(gblLanguage = "Arabic", "يمكن الإرسال فقط عندما تكون الحالة مسودة.", "The Purchase Request can only be submitted when its status is Draft."), NotificationType.Error),
                              CountRows(colPRLines) = 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إضافة عنصر شراء واحد على الأقل.", "Please add at least one purchase item."), NotificationType.Error),
                              CountRows(
                                  Filter(
                                      colPRLines,
                                      Or(IsBlank(BudgetLine), IsBlank(Trim(Description)), IsBlank(Unit), Value(Quantity) <= 0)
                                  )
                              ) > 0,
                              Notify(If(gblLanguage = "Arabic", "الرجاء إكمال جميع البنود قبل الإرسال.", "Please complete all purchase lines before submitting."), NotificationType.Error),
                              Set(varTotalAmount, Sum(colPRLines, Value(Quantity) * Value(EstimatedUnitPrice)));
                              If(
                                  Confirm(
                                      If(
                                          gblLanguage = "Arabic",
                                          "هل تريد إرسال طلب الشراء " & varCurrentPR.PRNumber & " بقيمة " & Text(varTotalAmount, "#,##0.00") & "؟",
                                          "Submit purchase request " & varCurrentPR.PRNumber & " for " & Text(varTotalAmount, "#,##0.00") & "?"
                                      )
                                  ),
                                  Set(
                                      varSubmittedPR,
                                      Patch(
                                          PurchaseRequests,
                                          varCurrentPR,
                                          {Status: {Value: "Submitted"}, TotalAmount: varTotalAmount, NoItems: CountRows(colPRLines)}
                                      )
                                  );
                                  Set(varCurrentPR, varSubmittedPR);
                                  Set(varPRNumber, varSubmittedPR.PRNumber);
                                  Set(varPrCanEdit, false);
                                  Refresh(PurchaseRequests);
                                  Refresh(PurchaseRequestLines);
                                  Concurrent(
                                      fnWriteLog(
                                          "Purchase Request",
                                          varSubmittedPR.ID,
                                          varSubmittedPR.PRNumber,
                                          "Submitted",
                                          "Important",
                                          Coalesce(varSubmittedPR.ProjectID, 0),
                                          Coalesce(varSubmittedPR.Project.Value, ""),
                                          Coalesce(varSubmittedPR.TotalAmount, varTotalAmount, 0),
                                          Coalesce(varSubmittedPR.Currency.Value, ""),
                                          "Status",
                                          "Draft",
                                          "Submitted",
                                          "",
                                          "",
                                          0
                                      ),
                                      Notify(
                                          If(
                                              gblLanguage = "Arabic",
                                              "تم إرسال " & varSubmittedPR.PRNumber & " للاعتماد.",
                                              varSubmittedPR.PRNumber & " has been submitted for approval."
                                          ),
                                          NotificationType.Success
                                      )
                                  );
                                  IfError(
                                      With(
                                          {
                                              me: Coalesce(gblCurrentEmployee.ID, gblUser.ID, 0),
                                              sup: Coalesce(varSubmittedPR.SupervisorID, 0),
                                              app: Coalesce(varSubmittedPR.ApproverID, 0),
                                              fin: Coalesce(varSubmittedPR.FinancialApproverID, 0),
                                              who: Coalesce(gblCurrentEmployee.FullName, gblUser.FullName, "")
                                          },
                                          If(
                                              And(sup > 0, sup <> me),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varSubmittedPR.PRNumber, ApproverID = sup, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varSubmittedPR.PRNumber & " - Pending", 255),
                                                          RequestItemID: Text(varSubmittedPR.ID),
                                                          RequestType: {Value: "Purchase Request"},
                                                          RequestNumber: varSubmittedPR.PRNumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: sup, Value: Coalesce(varSubmittedPR.Supervisor.Value, "")},
                                                          ApproverID: sup,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 1,
                                                          EntityType: {Value: "PurchaseRequest"},
                                                          Requester: {Id: Coalesce(varSubmittedPR.RequesterID, 0), Value: Coalesce(varSubmittedPR.Requester.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(sup, Coalesce(varSubmittedPR.Supervisor.Value, ""), "Approval needed for " & varSubmittedPR.PRNumber, who & " submitted " & varSubmittedPR.PRNumber & " for your approval.", "PurchaseRequest", varSubmittedPR.ID, "PurchaseRequest")
                                          );
                                          If(
                                              And(app > 0, app <> me, app <> sup),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varSubmittedPR.PRNumber, ApproverID = app, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varSubmittedPR.PRNumber & " - Pending", 255),
                                                          RequestItemID: Text(varSubmittedPR.ID),
                                                          RequestType: {Value: "Purchase Request"},
                                                          RequestNumber: varSubmittedPR.PRNumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: app, Value: Coalesce(varSubmittedPR.Approver.Value, "")},
                                                          ApproverID: app,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 2,
                                                          EntityType: {Value: "PurchaseRequest"},
                                                          Requester: {Id: Coalesce(varSubmittedPR.RequesterID, 0), Value: Coalesce(varSubmittedPR.Requester.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(app, Coalesce(varSubmittedPR.Approver.Value, ""), "Approval needed for " & varSubmittedPR.PRNumber, who & " submitted " & varSubmittedPR.PRNumber & " for your approval.", "PurchaseRequest", varSubmittedPR.ID, "PurchaseRequest")
                                          );
                                          If(
                                              And(fin > 0, fin <> me, fin <> sup, fin <> app),
                                              If(
                                                  IsBlank(LookUp(ApprovalHistory, And(RequestNumber = varSubmittedPR.PRNumber, ApproverID = fin, Decision.Value = "Pending"))),
                                                  Patch(
                                                      ApprovalHistory,
                                                      Defaults(ApprovalHistory),
                                                      {
                                                          Title: Left(varSubmittedPR.PRNumber & " - Pending", 255),
                                                          RequestItemID: Text(varSubmittedPR.ID),
                                                          RequestType: {Value: "Purchase Request"},
                                                          RequestNumber: varSubmittedPR.PRNumber,
                                                          Decision: {Value: "Pending"},
                                                          Approver: {Id: fin, Value: Coalesce(varSubmittedPR.FinancialApprover.Value, "")},
                                                          ApproverID: fin,
                                                          Module: {Value: "Procurement"},
                                                          Sequence: 3,
                                                          EntityType: {Value: "PurchaseRequest"},
                                                          Requester: {Id: Coalesce(varSubmittedPR.RequesterID, 0), Value: Coalesce(varSubmittedPR.Requester.Value, "")},
                                                          AssignedDate: Now()
                                                      }
                                                  )
                                              );
                                              fnProcNotify(fin, Coalesce(varSubmittedPR.FinancialApprover.Value, ""), "Approval needed for " & varSubmittedPR.PRNumber, who & " submitted " & varSubmittedPR.PRNumber & " for your approval.", "PurchaseRequest", varSubmittedPR.ID, "PurchaseRequest")
                                          )
                                      ),
                                      Notify(If(gblLanguage = "Arabic", "تم إرسال الطلب، وتعذر إرسال إشعار الاعتماد.", "The request was submitted, but the approval notice could not be sent."), NotificationType.Warning)
                                  );
                                  Set(varProcurementMode, "View");
                                  Navigate(scrPRs, ScreenTransition.UnCover)
                              )
                          )
