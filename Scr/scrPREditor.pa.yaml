                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(
                                                varSelectedPRLine,
                                                Patch(
                                                    varSelectedPRLine,
                                                    {BudgetLine: {Id: Self.Selected.ID, Value: Self.Selected.BudgetLineCode}}
                                                )
                                            )
                                          SelectMultiple: =false
                                          Width: =Parent.Width
