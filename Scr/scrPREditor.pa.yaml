                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          DefaultSelectedItems: =If(IsBlank(varSelectedPRLine.Unit), [], [varSelectedPRLine.Unit])
                                          DisplayMode: =If(varPRItemMode = "View", DisplayMode.View, DisplayMode.Edit)
                                          Height: =40
                                          ItemDisplayText: =ThisItem.Value
                                          Items: =Choices(PurchaseRequestLines.Unit)
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =Set(varSelectedPRLine, Patch(varSelectedPRLine, {Unit: Self.Selected}))
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                              - conPRPopupWarehouse:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =1
                                    Height: =64
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =4
                                    LayoutMinWidth: =140
                                  Children:
                                    - lblPRPopupWarehouse:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =fxThemeColor("TextMuted")
                                          Font: =gblTheme.Typography.FontFamily
                                          Height: =16
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingTop: =0
                                          Size: =11
                                          Text: =If(gblLanguage = "Arabic", "المستودع", "Warehouse")
                                          Width: =Parent.Width
                                    - cmbPRPopupWarehouse:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          DisplayMode: =If(varPRItemMode = "View", DisplayMode.View, DisplayMode.Edit)
