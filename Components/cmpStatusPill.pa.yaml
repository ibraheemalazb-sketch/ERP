ComponentDefinitions:
  cmpStatusPill:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Compact:
        PropertyKind: Input
        DisplayName: Compact
        Description: Shorter pill for a table cell.
        DataType: Boolean
        Default: =false
      Label:
        PropertyKind: Input
        DisplayName: Label
        Description: Optional text. Blank shows the status value.
        DataType: Text
        Default: =""
      Status:
        PropertyKind: Input
        DisplayName: Status
        Description: Status or priority text, for example ThisItem.Status.Value or ThisItem.Priority.Value.
        DataType: Text
        Default: ="Pending"
      Tone:
        PropertyKind: Output
        DisplayName: Tone
        Description: completed, danger, high, medium, low, warning, in progress, info, or muted.
        DataType: Text
    Properties:
      Height: =If(cmpStatusPill.Compact, 22, 26)
      Tone: =fxStatusPillTone(cmpStatusPill.Status)
      Width: |-
        =Min(
            280,
            Max(
                56,
                Len(Coalesce(cmpStatusPill.Label, cmpStatusPill.Status, "-")) * If(cmpStatusPill.Compact, 6.2, 6.8) + 20
            )
        )
    Children:
      - conStatusPill:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =fxToneFill(cmpStatusPill.Tone)
            Height: =cmpStatusPill.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingLeft: =8
            PaddingRight: =8
            RadiusBottomLeft: =Parent.Height / 2
            RadiusBottomRight: =Parent.Height / 2
            RadiusTopLeft: =Parent.Height / 2
            RadiusTopRight: =Parent.Height / 2
            Width: =cmpStatusPill.Width
          Children:
            - lblStatusPill:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  Color: =fxToneInk(cmpStatusPill.Tone)
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Medium
                  Height: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.Caption
                  Text: =Coalesce(cmpStatusPill.Label, cmpStatusPill.Status, "-")
                  Tooltip: =Self.Text
                  Wrap: =false
