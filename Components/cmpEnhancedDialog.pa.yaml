ComponentDefinitions:
  cmpEnhancedDialog:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      BorderRadius:
        PropertyKind: Input
        DisplayName: BorderRadius
        Description: Corner radius of the dialog card.
        DataType: Number
        Default: =16
      Buttons:
        PropertyKind: Input
        DisplayName: Buttons
        Description: 'Buttons. Columns: Label, ButtonType (Primary, Danger, Secondary, Outline, Subtle, Transparent), Action (Confirm, Cancel, Close), Visible.'
        DataType: Table
        Default: |-
          =Table(
              {Label: "Cancel", ButtonType: "Secondary", Action: "Cancel", Visible: true},
              {Label: "Confirm", ButtonType: "Primary", Action: "Confirm", Visible: true}
          )
      ContentHeight:
        PropertyKind: Output
        DisplayName: ContentHeight
        Description: Height of the comment area.
        DataType: Number
      ContentWidth:
        PropertyKind: Output
        DisplayName: ContentWidth
        Description: Width of the comment area.
        DataType: Number
      DialogHeight:
        PropertyKind: Input
        DisplayName: DialogHeight
        Description: Fixed card height. 0 sizes the card to its content.
        DataType: Number
        Default: =0
      DialogType:
        PropertyKind: Input
        DisplayName: DialogType
        Description: Alert, Confirm, or Form. Form shows the comment box.
        DataType: Text
        Default: ="Confirm"
      DialogWidth:
        PropertyKind: Input
        DisplayName: DialogWidth
        Description: Card width before the screen margin is applied.
        DataType: Number
        Default: =440
      HeaderText:
        PropertyKind: Input
        DisplayName: HeaderText
        Description: Title in the dialog header.
        DataType: Text
        Default: ="Confirm"
      IconName:
        PropertyKind: Input
        DisplayName: IconName
        Description: Warning, Error, Danger, Delete, Success, Info, Restricted, NoAccess, or None.
        DataType: Text
        Default: ="Warning"
      InputText:
        PropertyKind: Output
        DisplayName: InputText
        Description: Trimmed comment or reason. Read this inside OnButtonSelect.
        DataType: Text
      IsTextInputRequired:
        PropertyKind: Input
        DisplayName: IsTextInputRequired
        Description: Require a reason before the confirm button enables. Use true for delete and reject, false for an optional approve comment.
        DataType: Boolean
        Default: =false
      MessageText:
        PropertyKind: Input
        DisplayName: MessageText
        Description: Body text under the title.
        DataType: Text
        Default: ="Are you sure you want to continue?"
      OnButtonSelect:
        PropertyKind: Event
        DisplayName: OnButtonSelect
        Description: Confirm, approve, reject, or delete. Read InputText here before it is cleared.
        ReturnType: None
        Default: =""
      OnCloseSelect:
        PropertyKind: Event
        DisplayName: OnCloseSelect
        Description: Cancel, close icon, or overlay.
        ReturnType: None
        Default: =""
      OverlayBlurColor:
        PropertyKind: Input
        DisplayName: OverlayBlurColor
        Description: Hex scrim such as #0F172473. Blank uses the app scrim.
        DataType: Text
        Default: =""
      PlaceholderText:
        PropertyKind: Input
        DisplayName: PlaceholderText
        Description: Label and placeholder for the comment or reason.
        DataType: Text
        Default: ="Comment"
      SelectedButton:
        PropertyKind: Output
        DisplayName: SelectedButton
        Description: Button row that was pressed. Read Action inside OnButtonSelect.
        DataType: Record
      ShowCloseIcon:
        PropertyKind: Input
        DisplayName: ShowCloseIcon
        Description: Show the close icon in the header.
        DataType: Boolean
        Default: =true
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Blank follows the app theme. Light or Dark forces that palette.
        DataType: Text
        Default: =""
    Properties:
      ContentHeight: =conDlgComment.Height
      ContentWidth: =conDlgComment.Width
      Fill: =Color.Transparent
      Height: =App.Height
      InputText: =Trim(txtDlgInput.Text)
      OnReset: =Reset(txtDlgInput)
      SelectedButton: =galDlgButtons.Selected
      Width: =App.Width
    Children:
      - conDlgRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: |-
              =If(
                  Left(Trim(cmpEnhancedDialog.OverlayBlurColor), 1) = "#",
                  ColorValue(cmpEnhancedDialog.OverlayBlurColor),
                  RGBA(15, 23, 42, 0.45)
              )
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - btnDlgScrim:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =If(gblIsArabic, "إغلاق", "Close")
                  Appearance: =ButtonAppearance.Transparent
                  BasePaletteColor: =fxThemeColor("Primary")
                  Height: =Parent.Height
                  OnSelect: |-
                    =cmpEnhancedDialog.OnCloseSelect();
                    Reset(txtDlgInput)
                  Text: =""
                  Width: =Parent.Width
            - conDlgCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semibold
                  Fill: =fxThemeColor("Surface")
                  Height: |-
                    =If(
                        cmpEnhancedDialog.DialogHeight > 0,
                        cmpEnhancedDialog.DialogHeight,
                        conDlgHeader.Height + conDlgMessage.Height + If(conDlgComment.Visible, conDlgComment.Height, 0) + conDlgFooter.Height
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =cmpEnhancedDialog.BorderRadius
                  RadiusBottomRight: =cmpEnhancedDialog.BorderRadius
                  RadiusTopLeft: =cmpEnhancedDialog.BorderRadius
                  RadiusTopRight: =cmpEnhancedDialog.BorderRadius
                  Width: |-
                    =Min(
                        If(cmpEnhancedDialog.DialogWidth > 0, cmpEnhancedDialog.DialogWidth, 440),
                        Parent.Width - 32
                    )
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =(Parent.Height - Self.Height) / 2
                Children:
                  - conDlgHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =16
                        PaddingRight: =12
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conDlgIcon:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =Switch(
                                    cmpEnhancedDialog.IconName,
                                    "Success", fxThemeColor("SuccessLight"),
                                    "Check", fxThemeColor("SuccessLight"),
                                    "Error", fxThemeColor("DangerLight"),
                                    "Danger", fxThemeColor("DangerLight"),
                                    "Delete", fxThemeColor("DangerLight"),
                                    "NoAccess", fxThemeColor("DangerLight"),
                                    "Restricted", fxThemeColor("DangerLight"),
                                    "Warning", fxThemeColor("WarningLight"),
                                    fxThemeColor("InfoLight")
                                )
                              FillPortions: =0
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =18
                              RadiusBottomRight: =18
                              RadiusTopLeft: =18
                              RadiusTopRight: =18
                              Visible: =And(cmpEnhancedDialog.IconName <> "None", !IsBlank(cmpEnhancedDialog.IconName))
                              Width: =36
                            Children:
                              - imgDlgIcon:
                                  Control: Image@2.2.3
                                  Properties:
                                    Height: =20
                                    Image: |-
                                      =fxSvg(
                                          Switch(
                                              cmpEnhancedDialog.IconName,
                                              "Success", "Check",
                                              "Check", "Check",
                                              "Checkmark", "Check",
                                              "Error", "X",
                                              "Danger", "X",
                                              "Delete", "X",
                                              "NoAccess", "X",
                                              "Restricted", "Shield",
                                              "Warning", "Warning",
                                              "Info", "Info",
                                              Coalesce(cmpEnhancedDialog.IconName, "Info")
                                          ),
                                          Switch(
                                              cmpEnhancedDialog.IconName,
                                              "Success", fxStatusInk("Success"),
                                              "Check", fxStatusInk("Success"),
                                              "Checkmark", fxStatusInk("Success"),
                                              "Error", fxStatusInk("Danger"),
                                              "Danger", fxStatusInk("Danger"),
                                              "Delete", fxStatusInk("Danger"),
                                              "NoAccess", fxStatusInk("Danger"),
                                              "Restricted", fxStatusInk("Danger"),
                                              "Warning", fxStatusInk("Warning"),
                                              fxThemeInk("Primary")
                                          )
                                      )
                                    Width: =20
                                    X: =(Parent.Width - Self.Width) / 2
                                    Y: =(Parent.Height - Self.Height) / 2
                        - lblDlgHeader:
                            Control: ModernText@1.0.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =fxThemeColor("TextPrimary")
                              FillPortions: =1
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Bold
                              Height: =28
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =16
                              Text: =cmpEnhancedDialog.HeaderText
                              Width: =Parent.Width
                        - btnDlgClose:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =If(gblIsArabic, "إغلاق", "Close")
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =fxThemeColor("TextSecondary")
                              FillPortions: =0
                              Height: =32
                              Icon: ="Dismiss"
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =cmpEnhancedDialog.OnCloseSelect();
                                Reset(txtDlgInput)
                              Text: =""
                              Visible: =cmpEnhancedDialog.ShowCloseIcon
                              Width: =32
                  - conDlgMessage:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =lblDlgMessage.Height + 8
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =4
                        PaddingLeft: =16
                        PaddingRight: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblDlgMessage:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =If(cmpEnhancedDialog.DialogType = "Alert", Align.Center, If(gblIsRTL, Align.Right, Align.Left))
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =40
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =13
                              Text: =cmpEnhancedDialog.MessageText
                              Width: =Parent.Width
                  - conDlgComment:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =If(Or(cmpEnhancedDialog.DialogType = "Form", cmpEnhancedDialog.DialogType = "Comment"), 148, 0)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =8
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =Or(cmpEnhancedDialog.DialogType = "Form", cmpEnhancedDialog.DialogType = "Comment")
                      Children:
                        - lblDlgComment:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =12
                              Text: =cmpEnhancedDialog.PlaceholderText & If(cmpEnhancedDialog.IsTextInputRequired, " *", "")
                              Width: =Parent.Width
                        - txtDlgInput:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: =cmpEnhancedDialog.PlaceholderText
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =fxThemeColor("Border")
                              BorderThickness: =1
                              Color: =fxThemeColor("TextPrimary")
                              Default: =""
                              Fill: =fxThemeColor("Background")
                              FocusedBorderColor: =If(cmpEnhancedDialog.IsTextInputRequired, fxThemeColor("Danger"), fxThemeColor("Primary"))
                              FocusedBorderThickness: =2
                              Font: =gblTheme.Typography.FontFamily
                              Height: =88
                              HintText: =cmpEnhancedDialog.PlaceholderText
                              HoverBorderColor: =fxThemeColor("Primary")
                              HoverFill: =fxThemeColor("Background")
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              MaxLength: =500
                              Mode: =TextMode.MultiLine
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Size: =13
                        - lblDlgCommentHint:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: |-
                                =If(
                                    And(cmpEnhancedDialog.IsTextInputRequired, IsBlank(Trim(txtDlgInput.Text))),
                                    fxThemeColor("Danger"),
                                    fxThemeColor("TextMuted")
                                )
                              Font: =gblTheme.Typography.FontFamily
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =11
                              Text: |-
                                =If(
                                    And(cmpEnhancedDialog.IsTextInputRequired, IsBlank(Trim(txtDlgInput.Text))),
                                    If(gblIsArabic, "السبب مطلوب", "A reason is required"),
                                    If(
                                        cmpEnhancedDialog.IsTextInputRequired,
                                        If(gblIsArabic, "سيُحفظ السبب في السجل", "The reason is saved on the activity log"),
                                        If(gblIsArabic, "التعليق اختياري", "Comment is optional")
                                    )
                                )
                              Width: =Parent.Width
                  - conDlgFooter:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Background")
                        FillPortions: =0
                        Height: =68
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutJustifyContent: |-
                          =If(
                              Or(cmpEnhancedDialog.DialogType = "Alert", CountRows(galDlgButtons.AllItems) <= 1),
                              LayoutJustifyContent.Center,
                              If(gblIsRTL, LayoutJustifyContent.Start, LayoutJustifyContent.End)
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =14
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =14
                        RadiusBottomLeft: =cmpEnhancedDialog.BorderRadius
                        RadiusBottomRight: =cmpEnhancedDialog.BorderRadius
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - galDlgButtons:
                            Control: Gallery@2.15.0
                            Variant: Horizontal
                            Properties:
                              AlignInContainer: =AlignInContainer.End
                              DelayItemLoading: =false
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =40
                              Items: =Filter(cmpEnhancedDialog.Buttons, Visible = true)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LoadingSpinner: =LoadingSpinner.None
                              ShowScrollbar: =false
                              TemplatePadding: =8
                              TemplateSize: =128
                              Width: =Max(128, CountRows(Filter(cmpEnhancedDialog.Buttons, Visible = true)) * 128)
                            Children:
                              - btnDlgAction:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Appearance: |-
                                      =Switch(
                                          ThisItem.ButtonType,
                                          "Primary", ButtonAppearance.Primary,
                                          "Danger", ButtonAppearance.Primary,
                                          "Secondary", ButtonAppearance.Secondary,
                                          "Outline", ButtonAppearance.Outline,
                                          "Subtle", ButtonAppearance.Subtle,
                                          "Transparent", ButtonAppearance.Transparent,
                                          ButtonAppearance.Primary
                                      )
                                    BasePaletteColor: |-
                                      =If(
                                          ThisItem.ButtonType = "Danger",
                                          fxThemeColor("Danger"),
                                          fxThemeColor("Primary")
                                      )
                                    DisplayMode: |-
                                      =If(
                                          And(
                                              Or(ThisItem.ButtonType = "Primary", ThisItem.ButtonType = "Danger"),
                                              Or(cmpEnhancedDialog.DialogType = "Form", cmpEnhancedDialog.DialogType = "Comment"),
                                              cmpEnhancedDialog.IsTextInputRequired,
                                              IsBlank(Trim(txtDlgInput.Text))
                                          ),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Height: =36
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =Select(Parent);
                                      If(
                                          Or(ThisItem.Action = "Cancel", ThisItem.Action = "Close"),
                                          cmpEnhancedDialog.OnCloseSelect();
                                          Reset(txtDlgInput),
                                          cmpEnhancedDialog.OnButtonSelect()
                                      )
                                    Text: =ThisItem.Label
                                    Width: =Parent.TemplateWidth - 8
