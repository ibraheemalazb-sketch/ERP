ComponentDefinitions:
  cmpUpcomingEvents:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CardRadius:
        PropertyKind: Output
        DisplayName: CardRadius
        Description: Card corner radius from gblTheme.
        DataType: Number
      IsCompact:
        PropertyKind: Output
        DisplayName: IsCompact
        Description: True when the card or the app is narrow.
        DataType: Boolean
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Event rows. Columns used are ID, Module, EventType, Title, Description, OwnerName, EventDate, RecordType, RecordID, and Icon.
        DataType: Table
        Default: |-
          =Filter(
              Table(
                  {
                      ID: 0,
                      Module: "",
                      EventType: "",
                      Title: "",
                      Description: "",
                      OwnerName: "",
                      EventDate: Now(),
                      RecordType: "",
                      RecordID: 0,
                      Icon: ""
                  }
              ),
              false
          )
      MaxItems:
        PropertyKind: Input
        DisplayName: MaxItems
        Description: How many events to show, soonest first.
        DataType: Number
        Default: =8
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Fires after the clicked row is stored in SelectedEvent.
        ReturnType: None
        Default: =false
      OnViewAll:
        PropertyKind: Event
        DisplayName: OnViewAll
        Description: Fires when View all is pressed.
        ReturnType: None
        Default: =false
      Palette:
        PropertyKind: Output
        DisplayName: Palette
        Description: Active gblTheme color record.
        DataType: Record
      SelectedEvent:
        PropertyKind: Output
        DisplayName: SelectedEvent
        Description: Last clicked event. Read it in OnSelect.
        DataType: Record
      ShowOverdue:
        PropertyKind: Input
        DisplayName: ShowOverdue
        Description: Include events whose date has passed.
        DataType: Boolean
        Default: =true
      ShowSummary:
        PropertyKind: Input
        DisplayName: ShowSummary
        Description: Shows the urgent and soon counts.
        DataType: Boolean
        Default: =true
      ShowViewAll:
        PropertyKind: Input
        DisplayName: ShowViewAll
        Description: Shows View all.
        DataType: Boolean
        Default: =true
      SoonDays:
        PropertyKind: Input
        DisplayName: SoonDays
        Description: Events within this many days use the warning color.
        DataType: Number
        Default: =7
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Card heading.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "الأحداث القادمة", "Upcoming events")
      UrgentDays:
        PropertyKind: Input
        DisplayName: UrgentDays
        Description: Events within this many days use the danger color.
        DataType: Number
        Default: =3
    Properties:
      CardRadius: =gblTheme.Radius.XL
      Height: =420
      IsCompact: =cmpUpcomingEvents.Width < 420 || App.Width < 700
      Palette: =If(gblTheme.Mode = "Dark", gblTheme.Dark.Colors, gblTheme.Light.Colors)
      SelectedEvent: =_selEvent
      Width: =360
    Children:
      - conEventCard:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =cmpUpcomingEvents.Palette.Border
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =cmpUpcomingEvents.Palette.Surface
            Height: =cmpUpcomingEvents.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =cmpUpcomingEvents.CardRadius
            RadiusBottomRight: =cmpUpcomingEvents.CardRadius
            RadiusTopLeft: =cmpUpcomingEvents.CardRadius
            RadiusTopRight: =cmpUpcomingEvents.CardRadius
            Width: =cmpUpcomingEvents.Width
          Children:
            - conEventHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =36
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =36
                  LayoutMinWidth: =0
                Children:
                  - imgEventHead:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderStyle: =BorderStyle.None
                        Height: =16
                        Image: =fxSvg("Calendar", fxThemeInk("Primary"))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =16
                  - lblEventTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        AlignInContainer: =AlignInContainer.Center
                        BorderStyle: =BorderStyle.None
                        Color: =cmpUpcomingEvents.Palette.TextPrimary
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Medium
                        Height: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Caption
                        Text: =Coalesce(cmpUpcomingEvents.Title, "")
                        Tooltip: =Self.Text
                        Wrap: =false
                  - btnEventAll:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "عرض الكل", "View all")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Height: =28
                        LayoutMinHeight: =28
                        LayoutMinWidth: =72
                        OnSelect: =cmpUpcomingEvents.OnViewAll()
                        Text: =If(gblLanguage = "Arabic", "عرض الكل", "View all")
                        Tooltip: =If(gblLanguage = "Arabic", "عرض كل الأحداث", "View all events")
                        Visible: =cmpUpcomingEvents.ShowViewAll
                        Width: =72
            - lblEventSummary:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  AlignInContainer: =AlignInContainer.Stretch
                  BorderStyle: =BorderStyle.None
                  Color: =cmpUpcomingEvents.Palette.TextMuted
                  Font: =gblTheme.Typography.FontFamily
                  Height: =18
                  LayoutMinHeight: =18
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =24
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.Caption
                  Text: |-
                    =With(
                        {
                            urgentCount: CountRows(
                                Filter(
                                    cmpUpcomingEvents.Items,
                                    DateDiff(Today(), EventDate, TimeUnit.Days) <= cmpUpcomingEvents.UrgentDays && (cmpUpcomingEvents.ShowOverdue || DateDiff(Today(), EventDate, TimeUnit.Days) >= 0)
                                )
                            ),
                            soonCount: CountRows(
                                Filter(
                                    cmpUpcomingEvents.Items,
                                    DateDiff(Today(), EventDate, TimeUnit.Days) <= cmpUpcomingEvents.SoonDays && (cmpUpcomingEvents.ShowOverdue || DateDiff(Today(), EventDate, TimeUnit.Days) >= 0)
                                )
                            )
                        },
                        If(
                            gblLanguage = "Arabic",
                            urgentCount & " عاجل  ·  " & soonCount & " خلال " & cmpUpcomingEvents.SoonDays & " أيام",
                            urgentCount & " urgent  ·  " & soonCount & " within " & cmpUpcomingEvents.SoonDays & " days"
                        )
                    )
                  Visible: =cmpUpcomingEvents.ShowSummary && !IsEmpty(cmpUpcomingEvents.Items)
                  Wrap: =false
            - conEventEmpty:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =6
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =IsEmpty(cmpUpcomingEvents.Items)
                Children:
                  - imgEventEmpty:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =If(gblLanguage = "Arabic", "لا توجد أحداث", "No events")
                        AlignInContainer: =AlignInContainer.Center
                        BorderStyle: =BorderStyle.None
                        Height: =28
                        Image: =fxSvg("Calendar", fxThemeInk("Muted"))
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =28
                  - lblEventEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderStyle: =BorderStyle.None
                        Color: =cmpUpcomingEvents.Palette.TextSecondary
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Medium
                        Height: =22
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =gblTheme.Typography.BodySmall
                        Text: =If(gblLanguage = "Arabic", "لا توجد أحداث قادمة", "No upcoming events")
                        Width: =240
                  - lblEventEmptyHint:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderStyle: =BorderStyle.None
                        Color: =cmpUpcomingEvents.Palette.TextMuted
                        Font: =gblTheme.Typography.FontFamily
                        Height: =32
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =gblTheme.Typography.Caption
                        Text: |-
                          =If(
                              gblLanguage = "Arabic",
                              "ستظهر المواعيد هنا.",
                              "Scheduled items will appear here."
                          )
                        Width: =240
            - galEvents:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "قائمة الأحداث", "Event list")
                  BorderStyle: =BorderStyle.None
                  DelayItemLoading: =false
                  Fill: =Color.Transparent
                  Items: |-
                    =FirstN(
                        SortByColumns(
                            Filter(
                                cmpUpcomingEvents.Items,
                                cmpUpcomingEvents.ShowOverdue || DateDiff(Today(), EventDate, TimeUnit.Days) >= 0
                            ),
                            "EventDate",
                            SortOrder.Ascending
                        ),
                        Max(1, Coalesce(cmpUpcomingEvents.MaxItems, 8))
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  TemplatePadding: =0
                  TemplateSize: =68
                  Visible: =!IsEmpty(cmpUpcomingEvents.Items)
                Children:
                  - conEventRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        Height: =galEvents.TemplateHeight
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =4
                        PaddingRight: =4
                        Width: =galEvents.TemplateWidth
                      Children:
                        - conEventDate:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =With(
                                    {days: DateDiff(Today(), ThisItem.EventDate, TimeUnit.Days)},
                                    ColorFade(
                                        If(
                                            days <= cmpUpcomingEvents.UrgentDays,
                                            cmpUpcomingEvents.Palette.Danger,
                                            If(
                                                days <= cmpUpcomingEvents.SoonDays,
                                                cmpUpcomingEvents.Palette.Warning,
                                                cmpUpcomingEvents.Palette.Primary
                                            )
                                        ),
                                        If(gblTheme.Mode = "Dark", -0.75, 0.86)
                                    )
                                )
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =44
                              LayoutMinWidth: =44
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =44
                            Children:
                              - lblEventMonth:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderStyle: =BorderStyle.None
                                    Color: |-
                                      =With(
                                          {days: DateDiff(Today(), ThisItem.EventDate, TimeUnit.Days)},
                                          If(
                                              days <= cmpUpcomingEvents.UrgentDays,
                                              cmpUpcomingEvents.Palette.Danger,
                                              If(
                                                  days <= cmpUpcomingEvents.SoonDays,
                                                  cmpUpcomingEvents.Palette.Warning,
                                                  cmpUpcomingEvents.Palette.Primary
                                              )
                                          )
                                      )
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =12
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    Text: |-
                                      =Upper(
                                          Text(
                                              ThisItem.EventDate,
                                              "mmm",
                                              If(gblLanguage = "Arabic", "ar-EG", "en-US")
                                          )
                                      )
                                    Width: =44
                                    Wrap: =false
                              - lblEventDay:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderStyle: =BorderStyle.None
                                    Color: =cmpUpcomingEvents.Palette.TextPrimary
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Bold
                                    Height: =18
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =Text(Day(ThisItem.EventDate), "0")
                                    Width: =44
                                    Wrap: =false
                        - conEventText:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - lblEventItemTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblIsRTL, Align.Right, Align.Left)
                                    BorderStyle: =BorderStyle.None
                                    Color: =cmpUpcomingEvents.Palette.TextPrimary
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =20
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.BodySmall
                                    Text: =Coalesce(ThisItem.Title, "")
                                    Wrap: =false
                              - conEventMeta:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =Color.Transparent
                                    FillPortions: =0
                                    Height: =16
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =4
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - imgEventType:
                                        Control: Image@2.2.3
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderStyle: =BorderStyle.None
                                          Height: =12
                                          Image: |-
                                            =fxSvg(
                                                fxActivityIcon(Coalesce(ThisItem.Icon, ThisItem.EventType)),
                                                fxUrgencyInk(
                                                    DateDiff(Today(), ThisItem.EventDate, TimeUnit.Days),
                                                    cmpUpcomingEvents.UrgentDays,
                                                    cmpUpcomingEvents.SoonDays
                                                )
                                            )
                                          LayoutMinHeight: =12
                                          LayoutMinWidth: =12
                                          Width: =12
                                    - lblEventMeta:
                                        Control: Label@2.5.1
                                        Properties:
                                          Align: =If(gblIsRTL, Align.Right, Align.Left)
                                          AlignInContainer: =AlignInContainer.Center
                                          BorderStyle: =BorderStyle.None
                                          Color: =cmpUpcomingEvents.Palette.TextMuted
                                          FillPortions: =1
                                          Font: =gblTheme.Typography.FontFamily
                                          Height: =16
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =gblTheme.Typography.Caption
                                          Text: |-
                                            =With(
                                                {days: DateDiff(Today(), ThisItem.EventDate, TimeUnit.Days)},
                                                If(
                                                    days < 0,
                                                    If(gblLanguage = "Arabic", "متأخر", "Overdue"),
                                                    days = 0,
                                                    If(gblLanguage = "Arabic", "اليوم", "Today"),
                                                    days = 1,
                                                    If(gblLanguage = "Arabic", "غدًا", "Tomorrow"),
                                                    If(
                                                        gblLanguage = "Arabic",
                                                        "بعد " & days & " يوم",
                                                        "In " & days & " days"
                                                    )
                                                ) & If(
                                                    IsBlank(ThisItem.OwnerName),
                                                    "",
                                                    "  ·  " & ThisItem.OwnerName
                                                )
                                            )
                                          Wrap: =false
                  - btnEventOpen:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =Coalesce(ThisItem.Title, "")
                        Appearance: =ButtonAppearance.Transparent
                        Height: =galEvents.TemplateHeight
                        OnSelect: |-
                          =Set(_selEvent, ThisItem);
                          cmpUpcomingEvents.OnSelect()
                        Text: =""
                        Tooltip: |-
                          =Coalesce(ThisItem.Title, "") & " — " & Text(
                              ThisItem.EventDate,
                              "dd mmm yyyy",
                              If(gblLanguage = "Arabic", "ar-EG", "en-US")
                          )
                        Width: =galEvents.TemplateWidth
