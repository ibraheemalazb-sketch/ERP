ComponentDefinitions:
  cmpSegmentedControl:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultValue:
        PropertyKind: Input
        DisplayName: DefaultValue
        Description: Selected value until the user picks another option.
        DataType: Text
        Default: ="list"
      Disabled:
        PropertyKind: Input
        DisplayName: Disabled
        Description: Disables the whole control.
        DataType: Boolean
        Default: =false
      DisplayMode:
        PropertyKind: Input
        DisplayName: DisplayMode
        Description: Text, Icons, or Both.
        DataType: Text
        Default: ="Both"
      EqualWidth:
        PropertyKind: Input
        DisplayName: EqualWidth
        Description: Shares the control width across every option. Icons mode can turn this off to keep square segments.
        DataType: Boolean
        Default: =true
      IconPosition:
        PropertyKind: Input
        DisplayName: IconPosition
        Description: When DisplayMode is Both, Left or Top.
        DataType: Text
        Default: ="Left"
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: Fires after the selected value changes.
        ReturnType: None
        Default: =false
      Options:
        PropertyKind: Input
        DisplayName: Options
        Description: Rows with Value, Label, and Icon. Icon is an fxSvg name such as List, Grid, or Table.
        DataType: Table
        Default: |-
          =Table(
              {Value: "list", Label: "List", Icon: "List"},
              {Value: "grid", Label: "Grid", Icon: "Grid"},
              {Value: "table", Label: "Table", Icon: "Table"}
          )
      SelectedValue:
        PropertyKind: Output
        DisplayName: SelectedValue
        Description: Currently selected option value.
        DataType: Text
      Size:
        PropertyKind: Input
        DisplayName: Size
        Description: Small, Medium, or Large.
        DataType: Text
        Default: ="Medium"
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Light or Dark. A blank value follows gblTheme.Mode.
        DataType: Text
        Default: =""
    Properties:
      Fill: =Color.Transparent
      Height: |-
        =If(
            And(
                cmpSegmentedControl.DisplayMode = "Both",
                cmpSegmentedControl.IconPosition = "Top"
            ),
            Switch(cmpSegmentedControl.Size, "Small", 48, "Medium", 56, "Large", 64, 56),
            Switch(cmpSegmentedControl.Size, "Small", 32, "Medium", 40, "Large", 48, 40)
        )
      OnReset: =Set(_scSelected, "")
      SelectedValue: |-
        =If(
            Or(
                IsBlank(_scSelected),
                IsBlank(LookUp(cmpSegmentedControl.Options, Value = _scSelected))
            ),
            cmpSegmentedControl.DefaultValue,
            _scSelected
        )
      Width: |-
        =If(
            And(
                cmpSegmentedControl.DisplayMode = "Icons",
                Not(cmpSegmentedControl.EqualWidth)
            ),
            Switch(cmpSegmentedControl.Size, "Small", 32, "Medium", 40, "Large", 48, 40) * CountRows(cmpSegmentedControl.Options) + 8,
            Switch(cmpSegmentedControl.Size, "Small", 96, "Medium", 112, "Large", 132, 112) * CountRows(cmpSegmentedControl.Options) + 8
        )
    Children:
      - cntScTrack:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: |-
              =If(
                  cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                  gblTheme.Dark.Colors.Border,
                  gblTheme.Light.Colors.Border
              )
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: |-
              =If(
                  cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                  gblTheme.Dark.Colors.SurfaceHover,
                  gblTheme.Light.Colors.SurfaceHover
              )
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =3
            PaddingLeft: =3
            PaddingRight: =3
            PaddingTop: =3
            RadiusBottomLeft: =gblTheme.Radius.Large
            RadiusBottomRight: =gblTheme.Radius.Large
            RadiusTopLeft: =gblTheme.Radius.Large
            RadiusTopRight: =gblTheme.Radius.Large
            Width: =Parent.Width
          Children:
            - galScOptions:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderStyle: =BorderStyle.None
                  DelayItemLoading: =false
                  Fill: =Color.Transparent
                  Height: =Parent.Height - 6
                  Items: |-
                    =ForAll(
                        Sequence(CountRows(cmpSegmentedControl.Options)),
                        {
                            ItemValue: Text(Index(cmpSegmentedControl.Options, Value).Value),
                            Label: Coalesce(Text(Index(cmpSegmentedControl.Options, Value).Label), ""),
                            Icon: Coalesce(Text(Index(cmpSegmentedControl.Options, Value).Icon), "")
                        }
                    )
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: |-
                    =If(
                        And(
                            cmpSegmentedControl.DisplayMode = "Icons",
                            Not(cmpSegmentedControl.EqualWidth)
                        ),
                        Parent.Height,
                        Parent.Width / Max(CountRows(cmpSegmentedControl.Options), 1)
                    )
                  Width: =Parent.Width - 6
                Children:
                  - cntScOption:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              cmpSegmentedControl.SelectedValue = ThisItem.ItemValue,
                              If(
                                  cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                                  gblTheme.Dark.Colors.Surface,
                                  gblTheme.Light.Colors.Surface
                              ),
                              Color.Transparent
                          )
                        Height: =Parent.TemplateHeight
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Width: =Parent.TemplateWidth
                      Children:
                        - cntScContent:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: |-
                                =If(
                                    And(
                                        cmpSegmentedControl.DisplayMode = "Both",
                                        cmpSegmentedControl.IconPosition = "Top"
                                    ),
                                    LayoutDirection.Vertical,
                                    LayoutDirection.Horizontal
                                )
                              LayoutGap: |-
                                =If(
                                    cmpSegmentedControl.DisplayMode = "Both",
                                    Switch(cmpSegmentedControl.Size, "Small", 4, "Medium", 6, "Large", 8, 6),
                                    0
                                )
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingLeft: =6
                              PaddingRight: =6
                              Width: =Parent.Width
                            Children:
                              - imgScIcon:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: |-
                                      =Switch(
                                          cmpSegmentedControl.Size,
                                          "Small", 14,
                                          "Medium", 16,
                                          "Large", 18,
                                          16
                                      )
                                    Image: |-
                                      =With(
                                          {
                                              dark: cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                                              on: And(
                                                  Not(cmpSegmentedControl.Disabled),
                                                  cmpSegmentedControl.SelectedValue = ThisItem.ItemValue
                                              )
                                          },
                                          With(
                                              {
                                                  ink: If(
                                                      on,
                                                      If(dark, "rgb(121,176,255)", "rgb(27,86,229)"),
                                                      If(dark, "rgb(139,148,158)", "rgb(107,114,128)")
                                                  ),
                                                  inkHex: If(
                                                      on,
                                                      If(dark, "%2379B0FF", "%231B56E5"),
                                                      If(dark, "%238B949E", "%236B7280")
                                                  )
                                              },
                                              If(
                                                  Or(
                                                      StartsWith(ThisItem.Icon, "data:"),
                                                      StartsWith(ThisItem.Icon, "<")
                                                  ),
                                                  Substitute(
                                                      If(
                                                          StartsWith(ThisItem.Icon, "<"),
                                                          "data:image/svg+xml;utf8," & EncodeUrl(ThisItem.Icon),
                                                          ThisItem.Icon
                                                      ),
                                                      "currentColor",
                                                      inkHex
                                                  ),
                                                  fxSvg(Coalesce(ThisItem.Icon, "List"), ink)
                                              )
                                          )
                                      )
                                    Visible: |-
                                      =And(
                                          Not(IsBlank(ThisItem.Icon)),
                                          Or(
                                              cmpSegmentedControl.DisplayMode = "Icons",
                                              cmpSegmentedControl.DisplayMode = "Both"
                                          )
                                      )
                                    Width: =Self.Height
                              - lblScText:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =false
                                    BorderStyle: =BorderStyle.None
                                    Color: |-
                                      =If(
                                          cmpSegmentedControl.Disabled,
                                          If(
                                              cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                                              gblTheme.Dark.Colors.TextDisabled,
                                              gblTheme.Light.Colors.TextDisabled
                                          ),
                                          If(
                                              cmpSegmentedControl.SelectedValue = ThisItem.ItemValue,
                                              If(
                                                  cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                                                  gblTheme.Dark.Colors.Primary,
                                                  gblTheme.Light.Colors.Primary
                                              ),
                                              If(
                                                  cmpSegmentedControl.Theme = "Dark" || And(cmpSegmentedControl.Theme <> "Light", gblTheme.Mode = "Dark"),
                                                  gblTheme.Dark.Colors.TextMuted,
                                                  gblTheme.Light.Colors.TextMuted
                                              )
                                          )
                                      )
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: |-
                                      =If(
                                          cmpSegmentedControl.SelectedValue = ThisItem.ItemValue,
                                          gblTheme.FontWeights.Medium,
                                          gblTheme.FontWeights.Regular
                                      )
                                    Height: =Parent.Height
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: |-
                                      =Switch(
                                          cmpSegmentedControl.Size,
                                          "Small", 11,
                                          "Medium", 12,
                                          "Large", 13,
                                          12
                                      )
                                    Text: =ThisItem.Label
                                    Tooltip: =Self.Text
                                    Visible: |-
                                      =And(
                                          Not(IsBlank(ThisItem.Label)),
                                          Or(
                                              cmpSegmentedControl.DisplayMode = "Text",
                                              cmpSegmentedControl.DisplayMode = "Both"
                                          )
                                      )
                                    Width: |-
                                      =If(
                                          cmpSegmentedControl.DisplayMode = "Icons",
                                          0,
                                          Max(24, Parent.Width - If(IsBlank(ThisItem.Icon), 0, 22))
                                      )
                                    Wrap: =false
                        - btnScHit:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =Coalesce(ThisItem.Label, ThisItem.ItemValue)
                              Appearance: =ButtonAppearance.Transparent
                              DisplayMode: |-
                                =If(
                                    cmpSegmentedControl.Disabled,
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Height: =Parent.Height
                              OnSelect: |-
                                =If(
                                    Not(cmpSegmentedControl.Disabled),
                                    Set(_scSelected, ThisItem.ItemValue);
                                    cmpSegmentedControl.OnChange()
                                )
                              Text: =""
                              Tooltip: =Coalesce(ThisItem.Label, ThisItem.ItemValue)
                              Width: =Parent.Width
