ComponentDefinitions:
  cmpTopBar:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActionsVisible:
        PropertyKind: Input
        DisplayName: ActionsVisible
        Description: Shows the action group.
        DataType: Boolean
        Default: =true
      BadgeColor:
        PropertyKind: Input
        DisplayName: BadgeColor
        Description: Kept for existing screens. The badge uses gblTheme Danger.
        DataType: Color
        Default: =RGBA(220, 38, 38, 1)
      BadgeCount:
        PropertyKind: Input
        DisplayName: BadgeCount
        Description: Unread count. Pass a number that is already calculated.
        DataType: Number
        Default: =0
      FontSizeTitle:
        PropertyKind: Input
        DisplayName: FontSizeTitle
        Description: Kept for existing screens. Type comes from gblTheme.
        DataType: Number
        Default: =13
      HasNotifications:
        PropertyKind: Input
        DisplayName: HasNotifications
        Description: Shows a static dot when the count is zero.
        DataType: Boolean
        Default: =false
      HoverText:
        PropertyKind: Input
        DisplayName: HoverText
        Description: Kept for existing screens.
        DataType: Text
        Default: =""
      IconColor:
        PropertyKind: Input
        DisplayName: IconColor
        Description: Kept for existing screens.
        DataType: Text
        Default: =""
      IconSvg:
        PropertyKind: Input
        DisplayName: IconSvg
        Description: Kept for existing screens. Icons come from fxSvg.
        DataType: Text
        Default: =""
      ModuleIcon:
        PropertyKind: Input
        DisplayName: Module Icon
        Description: Icon name passed to fxSvg, such as Home, Users, or Settings.
        DataType: Text
        Default: ="Home"
      ModuleName:
        PropertyKind: Input
        DisplayName: Module Name
        Description: First breadcrumb.
        DataType: Text
        Default: =""
      OnSearch:
        PropertyKind: Event
        DisplayName: OnSearch
        Description: Fires when search is pressed.
        ReturnType: None
        Default: =false
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Fires when the notification button is pressed.
        ReturnType: None
        Default: =false
      OnSelectSubtitle:
        PropertyKind: Event
        DisplayName: OnSelectSubtitle
        Description: Fires when the subtitle crumb is pressed.
        ReturnType: None
        Default: =false
      OnSelectTitle:
        PropertyKind: Event
        DisplayName: OnSelectTitle
        Description: Fires when the module or screen crumb is pressed.
        ReturnType: None
        Default: =false
      ScreenSubtitle:
        PropertyKind: Input
        DisplayName: Screen Subtitle
        Description: Third breadcrumb. Shown when ShowBreadcrumb is true.
        DataType: Text
        Default: =""
      ScreenTitle:
        PropertyKind: Input
        DisplayName: Screen Title
        Description: Second breadcrumb. Hidden when it matches the module name.
        DataType: Text
        Default: =""
      ShowBreadcrumb:
        PropertyKind: Input
        DisplayName: Show Breadcrumb
        Description: Shows the subtitle crumb.
        DataType: Boolean
        Default: =true
      ShowLanguage:
        PropertyKind: Input
        DisplayName: Show Language
        Description: Shows the language switch.
        DataType: Boolean
        Default: =true
      ShowNotifications:
        PropertyKind: Input
        DisplayName: Show Notifications
        Description: Shows the notification button.
        DataType: Boolean
        Default: =true
      ShowSearch:
        PropertyKind: Input
        DisplayName: Show Search
        Description: Shows the search button.
        DataType: Boolean
        Default: =true
      ShowTheme:
        PropertyKind: Input
        DisplayName: Show Theme
        Description: Shows the theme switch.
        DataType: Boolean
        Default: =true
      ShowUser:
        PropertyKind: Input
        DisplayName: Show User
        Description: Shows the signed-in user.
        DataType: Boolean
        Default: =true
      Size:
        PropertyKind: Input
        DisplayName: Size
        Description: Kept for existing screens.
        DataType: Number
        Default: =32
      SubTitleWidth:
        PropertyKind: Input
        DisplayName: SubTitleWidth
        Description: Kept for existing screens. Crumbs share width instead of a fixed size.
        DataType: Number
        Default: =120
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Kept for existing screens. Colors follow gblTheme.Mode.
        DataType: Text
        Default: ="Light"
      TitleWidth:
        PropertyKind: Input
        DisplayName: TitleWidth
        Description: Kept for existing screens. Crumbs share width instead of a fixed size.
        DataType: Number
        Default: =160
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Background,
            gblTheme.Light.Colors.Background
        )
      Height: =gblTheme.Controls.HeaderHeight
      Width: =Parent.Width
    Children:
      - conTopBar:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =Parent.Height - 1
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =gblTheme.Spacing.SM
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutWrap: =false
            PaddingBottom: =0
            PaddingLeft: =gblTheme.Spacing.MD
            PaddingRight: =gblTheme.Spacing.MD
            PaddingTop: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: =0
            Y: =0
          Children:
            - conTopBarBrand:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblTheme.Spacing.SM
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =false
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =gblTheme.Spacing.SM
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conTopBarModuleIcon:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.PrimaryLight,
                              gblTheme.Light.Colors.PrimaryLight
                          )
                        FillPortions: =0
                        Height: =32
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =gblTheme.Radius.Large
                        RadiusBottomRight: =gblTheme.Radius.Large
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Width: =32
                      Children:
                        - imgTopBarModule:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: =Coalesce(cmpTopBar.ModuleName, "Home")
                              BorderStyle: =BorderStyle.None
                              Height: =18
                              Image: |-
                                =fxSvg(
                                    If(
                                        Or(
                                            IsBlank(cmpTopBar.ModuleIcon),
                                            StartsWith(cmpTopBar.ModuleIcon, "<"),
                                            StartsWith(cmpTopBar.ModuleIcon, "data:")
                                        ),
                                        "Home",
                                        cmpTopBar.ModuleIcon
                                    ),
                                    fxThemeInk("Primary")
                                )
                              ImagePosition: =ImagePosition.Fit
                              Tooltip: =Coalesce(cmpTopBar.ModuleName, "")
                              Width: =18
                              X: =(Parent.Width - Self.Width) / 2
                              Y: =(Parent.Height - Self.Height) / 2
                  - conTopBarCrumbs:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =1
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =gblTheme.Spacing.XS
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutWrap: =false
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblTopBarModule:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    And(
                                        Or(
                                            IsBlank(cmpTopBar.ScreenTitle),
                                            cmpTopBar.ScreenTitle = cmpTopBar.ModuleName
                                        ),
                                        Or(
                                            !cmpTopBar.ShowBreadcrumb,
                                            IsBlank(cmpTopBar.ScreenSubtitle)
                                        )
                                    ),
                                    If(
                                        gblTheme.Mode = "Dark",
                                        gblTheme.Dark.Colors.TextPrimary,
                                        gblTheme.Light.Colors.TextPrimary
                                    ),
                                    If(
                                        gblTheme.Mode = "Dark",
                                        gblTheme.Dark.Colors.TextMuted,
                                        gblTheme.Light.Colors.TextMuted
                                    )
                                )
                              FillPortions: =1
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpTopBar.OnSelectTitle()
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.Navigation
                              Text: =Coalesce(cmpTopBar.ModuleName, "")
                              Tooltip: =Self.Text
                              Visible: =!IsBlank(cmpTopBar.ModuleName)
                              Wrap: =false
                        - imgCrumbSep1:
                            Control: Image@2.2.3
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              FillPortions: =0
                              Height: =12
                              Image: |-
                                =fxSvg(
                                    If(gblLanguage = "Arabic", "ChevronLeft", "ChevronRight"),
                                    fxThemeInk("Disabled")
                                )
                              ImagePosition: =ImagePosition.Fit
                              LayoutMinHeight: =12
                              LayoutMinWidth: =12
                              Visible: |-
                                =Or(
                                    And(
                                        !IsBlank(cmpTopBar.ScreenTitle),
                                        cmpTopBar.ScreenTitle <> cmpTopBar.ModuleName
                                    ),
                                    And(
                                        cmpTopBar.ShowBreadcrumb,
                                        !IsBlank(cmpTopBar.ScreenSubtitle)
                                    )
                                )
                              Width: =12
                        - lblTopBarTitle:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    Or(
                                        !cmpTopBar.ShowBreadcrumb,
                                        IsBlank(cmpTopBar.ScreenSubtitle)
                                    ),
                                    If(
                                        gblTheme.Mode = "Dark",
                                        gblTheme.Dark.Colors.TextPrimary,
                                        gblTheme.Light.Colors.TextPrimary
                                    ),
                                    If(
                                        gblTheme.Mode = "Dark",
                                        gblTheme.Dark.Colors.TextMuted,
                                        gblTheme.Light.Colors.TextMuted
                                    )
                                )
                              FillPortions: =2
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpTopBar.OnSelectTitle()
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.Navigation
                              Text: =Coalesce(cmpTopBar.ScreenTitle, "")
                              Tooltip: =Self.Text
                              Visible: |-
                                =And(
                                    !IsBlank(cmpTopBar.ScreenTitle),
                                    cmpTopBar.ScreenTitle <> cmpTopBar.ModuleName
                                )
                              Wrap: =false
                        - imgCrumbSep2:
                            Control: Image@2.2.3
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              FillPortions: =0
                              Height: =12
                              Image: |-
                                =fxSvg(
                                    If(gblLanguage = "Arabic", "ChevronLeft", "ChevronRight"),
                                    fxThemeInk("Disabled")
                                )
                              ImagePosition: =ImagePosition.Fit
                              LayoutMinHeight: =12
                              LayoutMinWidth: =12
                              Visible: |-
                                =And(
                                    !IsBlank(cmpTopBar.ScreenTitle),
                                    cmpTopBar.ScreenTitle <> cmpTopBar.ModuleName,
                                    cmpTopBar.ShowBreadcrumb,
                                    !IsBlank(cmpTopBar.ScreenSubtitle)
                                )
                              Width: =12
                        - lblTopBarBreadcrumb:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.TextPrimary,
                                    gblTheme.Light.Colors.TextPrimary
                                )
                              FillPortions: =2
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpTopBar.OnSelectSubtitle()
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.NavigationSmall
                              Text: =Coalesce(cmpTopBar.ScreenSubtitle, "")
                              Tooltip: =Self.Text
                              Visible: |-
                                =And(
                                    cmpTopBar.ShowBreadcrumb,
                                    !IsBlank(cmpTopBar.ScreenSubtitle)
                                )
                              Wrap: =false
            - conTopBarActions:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =gblTheme.Controls.ButtonHeight
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =gblTheme.Spacing.XS
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =false
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmpTopBar.ActionsVisible
                  Width: |-
                    =With(
                        {
                            b: gblTheme.Controls.ButtonHeight,
                            g: gblTheme.Spacing.XS,
                            langW: 44,
                            userW: If(cmpTopBar.Width < 720, 32, 160),
                            nSearch: If(cmpTopBar.ShowSearch, 1, 0),
                            nLang: If(cmpTopBar.ShowLanguage, 1, 0),
                            nTheme: If(cmpTopBar.ShowTheme, 1, 0),
                            nBell: If(cmpTopBar.ShowNotifications, 1, 0),
                            nUser: If(cmpTopBar.ShowUser, 1, 0)
                        },
                        nSearch * b + nLang * langW + nTheme * b + nBell * b + nUser * userW + Max(
                            0,
                            nSearch + nLang + nTheme + nBell + nUser - 1
                        ) * g
                    )
                Children:
                  - conTopBarSearch:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =gblTheme.Controls.ButtonHeight
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpTopBar.ShowSearch
                        Width: =gblTheme.Controls.ButtonHeight
                      Children:
                        - imgTopBarSearch:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "بحث",
                                    "Search"
                                )
                              BorderStyle: =BorderStyle.None
                              Height: =18
                              Image: =fxSvg("Search", fxThemeInk("Text"))
                              ImagePosition: =ImagePosition.Fit
                              Width: =18
                              X: =(Parent.Width - Self.Width) / 2
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnTopBarSearch:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "بحث",
                                    "Search"
                                )
                              Appearance: =ButtonAppearance.Transparent
                              Height: =Parent.Height
                              Icon: =""
                              OnSelect: =cmpTopBar.OnSearch()
                              Text: =""
                              Tooltip: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "بحث",
                                    "Search"
                                )
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                  - btnTopBarLanguage:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: |-
                          =If(
                              gblLanguage = "Arabic",
                              "التبديل إلى الإنجليزية",
                              "Switch to Arabic"
                          )
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        FillPortions: =0
                        Height: =gblTheme.Controls.ButtonHeight
                        LayoutMinHeight: =36
                        LayoutMinWidth: =44
                        OnSelect: |-
                          =Set(
                              gblLanguage,
                              If(
                                  gblLanguage = "Arabic",
                                  "English",
                                  "Arabic"
                              )
                          )
                        Text: =If(gblLanguage = "Arabic", "EN", "ع")
                        Tooltip: |-
                          =If(
                              gblLanguage = "Arabic",
                              "التبديل إلى الإنجليزية",
                              "Switch to Arabic"
                          )
                        Visible: =cmpTopBar.ShowLanguage
                        Width: =44
                  - conTopBarTheme:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =gblTheme.Controls.ButtonHeight
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpTopBar.ShowTheme
                        Width: =gblTheme.Controls.ButtonHeight
                      Children:
                        - imgTopBarTheme:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "تغيير السمة",
                                    "Switch color theme"
                                )
                              BorderStyle: =BorderStyle.None
                              Height: =18
                              Image: |-
                                =fxSvg(
                                    If(gblTheme.Mode = "Dark", "Sun", "Moon"),
                                    fxThemeInk("Text")
                                )
                              ImagePosition: =ImagePosition.Fit
                              Width: =18
                              X: =(Parent.Width - Self.Width) / 2
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnTopBarTheme:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "تغيير السمة",
                                    "Switch color theme"
                                )
                              Appearance: =ButtonAppearance.Transparent
                              Height: =Parent.Height
                              Icon: =""
                              OnSelect: |-
                                =Set(
                                    gblTheme,
                                    Patch(
                                        gblTheme,
                                        {
                                            Mode: If(
                                                gblTheme.Mode = "Dark",
                                                "Light",
                                                "Dark"
                                            )
                                        }
                                    )
                                )
                              Text: =""
                              Tooltip: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "تغيير السمة",
                                    "Switch color theme"
                                )
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                  - conNotifications:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =gblTheme.Controls.ButtonHeight
                        LayoutMinHeight: =36
                        LayoutMinWidth: =36
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpTopBar.ShowNotifications
                        Width: =gblTheme.Controls.ButtonHeight
                      Children:
                        - imgTopBarBell:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "الإشعارات",
                                    "Notifications"
                                )
                              BorderStyle: =BorderStyle.None
                              Height: =18
                              Image: =fxSvg("Bell", fxThemeInk("Text"))
                              ImagePosition: =ImagePosition.Fit
                              Width: =18
                              X: =(Parent.Width - Self.Width) / 2
                              Y: =(Parent.Height - Self.Height) / 2
                        - btnBell_1:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "الإشعارات " & Text(cmpTopBar.BadgeCount),
                                    "Notifications " & Text(cmpTopBar.BadgeCount)
                                )
                              Appearance: =ButtonAppearance.Transparent
                              Height: =Parent.Height
                              Icon: =""
                              OnSelect: =cmpTopBar.OnSelect()
                              Text: =""
                              Tooltip: |-
                                =If(
                                    gblLanguage = "Arabic",
                                    "الإشعارات " & Text(cmpTopBar.BadgeCount),
                                    "Notifications " & Text(cmpTopBar.BadgeCount)
                                )
                              Width: =Parent.Width
                              X: =0
                              Y: =0
                        - shpBellDot:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Danger,
                                    gblTheme.Light.Colors.Danger
                                )
                              Height: =8
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Visible: |-
                                =And(
                                    cmpTopBar.HasNotifications,
                                    cmpTopBar.BadgeCount <= 0
                                )
                              Width: =8
                              X: =Parent.Width - 10
                              Y: =6
                        - conBellBadge:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Danger,
                                    gblTheme.Light.Colors.Danger
                                )
                              Height: =16
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =cmpTopBar.BadgeCount > 0
                              Width: =If(cmpTopBar.BadgeCount > 9, 22, 16)
                              X: =Parent.Width - Self.Width + 2
                              Y: =2
                            Children:
                              - lblNotificationCount_1:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AccessibleLabel: =Self.Text
                                    Align: =Align.Center
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextOnPrimary,
                                          gblTheme.Light.Colors.TextOnPrimary
                                      )
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Bold
                                    Height: =Parent.Height
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    Text: =If(cmpTopBar.BadgeCount > 99, "99+", Text(cmpTopBar.BadgeCount))
                                    Width: =Parent.Width
                                    X: =0
                                    Y: =0
                  - conTopBarUser:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =gblTheme.Spacing.SM
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutMinHeight: =32
                        LayoutMinWidth: =0
                        LayoutWrap: =false
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpTopBar.ShowUser
                        Width: =If(cmpTopBar.Width < 720, 32, 160)
                      Children:
                        - conTopBarUserAvatar:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.Primary,
                                    gblTheme.Light.Colors.Primary
                                )
                              FillPortions: =0
                              Height: =32
                              LayoutMinHeight: =32
                              LayoutMinWidth: =32
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Width: =32
                            Children:
                              - lblTopBarUserInitial:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderStyle: =BorderStyle.None
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextOnPrimary,
                                          gblTheme.Light.Colors.TextOnPrimary
                                      )
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =32
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Caption
                                    Text: |-
                                      =With(
                                          {
                                              n: If(
                                                  IsBlank(gblUser.FullName),
                                                  IfError(User().FullName, ""),
                                                  gblUser.FullName
                                              )
                                          },
                                          With(
                                              {
                                                  parts: Split(Coalesce(n, ""), " ")
                                              },
                                              Upper(Left(First(parts).Value, 1)) & If(
                                                  CountRows(parts) > 1,
                                                  Upper(Left(Last(parts).Value, 1)),
                                                  ""
                                              )
                                          )
                                      )
                                    Tooltip: =Coalesce(gblUser.FullName, "")
                                    Width: =32
                                    Wrap: =false
                                    X: =0
                                    Y: =0
                        - conTopBarUserInfo:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =1
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =0
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              LayoutWrap: =false
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =cmpTopBar.Width >= 720
                            Children:
                              - lblTopBarUserName:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderStyle: =BorderStyle.None
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextPrimary,
                                          gblTheme.Light.Colors.TextPrimary
                                      )
                                    FillPortions: =0
                                    Font: =gblTheme.Typography.FontFamily
                                    FontWeight: =gblTheme.FontWeights.Medium
                                    Height: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.BodySmall
                                    Text: |-
                                      =If(
                                          IsBlank(gblUser.FullName),
                                          IfError(User().FullName, ""),
                                          gblUser.FullName
                                      )
                                    Tooltip: =Self.Text
                                    Wrap: =false
                              - lblTopBarUserRole:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                                    AlignInContainer: =AlignInContainer.Stretch
                                    BorderStyle: =BorderStyle.None
                                    Color: |-
                                      =If(
                                          gblTheme.Mode = "Dark",
                                          gblTheme.Dark.Colors.TextMuted,
                                          gblTheme.Light.Colors.TextMuted
                                      )
                                    FillPortions: =0
                                    Font: =gblTheme.Typography.FontFamily
                                    Height: =14
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =gblTheme.Typography.Caption
                                    Text: =Coalesce(gblUser.Role, "")
                                    Visible: =!IsBlank(gblUser.Role)
                                    Wrap: =false
      - rectTopBarRule:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Border,
                  gblTheme.Light.Colors.Border
              )
            Height: =1
            Width: =Parent.Width
            X: =0
            Y: =Parent.Height - 1
