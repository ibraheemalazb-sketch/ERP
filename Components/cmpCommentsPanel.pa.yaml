ComponentDefinitions:
  cmpCommentsPanel:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AllowInternal:
        PropertyKind: Input
        Description: Show the 'internal' checkbox in the composer
        DataType: Boolean
        Default: =false
      CanPost:
        PropertyKind: Input
        Description: Show the composer
        DataType: Boolean
        Default: =true
      HasMore:
        PropertyKind: Output
        Description: true when TopN rows were returned
        DataType: Boolean
      LogEntityType:
        PropertyKind: Input
        Description: FinanceActivityLog.EntityType for the Commented row
        DataType: Text
        Default: ="Payment Request"
      ModuleName:
        PropertyKind: Input
        Description: Comments.Module choice text (Finance / Payroll)
        DataType: Text
        Default: ="Finance"
      OnLoadMore:
        PropertyKind: Event
        Description: Load more selected
        ReturnType: None
        Default: =""
      OnPosted:
        PropertyKind: Event
        Description: A comment was saved
        ReturnType: None
        Default: =""
      ProjectCode:
        PropertyKind: Input
        Description: For the activity-log row
        DataType: Text
        Default: =""
      ProjectID:
        PropertyKind: Input
        Description: For the activity-log row
        DataType: Number
        Default: =Blank()
      RecordID:
        PropertyKind: Input
        Description: Comments.RecordID
        DataType: Number
        Default: =0
      RecordNumber:
        PropertyKind: Input
        Description: Comments.RecordNumber, e.g. the RequestNumber
        DataType: Text
        Default: =""
      RecordType:
        PropertyKind: Input
        Description: Comments.RecordType (single line of text)
        DataType: Text
        Default: ="Payment Request"
      ShowInternal:
        PropertyKind: Input
        Description: Include IsInternal comments (finance team only)
        DataType: Boolean
        Default: =false
      TopN:
        PropertyKind: Input
        Description: Rows to show; host adds 50 in OnLoadMore
        DataType: Number
        Default: =50
    Properties:
      HasMore: =galComments_1.AllItemsCount >= cmpCommentsPanel.TopN
      Height: =480
      Width: =420
    Children:
      - conCmtRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =sp1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - lblCmtHeading:
                Control: Label@2.5.1
                Properties:
                  Align: =alignStart
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =FinTheme.Text
                  Font: =fontBase
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Role: =TextRole.Heading3
                  Size: =fsSection
                  Text: =fnT("cmt.title", "Comments")
                  Wrap: =false
            - conCmtComposer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =72 + sp1 + touchMin
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =sp1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =cmpCommentsPanel.CanPost
                Children:
                  - txtCmtNew:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: =fnT("cmt.new", "New comment")
                        Align: =alignStart
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =FinTheme.Border
                        BorderThickness: =1
                        Color: =FinTheme.Text
                        Default: =""
                        Fill: =FinTheme.Surface
                        FocusedBorderColor: =FinTheme.Focus
                        FocusedBorderThickness: =2
                        Font: =fontBase
                        Height: =72
                        HintText: =fnT("cmt.hint", "Write a comment")
                        HoverBorderColor: =FinTheme.Primary
                        HoverFill: =FinTheme.Surface
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        MaxLength: =2000
                        Mode: =TextMode.MultiLine
                        PaddingLeft: =8
                        PaddingRight: =8
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =fsBody
                  - conCmtActions:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =touchMin
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =sp1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - chkCmtInternal:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              CheckboxBackgroundFill: =FinTheme.Surface
                              CheckboxBorderColor: =FinTheme.Border
                              CheckmarkFill: =FinTheme.OnPrimary
                              Color: =FinTheme.Text
                              FillPortions: =1
                              Font: =fontBase
                              Height: =touchMin
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =fsCaption
                              Text: =fnT("cmt.internal", "Internal (finance team only)")
                              Visible: =cmpCommentsPanel.AllowInternal
                        - btnCmtPost:
                            Control: Classic/Button@2.2.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =FinTheme.Primary
                              BorderThickness: =1
                              Color: =FinTheme.OnPrimary
                              DisabledBorderColor: =FinTheme.Border
                              DisabledColor: =FinTheme.TextSecondary
                              DisabledFill: =FinTheme.Border
                              DisplayMode: =If(Len(Trim(txtCmtNew.Text)) > 0, DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =FinTheme.Primary
                              FocusedBorderColor: =FinTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =fontBase
                              Height: =touchMin
                              HoverBorderColor: =FinTheme.Primary
                              HoverColor: =FinTheme.OnPrimary
                              HoverFill: =ColorFade(FinTheme.Primary, -0.12)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                    {_txt: Trim(txtCmtNew.Text), _corr: Text(GUID())},
                                    If(
                                        Len(_txt) > 0,
                                        IfError(
                                            Patch(
                                                Comments,
                                                Defaults(Comments),
                                                {
                                                    Title: Left(_txt, 100),
                                                    Module: {Value: cmpCommentsPanel.ModuleName},
                                                    RecordType: cmpCommentsPanel.RecordType,
                                                    RecordID: cmpCommentsPanel.RecordID,
                                                    RecordNumber: cmpCommentsPanel.RecordNumber,
                                                    Comment: _txt,
                                                    CommentedByID: varMe.ID,
                                                    CommentedByName: varMe.FullName,
                                                    CommentDate: Now(),
                                                    IsInternal: cmpCommentsPanel.AllowInternal && chkCmtInternal.Value,
                                                    IsDeleted: false
                                                }
                                            );
                                            fnLogActivity(cmpCommentsPanel.LogEntityType, cmpCommentsPanel.RecordID, cmpCommentsPanel.RecordNumber, "Commented", "Info",
                                                cmpCommentsPanel.ProjectID, cmpCommentsPanel.ProjectCode, Left(_txt, 250), "", _corr);
                                            Reset(txtCmtNew);
                                            Reset(chkCmtInternal);
                                            cmpCommentsPanel.OnPosted(),
                                            Notify(fnT("cmt.saveError", "Your comment could not be saved. Please try again."), NotificationType.Error)
                                        )
                                    )
                                )
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =FinTheme.Primary
                              PressedColor: =FinTheme.OnPrimary
                              PressedFill: =ColorFade(FinTheme.Primary, -0.24)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =fsBody
                              Text: =fnT("cmt.post", "Post")
                              Tooltip: =fnT("cmt.post", "Post comment")
                              Width: =100
            - lblCmtEmpty:
                Control: Label@2.5.1
                Properties:
                  Align: =alignStart
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =FinTheme.TextSecondary
                  Font: =fontBase
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =fsBody
                  Text: =fnT("cmt.empty", "No comments yet.")
                  Visible: =galComments_1.AllItemsCount = 0
                  Wrap: =false
            - galComments_1:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =fnT("cmt.title", "Comments")
                  ItemAccessibleLabel: =ThisItem.CommentedByName & ", " & ThisItem.Comment
                  Items: |-
                    =FirstN(
                        Sort(
                            If(
                                cmpCommentsPanel.ShowInternal,
                                Filter(
                                Comments,
                                RecordID = cmpCommentsPanel.RecordID,
                                RecordType = cmpCommentsPanel.RecordType,
                                Module.Value = cmpCommentsPanel.ModuleName,
                                IsDeleted = false
                                ),
                                Filter(
                                Comments,
                                RecordID = cmpCommentsPanel.RecordID,
                                RecordType = cmpCommentsPanel.RecordType,
                                Module.Value = cmpCommentsPanel.ModuleName,
                                IsDeleted = false,
                                IsInternal = false
                                )
                            ),
                            ID,
                            SortOrder.Descending
                        ),
                        cmpCommentsPanel.TopN
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  Selectable: =false
                  TemplatePadding: =0
                  TemplateSize: =88
                Children:
                  - lblCmtAuthor:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        Color: =FinTheme.Text
                        Font: =fontBase
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsBody
                        Text: =ThisItem.CommentedByName & If(ThisItem.IsInternal, "  |  " & fnT("cmt.internalTag", "Internal"), "")
                        Width: =Parent.TemplateWidth * 0.6
                        Wrap: =false
                        X: =If(isRTL, Parent.TemplateWidth - Self.Width, 0)
                        Y: =4
                  - lblCmtDate:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignEnd
                        Color: =FinTheme.TextSecondary
                        Font: =fontBase
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsCaption
                        Text: =Text(ThisItem.CommentDate, "dd mmm yyyy hh:mm", appLocale)
                        Width: =Parent.TemplateWidth * 0.4
                        Wrap: =false
                        X: =If(isRTL, 0, Parent.TemplateWidth - Self.Width)
                        Y: =4
                  - lblCmtText:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        Color: =FinTheme.Text
                        Font: =fontBase
                        Height: =54
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsBody
                        Text: =ThisItem.Comment
                        Tooltip: =ThisItem.Comment
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.TemplateWidth
                        Y: =26
                  - rectCmtDivider:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =FinTheme.Border
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
            - btnCmtMore:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderColor: =FinTheme.Border
                  BorderThickness: =1
                  Color: =FinTheme.Text
                  DisabledBorderColor: =FinTheme.Border
                  DisabledColor: =FinTheme.TextSecondary
                  DisabledFill: =FinTheme.Border
                  Fill: =FinTheme.Surface
                  FocusedBorderColor: =FinTheme.Focus
                  FocusedBorderThickness: =2
                  Font: =fontBase
                  Height: =touchMin
                  HoverBorderColor: =FinTheme.Primary
                  HoverColor: =FinTheme.Text
                  HoverFill: =FinTheme.RowHover
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =cmpCommentsPanel.OnLoadMore()
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  PressedBorderColor: =FinTheme.Primary
                  PressedColor: =FinTheme.Text
                  PressedFill: =FinTheme.RowSelected
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =fsBody
                  Text: =fnT("cmt.loadMore", "Load more")
                  Tooltip: =fnT("cmt.loadMore", "Load more comments")
                  Visible: =cmpCommentsPanel.HasMore
                  Width: =140
