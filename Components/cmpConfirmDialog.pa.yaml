ComponentDefinitions:
  cmpConfirmDialog:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Busy:
        PropertyKind: Input
        Description: Disables the buttons while the host is saving
        DataType: Boolean
        Default: =false
      CancelText:
        PropertyKind: Input
        Description: Cancel button text
        DataType: Text
        Default: ="Cancel"
      ConfirmText:
        PropertyKind: Input
        Description: Confirm button text
        DataType: Text
        Default: ="Reject"
      Destructive:
        PropertyKind: Input
        Description: Red confirm button + warning icon
        DataType: Boolean
        Default: =true
      IsValid:
        PropertyKind: Output
        Description: true when the reason rule is satisfied
        DataType: Boolean
      Message:
        PropertyKind: Input
        Description: Explanation
        DataType: Text
        Default: ="This action is recorded in the activity log."
      MinReasonLength:
        PropertyKind: Input
        Description: Minimum characters for the reason
        DataType: Number
        Default: =5
      OnCancel:
        PropertyKind: Event
        Description: User cancelled or closed the dialog
        ReturnType: None
        Default: =""
      OnConfirm:
        PropertyKind: Event
        Description: User confirmed (host does the Patch / flow call, then hides the dialog)
        ReturnType: None
        Default: =""
      Reason:
        PropertyKind: Output
        Description: Trimmed reason text (read it in OnConfirm)
        DataType: Text
      ReasonLabel:
        PropertyKind: Input
        Description: Label above the reason box
        DataType: Text
        Default: ="Reason"
      RequireReason:
        PropertyKind: Input
        Description: Reason is mandatory (reject, cancel, reversal, rate change, budget revision)
        DataType: Boolean
        Default: =true
      ShowReason:
        PropertyKind: Input
        Description: Show the text box as an OPTIONAL comment when RequireReason = false (approve / check)
        DataType: Boolean
        Default: =false
      Title:
        PropertyKind: Input
        Description: Dialog title
        DataType: Text
        Default: ="Reject payment request"
    Properties:
      Height: =App.Height
      IsValid: =!cmpConfirmDialog.RequireReason || Len(cmpConfirmDialog.Reason) >= cmpConfirmDialog.MinReasonLength
      OnReset: =Reset(txtDlgReason)
      Reason: =Trim(txtDlgReason.Text)
      Width: =App.Width
    Children:
      - conDlgOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =FinTheme.Overlay
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conDlgCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =FinTheme.Border
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semibold
                  Fill: =FinTheme.Surface
                  Height: =sp3 * 2 + 32 + sp2 + lblDlgMessage.Height + If(cmpConfirmDialog.RequireReason || cmpConfirmDialog.ShowReason, sp2 + 20 + 4 + 96 + 4 + 18, 0) + sp3 + touchMin
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =sp2
                  PaddingBottom: =sp3
                  PaddingLeft: =sp3
                  PaddingRight: =sp3
                  PaddingTop: =sp3
                  RadiusBottomLeft: =radiusCard
                  RadiusBottomRight: =radiusCard
                  RadiusTopLeft: =radiusCard
                  RadiusTopRight: =radiusCard
                  Width: =If(isMobile, Parent.Width, Min(520, Parent.Width - sp4))
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =If(isMobile, Parent.Height - Self.Height, (Parent.Height - Self.Height) / 2)
                Children:
                  - conDlgHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =32
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =sp1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - icoDlgTone:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =If(cmpConfirmDialog.Destructive, FinTheme.DangerText, FinTheme.InfoText)
                              FocusedBorderColor: =FinTheme.Focus
                              Height: =24
                              Icon: =If(cmpConfirmDialog.Destructive, Icon.Warning, Icon.Information)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =24
                        - lblDlgTitle:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =FinTheme.Text
                              FillPortions: =1
                              Font: =fontBase
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Role: =TextRole.Heading2
                              Size: =fsSection
                              Text: =cmpConfirmDialog.Title
                              Wrap: =false
                        - icoDlgClose:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =fnT("dlg.close", "Close dialog")
                              AlignInContainer: =AlignInContainer.Center
                              Color: =FinTheme.TextSecondary
                              DisplayMode: =If(cmpConfirmDialog.Busy, DisplayMode.Disabled, DisplayMode.Edit)
                              FocusedBorderColor: =FinTheme.Focus
                              Height: =touchMin
                              HoverFill: =FinTheme.RowHover
                              Icon: =Icon.Cancel
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpConfirmDialog.OnCancel()
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              TabIndex: =0
                              Width: =touchMin
                  - lblDlgMessage:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =FinTheme.TextSecondary
                        Font: =fontBase
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsBody
                        Text: =cmpConfirmDialog.Message
                        VerticalAlign: =VerticalAlign.Top
                  - conDlgReason:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =20 + 4 + 96 + 4 + 18
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =cmpConfirmDialog.RequireReason || cmpConfirmDialog.ShowReason
                      Children:
                        - lblDlgReason:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =FinTheme.Text
                              Font: =fontBase
                              FontWeight: =FontWeight.Semibold
                              Height: =20
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =fsCaption
                              Text: =cmpConfirmDialog.ReasonLabel & If(cmpConfirmDialog.RequireReason, " *", "")
                              Wrap: =false
                        - txtDlgReason:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              AccessibleLabel: =cmpConfirmDialog.ReasonLabel
                              Align: =alignStart
                              AlignInContainer: =AlignInContainer.Stretch
                              BorderColor: =FinTheme.Border
                              BorderThickness: =1
                              Color: =FinTheme.Text
                              Default: =""
                              DisplayMode: =If(cmpConfirmDialog.Busy, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =FinTheme.Surface
                              FocusedBorderColor: =FinTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =fontBase
                              Height: =96
                              HintText: =If(cmpConfirmDialog.RequireReason, fnT("dlg.reasonHint", "Explain why (required for the audit log)"), fnT("dlg.commentHint", "Optional comment"))
                              HoverBorderColor: =FinTheme.Primary
                              HoverFill: =FinTheme.Surface
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              MaxLength: =500
                              Mode: =TextMode.MultiLine
                              PaddingLeft: =8
                              PaddingRight: =8
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =fsBody
                        - lblDlgReasonHelp:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =FinTheme.DangerText
                              Font: =fontBase
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Live: =Live.Polite
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =fsCaption
                              Text: |-
                                =If(
                                    cmpConfirmDialog.RequireReason && Len(cmpConfirmDialog.Reason) < cmpConfirmDialog.MinReasonLength,
                                    fnT("dlg.minChars", "Minimum characters") & " " & cmpConfirmDialog.MinReasonLength & " (" & Len(cmpConfirmDialog.Reason) & ")",
                                    ""
                                )
                              Wrap: =false
                  - conDlgButtons:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =touchMin
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =sp1
                        LayoutJustifyContent: =If(isRTL, LayoutJustifyContent.Start, LayoutJustifyContent.End)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - btnDlgCancel:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =FinTheme.Border
                              BorderThickness: =1
                              Color: =FinTheme.Text
                              DisabledBorderColor: =FinTheme.Border
                              DisabledColor: =FinTheme.TextSecondary
                              DisabledFill: =FinTheme.Border
                              DisplayMode: =If(cmpConfirmDialog.Busy, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =FinTheme.Surface
                              FocusedBorderColor: =FinTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =fontBase
                              Height: =touchMin
                              HoverBorderColor: =FinTheme.Primary
                              HoverColor: =FinTheme.Text
                              HoverFill: =FinTheme.RowHover
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpConfirmDialog.OnCancel()
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =FinTheme.Primary
                              PressedColor: =FinTheme.Text
                              PressedFill: =FinTheme.RowSelected
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =fsBody
                              Text: =cmpConfirmDialog.CancelText
                              Width: =If(isMobile, (Parent.Width - sp1) / 2, 120)
                        - btnDlgConfirm:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =If(cmpConfirmDialog.Destructive, FinTheme.Danger, FinTheme.Primary)
                              BorderThickness: =1
                              Color: =If(cmpConfirmDialog.Destructive, FinTheme.OnDanger, FinTheme.OnPrimary)
                              DisabledBorderColor: =FinTheme.Border
                              DisabledColor: =FinTheme.TextSecondary
                              DisabledFill: =FinTheme.Border
                              DisplayMode: =If(cmpConfirmDialog.IsValid && !cmpConfirmDialog.Busy, DisplayMode.Edit, DisplayMode.Disabled)
                              Fill: =If(cmpConfirmDialog.Destructive, FinTheme.Danger, FinTheme.Primary)
                              FocusedBorderColor: =FinTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =fontBase
                              Height: =touchMin
                              HoverBorderColor: =FinTheme.Primary
                              HoverColor: =Self.Color
                              HoverFill: =ColorFade(Self.Fill, -0.12)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpConfirmDialog.OnConfirm()
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =FinTheme.Primary
                              PressedFill: =ColorFade(Self.Fill, -0.24)
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Size: =fsBody
                              Text: =cmpConfirmDialog.ConfirmText
                              Width: =If(isMobile, (Parent.Width - sp1) / 2, 140)
