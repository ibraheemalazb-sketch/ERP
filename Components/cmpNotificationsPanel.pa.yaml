ComponentDefinitions:
  cmpNotificationsPanel:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Busy:
        PropertyKind: Input
        Description: Host is saving (disables Mark all as read)
        DataType: Boolean
        Default: =false
      Items:
        PropertyKind: Input
        Description: 'Rows {ID, Title, Message, Created, Link, RelatedEntity, RelatedItemID}: host maps colFinNotif'
        DataType: Table
        Default: |-
          =Table(
              {ID: 1, Title: "Payment request PRN-2026-0012 waiting for your approval", Message: "Project PRJ-001", Created: Now(), Link: "", RelatedEntity: "Payment Request", RelatedItemID: 12}
          )
      OnClose:
        PropertyKind: Event
        Description: Close / overlay selected
        ReturnType: None
        Default: =""
      OnMarkAllRead:
        PropertyKind: Event
        Description: Mark all as read selected
        ReturnType: None
        Default: =""
      OnOpenItem:
        PropertyKind: Event
        Description: 'A notification was selected: host marks it read and opens the related record'
        ReturnType: None
        Default: =""
      SelectedItem:
        PropertyKind: Output
        Description: Notification the user opened
        DataType: Record
    Properties:
      Height: =App.Height
      SelectedItem: =galNotif.Selected
      Width: =App.Width
    Children:
      - conNotifOverlay:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =FinTheme.Overlay
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - btnNotifOverlay:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Color: =RGBA(0, 0, 0, 0)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =FinTheme.TextSecondary
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderColor: =FinTheme.Focus
                  FocusedBorderThickness: =2
                  Font: =fontBase
                  Height: =Parent.Height
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: =cmpNotificationsPanel.OnClose()
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Size: =fsBody
                  TabIndex: =-1
                  Text: =""
                  Tooltip: =fnT("dlg.close", "Close")
                  Width: =Parent.Width
            - conNotifCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =FinTheme.Border
                  BorderThickness: =1
                  DropShadow: =DropShadow.Semibold
                  Fill: =FinTheme.Surface
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =sp1
                  PaddingBottom: =sp2
                  PaddingLeft: =sp2
                  PaddingRight: =sp2
                  PaddingTop: =sp2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =If(isMobile, Parent.Width, Min(400, Parent.Width))
                  X: =If(isMobile, 0, If(isRTL, 0, Parent.Width - Self.Width))
                Children:
                  - conNotifHead:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =sp1
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - lblNotifTitle:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =FinTheme.Text
                              FillPortions: =1
                              Font: =fontBase
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Role: =TextRole.Heading2
                              Size: =fsSection
                              Text: =fnT("notif.title", "Notifications") & If(CountRows(cmpNotificationsPanel.Items) > 0, " (" & If(CountRows(cmpNotificationsPanel.Items) >= 50, "50+", Text(CountRows(cmpNotificationsPanel.Items))) & ")", "")
                              Wrap: =false
                        - icoNotifClose:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AccessibleLabel: =fnT("dlg.close", "Close")
                              AlignInContainer: =AlignInContainer.Center
                              Color: =FinTheme.TextSecondary
                              FocusedBorderColor: =FinTheme.Focus
                              Height: =44
                              Icon: =Icon.Cancel
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =cmpNotificationsPanel.OnClose()
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              TabIndex: =0
                              Width: =44
                  - btnNotifReadAll:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =If(isRTL, AlignInContainer.End, AlignInContainer.Start)
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        Color: =FinTheme.Primary
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =FinTheme.TextSecondary
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: =If(cmpNotificationsPanel.Busy, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(0, 0, 0, 0)
                        FocusedBorderColor: =FinTheme.Focus
                        FocusedBorderThickness: =2
                        Font: =fontBase
                        Height: =touchMin
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =FinTheme.Primary
                        HoverFill: =FinTheme.RowHover
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =cmpNotificationsPanel.OnMarkAllRead()
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =FinTheme.Primary
                        PressedFill: =FinTheme.RowSelected
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =fsBody
                        Text: =fnT("notif.readAll", "Mark all as read")
                        Visible: =CountRows(cmpNotificationsPanel.Items) > 0
                        Width: =180
                  - lblNotifEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =FinTheme.TextSecondary
                        Font: =fontBase
                        Height: =44
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsBody
                        Text: =fnT("notif.empty", "You are all caught up. No unread notifications.")
                        Visible: =CountRows(cmpNotificationsPanel.Items) = 0
                  - galNotif:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: =fnT("notif.title", "Notifications")
                        DelayItemLoading: =false
                        ItemAccessibleLabel: =ThisItem.Title & ", " & Text(ThisItem.Created, "dd mmm yyyy hh:mm")
                        Items: =cmpNotificationsPanel.Items
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LoadingSpinner: =LoadingSpinner.None
                        OnSelect: =cmpNotificationsPanel.OnOpenItem()
                        TemplatePadding: =0
                        TemplateSize: =84
                      Children:
                        - icoNotifItem:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =FinTheme.InfoText
                              FocusedBorderColor: =FinTheme.Focus
                              Height: =20
                              Icon: =Icon.Bell
                              Width: =20
                              X: =If(isRTL, Parent.TemplateWidth - 8 - Self.Width, 8)
                              Y: =12
                        - lblNotifItemTitle:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              Color: =FinTheme.Text
                              Font: =fontBase
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =fsBody
                              Text: =ThisItem.Title
                              Tooltip: =Self.Text
                              Width: =Parent.TemplateWidth - 44
                              Wrap: =false
                              X: =If(isRTL, 8, 36)
                              Y: =8
                        - lblNotifItemMsg:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              Color: =FinTheme.TextSecondary
                              Font: =fontBase
                              Height: =32
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =fsCaption
                              Text: =ThisItem.Message
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.TemplateWidth - 44
                              X: =If(isRTL, 8, 36)
                              Y: =30
                        - lblNotifItemDate:
                            Control: Label@2.5.1
                            Properties:
                              Align: =alignStart
                              Color: =FinTheme.TextSecondary
                              Font: =fontBase
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =fsCaption
                              Text: =Text(ThisItem.Created, "dd mmm yyyy hh:mm", appLocale)
                              Width: =Parent.TemplateWidth - 44
                              Wrap: =false
                              X: =If(isRTL, 8, 36)
                              Y: =62
                        - rectNotifDivider:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =FinTheme.Border
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                        - btnNotifHit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Color: =RGBA(0, 0, 0, 0)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =FinTheme.TextSecondary
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              Fill: =RGBA(0, 0, 0, 0)
                              FocusedBorderColor: =FinTheme.Focus
                              FocusedBorderThickness: =2
                              Font: =fontBase
                              Height: =Parent.TemplateHeight
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =FinTheme.RowHover
                              OnSelect: =Select(Parent)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =FinTheme.RowSelected
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =fsBody
                              Text: =""
                              Tooltip: =ThisItem.Title
                              Width: =Parent.TemplateWidth
