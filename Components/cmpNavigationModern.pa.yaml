ComponentDefinitions:
  cmpNavigationModern:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Kept for existing screens. The accent follows gblTheme.
        DataType: Color
        Default: =RGBA(27, 86, 229, 1)
      AppLogo:
        PropertyKind: Input
        DisplayName: AppLogo
        Description: Logo shown at the top of the panel.
        DataType: Image
        Default: =SampleImage
      Expanded:
        PropertyKind: Input
        DisplayName: Expanded
        Description: Starting state, used only until gblMenuExpanded has a value. After the toggle, gblMenuExpanded is the source of truth for every screen.
        DataType: Boolean
        Default: =true
      HoverBackground:
        PropertyKind: Input
        DisplayName: HoverBackground
        Description: Kept for existing screens. Hover uses the theme surface color.
        DataType: Color
        Default: =RGBA(27, 86, 229, 0.06)
      Icons:
        PropertyKind: Input
        DisplayName: Icons
        Description: Kept so existing screens still bind. Rows draw their own SVG from the Icon column and do not read this table.
        DataType: Table
        Default: |-
          =Table(
              {
                  Name: "Home",
                  SVG: ""
              }
          )
      IsExpanded:
        PropertyKind: Output
        DisplayName: IsExpanded
        Description: Current expand state shared by every copy of this menu.
        DataType: Boolean
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Menu rows with ID, Title, Icon, ParentID, Visible, and Enabled. Root rows use ParentID -1.
        DataType: Table
        Default: |-
          =With(
              {
                  ar: gblLanguage = "Arabic",
                  admin: gblUser.Role = "System Administrator",
                  pHR: LookUp(colUserPermissions, Module.Value = "HR"),
                  pPrj: LookUp(colUserPermissions, Module.Value = "Projects"),
                  pProc: LookUp(colUserPermissions, Module.Value = "Procurement"),
                  pFin: LookUp(colUserPermissions, Module.Value = "Finance"),
                  pMeal: LookUp(colUserPermissions, Module.Value = "MEAL")
              },
              Table(
                  {ID: 1, Title: If(ar, "الرئيسية", "Home"), Icon: "Home", ParentID: -1, Visible: true, Enabled: true},
                  {ID: 10, Title: If(ar, "الموارد البشرية", "Human Resources"), Icon: "Users", ParentID: -1, Visible: pHR.CanRead || pFin.CanApprove, Enabled: true},
                  {ID: 11, Title: If(ar, "الرئيسية", "Main"), Icon: "Home", ParentID: 10, Visible: pHR.CanRead, Enabled: true},
                  {ID: 12, Title: If(ar, "الموظفون", "Employees"), Icon: "User", ParentID: 10, Visible: pHR.CanRead && pHR.CanViewAll && pHR.Scope.Value = "All", Enabled: true},
                  {ID: 13, Title: If(ar, "الحضور", "Attendance"), Icon: "Calendar", ParentID: 10, Visible: pHR.CanRead, Enabled: true},
                  {ID: 14, Title: If(ar, "الإجازات", "Leave"), Icon: "Plane", ParentID: 10, Visible: pHR.CanRead, Enabled: true},
                  {ID: 15, Title: If(ar, "الرواتب", "Payroll"), Icon: "Wallet", ParentID: 10, Visible: pHR.CanViewAll && pHR.Scope.Value = "All", Enabled: true},
                  {ID: 16, Title: If(ar, "التوظيف", "Recruitment"), Icon: "UserPlus", ParentID: 10, Visible: pHR.CanViewAll && pHR.Scope.Value = "All", Enabled: true},
                  {ID: 17, Title: If(ar, "التدريب", "Training"), Icon: "Graduation", ParentID: 10, Visible: pHR.CanRead || pFin.CanApprove, Enabled: true},
                  {ID: 18, Title: If(ar, "الأداء", "Performance"), Icon: "Performance", ParentID: 10, Visible: pHR.CanRead, Enabled: true},
                  {ID: 20, Title: If(ar, "البرامج", "Programs"), Icon: "Layers", ParentID: -1, Visible: pPrj.CanRead, Enabled: true},
                  {ID: 21, Title: If(ar, "الرئيسية", "Main"), Icon: "Home", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 22, Title: If(ar, "المشاريع", "Projects"), Icon: "Box", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 23, Title: If(ar, "الخطط", "Plans"), Icon: "File", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 24, Title: If(ar, "مهامي", "My tasks"), Icon: "Grid", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 29, Title: If(ar, "كل المهام", "All tasks"), Icon: "List", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 25, Title: If(ar, "الأنشطة", "Activities"), Icon: "Activity", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 26, Title: If(ar, "التقارير", "Reports"), Icon: "Chart", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 27, Title: If(ar, "الوثائق", "Documents"), Icon: "Folder", ParentID: 20, Visible: true, Enabled: false},
                  {ID: 28, Title: If(ar, "المخاطر", "Risks"), Icon: "Warning", ParentID: 20, Visible: true, Enabled: true},
                  {ID: 30, Title: If(ar, "المشتريات", "Procurement"), Icon: "ShoppingCart", ParentID: -1, Visible: pProc.CanRead, Enabled: true},
                  {ID: 31, Title: If(ar, "الرئيسية", "Main"), Icon: "Home", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 32, Title: If(ar, "طلبات الشراء", "Purchase Requests"), Icon: "Clipboard", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 33, Title: If(ar, "أوامر الشراء", "Purchase Orders"), Icon: "Receipt", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 34, Title: If(ar, "الاستلامات", "Goods Receipt"), Icon: "Truck", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 35, Title: If(ar, "الموردون", "Vendors"), Icon: "Users", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 36, Title: If(ar, "عروض الأسعار", "Quotations"), Icon: "FileText", ParentID: 30, Visible: true, Enabled: false},
                  {ID: 37, Title: If(ar, "العقود", "Contracts"), Icon: "Handshake", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 38, Title: If(ar, "المخزون", "Inventory"), Icon: "Package", ParentID: 30, Visible: true, Enabled: false},
                  {ID: 39, Title: If(ar, "خطط المشتريات", "Procurement Plans"), Icon: "List", ParentID: 30, Visible: true, Enabled: true},
                  {ID: 40, Title: If(ar, "التقارير", "Reports"), Icon: "Chart", ParentID: 30, Visible: true, Enabled: false},
                  {ID: 50, Title: If(ar, "المالية", "Finance"), Icon: "Money", ParentID: -1, Visible: pFin.CanRead, Enabled: true},
                  {ID: 51, Title: If(ar, "الرئيسية", "Main"), Icon: "Home", ParentID: 50, Visible: true, Enabled: true},
                  {ID: 52, Title: If(ar, "العمليات المالية", "Transactions"), Icon: "Calculator", ParentID: 50, Visible: true, Enabled: true},
                  {ID: 53, Title: If(ar, "الميزانيات", "Budgets"), Icon: "Wallet", ParentID: 50, Visible: true, Enabled: true},
                  {ID: 54, Title: If(ar, "التقارير", "Reports"), Icon: "Chart", ParentID: 50, Visible: true, Enabled: false},
                  {ID: 55, Title: If(ar, "بنود الميزانية", "Budget Lines"), Icon: "Coins", ParentID: 50, Visible: true, Enabled: true},
                  {ID: 56, Title: If(ar, "إدارة المشاريع المالية", "Project Finance"), Icon: "Map", ParentID: 50, Visible: true, Enabled: true},
                  {ID: 60, Title: If(ar, "المتابعة والتقييم", "MEAL"), Icon: "Dashboard", ParentID: -1, Visible: pMeal.CanRead, Enabled: true},
                  {ID: 61, Title: If(ar, "لوحة المتابعة", "MEAL Dashboard"), Icon: "Home", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 77, Title: If(ar, "إطار النتائج", "Results Framework"), Icon: "Layers", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 62, Title: If(ar, "المؤشرات", "Indicators"), Icon: "Chart", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 67, Title: If(ar, "نتائج المؤشرات", "Indicator Results"), Icon: "Database", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 65, Title: If(ar, "أنشطة المتابعة", "MEAL Activities"), Icon: "Activity", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 63, Title: If(ar, "الزيارات الميدانية", "Field Visits"), Icon: "Map", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 78, Title: If(ar, "الدراسات والتقييم", "Studies"), Icon: "File", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 79, Title: If(ar, "الشكاوى والملاحظات", "CFM"), Icon: "Message", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 80, Title: If(ar, "إجراءات المتابعة", "MEL Actions"), Icon: "ClipboardCheck", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 64, Title: If(ar, "لوحة التقارير", "Reporting Dashboard"), Icon: "Dashboard", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 74, Title: If(ar, "التقارير", "Reports"), Icon: "Chart", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 75, Title: If(ar, "جدول التقارير", "Schedules"), Icon: "Calendar", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 68, Title: If(ar, "الأدلة", "Evidence"), Icon: "Folder", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 76, Title: If(ar, "إعدادات التقارير", "Reporting Settings"), Icon: "Settings", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 81, Title: If(ar, "إعدادات المتابعة", "MEAL Settings"), Icon: "Settings", ParentID: 60, Visible: true, Enabled: true},
                  {ID: 70, Title: If(ar, "الإعدادات", "Settings"), Icon: "Settings", ParentID: -1, Visible: admin, Enabled: true},
                  {ID: 71, Title: If(ar, "المستخدمون والصلاحيات", "Users & Permissions"), Icon: "Shield", ParentID: 70, Visible: true, Enabled: true},
                  {ID: 72, Title: If(ar, "صلاحيات المشاريع", "Project Access"), Icon: "Users", ParentID: 70, Visible: true, Enabled: true},
                  {ID: 73, Title: If(ar, "إعدادات التطبيق", "App Settings"), Icon: "Settings", ParentID: 70, Visible: true, Enabled: true}
              )
          )
      OnFooterSettings:
        PropertyKind: Event
        DisplayName: OnFooterSettings
        Description: Fires when Settings is pressed.
        ReturnType: None
        Default: =false
      OnHelp:
        PropertyKind: Event
        DisplayName: OnHelp
        Description: Fires when Help is pressed.
        ReturnType: None
        Default: =false
      OnLanguageToggle:
        PropertyKind: Event
        DisplayName: OnLanguageToggle
        Description: Fires when the language row is pressed.
        ReturnType: None
        Default: =false
      OnNavigate:
        PropertyKind: Event
        DisplayName: OnNavigate
        Description: Fires after varNavSelectedID is set to the row ID.
        ReturnType: None
        Default: |-
          =Switch(
              varNavSelectedID,
              1, Navigate(ScrHome, ScreenTransition.None),
              10, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
              11, Set(VarHRmodule, "HRHome"); Navigate(ScrHR, ScreenTransition.None),
              12, Set(VarHRmodule, "Employees"); Set(VarNewEmployee, false); Navigate(scrAllEmployees, ScreenTransition.None),
              13, Set(varAttendanceTab, "VarUserAttendance"); Set(VarHRmodule, "Attendance"); Refresh(AttendanceRecords); Navigate(scrAttendance, ScreenTransition.None),
              14, Set(VarNewLeave, false); Set(VarShowLeave, false); Set(VarHRmodule, "Leaves"); Navigate(scrLeaveManagement, ScreenTransition.None),
              15, Set(VarHRmodule, "Payroll"); Navigate(ScrHR, ScreenTransition.None),
              16, Set(VarHRmodule, "Recruitment"); Navigate(ScrHR, ScreenTransition.None),
              17, Set(VarHRmodule, "Training"); Navigate(scrMyTraining, ScreenTransition.None),
              20, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
              21, Set(VarProgrammodule, "PHome"); Navigate(scrProjects, ScreenTransition.None),
              22, Set(VarProgrammodule, "Pprojects"); Navigate(scrProjects, ScreenTransition.None),
              23, Set(VarProgrammodule, "PPlans"); Navigate(scrProjectsPlans, ScreenTransition.None),
              24, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "my"); Navigate(scrMyTasks, ScreenTransition.None),
              29, Set(VarProgrammodule, "PTasks"); Set(varTkScope, "all"); Navigate(scrTasks, ScreenTransition.None),
              25, Set(VarProgrammodule, "PActivities"); Set(varActProjectOnly, false); Navigate(scrActivities, ScreenTransition.None),
              26, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
              28, Set(VarProgrammodule, "PRisks"); Set(varRkScope, If(IsBlank(varSelectedProject), "my", "project")); Navigate(scrRisks, ScreenTransition.None),
              30, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
              31, Set(varProcurementTab, "Main"); Navigate(scrProcurement, ScreenTransition.None),
              32, Set(varCurrentPR, Blank()); Set(varProcurementTab, "PRs"); Set(varProcurementMode, "View"); Navigate(scrPRs, ScreenTransition.None),
              33, Set(varCurrentPO, Blank()); Set(varProcurementTab, "POs"); Set(varProcurementMode, "View"); Navigate(scrPOs, ScreenTransition.None),
              34, Set(varCurrentGRN, Blank()); Set(varProcurementTab, "GRNs"); Set(varProcurementMode, "View"); Navigate(ScrGRN, ScreenTransition.None),
              35, Set(varCurrentVendor, Blank()); Set(varaddvendor, false); Set(varProcurementTab, "Vendors"); Set(varProcurementMode, "View"); Navigate(scrVendors, ScreenTransition.None),
              37, Set(varProcurementTab, "Contracts"); Navigate(scrProcurement, ScreenTransition.None),
              39, Set(varProcurementTab, "Plans"); Navigate(scrProcurement, ScreenTransition.None),
              50, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
              51, Set(VarFinTab, "Main"); Navigate(scrFinance, ScreenTransition.None),
              52, Set(VarFinTab, "Transactions"); Navigate(scrFinance, ScreenTransition.None),
              53, Set(VarFinTab, "Budgets"); Navigate(scrFinance, ScreenTransition.None),
              55, Set(VarFinTab, "BudgetLines"); Navigate(scrFinance, ScreenTransition.None),
              56, Set(VarFinTab, "ProjectFinance"); Navigate(scrFinance, ScreenTransition.None),
              60, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
              61, Set(VarMEALmodule, "Main"); Navigate(scrMEAL, ScreenTransition.None),
              77, Set(VarMEALmodule, "Results"); Navigate(scrResultsFramework, ScreenTransition.None),
              62, Set(VarMEALmodule, "Indicators"); Navigate(scrIndicators, ScreenTransition.None),
              67, Set(VarMEALmodule, "IndicatorResults"); Navigate(scrIndicatorResults, ScreenTransition.None),
              65, Set(VarMEALmodule, "Activities"); Navigate(scrMEALActivities, ScreenTransition.None),
              63, Set(VarMEALmodule, "FieldVisits"); Navigate(scrFieldVisits, ScreenTransition.None),
              78, Set(VarMEALmodule, "Studies"); Navigate(scrMELStudies, ScreenTransition.None),
              79, Set(VarMEALmodule, "CFM"); Navigate(scrCFM, ScreenTransition.None),
              80, Set(VarMEALmodule, "Actions"); Navigate(scrMELActions, ScreenTransition.None),
              64, Set(VarMEALmodule, "Reports"); Navigate(scrReporting, ScreenTransition.None),
              74, Set(VarMEALmodule, "Reports"); Navigate(scrReports, ScreenTransition.None),
              75, Set(VarMEALmodule, "Reports"); Navigate(scrReportSchedules, ScreenTransition.None),
              76, Set(VarMEALmodule, "Reports"); Navigate(scrReportingSettings, ScreenTransition.None),
              68, Set(VarMEALmodule, "Evidence"); Navigate(scrMEALEvidence, ScreenTransition.None),
              81, Set(VarMEALmodule, "Settings"); Navigate(scrMEALSettings, ScreenTransition.None),
              70, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None),
              71, Set(VarSettingSection, "UserPermissions"); Set(gblShowPermissionForm, false); Navigate(ScrSettings, ScreenTransition.None),
              72, Set(VarSettingSection, "ProjectAccess"); Set(gblShowProjectAccessForm, false); Navigate(ScrSettings, ScreenTransition.None),
              73, Set(VarSettingSection, "AppSettings"); Navigate(ScrSettings, ScreenTransition.None)
          )
      OnToggle:
        PropertyKind: Event
        DisplayName: OnToggle
        Description: Fires when the panel is collapsed or expanded. The screen owns this formula. The default flips gblMenuExpanded once.
        ReturnType: None
        Default: |-
          =Set(gblMenuExpanded, !Coalesce(gblMenuExpanded, cmpNavigationModern.Expanded));
          If(!gblMenuExpanded, Set(gblNavOpenId, -1))
      PrimaryText:
        PropertyKind: Input
        DisplayName: PrimaryText
        Description: Kept for existing screens. Text color follows gblTheme.
        DataType: Color
        Default: =RGBA(17, 24, 39, 1)
      SecondaryText:
        PropertyKind: Input
        DisplayName: SecondaryText
        Description: Kept for existing screens. Muted text follows gblTheme.
        DataType: Color
        Default: =RGBA(107, 114, 128, 1)
      SelectedBackground:
        PropertyKind: Input
        DisplayName: SelectedBackground
        Description: Kept for existing screens. The selected row uses the theme selected surface.
        DataType: Color
        Default: =RGBA(236, 242, 255, 1)
      SelectedID:
        PropertyKind: Output
        DisplayName: SelectedID
        Description: ID of the selected row. Mirrors varNavSelectedID.
        DataType: Number
      SelectedText:
        PropertyKind: Input
        DisplayName: SelectedText
        Description: Kept for existing screens. The selected row uses the theme primary.
        DataType: Color
        Default: =RGBA(27, 86, 229, 1)
      ShowFooterMenu:
        PropertyKind: Input
        DisplayName: ShowFooterMenu
        Description: Shows Settings and Help.
        DataType: Boolean
        Default: =true
      ShowLanguageToggle:
        PropertyKind: Input
        DisplayName: ShowLanguageToggle
        Description: Shows the language row.
        DataType: Boolean
        Default: =false
      ShowUser:
        PropertyKind: Input
        DisplayName: ShowUser
        Description: Shows the signed-in user.
        DataType: Boolean
        Default: =true
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Kept for existing screens. Colors follow gblTheme.Mode.
        DataType: Text
        Default: ="Light"
    Properties:
      Fill: |-
        =If(
            gblTheme.Mode = "Dark",
            gblTheme.Dark.Colors.Surface,
            gblTheme.Light.Colors.Surface
        )
      Height: =App.Height
      IsExpanded: =Coalesce(gblMenuExpanded, cmpNavigationModern.Expanded)
      OnReset: =Set(gblNavOpenId, -1)
      SelectedID: =Coalesce(varNavSelectedID, 1)
      Width: =If(cmpNavigationModern.IsExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth)
    Children:
      - rectNavEdge:
          Control: Rectangle@2.3.0
          Properties:
            Fill: |-
              =If(
                  gblTheme.Mode = "Dark",
                  gblTheme.Dark.Colors.Border,
                  gblTheme.Light.Colors.Border
              )
            Height: =cmpNavigationModern.Height
            Width: =1
            X: =cmpNavigationModern.Width - 1
      - conNavHeader:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =64
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =cmpNavigationModern.Width
          Children:
            - imgNavLogo:
                Control: Image@2.2.3
                Properties:
                  AccessibleLabel: |-
                    =If(
                        gblLanguage = "Arabic",
                        "شعار التطبيق",
                        "Application logo"
                    )
                  BorderStyle: =BorderStyle.None
                  Height: =36
                  Image: =hdp
                  Visible: =cmpNavigationModern.IsExpanded
                  Width: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        Min(140, conNavHeader.Width - 64),
                        36
                    )
                  X: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        16,
                        (conNavHeader.Width - 36) / 2
                    )
                  Y: =14
            - btnNavHeaderToggle:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", "طي القائمة", "Collapse menu"),
                        If(gblLanguage = "Arabic", "توسيع القائمة", "Expand menu")
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Icon: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", "ChevronRight", "ChevronLeft"),
                        If(gblLanguage = "Arabic", "ChevronLeft", "ChevronRight")
                    )
                  OnSelect: =cmpNavigationModern.OnToggle()
                  Text: =""
                  Tooltip: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", "طي القائمة", "Collapse menu"),
                        If(gblLanguage = "Arabic", "توسيع القائمة", "Expand menu")
                    )
                  Width: =32
                  X: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", 8, conNavHeader.Width - 40),
                        (conNavHeader.Width - 32) / 2
                    )
                  Y: =16
      - galNav:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            AccessibleLabel: |-
              =If(
                  gblLanguage = "Arabic",
                  "التنقل",
                  "Navigation"
              )
            BorderStyle: =BorderStyle.None
            DelayItemLoading: =false
            Fill: =Color.Transparent
            Height: |-
              =cmpNavigationModern.Height - 64 - If(
                  cmpNavigationModern.IsExpanded,
                  8 + If(cmpNavigationModern.ShowUser, 56, 0) + If(cmpNavigationModern.ShowFooterMenu, 40, 0) + If(cmpNavigationModern.ShowLanguageToggle, 40, 0) + 44,
                  8 + If(cmpNavigationModern.ShowUser, 44, 0) + If(cmpNavigationModern.ShowFooterMenu, 80, 0) + If(cmpNavigationModern.ShowLanguageToggle, 40, 0) + 44
              )
            ItemAccessibleLabel: =ThisItem.Title
            Items: |-
              =With(
                  {
                      openId: Coalesce(gblNavOpenId, -1)
                  },
                  Filter(
                      cmpNavigationModern.Items As navRow,
                      And(
                          navRow.Visible = true,
                          Or(
                              navRow.ParentID = -1,
                              And(
                                  cmpNavigationModern.IsExpanded,
                                  navRow.ParentID = openId
                              )
                          )
                      )
                  )
              )
            Selectable: =false
            TabIndex: =0
            TemplatePadding: =0
            TemplateSize: =44
            Width: =cmpNavigationModern.Width
            Y: =64
          Children:
            - conNavRow:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =44
                  Width: =galNav.Width
                Children:
                  - shpNavSelected:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              ThisItem.ID = varNavSelectedID,
                              If(
                                  gblTheme.Mode = "Dark",
                                  gblTheme.Dark.Colors.SurfaceSelected,
                                  gblTheme.Light.Colors.SurfaceSelected
                              ),
                              Color.Transparent
                          )
                        Height: =36
                        RadiusBottomLeft: =gblTheme.Radius.Large
                        RadiusBottomRight: =gblTheme.Radius.Large
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Width: =conNavRow.Width - 16
                        X: =8
                        Y: =4
                  - shpNavMark:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.Primary,
                              gblTheme.Light.Colors.Primary
                          )
                        Height: =16
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Visible: =ThisItem.ID = varNavSelectedID
                        Width: =3
                        X: =If(gblLanguage = "Arabic", conNavRow.Width - 3, 0)
                        Y: =14
                  - imgNavIcon:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =ThisItem.Title
                        BorderStyle: =BorderStyle.None
                        Height: =20
                        Image: |-
                          =fxSvg(
                              Coalesce(ThisItem.Icon, "Info"),
                              If(
                                  !Coalesce(ThisItem.Enabled, true),
                                  fxThemeInk("Disabled"),
                                  If(
                                      ThisItem.ID = varNavSelectedID,
                                      fxThemeInk("Primary"),
                                      fxThemeInk("Text")
                                  )
                              )
                          )
                        Tooltip: =ThisItem.Title
                        Width: =20
                        X: |-
                          =If(
                              cmpNavigationModern.IsExpanded,
                              If(
                                  gblLanguage = "Arabic",
                                  conNavRow.Width - 20 - If(ThisItem.ParentID = -1, 14, 26),
                                  If(ThisItem.ParentID = -1, 14, 26)
                              ),
                              (conNavRow.Width - 20) / 2
                          )
                        Y: =12
                  - lblNavTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                        BorderStyle: =BorderStyle.None
                        Color: |-
                          =If(
                              !Coalesce(ThisItem.Enabled, true),
                              If(
                                  gblTheme.Mode = "Dark",
                                  gblTheme.Dark.Colors.TextDisabled,
                                  gblTheme.Light.Colors.TextDisabled
                              ),
                              If(
                                  ThisItem.ID = varNavSelectedID,
                                  If(
                                      gblTheme.Mode = "Dark",
                                      gblTheme.Dark.Colors.Primary,
                                      gblTheme.Light.Colors.Primary
                                  ),
                                  If(
                                      gblTheme.Mode = "Dark",
                                      gblTheme.Dark.Colors.TextPrimary,
                                      gblTheme.Light.Colors.TextPrimary
                                  )
                              )
                          )
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: |-
                          =If(
                              ThisItem.ID = varNavSelectedID,
                              gblTheme.FontWeights.Medium,
                              gblTheme.FontWeights.Regular
                          )
                        Height: =24
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: |-
                          =If(
                              ThisItem.ParentID = -1,
                              gblTheme.Typography.SideNav,
                              gblTheme.Typography.SideNavSmall
                          )*0.9
                        Text: =Coalesce(ThisItem.Title, "")
                        Tooltip: =Self.Text
                        Visible: =cmpNavigationModern.IsExpanded
                        Width: |-
                          =conNavRow.Width - If(
                              gblLanguage = "Arabic",
                              If(ThisItem.ParentID = -1, 28, 12),
                              If(ThisItem.ParentID = -1, 40, 52)
                          ) - If(
                              gblLanguage = "Arabic",
                              If(ThisItem.ParentID = -1, 40, 52),
                              If(ThisItem.ParentID = -1, 28, 12)
                          )
                        Wrap: =false
                        X: |-
                          =If(
                              gblLanguage = "Arabic",
                              If(ThisItem.ParentID = -1, 28, 12),
                              If(ThisItem.ParentID = -1, 40, 52)
                          )
                        Y: =10
                  - icoNavChevron:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Height: =14
                        Icon: |-
                          =If(
                              gblNavOpenId = ThisItem.ID,
                              "ChevronDown",
                              If(gblLanguage = "Arabic", "ChevronLeft", "ChevronRight")
                          )
                        IconColor: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.TextMuted,
                              gblTheme.Light.Colors.TextMuted
                          )
                        Visible: |-
                          =And(
                              cmpNavigationModern.IsExpanded,
                              CountRows(
                                  Filter(
                                      cmpNavigationModern.Items As navRow,
                                      And(
                                          navRow.ParentID = ThisItem.ID,
                                          navRow.Visible = true
                                      )
                                  )
                              ) > 0
                          )
                        Width: =14
                        X: =If(gblLanguage = "Arabic", 12, conNavRow.Width - 26)
                        Y: =15
                  - btnNavRow:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =Coalesce(ThisItem.Title, "")
                        Appearance: =ButtonAppearance.Transparent
                        DisplayMode: |-
                          =If(
                              Coalesce(ThisItem.Enabled, true),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Height: =conNavRow.Height
                        OnSelect: |-
                          =Set(varNavSelectedID, ThisItem.ID);
                          Set(gblSelectedModule, ThisItem.Title);
                          If(
                              CountRows(
                                  Filter(
                                      cmpNavigationModern.Items As navRow,
                                      And(
                                          navRow.ParentID = ThisItem.ID,
                                          navRow.Visible = true
                                      )
                                  )
                              ) > 0,
                              Set(
                                  gblNavOpenId,
                                  If(
                                      gblNavOpenId = ThisItem.ID,
                                      -1,
                                      ThisItem.ID
                                  )
                              ),
                              Set(
                                  gblNavOpenId,
                                  If(
                                      ThisItem.ParentID = -1,
                                      -1,
                                      ThisItem.ParentID
                                  )
                              )
                          );
                          cmpNavigationModern.OnNavigate()
                        Text: =""
                        Tooltip: =Coalesce(ThisItem.Title, "")
                        Width: =conNavRow.Width
      - conNavFooter:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: |-
              =If(
                  cmpNavigationModern.IsExpanded,
                  8 + If(cmpNavigationModern.ShowUser, 56, 0) + If(cmpNavigationModern.ShowFooterMenu, 40, 0) + If(cmpNavigationModern.ShowLanguageToggle, 40, 0) + 44,
                  8 + If(cmpNavigationModern.ShowUser, 44, 0) + If(cmpNavigationModern.ShowFooterMenu, 80, 0) + If(cmpNavigationModern.ShowLanguageToggle, 40, 0) + 44
              )
            Width: =cmpNavigationModern.Width
            Y: =cmpNavigationModern.Height - Self.Height
          Children:
            - rectNavFooterRule:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        gblTheme.Mode = "Dark",
                        gblTheme.Dark.Colors.Border,
                        gblTheme.Light.Colors.Border
                    )
                  Height: =1
                  Width: =conNavFooter.Width
            - conNavUser:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =If(cmpNavigationModern.IsExpanded, 48, 36)
                  Visible: =cmpNavigationModern.ShowUser
                  Width: =conNavFooter.Width
                  Y: =10
                Children:
                  - shpNavAvatar:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.Primary,
                              gblTheme.Light.Colors.Primary
                          )
                        Height: =32
                        RadiusBottomLeft: =16
                        RadiusBottomRight: =16
                        RadiusTopLeft: =16
                        RadiusTopRight: =16
                        Width: =32
                        X: |-
                          =If(
                              cmpNavigationModern.IsExpanded,
                              If(gblLanguage = "Arabic", conNavUser.Width - 48, 16),
                              (conNavUser.Width - 32) / 2
                          )
                        Y: =If(cmpNavigationModern.IsExpanded, 8, 2)
                      Children:
                        - lblNavInitial:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderStyle: =BorderStyle.None
                              Color: |-
                                =If(
                                    gblTheme.Mode = "Dark",
                                    gblTheme.Dark.Colors.TextOnPrimary,
                                    gblTheme.Light.Colors.TextOnPrimary
                                )
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =32
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.Caption
                              Text: |-
                                =With(
                                    {
                                        n: If(
                                            IsBlank(gblUser.FullName),
                                            IfError(User().FullName, ""),
                                            gblUser.FullName
                                        )
                                    },
                                    With(
                                        {
                                            parts: Split(Coalesce(n, ""), " ")
                                        },
                                        Upper(Left(First(parts).Value, 1)) & If(
                                            CountRows(parts) > 1,
                                            Upper(Left(Last(parts).Value, 1)),
                                            ""
                                        )
                                    )
                                )
                              Width: =32
                  - lblNavUserName:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                        BorderStyle: =BorderStyle.None
                        Color: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.TextPrimary,
                              gblTheme.Light.Colors.TextPrimary
                          )
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Medium
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.BodySmall
                        Text: |-
                          =If(
                              IsBlank(gblUser.FullName),
                              IfError(User().FullName, ""),
                              gblUser.FullName
                          )
                        Tooltip: =Self.Text
                        Visible: =cmpNavigationModern.IsExpanded
                        Width: =conNavUser.Width - 64
                        Wrap: =false
                        X: =If(gblLanguage = "Arabic", 12, 56)
                        Y: =8
                  - lblNavUserRole:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblLanguage = "Arabic", Align.Right, Align.Left)
                        BorderStyle: =BorderStyle.None
                        Color: |-
                          =If(
                              gblTheme.Mode = "Dark",
                              gblTheme.Dark.Colors.TextMuted,
                              gblTheme.Light.Colors.TextMuted
                          )
                        Font: =gblTheme.Typography.FontFamily
                        Height: =16
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Caption
                        Text: =Coalesce(gblUser.Role, "")
                        Visible: |-
                          =And(
                              cmpNavigationModern.IsExpanded,
                              !IsBlank(gblUser.Role)
                          )
                        Width: =conNavUser.Width - 64
                        Wrap: =false
                        X: =If(gblLanguage = "Arabic", 12, 56)
                        Y: =26
            - btnNavSettings:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        gblLanguage = "Arabic",
                        "الإعدادات",
                        "Settings"
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Height: =36
                  Icon: ="Settings"
                  OnSelect: =cmpNavigationModern.OnFooterSettings()
                  Text: =""
                  Tooltip: |-
                    =If(
                        gblLanguage = "Arabic",
                        "الإعدادات",
                        "Settings"
                    )
                  Visible: =cmpNavigationModern.ShowFooterMenu
                  Width: =36
                  X: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", conNavFooter.Width - 52, 16),
                        (conNavFooter.Width - 36) / 2
                    )
                  Y: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        8 + If(cmpNavigationModern.ShowUser, 56, 0),
                        8 + If(cmpNavigationModern.ShowUser, 44, 0)
                    )
            - btnNavHelp:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        gblLanguage = "Arabic",
                        "المساعدة",
                        "Help"
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Height: =36
                  Icon: ="Info"
                  OnSelect: =cmpNavigationModern.OnHelp()
                  Text: =""
                  Tooltip: |-
                    =If(
                        gblLanguage = "Arabic",
                        "المساعدة",
                        "Help"
                    )
                  Visible: =cmpNavigationModern.ShowFooterMenu
                  Width: =36
                  X: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", 16, conNavFooter.Width - 52),
                        (conNavFooter.Width - 36) / 2
                    )
                  Y: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        8 + If(cmpNavigationModern.ShowUser, 56, 0),
                        8 + If(cmpNavigationModern.ShowUser, 44, 0) + 40
                    )
            - btnNavLanguage:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        gblLanguage = "Arabic",
                        "التبديل إلى الإنجليزية",
                        "Switch to Arabic"
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Height: =36
                  OnSelect: =cmpNavigationModern.OnLanguageToggle()
                  Text: =If(gblLanguage = "Arabic", "EN", "ع")
                  Tooltip: |-
                    =If(
                        gblLanguage = "Arabic",
                        "التبديل إلى الإنجليزية",
                        "Switch to Arabic"
                    )
                  Visible: =cmpNavigationModern.ShowLanguageToggle
                  Width: =If(cmpNavigationModern.IsExpanded, conNavFooter.Width - 24, 36)
                  X: =If(cmpNavigationModern.IsExpanded, 12, (conNavFooter.Width - 36) / 2)
                  Y: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        8 + If(cmpNavigationModern.ShowUser, 56, 0) + If(cmpNavigationModern.ShowFooterMenu, 40, 0),
                        8 + If(cmpNavigationModern.ShowUser, 44, 0) + If(cmpNavigationModern.ShowFooterMenu, 80, 0)
                    )
            - btnNavCollapse:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(
                            gblLanguage = "Arabic",
                            "طي القائمة",
                            "Collapse menu"
                        ),
                        If(
                            gblLanguage = "Arabic",
                            "توسيع القائمة",
                            "Expand menu"
                        )
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Height: =36
                  Icon: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(gblLanguage = "Arabic", "ChevronRight", "ChevronLeft"),
                        If(gblLanguage = "Arabic", "ChevronLeft", "ChevronRight")
                    )
                  OnSelect: =cmpNavigationModern.OnToggle()
                  Text: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(
                            gblLanguage = "Arabic",
                            "طي",
                            "Collapse"
                        ),
                        ""
                    )
                  Tooltip: |-
                    =If(
                        cmpNavigationModern.IsExpanded,
                        If(
                            gblLanguage = "Arabic",
                            "طي القائمة",
                            "Collapse menu"
                        ),
                        If(
                            gblLanguage = "Arabic",
                            "توسيع القائمة",
                            "Expand menu"
                        )
                    )
                  Width: =If(cmpNavigationModern.IsExpanded, conNavFooter.Width - 24, 36)
                  X: =If(cmpNavigationModern.IsExpanded, 12, (conNavFooter.Width - 36) / 2)
                  Y: =conNavFooter.Height - 44
