ComponentDefinitions:
  cmpAttachments:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CanUpload:
        PropertyKind: Input
        Description: Show the Add document button
        DataType: Boolean
        Default: =false
      FileCount:
        PropertyKind: Output
        Description: Number of files
        DataType: Number
      Files:
        PropertyKind: Input
        Description: Normalised rows {Title, Url, UploadedBy, Modified}. Host builds them from FinanceDoc / Attachments (see 02-components.md)
        DataType: Table
        Default: |-
          =Table(
              {Title: "Invoice 0012.pdf", Url: "https://hdpye.sharepoint.com/sites/ERPhdp", UploadedBy: "Finance Officer", Modified: Now()}
          )
      OnOpen:
        PropertyKind: Event
        Description: A file was opened (host may log it); Launch already happened
        ReturnType: None
        Default: =""
      OnUpload:
        PropertyKind: Event
        Description: 'Add document selected: host opens its upload form / flow'
        ReturnType: None
        Default: =""
      SelectedFile:
        PropertyKind: Output
        Description: File the user opened last
        DataType: Record
      UploadText:
        PropertyKind: Input
        Description: Upload button text
        DataType: Text
        Default: ="Add document"
    Properties:
      FileCount: =CountRows(cmpAttachments.Files)
      Height: =300
      SelectedFile: =galAttach.Selected
      Width: =420
    Children:
      - conAttRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =sp1
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conAttHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =touchMin
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =sp1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - lblAttHeading:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =FinTheme.Text
                        FillPortions: =1
                        Font: =fontBase
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Role: =TextRole.Heading3
                        Size: =fsSection
                        Text: =fnT("att.title", "Documents") & " (" & cmpAttachments.FileCount & ")"
                        Wrap: =false
                  - btnAttUpload:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =FinTheme.Border
                        BorderThickness: =1
                        Color: =FinTheme.Text
                        DisabledBorderColor: =FinTheme.Border
                        DisabledColor: =FinTheme.TextSecondary
                        DisabledFill: =FinTheme.Border
                        Fill: =FinTheme.Surface
                        FocusedBorderColor: =FinTheme.Focus
                        FocusedBorderThickness: =2
                        Font: =fontBase
                        Height: =touchMin
                        HoverBorderColor: =FinTheme.Primary
                        HoverColor: =FinTheme.Text
                        HoverFill: =FinTheme.RowHover
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =cmpAttachments.OnUpload()
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        PressedBorderColor: =FinTheme.Primary
                        PressedColor: =FinTheme.Text
                        PressedFill: =FinTheme.RowSelected
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Size: =fsBody
                        Text: =cmpAttachments.UploadText
                        Visible: =cmpAttachments.CanUpload
                        Width: =150
            - lblAttEmpty:
                Control: Label@2.5.1
                Properties:
                  Align: =alignStart
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =FinTheme.TextSecondary
                  Font: =fontBase
                  Height: =24
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =fsBody
                  Text: =fnT("att.empty", "No documents attached.")
                  Visible: =cmpAttachments.FileCount = 0
                  Wrap: =false
            - galAttach:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =fnT("att.title", "Documents")
                  DelayItemLoading: =false
                  ItemAccessibleLabel: =ThisItem.Title
                  Items: =cmpAttachments.Files
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  TemplatePadding: =0
                  TemplateSize: =Max(56, touchMin + 12)
                Children:
                  - icoAttType:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Color: =FinTheme.TextSecondary
                        FocusedBorderColor: =FinTheme.Focus
                        Height: =24
                        Icon: =If(EndsWith(Lower(ThisItem.Title), ".pdf"), Icon.DocumentPDF, Icon.Document)
                        Width: =24
                        X: =If(isRTL, Parent.TemplateWidth - 4 - Self.Width, 4)
                        Y: =(Parent.TemplateHeight - Self.Height) / 2
                  - lblAttName:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        Color: =FinTheme.Text
                        Font: =fontBase
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsBody
                        Text: =ThisItem.Title
                        Tooltip: =ThisItem.Title
                        Width: =Parent.TemplateWidth - 40 - 52
                        Wrap: =false
                        X: =If(isRTL, 52, 40)
                        Y: =6
                  - lblAttMeta:
                      Control: Label@2.5.1
                      Properties:
                        Align: =alignStart
                        Color: =FinTheme.TextSecondary
                        Font: =fontBase
                        Height: =18
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =fsCaption
                        Text: =Concat(Filter([ThisItem.UploadedBy, Text(ThisItem.Modified, "dd mmm yyyy", appLocale)], !IsBlank(Value)), Value, "  |  ")
                        Width: =Parent.TemplateWidth - 40 - 52
                        Wrap: =false
                        X: =If(isRTL, 52, 40)
                        Y: =28
                  - icoAttOpen:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: =fnT("att.open", "Open") & " " & ThisItem.Title
                        Color: =FinTheme.Primary
                        FocusedBorderColor: =FinTheme.Focus
                        Height: =44
                        HoverFill: =FinTheme.RowHover
                        Icon: =Icon.OpenInNewWindow
                        OnSelect: =Select(Parent); Launch(ThisItem.Url); cmpAttachments.OnOpen()
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        TabIndex: =0
                        Width: =44
                        X: =If(isRTL, 0, Parent.TemplateWidth - Self.Width)
                        Y: =(Parent.TemplateHeight - Self.Height) / 2
                  - rectAttDivider:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =FinTheme.Border
                        Height: =1
                        Width: =Parent.TemplateWidth
                        Y: =Parent.TemplateHeight - 1
