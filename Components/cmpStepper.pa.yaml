ComponentDefinitions:
  cmpStepper:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AccentColor:
        PropertyKind: Input
        DisplayName: AccentColor
        Description: Color for the active step, completed steps, and the filled bar.
        DataType: Color
        Default: =fxThemeColor("Primary")
      CheckIcon:
        PropertyKind: Input
        DisplayName: CheckIcon
        Description: Optional fxSvg name or data URI for a completed step. Blank shows a check mark.
        DataType: Text
        Default: =""
      ClickableSteps:
        PropertyKind: Input
        DisplayName: ClickableSteps
        Description: Completed allows finished steps. None allows none. All allows any step except the current one.
        DataType: Text
        Default: ="Completed"
      CurrentStep:
        PropertyKind: Input
        DisplayName: CurrentStep
        Description: Active step, starting at 1.
        DataType: Number
        Default: =1
      Density:
        PropertyKind: Input
        DisplayName: Density
        Description: Full shows labels. Compact and Minimal hide labels. Minimal also hides the connectors. Used when Type is Step.
        DataType: Text
        Default: ="Full"
      OnStepSelect:
        PropertyKind: Event
        DisplayName: OnStepSelect
        Description: Fires when a step is tapped. Read SelectedStep.
        ReturnType: None
        Default: =false
      SelectedStep:
        PropertyKind: Output
        DisplayName: SelectedStep
        Description: Step index last tapped.
        DataType: Number
      Size:
        PropertyKind: Input
        DisplayName: Size
        Description: Small, Medium, or Large.
        DataType: Text
        Default: ="Medium"
      StepLabels:
        PropertyKind: Input
        DisplayName: StepLabels
        Description: One {Label} row per step.
        DataType: Table
        Default: |-
          =Table(
              {Label: "Details"},
              {Label: "Items"},
              {Label: "Review"}
          )
      Theme:
        PropertyKind: Input
        DisplayName: Theme
        Description: Light or Dark. Leave it on the app theme unless this control should ignore gblTheme.Mode.
        DataType: Text
        Default: =gblTheme.Mode
      Type:
        PropertyKind: Input
        DisplayName: Type
        Description: Bar or Step.
        DataType: Text
        Default: ="Step"
    Properties:
      Fill: =Color.Transparent
      Height: |-
        =If(
            cmpStepper.Type = "Bar",
            Switch(cmpStepper.Size, "Small", 8, "Medium", 10, "Large", 12, 10),
            If(
                cmpStepper.Density = "Full",
                Switch(cmpStepper.Size, "Small", 56, "Medium", 68, "Large", 80, 68) + If(Sum(cmpStepper.StepLabels, If(Char(10) in Coalesce(Label, ""), 1, 0)) > 0, 40, 0),
                Switch(cmpStepper.Size, "Small", 28, "Medium", 36, "Large", 44, 36)
            )
        )
      OnReset: =Set(_stepSel, 0)
      SelectedStep: =If(IsBlank(_stepSel), 0, _stepSel)
      Width: =360
    Children:
      - galStBar:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderStyle: =BorderStyle.None
            DelayItemLoading: =false
            Fill: =Color.Transparent
            Height: =Parent.Height
            Items: =Sequence(Max(CountRows(cmpStepper.StepLabels), 1))
            LoadingSpinner: =LoadingSpinner.None
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =Parent.Width / Max(CountRows(cmpStepper.StepLabels), 1)
            Visible: =cmpStepper.Type = "Bar"
            Width: =Parent.Width
          Children:
            - cntStBar:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        fxThemeColor("Success"),
                        If(
                            ThisItem.Value = cmpStepper.CurrentStep,
                            cmpStepper.AccentColor,
                            fxThemeColor("Border")
                        )
                    )
                  Height: =Parent.TemplateHeight
                  RadiusBottomLeft: =gblTheme.Radius.Round
                  RadiusBottomRight: =gblTheme.Radius.Round
                  RadiusTopLeft: =gblTheme.Radius.Round
                  RadiusTopRight: =gblTheme.Radius.Round
                  Width: =Max(0, Parent.TemplateWidth - 4)
                  X: =2
                Children:
                  - btnStBar:
                      Control: ModernButton@1.0.0
                      Properties:
                        Appearance: =ButtonAppearance.Transparent
                        Height: =Parent.Height
                        OnSelect: |-
                          =If(
                              And(
                                  cmpStepper.ClickableSteps <> "None",
                                  ThisItem.Value <> cmpStepper.CurrentStep,
                                  Or(
                                      cmpStepper.ClickableSteps = "All",
                                      ThisItem.Value < cmpStepper.CurrentStep
                                  )
                              ),
                              Set(_stepSel, ThisItem.Value);
                              cmpStepper.OnStepSelect()
                          )
                        Text: =""
                        Width: =Parent.Width
      - galStSteps:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            BorderStyle: =BorderStyle.None
            DelayItemLoading: =false
            Fill: =Color.Transparent
            Height: =Parent.Height
            Items: =Sequence(Max(CountRows(cmpStepper.StepLabels), 1))
            LoadingSpinner: =LoadingSpinner.None
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =Parent.Width / Max(CountRows(cmpStepper.StepLabels), 1)
            Visible: =cmpStepper.Type = "Step"
            Width: =Parent.Width
          Children:
            - recStLeft:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.Value <= cmpStepper.CurrentStep,
                        fxThemeColor("Success"),
                        fxThemeColor("Border")
                    )
                  Height: =2
                  Visible: |-
                    =And(
                        ThisItem.Value > 1,
                        cmpStepper.Density <> "Minimal"
                    )
                  Width: |-
                    =Max(
                        0,
                        Parent.TemplateWidth / 2 - Switch(cmpStepper.Size, "Small", 11, "Medium", 14, "Large", 17, 14)
                    )
                  Y: |-
                    =Switch(
                        cmpStepper.Size,
                        "Small", If(cmpStepper.Density = "Full", 16, 12),
                        "Medium", If(cmpStepper.Density = "Full", 20, 16),
                        "Large", If(cmpStepper.Density = "Full", 24, 20),
                        If(cmpStepper.Density = "Full", 20, 16)
                    )
            - recStRight:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        fxThemeColor("Success"),
                        fxThemeColor("Border")
                    )
                  Height: =2
                  Visible: |-
                    =And(
                        ThisItem.Value < CountRows(cmpStepper.StepLabels),
                        cmpStepper.Density <> "Minimal"
                    )
                  Width: |-
                    =Max(
                        0,
                        Parent.TemplateWidth / 2 - Switch(cmpStepper.Size, "Small", 11, "Medium", 14, "Large", 17, 14)
                    )
                  X: =Parent.TemplateWidth / 2 + Switch(cmpStepper.Size, "Small", 11, "Medium", 14, "Large", 17, 14)
                  Y: |-
                    =Switch(
                        cmpStepper.Size,
                        "Small", If(cmpStepper.Density = "Full", 16, 12),
                        "Medium", If(cmpStepper.Density = "Full", 20, 16),
                        "Large", If(cmpStepper.Density = "Full", 24, 20),
                        If(cmpStepper.Density = "Full", 20, 16)
                    )
            - cntStCircle:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        fxThemeColor("Success"),
                        If(
                            ThisItem.Value = cmpStepper.CurrentStep,
                            cmpStepper.AccentColor,
                            fxThemeColor("Border")
                        )
                    )
                  BorderThickness: =2
                  DropShadow: =DropShadow.None
                  Fill: |-
                    =If(
                        ThisItem.Value < cmpStepper.CurrentStep,
                        fxThemeColor("Success"),
                        If(
                            ThisItem.Value = cmpStepper.CurrentStep,
                            fxThemeColor("PrimaryLight"),
                            fxThemeColor("Surface")
                        )
                    )
                  Height: =Switch(cmpStepper.Size, "Small", 22, "Medium", 28, "Large", 34, 28)
                  RadiusBottomLeft: =gblTheme.Radius.Round
                  RadiusBottomRight: =gblTheme.Radius.Round
                  RadiusTopLeft: =gblTheme.Radius.Round
                  RadiusTopRight: =gblTheme.Radius.Round
                  Width: =Switch(cmpStepper.Size, "Small", 22, "Medium", 28, "Large", 34, 28)
                  X: =(Parent.TemplateWidth - Self.Width) / 2
                  Y: |-
                    =Switch(
                        cmpStepper.Size,
                        "Small", If(cmpStepper.Density = "Full", 6, 2),
                        "Medium", If(cmpStepper.Density = "Full", 6, 4),
                        "Large", If(cmpStepper.Density = "Full", 8, 4),
                        If(cmpStepper.Density = "Full", 6, 4)
                    )
                Children:
                  - lblStNum:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: |-
                          =If(
                              ThisItem.Value = cmpStepper.CurrentStep,
                              cmpStepper.AccentColor,
                              fxThemeColor("TextMuted")
                          )
                        Visible: =ThisItem.Value >= cmpStepper.CurrentStep
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =Parent.Height
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =Switch(cmpStepper.Size, "Small", 10, "Medium", 12, "Large", 13, 12)
                        Text: =Text(ThisItem.Value)
                        Width: =Parent.Width
                        Wrap: =false
                  - imgStCheck:
                      Control: Image@2.2.3
                      Properties:
                        BorderStyle: =BorderStyle.None
                        Height: =Parent.Height * 0.55
                        Image: |-
                          =If(
                              StartsWith(Coalesce(cmpStepper.CheckIcon, ""), "data:"),
                              cmpStepper.CheckIcon,
                              fxSvg(If(IsBlank(cmpStepper.CheckIcon), "Check", cmpStepper.CheckIcon), "rgb(255,255,255)")
                          )
                        Visible: =ThisItem.Value < cmpStepper.CurrentStep
                        Width: =Self.Height
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =(Parent.Height - Self.Height) / 2
            - lblStName:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: |-
                    =If(
                        ThisItem.Value = cmpStepper.CurrentStep,
                        cmpStepper.AccentColor,
                        If(
                            ThisItem.Value < cmpStepper.CurrentStep,
                            fxThemeColor("TextPrimary"),
                            fxThemeColor("TextMuted")
                        )
                    )
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: |-
                    =If(
                        ThisItem.Value = cmpStepper.CurrentStep,
                        gblTheme.FontWeights.Medium,
                        gblTheme.FontWeights.Regular
                    )
                  Height: |-
                    =With(
                        {
                            txt: If(
                                CountRows(cmpStepper.StepLabels) >= ThisItem.Value,
                                Coalesce(Index(cmpStepper.StepLabels, ThisItem.Value).Label, ""),
                                ""
                            )
                        },
                        Max(18, CountRows(Split(txt, Char(10))) * Switch(cmpStepper.Size, "Small", 14, "Medium", 15, "Large", 16, 15))
                    )
                  PaddingBottom: =0
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =0
                  Size: =Switch(cmpStepper.Size, "Small", 10, "Medium", 11, "Large", 12, 11)
                  Text: |-
                    =If(
                        CountRows(cmpStepper.StepLabels) >= ThisItem.Value,
                        Index(cmpStepper.StepLabels, ThisItem.Value).Label,
                        ""
                    )
                  Tooltip: =Self.Text
                  Visible: =cmpStepper.Density = "Full"
                  Width: =Parent.TemplateWidth
                  Wrap: =true
                  Y: |-
                    =Switch(
                        cmpStepper.Size,
                        "Small", 32,
                        "Medium", 40,
                        "Large", 48,
                        40
                    )
            - btnStStep:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: |-
                    =If(
                        CountRows(cmpStepper.StepLabels) >= ThisItem.Value,
                        Index(cmpStepper.StepLabels, ThisItem.Value).Label,
                        Text(ThisItem.Value)
                    )
                  Appearance: =ButtonAppearance.Transparent
                  Height: =Switch(cmpStepper.Size, "Small", 22, "Medium", 28, "Large", 34, 28)
                  OnSelect: |-
                    =If(
                        And(
                            cmpStepper.ClickableSteps <> "None",
                            ThisItem.Value <> cmpStepper.CurrentStep,
                            Or(
                                cmpStepper.ClickableSteps = "All",
                                ThisItem.Value < cmpStepper.CurrentStep
                            )
                        ),
                        Set(_stepSel, ThisItem.Value);
                        cmpStepper.OnStepSelect()
                    )
                  Text: =""
                  Width: =Switch(cmpStepper.Size, "Small", 22, "Medium", 28, "Large", 34, 28)
                  X: =(Parent.TemplateWidth - Self.Width) / 2
                  Y: |-
                    =Switch(
                        cmpStepper.Size,
                        "Small", If(cmpStepper.Density = "Full", 6, 2),
                        "Medium", If(cmpStepper.Density = "Full", 6, 4),
                        "Large", If(cmpStepper.Density = "Full", 8, 4),
                        If(cmpStepper.Density = "Full", 6, 4)
                    )
