ComponentDefinitions:
  cmpQuickActions:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Action rows. Columns are ActionKey, Label, Icon, and Visible. Print, Send Email, Attach Document, and Add Comment are the default.
        DataType: Table
        Default: |-
          =Table(
              {
                  ActionKey: "Print",
                  Label: If(gblLanguage = "Arabic", "طباعة", "Print"),
                  Icon: "Print",
                  Visible: true
              },
              {
                  ActionKey: "SendEmail",
                  Label: If(gblLanguage = "Arabic", "إرسال بريد", "Send Email"),
                  Icon: "Mail",
                  Visible: true
              },
              {
                  ActionKey: "AttachDocument",
                  Label: If(gblLanguage = "Arabic", "إرفاق مستند", "Attach Document"),
                  Icon: "Paperclip",
                  Visible: true
              },
              {
                  ActionKey: "AddComment",
                  Label: If(gblLanguage = "Arabic", "إضافة تعليق", "Add Comment"),
                  Icon: "Message",
                  Visible: true
              }
          )
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Fires after the pressed row is stored in SelectedAction. Read SelectedAction.ActionKey.
        ReturnType: None
        Default: =false
      SelectedAction:
        PropertyKind: Output
        DisplayName: SelectedAction
        Description: Last pressed row. Columns match Items.
        DataType: Record
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Card heading.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "إجراءات سريعة", "Quick Actions")
    Properties:
      Height: =320
      OnReset: =Set(_qaOpen, false)
      SelectedAction: =_selQuickAction
      Width: =320
    Children:
      - conQaCard:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =fxThemeColor("Border")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =fxThemeColor("Surface")
            Height: =cmpQuickActions.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =gblTheme.Radius.XL
            RadiusBottomRight: =gblTheme.Radius.XL
            RadiusTopLeft: =gblTheme.Radius.XL
            RadiusTopRight: =gblTheme.Radius.XL
            Width: =cmpQuickActions.Width
          Children:
            - conQaHead:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =28
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =28
                  LayoutMinWidth: =0
                Children:
                  - imgQaHead:
                      Control: Image@2.2.3
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderStyle: =BorderStyle.None
                        Height: =16
                        Image: =fxSvg("List", fxThemeInk("Primary"))
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =16
                  - lblQaTitle:
                      Control: Label@2.5.1
                      Properties:
                        Align: =If(gblIsRTL, Align.Right, Align.Left)
                        AlignInContainer: =AlignInContainer.Center
                        BorderStyle: =BorderStyle.None
                        Color: =fxThemeColor("TextPrimary")
                        FillPortions: =1
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Medium
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =gblTheme.Typography.Caption
                        Text: =Coalesce(cmpQuickActions.Title, "")
                        Tooltip: =Self.Text
                        Wrap: =false
            - galQaActions:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =Coalesce(cmpQuickActions.Title, "")
                  DelayItemLoading: =false
                  Fill: =Color.Transparent
                  Height: |-
                    =With(
                        {
                            total: CountRows(Filter(cmpQuickActions.Items, Coalesce(Visible, true) = true)),
                            fit: Max(1, RoundDown((cmpQuickActions.Height - 92) / 48, 0))
                        },
                        If(
                            Or(Coalesce(_qaOpen, false), total <= fit),
                            total,
                            fit
                        ) * 48
                    )
                  Items: |-
                    =With(
                        {
                            rows: Filter(cmpQuickActions.Items, Coalesce(Visible, true) = true),
                            fit: Max(1, RoundDown((cmpQuickActions.Height - 92) / 48, 0))
                        },
                        If(
                            Or(Coalesce(_qaOpen, false), CountRows(rows) <= fit),
                            rows,
                            FirstN(rows, fit)
                        )
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplatePadding: =4
                  TemplateSize: =44
                  Width: =Parent.Width
                Children:
                  - conQaRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =galQaActions.TemplateHeight
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =12
                        PaddingRight: =12
                        RadiusBottomLeft: =gblTheme.Radius.Large
                        RadiusBottomRight: =gblTheme.Radius.Large
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Width: =galQaActions.TemplateWidth
                      Children:
                        - imgQaIcon:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: =Coalesce(ThisItem.Label, "")
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              Height: =16
                              Image: |-
                                =fxSvg(
                                    Coalesce(ThisItem.Icon, "Info"),
                                    fxThemeInk("Primary")
                                )
                              Width: =16
                        - lblQaLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              AlignInContainer: =AlignInContainer.Center
                              BorderStyle: =BorderStyle.None
                              Color: =fxThemeColor("TextPrimary")
                              FillPortions: =1
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =18
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.Caption
                              Text: =Coalesce(ThisItem.Label, "")
                              Wrap: =false
                  - btnQaHit:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: =Coalesce(ThisItem.Label, "")
                        Appearance: =ButtonAppearance.Transparent
                        Height: =galQaActions.TemplateHeight
                        OnSelect: |-
                          =Set(_selQuickAction, ThisItem);
                          cmpQuickActions.OnSelect()
                        Text: =""
                        Tooltip: =Coalesce(ThisItem.Label, "")
                        Width: =galQaActions.TemplateWidth
            - btnQaMore:
                Control: ModernButton@1.0.0
                Properties:
                  AccessibleLabel: =If(Coalesce(_qaOpen, false), If(gblLanguage = "Arabic", "عرض أقل", "Show less"), If(gblLanguage = "Arabic", "عرض الكل", "View all"))
                  AlignInContainer: =AlignInContainer.Center
                  Appearance: =ButtonAppearance.Transparent
                  Height: =28
                  LayoutMinHeight: =28
                  LayoutMinWidth: =72
                  OnSelect: =Set(_qaOpen, !Coalesce(_qaOpen, false))
                  Text: =If(Coalesce(_qaOpen, false), If(gblLanguage = "Arabic", "عرض أقل", "Show less"), If(gblLanguage = "Arabic", "عرض الكل", "View all"))
                  Visible: |-
                    =CountRows(Filter(cmpQuickActions.Items, Coalesce(Visible, true) = true)) > Max(1, RoundDown((cmpQuickActions.Height - 92) / 48, 0))
                  Width: =88
