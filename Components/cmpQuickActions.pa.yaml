ComponentDefinitions:
  cmpQuickActions:
    DefinitionType: CanvasComponent
    Description: Shared quick-action card for any module. Pass Items. The component does not send mail, print, attach, or post a comment. OnSelect tells the screen which row was pressed.
    AccessAppScope: true
    CustomProperties:
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Action rows. Columns are ActionKey, Label, Icon, and Visible. Print, Send Email, Attach Document, and Add Comment are the default.
        DataType: Table
        Default: |-
          =Table(
              {
                  ActionKey: "Print",
                  Label: If(gblLanguage = "Arabic", "طباعة", "Print"),
                  Icon: "Print",
                  Visible: true
              },
              {
                  ActionKey: "SendEmail",
                  Label: If(gblLanguage = "Arabic", "إرسال بريد", "Send Email"),
                  Icon: "Mail",
                  Visible: true
              },
              {
                  ActionKey: "AttachDocument",
                  Label: If(gblLanguage = "Arabic", "إرفاق مستند", "Attach Document"),
                  Icon: "Paperclip",
                  Visible: true
              },
              {
                  ActionKey: "AddComment",
                  Label: If(gblLanguage = "Arabic", "إضافة تعليق", "Add Comment"),
                  Icon: "Message",
                  Visible: true
              }
          )
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Fires after the pressed row is stored in SelectedAction. Read SelectedAction.ActionKey.
        ReturnType: None
        Default: =false
      SelectedAction:
        PropertyKind: Output
        DisplayName: SelectedAction
        Description: Last pressed row. Columns match Items.
        DataType: Record
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Card heading.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "إجراءات سريعة", "Quick Actions")
    Properties:
      Height: =280
      SelectedAction: =_selQuickAction
      Width: =320
    Children:
      - conQaCard:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =fxThemeColor("Border")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =fxThemeColor("Surface")
            Height: =cmpQuickActions.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            LayoutWrap: =false
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            RadiusBottomLeft: =gblTheme.Radius.XL
            RadiusBottomRight: =gblTheme.Radius.XL
            RadiusTopLeft: =gblTheme.Radius.XL
            RadiusTopRight: =gblTheme.Radius.XL
            Width: =cmpQuickActions.Width
          Children:
            - lblQaTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =If(gblIsRTL, Align.Right, Align.Left)
                  BorderStyle: =BorderStyle.None
                  Color: =fxThemeColor("TextPrimary")
                  FillPortions: =0
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Bold
                  Height: =28
                  LayoutMinHeight: =28
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =gblTheme.Typography.CardTitle
                  Text: =Coalesce(cmpQuickActions.Title, "")
                  Tooltip: =Self.Text
                  Width: =Parent.Width
                  Wrap: =false
            - galQaActions:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  AccessibleLabel: =Coalesce(cmpQuickActions.Title, "")
                  BorderThickness: =0
                  DelayItemLoading: =false
                  Fill: =Color.Transparent
                  FillPortions: =1
                  Height: =Max(52, cmpQuickActions.Height - 68)
                  Items: |-
                    =Filter(
                        cmpQuickActions.Items,
                        Coalesce(Visible, true) = true
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LoadingSpinner: =LoadingSpinner.None
                  ShowScrollbar: =false
                  TemplatePadding: =8
                  TemplateSize: =52
                  Width: =Parent.Width
                Children:
                  - conQaRow:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =fxThemeColor("Border")
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Surface")
                        Height: =Parent.TemplateHeight
                        RadiusBottomLeft: =gblTheme.Radius.XL
                        RadiusBottomRight: =gblTheme.Radius.XL
                        RadiusTopLeft: =gblTheme.Radius.XL
                        RadiusTopRight: =gblTheme.Radius.XL
                        Width: =Parent.TemplateWidth
                      Children:
                        - imgQaIcon:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: =Coalesce(ThisItem.Label, "")
                              BorderStyle: =BorderStyle.None
                              Height: =18
                              Image: |-
                                =fxSvg(
                                    Coalesce(ThisItem.Icon, "Info"),
                                    fxThemeInk("Text")
                                )
                              ImagePosition: =ImagePosition.Fit
                              Width: =18
                              X: =If(gblIsRTL, Parent.Width - 34, 16)
                              Y: =(Parent.Height - Self.Height) / 2
                        - lblQaLabel:
                            Control: Label@2.5.1
                            Properties:
                              Align: =If(gblIsRTL, Align.Right, Align.Left)
                              BorderStyle: =BorderStyle.None
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =Parent.Height
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblTheme.Typography.Body
                              Text: =Coalesce(ThisItem.Label, "")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =If(gblIsRTL, 16, 44)
                              Y: =0
                        - btnQaHit:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: =Coalesce(ThisItem.Label, "")
                              Appearance: =ButtonAppearance.Transparent
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(_selQuickAction, ThisItem);
                                cmpQuickActions.OnSelect()
                              Text: =""
                              Tooltip: =Coalesce(ThisItem.Label, "")
                              Visible: =true
                              Width: =Parent.Width
                              X: =0
                              Y: =0
