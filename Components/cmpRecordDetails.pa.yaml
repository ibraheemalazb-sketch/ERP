                                    hWhen: If(IsBlank(LookUp(cmpRecordDetails.Items, Dimension = "When")), 0, 40 + Max(20, RoundUp(Len(Coalesce(LookUp(cmpRecordDetails.Items, Dimension = "When").Value, "—")) / Max(8, (cardW - 64) / 6.6), 0) * 18)),
                                    hWho: If(IsBlank(LookUp(cmpRecordDetails.Items, Dimension = "Who")), 0, 40 + Max(20, RoundUp(Len(Coalesce(LookUp(cmpRecordDetails.Items, Dimension = "Who").Value, "—")) / Max(8, (cardW - 64) / 6.6), 0) * 18)),
                                    hWhom: If(IsBlank(LookUp(cmpRecordDetails.Items, Dimension = "Whom")), 0, 40 + Max(20, RoundUp(Len(Coalesce(LookUp(cmpRecordDetails.Items, Dimension = "Whom").Value, "—")) / Max(8, (cardW - 64) / 6.6), 0) * 18)),
