          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =cmpRecordDetails.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            Width: =cmpRecordDetails.Width
          Children:
            - lblRdTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Medium
                  Height: =28
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =Coalesce(cmpRecordDetails.Title, "")
                  Visible: =Len(Trim(Coalesce(cmpRecordDetails.Title, ""))) > 0
                  Width: =Parent.Width
                  Wrap: =false
            - conRdFacts:
