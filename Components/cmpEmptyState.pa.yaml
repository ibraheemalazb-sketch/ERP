ComponentDefinitions:
  cmpEmptyState:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ActionText:
        PropertyKind: Input
        Description: Button text, e.g. Retry. Blank hides the button
        DataType: Text
        Default: =""
      Message:
        PropertyKind: Input
        Description: Optional message (default depends on Variant)
        DataType: Text
        Default: =""
      OnAction:
        PropertyKind: Event
        Description: Raised by the button (Retry / Clear filters / Create)
        ReturnType: None
        Default: =""
      Title:
        PropertyKind: Input
        Description: Optional title (default depends on Variant)
        DataType: Text
        Default: =""
      Variant:
        PropertyKind: Input
        Description: empty | nosearch | error | noaccess | offline
        DataType: Text
        Default: ="empty"
    Properties:
      Height: =280
      Width: =480
    Children:
      - conEmptyRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =sp1
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =sp3
            PaddingLeft: =sp3
            PaddingRight: =sp3
            PaddingTop: =sp3
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - icoEmpty:
                Control: Classic/Icon@2.5.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  Color: =If(cmpEmptyState.Variant = "error", FinTheme.DangerText, FinTheme.TextSecondary)
                  FocusedBorderColor: =FinTheme.Focus
                  Height: =48
                  Icon: =Switch(cmpEmptyState.Variant, "error", Icon.GlobeError, "noaccess", Icon.Lock, "nosearch", Icon.Search, "offline", Icon.GlobeNotConnected, Icon.ListScrollEmpty)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =48
            - lblEmptyTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =FinTheme.Text
                  Font: =fontBase
                  FontWeight: =FontWeight.Semibold
                  Height: =28
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Live: =Live.Polite
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Role: =TextRole.Heading2
                  Size: =fsSection
                  Text: |-
                    =Coalesce(
                        cmpEmptyState.Title,
                        Switch(
                            cmpEmptyState.Variant,
                            "error", fnT("empty.errorTitle", "Something went wrong"),
                            "noaccess", fnT("empty.noAccessTitle", "You don't have access"),
                            "nosearch", fnT("empty.noResultsTitle", "No matching results"),
                            "offline", fnT("empty.offlineTitle", "You're offline"),
                            fnT("empty.title", "Nothing here yet")
                        )
                    )
            - lblEmptyMessage:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AlignInContainer: =AlignInContainer.Stretch
                  Color: =FinTheme.TextSecondary
                  Font: =fontBase
                  Height: =44
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =fsBody
                  Text: |-
                    =Coalesce(
                        cmpEmptyState.Message,
                        Switch(
                            cmpEmptyState.Variant,
                            "error", fnT("empty.errorMsg", "We couldn't load this data. Check your connection and try again."),
                            "noaccess", fnT("empty.noAccessMsg", "Ask your finance manager if you need access to this area."),
                            "nosearch", fnT("empty.noResultsMsg", "Try another search or clear the filters."),
                            "offline", fnT("empty.offlineMsg", "Reconnect to load the latest figures."),
                            fnT("empty.msg", "There are no records for the current selection.")
                        )
                    )
            - btnEmptyAction:
                Control: Classic/Button@2.2.0
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  BorderColor: =FinTheme.Border
                  BorderThickness: =1
                  Color: =FinTheme.Text
                  DisabledBorderColor: =FinTheme.Border
                  DisabledColor: =FinTheme.TextSecondary
                  DisabledFill: =FinTheme.Border
                  Fill: =FinTheme.Surface
                  FocusedBorderColor: =FinTheme.Focus
                  FocusedBorderThickness: =2
                  Font: =fontBase
                  Height: =touchMin
                  HoverBorderColor: =FinTheme.Primary
                  HoverColor: =FinTheme.Text
                  HoverFill: =FinTheme.RowHover
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =cmpEmptyState.OnAction()
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  PressedBorderColor: =FinTheme.Primary
                  PressedColor: =FinTheme.Text
                  PressedFill: =FinTheme.RowSelected
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Size: =fsBody
                  Text: =cmpEmptyState.ActionText
                  Visible: =!IsBlank(cmpEmptyState.ActionText)
