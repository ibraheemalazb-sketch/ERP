ComponentDefinitions:
  cmpProList:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      EmptyMessage:
        PropertyKind: Input
        DisplayName: Empty Message
        Description: Text shown when Items has no rows.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "لا توجد سجلات", "No records")
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Rows to show. Required columns are ID, Title, Subtitle, Icon, Tone, Status, and Progress. Progress below 0 hides the bar. Icon is an fxSvg name. Tone is a word such as success, warning, danger, info, or muted.
        DataType: Table
        Default: |-
          =Table(
              {ID: 1, Title: If(gblLanguage = "Arabic", "عنصر", "Item"), Subtitle: If(gblLanguage = "Arabic", "تفاصيل", "Details"), Icon: "File", Tone: "info", Status: If(gblLanguage = "Arabic", "نشط", "Active"), Progress: 40}
          )
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: Fires after a row is chosen. Read SelectedItem inside this action.
        ReturnType: None
        Default: =false
      RowHeight:
        PropertyKind: Input
        DisplayName: Row Height
        Description: Height of one row.
        DataType: Number
        Default: =76
      SelectedItem:
        PropertyKind: Output
        DisplayName: Selected Item
        Description: Last row the user chose.
        DataType: Record
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Optional heading above the rows. Blank hides it.
        DataType: Text
        Default: =""
    Properties:
      Fill: =Color.Transparent
      Height: =320
      OnReset: |-
        =Set(
            _proSel,
            {ID: 0, Title: "", Subtitle: "", Icon: "File", Tone: "muted", Status: "", Progress: -1}
        )
      SelectedItem: |-
        =If(
            IsBlank(_proSel),
            {ID: 0, Title: "", Subtitle: "", Icon: "File", Tone: "muted", Status: "", Progress: -1},
            _proSel
        )
      Width: =360
    Children:
      - conProList:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =cmpProList.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =6
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =cmpProList.Width
          Children:
            - lblProTitle:
                Control: ModernText@1.0.0
                Properties:
                  Color: =fxThemeColor("TextPrimary")
                  Font: =gblTheme.Typography.FontFamily
                  FontWeight: =gblTheme.FontWeights.Medium
                  Height: =22
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =13
                  Text: =Coalesce(cmpProList.Title, "")
                  Visible: =Len(Trim(Coalesce(cmpProList.Title, ""))) > 0
                  Width: =Parent.Width
            - lblProEmpty:
                Control: ModernText@1.0.0
                Properties:
                  Color: =fxThemeColor("TextMuted")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =12
                  Text: =Coalesce(cmpProList.EmptyMessage, "")
                  Visible: =CountRows(cmpProList.Items) = 0
                  Width: =Parent.Width
            - galProList:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  Fill: =Color.Transparent
                  FillPortions: =1
                  Items: =cmpProList.Items
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =true
                  TemplatePadding: =6
                  TemplateSize: =Max(64, Coalesce(cmpProList.RowHeight, 76))
                  Visible: =CountRows(cmpProList.Items) > 0
                  Width: =Parent.Width
                Children:
                  - conProRow:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =If(ThisItem.ID = cmpProList.SelectedItem.ID, fxThemeColor("Primary"), fxThemeColor("Border"))
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =If(ThisItem.ID = cmpProList.SelectedItem.ID, fxThemeColor("PrimaryLight"), fxThemeColor("Surface"))
                        Height: =Parent.TemplateHeight - 6
                        RadiusBottomLeft: =gblTheme.Radius.Large
                        RadiusBottomRight: =gblTheme.Radius.Large
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Width: =Parent.TemplateWidth
                      Children:
                        - conProIcon:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxToneFill(ThisItem.Tone)
                              Height: =36
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              Width: =36
                              X: =10
                              Y: =10
                            Children:
                              - imgProIcon:
                                  Control: Image@2.2.3
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =18
                                    Image: |-
                                      =fxSvg(
                                          Coalesce(ThisItem.Icon, "File"),
                                          Switch(
                                              Lower(Coalesce(ThisItem.Tone, "muted")),
                                              "success", "rgb(22,163,74)",
                                              "completed", "rgb(22,163,74)",
                                              "low", "rgb(22,163,74)",
                                              "warning", "rgb(217,119,6)",
                                              "pending", "rgb(217,119,6)",
                                              "medium", "rgb(217,119,6)",
                                              "danger", "rgb(220,38,38)",
                                              "high", "rgb(220,38,38)",
                                              "error", "rgb(220,38,38)",
                                              "info", "rgb(37,99,235)",
                                              fxThemeInk("Primary")
                                          )
                                      )
                                    Width: =18
                                    X: =9
                                    Y: =9
                        - lblProRowTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =20
                              Size: =13
                              Text: =Coalesce(ThisItem.Title, "")
                              Width: =Parent.Width - If(Len(Trim(Coalesce(ThisItem.Status, ""))) > 0, 130, 64)
                              X: =54
                              Y: =8
                        - lblProStatus:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =fxToneInk(ThisItem.Tone)
                              Fill: =fxToneFill(ThisItem.Tone)
                              Font: =gblTheme.Typography.FontFamily
                              Height: =22
                              RadiusBottomLeft: =gblTheme.Radius.Round
                              RadiusBottomRight: =gblTheme.Radius.Round
                              RadiusTopLeft: =gblTheme.Radius.Round
                              RadiusTopRight: =gblTheme.Radius.Round
                              Size: =10
                              Text: =Coalesce(ThisItem.Status, "")
                              Visible: =Len(Trim(Coalesce(ThisItem.Status, ""))) > 0
                              Width: =96
                              X: =Parent.Width - 106
                              Y: =8
                        - lblProSubtitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =fxThemeColor("TextSecondary")
                              Font: =gblTheme.Typography.FontFamily
                              Height: =18
                              Size: =11
                              Text: =Coalesce(ThisItem.Subtitle, "")
                              Width: =Parent.Width - 64
                              X: =54
                              Y: =28
                        - recProTrack:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =fxThemeColor("Border")
                              Height: =4
                              Visible: =Coalesce(ThisItem.Progress, -1) >= 0
                              Width: =Parent.Width - 64
                              X: =54
                              Y: =52
                        - recProFill:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =fxToneInk(ThisItem.Tone)
                              Height: =4
                              Visible: =Coalesce(ThisItem.Progress, -1) >= 0
                              Width: =(Parent.Width - 64) * Min(Max(Coalesce(ThisItem.Progress, 0), 0), 100) / 100
                              X: =54
                              Y: =52
                        - btnProSelect:
                            Control: ModernButton@1.0.0
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              Height: =Parent.Height
                              OnSelect: |-
                                =Set(_proSel, ThisItem);
                                cmpProList.OnSelect()
                              Text: =""
                              Width: =Parent.Width
                              X: =0
                              Y: =0
