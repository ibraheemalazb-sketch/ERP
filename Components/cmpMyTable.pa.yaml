ComponentDefinitions:
  cmpMyTable:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CardHeight:
        PropertyKind: Input
        DisplayName: CardHeight
        Description: Height of one card.
        DataType: Number
        Default: =230
      ContextMenuItems:
        PropertyKind: Input
        DisplayName: ContextMenuItems
        Description: Menu rows. Required columns are ItemKey, ItemDisplayName, and ItemVisible.
        DataType: Table
        Default: |-
          =Table(
              {ItemKey: "view", ItemDisplayName: If(gblIsArabic, "عرض", "View"), ItemVisible: true},
              {ItemKey: "edit", ItemDisplayName: If(gblIsArabic, "تعديل", "Edit"), ItemVisible: true},
              {ItemKey: "delete", ItemDisplayName: If(gblIsArabic, "حذف", "Delete"), ItemVisible: true}
          )
      EmptySubtitle:
        PropertyKind: Input
        DisplayName: EmptySubtitle
        Description: Second line of the empty state.
        DataType: Text
        Default: =If(gblIsArabic, "جرّب تغيير البحث أو عوامل التصفية", "Try a different search or filter")
      EmptyTitle:
        PropertyKind: Input
        DisplayName: EmptyTitle
        Description: First line of the empty state.
        DataType: Text
        Default: =If(gblIsArabic, "لا توجد سجلات", "No records")
      EnableHover:
        PropertyKind: Input
        DisplayName: EnableHover
        Description: Show a hover wash on table rows.
        DataType: Boolean
        Default: =true
      EnableMenu:
        PropertyKind: Input
        DisplayName: EnableMenu
        Description: Show the row menu in table and card view.
        DataType: Boolean
        Default: =true
      HeaderAction:
        PropertyKind: Input
        DisplayName: HeaderAction
        Description: Header for the action column.
        DataType: Text
        Default: =If(gblIsArabic, "إجراء", "Actions")
      HeaderColumn1:
        PropertyKind: Input
        DisplayName: HeaderColumn1
        Description: Header for the first extra column.
        DataType: Text
        Default: =If(gblIsArabic, "العمود 1", "Column 1")
      HeaderColumn2:
        PropertyKind: Input
        DisplayName: HeaderColumn2
        Description: Header for the second extra column.
        DataType: Text
        Default: =If(gblIsArabic, "العمود 2", "Column 2")
      HeaderColumn3:
        PropertyKind: Input
        DisplayName: HeaderColumn3
        Description: Header for the third extra column.
        DataType: Text
        Default: =If(gblIsArabic, "العمود 3", "Column 3")
      HeaderHeight:
        PropertyKind: Input
        DisplayName: HeaderHeight
        Description: Table header height.
        DataType: Number
        Default: =44
      HeaderId:
        PropertyKind: Input
        DisplayName: HeaderId
        Description: Header for the id column.
        DataType: Text
        Default: ="ID"
      HeaderPerson:
        PropertyKind: Input
        DisplayName: HeaderPerson
        Description: Header for the person column.
        DataType: Text
        Default: =If(gblIsArabic, "الشخص", "Person")
      HeaderPriority:
        PropertyKind: Input
        DisplayName: HeaderPriority
        Description: Header for the priority column.
        DataType: Text
        Default: =If(gblIsArabic, "الأولوية", "Priority")
      HeaderProgress:
        PropertyKind: Input
        DisplayName: HeaderProgress
        Description: Header for the progress column.
        DataType: Text
        Default: =If(gblIsArabic, "التقدم", "Progress")
      HeaderStatus:
        PropertyKind: Input
        DisplayName: HeaderStatus
        Description: Header for the status column.
        DataType: Text
        Default: =If(gblIsArabic, "الحالة", "Status")
      HeaderSubtitle:
        PropertyKind: Input
        DisplayName: HeaderSubtitle
        Description: Header for the subtitle column.
        DataType: Text
        Default: =If(gblIsArabic, "المرجع", "Reference")
      HeaderTitle:
        PropertyKind: Input
        DisplayName: HeaderTitle
        Description: Header for the title column.
        DataType: Text
        Default: =If(gblIsArabic, "العنوان", "Title")
      HeaderWhen:
        PropertyKind: Input
        DisplayName: HeaderWhen
        Description: Header for the date column.
        DataType: Text
        Default: =If(gblIsArabic, "التاريخ", "Date")
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: Rows already in memory. Every row needs RowKey, Title, Subtitle, Column1, Column2, Column3, Status, Tone, Priority, PriorityTone, Person, WhenText, ProgressDone, ProgressTotal, and IconName.
        DataType: Table
        Default: |-
          =Table(
              {RowKey: "1", Title: "VNS Upgrade Project", Subtitle: "C-2026-001", Column1: "", Column2: "", Column3: "", Status: "In Progress", Tone: "In Progress", Priority: "High", PriorityTone: "High", Person: "Rodas Yonass", WhenText: "15 Jan 2026", ProgressDone: 2, ProgressTotal: 4, IconName: "FileText"},
              {RowKey: "2", Title: "Budget Review Q1", Subtitle: "C-2026-002", Column1: "", Column2: "", Column3: "", Status: "Pending", Tone: "Pending", Priority: "Medium", PriorityTone: "Medium", Person: "Sarah Johnson", WhenText: "12 Jan 2026", ProgressDone: 3, ProgressTotal: 5, IconName: "Receipt"},
              {RowKey: "3", Title: "Network Security Audit", Subtitle: "C-2025-093", Column1: "", Column2: "", Column3: "", Status: "Not Started", Tone: "Not Started", Priority: "Low", PriorityTone: "Low", Person: "Emily Parker", WhenText: "20 Feb 2026", ProgressDone: 0, ProgressTotal: 3, IconName: "Shield"}
          )
      OnMenuItemSelect:
        PropertyKind: Event
        DisplayName: OnMenuItemSelect
        Description: Runs after a menu row is chosen. Read SelectedMenuItem and SelectedItem.
        ReturnType: None
        Default: =false
      OnRowSelect:
        PropertyKind: Event
        DisplayName: OnRowSelect
        Description: Runs after a row is chosen. Read SelectedItem.RowKey and look up the real record on the screen.
        ReturnType: None
        Default: =false
      OnViewChange:
        PropertyKind: Event
        DisplayName: OnViewChange
        Description: Runs after the view toggle. Read SelectedViewMode.
        ReturnType: None
        Default: =false
      PersonAsAvatar:
        PropertyKind: Input
        DisplayName: PersonAsAvatar
        Description: Show initials in a circle before the person name.
        DataType: Boolean
        Default: =false
      RowHeight:
        PropertyKind: Input
        DisplayName: RowHeight
        Description: Table row height.
        DataType: Number
        Default: =52
      SelectedItem:
        PropertyKind: Output
        DisplayName: SelectedItem
        Description: Row chosen by the last click or menu.
        DataType: Record
      SelectedMenuItem:
        PropertyKind: Output
        DisplayName: SelectedMenuItem
        Description: Menu row chosen by the last menu click.
        DataType: Record
      SelectedViewMode:
        PropertyKind: Output
        DisplayName: SelectedViewMode
        Description: table, card, or list.
        DataType: Text
      ShowAction:
        PropertyKind: Input
        DisplayName: ShowAction
        Description: Show the eye action at the end of the row.
        DataType: Boolean
        Default: =false
      ShowColumn1:
        PropertyKind: Input
        DisplayName: ShowColumn1
        Description: Show the first extra text column.
        DataType: Boolean
        Default: =false
      ShowColumn2:
        PropertyKind: Input
        DisplayName: ShowColumn2
        Description: Show the second extra text column.
        DataType: Boolean
        Default: =false
      ShowColumn3:
        PropertyKind: Input
        DisplayName: ShowColumn3
        Description: Show the third extra text column.
        DataType: Boolean
        Default: =false
      ShowHeader:
        PropertyKind: Input
        DisplayName: ShowHeader
        Description: Show the table header.
        DataType: Boolean
        Default: =true
      ShowId:
        PropertyKind: Input
        DisplayName: ShowId
        Description: Show the id column from RowKey.
        DataType: Boolean
        Default: =false
      ShowPerson:
        PropertyKind: Input
        DisplayName: ShowPerson
        Description: Show the person column.
        DataType: Boolean
        Default: =true
      ShowPriority:
        PropertyKind: Input
        DisplayName: ShowPriority
        Description: Show the priority column.
        DataType: Boolean
        Default: =true
      ShowProgress:
        PropertyKind: Input
        DisplayName: ShowProgress
        Description: Show the progress column. Pass ProgressDone and ProgressTotal on each row.
        DataType: Boolean
        Default: =false
      ShowStatus:
        PropertyKind: Input
        DisplayName: ShowStatus
        Description: Show the status column.
        DataType: Boolean
        Default: =true
      ShowSubtitle:
        PropertyKind: Input
        DisplayName: ShowSubtitle
        Description: Show the subtitle column.
        DataType: Boolean
        Default: =true
      ShowViewToggle:
        PropertyKind: Input
        DisplayName: ShowViewToggle
        Description: Show the table, card, and list switch.
        DataType: Boolean
        Default: =true
      ShowWhen:
        PropertyKind: Input
        DisplayName: ShowWhen
        Description: Show the date column.
        DataType: Boolean
        Default: =true
      SubtitleAsPill:
        PropertyKind: Input
        DisplayName: SubtitleAsPill
        Description: Draw the subtitle as a tone chip. The chip color follows Tone.
        DataType: Boolean
        Default: =false
      TitleBold:
        PropertyKind: Input
        DisplayName: TitleBold
        Description: Use semibold for the title column.
        DataType: Boolean
        Default: =true
      ViewMode:
        PropertyKind: Input
        DisplayName: ViewMode
        Description: Starting view. table, card, or list. The screen copies SelectedViewMode back into this input.
        DataType: Text
        Default: ="table"
      WidthAction:
        PropertyKind: Input
        DisplayName: WidthAction
        Description: Width of the action column.
        DataType: Number
        Default: =72
      WidthColumn1:
        PropertyKind: Input
        DisplayName: WidthColumn1
        Description: Width of the first extra column.
        DataType: Number
        Default: =140
      WidthColumn2:
        PropertyKind: Input
        DisplayName: WidthColumn2
        Description: Width of the second extra column.
        DataType: Number
        Default: =140
      WidthColumn3:
        PropertyKind: Input
        DisplayName: WidthColumn3
        Description: Width of the third extra column.
        DataType: Number
        Default: =160
      WidthId:
        PropertyKind: Input
        DisplayName: WidthId
        Description: Width of the id column.
        DataType: Number
        Default: =64
      WidthPerson:
        PropertyKind: Input
        DisplayName: WidthPerson
        Description: Width of the person column.
        DataType: Number
        Default: =150
      WidthPriority:
        PropertyKind: Input
        DisplayName: WidthPriority
        Description: Width of the priority column.
        DataType: Number
        Default: =110
      WidthProgress:
        PropertyKind: Input
        DisplayName: WidthProgress
        Description: Width of the progress column.
        DataType: Number
        Default: =160
      WidthStatus:
        PropertyKind: Input
        DisplayName: WidthStatus
        Description: Width of the status column.
        DataType: Number
        Default: =120
      WidthSubtitle:
        PropertyKind: Input
        DisplayName: WidthSubtitle
        Description: Width of the subtitle column.
        DataType: Number
        Default: =140
      WidthTitle:
        PropertyKind: Input
        DisplayName: WidthTitle
        Description: Minimum width of the title column. The title grows when the table is wider.
        DataType: Number
        Default: =220
      WidthWhen:
        PropertyKind: Input
        DisplayName: WidthWhen
        Description: Width of the date column.
        DataType: Number
        Default: =120
    Properties:
      OnReset: |-
        =Set(varMyTableView, Coalesce(cmpMyTable.ViewMode, "table"));
        Set(varMyTableSelected, Blank());
        Set(varMyTableMenu, Blank())
      SelectedItem: =varMyTableSelected
      SelectedMenuItem: =varMyTableMenu
      SelectedViewMode: =Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table")))
      Width: =App.Width
    Children:
      - conMyTableToggle:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =fxThemeColor("SurfaceHover")
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =2
            PaddingBottom: =2
            PaddingLeft: =2
            PaddingRight: =2
            PaddingTop: =2
            RadiusBottomLeft: =gblTheme.Radius.Large
            RadiusBottomRight: =gblTheme.Radius.Large
            RadiusTopLeft: =gblTheme.Radius.Large
            RadiusTopRight: =gblTheme.Radius.Large
            Visible: =cmpMyTable.ShowViewToggle
            Width: =300
            X: =If(gblIsRTL, gblTheme.Spacing.LG, cmpMyTable.Width - Self.Width - gblTheme.Spacing.LG)
            Y: =8
          Children:
            - conMyTableToggleTable:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Fill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table", fxThemeColor("Surface"), fxThemeColor("Transparent"))
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                Children:
                  - imgMyTableToggleTable:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =If(gblIsArabic, "جدول", "Table")
                        BorderStyle: =BorderStyle.None
                        Height: =16
                        Image: =fxSvg("Grid", If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table", fxThemeInk("Primary"), fxThemeInk("Muted")), "")
                        Width: =16
                        X: =12
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblMyTableToggleTable:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table", fxThemeColor("Primary"), fxThemeColor("TextMuted"))
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table", gblTheme.FontWeights.Medium, gblTheme.FontWeights.Regular)
                        Height: =20
                        Size: =gblTheme.Typography.BodySmall
                        Text: =If(gblIsArabic, "جدول", "Table")
                        Width: =Parent.Width - 40
                        X: =32
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnMyTableToggleTable:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =fxThemeColor("Transparent")
                        BorderStyle: =BorderStyle.None
                        Fill: =fxThemeColor("Transparent")
                        Height: =Parent.Height
                        HoverFill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table", fxThemeColor("Transparent"), RGBA(0, 0, 0, 0.04))
                        OnSelect: |-
                          =Set(varMyTableView, "table");
                          cmpMyTable.OnViewChange()
                        PressedFill: =RGBA(0, 0, 0, 0.06)
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Text: =""
                        Width: =Parent.Width
            - conMyTableToggleCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Fill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "card", fxThemeColor("Surface"), fxThemeColor("Transparent"))
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                Children:
                  - imgMyTableToggleCard:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =If(gblIsArabic, "بطاقة", "Card")
                        BorderStyle: =BorderStyle.None
                        Height: =16
                        Image: =fxSvg("Dashboard", If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "card", fxThemeInk("Primary"), fxThemeInk("Muted")), "")
                        Width: =16
                        X: =12
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblMyTableToggleCard:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "card", fxThemeColor("Primary"), fxThemeColor("TextMuted"))
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "card", gblTheme.FontWeights.Medium, gblTheme.FontWeights.Regular)
                        Height: =20
                        Size: =gblTheme.Typography.BodySmall
                        Text: =If(gblIsArabic, "بطاقة", "Card")
                        Width: =Parent.Width - 40
                        X: =32
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnMyTableToggleCard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =fxThemeColor("Transparent")
                        BorderStyle: =BorderStyle.None
                        Fill: =fxThemeColor("Transparent")
                        Height: =Parent.Height
                        HoverFill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "card", fxThemeColor("Transparent"), RGBA(0, 0, 0, 0.04))
                        OnSelect: |-
                          =Set(varMyTableView, "card");
                          cmpMyTable.OnViewChange()
                        PressedFill: =RGBA(0, 0, 0, 0.06)
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Text: =""
                        Width: =Parent.Width
            - conMyTableToggleList:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.None
                  Fill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "list", fxThemeColor("Surface"), fxThemeColor("Transparent"))
                  Height: =36
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  RadiusBottomLeft: =gblTheme.Radius.Medium
                  RadiusBottomRight: =gblTheme.Radius.Medium
                  RadiusTopLeft: =gblTheme.Radius.Medium
                  RadiusTopRight: =gblTheme.Radius.Medium
                Children:
                  - imgMyTableToggleList:
                      Control: Image@2.2.3
                      Properties:
                        AccessibleLabel: =If(gblIsArabic, "قائمة", "List")
                        BorderStyle: =BorderStyle.None
                        Height: =16
                        Image: =fxSvg("List", If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "list", fxThemeInk("Primary"), fxThemeInk("Muted")), "")
                        Width: =16
                        X: =12
                        Y: =(Parent.Height - Self.Height) / 2
                  - lblMyTableToggleList:
                      Control: Label@2.5.1
                      Properties:
                        Color: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "list", fxThemeColor("Primary"), fxThemeColor("TextMuted"))
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "list", gblTheme.FontWeights.Medium, gblTheme.FontWeights.Regular)
                        Height: =20
                        Size: =gblTheme.Typography.BodySmall
                        Text: =If(gblIsArabic, "قائمة", "List")
                        Width: =Parent.Width - 40
                        X: =32
                        Y: =(Parent.Height - Self.Height) / 2
                  - btnMyTableToggleList:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =fxThemeColor("Transparent")
                        BorderStyle: =BorderStyle.None
                        Fill: =fxThemeColor("Transparent")
                        Height: =Parent.Height
                        HoverFill: =If(Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "list", fxThemeColor("Transparent"), RGBA(0, 0, 0, 0.04))
                        OnSelect: |-
                          =Set(varMyTableView, "list");
                          cmpMyTable.OnViewChange()
                        PressedFill: =RGBA(0, 0, 0, 0.06)
                        RadiusBottomLeft: =gblTheme.Radius.Medium
                        RadiusBottomRight: =gblTheme.Radius.Medium
                        RadiusTopLeft: =gblTheme.Radius.Medium
                        RadiusTopRight: =gblTheme.Radius.Medium
                        Text: =""
                        Width: =Parent.Width
      - conMyTableTable:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderColor: =fxThemeColor("Border")
            BorderThickness: =1
            DropShadow: =DropShadow.None
            Fill: =fxThemeColor("Surface")
            Height: =cmpMyTable.Height - If(cmpMyTable.ShowViewToggle, 56, 0)
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutOverflowX: =LayoutOverflow.Scroll
            RadiusBottomLeft: =gblTheme.Radius.Large
            RadiusBottomRight: =gblTheme.Radius.Large
            RadiusTopLeft: =gblTheme.Radius.Large
            RadiusTopRight: =gblTheme.Radius.Large
            Visible: =CountRows(cmpMyTable.Items) > 0 && Lower(If(cmpMyTable.ShowViewToggle, Coalesce(varMyTableView, cmpMyTable.ViewMode, "table"), Coalesce(cmpMyTable.ViewMode, "table"))) = "table"
            Width: =cmpMyTable.Width
            Y: =If(cmpMyTable.ShowViewToggle, 56, 0)
          Children:
            - conMyTableSheet:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: |-
                    =Max(
                        cmpMyTable.Width,
                        gblTheme.Spacing.LG + (gblTheme.Spacing.SM * 10) +
                        If(cmpMyTable.EnableMenu, 44, 0) +
                        If(cmpMyTable.ShowId, cmpMyTable.WidthId, 0) +
                        If(cmpMyTable.ShowAction, cmpMyTable.WidthAction, 0) +
                        cmpMyTable.WidthTitle +
                        If(cmpMyTable.ShowSubtitle, cmpMyTable.WidthSubtitle, 0) +
                        If(cmpMyTable.ShowColumn1, cmpMyTable.WidthColumn1, 0) +
                        If(cmpMyTable.ShowColumn2, cmpMyTable.WidthColumn2, 0) +
                        If(cmpMyTable.ShowColumn3, cmpMyTable.WidthColumn3, 0) +
                        If(cmpMyTable.ShowStatus, cmpMyTable.WidthStatus, 0) +
                        If(cmpMyTable.ShowProgress, cmpMyTable.WidthProgress, 0) +
                        If(cmpMyTable.ShowPerson, cmpMyTable.WidthPerson, 0) +
                        If(cmpMyTable.ShowWhen, cmpMyTable.WidthWhen, 0) +
                        If(cmpMyTable.ShowPriority, cmpMyTable.WidthPriority, 0)
                    )
                Children:
                  - conMyTableHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("PrimaryLighter")
                        FillPortions: =0
                        Height: =cmpMyTable.HeaderHeight
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =gblTheme.Spacing.SM
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =gblTheme.Spacing.LG
                        PaddingRight: =gblTheme.Spacing.MD
                        RadiusTopLeft: =gblTheme.Radius.Large
                        RadiusTopRight: =gblTheme.Radius.Large
                        Visible: =cmpMyTable.ShowHeader
                        Width: =Parent.Width
                      Children:
                        - lblMyTableHeaderMenu:
                            Control: Label@2.5.1
                            Properties:
                              Font: =gblTheme.Typography.FontFamily
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.Caption
                              Text: =""
                              Visible: =cmpMyTable.EnableMenu
                              Width: =44
                        - lblMyTableHeaderId:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("TextMuted")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =Parent.Height
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =gblTheme.Typography.Caption
