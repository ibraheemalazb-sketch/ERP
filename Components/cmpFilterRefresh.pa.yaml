ComponentDefinitions:
  cmpFilterRefresh:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Compact:
        PropertyKind: Input
        DisplayName: Compact
        Description: Shows icons only. Use this on a phone.
        DataType: Boolean
        Default: =false
      FilterLabel:
        PropertyKind: Input
        DisplayName: Filter Label
        Description: Caption on the filter button. Hidden when Compact is true.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "تصفية", "Filters")
      FiltersOn:
        PropertyKind: Input
        DisplayName: Filters On
        Description: Highlights the filter button while the filter row is open.
        DataType: Boolean
        Default: =false
      OnFilter:
        PropertyKind: Event
        DisplayName: On Filter
        Description: Fires when the filter button is pressed.
        ReturnType: None
        Default: =false
      OnRefresh:
        PropertyKind: Event
        DisplayName: On Refresh
        Description: Fires when the refresh button is pressed.
        ReturnType: None
        Default: =false
      ShowFilter:
        PropertyKind: Input
        DisplayName: Show Filter
        Description: Shows the filter button.
        DataType: Boolean
        Default: =true
      ShowRefresh:
        PropertyKind: Input
        DisplayName: Show Refresh
        Description: Shows the refresh button.
        DataType: Boolean
        Default: =true
    Properties:
      Fill: =Color.Transparent
      Height: =36
      Width: =154
    Children:
      - conFR:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =cmpFilterRefresh.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =cmpFilterRefresh.Width
          Children:
            - btnFRFilter:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =If(cmpFilterRefresh.FiltersOn, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                  Height: =36
                  Icon: ="Filter"
                  OnSelect: =cmpFilterRefresh.OnFilter()
                  Text: =If(cmpFilterRefresh.Compact, "", Coalesce(cmpFilterRefresh.FilterLabel, ""))
                  Visible: =cmpFilterRefresh.ShowFilter
                  Width: =If(cmpFilterRefresh.Compact, 36, Max(36, Parent.Width - If(cmpFilterRefresh.ShowRefresh, 44, 0)))
            - btnFRRefresh:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Secondary
                  Height: =36
                  Icon: ="Refresh"
                  OnSelect: =cmpFilterRefresh.OnRefresh()
                  Text: =""
                  Visible: =cmpFilterRefresh.ShowRefresh
                  Width: =36
