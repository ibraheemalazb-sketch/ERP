ComponentDefinitions:
  cmpFinContext:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultPeriodKey:
        PropertyKind: Input
        Description: Period key.
        DataType: Number
        Default: =0
      DefaultProjectKey:
        PropertyKind: Input
        Description: Project id. 0 means all projects.
        DataType: Number
        Default: =0
      OnPeriodChange:
        PropertyKind: Event
        Description: Period changed.
        ReturnType: None
        Default: =false
      OnProjectChange:
        PropertyKind: Event
        Description: Project changed.
        ReturnType: None
        Default: =false
      PeriodOptions:
        PropertyKind: Input
        Description: '{Key, Value} period rows.'
        DataType: Table
        Default: |-
          =Table({Key: 0, Value: ""})
      ProjectOptions:
        PropertyKind: Input
        Description: '{Key, Value} rows, including the all-projects row.'
        DataType: Table
        Default: |-
          =Table({Key: 0, Value: "All my projects"})
      SelectedPeriodKey:
        PropertyKind: Output
        Description: Key of the period dropdown.
        DataType: Number
      SelectedProjectKey:
        PropertyKind: Output
        Description: Key of the project dropdown.
        DataType: Number
    Properties:
      Height: =48
      SelectedPeriodKey: =Coalesce(drpFinCtxPeriod.Selected.Key, cmpFinContext.DefaultPeriodKey)
      SelectedProjectKey: =Coalesce(drpFinCtxProject.Selected.Key, 0)
      Width: =App.Width - If(App.Width < 700, 0, If(gblMenuExpanded, gblTheme.Controls.SideNavWidth, gblTheme.Controls.SideNavCollapsedWidth))
    Children:
      - conFinCtx:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - drpFinCtxProject:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "المشروع", "Project")
                  AlignInContainer: =AlignInContainer.Center
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  ChevronBackground: =fxThemeColor("Surface")
                  ChevronFill: =fxThemeColor("TextSecondary")
                  Color: =fxThemeColor("TextPrimary")
                  Default: |-
                    =Coalesce(
                        LookUp(cmpFinContext.ProjectOptions, Key = cmpFinContext.DefaultProjectKey, Value),
                        First(cmpFinContext.ProjectOptions).Value
                    )
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =1
                  FocusedBorderColor: =fxThemeColor("Primary")
                  FocusedBorderThickness: =2
                  Font: =fontBase
                  HoverBorderColor: =fxThemeColor("Primary")
                  HoverColor: =fxThemeColor("TextPrimary")
                  HoverFill: =fxThemeColor("SurfaceHover")
                  Items: =cmpFinContext.ProjectOptions
                  Items.Value: =Value
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnChange: =cmpFinContext.OnProjectChange()
                  PaddingLeft: =8
                  PressedColor: =fxThemeColor("TextPrimary")
                  PressedFill: =fxThemeColor("SurfaceSelected")
                  SelectionColor: =fxThemeColor("TextOnPrimary")
                  SelectionFill: =fxThemeColor("Primary")
                  Size: =fsBody
                  Width: =240
            - drpFinCtxPeriod:
                Control: Classic/DropDown@2.3.1
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "الفترة", "Period")
                  AlignInContainer: =AlignInContainer.Center
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  ChevronBackground: =fxThemeColor("Surface")
                  ChevronFill: =fxThemeColor("TextSecondary")
                  Color: =fxThemeColor("TextPrimary")
                  Default: =LookUp(cmpFinContext.PeriodOptions, Key = cmpFinContext.DefaultPeriodKey, Value)
                  Fill: =fxThemeColor("Surface")
                  FocusedBorderColor: =fxThemeColor("Primary")
                  FocusedBorderThickness: =2
                  Font: =fontBase
                  HoverBorderColor: =fxThemeColor("Primary")
                  HoverColor: =fxThemeColor("TextPrimary")
                  HoverFill: =fxThemeColor("SurfaceHover")
                  Items: =cmpFinContext.PeriodOptions
                  Items.Value: =Value
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnChange: =cmpFinContext.OnPeriodChange()
                  PaddingLeft: =8
                  PressedColor: =fxThemeColor("TextPrimary")
                  PressedFill: =fxThemeColor("SurfaceSelected")
                  SelectionColor: =fxThemeColor("TextOnPrimary")
                  SelectionFill: =fxThemeColor("Primary")
                  Size: =fsBody
                  Width: =160
