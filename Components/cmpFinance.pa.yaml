  cmpFilterBar:
    DefinitionType: CanvasComponent
    Description: Search (one indexed column) + status + period + project + clear all; becomes a collapsible filter sheet on mobile.
    AccessAppScope: true
    CustomProperties:
      ShowSearch:
        PropertyKind: Input
        Description: Show the search box
        DataType: Boolean
        Default: =true
      SearchHint:
        PropertyKind: Input
        Description: Hint text. Search must target ONE indexed text column (StartsWith)
        DataType: Text
        Default: ="Search by request number"
      ShowStatus:
        PropertyKind: Input
        Description: Show status selector
        DataType: Boolean
        Default: =true
      StatusOptions:
        PropertyKind: Input
        Description: "{Value} rows. Pass the real choices, e.g. Choices([@PaymentRequests].RequestStatus); never hard-code them"
        DataType: Table
        Default: |-
          =FirstN(Table({Value: ""}), 0)
      ShowPeriod:
        PropertyKind: Input
        Description: Show period selector
        DataType: Boolean
        Default: =true
      PeriodOptions:
        PropertyKind: Input
        Description: "{Key: PeriodKey, Value: label}"
        DataType: Table
        Default: =tblPeriods
      ShowProject:
        PropertyKind: Input
        Description: Show project selector
        DataType: Boolean
        Default: =true
      ProjectOptions:
        PropertyKind: Input
        Description: "{Key: ProjectID, Value: label}; pass colProjectOptions"
        DataType: Table
        Default: |-
          =Table({Key: 0, Value: ""})
      SheetOpen:
        PropertyKind: Input
        Description: "Mobile only: filter sheet expanded (host toggles in OnToggleSheet)"
        DataType: Boolean
        Default: =false
      SearchText:
        PropertyKind: Output
        Description: Trimmed search text (debounced)
        DataType: Text
      SelectedStatus:
        PropertyKind: Output
        Description: Selected status or blank for all
        DataType: Text
      SelectedPeriodKey:
        PropertyKind: Output
        Description: Selected PeriodKey or blank for all
        DataType: Number
      SelectedProjectKey:
        PropertyKind: Output
        Description: Selected ProjectID or blank for all
        DataType: Number
      ActiveCount:
        PropertyKind: Output
        Description: Number of active filters
        DataType: Number
      DesiredHeight:
        PropertyKind: Output
        Description: Set the instance Height to this
        DataType: Number
      OnChange:
        PropertyKind: Event
        Description: "Any filter changed: host re-queries (delegable Filter on indexed columns)"
        ReturnType: None
        Default: =""
      OnClear:
        PropertyKind: Event
        Description: Clear all selected (component already reset its controls)
        ReturnType: None
        Default: =""
      OnToggleSheet:
        PropertyKind: Event
        Description: "Mobile Filters button: host does UpdateContext({locFilterSheet: !locFilterSheet})"
        ReturnType: None
        Default: =""
    Properties:
      SearchText: =Trim(txtFltSearch.Text)
      SelectedStatus: =If(drpFltStatus.Selected.Value = fnT("flt.allStatuses", "All statuses"), Blank(), drpFltStatus.Selected.Value)
      SelectedPeriodKey: =If(Coalesce(drpFltPeriod.Selected.Key, 0) = 0, Blank(), drpFltPeriod.Selected.Key)
      SelectedProjectKey: =If(Coalesce(drpFltProject.Selected.Key, 0) = 0, Blank(), drpFltProject.Selected.Key)
      ActiveCount: =If(IsBlank(cmpFilterBar.SearchText), 0, 1) + If(IsBlank(cmpFilterBar.SelectedStatus), 0, 1) + If(IsBlank(cmpFilterBar.SelectedPeriodKey), 0, 1) + If(IsBlank(cmpFilterBar.SelectedProjectKey), 0, 1)
      DesiredHeight: =If(isMobile, sp1 + touchMin + sp1 + touchMin + If(cmpFilterBar.SheetOpen, ((If(cmpFilterBar.ShowStatus, 1, 0) + If(cmpFilterBar.ShowPeriod, 1, 0) + If(cmpFilterBar.ShowProject, 1, 0)) + 1) * (touchMin + sp1), 0) + sp1, sp1 * 2 + touchMin)
      OnReset: =Reset(txtFltSearch); Reset(drpFltStatus); Reset(drpFltPeriod); Reset(drpFltProject)
      Width: =960
      Height: =cmpFilterBar.DesiredHeight
