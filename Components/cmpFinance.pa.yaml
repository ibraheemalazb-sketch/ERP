  cmpHistoryTimeline:
    DefinitionType: CanvasComponent
    Description: Activity history, newest first, 50 at a time with Load more. LogList Finance reads FinanceActivityLog. LogList Procurement reads ProcurementActivityLog by EntityType and EntityID only.
    AccessAppScope: true
    CustomProperties:
      EntityType:
        PropertyKind: Input
        Description: FinanceActivityLog.EntityType choice text
        DataType: Text
        Default: ="Payment Request"
      EntityID:
        PropertyKind: Input
        Description: Record ID
        DataType: Number
        Default: =0
      FilterMode:
        PropertyKind: Input
        Description: entity = EntityType + EntityID; project = every row of ProjectID (EntityType has no 'Project' value)
        DataType: Text
        Default: ="entity"
      ProjectID:
        PropertyKind: Input
        Description: Used when FilterMode = project (FinanceActivityLog.ProjectID is Indexed)
        DataType: Number
        Default: =0
      TopN:
        PropertyKind: Input
        Description: Rows to show; host adds 50 in OnLoadMore (max = data row limit, 2000)
        DataType: Number
        Default: =50
      LogList:
        PropertyKind: Input
        Description: Finance or Procurement. Finance is the default and keeps the finance filters.
        DataType: Text
        Default: ="Finance"
      ShowSensitive:
        PropertyKind: Input
        Description: Show Old/New values of IsSensitive rows (pass canViewPayroll)
        DataType: Boolean
        Default: =false
      HasMore:
        PropertyKind: Output
        Description: true when TopN rows were returned
        DataType: Boolean
      OnLoadMore:
        PropertyKind: Event
        Description: "Load more selected: host does UpdateContext({locHistTop: locHistTop + 50})"
        ReturnType: None
        Default: =""
