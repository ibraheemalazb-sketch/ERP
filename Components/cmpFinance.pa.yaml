  cmpFinContext:
    DefinitionType: CanvasComponent
    Description: "Project and period selectors for a finance page. The screen header is cmpTopBar."
    AccessAppScope: true
    CustomProperties:
      ProjectOptions:
        PropertyKind: Input
        Description: "{Key, Value} rows, including the all-projects row."
        DataType: Table
        Default: |-
          =Table({Key: 0, Value: "All my projects"})
      PeriodOptions:
        PropertyKind: Input
        Description: "{Key, Value} period rows."
        DataType: Table
        Default: |-
          =Table({Key: 0, Value: ""})
      DefaultProjectKey:
        PropertyKind: Input
        Description: Project id. 0 means all projects.
        DataType: Number
        Default: =0
      DefaultPeriodKey:
        PropertyKind: Input
        Description: Period key.
        DataType: Number
        Default: =0
      SelectedProjectKey:
        PropertyKind: Output
        Description: Key of the project dropdown.
        DataType: Number
      SelectedPeriodKey:
        PropertyKind: Output
        Description: Key of the period dropdown.
        DataType: Number
      OnProjectChange:
        PropertyKind: Event
        Description: Project changed.
        ReturnType: None
        Default: =false
      OnPeriodChange:
        PropertyKind: Event
        Description: Period changed.
        ReturnType: None
        Default: =false
