  cmpDataTable:
    DefinitionType: CanvasComponent
    Description: "Responsive data table: sortable header + rows on desktop/tablet (fewer columns on tablet), card list on mobile, paging footer."
    AccessAppScope: true
    CustomProperties:
      RowItems:
        PropertyKind: Input
        Description: "Rows in the fixed schema {RowID, Primary, Secondary, C1..C4, Util, Amount, Currency, AmountUSD, Status, StatusDomain}. Build it from an already-paged collection (never a raw SharePoint list)"
        DataType: Table
        Default: |-
          =Table(
              {RowID: 1, Primary: "PRN-2026-0001", Secondary: "Office rent", C1: "PRJ-001", C2: "04 Oct 2026", C3: "", C4: "",
               Util: 0.82, Amount: 1250.5, Currency: "USD", AmountUSD: 1250.5, Status: "Pending", StatusDomain: "PaymentRequest"},
              {RowID: 2, Primary: "PRN-2026-0002", Secondary: "Fuel", C1: "PRJ-002", C2: "03 Oct 2026", C3: "", C4: "",
               Util: 1.04, Amount: -320, Currency: "YER", AmountUSD: Blank(), Status: "Paid", StatusDomain: "PaymentRequest"}
          )
      ColumnConfig:
        PropertyKind: Input
        Description: "Visible columns {Key: Primary|C1|C2|C3|C4|Util|Amount|Status, Header, Portion, ShowOnTablet, Sortable}"
        DataType: Table
        Default: |-
          =Table(
              {Key: "Primary", Header: "Request", Portion: 2, ShowOnTablet: true, Sortable: true},
              {Key: "C1", Header: "Project", Portion: 1.5, ShowOnTablet: true, Sortable: false},
              {Key: "C2", Header: "Date", Portion: 1.2, ShowOnTablet: false, Sortable: true},
              {Key: "Util", Header: "Utilization", Portion: 1.6, ShowOnTablet: false, Sortable: false},
              {Key: "Amount", Header: "Amount", Portion: 1.5, ShowOnTablet: true, Sortable: true},
              {Key: "Status", Header: "Status", Portion: 1.4, ShowOnTablet: true, Sortable: false}
          )
      SortColumn:
        PropertyKind: Input
        Description: Key currently sorted (host state)
        DataType: Text
        Default: =""
      SortDescending:
        PropertyKind: Input
        Description: Sort direction (host state)
        DataType: Boolean
        Default: =false
      PageNumber:
        PropertyKind: Input
        Description: Current page (host state)
        DataType: Number
        Default: =1
      HasMore:
        PropertyKind: Input
        Description: "Another page exists (host: CountRows(page) = page size)"
        DataType: Boolean
        Default: =false
      Loading:
        PropertyKind: Input
        Description: Host is loading
        DataType: Boolean
        Default: =false
      EmptyText:
        PropertyKind: Input
        Description: Shown when there are no rows
        DataType: Text
        Default: ="No records for the current filters."
      SelectedRow:
        PropertyKind: Output
        Description: Row the user selected (table or card)
        DataType: Record
      ClickedSortKey:
        PropertyKind: Output
        Description: Column key of the header the user just selected (read in OnSortChange)
        DataType: Text
      TotalPortion:
        PropertyKind: Output
        Description: Sum of visible column portions
        DataType: Number
      OnRowSelect:
        PropertyKind: Event
        Description: "Row/card selected: host opens detail (side pane on desktop, screen on mobile)"
        ReturnType: None
        Default: =""
      OnSortChange:
        PropertyKind: Event
        Description: "Sortable header selected: host updates SortColumn/SortDescending and re-sorts"
        ReturnType: None
        Default: =""
      OnNextPage:
        PropertyKind: Event
        Description: Next page
        ReturnType: None
        Default: =""
      OnPrevPage:
        PropertyKind: Event
        Description: Previous page
        ReturnType: None
        Default: =""
