  cmpSkeleton:
    DefinitionType: CanvasComponent
    Description: Loading placeholders (list / table / cards / kpi) with a subtle pulse; never a blocking spinner.
    AccessAppScope: true
    CustomProperties:
      Variant:
        PropertyKind: Input
        Description: list | table | cards | kpi
        DataType: Text
        Default: ="list"
      Rows:
        PropertyKind: Input
        Description: Number of placeholder rows/cards
        DataType: Number
        Default: =5
      Animate:
        PropertyKind: Input
        Description: Pulse animation
        DataType: Boolean
        Default: =true
    Properties:
      Width: =640
      Height: =320
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - tmrSkeleton:
          Control: Timer@2.1.0
          Properties:
            Visible: =false
            Duration: =1000
            Repeat: =cmpSkeleton.Animate
            AutoStart: =cmpSkeleton.Animate
            AutoPause: =true
            Start: =cmpSkeleton.Animate
      - galSkeleton:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            TemplatePadding: =If(cmpSkeleton.Variant = "table", 0, 4)
            ShowScrollbar: =false
            BorderThickness: =0
            Fill: =RGBA(0, 0, 0, 0)
            TemplateFill: =RGBA(0, 0, 0, 0)
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            DelayItemLoading: =false
            LoadingSpinner: =LoadingSpinner.None
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Items: =Sequence(Max(1, cmpSkeleton.Rows))
            TemplateSize: =Switch(cmpSkeleton.Variant, "table", 44, "cards", 132, "kpi", 112, 64)
            WrapCount: =Switch(cmpSkeleton.Variant, "kpi", kpiColumns, "cards", gridColumns, 1)
            Selectable: =false
            AccessibleLabel: =fnT("loading", "Loading")
            TabIndex: =-1
          Children:
            - conSkelItem:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  BorderThickness: =If(cmpSkeleton.Variant = "table", 0, 1)
                  Fill: =If(cmpSkeleton.Variant = "table", RGBA(0, 0, 0, 0), FinTheme.Surface)
                  RadiusTopLeft: =If(cmpSkeleton.Variant = "table", 0, radiusCard)
                  RadiusTopRight: =If(cmpSkeleton.Variant = "table", 0, radiusCard)
                  RadiusBottomLeft: =If(cmpSkeleton.Variant = "table", 0, radiusCard)
                  RadiusBottomRight: =If(cmpSkeleton.Variant = "table", 0, radiusCard)
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
                  BorderColor: =FinTheme.Border
                Children:
                  - rectSkelLine1:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ColorFade(FinTheme.Skeleton, If(cmpSkeleton.Animate, If(themeIsDark, 0.04, 0.25) * Abs(tmrSkeleton.Value / tmrSkeleton.Duration * 2 - 1), 0))
                        BorderThickness: =0
                        TabIndex: =-1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        X: =If(isRTL, Parent.Width - 16 - Self.Width, 16)
                        Y: =If(cmpSkeleton.Variant = "table", 14, 16)
                        Height: =If(cmpSkeleton.Variant = "kpi", 12, 14)
                        Width: =Parent.Width * If(cmpSkeleton.Variant = "table", 0.9, 0.55) - 16
                  - rectSkelLine2:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ColorFade(FinTheme.Skeleton, If(cmpSkeleton.Animate, If(themeIsDark, 0.04, 0.25) * Abs(tmrSkeleton.Value / tmrSkeleton.Duration * 2 - 1), 0))
                        BorderThickness: =0
                        TabIndex: =-1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Visible: =cmpSkeleton.Variant <> "table"
                        X: =If(isRTL, Parent.Width - 16 - Self.Width, 16)
                        Y: =40
                        Height: =If(cmpSkeleton.Variant = "kpi", 28, 12)
                        Width: =Parent.Width * 0.35
                  - rectSkelLine3:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =ColorFade(FinTheme.Skeleton, If(cmpSkeleton.Animate, If(themeIsDark, 0.04, 0.25) * Abs(tmrSkeleton.Value / tmrSkeleton.Duration * 2 - 1), 0))
                        BorderThickness: =0
                        TabIndex: =-1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Visible: =cmpSkeleton.Variant = "cards"
                        X: =If(isRTL, Parent.Width - 16 - Self.Width, 16)
                        Y: =64
                        Height: =10
                        Width: =Parent.Width * 0.75
                  - rectSkelDivider:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =FinTheme.Border
                        BorderThickness: =0
                        TabIndex: =-1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Visible: =cmpSkeleton.Variant = "table"
                        X: =0
                        Y: =Parent.Height - 1
                        Height: =1
                        Width: =Parent.Width
  cmpConfirmDialog:
    DefinitionType: CanvasComponent
    Description: Modal confirmation with required reason (reject, cancel, reversal, rate change, budget revision). Full-width sheet on mobile.
    AccessAppScope: true
    CustomProperties:
      Title:
        PropertyKind: Input
        Description: Dialog title
        DataType: Text
        Default: ="Reject payment request"
      Message:
        PropertyKind: Input
        Description: Explanation
        DataType: Text
        Default: ="This action is recorded in the activity log."
      ConfirmText:
        PropertyKind: Input
        Description: Confirm button text
        DataType: Text
        Default: ="Reject"
      CancelText:
        PropertyKind: Input
        Description: Cancel button text
        DataType: Text
        Default: ="Cancel"
      Destructive:
        PropertyKind: Input
        Description: Red confirm button + warning icon
        DataType: Boolean
        Default: =true
      RequireReason:
        PropertyKind: Input
        Description: Reason is mandatory (reject, cancel, reversal, rate change, budget revision)
        DataType: Boolean
        Default: =true
      ReasonLabel:
        PropertyKind: Input
        Description: Label above the reason box
        DataType: Text
        Default: ="Reason"
      MinReasonLength:
        PropertyKind: Input
        Description: Minimum characters for the reason
        DataType: Number
        Default: =5
      ShowReason:
        PropertyKind: Input
        Description: Show the text box as an OPTIONAL comment when RequireReason = false (approve / check)
        DataType: Boolean
        Default: =false
      Busy:
        PropertyKind: Input
        Description: Disables the buttons while the host is saving
        DataType: Boolean
        Default: =false
      Reason:
        PropertyKind: Output
        Description: Trimmed reason text (read it in OnConfirm)
        DataType: Text
      IsValid:
        PropertyKind: Output
        Description: true when the reason rule is satisfied
        DataType: Boolean
      OnConfirm:
        PropertyKind: Event
        Description: User confirmed (host does the Patch / flow call, then hides the dialog)
        ReturnType: None
        Default: =""
      OnCancel:
        PropertyKind: Event
        Description: User cancelled or closed the dialog
        ReturnType: None
        Default: =""
