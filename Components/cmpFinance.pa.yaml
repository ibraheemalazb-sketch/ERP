ComponentDefinitions:
  cmpStatusBadge:
    DefinitionType: CanvasComponent
    Description: "Status pill: domain + status in, colour + icon + text out (one mapping: tblStatusMap in App.Formulas)."
    AccessAppScope: true
    CustomProperties:
      Domain:
        PropertyKind: Input
        Description: "Key in tblStatusMap: PaymentRequest | PaymentStatus | PurchaseOrder | POStatus | ApprovalDecision | PayrollRun | DonorFunding | Ledger | Utilization"
        DataType: Text
        Default: ="PaymentRequest"
      Status:
        PropertyKind: Input
        Description: Exact SharePoint choice text, e.g. ThisItem.Status.Value
        DataType: Text
        Default: ="Pending"
      UtilizationValue:
        PropertyKind: Input
        Description: Ratio (0.85 = 85%). Used only when Domain = "Utilization"
        DataType: Number
        Default: =Blank()
      LabelOverride:
        PropertyKind: Input
        Description: Optional text to show instead of the status
        DataType: Text
        Default: =""
      Compact:
        PropertyKind: Input
        Description: Smaller badge for dense tables
        DataType: Boolean
        Default: =false
      Tone:
        PropertyKind: Output
        Description: neutral | info | warning | success | danger | successStrong | dangerStrong
        DataType: Text
      ToneColor:
        PropertyKind: Output
        Description: Accent colour for the tone (for host charts/bars)
        DataType: Color
      DisplayText:
        PropertyKind: Output
        Description: Text shown in the badge
        DataType: Text
      DesiredWidth:
        PropertyKind: Output
        Description: Width the badge needs for its text
        DataType: Number
    Properties:
      Tone: =If(cmpStatusBadge.Domain = "Utilization", fnUtilTone(cmpStatusBadge.UtilizationValue), fnStatusTone(cmpStatusBadge.Domain, cmpStatusBadge.Status))
      ToneColor: =fnToneAccent(cmpStatusBadge.Tone)
      DisplayText: |-
        =Coalesce(
            cmpStatusBadge.LabelOverride,
            If(
                cmpStatusBadge.Domain = "Utilization",
                fnPct(cmpStatusBadge.UtilizationValue) & If(cmpStatusBadge.Tone = "dangerStrong", " " & fnT("status.overBudget", "over budget"), ""),
                fnT("status." & cmpStatusBadge.Status, Coalesce(cmpStatusBadge.Status, "-"))
            )
        )
      DesiredWidth: =Min(260, 8 + 14 + 4 + Len(cmpStatusBadge.DisplayText) * If(cmpStatusBadge.Compact, 6.6, 7.4) + 8 + 4)
      Width: =cmpStatusBadge.DesiredWidth
      Height: =If(cmpStatusBadge.Compact, 22, 26)
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - conBadge:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =4
            LayoutWrap: =false
            PaddingTop: =0
            PaddingRight: =8
            PaddingBottom: =0
            PaddingLeft: =8
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =fnToneBg(cmpStatusBadge.Tone)
            RadiusTopLeft: =Self.Height / 2
            RadiusTopRight: =Self.Height / 2
            RadiusBottomLeft: =Self.Height / 2
            RadiusBottomRight: =Self.Height / 2
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - icoBadgeStart:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: |-
                    =Coalesce(
                        LookUp(
                            tblStatusMap,
                            Domain = cmpStatusBadge.Domain && Status = If(cmpStatusBadge.Domain = "Utilization", cmpStatusBadge.Tone, cmpStatusBadge.Status),
                            Ico
                        ),
                        LookUp(tblToneIcon, Tone = cmpStatusBadge.Tone, Ico)
                    )
                  Color: =fnToneFg(cmpStatusBadge.Tone)
                  Fill: =RGBA(0, 0, 0, 0)
                  Width: =14
                  Height: =14
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  TabIndex: =-1
                  AccessibleLabel: =""
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =FinTheme.Focus
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Visible: =!isRTL
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
            - lblBadge:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpStatusBadge.DisplayText
                  Font: =fontBase
                  Size: =If(cmpStatusBadge.Compact, 11, fsCaption)
                  Color: =fnToneFg(cmpStatusBadge.Tone)
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Wrap: =false
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =20
                  FontWeight: =FontWeight.Semibold
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
            - icoBadgeEnd:
                Control: Classic/Icon@2.5.0
                Properties:
                  Icon: |-
                    =Coalesce(
                        LookUp(
                            tblStatusMap,
                            Domain = cmpStatusBadge.Domain && Status = If(cmpStatusBadge.Domain = "Utilization", cmpStatusBadge.Tone, cmpStatusBadge.Status),
                            Ico
                        ),
                        LookUp(tblToneIcon, Tone = cmpStatusBadge.Tone, Ico)
                    )
                  Color: =fnToneFg(cmpStatusBadge.Tone)
                  Fill: =RGBA(0, 0, 0, 0)
                  Width: =14
                  Height: =14
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  TabIndex: =-1
                  AccessibleLabel: =""
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =FinTheme.Focus
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Visible: =isRTL
                  AlignInContainer: =AlignInContainer.Center
                  FillPortions: =0
  cmpMoney:
    DefinitionType: CanvasComponent
    Description: Formats amount + currency (2 decimals, thousands separator, red with minus when negative); USD equivalent on hover (Tooltip) or as a second line.
    AccessAppScope: true
    CustomProperties:
      Amount:
        PropertyKind: Input
        Description: Amount in its original currency
        DataType: Number
        Default: =1234.5
      Currency:
        PropertyKind: Input
        Description: USD | YER | SAR (Currency.Value)
        DataType: Text
        Default: ="USD"
      AmountUSD:
        PropertyKind: Input
        Description: Stored AmountUSD (written by flow). Leave blank to show an estimate from colFxRates
        DataType: Number
        Default: =Blank()
      ShowUSD:
        PropertyKind: Input
        Description: Show the USD line under the amount (use on mobile instead of hover)
        DataType: Boolean
        Default: =false
      FontSize:
        PropertyKind: Input
        Description: Text size of the main amount
        DataType: Number
        Default: =fsBody
      Bold:
        PropertyKind: Input
        Description: Bold main amount
        DataType: Boolean
        Default: =false
      AlignToEnd:
        PropertyKind: Input
        Description: true = number alignment (right in LTR, left in RTL)
        DataType: Boolean
        Default: =true
      FormattedText:
        PropertyKind: Output
        Description: e.g. -1,234.50 YER
        DataType: Text
      USDValue:
        PropertyKind: Output
        Description: Stored USD, or estimate when not stored
        DataType: Number
      FormattedUSD:
        PropertyKind: Output
        Description: USD line text
        DataType: Text
      DesiredHeight:
        PropertyKind: Output
        Description: Height needed for 1 or 2 lines
        DataType: Number
    Properties:
      FormattedText: =fnMoney(cmpMoney.Amount, cmpMoney.Currency)
      USDValue: =If(cmpMoney.Currency = "USD", cmpMoney.Amount, Coalesce(cmpMoney.AmountUSD, fnToUSD(cmpMoney.Amount, cmpMoney.Currency)))
      FormattedUSD: |-
        =If(
            IsBlank(cmpMoney.USDValue), "",
            "~ " & fnMoney(cmpMoney.USDValue, "USD") & If(IsBlank(cmpMoney.AmountUSD), " (" & fnT("money.estimate", "est.") & ")", "")
        )
      DesiredHeight: =If(cmpMoney.ShowUSD && cmpMoney.Currency <> "USD" && !IsBlank(cmpMoney.USDValue), cmpMoney.FontSize + 8 + 18, cmpMoney.FontSize + 10)
      Width: =180
      Height: =cmpMoney.DesiredHeight
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - conMoney:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            LayoutWrap: =false
            PaddingTop: =0
            PaddingRight: =0
            PaddingBottom: =0
            PaddingLeft: =0
            DropShadow: =DropShadow.None
            BorderThickness: =0
            Fill: =RGBA(0, 0, 0, 0)
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - lblMoneyMain:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpMoney.FormattedText
                  Font: =fontBase
                  Size: =cmpMoney.FontSize
                  Color: =fnAmountColor(cmpMoney.Amount)
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Wrap: =false
                  Align: =If(cmpMoney.AlignToEnd, alignNumber, alignStart)
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =cmpMoney.FontSize + 10
                  FontWeight: =If(cmpMoney.Bold, FontWeight.Bold, FontWeight.Normal)
                  Tooltip: =If(cmpMoney.Currency <> "USD" && !IsBlank(cmpMoney.USDValue), cmpMoney.FormattedUSD, "")
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
            - lblMoneyUSD:
                Control: Label@2.5.1
                Properties:
                  Text: =cmpMoney.FormattedUSD
                  Font: =fontBase
                  Size: =fsCaption
                  Color: =FinTheme.TextSecondary
                  Fill: =RGBA(0, 0, 0, 0)
                  BorderThickness: =0
                  Wrap: =false
                  Align: =If(cmpMoney.AlignToEnd, alignNumber, alignStart)
                  VerticalAlign: =VerticalAlign.Middle
                  PaddingTop: =0
                  PaddingRight: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  Height: =18
                  Visible: =cmpMoney.ShowUSD && cmpMoney.Currency <> "USD" && !IsBlank(cmpMoney.USDValue)
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
  cmpKPICard:
    DefinitionType: CanvasComponent
    Description: "KPI card: label, value, currency, trend arrow, subtext, optional status tone (icon + colour)."
    AccessAppScope: true
    CustomProperties:
      Label:
        PropertyKind: Input
        Description: Card caption
        DataType: Text
        Default: ="Total budget"
      KPIValue:
        PropertyKind: Input
        Description: Value to display (read from stored totals, never a ledger sum)
        DataType: Number
        Default: =0
      ValueFormat:
        PropertyKind: Input
        Description: money | percent (ratio 0.85) | count
        DataType: Text
        Default: ="money"
      Currency:
        PropertyKind: Input
        Description: Currency code when ValueFormat = money
        DataType: Text
        Default: ="USD"
      TrendPercent:
        PropertyKind: Input
        Description: Change vs previous period as ratio (0.042 = +4.2%). Blank hides the trend
        DataType: Number
        Default: =Blank()
      TrendUpIsGood:
        PropertyKind: Input
        Description: false for spend-type KPIs where up is bad
        DataType: Boolean
        Default: =true
      Subtext:
        PropertyKind: Input
        Description: Small text under the value
        DataType: Text
        Default: =""
      Tone:
        PropertyKind: Input
        Description: Optional status tone (success/warning/danger/info/dangerStrong); adds icon + colour
        DataType: Text
        Default: =""
      Loading:
        PropertyKind: Input
        Description: Show skeleton instead of the value
        DataType: Boolean
        Default: =false
      Selectable:
        PropertyKind: Input
        Description: Card is clickable (drill-down)
        DataType: Boolean
        Default: =false
      OnCardSelect:
        PropertyKind: Event
        Description: Raised when the user selects the card (only when Selectable)
        ReturnType: None
        Default: =""
      FormattedValue:
        PropertyKind: Output
        Description: Value as displayed
        DataType: Text
    Properties:
      FormattedValue: |-
        =Switch(
            cmpKPICard.ValueFormat,
            "percent", fnPct(cmpKPICard.KPIValue),
            "count", fnCount(cmpKPICard.KPIValue),
            fnMoney(cmpKPICard.KPIValue, cmpKPICard.Currency)
        )
      Width: =280
      Height: =128
      Fill: =RGBA(0, 0, 0, 0)
    Children:
      - conKPIRoot:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            BorderThickness: =borderWidth
            Fill: =FinTheme.Surface
            RadiusTopLeft: =radiusCard
            RadiusTopRight: =radiusCard
            RadiusBottomLeft: =radiusCard
            RadiusBottomRight: =radiusCard
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            BorderColor: =FinTheme.Border
          Children:
            - conKPIBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  LayoutWrap: =false
                  PaddingTop: =sp2
                  PaddingRight: =sp2
                  PaddingBottom: =sp2
                  PaddingLeft: =sp2
                  DropShadow: =DropShadow.None
                  BorderThickness: =0
                  Fill: =RGBA(0, 0, 0, 0)
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                Children:
                  - conKPITop:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        LayoutWrap: =false
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =20
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblKPILabel:
                            Control: Label@2.5.1
                            Properties:
                              Text: =cmpKPICard.Label
                              Font: =fontBase
                              Size: =fsCaption
                              Color: =FinTheme.TextSecondary
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Wrap: =false
                              Align: =alignStart
                              VerticalAlign: =VerticalAlign.Middle
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =20
                              FontWeight: =FontWeight.Semibold
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                        - icoKPITone:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Switch(cmpKPICard.Tone, "success", Icon.Check, "warning", Icon.Information, "danger", Icon.Flag, "dangerStrong", Icon.Warning, "info", Icon.Information, Icon.HorizontalLine)
                              Color: =fnToneText(cmpKPICard.Tone)
                              Fill: =RGBA(0, 0, 0, 0)
                              Width: =18
                              Height: =18
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              TabIndex: =-1
                              AccessibleLabel: =fnT("tone." & cmpKPICard.Tone, cmpKPICard.Tone)
                              FocusedBorderThickness: =2
                              FocusedBorderColor: =FinTheme.Focus
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!IsBlank(cmpKPICard.Tone)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                  - lblKPIValue:
                      Control: Label@2.5.1
                      Properties:
                        Text: =cmpKPICard.FormattedValue
                        Font: =fontBase
                        Size: =If(isMobile, 22, fsKPI)
                        Color: =If(!IsBlank(cmpKPICard.Tone), fnToneText(cmpKPICard.Tone), cmpKPICard.ValueFormat = "money" && cmpKPICard.KPIValue < 0, FinTheme.DangerText, FinTheme.Text)
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        Wrap: =false
                        Align: =alignStart
                        VerticalAlign: =VerticalAlign.Middle
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =If(isMobile, 32, 40)
                        Visible: =!cmpKPICard.Loading
                        FontWeight: =FontWeight.Bold
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Live: =Live.Polite
                  - conKPISkeleton:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =FinTheme.Skeleton
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Visible: =cmpKPICard.Loading
                        Height: =32
                        Width: =Parent.Width * 0.6
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Start
                      Children: []
                  - conKPIFoot:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =4
                        LayoutWrap: =false
                        PaddingTop: =0
                        PaddingRight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        DropShadow: =DropShadow.None
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        Height: =18
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - icoKPITrend:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =If(cmpKPICard.TrendPercent >= 0, Icon.ArrowUp, Icon.ArrowDown)
                              Color: =If(((cmpKPICard.TrendPercent >= 0) = cmpKPICard.TrendUpIsGood), FinTheme.SuccessText, FinTheme.DangerText)
                              Fill: =RGBA(0, 0, 0, 0)
                              Width: =14
                              Height: =14
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              TabIndex: =-1
                              AccessibleLabel: =""
                              FocusedBorderThickness: =2
                              FocusedBorderColor: =FinTheme.Focus
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Visible: =!IsBlank(cmpKPICard.TrendPercent) && !cmpKPICard.Loading
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Center
                        - lblKPITrend:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(cmpKPICard.TrendPercent >= 0, "+", "") & fnPct(cmpKPICard.TrendPercent)
                              Font: =fontBase
                              Size: =fsCaption
                              Color: =If(((cmpKPICard.TrendPercent >= 0) = cmpKPICard.TrendUpIsGood), FinTheme.SuccessText, FinTheme.DangerText)
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Wrap: =false
                              Align: =alignStart
                              VerticalAlign: =VerticalAlign.Middle
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =20
                              Visible: =!IsBlank(cmpKPICard.TrendPercent) && !cmpKPICard.Loading
                              FontWeight: =FontWeight.Semibold
                              Width: =60
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                        - lblKPISub:
                            Control: Label@2.5.1
                            Properties:
                              Text: =cmpKPICard.Subtext
                              Font: =fontBase
                              Size: =fsCaption
                              Color: =FinTheme.TextSecondary
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              Wrap: =false
                              Align: =alignStart
                              VerticalAlign: =VerticalAlign.Middle
                              PaddingTop: =0
                              PaddingRight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              Height: =20
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              Tooltip: =cmpKPICard.Subtext
            - btnKPIHit:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Font: =fontBase
                  Size: =fsBody
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  BorderThickness: =0
                  FocusedBorderThickness: =2
                  FocusedBorderColor: =FinTheme.Focus
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =0
                  PaddingBottom: =0
                  TabIndex: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  DisabledColor: =FinTheme.TextSecondary
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(0, 0, 0, 0)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =FinTheme.RowHover
                  HoverColor: =RGBA(0, 0, 0, 0)
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =FinTheme.RowSelected
                  PressedColor: =RGBA(0, 0, 0, 0)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  Visible: =cmpKPICard.Selectable
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Tooltip: |-
                    =cmpKPICard.Label & ": " & cmpKPICard.FormattedValue
                  OnSelect: =cmpKPICard.OnCardSelect()
  cmpUtilizationBar:
    DefinitionType: CanvasComponent
    Description: "Stacked budget bar: spent (solid) + committed (lighter) + remaining (empty) with % label and tone icon."
    AccessAppScope: true
    CustomProperties:
      Budgeted:
        PropertyKind: Input
        Description: Budgets.TotalAmount (display name BudgetedAmount) or project budget
        DataType: Number
        Default: =10000
      Committed:
        PropertyKind: Input
        Description: Budgets.CommittedAmount (Flow)
        DataType: Number
        Default: =2500
      Spent:
        PropertyKind: Input
        Description: Budgets.SpentAmount (Flow)
        DataType: Number
        Default: =5000
      Currency:
        PropertyKind: Input
        Description: Currency for the legend/tooltip
        DataType: Text
        Default: ="USD"
      ShowLabel:
        PropertyKind: Input
        Description: Show % label + icon at the end
        DataType: Boolean
        Default: =true
      ShowLegend:
        PropertyKind: Input
        Description: Show spent / committed / remaining line under the bar
        DataType: Boolean
        Default: =false
      BarHeight:
        PropertyKind: Input
        Description: Bar thickness in px
        DataType: Number
        Default: =10
      Utilization:
        PropertyKind: Output
        Description: (Committed + Spent) / Budgeted
        DataType: Number
      SpentRatio:
        PropertyKind: Output
        Description: Spent / Budgeted
        DataType: Number
      CommittedRatio:
        PropertyKind: Output
        Description: Committed / Budgeted
        DataType: Number
      Tone:
        PropertyKind: Output
        Description: Tone from fnUtilTone (thresholds utilWarnAt / utilDangerAt / utilOverAt)
        DataType: Text
      DesiredHeight:
        PropertyKind: Output
        Description: Height needed
        DataType: Number
    Properties:
      Utilization: =fnUtilRatio(cmpUtilizationBar.Budgeted, cmpUtilizationBar.Committed, cmpUtilizationBar.Spent)
      SpentRatio: =If(Coalesce(cmpUtilizationBar.Budgeted, 0) <= 0, 0, Max(0, Coalesce(cmpUtilizationBar.Spent, 0)) / cmpUtilizationBar.Budgeted)
      CommittedRatio: =If(Coalesce(cmpUtilizationBar.Budgeted, 0) <= 0, 0, Max(0, Coalesce(cmpUtilizationBar.Committed, 0)) / cmpUtilizationBar.Budgeted)
