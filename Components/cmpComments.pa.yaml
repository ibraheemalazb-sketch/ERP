                                                                cmpComments.RecordType,
                                                                "PurchaseRequest", "Purchase Request",
                                                                "PurchaseOrder", "Purchase Order",
                                                                "GRN", "GRN"
                                                            ),
                                                            cmpComments.RecordID,
                                                            Coalesce(cmpComments.RecordNumber, ""),
                                                            "Commented",
                                                            "Info",
                                                            0,
                                                            "",
                                                            Blank(),
                                                            "",
                                                            "",
                                                            "",
                                                            "",
                                                            "Reply added",
                                                            "",
                                                            0
