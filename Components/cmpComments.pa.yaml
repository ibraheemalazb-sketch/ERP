                                          AccessibleLabel: =If(gblLanguage = "Arabic", "إرسال الرد", "Post reply")
                                          BasePaletteColor: =fxThemeColor("Primary")
                                          DisplayMode: |-
                                            =If(
                                                IsBlank(Trim(Coalesce(varReplyDraft, ""))),
                                                DisplayMode.Disabled,
                                                DisplayMode.Edit
                                            )
                                          Icon: ="Send"
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =If(
                                                IsBlank(Trim(Coalesce(varReplyDraft, ""))),
                                                Notify(If(gblLanguage = "Arabic", "اكتب ردًا أولاً", "Please enter a reply first"), NotificationType.Warning),
                                                With(
                                                    { parentComment: LookUp(colDiscussion, ID = ThisItem.ID) },
                                                    Set(
                                                        varReplySaved,
                                                        Patch(
                                                            Comments,
                                                            Defaults(Comments),
                                                            {
                                                                Title: If(IsBlank(cmpComments.RecordNumber), "Reply", "Reply - " & cmpComments.RecordNumber),
                                                                Module: {Value: cmpComments.ModuleName},
                                                                Comment: Trim(varReplyDraft),
                                                                RecordType: cmpComments.RecordType,
                                                                RecordID: cmpComments.RecordID,
                                                                RecordNumber: cmpComments.RecordNumber,
                                                                CommentType: "Reply",
                                                                CommentedByID: gblUser.ID,
                                                                CommentedByName: gblUser.FullName,
                                                                CommentDate: Now(),
                                                                MentionedUserIDs: Concat(colReplyMentions, Text(UserID), ";"),
                                                                MentionedUserNames: Concat(colReplyMentions, UserName, ";"),
                                                                MentionCount: CountRows(colReplyMentions),
                                                                ParentCommentID: ThisItem.ID,
                                                                IsInternal: false,
                                                                IsDeleted: false,
                                                                ReplyCount: 0
                                                            }
                                                        )
                                                    );
                                                    If(
                                                        And(
                                                            Not(IsBlank(varReplySaved.ID)),
                                                            Or(
                                                                cmpComments.RecordType = "PurchaseRequest",
                                                                cmpComments.RecordType = "PurchaseOrder",
                                                                cmpComments.RecordType = "GRN"
                                                            )
                                                        ),
                                                        fnWriteLog(
