                                                Height: =34
                                                InputTextPlaceholder: =If(gblLanguage = "Arabic", "مستخدم", "User")
                                                ItemDisplayText: =ThisItem.FullName
                                                Items: =cmpComments.People
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnChange: |-
                                                  =If(
                                                      !IsBlank(Self.Selected.ID),
