                                                    );
                                                    Patch(
                                                        Comments,
                                                        parentComment,
                                                        {ReplyCount: Coalesce(parentComment.ReplyCount, 0) + 1}
                                                    );
                                                    If(
                                                        parentComment.CommentedByID <> gblUser.ID,
                                                        Patch(
                                                            Notifications,
                                                            Defaults(Notifications),
                                                            {
                                                                Title: "New reply to your comment",
                                                                Message: gblUser.FullName & " replied to your comment on " & Coalesce(cmpComments.RecordNumber, ""),
                                                                IsRead: false,
                                                                Createddate: Now(),
                                                                RecipientID: parentComment.CommentedByID,
                                                                Recipient: {Id: parentComment.CommentedByID, Value: parentComment.CommentedByName},
                                                                RecipientNo: LookUp(cmpComments.People, ID = parentComment.CommentedByID).EmployeeNumber,
                                                                RelatedEntity: {Value: cmpComments.RelatedEntity},
                                                                RelatedItemID: cmpComments.RecordID,
                                                                Duration: 0,
                                                                Module: {Value: cmpComments.ModuleName},
                                                                Status: {Value: "Unread"},
                                                                ReadDate: Blank(),
                                                                RecordType: cmpComments.RecordType
                                                            }
                                                        )
                                                    );
                                                    ForAll(
                                                        Filter(
                                                            colReplyMentions,
                                                            UserID <> gblUser.ID,
                                                            UserID <> parentComment.CommentedByID
                                                        ) As mention,
                                                        Patch(
                                                            Notifications,
                                                            Defaults(Notifications),
                                                            {
                                                                Title: "You were mentioned in " & Coalesce(cmpComments.RecordNumber, cmpComments.RecordType),
                                                                Message: gblUser.FullName & " mentioned you in a reply on " & cmpComments.RecordType & " " & Coalesce(cmpComments.RecordNumber, ""),
                                                                IsRead: false,
                                                                Createddate: Now(),
                                                                RecipientID: mention.UserID,
                                                                Recipient: {Id: mention.UserID, Value: mention.UserName},
                                                                RecipientNo: mention.EmployeeNumber,
                                                                RelatedEntity: {Value: cmpComments.RelatedEntity},
                                                                RelatedItemID: cmpComments.RecordID,
                                                                Duration: 0,
                                                                Module: {Value: cmpComments.ModuleName},
                                                                Status: {Value: "Unread"},
                                                                ReadDate: Blank(),
                                                                RecordType: cmpComments.RecordType
                                                            }
                                                        )
                                                    );
                                                    ClearCollect(
                                                        colCommentAudience,
                                                        Filter(cmpComments.Involved, UserID > 0)
                                                    );
                                                    RemoveIf(
                                                        colCommentAudience,
                                                        Or(
                                                            UserID = Coalesce(gblUser.ID, 0),
                                                            UserID = parentComment.CommentedByID,
                                                            UserID in colReplyMentions.UserID
                                                        )
                                                    );
                                                    ForAll(
                                                        ForAll(
                                                            Distinct(colCommentAudience, UserID),
                                                            LookUp(colCommentAudience, UserID = Value)
                                                        ) As person,
                                                        Patch(
                                                            Notifications,
                                                            Defaults(Notifications),
                                                            {
                                                                Title: "New comment on " & Coalesce(cmpComments.RecordNumber, cmpComments.RecordType),
                                                                Message: gblUser.FullName & " replied on " & cmpComments.RecordType & " " & Coalesce(cmpComments.RecordNumber, ""),
                                                                IsRead: false,
                                                                Createddate: Now(),
                                                                RecipientID: person.UserID,
                                                                Recipient: {Id: person.UserID, Value: person.UserName},
                                                                RecipientNo: LookUp(cmpComments.People, ID = person.UserID).EmployeeNumber,
                                                                RelatedEntity: {Value: cmpComments.RelatedEntity},
                                                                RelatedItemID: cmpComments.RecordID,
                                                                RecordType: cmpComments.RecordType,
                                                                Module: {Value: cmpComments.ModuleName},
                                                                Status: {Value: "Unread"},
                                                                Duration: 0,
                                                                ReadDate: Blank()
                                                            }
                                                        )
                                                    );
                                                    Refresh(Comments);
                                                    ClearCollect(
                                                        colDiscussion,
                                                        Filter(
                                                            Comments,
                                                            RecordID = cmpComments.RecordID,
                                                            RecordType = cmpComments.RecordType,
                                                            IsDeleted = false
                                                        )
                                                    );
                                                    Set(varDiscussionRecord, cmpComments.RecordID);
                                                    Set(varDiscussionRecordType, cmpComments.RecordType);
                                                    Set(varDiscussionReload, false);
                                                    Reset(txtReply);
                                                    Clear(colReplyMentions);
                                                    Set(varReplyDraft, "");
                                                    Set(varReplyToCommentID, Blank());
                                                    Set(varShowReplyMentionPicker, false);
                                                    Notify(If(gblLanguage = "Arabic", "تم إرسال الرد", "Reply posted successfully"), NotificationType.Success)
                                                )
                                            )
                                          Text: =If(gblLanguage = "Arabic", "إرسال", "Post")
