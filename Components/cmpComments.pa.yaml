ComponentDefinitions:
  cmpComments:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Involved:
        PropertyKind: Input
        DisplayName: Involved
        Description: People who should be notified about a new comment. Columns are UserID and UserName.
        DataType: Table
        Default: |-
          =Table({UserID: 0, UserName: ""})
      ModuleName:
        PropertyKind: Input
        DisplayName: ModuleName
        Description: Comments and Notifications Module choice, for example Procurement.
        DataType: Text
        Default: ="Procurement"
      People:
        PropertyKind: Input
        DisplayName: People
        Description: In-memory people for mentions. Columns are ID, FullName, Email, and EmployeeNumber.
        DataType: Table
        Default: =Employees
      RecordID:
        PropertyKind: Input
        DisplayName: RecordID
        Description: Id of the record being discussed. 0 loads nothing.
        DataType: Number
        Default: =0
      RecordNumber:
        PropertyKind: Input
        DisplayName: RecordNumber
        Description: Human reference stored on the comment and used in notifications.
        DataType: Text
        Default: =""
      RecordType:
        PropertyKind: Input
        DisplayName: RecordType
        Description: Comments RecordType text, for example PurchaseRequest.
        DataType: Text
        Default: ="PurchaseRequest"
      RelatedEntity:
        PropertyKind: Input
        DisplayName: RelatedEntity
        Description: Notifications RelatedEntity choice, for example PurchaseRequest.
        DataType: Text
        Default: ="PurchaseRequest"
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Heading. The toolbar shows it in capitals.
        DataType: Text
        Default: =If(gblLanguage = "Arabic", "التعليقات", "Comments")
    Properties:
      Fill: =fxThemeColor("Surface")
      Height: =700
      Width: =400
    Children:
      - conDiscussion:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =fxThemeColor("Surface")
            Height: =cmpComments.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =cmpComments.Width
          Children:
            - tmrDiscussion:
                Control: Timer@2.1.0
                Properties:
                  AutoStart: =true
                  Duration: =800
                  Height: =0
                  OnTimerEnd: |-
                    =If(
                        Or(
                            varDiscussionRecord <> cmpComments.RecordID,
                            Coalesce(varDiscussionRecordType, "") <> Coalesce(cmpComments.RecordType, ""),
                            varDiscussionReload
                        ),
                        If(
                            Or(cmpComments.RecordID = 0, IsBlank(cmpComments.RecordID)),
                            Clear(colDiscussion);
                            Set(varDiscussionRecord, 0);
                            Set(varDiscussionRecordType, cmpComments.RecordType);
                            Set(varDiscussionReload, false),
                            ClearCollect(
                                colDiscussion,
                                Filter(
                                    Comments,
                                    RecordID = cmpComments.RecordID,
                                    RecordType = cmpComments.RecordType,
                                    IsDeleted = false
                                )
                            );
                            Set(varDiscussionRecord, cmpComments.RecordID);
                            Set(varDiscussionRecordType, cmpComments.RecordType);
                            Set(varDiscussionReload, false)
                        )
                    )
                  Repeat: =true
                  Visible: =false
                  Width: =0
            - conCommentsToolbar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: =40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =2
                  PaddingLeft: =4
                  PaddingRight: =4
                  PaddingTop: =2
                  Width: =Parent.Width
                Children:
                  - icoComments:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Height: =16
                        Icon: ="Chat"
                        IconColor: =fxThemeColor("Primary")
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =16
                  - lblCommentsTitle:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =fxThemeColor("TextPrimary")
                        Font: =gblTheme.Typography.FontFamily
                        FontWeight: =gblTheme.FontWeights.Bold
                        Height: =20
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Size: =If(App.Width < 700, gblTheme.Typography.BodySmall, gblTheme.Typography.Body)
                        Text: =Upper(Coalesce(cmpComments.Title, ""))
                        Width: =Parent.Width - 32
            - conCompose:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =fxThemeColor("Border")
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =fxThemeColor("Surface")
                  FillPortions: =0
                  Height: |-
                    =Max(
                        112,
                        24 + Max(
                            72,
                            24 * Max(
                                1,
                                CountRows(Split(Coalesce(varCommentDraft, ""), Char(10)))
                            )
                        ) + If(CountRows(colCommentMentions) > 0, 40, 0) + 40
                    )
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =12
                  RadiusBottomLeft: =gblTheme.Radius.XL
                  RadiusBottomRight: =gblTheme.Radius.XL
                  RadiusTopLeft: =gblTheme.Radius.XL
                  RadiusTopRight: =gblTheme.Radius.XL
                  Width: =Parent.Width
                Children:
                  - conComposeAvatar:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =40
                      Children:
                        - shpComposeAvatar:
                            Control: Circle@2.3.0
                            Properties:
                              Fill: =fxThemeColor("Primary")
                              Height: =40
                              Width: =40
                        - lblComposeAvatar:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =fxThemeColor("TextOnPrimary")
                              Font: =gblTheme.Typography.FontFamily
                              FontWeight: =gblTheme.FontWeights.Medium
                              Height: =40
                              Size: =14
                              Text: |-
                                =With(
                                    { words: Split(Trim(Coalesce(gblUser.FullName, "")), " ") },
                                    Upper(
                                        Left(First(words).Value, 1) & If(
                                            CountRows(words) > 1,
                                            Left(Last(FirstN(words, 2)).Value, 1),
                                            ""
                                        )
                                    )
                                )
                              Width: =40
                  - conComposeBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Transparent")
                        Height: |-
                          =Max(
                              72,
                              24 * Max(
                                  1,
                                  CountRows(Split(Coalesce(varCommentDraft, ""), Char(10)))
                              )
                          ) + If(CountRows(colCommentMentions) > 0, 40, 0) + 44
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width - 52
                      Children:
                        - txtComment:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: =If(gblLanguage = "Arabic", "اكتب تعليقًا", "Write a comment")
                              AlignInContainer: =AlignInContainer.Stretch
                              Fill: =fxThemeColor("Background")
                              Height: |-
                                =Max(
                                    72,
                                    24 * Max(
                                        1,
                                        CountRows(Split(Coalesce(varCommentDraft, ""), Char(10)))
                                    )
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnChange: =Set(varCommentDraft, Self.Text)
                              Placeholder: =If(gblLanguage = "Arabic", "اكتب تعليقك هنا...", "Write your comment...")
                              RadiusBottomLeft: =gblTheme.Radius.XL
                              RadiusBottomRight: =gblTheme.Radius.XL
                              RadiusTopLeft: =gblTheme.Radius.XL
                              RadiusTopRight: =gblTheme.Radius.XL
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                        - conMentionList:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Transparent")
                              FillPortions: =0
                              Height: =If(CountRows(colCommentMentions) > 0, 36, 0)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Visible: =CountRows(colCommentMentions) > 0
                              Width: =Parent.Width
                            Children:
                              - galMentions:
                                  Control: Gallery@2.15.0
                                  Variant: Horizontal
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الإشارات", "Mentions")
                                    BorderStyle: =BorderStyle.None
                                    Fill: =fxThemeColor("Transparent")
                                    FillPortions: =0
                                    Height: =36
                                    Items: =colCommentMentions
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    ShowScrollbar: =false
                                    TemplatePadding: =2
                                    TemplateSize: =150
                                    Width: =Parent.Width
                                  Children:
                                    - conMentionChip:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =fxThemeColor("PrimaryLight")
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =fxThemeColor("PrimaryLighter")
                                          Height: =32
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =4
                                          PaddingLeft: =8
                                          PaddingRight: =4
                                          RadiusBottomLeft: =gblTheme.Radius.Round
                                          RadiusBottomRight: =gblTheme.Radius.Round
                                          RadiusTopLeft: =gblTheme.Radius.Round
                                          RadiusTopRight: =gblTheme.Radius.Round
                                          Width: =146
                                        Children:
                                          - lblMention:
                                              Control: ModernText@1.0.0
                                              Properties:
                                                Color: =fxThemeColor("Primary")
                                                Font: =gblTheme.Typography.FontFamily
                                                FontWeight: =gblTheme.FontWeights.Medium
                                                Height: =28
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =gblTheme.Typography.BodySmall
                                                Text: ="@" & Coalesce(ThisItem.UserName, "")
                                                Width: =104
                                          - btnRemoveMention:
                                              Control: ModernButton@1.0.0
                                              Properties:
                                                AccessibleLabel: =If(gblLanguage = "Arabic", "إزالة الإشارة", "Remove mention")
                                                Appearance: =ButtonAppearance.Subtle
                                                BasePaletteColor: =fxThemeColor("TextMuted")
                                                Height: =24
                                                Icon: ="Dismiss"
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                OnSelect: =Remove(colCommentMentions, ThisItem)
                                                Text: =""
                                                Width: =24
                        - conComposeActions:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Transparent")
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =6
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =Parent.Width
                            Children:
                              - btnMention:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "الإشارة إلى مستخدم", "Mention a user")
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    Icon: ="People"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varShowMentionPicker, !varShowMentionPicker)
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    Text: =If(gblLanguage = "Arabic", "إشارة", "Mention")
                                    Width: =If(Parent.Width < 360, 96, 110)
                              - conMentionPicker:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =fxThemeColor("Transparent")
                                    FillPortions: =0
                                    Height: =36
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Visible: =varShowMentionPicker
                                    Width: =If(varShowMentionPicker, If(Parent.Width < 360, 140, 200), 0)
                                  Children:
                                    - cmbMentionUser:
                                        Control: ModernCombobox@1.1.2
                                        Properties:
                                          AccessibleLabel: =If(gblLanguage = "Arabic", "اختر مستخدمًا للإشارة إليه", "Select a user to mention")
                                          Height: =34
                                          InputTextPlaceholder: =If(gblLanguage = "Arabic", "مستخدم", "User")
                                          ItemDisplayText: =ThisItem.FullName
                                          Items: =cmpComments.People
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          OnChange: |-
                                            =If(
                                                !IsBlank(Self.Selected.ID),
                                                If(
                                                    IsBlank(LookUp(colCommentMentions, UserID = Self.Selected.ID)),
                                                    Collect(
                                                        colCommentMentions,
                                                        {
                                                            UserID: Self.Selected.ID,
                                                            UserName: Self.Selected.FullName,
                                                            Email: Self.Selected.Email,
                                                            EmployeeNumber: Self.Selected.EmployeeNumber
                                                        }
                                                    )
                                                )
                                            );
                                            Reset(cmbMentionUser);
                                            Set(varShowMentionPicker, false)
                                          SelectMultiple: =false
                                          Width: =Parent.Width
                              - btnPostComment:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: =If(gblLanguage = "Arabic", "إضافة تعليق", "Post comment")
                                    BasePaletteColor: =fxThemeColor("Primary")
                                    DisplayMode: |-
                                      =If(
                                          Or(
                                              cmpComments.RecordID = 0,
                                              IsBlank(Trim(Coalesce(varCommentDraft, "")))
                                          ),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Icon: ="Send"
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    OnSelect: |-
                                      =If(
                                          cmpComments.RecordID = 0,
                                          Notify(If(gblLanguage = "Arabic", "اختر سجلًا أولاً", "Select a record first"), NotificationType.Warning),
                                          If(
                                              IsBlank(Trim(Coalesce(varCommentDraft, ""))),
                                              Notify(If(gblLanguage = "Arabic", "اكتب تعليقًا أولاً", "Please enter a comment first"), NotificationType.Warning),
                                              Set(
                                                  varCommentSaved,
                                                  Patch(
                                                      Comments,
                                                      Defaults(Comments),
                                                      {
                                                          Title: If(IsBlank(cmpComments.RecordNumber), "Comment", "Comment - " & cmpComments.RecordNumber),
                                                          Module: {Value: cmpComments.ModuleName},
                                                          Comment: Trim(varCommentDraft),
                                                          RecordType: cmpComments.RecordType,
                                                          RecordID: cmpComments.RecordID,
                                                          RecordNumber: cmpComments.RecordNumber,
                                                          CommentType: "Comment",
                                                          CommentedByID: gblUser.ID,
                                                          CommentedByName: gblUser.FullName,
                                                          CommentDate: Now(),
                                                          MentionedUserIDs: Concat(colCommentMentions, Text(UserID), ";"),
                                                          MentionedUserNames: Concat(colCommentMentions, UserName, ";"),
                                                          MentionCount: CountRows(colCommentMentions),
                                                          ParentCommentID: Blank(),
                                                          IsInternal: false,
                                                          IsDeleted: false,
                                                          ReplyCount: 0
                                                      }
                                                  )
                                              );
                                              If(
                                                  And(
                                                      Not(IsBlank(varCommentSaved.ID)),
                                                      Or(
                                                          cmpComments.RecordType = "PurchaseRequest",
                                                          cmpComments.RecordType = "PurchaseOrder",
                                                          cmpComments.RecordType = "GRN"
                                                      )
                                                  ),
                                                  fnWriteLog(
                                                      Switch(
                                                          cmpComments.RecordType,
                                                          "PurchaseRequest", "Purchase Request",
                                                          "PurchaseOrder", "Purchase Order",
                                                          "GRN", "GRN"
                                                      ),
                                                      cmpComments.RecordID,
                                                      Coalesce(cmpComments.RecordNumber, ""),
                                                      "Commented",
                                                      "Info",
                                                      0,
                                                      "",
                                                      Blank(),
                                                      "",
                                                      "",
                                                      "",
                                                      "",
                                                      "Comment added",
                                                      "",
                                                      0
                                                  )
                                              );
                                              ForAll(
                                                  Filter(colCommentMentions, UserID <> gblUser.ID) As mention,
                                                  Patch(
                                                      Notifications,
                                                      Defaults(Notifications),
                                                      {
                                                          Title: "You were mentioned in " & Coalesce(cmpComments.RecordNumber, cmpComments.RecordType),
                                                          Message: gblUser.FullName & " mentioned you in " & cmpComments.RecordType & " " & Coalesce(cmpComments.RecordNumber, ""),
                                                          IsRead: false,
                                                          Createddate: Now(),
                                                          RecipientID: mention.UserID,
                                                          Recipient: {Id: mention.UserID, Value: mention.UserName},
                                                          RecipientNo: mention.EmployeeNumber,
                                                          RelatedEntity: {Value: cmpComments.RelatedEntity},
                                                          RelatedItemID: cmpComments.RecordID,
                                                          RecordType: cmpComments.RecordType,
                                                          Module: {Value: cmpComments.ModuleName},
                                                          Status: {Value: "Unread"},
                                                          Duration: 0,
                                                          ReadDate: Blank()
                                                      }
                                                  )
                                              );
                                              ClearCollect(
                                                  colCommentAudience,
                                                  Filter(cmpComments.Involved, UserID > 0)
                                              );
                                              RemoveIf(
                                                  colCommentAudience,
                                                  Or(
                                                      UserID = Coalesce(gblUser.ID, 0),
                                                      UserID in colCommentMentions.UserID
                                                  )
                                              );
                                              ForAll(
                                                  ForAll(
                                                      Distinct(colCommentAudience, UserID),
                                                      LookUp(colCommentAudience, UserID = Value)
                                                  ) As person,
                                                  Patch(
                                                      Notifications,
                                                      Defaults(Notifications),
                                                      {
                                                          Title: "New comment on " & Coalesce(cmpComments.RecordNumber, cmpComments.RecordType),
                                                          Message: gblUser.FullName & " commented on " & cmpComments.RecordType & " " & Coalesce(cmpComments.RecordNumber, ""),
                                                          IsRead: false,
                                                          Createddate: Now(),
                                                          RecipientID: person.UserID,
                                                          Recipient: {Id: person.UserID, Value: person.UserName},
                                                          RecipientNo: LookUp(cmpComments.People, ID = person.UserID).EmployeeNumber,
                                                          RelatedEntity: {Value: cmpComments.RelatedEntity},
                                                          RelatedItemID: cmpComments.RecordID,
                                                          RecordType: cmpComments.RecordType,
                                                          Module: {Value: cmpComments.ModuleName},
                                                          Status: {Value: "Unread"},
                                                          Duration: 0,
                                                          ReadDate: Blank()
                                                      }
                                                  )
                                              );
                                              Reset(txtComment);
                                              Clear(colCommentMentions);
                                              Set(varCommentDraft, "");
                                              Set(varShowMentionPicker, false);
                                              Refresh(Comments);
                                              ClearCollect(
                                                  colDiscussion,
                                                  Filter(
                                                      Comments,
                                                      RecordID = cmpComments.RecordID,
                                                      RecordType = cmpComments.RecordType,
                                                      IsDeleted = false
                                                  )
                                              );
                                              Set(varDiscussionRecord, cmpComments.RecordID);
                                              Set(varDiscussionRecordType, cmpComments.RecordType);
                                              Set(varDiscussionReload, false);
                                              Notify(If(gblLanguage = "Arabic", "تمت إضافة التعليق", "Comment added successfully"), NotificationType.Success)
                                          )
                                      )
                                    Text: =If(gblLanguage = "Arabic", "إضافة تعليق", "Post Comment")
                                    Width: =If(Parent.Width < 360, 124, 148)
            - lblCommentsEmpty:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =fxThemeColor("TextMuted")
                  Font: =gblTheme.Typography.FontFamily
                  Height: =64
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Size: =gblTheme.Typography.Body
                  Text: |-
                    =If(
                        Or(
                            varDiscussionRecord <> cmpComments.RecordID,
                            Coalesce(varDiscussionRecordType, "") <> Coalesce(cmpComments.RecordType, "")
                        ),
                        If(gblLanguage = "Arabic", "جارٍ تحميل التعليقات", "Loading comments"),
                        If(gblLanguage = "Arabic", "لا توجد تعليقات بعد", "No comments yet")
                    )
                  Visible: |-
                    =CountRows(
                        Filter(
                            colDiscussion,
                            And(
                                varDiscussionRecord = cmpComments.RecordID,
                                Coalesce(varDiscussionRecordType, "") = Coalesce(cmpComments.RecordType, "")
                            ),
                            CommentType = "Comment",
                            Or(IsBlank(ParentCommentID), ParentCommentID = 0)
                        )
                    ) = 0
                  Width: =Parent.Width
            - galComments:
                Control: Gallery@2.15.0
                Variant: VariableHeight
                Properties:
                  AccessibleLabel: =If(gblLanguage = "Arabic", "التعليقات", "Comments")
                  BorderStyle: =BorderStyle.None
                  Fill: =fxThemeColor("Transparent")
                  Items: |-
                    =SortByColumns(
                        Filter(
                            colDiscussion,
                            And(
                                varDiscussionRecord = cmpComments.RecordID,
                                Coalesce(varDiscussionRecordType, "") = Coalesce(cmpComments.RecordType, "")
                            ),
                            CommentType = "Comment",
                            Or(IsBlank(ParentCommentID), ParentCommentID = 0)
                        ),
                        "CommentDate",
                        SortOrder.Descending
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  TemplatePadding: =6
                  TemplateSize: =160
                  Width: =Parent.Width
                Children:
                  - conCommentCard:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =fxThemeColor("Transparent")
                        Height: |-
                          =With(
                              {
                                  bodyLines: Max(1, CountRows(Split(Coalesce(ThisItem.Comment, ""), Char(10)))),
                                  replyRows: CountRows(Filter(colDiscussion, ParentCommentID = ThisItem.ID))
                              },
                              bodyLines * 28 + 96 + If(
                                  varReplyToCommentID = ThisItem.ID,
                                  16 + Max(
                                      48,
                                      22 * Max(1, CountRows(Split(Coalesce(varReplyDraft, ""), Char(10))))
                                  ) + If(CountRows(colReplyMentions) > 0, 36, 0) + 44,
                                  0
                              ) + If(replyRows > 0, replyRows * 104 + 12, 0)
                          )
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        Width: =Parent.TemplateWidth
                      Children:
                        - conComment:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =fxThemeColor("Transparent")
                              FillPortions: =0
                              Height: =Max(1, CountRows(Split(Coalesce(ThisItem.Comment, ""), Char(10)))) * 28 + 88
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =4
                              PaddingLeft: =4
                              PaddingRight: =4
                              PaddingTop: =4
                              Width: =Parent.Width
                            Children:
                              - conCommentAvatar:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    Width: =40
                                  Children:
                                    - shpCommentAvatar:
                                        Control: Circle@2.3.0
                                        Properties:
                                          Fill: =fxThemeColor("PrimaryLighter")
                                          Height: =40
                                          Width: =40
                                    - lblCommentAvatar:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          Align: =Align.Center
                                          Color: =fxThemeColor("Primary")
                                          Font: =gblTheme.Typography.FontFamily
